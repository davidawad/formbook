[package]
name = "fb"
version = "0.2.0"
edition = "2021"
description = "Formbook tooling: check gates, manifest, tracker, READMEs"
publish = false

[[bin]]
name = "fb"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
quick-xml = "0.37"
serde_yaml = "0.9"
unicode-normalization = "0.1"
