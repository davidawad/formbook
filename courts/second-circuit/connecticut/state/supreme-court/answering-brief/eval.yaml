# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails. LaTeX is gated (1083/1083 lines). Word is gated: its pages and line
# breaks match typst's, and since fb-595.54.11.2 its table of authorities gives a keyed authority that crosses a page
# end the page of its first word, as typst and LaTeX do (fb-595.54.83).
params:
  cross_engine: gate
  cross_engine_docx: gate
