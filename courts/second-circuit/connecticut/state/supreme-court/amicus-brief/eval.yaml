# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails. LaTeX is gated (472/472 lines). Word is reported, not gated: its
# pages and line breaks match typst's (pages and page ends equal, 471/472 lines), but the table of authorities lists
# Sportsmen's Boating Corp. v. Hensley on page 10 where typst and LaTeX list 9 (p3 line 24): the citation starts on
# the last line of page 9 and ends on page 10, and the shared docx page lookup (tools/fb/src/docxpages.rs) counts a
# keyed authority where its link text ends, typst and LaTeX after the link's first word. A shared-model item.
params:
  cross_engine: gate
  cross_engine_docx: report
