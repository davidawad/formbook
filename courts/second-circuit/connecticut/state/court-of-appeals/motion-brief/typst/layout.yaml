# Connecticut Appellate Court (connappct): motion or opposition (Practice Book Sec. 66-2, 66-3), e-filed. The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to ../../rules.md (CONNAPPCT-*); lengths in points. No case text
# here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # CONNAPPCT-MOT-001: 12 point serif, footnotes included
pitch:
  body: 20.7              # CONNAPPCT-MOT-001: 1.5 lines (Word's 1.5 x 1.15 x 12 pt), uniform: body, notes, quotations
  single: 13.8            # caption, signature and certification address lines (not text of the motion)
margin: {top: 108, bottom: 108, left: 108, right: 108}   # CONNAPPCT-MOT-001: 1 1/2 inches on all sides
indent: 36                # first-line indent (style choice)
# CONNAPPCT-MOT-002: one pagination scheme from the first page, centered at the foot, "Page X of XX"
page_number: {align: center, from: 1, text: "Page {page} of {pages}"}
footnote: {size: 12, pitch: 20.7, gap: 7}             # CONNAPPCT-MOT-001: 12 point, the body's 1.5 lines
quote: {left: 36, right: 36, above: 6.9, below: 13.8, pitch: 20.7}   # CONNAPPCT-MOT-001: quotations at 1.5 lines
# CONNAPPCT-MOT-001: section captions at 14 point (1.5 lines of 14 pt), bold or italic, never underlined;
# CONNAPPCT-MOT-003: the filer captions and numbers the history, facts and grounds. Level 1 centered bold, 2 bold,
# 3 bold italic.
heading:
  - {align: center, bold: true, size: 14, pitch: 24.15, above: 20.7, below: 6.9}
  - {bold: true, size: 14, pitch: 24.15, above: 13.8, below: 6.9}
  - {bold: true, italic: true, size: 14, pitch: 24.15, above: 13.8, below: 6.9}
# CONNAPPCT-MOT-006: no cover page is prescribed; by convention page 1 opens with the court, the docket number, the
# case name, the title, the date and any counsel, then the motion.
front:
  - {text: "{court}", align: center, bold: true}
  - {text: "{docket}", align: center, optional: true, above: 16.6}
  - {text: "{case_title}", align: center, above: 20.7}
  - {text: "{title}", align: center, bold: true, above: 20.7}
  - {text: "{date}", align: center, optional: true, above: 13.8}
  - {text: "{counsel}", above: 30.4}
  - when: argued_by
    blocks:
      - {text: "To Be Argued By:", bold: true, above: 24.8}
      - {text: "{argued_by}", above: 4.8}
  - {text: "", above: 6.9}
# The signature of counsel; CONNAPPCT-MOT-005 (Sec. 66-3): then each certification the sample gives, signed by
# counsel.
closing:
  - group:
      - {text: "{closing|Respectfully submitted,}", optional: true}
      - {text: "{signature.party}", above: 13.8}
      - {text: "By: ______________________________", above: 24.8}
      - {text: "{signature.signer}"}
      - {text: "{signature.lines}"}
    above: 20.7
  - each: certificates
    blocks:
      - {text: "{heading}", align: center, bold: true, size: 14, pitch: 24.15, keep: true, above: 27.6}
      - {markdown: "{text}", pitch: body, gap: 6.9, above: 6.9}
      - group:
          - {text: "{lines}", optional: true}
          - when: signer
            blocks:
              - {text: "By: ______________________________", above: 24.8}
              - {text: "{signer}"}
        above: 13.8
