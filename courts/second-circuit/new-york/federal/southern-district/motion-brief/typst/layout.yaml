# U.S. District Court for the Southern District of New York (nysd): a memorandum of law in support of a motion, on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with the S.D.N.Y. rules overlaid here. The shared
# document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines
# gen`). Rules: Joint Local Civil Rules of the S.D.N.Y. and E.D.N.Y. (January 2, 2026), https://www.nysd.uscourts.gov/
# rules (../README.md quotes them, requirement IDs NYSD-...). The base already meets Local Civ. R. 7.1(b): 12-point
# type, footnotes included (7.1(b)(1), NYSD-FORM-001), one-inch margins (7.1(b)(2), NYSD-FORM-004), the body
# double spaced, headings, footnotes and block quotations single (7.1(b)(3), NYSD-FORM-003).
base: /lib/layouts/frcp-motion-brief.yaml
constants:
  district: "SOUTHERN DISTRICT OF NEW YORK"
# Local Civ. R. 7.1(c) (NYSD-LEN-001): a memorandum in support of a motion at most 8,750 words, the caption, tables,
# signature block and certificates excluded, footnotes included: the filer's certified count (`word_count`), over the
# limit the render stops in every engine.
words: {limit: 8750, given: word_count}
# Pages numbered at the foot, centered: the cover unnumbered, the tables i, ii, the body from 1.
page_number: {align: center, front: lower-roman}
# Footnotes at the text size, single spaced, 7 pt apart; Word sets the rule 7.5 pt under the text with the 7 pt gap.
footnote: {size: 12, gap: 7, clearance: 7.5}
# Block quotations single spaced (NYSD-FORM-003), half an inch in on each side, a single line above and below.
quote: {left: 36, right: 36, above: 13.8, below: 13.8}
# Local Civ. R. 7.1(a)(2) (NYSD-CONT-001): divided under appropriate headings. Single spaced (7.1(b)(3)), bold, a single
# line above and below: a section centered in capitals, unnumbered; the argument headings numbered by the template,
# "I." at the margin, "A.", "1." and "a." half an inch further in each, each label in a half-inch box with the title's
# later lines hung under it.
heading:
  - {align: center, bold: true, upper: true, above: 13.8, below: 13.8}
  - {bold: true, number: "I.", label_box: 36, above: 13.8, below: 13.8}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 13.8, below: 13.8}
  - {bold: true, number: "1.", label_box: 36, left: 72, above: 13.8, below: 13.8}
  - {bold: true, number: "a.", label_box: 36, left: 108, above: 13.8, below: 13.8}
# FRCP 10(a), 11(a): the cover (unnumbered): the counsel block at the upper left; a double line below it the court's
# name in bold at the margin (exemplars 1 and 2, two of the three filers); a double line below that the caption in two
# halves: at the left the parties, ruled above, at their right and below (exemplars 2 and 3; each party's names, its
# designation 1.8 inches in, "v." centered between them a blank line from each); at the right, two tenths of an inch
# off the rule, the legends ("In Admiralty"), the file number, the judge when given, and the paper's title in bold
# capitals, a blank line between the groups.
cover:
  - {text: "{counsel}"}
  - {text: "{xd.court}", bold: true, above: 24}
  - {text: "{xd.district}", bold: true}
  - columns:
      - width: 234
        blocks:
          - box:
              - each: caption
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", left: 129.6}
                between:
                  - {text: "v.", align: center, above: 13.8, below: 13.8}
            stroke: {top: 0.75, right: 0.75, bottom: 0.75}
            inset: {top: 12, right: 14.4, bottom: 12}
      - blocks:
          - {text: "{legends}", optional: true, left: 14.4, above: 12}
          - {text: "{file-label|No.} {case_number}", left: 14.4, above: 13.8}
          - {text: "{judge}", optional: true, left: 14.4}
          - {text: "{title}", bold: true, upper: true, left: 14.4, above: 13.8}
    gutter: 0
    above: 24
front: []
# Local Civ. R. 7.1(c) (NYSD-TOC-001) excludes a table of contents and of authorities from the word count; the rules
# do not require them, the exemplar has both. The contents: a row per heading to level 4, single spaced, 6 pt apart, a
# level half an inch further in, the title wrapping before a half-inch page column, a dot leader to the page.
contents: {title: "TABLE OF CONTENTS", depth: 4, col: 36, step: 36, above: 6}
# The table of authorities, from the `toa:` links of the body and notes, in the exemplar's groups, each name (a case
# name in italics, as the sample writes it), a comma and the citation, its later lines hung a quarter inch and a tenth,
# "passim" for seven pages or more.
authorities:
  title: "TABLE OF AUTHORITIES"
  page_heading: "Page(s)"
  passim: 7
  kinds:
    - {kind: case, title: "Cases"}
    - {kind: statute, title: "Statutes"}
    - {kind: rule, title: "Rules"}
    - {kind: regulation, title: "Regulations"}
    - {kind: other, title: "Other Authorities"}
  col: 36
  hang: 25.2
  above: 6
  group: {bold: true, above: 13.8}
# FRCP 11(a): a double line below the body the place and date at the left; in a column at the right "Respectfully
# submitted,", a double line below it the firm in bold, a single line below that "s/" and the signer, the signer's name
# and lines. Kept whole with the last paragraph.
closing:
  - columns:
      - width: 237.6
        blocks:
          - {text: "Dated: {place|New York, New York}"}
          - {text: "{date}"}
      - blocks:
          - {text: "Respectfully submitted,"}
          - {text: "{signature.firm}", bold: true, above: 24}
          - {text: "s/ {signature.signer}", above: 13.8}
          - {text: "{signature.signer}"}
          - {text: "{signature.lines}"}
    gutter: 0
    above: 24
# Local Civ. R. 7.1(c) (NYSD-LEN-002): the certificate of compliance, on its own page: the number of words (the filer's
# count, checked against the limit above) and the form of Local Civ. R. 7.1(b) as this layout sets it; dated and signed.
after_tail:
  - {break: true}
  - {text: "CERTIFICATE OF COMPLIANCE", align: center, bold: true, pitch: body}
  - {text: "1. This memorandum complies with the word-count limit of Local Civil Rule 7.1(c) because it contains {xd.words} words, excluding the caption, table of contents, table of authorities, signature block and this certificate, as counted by the word-processing program used to prepare it.", pitch: body, indent: 36}
  - {text: "2. This memorandum complies with the formatting requirements of Local Civil Rule 7.1(b) because it is printed in Times New Roman, 12-point type, with one-inch margins on all sides, and is double-spaced except for headings, footnotes and block quotations.", pitch: body, indent: 36}
  - columns:
      - width: 237.6
        blocks:
          - {text: "Dated: {place|New York, New York}"}
          - {text: "{date}"}
      - blocks:
          - {text: "Respectfully submitted,"}
          - {text: "s/ {signature.signer}", above: 24}
    gutter: 0
    above: 24
