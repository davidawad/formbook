  text: 'B. Redactions and Filing Under Seal. Sealing/Redactions Not Requiring Court Approval. The parties are referred to Federal Rule of Civil Procedure 5.2, the E-Government Act of 2002, and the Southern District''s ECF Privacy Policy ("Privacy Policy") and reminded not to include, unless necessary, the five categories of "sensitive information" in their submissions (i.e., social security numbers [use the last four digits only], names of minor children [use the initials only], dates of birth [use the year only], financial account numbers [use the last four digits only], and home addresses [use only the City and State]). Parties may redact the five categories of "sensitive information" and the six categories of information requiring caution (i.e., personal identifying number, medical records (including information regarding treatment and diagnosis), employment history, individual financial information, proprietary or trade secret information, and information regarding an individual''s cooperation with the government), as described in the Privacy Policy, without Court approval. Sealing/Redaction Requiring Court Approval. Except for those permitted by Paragraph 4.B.1, all sealing and redactions require Court approval. To be approved, redactions must be narrowly tailored to serve whatever purpose justifies them and otherwise consistent with the presumption in favor of public access to judicial documents. See, e.g., Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-20 (2d Cir. 2006). In general, the parties'' consent or the fact that information is subject to a confidentiality agreement between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. Motors LLC Ignition Switch Litig., No. 14-MD-2543 (JMF), 2015 WL 4750774, at *4 (S.D.N.Y. Procedures for Filing Sealed or Redacted Documents. Motions or Letter Motions for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court''s ECF system in conformity with the court''s standing order, 19-MC-00583, and ECF Rules & Instructions, section 6. Any party seeking to file a document under seal or in redacted form shall proceed as follows: The motion must be filed in public view, must explain the particular reasons for seeking to file that information under seal and should not include confidential information sought to be filed under seal. Supporting papers must be separately filed electronically and may be filed under seal or redacted only to the extent necessary to safeguard information sought to be filed under seal. The proposed sealed document must be contemporaneously filed under seal in the ECF system and electronically related to the motion. The summary docket text, but not the sealed document, will be open to public inspection and should not include confidential information sought to be filed under seal. Where the motion seeks approval to redact information from a document that is to be publicly filed, the filing party shall: (a) publicly file the document with the proposed redactions, and (b) electronically file under seal a copy of the unredacted document with the proposed redactions highlighted. Both documents must be electronically filed through the ECF system and related to the motion. Any party unable to comply with the requirement for electronic filing under seal through the ECF system, or who has reason to believe that a particular document should not be electronically filed, shall file a letter-motion seeking leave of the Court to file in a different manner. If the party is unable to file such a letter-motion on ECF, or believes there is good cause not to file such a letter-motion on ECF, the party may submit it by email (at EngelmayerNYSDChambers@nysd.uscourts.gov) as a text-searchable PDF attachment with a copy simultaneously delivered to all counsel. Any such email shall state clearly in the subject line: (1) the caption of the case, including the lead party names and docket number; and (2) a brief description of the contents of the letter.'
