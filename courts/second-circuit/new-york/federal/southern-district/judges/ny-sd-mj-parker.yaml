  text: Any party wishing to file in redacted form any pleading, motion, memorandum, exhibit, or other document, or any portion thereof, based on a party's designation of information as Confidential, must make a specific request to the Court by letter motion explaining the reasons for seeking to file that submission under seal and addressing the request in light of the Court of Appeals' opinions in Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110 (2d Cir. 2006) and Bernstein v. Bernstein Litowitz Berger & Grossman LLP, 814 F.3d 132 (2d Cir. 2016). [...] The proposed sealed document must be contemporaneously filed under seal in the ECF system and electronically related to the motion.
