  text: 'Redactions and Sealed Filings. Redactions Not Requiring Court Approval. The parties are referred to Rule 5.2 of the Federal Rules of Civil Procedure and the Southern District''s ECF Privacy Policy ("Privacy Policy"). There are two categories of information that may be redacted from public court filings without prior permission from the Court: "sensitive information" and information requiring "caution. Parties should not include in their public filings, unless necessary, the five categories of "sensitive information" (i.e., social security numbers [use the last four digits only], names of minor children [use the initials only], dates of birth [use the year only], financial account numbers [use the last four digits only], and home addresses [use only the City and State]). Parties may also, without prior Court approval, redact from their public filings the six categories of information requiring caution described in the Privacy Policy (i.e., any personal identifying number, medical records [including information regarding treatment and diagnosis], employment history, individual financial information, proprietary or trade secret information, and information regarding an individual''s cooperation with the government). Redactions and Sealed Filings Requiring Court Approval. Except for redactions permitted by the previous Paragraph, all redactions or sealing of public court filings require Court approval. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing and must be otherwise consistent with the presumption in favor of public access to judicial documents. See, e.g., Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-20 (2d Cir. 2006). In general, neither the parties'' consent nor the fact that information is subject to a confidentiality agreement between litigants is, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. Motors LLC Ignition Switch Litig., No. 14-MD-2543 (JMF), 2015 WL 4750774, at *4 (S.D.N.Y. Procedures for Filing Sealed or Redacted Documents. Any party seeking to file a document under seal or in redacted form shall proceed as follows: The party should meet and confer with any opposing party (or any third party seeking confidential treatment of the information) in advance to narrow the scope of the request. When a party seeks leave to file a document under seal or in redacted form on the ground that an opposing party or third party has requested it, the filing party shall notify the opposing party or third party that it must file, within three business days, a letter explaining the need to seal or redact the document. The party shall file a letter-motion seeking leave to file a document under seal on ECF in accordance with Standing Order 19-MC-583 and Section 6 of the S.D.N.Y. Electronic Case Filing Rules and Instructions. The letter motion itself shall be filed in public view, should explain the reasons for seeking to file the document under seal, and should not include confidential information. The proposed sealed document shall be contemporaneously filed under seal on ECF (with the appropriate level of restriction) and electronically related to the motion (or to the relevant Court order if the Court previously granted leave to file the document under seal). Note that the summary docket text, but not the document itself, will be open to public inspection and, thus, should not include confidential information sought to be filed under seal. Where a party seeks leave to file a document in redacted form, the party shall file a letter-motion seeking leave to file a document in redacted form on ECF in accordance with Standing Order 19-MC-583 and Section 6 of the S.D.N.Y. The letter-motion itself shall be filed in public view, should explain the reasons for seeking to file the document in redacted form, and should not include confidential information. At the same time, the party shall (1) publicly file on ECF and electronically relate to the letter-motion a copy of the document that implements the proposed redactions; and (2) file under seal on ECF (with the appropriate level of restriction) and electronically relate to the motion an unredacted copy of the document with the proposed redactions highlighted. Any party unable to comply with the requirements for electronic filing under seal through the ECF system, or who believes that a particular document should not be electronically filed at all, shall file a letter-motion seeking leave of the Court to file in a different manner. If the party is unable to file such a letter-motion on ECF, or believes there is good cause not to file such a letter-motion on ECF, the party may submit it by email (at Furman_NYSDChambers@nysd.uscourts.gov) as a text-searchable .pdf attachment with a copy simultaneously delivered to all counsel. Any such email shall state clearly in the subject line: (1) the caption of the case, including the lead party names and docket number; and (2) a brief description of the contents of the letter. Parties may not include substantive communications in the body of the email; such communications may be included only in the body of the letter.'
