  text: 'B. Redactions and Filing Under Seal. i. Redactions Not Requiring Court Approval. [...] Parties should not include in their public filings, unless necessary, the five categories of “sensitive information” (i.e., social security numbers [use the last four digits only], names of minor children [use the initials only], dates of birth [use the year only], financial account numbers [use the last four digits only], and home addresses [use only the City and State]). Parties may also, without prior Court approval, redact from their public filings the six categories of information requiring caution described in the Privacy Policy (i.e., any personal identifying number, medical records [including information regarding treatment and diagnosis], employment history, individual financial information, proprietary or trade secret information, and information regarding an individual’s cooperation with the government). ii. Redactions and Sealed Filings Requiring Court Approval. Except for redactions permitted by the previous Paragraph, all redactions or sealing of public court filings require Court approval. [...] See, e.g., Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119–20 (2d Cir. 2006). In general, the parties’ consent or the fact that information is subject to a confidentiality agreement between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. [...] Procedures for Filing Sealed or Redacted Documents. Any party seeking to file a document under seal or in redacted form shall proceed as follows: Meet and Confer. The party seeking leave to file sealed or redacted materials should meet and confer with any opposing party (or any third party seeking confidential treatment of the information) in advance to narrow the scope of the request. When a party seeks leave to file a document under seal or in redacted form on the ground that an opposing party or third party has requested it, the filing pa'
