  text: 'ions and Sealed Filings Requiring Court Approval. Except for redactions permitted by the previous Paragraph, all redactions or sealing of public court filings require Court approval. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing, and must be otherwise consistent with the presumption in favor of public access to judicial documents. See, e.g., Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-20 (2d Cir. 2006). In general, the parties’ consent or the fact that information is subject to a confidentiality agreement between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. Motors LLC Ignition Switch Litig., No. 14-MD-2543, 2015 WL 4750774, at *4 (S.D.N.Y. Procedures for Filing Sealed or Redacted Documents. Any party seeking to file a document under seal or in redacted form shall proceed as follows: a. Meet and Confer. The party seeking leave to file sealed or redacted materials should meet and confer with any opposing party (or any third party seeking confidential treatment of the information) in advance to narrow the scope of the request. When a party seeks leave to file a document under seal or in redacted form on the ground that an opposing party or third party has requested it, the filing party shall notify the opposing party or third party that it must file, within three (3) days, a letter explaining the need to seal or redact the document. b. Sealed Document(s). The party shall electronically file a letter-motion seeking leave to file a document under seal on ECF in accordance with Standing Order 19-MC-583 and Section 6 of the S.D.N.Y. Electronic Case Filing Rules and Instructions. The letter-motion itself shall be filed in public view, should explain the reasons for seeking to file the document under seal, including why the request to seal is consistent with the test set forth in Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110 (2d Cir. 2006), and should not include confidential information. The proposed sealed document shall be separately and contemporaneously filed under seal on ECF (with the appropriate level of restriction) and electronically related to the motion (or to the relevant Court order if the Court previously granted leave to file the document under seal). Note that the summary docket text, but not the document itself, will be open to public inspection and, thus, the summary docket text should not include confidential information sought to be filed under seal. [...] Where a party seeks leave to file a document in redacted form, the party shall electronically file a letter-motion seeking leave to file a document in redacted form on ECF in accordance with Standing Order 19-MC-583 and Section 6 of the S.D.N.Y. The letter-motion itself shall be filed in p'
