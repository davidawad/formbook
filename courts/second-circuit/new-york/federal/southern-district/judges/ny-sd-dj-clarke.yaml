  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/JGLC%20Clarke%20%20Individual%20Rules%20and%20Practices%20in%20Civil%20Cases%201.9.26%20FINAL.pdf#page=8
  text: 'Redactions and Filing Under Seal. The parties are referred to Federal Rule of Civil Procedure 5.2 and the S.D.N.Y. ECF Privacy Policy (“Privacy Policy”). The parties should not include, unless necessary, the five categories of “sensitive information” in their submissions (i.e., social security numbers, names of minor children [use the initials only], dates of birth [use the year only], financial account numbers and home addresses [use only the City and State]). b. Redactions Not Requiring Court Approval. Without Court approval, parties may redact the five categories of “sensitive information” and the six categories of information requiring caution (i.e., personal identifying number, medical records, treatment and diagnosis, employment history, individual financial information, proprietary or trade secret information and information regarding an individual’s cooperation with the government), as described in the Privacy Policy. c. Redactions and Sealed Filings Requiring Court Approval. Except for redactions permitted by the eleven categories of information identified in the Privacy Policy, all redactions or sealing of public court filings require Court approval. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing and must otherwise be consistent with the presumption in favor of public access to judicial documents. d. Procedure for Filing Documents with Redactions. Any party seeking to file a document with partial redactions must follow the following three steps: i. Meet and Confer. The party seeking leave to file redacted materials should meet and confer with any opposing party (or any third party seeking confidential treatment of the information) in advance to narrow the scope of the request. When a party seeks leave to file a document in redacted form on the ground that an opposing party or third party has requested it, the filing party shall notify the opposing party or third party that it must file on ECF, within three business days of the filing party’s letter-motion seeking leave to file in redacted form, a letter explaining the need to redact the document. ii. Filing a Letter-Motion Seeking Leave to File with Redactions. If the party is seeking leave of the Court to redact the document (i.e., if the redactions are not among the categories of redactions that can be made without Court approval), the party should simultaneously file on ECF a letter-motion seeking leave to file the document with those redactions in accordance with Standing Order 19-MC-583 and Section 6 of the S.D.N.Y. Electronic Case Filing Rules and Instructions. The letter-motion itself shall be filed in public view and should not include confidential information. The letter-motion must explain the purpose of the redactions, and why the redactions are consistent with the standards set forth in Section 5(c) above. ECF Filing of Redacted Document(s).'
