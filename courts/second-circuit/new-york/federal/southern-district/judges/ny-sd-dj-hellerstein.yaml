  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/AKH%20Hellerstein%20RULES%20-%20Oct23-2025.pdf#page=3
  text: Court records and docket sheets are to be accessible to the public, and enjoy a presumption of openness to public inspection. The presumption is rebuttable upon demonstration that “closure is essential to preserve higher values and is narrowly tailored to serve that interest. [...] Times Co., 828 F.2d 110, 116 (2d Cir.1987)). No protective order shall be submitted that provides for sealing of documents or other information in connection with a submission to the Court, except following a motion supported by competent evidence showing that sealing is essential to preserve higher values and is narrowly tailored to serve that interest. All protective orders shall comply with this entire Rule 4, and are subject to ongoing review and reexamination by the Court.
