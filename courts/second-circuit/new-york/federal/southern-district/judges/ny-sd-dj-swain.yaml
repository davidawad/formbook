  text: 'Under Seal in Civil and Miscellaneous Matters. i. Sealing/Redactions Not Requiring Court Approval. Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. Such sensitive information includes: Social Security numbers; names of minor children; dates of birth; and financial account numbers. [...] Sensitive information and information requiring caution must not be included in any document filed publicly on ECF unless such inclusion is necessary and relevant to the case. If such information must be included, personal identifiers must be partially redacted in accordance with the above-cited rules and policies in order to protect any privacy interest. ii. Sealing/Redaction Requiring Court Approval. Motions or letter-motions by represented parties for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court’s ECF system in conformity with the Court’s Standing Order, 19-mc-00583 (S.D.N.Y. 19, 2019), and ECF Rules & Instructions, section'
