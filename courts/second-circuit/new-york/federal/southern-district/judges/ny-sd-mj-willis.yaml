  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/JW%20Willis%20Individual%20Practices%20for%20Civil%20Cases%20%283-6-26%29.pdf#page=3
  text: y party unable to comply with the requirement for electronic filing under seal through the ECF system, or who has reason to believe that a particular document should not be electronically filed, must move for leave of the Court to file on paper. The pendency of the application to seal does not affect any deadlines that may govern the proposed filing. The parties shall comply with such deadlines by filing the redacted version on ECF, serving the unredacted papers at issue on any opposing parties, and providing courtesy copies of the unredacted version to Chambers. If the Court approves the filing under seal, no further submissions shall be required. If the Court denies, in part, the motion for filing under seal, the party who made the submission shall be required to refile the document with modified redactions as directed by the Court.
