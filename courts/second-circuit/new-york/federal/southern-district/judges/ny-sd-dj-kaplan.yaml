  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/LAK%20Kaplan%20Individual%20practices%20_%204.18.2020.pdf#page=4
  text: 'FILINGS UNDER SEAL IN CIVIL AND MISCELLANEOUS CASES 1. Sealing/Redactions Not Requiring Court Approval. Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. Such sensitive information includes: Social Security numbers; names of minor children; dates of birth; and financial account numbers. Other information that should be treated with caution and may warrant a motion for approval of sealed or redacted filing includes: personal identifying numbers (PIN numbers); medical records, treatment and diagnosis; employment history; individual financial information; proprietary or trade secret information; home addresses; and information regarding an individual’s cooperation with the government. Sensitive information and information requiring caution must not be included in any document filed with the Court unless such inclusion is necessary and relevant to the case. If such information must be included, personal identifiers must be partially redacted in accordance with the above-cited rules and policies in order to protect any privacy interest.'
