  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/PMH%20Halpern%20Rules%20Rev%2001.06.2025.pdf#page=10
  text: 'Electronic Filing Under Seal A. Sealing/Redactions Not Requiring Court Approval. Fed. R. Civ. P. 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. Such sensitive information includes: Social Security numbers; names of minor children; dates of birth; and financial account numbers. Other information that should be treated with caution and may warrant a motion for approval of sealed or redacted filing includes: personal identifying numbers (“PINs”); medical records, treatment and diagnosis; employment history; individual financial information; proprietary or trade secret information; home addresses; and information regarding an individual’s cooperation with the government. Sensitive information and information requiring caution must not be included in any document filed with the Court unless such inclusion is necessary and relevant to the case. If such information must be included, personal identifiers must be partially redacted in accordance with the above-cited rules and policies in order to protect any privacy interest. B. Sealing/Redaction Requiring Court Approval. Motions or letter-motions for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court''s ECF system in conformity with the court''s standing order, 19-mc-00583, and ECF Rules & Instructions, sections 6 and 21. The motion must be filed in public view, must explain the reasons for seeking to file that information under seal and should not include confidential information sought to be filed under seal. The proposed sealed document must be contemporaneously filed under seal in the ECF system and electronically related to the motion. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing and must be otherwise consistent with the presumption in favor of public access to judicial documents. See, e.g., Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-20 (2d Cir. 2006). In general, the parties'' consent or the fact that information is subject to a confidentiality agreement between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. Motors LLC Ignition Switch Litig., 2015 WL 4750774, at *4 (S.D.N.Y.'
