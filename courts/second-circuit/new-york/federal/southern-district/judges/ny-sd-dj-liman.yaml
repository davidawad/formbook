  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/LJL%20Liman%20Individual%20Practices%20in%20Civil%20Cases_updated%204.7.2025.pdf#page=6
  text: H. Redactions and Filing Under Seal i. Redactions/Sealing Not Requiring Court Approval. Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. ii. Redaction/Sealing Requiring Court Approval. Except for redactions permitted by Paragraph 2(H)(i), all redactions require Court approval. To be approved, redactions must be narrowly tailored to serve whatever purpose justifies them and otherwise consistent with the presumption in favor of public access to judicial documents. See, e.g., Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119–20 (2d Cir. 2006). In general, the parties’ consent or the fact that information is subject to a confidentiality agreement (or protective order) between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. Motors LLC Ignition Switch Litig., 2015 WL 4750774, at *4 (S.D.N.Y. A party seeking to file a document with redactions or under seal must follow the procedures set forth in Attachment A (see pages 16–17 of these Individual Practices).
