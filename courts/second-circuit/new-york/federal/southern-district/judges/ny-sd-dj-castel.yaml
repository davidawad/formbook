  text: 'Notwithstanding any other provision, no document may be filed with the Clerk under seal without a further Order of this Court addressing the specific documents or portions of documents to be sealed. Any application to seal shall be accompanied by an affidavit or affidavits and a memorandum of law, demonstrating that the standards for sealing have been met and specifically addressing the applicability of Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-120 (2d Cir. 2006) and any other controlling authority. Unless otherwise ordered, a party seeking to file an opposing party''s confidential information shall so advise the opposing party fourteen (14) days in advance specifying the precise portion of the information the party seeks to use, the general purpose thereof and any redactions to which the party does not object. Within seven (7) days thereafter, the party whose confidential information is sought to be used may make an application to seal... Sealing in Civil and Miscellaneous Cases: ECF Requirements B. Sealing/Redaction Requiring Court Approval.'
