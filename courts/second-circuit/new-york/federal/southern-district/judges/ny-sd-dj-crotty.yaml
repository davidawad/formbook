- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/PAC%20Crotty%20Individual%20Practices%20REVISED%201-21-20.pdf#page=7
  text: 'Motions or Letter Motions for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court''s ECF system in conformity with the court''s standing order, 19-mc-00583, and ECF Rules & Instructions, section 6. The motion must be filed in public view, must explain the reasons for seeking to file that information under seal and should not include confidential information sought to be filed under seal. Supporting papers must be separately filed electronically and may be filed under seal or redacted only to the extent necessary to safeguard information sought to be filed under seal. The proposed sealed document must be contemporaneously filed under seal in the ECF system and electronically related to the motion. The summary docket text, but not the sealed document, will be open to public inspection and should not include confidential information sought to be filed under seal. Where the motion seeks approval to redact information from a document that is to be publicly filed, the filing party shall: (a) publicly file the document with the proposed redactions, and (b) electronically file under seal a copy of the unredacted document with the proposed redactions highlighted. Both documents must be electronically filed through the ECF system and related to the motion The proposed sealed/redacted document, a copy of the motion to seal and any supporting papers must be contemporaneously submitted to the Court in paper form, by hand delivery or mail. Digital copies of these documents must also be emailed to chambers (outside the ECF system) at David_C_Gonzalez@nysd.uscourts.gov.'
