  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/VM%20INDIVIDUAL%20PRACTICES%20OF%20USDJ%20VICTOR%20MARRERO.01.07.2025.pdf#page=5
  text: H. Sealing/Redaction Requiring Court Approval. Motions or letter motions for approval of sealed or redacted filings in civil and miscellaneous cases, and the subject documents, including the proposed sealed document(s), must be filed either by hard copy or electronically through the court’s ECF system in conformity with standing order 19-mc-00583 and ECF Rules & Instructions, section 6. Hard copy letter motions for approval of sealed or redacted filings may be faxed to Chambers if no more than five pages in total and must be mailed or hand delivered to the Court if greater than five pages. The party requesting approval of a sealed or redacted filing must identify all parties and/or other case participants that the party believes should be granted access to the sealed or unredacted versions of the proposed filings.
