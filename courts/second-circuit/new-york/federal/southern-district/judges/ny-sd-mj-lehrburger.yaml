  text: A. Sealing/Redactions Not Requiring Court Approval. Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings. No Court approval is required for these redactions. B. Sealing/Redactions Requiring Court Approval. Any party wishing to file a document under seal or in redacted form shall (1) file on ECF a redacted copy of the document, (2) file on ECF a sealed copy of the document, and (3) submit to Chambers an unredacted copy by email. Standing Order M10-468, sealed documents are not accessible or viewable on ECF; accordingly, parties must separately serve opposing counsel with any sealed materials in a manner other than the ECF system. Meet and Confer Requirement. Within 5 business days of the ECF-filing of the redacted document(s), the parties must confer in good faith as to whether any or all of the redacted material may or must be filed without redaction. If the parties reach agreement that all redacted material may or must be unredacted, the parties shall file on ECF unredacted copies of the previously redacted documents and so inform the Court. A motion is required whenever one or more parties seek to maintain sealed material. If the parties cannot agree to unredact all redacted material, then, within 3 business days of the parties' meet and confer, the party seeking to preserve confidentiality must make a specific request to the Court by letter motion. If more than one party seeks to preserve confidentiality, the parties shall confer and submit a joint letter. Any party opposing the request to file under seal must submit a responding letter within 3 business days after submission of the letter by the party seeking to preserve confidentiality. What Must Be Included In Motion. Any letter motion requesting that material remain under seal must explain the reasons for seeking to file the material under seal and address the request in light of the Court of Appeals' opinions in Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110 (2d Cir. 2006) and Bernstein v. Bernstein Litowitz Berger & Grossman LLP, 814 F.3d 132 (2d Cir. 2016). Any sealing request shall include the requesting party's proposed redactions. The letter motion to seal (and any response) must be filed on ECF in public view and should not itself include confidential material for which sealing is sought. Any supporting papers or attachments that contain confidential material may be filed under seal or redacted to the extent necessary to safeguard that information. At the time the letter motion is filed it should be designated as related to the documents filed under seal in the initial filing process. If the Court directs that any previously redacted material be unredacted, the party who submitted the previously redacted document shall, within 3 business days after the Court's unredaction order, file on ECF the documents complying with the Court's order. Any party unable to comply with the requirement for electronic filing under seal through the ECF system, or who has reason to believe that a particular document should not be electronically filed, must move by letter motion for leave of Court to file non-electronically.
