  text: 'Filings Under Seal A. Electronic Filing Under Seal in Civil and Miscellaneous Cases 1. Sealing/Redactions Not Requiring Court Approval. Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. Such sensitive information includes: Social Security numbers; names of minor children; dates of birth; and financial account numbers. Other information that should be treated with caution and may warrant a motion for approval of sealed or redacted filing includes: personal identifying numbers (PIN numbers); medical records, treatment and diagnosis; employment history; individual financial information; proprietary or trade secret information; home addresses; and information regarding an individual''s cooperation with the government. Sensitive information and information requiring caution must not be included in any document filed with the Court unless such inclusion is necessary and relevant to the case. If such information must be included, personal identifiers must be partially redacted in accordance with the above-cited rules and policies in order to protect any privacy interest. Sealing/Redactions Requiring Court Approval. Motions or Letter Motions for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court''s ECF system in conformity with the court''s standing order, 19-mc-00583, and ECF Rules & Instructions, section 6. The motion must be filed in public view, must explain the particular reasons for seeking to file that information under seal and should not include confidential information sought to be filed under seal. Supporting papers must be separately filed electronically and may be filed under seal or redacted only to the extent necessary to safeguard information sought to be filed under seal. The proposed sealed document must be contemporaneously filed under seal in the ECF system and electronically related to the motion. The summary docket text, but not the sealed document, will be open to public inspection and should not include confidential information sought to be filed under seal. Where the motion seeks approval to redact information from a document that is to be publicly filed, the filing party shall: (a) publicly file the document with the proposed redactions, and (b) electronically file under seal a copy of the unredacted document with the redactions highlighted. Both documents must be electronically filed through the ECF system and related to the motion. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing and must be otherwise consistent with the presumption in favor of public access to judicial documents. See, e.g., Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-20 (2d Cir. 2006). In general, the parties'' consent or the fact that information is subject to a confidentiality agreement between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. Motors LLC Ignition Switch Litig., No. 14-MC-2543, 2015 WL 4750774, at *4 (S.D.N.Y. The party seeking leave to file sealed or redacted materials should meet and confer with any opposing parties (or third parties seeking confidential treatment of the information, if any) in advance to narrow the scope of the request. When a party seeks leave to file sealed or redacted materials on the ground that an opposing party or third party has requested it, that party shall notify the opposing party or third party that it must file, within three days, a letter explaining the need to seal or redact the materials. Any party unable to comply with the requirement for electronic filing under seal through the ECF system, or who has reason to believe that a particular document should not be electronically filed, must move for leave of the Court to file in the traditional manner, on paper.'
