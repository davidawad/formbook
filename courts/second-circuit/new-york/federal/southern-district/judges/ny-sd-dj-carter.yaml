- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/ALC%20Carter%2011.2025%20INDIVIDUAL%20PRACTICES.pdf
  text: 'Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. ii. Sealing/Redaction Requiring Court Approval. Motions or Letter Motions for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court’s ECF system in conformity with the court’s standing order, 19-mc-00583, and ECF Rules & Instructions, Section 6. The motion must be filed in public view, must explain the particular reasons for seeking to file that information under seal and should not include confidential information sought to be filed under seal. Supporting papers must be separately filed electronically and may be filed under seal or redacted only to the extent necessary to safeguard information sought to be filed under seal. The proposed sealed document must be contemporaneously filed under seal in the ECF system and electronically related to the motion. The summary docket text, but not the sealed document, will be open to public inspection and should not include confidential information sought to be filed under seal. Where the motion seeks approval to redact information from a document that is to be publicly filed, the filing party shall: (a) publicly file the document with the proposed redactions, and (b) electronically file under seal a copy of the unredacted document with the proposed redactions highlighted. Both documents must be electronically filed through the ECF system and related to the motion. Any party unable to comply with the requirement for electronic filing under seal through the ECF system, or who has reason to believe that a particular document should not be electronically filed, must move for leave of the Court to file in the traditional manner, on paper.'
