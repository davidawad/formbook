  text: N. Artificial Intelligence. If any attorney or pro se litigant uses an artificial intelligence tool in preparing any filing, the filing must include a signed certification (i) explaining how the tool was used, (ii) stating whether the attorney or litigant personally reviewed the filing for accuracy of cited legal authorities and factual assertions, and (iii) if so, describing in detail the steps taken to verify the accuracy of all legal authorities and factual assertions generated by the tool. [...] The Court may strike any filing that fails to comply with this Rule.
