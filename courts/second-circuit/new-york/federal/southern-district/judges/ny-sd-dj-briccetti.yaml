  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/VB%20Briccetti%20Individual%20Rules%20of%20Practice.revised%206.24.2026.pdf#page=6
  text: 'Sealing/Redactions Not Requiring Court Approval. Fed. R. Civ. P. 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. Such sensitive information includes: Social Security numbers; names of minor children; dates of birth; and financial account numbers. [...] Motions or letter-motions for approval of sealed or redacted filings, and the subject documents, including the proposed sealed document(s), must be filed electronically through the Court''s ECF system in conformity with the Court''s standing order, 19-mc-00583, and SDNY Electronic Case Filing Rules & Instructions, Section 6. The motion must be filed in public view, must explain the reasons for seeking to file that information under seal, and should not include confidential information sought to be filed under seal. The proposed sealed document must be contemporaneously filed, under seal, in the ECF system, as electronically related to the motion. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing and must be otherwise consistent with the presumption in favor of public access to judicial documents. See Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-20 (2d Cir. 2006). In general, the parties'' consent or the fact that information is subject to a confidentiality agreement between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. Motors LLC Ignition Switch Litig., No. 14-MD-2543 (JMF), 2015 WL 4750774, at *4 (S.D.N.Y.'
