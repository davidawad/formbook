- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/AT%20Torres%20Individual%20Practices%20in%20Civil%20Cases%20-%202025.11.5%20%28ADOPTED%29.pdf#page=7
  text: Electronic Filing Under Seal in Civil and Miscellaneous Cases. Motions or Letter Motions for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court's ECF system in conformity with the court's standing order, 19 Misc. 583, and ECF Rules & Instructions, section 6. The motion must be filed in public view, must explain the particular reasons for seeking to file that information under seal and should not include confidential information sought to be filed under seal. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing and must be otherwise consistent with the presumption in favor of public access to judicial documents.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/AT%20Torres%20Individual%20Practices%20in%20Civil%20Cases%20-%202025.11.5%20%28ADOPTED%29.pdf#page=13
  text: Use of Generative Artificial Intelligence. Under Federal Rule of Civil Procedure Rule 11, all parties and counsel are reminded of their obligation to provide the Court with accurate and complete representations in any pleading, written motion, or other paper submitted to the Court. If a submission is prepared using generative artificial intelligence (for example, ChatGPT, Harvey, CoCounsel, or Google Bard), the submitting party and counsel must confirm for themselves that the submission, and all source material within, is accurate and in compliance with the obligations of Rule 11. At all times, the submitting party and their counsel bear responsibility to ensure the accuracy of any submission made to the Court. Failure to uphold this responsibility may result in sanctions or other corrective or disciplinary action.
