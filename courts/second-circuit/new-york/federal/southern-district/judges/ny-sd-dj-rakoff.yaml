- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/JSR%20Rakoff%20Rules%20Update%202024-06-03.pdf#page=12
  text: All parties that wish to propose a protective order must, after receiving the Court’s permission in accordance with Rule 2(b), supra, submit a proposed protective order that conforms as closely as possible with the Court’s Model Protective Order, which is available on the Judge’s website. If the parties alter the Court’s Model Protective Order in any way other than conforming the caption and signatures, they must provide a redline indicating all such modifications by email to Chambers. [...] The Court’s Model Protective Order does not provide such permission. Parties are expected to provide the Court with notice at least three business days before the relevant filing deadline if they wish to file documents under seal. (c) No document may be filed under seal without prior application to the Court as described above. After obtaining the Court’s leave, the document must be filed under seal in the ECF system. Where a party has received approval to redact information from a document that is to be publicly filed, that party shall publicly file the document with the redactions, and electronically file under seal a copy of the unredacted document. Both documents must be electronically filed through the ECF system. When filing documents under seal, parties are expected to provide the Court electronic copies of the underlying documents via email. If hard copies are necessary, they will be requested.
