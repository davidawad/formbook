- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/DLC%20Cote%20Civil%20Individual%20Practices%202025-02-26.pdf#page=7
  text: 'Electronic Filing Under Seal in Civil and Miscellaneous Cases A. Sealing/Redactions Not Requiring Court Approval. Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. B. Sealing/Redaction Requiring Court Approval. [...] The motion must be filed in public view, must explain the particular reasons for seeking to file that information under seal and should not include confidential information sought to be filed under seal. Supporting papers must be separately filed electronically and may be filed under seal or redacted only to the extent necessary to safeguard information sought to be filed under seal. The proposed sealed document must be contemporaneously filed under seal in the ECF system and electronically related to the motion. The summary docket text, but not the sealed document, will be open to public inspection and should not include confidential information sought to be filed under seal. Where the motion seeks approval to redact information from a document that is to be publicly filed, the filing party shall: (a) publicly file the document with the proposed redactions, and (b) electronically file under seal a copy of the unredacted document with the proposed redactions highlighted. Both documents must be electronically filed through the ECF system and related to the motion.'
