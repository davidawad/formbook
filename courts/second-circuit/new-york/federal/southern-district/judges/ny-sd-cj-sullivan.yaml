  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/RJS%20Sullivan%20Individual%20Practices%20-%20Updated%20September%202021.pdf#page=3
  text: Sealing No document may be filed with the Clerk under seal without an order of this Court addressing the specific documents to be sealed. Any application to seal shall be accompanied by an affidavit or affidavits and a memorandum of law, demonstrating that the standards for sealing have been met and specifically addressing Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110 (2d Cir. 2006), in a civil case or United States v. Amodeo, 71 F.3d 1044 (2d Cir. 1995), in a criminal case, and any other controlling authority. The application shall also include a proposed redacted version of the document(s) in question for public docketing. Nothing herein is intended to alter or modify the applicability of Federal Rule of Civil Procedure 5.2. The redactions expressly authorized by Rule 5.2 may be made without application to the Court.
