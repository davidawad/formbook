- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/BCM%20Moses%20Individual%20Practices%204.8.25%20Final.pdf#page=5
  text: 'Filing under seal requires permission of the Court, which may be sought via letter-motion. The letter-motion requesting approval of sealed or redacted filings and the document(s) as to which sealing is requested must be filed electronically on ECF in compliance with standing order No. 19-mc-00583 and § 6 of the SDNY ECF Rules & Instructions. [...] The letter-motion must be filed in public view, must explain the particular reasons for seeking to file that information under seal, and should not include any of the confidential information sought to be filed under seal. Supporting papers must be separately filed electronically and may be filed under seal or redacted only to the extent necessary to safeguard information sought to be filed under seal. [...] The document(s) as to which sealing is requested must be contemporaneously filed under seal on ECF and electronically related to the letter-motion. The summary docket text, but not the sealed document, will be open to public inspection and therefore should not include confidential information sought to be filed under seal. [...] If the letter-motion seeks approval to redact information from a document that is otherwise to be publicly filed, the filing party shall: (a) publicly file the document in the proposed redacted form, and (b) electronically file under seal a copy of the unredacted document, with the proposed redactions highlighted. Both documents must be electronically filed through the ECF system and related to the motion. To be approved, any sealing or redaction of a court filing must be narrowly tailored to serve the purpose that requires the sealing or redaction and must be otherwise consistent with the presumption in favor of public access to judicial documents described in Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110, 119-20 (2d Cir. 2006). The parties are cautioned that the designation of documents as "confidential" for discovery purposes does not, without more, justify a sealing or redaction order. If a sealing or redaction request is based on another party''s designation of documents or information as "confidential," or if any party opposes the sealing or redaction request, that other party shall respond to the requesting party''s letter-motion via ECF on the schedule set forth above in § 2(e). The party seeking leave to file sealed or redacted materials should meet and confer with any opposing parties (or third parties seeking confidential treatment of the information) in advance to narrow the scope of the request. When a party seeks leave to file sealed or redacted materials on the ground that an opposing party or third party has requested it, that party shall notify the opposing party or third party that it must file, within three court days, a letter explaining the need to seal or redact the materials. [...] Notwithstanding the foregoing, no leave is required to redact all but the last four digits of an individual''s social-security number or taxpayer-identification number, the day and month of an individual''s birth, the name of an individual known to be a minor, or all but the last four digits of a financial-account number, consistent with Fed. R. Civ. P. 5.2.'
