- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/JPC%20Cronan%20Individual%20Civil%20Rules%20-%20Updated%202025.10.23.pdf#page=3
  text: E. Use of Artificial Intelligence (“AI”) Tools. Counsel is responsible for providing the Court with complete and accurate representations of the record, the procedural history of the case, and any cited legal authorities. All litigants are responsible for verifying the accuracy of any output produced in whole or in part by an AI tool. Any attorney who signs a filing for which an AI tool was used to prepare (including by appearing on the signature block of the filing) must attach to the filing a signed certification (i) stating whether the litigant personally reviewed the filing for accuracy of cited legal authorities and factual assertions and (ii) if so, describing in detail the steps taken to verify the accuracy of all legal authorities and factual assertions generated by the AI tool. An attorney who signs an AI-assisted filing, yet fails to review that filing for accuracy or to provide the required certification, violates this Rule. The Court may impose sanctions on counsel and/or strike the filing for failing to comply with this Rule. A model certification may be found on the Court’s website (https://www.nysd.uscourts.gov/hon-john-p-cronan).
