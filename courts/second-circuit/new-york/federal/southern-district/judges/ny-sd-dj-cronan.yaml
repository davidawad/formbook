  text: 'sealing of public court filings require Court approval. Any party seeking to file a document under seal or in redacted form shall proceed as follows: i. Meet and Confer. The party seeking leave to file a document under seal or in redacted form shall meet and confer with all other parties in the case (as well as any third party seeking confidential treatment of the information) in advance to narrow the scope of the request. In general, however, the parties’ consent or the fact that information is subject to a confidentiality agreement or protective order between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. [...] Filing Sealed or Redacted Documents. [...] ECF Rules and Instructions. [...] Any application to file a document under seal or in redacted form must demonstrate that the standards for sealing have been met and specifically address Lugosch v. Pyramid Co. of Onondaga, 435 F.3d 110 (2d Cir. 2006) and any other controlling authority. The movant also may file a memorandum of law and an affidavit or affidavits in support of the request for sealing or redacting. If approval for redactions is sought, the application shall also include a proposed redacted version of the document in question for public docketing. When a party seeks leave to file a document under seal or in redacted form on the ground that an opposing party or third party has requested it, the opposing party or third party must file publicly on ECF, within three business days, a letter explaining the need to seal or redact the document. In the event there are grounds for sealing or redacting that cannot be publicly disclosed, a party may file under seal on ECF (with appropriate level of restriction) additional briefing further explaining those grounds, along with a justification for the sealing of that briefing. The subject document, in unredacted form, shall be contemporaneously filed under seal on ECF (with the appropriate level of restriction) and electronically related to the motion (or to the relevant Court order if the Court previously granted leave to file the document under seal). Note that the summary docket text, but not the document itself, will be open to public inspection and therefore should not include confidential information sought to be filed under seal. When a party seeks to file a document in redacted form, the party also shall e-mail to Chambers (CronanNYSDChambers@ny'
