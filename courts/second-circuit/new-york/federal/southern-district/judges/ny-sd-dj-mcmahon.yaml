  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/CM%20McMahon%20Individual%20Rules%20Rev%202026.pdf#page=17
  text: 'The below addendum must be incorporated before Judge McMahon will sign a Stipulation and Confidentiality Order: THE FOLLOWING ADDENDUM IS DEEMED INCORPORATED INTO THE PARTIES’ STIPULATION AND CONFIDENTIALITY ORDER The parties understand that the Court’s “so ordering” of this stipulation does not make the Court a party to the stipulation or imply that the Court agrees that documents designated as “Confidential” by the parties are in fact confidential. It has been this Court’s consistent experience that confidentiality stipulations are abused by parties and that much material that is not truly confidential is designated as such. The Court does not intend to be a party to such practices. The Court operates under a presumption that the entire record should be publicly available. The Court does not ordinarily file decisions under seal or redact material from them. If the Court issues a decision in this case that refers to “confidential” material under this stipulation, the decision will not be published for ten days. The parties must, within that ten-day period, identify to the Court any portion of the decision that one or more of them believe should be redacted, provide the Court with the purportedly confidential material, and explain why that material is truly confidential. The Court will then determine whether the material is in fact genuinely deserving of confidential treatment. The Court will only redact portions of a publicly available decision if it concludes that the material discussed is in fact deserving of such treatment. The Court’s decision in this regard is final. If this addendum is acceptable to the parties, the Court will sign their proposed confidentiality stipulation, subject to the addendum. If this addendum is not acceptable, the Court will not sign the stipulation, and should allegedly confidential material be produced, the parties will be referred to the magistrate judge for a document by document review and decision on whether that document should be subject to confidential treatment.'
