  text: 'Redactions and Filing Under Seal a. Privacy Policy. The parties are referred to Federal Rule of Civil Procedure 5.2 and the S.D.N.Y. ECF Privacy Policy (“Privacy Policy”). b. Redactions Not Requiring Court Approval. There are two categories of information that may be redacted from public court filings without prior permission from the Court: “sensitive information” and information requiring “caution. Parties should not include in their public filings, unless necessary, the five categories of “sensitive information,” i.e., • social security numbers (use the last four digits only), • names of minor children (use the initials only), • dates of birth (use the year only), • financial account numbers (use the last four digits only), and • home addresses (use only the City and State). [...] Except for redactions permitted by the eleven categories of information identified in the Privacy Policy, all redactions or sealing of public court filings require Court approval. To be approved, any redaction or sealing of a court filing must be narrowly tailored to serve whatever purpose justifies the redaction or sealing and must otherwise be consistent with the presumption in favor of public access to judicial documents. In general, the parties’ consent or the fact that information is subject to a confidentiality agreement between litigants is not, by itself, a valid basis to overcome the presumption in favor of public access to judicial documents. d. Procedures for Filing Sealed or Redacted Documents. Any party seeking leave to file a document under seal or in redacted form shall proceed as follows: i. Meet and Confer. The party should meet and confer with any opposing party (or any third party seeking confidential treatment of the information) in advance to narrow the scope of the request. When a party seeks leave to file a document under seal or in redacted form on the ground that an opposing party or third party has requested it, the filing party shall notify the opposing party or third party that it must file, within three business days, a letter explaining the need to seal or redact the document. ii. The party shall file a letter-motion seeking leave to file a document wholly under seal on ECF in accordance with Standing Order 19-MC-583 and Section 6 of the S.D.N.Y. Electronic Case Filing Rules and Instructions. The letter-motion itself shall be filed in public view, should explai'
