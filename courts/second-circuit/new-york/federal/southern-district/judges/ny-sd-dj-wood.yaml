  url: https://www.nysd.uscourts.gov/sites/default/files/practice_documents/KMW%20Wood%20Individual%20Rules%20of%20Practice%20-%20UPDATED%201-29-20%20with%20Electronic%20Sealing%20Instructions.pdf#page=2
  text: 'ELECTRONIC FILING UNDER SEAL IN CIVIL/MISCELLANEOUS CASES Sealing/Redactions Not Requiring Court Approval Federal Rule of Civil Procedure 5.2 describes sensitive information that must be redacted from public court filings without seeking prior permission from the Court. Such sensitive information includes: Social Security numbers; names of minor children; dates of birth; and financial account numbers. Other information that should be treated with caution and may warrant a motion for approval of sealed or redacted filing includes: personal identifying numbers (PIN numbers); medical records, treatment and diagnosis; employment history; individual financial information; proprietary or trade secret information; home addresses; and information regarding an individual’s cooperation with the government. Sensitive information and information requiring caution must not be included in any document filed with the Court unless such inclusion is necessary and relevant to the case. If such information must be included, personal identifiers must be partially redacted in accordance with the above-cited rules and policies in order to protect any privacy interest. Sealing/Redaction Requiring Court Approval Motions or Letter Motions for approval of sealed or redacted filings in civil and miscellaneous cases and the subject documents, including the proposed sealed document(s), must be filed electronically through the court’s ECF system in conformity with the court’s standing order, 19-mc-00583, and ECF Rules & Instructions, Section'
