# U.S. District Court for the Northern District of New York (nynd): a memorandum of law in support of a motion, on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with N.D.N.Y.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb
# engines gen`). Rules: N.D.N.Y. Local Rules of Practice (2025 edition), https://www.nynd.uscourts.gov/sites/nynd/
# files/local_rules/Local%20Rules%202025_Final.pdf (read 2026-10-14; ../README.md quotes them). The base already meets
# L.R. 10.1(a): 12-point type, footnotes included (10.1(a)(1)), one-inch margins (10.1(a)(2)), the body double spaced
# (10.1(a)(3)), block quotations and footnotes single spaced (10.1(a)(4)), pages numbered consecutively (10.1(a)(7)),
# and L.R. 10.1(b)(1) letter paper. The 25-page limit of L.R. 7.1(b)(1) is asserted by the typst template (leave.pages)
# (the body pages; DEF-LEN-001 counts the whole PDF).
base: /lib/layouts/frcp-motion-brief.yaml
constants:
  district: "NORTHERN DISTRICT OF NEW YORK"
# L.R. 7.1(b)(1): "numbered pages": the cover unnumbered, the table of contents i, ii, the body from 1, centered.
page_number: {align: center, front: lower-roman}
# Footnotes at the text size (L.R. 10.1(a)(1)), single spaced (10.1(a)(4)), 7 pt apart, a double line's room above
# the rule.
footnote: {size: 12, gap: 7, clearance: 12}
# L.R. 10.1(a)(4): block quotations single spaced; an inch in on each side, a single line's space above and below.
quote: {left: 72, right: 72, above: 12, below: 12}
# Headings at the body pitch, bold, unnumbered (the filer types "POINT I:", "A.", "1."): level 1 centered in capitals,
# level 2 centered, level 3 at the margin.
heading:
  - {align: center, bold: true, upper: true, pitch: body, above: 0, below: 0}
  - {align: center, bold: true, pitch: body, above: 0, below: 0}
  - {bold: true, pitch: body, above: 0, below: 0}
# L.R. 10.1(c)(1): the caption, the title of the court, the title of the action, the civil action number, the assigned
# judge's initials and the name of the paper; L.R. 10.1(c)(2): the filer's identification. The cover (unnumbered): the
# court's name at the margin; a double line below it the parties between a rule above and below, "v." half an inch in
# a line from each party, each designation two inches in under its names; at the right the case number with the
# judges' initials; the paper's title centered in bold capitals six double lines below; five double lines further the
# filing firm 3.25 inches in: the firm in bold capitals, each signer's name, bar roll number and e-mail, the address,
# the telephone and the role in italics.
cover:
  - {text: "{xd.court}"}
  - {text: "{xd.district}"}
  - columns:
      - width: 259.2
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", left: 144}
                between:
                  - {text: "{caption.between|v.}", left: 36, above: 13.8, below: 13.8}
            stroke: {top: 0.75, bottom: 0.75}
            inset: {top: 10, bottom: 10}
      - blocks:
          - {text: "Case No. {case_number} ({judges})", left: 7.2, above: 10}
    gutter: 21.6
    above: 24
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 144}
  - columns:
      - {width: 234, blocks: []}
      - blocks:
          - {text: "{signature.firm}", bold: true, upper: true}
          - each: signature.signers
            blocks:
              - {text: "{name}"}
              - {text: "{bar_roll}"}
              - {text: "{email}"}
          - {text: "{signature.address}"}
          - {text: "{signature.phone}"}
          - {text: "{counsel_role}", italic: true}
    gutter: 0
    above: 120
front: []
# L.R. 7.1(b)(1): "All memoranda of law shall contain a table of contents": the headings with their pages, single
# spaced, a level half an inch further in, the title wrapping before a half-inch page column, a dot leader to the page.
contents: {title: "TABLE OF CONTENTS", depth: 3, col: 36, step: 36, above: 0}
# L.R. 10.1(c)(2): the signature, typed name, bar roll number, office address, telephone and e-mail of each signer, a
# double line below the conclusion: the date at the left; at the right the firm in bold capitals, a double line below
# it "By:" and the signature line, each signer's lines, a single line below them the address, the telephone and the
# role in italics. Kept whole with the last paragraph.
closing:
  - columns:
      - blocks:
          - {text: "Dated: {signature.dated}"}
      - width: 234
        blocks:
          - {text: "{signature.firm}", bold: true, upper: true}
          - {text: "By: ______________________________", above: 24}
          - each: signature.signers
            blocks:
              - {text: "{name}"}
              - {text: "{bar_roll}"}
              - {text: "{email}"}
          - {text: "{signature.address}", above: 13.8}
          - {text: "{signature.phone}"}
          - {text: "{counsel_role}", italic: true}
    gutter: 14.4
    above: 24
