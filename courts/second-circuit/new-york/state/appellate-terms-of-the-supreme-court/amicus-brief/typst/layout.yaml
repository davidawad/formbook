# New York Supreme Court, Appellate Term (nyappterm): amicus curiae brief. The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to CPLR 5528-5531, 22 NYCRR Parts 640 and 731 and the template's conventions
# (../../rules.md, NYAPPTERM-*); lengths in points. No case text here: every string printed comes from the sample's
# frontmatter ({field}) or is a court constant.
size: 14                  # 731.10(e)(1)(A)(i): a proportionally spaced brief in 14 point (the template's size; NYAPPTERM-FORM-003)
pitch:
  body: 32.2              # NYAPPTERM-FORM-005: double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # headings, quotations, tables, cover, signature: single (731.10(e)(2)(C))
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NYAPPTERM-FORM-005: one inch on all sides
indent: 36
# NYAPPTERM-FORM-006: numbered consecutively; the tables in lower-case roman, the brief from 1; the cover unnumbered.
page_number: {align: center, from: 1, front: lower-roman}
footnote: {size: 12, pitch: 13.8, gap: 6}   # 731.10(e)(1)(A)(i): footnotes at least 12 point; single spaced
quote: {left: 36, right: 36, above: 14, below: 14, gap: 12.6, pitch: single}   # quotations single spaced, indented
# Sections centred in bold capitals (731.10(e)(1)(A): bold and capitals in headings only); the argument's points I.,
# A., 1., a., each level 0.5 in further in, the text hanging after the number.
heading:
  - {align: center, bold: true, upper: true, above: 21, below: 15.4}
  - {bold: true, upper: true, number: "I.", hang: 36, above: 15.4, below: 12.6}
  - {bold: true, number: "A.", left: 36, hang: 36, above: 15.4, below: 12.6}
  - {bold: true, italic: true, number: "1.", left: 72, hang: 36, above: 15.4, below: 12.6}
  - {bold: true, italic: true, number: "a.", left: 108, hang: 36, above: 15.4, below: 12.6}
# NYAPPTERM-CONT-001 (22 NYCRR 640.5(a)): the calendar number upper left, the counsel who will argue upper right, the
# lower court index number, the court, the title of the action between double rules, the title of the brief, and the
# amici's counsel with address and telephone, two firms a row (NYAPPTERM-CONT-007); spaced closer than the party
# briefs' covers so that four firms and three parties keep the cover to one page.
cover:
  - {text: "{docket}"}
  - when: argument.presenter
    blocks:
      - {text: "To be Argued by:", left: 288}
      - {text: "{argument.presenter}", bold: true, upper: true, left: 288}
      - {text: "(Time Requested: {argument.time_requested})", left: 288}
  - {text: "{county_clerk_index}", align: center, optional: true, above: 8.4}
  - {text: "{court_lines}", align: center, bold: true, above: 8.4}
  - {rule: 1.6, above: 8.4}
  - {rule: 0.5, above: 2.5}
  - each: caption
    above: 8.4
    between:
      - {text: "—against—", align: center, above: 2.8, below: 2.8}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", left: 234}
  - {text: "{caption_note}", align: center, optional: true, above: 4.2}
  - {rule: 1.6, above: 8.4}
  - {rule: 0.5, above: 2.5}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 8.4}
  - columns:
      - blocks: []
      - width: 144
        blocks:
          - {rule: 0.7}
      - blocks: []
    above: 8.4
  - columns:
      each: counsel
      per_row: 2
      row_gap: 8.4
      blocks:
        - {text: "{firm}", bold: true, upper: true}
        - {text: "{lines}"}
    gutter: 21.6
    above: 8.4
  - {text: "{attorneys_for}", align: center, above: 8.4}   # italic in the frontmatter itself
  - {rule: 1.6, above: 8.4}
  - {rule: 0.5, above: 2.5}
contents: {title: "Table of Contents", depth: 4, col: 28, hang: 36, step: 36, above: 5}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 25.2
  above: 9.8
  group: {bold: true, above: 16.8, below: 2.8}
# The date and place, then each firm's signature (the one marked `by` with its "By:" blank), never split.
closing:
  - group:
      - {text: "{signature.date}"}
      - {text: "{signature.place}", optional: true}
      - columns:
          each: signature.blocks
          per_row: 2
          row_gap: 11.2
          blocks:
            - {text: "{firm}", bold: true, upper: true}
            - when: by
              blocks:
                - {text: "By: ______________________"}
            - {text: "{names}"}
            - {text: "{lines}", italic: true}
        gutter: 28.8
        above: 16.1
      - {text: "{signature.attorneys_for}", italic: true, optional: true, above: 8.4}
    above: 19.6
