# 22 NYCRR 1250.8(f)(1)(i) (../rules.md NYAPPDIV-FORM-002): the body of a proportionally spaced brief is in 14-point type.
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # Note 2's URL (body page 4, ".../Anti-Harassment%20Policy%20-%20August..."): LaTeX and Word break after the
  # hyphen before "%20", which typst's URL rule (a hyphen before a letter) does not, so typst ends the line at
  # "Anti-" (docs/open-items/fb-595.54.73.md); 484 of 487 lines identical, pages and page ends equal. Reported, not
  # gated (fb-595.54.73).
  cross_engine_latex: report
  cross_engine_docx: report
