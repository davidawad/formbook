# New York Court of Appeals (ny): notice of motion and affirmation (motion for leave to appear as amicus curiae,
# 22 NYCRR 500.23(a)(1)). The whole layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/
# are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace to 22 NYCRR 500.1 (../../rules.md,
# NY-*); lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or
# is a court constant.
size: 14                  # NY-FORM-002: 14-point body for a proportionally spaced face
pitch:
  body: 32.2              # NY-FORM-003: double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, quotations, signature: single spaced (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NY-FORM-003: one inch on all sides
indent: 36
# NY-FORM-003: pages numbered consecutively in the center of the bottom margin; the cover is page 1 and prints no
# number, the body runs on from 2 (no tables, so no roman front matter).
page_number: {align: center, from: 2}
footnote: {size: 12, pitch: 13.8, gap: 7}   # NY-FORM-002, -003: footnotes 12 point (1.15 x 12 pt), single spaced
quote: {left: 36, right: 36, above: 14, below: 14}   # NY-FORM-003: quotations indented and single spaced
# Headings (NY-FORM-001: bold and capitals only in headings; NY-FORM-003: single spaced), kept with their text: level 1
# centered bold capitals, 2 bold, 3 bold half an inch in, 4 italic an inch in.
heading:
  - {align: center, bold: true, upper: true, above: 19.6, below: 16.8}
  - {bold: true, above: 16.8, below: 12.6}
  - {bold: true, left: 36, above: 18.2, below: 15.4}
  - {italic: true, left: 72, above: 16.8, below: 14}
# The caption cover: the argument request in the upper right corner when given (500.13(b), NY-CONT-006), the court,
# the docket, the parties with "against" between them, the title, and counsel's name, address, telephone and fax
# (NY-CONT-005). Set as the top of the body ending in a page break: the model writes a `cover` in docx only before
# tables (lib/docx/xdoc.lua), and this paper has none.
front:
  - when: argued_by
    blocks:
      - {text: "To be argued by:", align: right}
      - {text: "{argued_by}", align: right, below: 22.4}
  - {text: "Court of Appeals", align: center, bold: true}
  - {text: "of the State of New York", align: center, bold: true, above: 2.8}
  - {text: "{apl_docket}", align: center, above: 16.8}
  - {text: "{county_clerk_index}", align: center, optional: true, above: 5.6}
  - each: caption
    above: 21
    between:
      - {text: "--against--", align: center, italic: true, above: 8.4, below: 8.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, above: 4.2}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 25.2}
  - {text: "{proceeding}", align: center, optional: true, above: 16.8}
  - columns:
      each: counsel
      per_row: 2
      blocks:
        - {text: "{names}"}
        - {text: "{lines}", italic: true, above: 4.2}
    gutter: 21.6
    above: 72               # a fixed inch of space: the model has no space that fills the page (v(1fr))
  - {text: "{phone}", above: 11.2}
  - {text: "{fax}", optional: true, above: 4.2}
  - {text: "{date}", optional: true, above: 5.6}
  - {break: true}
# The signature block in the right half, never split; the certificate of service on its own page when given.
closing:
  - group:
      - {text: "Respectfully submitted,", left: 234}
      - {text: "{signature.signer}", left: 234, above: 25.2}
      - {text: "{signature.lines}", italic: true, left: 234}
      - {text: "{date}", optional: true, left: 234}
    above: 21
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 16.8}
      - {text: "I certify that on the date below I served copies of this paper on counsel for all parties by {service.method}.", pitch: body, indent: 36}
      - when: service.unregistered
        blocks:
          - each: service.unregistered
            blocks:
              - {text: "{name}", above: 14}
              - {text: "{address}"}
      - group:
          - {text: "{signature.signer}", left: 234}
          - {text: "{date}", optional: true, left: 234}
        above: 21
