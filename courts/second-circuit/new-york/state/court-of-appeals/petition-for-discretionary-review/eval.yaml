# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # typst and LibreOffice may end a line after a slash inside a word ("A.B. 7228/S.B. 2180", a bill pair), pdfLaTeX
  # does not (the model breaks after a slash only inside a URL): INPUT-petition-for-discretionary-review, page 16
  # line 20, one line (XENG-003). A shared-model request (docs/open-items/fb-595.54.34.md); reported, not gated.
  cross_engine_latex: report
