# New York Court of Appeals (ny): brief on the merits (principal brief, normal course appeal). The whole layout, as data
# for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to 22 NYCRR 500.1 and 500.13 (../../rules.md, NY-*); lengths in points. No case text
# here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # NY-FORM-002 (500.1(j)(1)): 14-point body for a proportionally spaced face
pitch:
  body: 32.2              # NY-FORM-003 (500.1(l)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, quotations, notes, tables, signature: single spaced (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NY-FORM-003: one inch on all sides
indent: 36
# NY-FORM-003: pages numbered consecutively in the center of the bottom margin; the cover prints no number, the pages
# before the body i, ii .. (the disclosure statement and the related litigation first, then the tables), the body from 1.
page_number: {align: center, from: 1, front: lower-roman}
# NY-FORM-002 (500.1(j)(1)): footnotes at least 12 point, single spaced (1.15 x 12 pt). The filed brief sets them at
# the body size; 12 point is the rule's floor, as this court's other templates set them (tier 2).
footnote: {size: 12, pitch: 13.8, gap: 7}
quote: {left: 36, right: 36, above: 14, below: 14, gap: 12.6}   # NY-FORM-003: quotations indented, single spaced
# Headings (NY-FORM-001: bold and capitals only in headings; NY-FORM-003: single spaced), kept with their text: section
# headings centered bold capitals; the argument's points numbered by the template, I. (bold capitals), A. (bold),
# 1. and a. (bold italic), the label in a half-inch box at each level's indent and the title's later lines under it.
heading:
  - {align: center, bold: true, upper: true, above: 21, below: 15.4}
  - {bold: true, upper: true, number: "I.", label_box: 36, above: 15.4, below: 12.6}
  - {bold: true, number: "A.", left: 36, label_box: 36, above: 15.4, below: 12.6}
  - {bold: true, italic: true, number: "1.", left: 72, label_box: 36, above: 15.4, below: 12.6}
  - {bold: true, italic: true, number: "a.", left: 108, label_box: 36, above: 15.4, below: 12.6}
# The cover (500.13(b), NY-CONT-005, -006): the docket at the left and the argument request (presenter and time) in the
# upper right corner, the court, the caption between double rules, the title, counsel's names, address, telephone and
# fax, the party, the date the brief was completed. One page: the space between its parts fills what the page leaves.
cover:
  - columns:
      - blocks:
          - {text: "{docket}"}
          - {text: "{county_clerk_index}", optional: true}
      - width: 223
        blocks:
          - when: argument.presenter
            blocks:
              - {text: "To be Argued by:"}
              - {text: "{argument.presenter}", bold: true, upper: true}
              - {text: "(Time Requested: {argument.time_requested})"}
          - unless: argument.presenter
            blocks:
              - {text: "Submitted without oral argument"}
    gutter: 21.6
  - {fill: 1}
  - {text: "Court of Appeals of the State of New York", align: center, bold: true}
  - {fill: 1}
  - {rule: 1.6}
  - {rule: 0.5, above: 2.5}
  - {fill: 1}
  - each: caption
    between:
      - {text: "– against –", align: center, above: 5, below: 5}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", left: 234}
  - {fill: 1}
  - {rule: 1.6}
  - {rule: 0.5, above: 2.5}
  - {fill: 1}
  - {text: "{brief_title}", align: center, bold: true, upper: true}
  - {fill: 1}
  - columns:
      - {width: 162, blocks: [{text: ""}]}
      - {width: 144, blocks: [{rule: 0.7}]}
      - {width: 162, blocks: [{text: ""}]}
  - {fill: 1}
  - columns:
      each: counsel
      blocks:
        - {text: "{firm}", bold: true, upper: true}
        - {text: "{lines}", italic: true, above: 4}
    gutter: 28.8
  - {text: "{attorneys_for}", align: center, italic: true, above: 7}
  - {fill: 1}
  - {text: "Date Completed: {date_completed}", align: center}
  - {fill: 1}
  - {rule: 1.6}
  - {rule: 0.5, above: 2.5}
# NY-CONT-001, -002 (500.1(f), 500.13(a)): the disclosure statement, when the filer is an entity, and the status of
# related litigation, before the table of contents.
before_tables:
  - when: disclosure
    blocks:
      - {text: "Disclosure Statement Pursuant to Section 500.1(f) of the Rules of the Court of Appeals", heading: 1}
      - {markdown: "{disclosure}", pitch: body, indent: 36}
  - {text: "Statement of Related Litigation", align: center, bold: true, upper: true, above: 21, below: 15.4}
  - {text: "{related_litigation}", pitch: body, indent: 36}
# NY-CONT-001 (500.13(a)): a table of contents and a table of cases and authorities, each on its own page.
contents: {title: "Table of Contents", depth: 4, col: 36, step: 36, above: 7}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 25
  above: 7
  page_heading: "Page(s)"
  passim: 7
  group: {bold: true, above: 14, below: 4}
  kinds:
    - {kind: case, title: "Cases:"}
    - {kind: constitution, title: "Constitutional Provisions:"}
    - {kind: statute, title: "Statutes:"}
    - {kind: regulation, title: "Regulations:"}
    - {kind: rule, title: "Rules:"}
    - {kind: other, title: "Other Authorities:"}
# NY-LEN-001 (500.13(c)(1), (3)): a principal brief is limited to 14,000 words, point headings and footnotes counted,
# the questions presented not; over the limit the render stops.
words: {exclude: ["Question"], limit: 14000}
# The brief's last paragraph stays with the signature block, which never stands alone on a page.
keep_with_closing: true
# The signature (500.1(m)): place and date, the firms side by side (the signature line above the first firm's
# signers), the party. Then the certificate of compliance (500.1(j), 500.13(c)(1): face, size, spacing, the word
# count), never split, and the affidavit of service (500.1(e)), typed with blanks, each on its own page.
closing:
  - group:
      - {text: "Dated: {signature.place}"}
      - {text: "{signature.date}"}
      - columns:
          each: signature.blocks
          blocks:
            - {text: "{firm}", bold: true, upper: true}
            - when: "#"
              is: 1
              blocks:
                - {text: "By: ______________________________", above: 4}
            - {text: "{names}", above: 4}
            - {text: "{lines}", italic: true}
        gutter: 28.8
        above: 16.8
      - {text: "{signature.attorneys_for}", italic: true, above: 8.4}
    above: 19.6
  - {break: true}
  - group:
      - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 15.4}
      - {text: "I hereby certify pursuant to 22 NYCRR 500.1(j) that the foregoing brief was prepared on a computer using {word_processor|a word-processing system}.", pitch: body, indent: 36}
      - {text: "A proportionally spaced typeface was used, as follows:", pitch: body, indent: 36}
      - {text: "Name of typeface: Times New Roman", left: 36, above: 11.2}
      - {text: "Point size: 14", left: 36}
      - {text: "Line spacing: Double", left: 36, below: 11.2}
      - {text: "**Word Count.** The total number of words in this brief, inclusive of point headings and footnotes and exclusive of pages containing the table of contents, table of citations, proof of service, certificate of compliance, corporate disclosure statement, questions presented, statement of related litigation, or any authorized addendum containing statutes, rules, regulations, etc., is {xd.words}.", pitch: body, indent: 36}
      - {text: "Dated: {signature.place}", above: 19.6}
      - {text: "{signature.date}"}
      - columns:
          each: signature.blocks
          blocks:
            - {text: "{firm}", bold: true, upper: true}
            - when: "#"
              is: 1
              blocks:
                - {text: "By: ______________________________", above: 4}
            - {text: "{names}", above: 4}
        gutter: 28.8
        above: 16.8
      - {text: "{signature.attorneys_for}", italic: true, above: 8.4}
  - {break: true}
  - {text: "Affidavit of Service", align: center, bold: true, upper: true, below: 15.4}
  - columns:
      - width: 252
        blocks:
          - {text: "STATE OF NEW YORK"}
          - {text: ""}
          - {text: "COUNTY OF ________________"}
      - {width: 14, repeat: ")"}
      - blocks:
          - {text: ""}
          - {text: "ss.:"}
    below: 16.8
  - {text: "______________________________, being duly sworn, deposes and says: deponent is not a party to this action, is over 18 years of age, and resides at ______________________________.", pitch: body, indent: 36}
  - {text: "On the ________ day of ________________, 20\\_\\_\\_\\_\\_, deponent served the within brief upon each attorney for each party to this appeal, at the address designated by that attorney for that purpose, by ______________________________, and by ____________________.", pitch: body, indent: 36}
  - group:
      - {text: "______________________________", left: 234}
      - {text: "Sworn to before me this", left: 234, above: 8.4}
      - {text: "______ day of __________, 20\\_\\_\\_", left: 234}
      - {text: "______________________________", left: 234, above: 25.2}
      - {text: "Notary Public", left: 234}
    above: 25.2
