# Supreme Court of Wisconsin (wis): a motion and its supporting memorandum (Wis. Stat. 809.14).
# The whole layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from
# this file by `fb engines gen`, fb-595.54.12). Numbers trace to Wis. Stat. chapter 809 (../../rules.md, SUPCT-*);
# lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a
# court constant.
size: 13                  # SUPCT-FORM-004: 809.81 sets no size for a motion; 13 point, the size 809.19(8)(b)3.c sets for briefs
pitch:
  body: 29.9              # SUPCT-FORM-006: 809.81(4), papers other than briefs and petitions for review double-spaced (2 x 1.15 x 13 pt)
  single: 14.95           # cover, headings, tables, quotations, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 90, right: 90}   # SUPCT-FORM-002: 809.81(4), at least 1.25 in left and right, 1 in top and bottom
indent: 36
# Word only: the right margin 0.1 pt (2 twips) wider. LibreOffice rounds each run of text to its layout units, and the
# line of p14 that typst ends after "clear" (line 11) kept "from" there; every line breaks as in typst at 0.1, not at
# 0.05 or 0.15 (measured, fb-595.54.82; the amicus brief's docx_bias alike).
docx_bias: 0.1
page_number: {align: center, from: 1}   # SUPCT-FORM-007: 809.81(5), Arabic numbers centered at the foot; the cover is page 1, numbered
footnote: {size: 11, pitch: 12.65, gap: 7}   # as SUPCT-FORM-004, -005 set them for briefs: 11 point, single-spaced (1.15 x 11 pt)
quote: {left: 36, right: 36, above: 10.4, below: 15.6}   # as SUPCT-FORM-005 sets them for briefs: single-spaced, indented
# Level 1 a section (bold capitals, centered); levels 2 to 4 argument headings numbered by the template (I., A., 1.)
heading:
  - {align: center, bold: true, upper: true, above: 20.8, below: 15.6}
  - {bold: true, hang: 36, number: "I.", above: 15.6, below: 10.4}
  - {bold: true, hang: 36, number: "A.", above: 13, below: 10.4}
  - {bold: true, italic: true, hang: 36, number: "1.", above: 11.7, below: 9.1}
# SUPCT-COVER-001 (809.19(9), the form the exemplar follows): the court, the case number, the caption, the court
# appealed from, the title and counsel (one column per counsel group). The caption and counsel at 10 point (cover type is
# not body text, SUPCT-FORM-004; the size the answering brief's cover sets), single-spaced: a caption that
# names every party then still leaves the cover one page.
cover:
  - {text: "STATE OF WISCONSIN<br>IN SUPREME COURT", align: center, bold: true}
  - {text: "No. {case_number}", align: center, above: 21.6}
  - each: caption
    above: 14.4
    between:
      - {text: "v.", align: center, above: 7.2}
    blocks:
      - {text: "{names}", align: center, size: 10, pitch: 11.5, above: 7.2}
      - {text: "{designation}", align: center, italic: true, size: 10, pitch: 11.5, above: 5.2}
  - {text: "{proceeding}", align: center, optional: true, above: 14.4}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 21.6}
  - columns: {each: counsel, blocks: [{text: "{names}", bold: true, size: 10, pitch: 11.5}, {text: "{lines}", size: 10, pitch: 11.5}]}
    gutter: 14.4
    above: 21.6
  - {text: "{phone}", optional: true, size: 10, pitch: 11.5, above: 7.8}
# Optional for a motion (809.14 sets none); as 809.19(1)(a) sets them for briefs, each on its own page, when the input
# has them: the contents unless `toc: false`, the authorities when listed.
contents: {title: "Table of Contents", depth: 4, col: 36, hang: 36, step: 19.5, above: 11.7, when: toc, default: true}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 19.5
  above: 11.7
  group: {bold: true, above: 15.6, below: 10.4}
# The date and the signature (SUPCT-SIG-001), never split. SUPCT-MOT-002: 809.14 states no length and no certification.
closing:
  - group:
      - {text: "{date}", optional: true}
      - columns:
          - {width: 230.4, blocks: []}
          - blocks:
              - {text: "Signed:"}
              - {rule: 0.5, above: 28.6}
              - {text: "{signature.signer}", above: 3.9}
              - {text: "{signature.lines}"}
        above: 5.2
    above: 21.6
  - {when: assisted, blocks: [{text: "This document was prepared with the assistance of a lawyer.", above: 5.2}]}
