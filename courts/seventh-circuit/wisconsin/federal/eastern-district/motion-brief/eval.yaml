# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.16), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: Civil L.R. 7(f), a principal memorandum in support of a motion is at most 30 pages (the caption,
  # tables and signature block excluded: the whole render is counted, the stricter reading).
  page_limit: 30
