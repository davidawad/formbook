# U.S. District Court for the Northern District of Indiana (innd): a brief in support of a Rule 12 motion, on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with N.D. Ind.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb
# engines gen`). Rules: N.D. Ind. Local Rules,
# https://www.innd.uscourts.gov/sites/innd/files/LocalRulesMaster2016Jan19%28rev2%29.pdf (read 2026-10-14;
# ../README.md quotes them). The base already meets L.R. 5-4(a)(2) to (4) on the page (8 1/2 x 11 paper, one-inch
# margins, 12-point type in the body) and L.R. 5-4(a)(6) (pages numbered consecutively, the first too). The 25-page
# limit of L.R. 7-1(e) is not machine-checked.
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name.
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "NORTHERN DISTRICT OF INDIANA"
# L.R. 5-4(a)(5): double spaced, two single lines of 12-point type (2 x 13.8 pt), the exemplars' pitch.
pitch: {body: 27.6, single: 13.8}
# L.R. 5-4(a)(4): footnotes of at least 10 points, single spaced (1.15 x 10 pt).
footnote: {size: 10, pitch: 11.5, gap: 7, clearance: 4}
# Block quotations single spaced, half an inch in on each side, a double line above and below.
quote: {left: 36, right: 36, above: 27.6, below: 27.6, gap: 13.8}
# Headings single spaced, in bold, numbered by the template as both exemplars number them: "I." at the margin, "A."
# and "1." half an inch further in each, the label in a half-inch box with the title's later lines hung under it.
heading:
  - {bold: true, number: "I.", label_box: 36, above: 13.8, below: 13.8}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 13.8, below: 13.8}
  - {bold: true, number: "1.", label_box: 36, left: 72, above: 13.8, below: 13.8}
  - {bold: true, number: "a.", label_box: 36, left: 108, above: 13.8, below: 13.8}
# FRCP 10(a), L.R. 5-4(a)(7): the court's name with the division in bold; the parties in a column ruled at its right
# (each party's names, its designation an inch in a line below, "v." half an inch in, a line from each); the case
# number and the judge beside them, centered on their height; then the paper's title centered in bold, in capitals as
# the filer types it (the exemplars underline it: ../README.md).
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - width: 230.4
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", left: 72, above: 13.8}
                between:
                  - {text: "v.", left: 36, above: 13.8, below: 13.8}
            stroke: {right: 0.5}
            inset: {right: 8.65}
      - valign: center
        blocks:
          - {text: "Case No. {case_number}"}
          - {text: "Judge {judge}", optional: true, above: 13.8}
    gutter: 13
    above: 27.6
  - {text: "{title}", align: center, bold: true, left: 36, right: 36, above: 27.6, below: 13.8}
# FRCP 11(a), L.R. 5-4(a)(7): "Dated:" at the margin; three and a fifth inches in "Respectfully submitted,", the party
# when the sample names one, the "By:" signature and the signer's role, then the counsel lines (a blank line between
# firms), a double line between the groups; kept whole with the last paragraph.
closing:
  - group:
      - columns:
          - {width: 230.4, blocks: [{text: "Dated: {signature.dated}"}]}
          - blocks:
              - {text: "Respectfully submitted,"}
              - {text: "{signature.party}", upper: true, optional: true, above: 27.6}
              - unless: signature.party
                blocks: [{text: "By: {signature.by}", above: 27.6}]
              - when: signature.party
                blocks: [{text: "By: {signature.by}", above: 13.8}]
              - {text: "{signature.role}", optional: true}
              - {text: "{signature.counsel}", above: 27.6}
    above: 27.6
# FRCP 5(b)(2)(E), 5(d)(1)(B): the certificate of service, when the sample gives one, after the signature and never
# split: its title centered in bold capitals, the statement at the body pitch, the signer's lines at the signature's
# column.
after_tail:
  - when: certificate
    blocks:
      - group:
          - {text: "{certificate.title}", align: center, bold: true, upper: true, pitch: body}
          - {text: "{certificate.text}", pitch: body, indent: 36, above: 27.6}
          - columns:
              - {width: 230.4, blocks: []}
              - blocks: [{text: "{certificate.counsel}"}]
            above: 27.6
        above: 27.6
