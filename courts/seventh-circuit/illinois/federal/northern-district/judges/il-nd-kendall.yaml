  text: Civil Motions will proceed Tuesday, Wednesday and Thursday at 9:30 a.m. Criminal Motions will proceed Tuesday, Wednesday, and Thursday at 10:00 a.m. Both Civil and Criminal Motions require THREE business days notice.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Kendall
  text: The parties are ordered to retain copies of all documents containing confidential information which are provided in discovery under the protective order. Documents containing confidential information shall NOT be file with the Clerk of Court. Documents requiring the court's review shall be submitted to chambers in camera in a sealed envelope bearing the caption of the case, case number, the title of the motion or response to which the submitted confidential information pertains, and the name and telephone number of counsel submitting the documents. After the court's review, the in camera items will be returned by the court to the producing party who shall maintain the submission intact for any future review. A redacted copy of the pleading shall be filed with the Clerk of Court for the record.
