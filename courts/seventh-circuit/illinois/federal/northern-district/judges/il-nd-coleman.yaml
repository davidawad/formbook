  field: motion_hearing_days
  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Coleman
  text: 'Civil and criminal motions are heard on Tuesdays and Wednesdays at 10:00 a.m. but the Court is available to hear motions any day during the work week. For days and times that are outside of a Tuesday or Wednesday, please contact the courtroom deputy to ensure that the Court has availability. All electronically filed motions must be filed no later than the third business day preceding the day the motion is to be heard. Number of days notice: At least 3 business days from the date of the filing of the motion.'
- topic: Proposed orders
  field: proposed_orders
  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Coleman
  text: Proposed orders are not to be filed in ECF. Instead, they must be submitted in Microsoft Word format to the Court's proposed order e-mail inbox, Proposed_Order_Coleman@ilnd.uscourts.gov. The subject line of the e-mail must include the case number and name, the docket number of the corresponding motion, and the title of the order that is proposed. Such proposed orders must be served on all parties. The Court will not entertain or enter proposed orders that do not correspond to a pending motion unless the order is being submitted with prior leave of Court.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Coleman
  text: Parties are to provide courtesy copies of substantive and/or dispositive motions, including all memorandums and briefs, as well as all response and reply briefs filed in connection with such motions. [...] Courtesy copies are to be delivered to Courtroom Deputy Yvette Montanez in room 1238 within 24 hours of filing. Confirmation of receipt will not be available. Courtesy copies need not be delivered in an envelope unless they contain materials that are under seal.
  unverified_sentences: 1
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Coleman
  text: Any party—counsel and unrepresented parties alike— using Artificial Intelligence (“AI”) in connection with the filing of a pleading, motion, or memorandum of law in this Court must comply with Rule 11(b) and Rule 26(g) of the Federal Rules of Civil Procedure. The court prohibits the use AI-generated legal research containing false or inaccurate propositions or citing non-existent cases.
