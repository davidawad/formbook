- topic: Oral argument
  field: oral_argument_default
  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Weisman
  text: The Court normally hears motions and holds status hearings on Monday, Tuesday, Wednesday and Thursday at 9:15 a.m. In the interest of the efficient expenditure of resources, the Court will attempt to avoid unnecessary appearances and accommodate telephonic appearances when appropriate. [...] The Court requests that the body of any motion state whether the motion is joint or if the other parties have authorized the movant to state that the parties either agree to the motion or have no objection to it. [...] Moving counsel may call chambers (312) 435-5656 or the courtroom deputy (312) 408-5058 after 4:00 p.m. on the day immediately before the motion is scheduled to be heard to find out if an appearance will be required. If counsel seeks information regarding the need to appear on a more prompt timeframe, counsel may call chambers with such a request. The Court will make every effort to provide a sufficiently timely response. [...] If no appearance is required, moving counsel must notify other counsel in the case. Please note that Judge Weisman ordinarily will hear argument and rule on discovery motions on the date they are noticed for presentment. If Judge Weisman thinks a response is necessary, the presentment date may be stricken and another hearing date will be set as appropriate or the Court will rule on the papers submitted via the CM/ECF system. The Court prefers that the parties jointly email the courtroom deputy to reschedule any hearing date.
  unverified_sentences: 3
- topic: Proposed orders
  field: proposed_orders
  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Weisman
  text: Parties should not file proposed orders. [...] Please include in the subject line of the e-mail the case number and name, the docket number of the corresponding motion, if any, and the title of the order that is proposed. All such documents must be submitted in a format compatible with Word. Any proposed order must also be served on all other parties to the case by copying the e-mail submission to all parties of record.
  unverified_sentences: 1
