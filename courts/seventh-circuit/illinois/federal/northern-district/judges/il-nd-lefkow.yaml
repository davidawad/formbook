  url: https://www.ilnd.uscourts.gov/judge_display.php?LastName=Lefkow
  text: In preparing a protective order, the parties should refer to General Order 12-0018 (Model Confidentiality Order). The parties are instructed to submit a Proposed Model Confidentiality Order to Judge Lefkow's Proposed Order Mailbox (see link on Judge Lefkow's webpage). After a motion is filed, the Court will review the proposed order. A clean version sent in Word format is required. A party who is granted leave to file a document under seal must file a redacted copy of the document for the public file. A copy of the redacted version must be submitted along with the motion for leave to file.
