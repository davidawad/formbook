# U.S. District Court for the District of Delaware (ded): the opening brief in support of a motion, on the generic FRCP
# brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with D. Del.'s local rules overlaid here. The shared document
# model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`).
# Rules: D. Del. Local Rules of Civil Practice and Procedure, revised, effective September 1, 2026 (read and quoted
# 2026-10-14; ../README.md quotes them). The base already meets LR 5.1.1(a) and LR 7.1.3(a)(2): at least 12-point type
# for all printed matter (footnotes included), margins of at least one inch, pages numbered consecutively. The 20-page
# limit of LR 7.1.3(a)(4) (contents and citations not counted) is not machine-checked.
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a), LR 7.1.3(a)(1): the court's name.
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE DISTRICT OF DELAWARE"
# LR 5.1.1(a): double spacing "according to typical word processing software" (not "exactly 24 point"): 2 x 1.15 x 12
# pt, the exemplar's pitch.
pitch: {body: 27.6}
# LR 5.1.1(a): pages numbered consecutively: the cover unnumbered, the contents and citations in lower-case roman from
# i, the body from 1, as the exemplar numbers them.
page_number: {align: center, front: lower-roman}
# Headings: a section centered in bold capitals on the body pitch, no space of its own; the argument headings numbered
# by the template, "I." at the margin and "A." half an inch in, bold single lines a single line above and below, each
# label in a half-inch box with the title's later lines hung under it (the exemplar's headings).
heading:
  - {align: center, bold: true, upper: true, pitch: body, above: 0, below: 0}
  - {bold: true, number: "I.", label_box: 36, above: 13.8, below: 13.8}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 13.8, below: 13.8}
# LR 7.1.3(b)(1)(A): a table of contents, with page numbers, of every heading in the body, single lines a single line
# apart, the page in a half-inch column with a leader to it.
contents: {title: "Table of Contents", depth: 3, col: 36, step: 36, above: 13.8}
# LR 7.1.3(b)(1)(B): a table of citations of cases, statutes, rules, textbooks and other authorities, from the `toa:`
# links of the body and notes: cases with the name in italics, rows half a line apart, a wrapped citation hung 0.35
# inch, "passim" at seven pages or more.
authorities:
  title: "Table of Citations"
  page_heading: "Page(s)"
  passim: 7
  kinds:
    - {kind: case, title: "Cases", italic: true}
    - {kind: statute, title: "Statutes"}
    - {kind: rule, title: "Rules"}
    - {kind: other, title: "Other Authorities"}
  col: 72
  hang: 25.2
  above: 6.9
  group: {bold: true, above: 13.8}
# LR 7.1.3(a)(1): the front cover: the court's name, the caption, the civil action number, the nature of the paper,
# counsel's names, Delaware bar numbers, address and telephone (OF COUNSEL at the left when the sample names any), and
# the date. The caption as both exemplars (two filers: usage/SOURCE.md) set it, unruled: the parties at the left, each
# party's names, its designation two inches in a line below, "v." an inch in a line from each; a column of colons beside
# them; the civil action number at the right, centered on their height.
front: ~
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - columns:
      - width: 234
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 144, above: 13.8}
            between:
              - {text: "v.", left: 72, above: 13.8, below: 13.8}
      - {width: 14.4, repeat: ":"}
      - valign: center
        blocks:
          - {text: "{case_label|C.A. No.} {case_number}", left: 14.4}
    above: 27.6
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 27.6}
  - columns:
      - width: 223.2
        blocks:
          - when: of_counsel
            blocks:
              - {text: "OF COUNSEL:"}
              - {text: "{of_counsel}", above: 13.8}
      - blocks:
          - {text: "{counsel}"}
    gutter: 21.6
    above: 27.6
  - {text: "Dated: {date}", above: 27.6}
# FRCP 11(a), LR 5.1.1(a): the signature, Delaware counsel's name, bar number, address, telephone and e-mail under the
# signature line: single lines in a column from 3.2 inches, "Dated:" at the left of its first line; kept whole with
# the last paragraph.
closing:
  - columns:
      - width: 230.4
        blocks:
          - {text: "Dated: {date}"}
      - blocks:
          - {text: "{signature.firm}"}
          - {text: "/s/ {signature.signer}", above: 13.8}
          - {text: "{signature.lines}"}
    above: 27.6
