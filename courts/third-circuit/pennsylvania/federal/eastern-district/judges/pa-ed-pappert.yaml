checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/pappol.pdf#page=4
  text: If Judge Pappert believes oral argument will be helpful in deciding a matter, he will schedule it, particularly when it involves a dispositive motion. A party desiring oral argument should request it by letter or in the body of the motion or responsive pleading.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/pappol.pdf#page=3
  text: Public policy favors transparency in judicial proceedings. Protective orders and confidentiality agreements undermine such transparency and complicate the resolution of cases at both the trial and appellate level. They should be used sparingly and narrowly tailored. The Court will approve protective orders, confidentiality agreements and stipulated protective orders, where absolutely necessary and for good cause shown. No protective order or confidentiality agreement will be approved without language providing that "the court reserves its inherent power to modify the terms of this agreement and permit the disclosure of information where the interest of justice so requires. Except in exceptional circumstances, documents or evidence that form the basis for judgment in a case are unlikely to be protected against disclosure. The fact that the parties have designated materials or information as confidential pursuant to agreement or stipulated order does not mean that the Court will order filings containing such information placed under seal. The public has a presumed right of access to judicial records and documents. Any party wishing to shield such records and documents from public view must prove why the interest in secrecy outweighs the presumption of public access. See Gratz Coll. v. Synergis Educ. Inc., 2015 WL 9582743 (E.D. Pa Dec.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/pappol.pdf#page=1
  text: 'Any attorney or pro se party who uses generative artificial intelligence (“A.I.”) to prepare any complaint, answer, motion, brief or other paper filed with the Court shall: (1) disclose that generative artificial intelligence was used to prepare the filing; (2) identify precisely what portion or portions of the document contain the generated content; (3) identify the specific tool used and how it was used; and (4) certify that each any every citation to the law or the record in the filing was verified as accurate in accordance with the obligations set forth in Rule 11 of the Federal Rules of Civil Procedure. Failure to do so may result in referral to this Court’s Disciplinary Committee and /or appropriate state bar, striking the filings from the docket, the imposition of monetary sanctions or any other sanction the Court deems appropriate.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/pappol.pdf#page=2
  text: Parties are expected to adhere to all dates contained in the Scheduling Order unless there is a compelling reason to justify a change. Counsel should advise the Court immediately of any compelling reason justifying an extension or continuance of any scheduled date. Circumstances which do not constitute compelling reasons for the extension of a scheduled date include, but are not limited to, settlement negotiations, scheduling difficulties in the "summer months," counsel's obligations in other cases and not diligently conducting discovery prior to the request for an extension. Such a request may be made by letter, describing in detail the basis for the request, noting the agreement or disagreement of all other counsel and setting forth the period of delay requested. A request for an extension or continuance of the date on which the case is listed for trial or the deadline for filing dispositive motions will rarely be granted and will only be considered in extraordinary circumstances.
