  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/slopol2.pdf#page=1
  text: 'Correspondence regarding the following is permitted, provided the letter states that counsel agrees or disagrees with the request: When counsel are specifically requested by the Court to communicate some information to the Court by letter; When there is an uncontested request for a continuance of the Rule 16 Scheduling Order deadlines not affecting the dates for filing a summary judgment motion and trial; When the participation of counsel in the case is expected to be affected by an unanticipated personal matter concerning counsel, a party, a witness or counsel''s immediate family, such as medical problems, vacation plans or other personal problems; or, To confirm or advise the Court that a case has been settled, dismissed or otherwise finally disposed. Counsel should not send copies of correspondence among and between counsel'
