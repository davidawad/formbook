  text: We order argument on motions when it will be helpful. Requests for argument will almost certainly be granted when the request indicates that a junior lawyer will have a speaking role. Thoughtful illustrative aids (timelines, highlighted copies of key documents, photographs, etc.) are very welcome. Slides containing caselaw quotations are of little value.
