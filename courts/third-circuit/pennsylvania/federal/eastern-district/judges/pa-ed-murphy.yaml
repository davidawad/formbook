- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/murpol.pdf#page=4
  text: 'Judge Murphy will not enter a discovery protective order on confidentiality in a civil case unless statutorily required or for demonstrated good cause, but will enforce private confidentiality agreements as a matter of contract law. ... Unless it is an emergency, documents may not be filed under seal in a civil case absent leave. Before attempting to file documents under seal, parties should carefully consider whether the purportedly confidential information could simply be omitted, redacted, or made available upon request because it is unessential. That often-overlooked approach avoids the need to justify sealing. For example, complaints should almost never be filed under seal. A party seeking to file documents under seal should follow this procedure: (i) Well ahead of any applicable deadline, move to file under seal, proposing sealed material as narrowly as possible and articulating good cause consistent with applicable precedent. The motion to file under seal should be filed on the public docket by ECF. Any unredacted documents accompanying the motion should be contemporaneously e-mailed to chambers. The moving party should indicate the consent of opposing counsel. (ii) If the motion to file under seal is granted, file the complete, unredacted versions of the documents under seal by ECF on the docket (observing appropriate deadlines). Consistent with representations made when seeking leave to file under seal, and any related order, counsel should highlight the non-public portions of sealed documents. (iii) Within 30 days of the filing under seal (or as otherwise ordered), file thoughtfully and narrowly redacted, public versions of the same documents by ECF on the docket. Documents filed under seal should be filed appropriately using ECF. Any documents filed under seal should also be sent to chambers in the same manner as courtesy copies (see section 10, below). Paper copies will not be accepted.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/murpol.pdf#page=2
  text: Requests for extensions of time must be made by motion or stipulation filed by ECF (and not sent to the Clerk of Court, e-mailed to chambers, or requested by telephone). [...] Lack of diligence generally defeats good cause. Trial dates certain will not be continued absent an emergency on the criminal docket or a truly extraordinary justification. All requests must be made at least 7 days before the closest relevant deadline or, if made within 7 days, must further justify the last-minute request.
  unverified_sentences: 1
