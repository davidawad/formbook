- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/diapol.pdf#page=1
  text: In accordance with Local Rule 5.1.2, I require that the Parties file electronically all documents via Electronic Case Filing. The Parties shall file all stipulations and proposed orders on the docket via ECF. Stipulations and proposed orders should not be delivered to the Clerk of Court.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/diapol.pdf
  text: Chambers copies shall be printed single sided on opaque white paper of high quality. If documentary evidence in support of or in opposition to a motion exceeds 50 pages, the evidence shall be delivered to Chambers in hard copy. The documents shall be placed in a three-ring binder, with an index and with each item of evidence separated by tab dividers on the right side. Counsel shall ensure that all documents are legible. Parties need not submit courtesy copies of cases that are available on Lexis or Westlaw with their motion papers.
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/diapol.pdf
  text: A motion to continue or extend the date of any matter or deadline must be supported by a detailed declaration demonstrating good cause for the continuance. The motion must also indicate whether there have been previous requests for continuances or extensions and whether I have granted or denied those requests. Counsel shall include proposed orders when requesting continuances or extensions. Counsel must submit any request for a continuance or extension no later than five (5) business days before the scheduled date. Requests submitted after that time shall be denied absent a showing of compelling circumstances (e.g., serious bodily injury or illness). All requests must be filed via ECF.
  unverified_sentences: 1
