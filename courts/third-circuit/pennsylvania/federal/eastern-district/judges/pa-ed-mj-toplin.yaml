- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/eltpol.pdf#page=2
  text: Counsel will have substantial input in the setting of dates in the Rule 16 Order; Judge Toplin expects counsel to comply with the dates set out in that Order. Extensions will be entertained upon a good cause showing that the progress of the case circumstances has been hampered by circumstances beyond the reasonable Should such circumstances arise, Judge Toplin requires a letter brief requesting an extension. Settlement conferences are scheduled by order of the Court and are not Counsel and participants should make all efforts to be available for Due to the large number of cases scheduled for settlement conferences, any need to reschedule the conference could cause a delay of that conference for several weeks. For this reason, any continuance requests should be made within fourteen (14) days of receipt of the notice scheduling the conference. Continuance requests will only be granted for the most compelling reasons.
