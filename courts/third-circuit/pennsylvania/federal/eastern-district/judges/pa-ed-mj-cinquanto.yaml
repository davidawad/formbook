- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cgcpol.pdf#page=1
  text: Parties are expected to adhere to all deadlines that the Court has implemented by scheduling order or that are otherwise established by rule or statute absent a compelling reason to justify a change. If a party believes a compelling reason exists for an extension or a continuance, Counsel shall request a new deadline or date in advance of the originally scheduled date via email (to Chambers_of_Magistrate_Judge_ Goldner_Cinquanto@paed.uscourts.gov). The request shall describe the basis for the request in detail, state whether all other parties agree or disagree with the request, and identify a suggested new deadline(s) or date(s).
