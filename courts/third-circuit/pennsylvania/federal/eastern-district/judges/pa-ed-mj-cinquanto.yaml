- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cgcpol.pdf#page=7
  text: Except in emergency situations, documents should not be filed under seal without first obtaining leave of court. Any motion for leave to file under seal, including any motion for a proposed confidentiality/protective order that would permit a party to file any material under seal, must articulate, clearly and specifically, why the moving party's "interest in secrecy" outweighs the "presumptive right of public access. Avandia, 924 F.3d at 672. [...] Id. Judge Goldner Cinquanto will not grant a motion for leave to file under seal that fails to identify the movant's interests in nondisclosure with specificity. Even when Judge Goldner Cinquanto grants a motion for leave to file under seal, she will generally still expect the parties to file redacted versions of the sealed documents on the public docket unless the redactions would be so extensive as to render the document unreadable.
