- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/scmpol.pdf
  text: Continuance requests must be put in writing via email only. The parties shall not file motions seeking continuances of deadlines. The court will grant a continuance or extension based on a stipulation of all parties if the continuance or extension does not affect the discovery cutoff or trial date. All stipulations shall be submitted directly to chambers via email and shall contain a signature and date line for Judge Schmehl to approve the stipulation. If a continuance or extension will affect the discovery cutoff or trial date, counsel should make a written request via email which sets forth the basis for the continuance or extension and indicates whether the other party or parties agree to or oppose the request.
