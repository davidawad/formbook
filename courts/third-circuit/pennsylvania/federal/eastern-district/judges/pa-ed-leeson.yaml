- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/leepol.pdf#page=9
  text: If the Court determines that oral argument will be helpful in deciding a matter, the Judge will schedule it. A party desiring oral argument should request it by letter or in the body of the motion or responsive pleading. Counsel are encouraged to bring their clients to oral argument on dispositive motions.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/leepol.pdf#page=9
  text: A proposed order shall accompany each motion or other request for relief. The order shall be formatted for the Judge's signature (for example, do not include the word "proposed" in the text of the order). All motions shall be accompanied by a Certificate of Concurrence or Non-Concurrence.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/leepol.pdf#page=4
  text: Courtesy copies should not be provided to chambers unless specifically required by the Court.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/leepol.pdf#page=10
  text: A party who seeks to file a document (or portions thereof) under seal must file a motion for permission to file the document under seal.
