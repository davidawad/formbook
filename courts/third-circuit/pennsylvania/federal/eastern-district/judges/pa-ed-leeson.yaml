- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/leepol.pdf#page=13
  text: Counsel must immediately notify the Court upon learning of any unavoidable and compelling professional or personal conflicts affecting the trial schedule. Requests for continuances are strongly discouraged and rarely granted. Counsel must present good cause for the request. A continuance must be sought as soon as possible. Requests for continuances must be in writing and should be e-mailed to chambers with a copy to opposing counsel. If the scheduling conflict pertains to another court matter, counsel is required to identify the other court, the caption of the other case, the presiding judge in the other case, and the docket number of the other case. A formal motion is not required.
