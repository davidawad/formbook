checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/hodpol.pdf#page=5
  text: A party desiring oral argument should request it by letter or in the body of the motion or responsive pleading. If Judge Hodge believes oral argument will be helpful in deciding a matter, she will schedule it, particularly when it involves a dispositive motion. Not all requests for oral argument will be granted but will be determined by the judge on a case-by-case basis.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/hodpol.pdf#page=2
  text: Proposed orders should be attached to corresponding motions or memoranda of law. Submission of pleadings, motions, or other filings to Chambers by any method other than ECF is not permitted. Except as expressly provided in Section I.C. Stipulations (above), the Court will not act on any submission that has not been docketed.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/hodpol.pdf#page=2
  text: Parties must provide one (1) courtesy copy to the Court of any document submitted which is twenty-five (25) pages or more, including exhibits. The exhibits in the Court's courtesy copy shall be printed double-sided and clearly marked, tabbed, and bound in a 3-ring binder. Courtesy copies should be delivered by first-class mail or other delivery service. Courtesy copies will not be accepted via email.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/hodpol.pdf#page=7
  text: 'Judge Hodge will only consider entry of stipulated confidentiality or sealing orders if the parties demonstrate that "good cause" exists pursuant to Fed. R. Civ. P. 26(c)(1)(G). See Pansy v. Borough of Stroudsburg, 23 F.3d 772, 786 (3d Cir. 1994). All such orders must contain the following language (or language substantially similar): "The Court retains the right to allow disclosure of any subject covered by this stipulation or to modify this stipulation at any time in the interest of justice.'
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/hodpol.pdf#page=3
  text: 'Artificial Intelligence: Anyone—counsel or pro se litigant—using Generative Artificial Intelligence (“GAI”) in connection with the filing of a pleading, motion, or paper in this Court or the serving/delivering of a request, response, or objection to discovery must comply with Rule 11(b) and Rule 26(g) of the Federal Rules of Civil Procedure, and any other relevant rule, including all applicable ethical rules.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/hodpol.pdf#page=4
  text: Where compelling circumstances exist, counsel may request an extension of a filing or other deadline. Extension requests should be made by letter sent via email and counsel requesting the extension shall include the basis for the request and state the position of opposing counsel. Any counsel opposing the extension shall submit a responsive letter via email setting forth the reasons for opposition. All requests for extension MUST include a proposed order. Counsel may not extend any deadlines without Court approval. An email request without a letter attached will not be considered. Since trial and hearing dates are set in advance, Judge Hodge is extremely reluctant to grant continuances especially if the attorneys have not been diligent in moving the case forward. However, the Court will consider such continuance requests upon a showing of compelling circumstances and good cause.
