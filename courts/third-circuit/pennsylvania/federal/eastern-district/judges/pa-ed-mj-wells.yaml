- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/wlspol.pdf#page=3
  text: Judge Wells encourages counsel to develop confidentiality agreements, when appropriate. However, she rarely will entertain stipulated confidentiality orders submitted for court approval.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/wlspol.pdf#page=2
  text: Judge Wells' general policy on continuances for briefing schedules, oral arguments, evidentiary hearings, and discovery deadlines is to be flexible during the initial stages of litigation, but strict as the trial date approaches. Judge Wells does not impose any specific requirement as to how far in advance of a scheduled event counsel must request a continuance or extension. However, she expects such a request to be made as soon as the need becomes apparent and sufficiently in advance for the court to schedule a matter. A joint continuance or extension request of the parties may be made by letter or conference call. A contested request for a continuance or extension of a court-ordered deadline should be in a letter (faxed to chambers) or requested via formal motion.
