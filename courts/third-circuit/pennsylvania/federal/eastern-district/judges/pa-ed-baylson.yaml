- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/baypol.pdf#page=11
  text: Counsel in any case may request oral argument on a pending motion. Judge Baylson usually schedules oral argument on dispositive motions, or where the issues are complex and there is no controlling appellate decision. Counsel are often sent questions in advance of argument and, if so, counsel shall prepare to present their responses at the argument but shall not submit any written material in advance of the argument. Judge Baylson encourages counsel to allow junior attorneys who have worked on the briefs to participate in the oral argument. Oral argument may be requested or may be required by the Court.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/baypol.pdf#page=3
  text: Stipulations should be filed on CM/ECF and should contain a signature block for the judge to sign it as an Order, if approved.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/baypol.pdf#page=1
  text: If Pleadings/Motions are accompanied by lengthy (exceeding 20 pages) or multiple Exhibits, a paper copy of the Pleadings with Exhibits, bound and appropriately tabbed, must be mailed or delivered to Chambers. Courtesy copies may not be e-mailed to Chambers.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/baypol.pdf#page=1
  text: The Preliminary Pretrial Conference will take approximately 10 minutes. If it is truly impossible for trial or associate counsel to attend the Preliminary Pretrial Conference, please call Chambers to reschedule. If counsel determine that a change in the Scheduling Order is necessary, they should attempt to agree on new dates and submit a letter or Stipulation to that effect, following the format of the Court’s original Scheduling Order. If there is no agreement, a telephone conference should be requested. Telephone calls to law clerks are discouraged. Law clerks are not permitted to render advice and have no authority to grant continuances or to speak on behalf of the Court. All scheduling matters should be discussed with the Deputy Clerk.
