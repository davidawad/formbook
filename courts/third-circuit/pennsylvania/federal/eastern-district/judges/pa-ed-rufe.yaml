- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/rufpol.pdf#page=5
  text: Judge Rufe regularly decides motions on the papers, but will hear oral argument when she determines that it will assist in the resolution of a motion.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/rufpol.pdf#page=2
  text: Proposed orders should be attached to corresponding motions or memoranda of law. Transmittal of pleadings, motions, or other filings to Chambers instead of by ECF is not permitted.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/rufpol.pdf#page=5
  text: Unless specifically requested to do so, counsel should not send paper courtesy copies. Counsel may send courtesy copies by email, but it is not necessary.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/rufpol.pdf#page=3
  text: 'Judge Rufe will not enter a protective order on confidentiality in a civil case unless statutorily required or for demonstrated good cause, but will enforce private confidentiality agreements as a matter of contract law. Protected material may only be filed under seal pursuant to a court order authorizing the sealing of the specific material at issue. If a party''s request to file material under seal is denied by the Court, then the party may file the information in the public record unless otherwise instructed by the Court. The Court retains the right to allow disclosure of any subject covered by this order or to modify this order at any time in the interest of justice. Unless it is an emergency, documents may not be filed under seal in a civil case absent leave. Before attempting to file documents under seal, parties should carefully consider whether the purportedly confidential information could simply be omitted, redacted, or made available upon request because it is of little or no relevance. A party seeking to file documents under seal should follow this procedure: (i) Well ahead of any applicable deadline, move to file under seal, proposing sealed material as narrowly as possible and articulating good cause consistent with applicable precedent. The motion to file under seal should be filed on the public docket by ECF. Any unredacted documents accompanying the motion should be contemporaneously emailed to chambers. The moving party should indicate the consent of opposing counsel. (ii) If the motion to file under seal is granted, file the complete, unredacted versions of the documents under seal by ECF on the docket (observing appropriate deadlines). Consistent with representations made when seeking leave to file under seal, and any related order, counsel should highlight the non-public portions of sealed documents. (iii) Within 30 days of the filing under seal (or as otherwise ordered), file thoughtfully and narrowly redacted, public versions of the same documents on the docket. Documents filed under seal should be filed appropriately using ECF.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/rufpol.pdf#page=6
  text: Any request for a continuance must be filed no later than 14 days in advance of the scheduled trial date. Requests for a continuance must be filed as motions stating the reasons for the request. Any such motion must be accompanied by a proposed form of Order which, if approved by the Court, would grant the relief sought by the motion. The proposed form of Order must be consistent with the requirements of the Speedy Trial Act, 18 U.S.C. § 3161(h)(7), and include a proposed finding that explains in reasonable detail why the ends of justice served by granting the requested continuance outweigh the best interest of the public and the defendant in a speedy trial. Requests by letter are not permitted.
review:
- (of one kind of motion) Under the alternative method, Motions for Summary Judgment under Rule 56 shall not exceed five double-spaced pages.
- (of one kind of motion) Under the traditional method, a moving party’s Memorandum of Law in support of its Motion for Summary Judgment shall not exceed 25 double-spaced pages.
- Any Sur-Reply memoranda shall not exceed 10 double-spaced pages.
- 'pages.opposition (two values): Memoranda in support of such motions and responses shall not exceed 15 double-spaced pages.'
- 'pages.opposition (two values): The non-moving party’s Response memorandum shall not exceed 25 double-spaced pages.'
- 'pages.reply (two values): Any Reply or Sur-Reply shall not exceed 10 pages, and may be filed without leave of Court.'
- 'pages.reply (two values): Likewise, the moving party’s Reply memorandum shall not exceed 25 double-spaced pages.'
- 'pages.reply (two values): Reply and Sur-Reply memoranda may be filed without leave of Court and shall not exceed 10 double-spaced pages.'
