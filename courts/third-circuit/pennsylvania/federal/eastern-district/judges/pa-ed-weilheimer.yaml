checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/weipol.pdf#page=8
  text: Oral argument will be scheduled by Chambers when it is beneficial to the Court. Parties may request oral argument, but the Court will frequently decide a motion on the papers even where such a request is made.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/weipol.pdf#page=7
  text: When the total number of pages in the exhibits/attachments to any filing exceeds 20 pages, within 48 hours of the docketing of the filing, one hard copy of the exhibits is to be provided to Chambers. If the provided attachments are for more than two exhibits, the documents should be placed in a binder, tabbed with a table of contents that corresponds to the related pleading.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/weipol.pdf#page=6
  text: Judge Weilheimer will consider entry of a stipulated confidentiality or sealing orders if the parties demonstrate that "good cause" exists pursuant to Fed. R. Civ. P. 26(c)(1)(G). The Court retains the right to allow disclosure of any subject covered by this stipulation or to modify this stipulation at any time in the interest of justice. Where a confidentiality order which covers the duration of litigation has already been entered by the Court, filings which include information subject to that confidentiality order may be filed under seal without the filing of a separate motion to seal. If no such confidentiality order has been entered, any filing placed under seal must be accompanied by a contemporaneous motion to seal. Within seven days of the docketing of anything filed under seal (or, in the case of a motion, within seven days of the close of briefing on a given motion), a filing party of any sealed submission shall publicly file a redacted version of the filing(s).
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/weipol.pdf#page=5
  text: Subject to the limited exceptions below, requests for extensions, including joint and uncontested requests, must be submitted to this Court by filing a motion on the docket. Even with the agreement of all parties, good cause must be shown for the Court to consider a request to extend any deadlines provided in the Scheduling Order. Requests for extension should be made as far in advance as possible. Requests made on the date of the deadline will typically be denied, absent good cause that arose on the day of the deadline. The parties may jointly stipulate to extend the time to Answer or make a motion with respect to an initial Complaint by no more than 30 days. Such joint stipulation should be filed on the docket with a signature line provided for the judge. The parties may also jointly agree to extend discovery deadlines provided such agreement does not alter the dispositive motion deadline. This type of agreement need not be filed with the Court.
