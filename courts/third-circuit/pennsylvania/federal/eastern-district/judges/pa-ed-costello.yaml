checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cospol.pdf#page=1
  text: In civil cases, Judge Costello will schedule oral arguments and evidentiary hearings when warranted. In criminal cases, Judge Costello will generally permit oral argument on a substantive motion upon request.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cospol.pdf#page=3
  text: All grounds for relief must be set forth in a single comprehensive motion, accompanied by a proposed order, and an attached memorandum. Parties opposing the motion must attach a proposed order referring to the motion.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cospol.pdf#page=3
  text: The Court will approve protective orders, confidentiality agreements and stipulated protective orders, where absolutely necessary and for good cause shown. No protective order or confidentiality agreement will be approved without language providing that "the Court reserves its inherent power to modify the terms of this agreement and permit the disclosure of information where the interest of justice so requires. Except in exceptional circumstances, documents or evidence that form the basis for judgment in a case are unlikely to be protected against disclosure. The fact that the parties have designated materials or information as confidential pursuant to agreement or stipulated order does not mean that the Court will order filings containing such information placed under seal. The public has a presumed right of access to judicial records and documents. Any party wishing to shield such records and documents from public view must prove why the interest in secrecy outweighs the presumption of public access. See In re Avandia Mktg., Sales Practices & Prod. Litig., 924 F.3d 662, 671-73 (3d Cir. 2019).
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cospol.pdf#page=2
  text: Parties are expected to adhere to all dates contained in the Scheduling Order unless there is a compelling reason to justify a change. Counsel should advise the Court immediately of any compelling reason justifying an extension or continuance of any scheduled date. Such a request may be made by letter, describing in detail the basis for the request, noting the agreement or disagreement of all other counsel and setting forth the period of delay requested. A request for an extension or continuance of the date on which the case is listed for trial or the deadline for filing dispositive motions will rarely be granted and will only be considered in extraordinary circumstances.
