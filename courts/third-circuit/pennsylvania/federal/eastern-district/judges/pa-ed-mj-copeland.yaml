checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kmcpol.pdf#page=3
  text: Judge Copeland will schedule oral argument on motions if it appears likely to be helpful to the Court’s resolution of the matter. Counsel may request oral argument if considered appropriate.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kmcpol.pdf#page=3
  text: Judge Copeland requires a courtesy copy of all motion papers to be sent directly to chambers via email. If exhibits are over twenty (20) pages, a hard copy must be sent to chambers.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kmcpol.pdf#page=1
  text: Judge Copeland will approve confidentiality or sealing orders consistent with applicable legal standards. See, In re Avandia Mktg., Sales Practices & Prods. Litig., 924 F.3d 662 (3d Cir. 2019).
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kmcpol.pdf#page=2
  text: Counsel will have substantial input in the setting of dates in the Rule 16 Order; Judge Copeland expects counsel to comply with the dates set out in that Order. Extensions will be entertained upon a good cause showing that circumstances beyond the reasonable expectation of counsel have hampered the progress of the case. Judge Copeland requires a letter brief requesting an extension. Settlement conferences are scheduled by order of the Court and are not discretionary. Counsel and participants should use all efforts to be available for this conference. Due to the large number of cases scheduled for settlement conferences, any need to reschedule the conference could cause a delay of that conference for several weeks. For this reason, any continuance requests should be made within fourteen (14) days of receipt of the notice scheduling the conference. Continuance requests will only be granted for the most compelling reasons.
