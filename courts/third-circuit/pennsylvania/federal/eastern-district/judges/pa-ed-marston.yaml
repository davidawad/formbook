checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/marpol.pdf#page=14
  text: If the Court determines that oral argument will be helpful in deciding a matter, Judge Marston will schedule it, particularly when it involves a dispositive motion. A party desiring oral argument should request it by letter or in the body of the motion or responsive pleading. The Court is likely to hear oral argument on dispositive motions, or if either party requests oral argument.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/marpol.pdf#page=11
  text: Contrary to Local Civil Rule 5.1.2(10), all stipulations and proposed orders must be e-mailed to Chambers rather than sent to the Clerk of Court.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/marpol.pdf#page=15
  text: The Court generally does not require courtesy copies, with the following two exceptions. First, for any filings made under seal, the filing party shall send a courtesy copy via e-mail to Chambers the same day as the filing. Second, for any motions with more than five (5) or more than fifty (50) pages of exhibits, the parties shall provide the Court with a courtesy copy of the exhibits within two (2) days of filing. Courtesy copies should be submitted as a hard copy and on a thumb drive.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/marpol.pdf#page=12
  text: 'The Court will only grant motions to seal upon good cause shown. When submitting a proposed order for the Court''s approval, the order must contain the following language: "The Court retains the right to allow disclosure of any subject covered by this stipulation or to modify this stipulation at any time in the interest of justice.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/marpol.pdf#page=10
  text: Parties are expected to adhere to all dates contained in the Scheduling Order and set by the Federal Rules unless there is a compelling reason to justify a change. Counsel should advise the Court immediately of any compelling reason justifying an extension or continuance of any scheduled date. Such a request may be made by letter, describing in detail the basis for the request, noting the agreement or disagreement of all other counsel and setting forth the period of delay requested. A request for an extension or continuance of the date on which the case is listed for trial or the deadline for filing dispositive motions will rarely be granted and will only be considered in extraordinary circumstances. Any such request for an extension or continuance must be made at least seven (7) days before the applicable deadline or include a showing of good cause as to why the party making the request could not comply with that requirement.
review:
- Opening briefs in support of and in opposition to a motion shall not exceed twenty-five (25) double-spaced pages.
- Replies and sur-replies must be limited to ten (10) and seven (7) pages, respectively.
