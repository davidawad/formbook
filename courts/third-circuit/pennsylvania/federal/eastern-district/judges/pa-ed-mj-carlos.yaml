- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/carpol.pdf#page=5
  text: Considering that counsel will have substantial input in the setting of dates in the Rule 16 Order, Judge Carlos expects counsel to comply with the dates set out in that Order. Judge Carlos will generally not agree to a request to extend the dispositive motion or Daubert deadlines or trial dates. Extensions will be entertained upon a showing that circumstances beyond the reasonable expectation of counsel have hampered the progress of the case. Judge Carlos will require a formal motion seeking an extension together with a proposed order and certification of concurrence or objection of all counsel or unrepresented parties. In most cases, extensions will only be considered after a conference with the Judge.
