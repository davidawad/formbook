- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/henpol.pdf#page=5
  text: Parties are not permitted to file documents under seal without leave of the Court, unless an emergency arises. Judge Henry will permit parties to file documents under seal or with redactions only after a showing of good cause or presentation of an enforceable private confidentiality agreement contracted prior to litigation. Parties cannot stipulate to sealing documents to avoid showing good cause. The Court reserves its inherent power to modify the terms of this Order and permit the disclosure of information in the interest of justice. If the Court orders that a document be filed under seal, a redacted copy of the document must be filed, unless the Court's order specifies otherwise, or redaction would render the document unreadable.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/henpol.pdf#page=3
  text: Parties who use Artificial Intelligence in preparing papers filed with the Court must declare the use of AI, which AI was used and must certify that the signer checked that all cited authorities are proper.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/henpol.pdf#page=2
  text: Continuance requests for motions and discovery deadlines, hearings, and trial must be filed in the form of a motion. Joint continuance requests must be filed as a joint motion and include a proposed order. If a party files a motion for a continuance, all other parties have three (3) business days to file an opposition, which must state the reasons for the opposition. A joint request for a continuance related to discovery may be filed in the form of a motion or as a joint stipulation. Judge Henry will generally grant joint discovery continuance requests if (1) they do not impact key motions deadlines or trial dates, and (2) they are made at least seven (7) business days before the scheduled deadline. Judge Henry seldom grants continuances that will impact (1) motion deadlines in which oral argument has been scheduled or (2) trial dates. Such continuance requests must be made at least fourteen (14) business days before the applicable deadline or trial date, and they must provide good cause.
