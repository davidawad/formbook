  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cmspol.pdf#page=1
  text: Judge Straw will approve confidentiality or sealing orders consistent with applicable legal standards. See, In re Avandia Mktg., Sales Practices & Prods. Litig., 924 F.3d 662 (3d Cir. 2019).
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/cmspol.pdf#page=2
  text: Counsel will have substantial input in the setting of dates in the Rule 16 Order, Judge Straw expects counsel to comply with the dates set out in that Order. Extensions will be entertained upon a good cause showing that circumstances beyond the reasonable expectation of counsel have hampered the progress of the case. Judge Straw requires a letter brief requesting an extension.
