- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/mchpol.pdf#page=3
  text: 'See Pansy v. Borough of Stroudsburg, 23 F.3d 772, 784 (3d Cir. 1994). Protective orders and confidentiality agreements undermine such transparency and complicate the resolution of cases at both the trial and appellate level. They should be used sparingly and narrowly tailored. No protective order or confidentiality order will be approved without language providing that "the court reserves its inherent power to modify the terms of this agreement and permit the disclosure of information where the interest of justice so requires. Except in exceptional circumstances, documents or evidence that form the basis for judgment in a case are unlikely to be protected against disclosure. Any Stipulation for Protective Order is to be emailed to Chambers at: Chambers_of_Judge_Gerald_McHugh@paed.uscourts.gov.'
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/mchpol.pdf#page=1
  text: The vast majority of discovery disputes should be settled by the parties through civility and common sense. Judge McHugh expects the parties to have met and conferred in good faith before submitting a discovery dispute. He no longer permits counsel to submit such disputes by letter; a motion must be filed. If a dispute arises during a deposition, counsel are invited to call Chambers in the event that the Judge is available to supply an immediate ruling.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/mchpol.pdf
  text: 'Routine extensions as a courtesy to opposing counsel, particularly at the outset of a case, are encouraged but do require court approval. If counsel agree to extend a specific deadline, they should email a Stipulation to Chambers and cite these Guidelines. Such Stipulations will be honored unless they are patently unreasonable and interfere with the orderly progress of the case. Any Stipulation that requires court approval is to be emailed to Chambers at: Chambers_of_Judge_Gerald_McHugh@paed.uscourts.gov.'
  unverified_sentences: 1
