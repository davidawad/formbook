checklist:
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/keapol.pdf#page=14
  text: All grounds for relief must be set forth in a single, comprehensive motion, accompanied by a proposed order and an attached memorandum. The proposed order should specifically refer to the motion, docket filing number, and specific basis for requested relief. The motion is limited to five pages of double-spaced twelve-point font and is analogous to a Summary of Argument which also details the requested relief. Parties opposing the motion must attach a proposed order referring to the motion, docket filing number, and specific basis for denying the requested relief.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/keapol.pdf#page=5
  text: Courtesy copies shall only be provided to Chambers for a filing over thirty-five pages and as required under these Policies (e.g. Rule 56 papers) or otherwise requested by Chambers. The courtesy copy shall be the ECF document with the ECF notation at the top of each page, unless otherwise ordered. All courtesy copies are to be delivered to the Clerk's Office to the attention of Judge Kearney contemporaneous (as best as possible) with filing.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/keapol.pdf#page=5
  text: Any party seeking to file documents under seal must comply with the Court's Standing Order when timely filing the motion to seal (under Section IV below) before filing the substantive motion (unless impossible due to time exigencies) as narrowly as possible, articulate good cause consistent with our Court of Appeals' precedent, contemporaneously file the sealed records under a "Notice of Sealed Documents in support of [requested relief]" by emailing to ECF_Documents@paed.uscourts.gov, and contemporaneously email the documents sought to be sealed to our Chambers. [...] Judge Kearney will not enter a protective order on confidentiality during discovery unless statutorily required but will enforce private confidentiality agreements as a matter of contract law for good cause shown.
  unverified_sentences: 1
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/keapol.pdf#page=6
  text: Filings referencing a website shall attach a screenshot of the cited website reference as an exhibit. Parties and counsel may be subject to sanction should we find false representations including artificial intelligence hallucinations under the Rules of Professional Conduct and Rules of Civil and Criminal Procedure. Parties and counsel are on notice to double-check their citations and reliance on artificial intelligence in a filing to ensure the arguments and citations to authority say what you represent to the Court.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/keapol.pdf#page=11
  text: Unless there is demonstrated good cause in writing to justify a change, the parties are expected to adhere to the schedule contained in Orders setting obligations or, absent an Order, the default dates in the Federal or Local Rules. A request for an extension or continuance of the trial date will not be granted absent extraordinary circumstances. Judge Kearney may approve a timely stipulation for a continuance or extension if the continuance or extension upon a showing of good cause and if it does not affect the trial date. If a non-incarcerated party opposes a continuance or extension, the movant may move under Section III.B below identifying the basis for the continuance or extension and detail the positions of other parties with a proposed order.
