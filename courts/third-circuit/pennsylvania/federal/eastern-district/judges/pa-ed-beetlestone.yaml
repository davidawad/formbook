checklist:
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/beepol.pdf#page=6
  text: 'Time to Respond to Rule 12(b) and Rule 56 Motions: For cases pending before Judge Beetlestone, parties have twenty-one (21) days after service of a motion to dismiss under Federal Rule of Civil Procedure 12(b) or a motion for summary judgment under Federal Rule of Civil Procedure 56 to file their response.'
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/beepol.pdf#page=2
  text: 'Oral Arguments and Evidentiary Hearings: Judge Beetlestone does not set aside certain days or times for oral argument, motions, or evidentiary hearings. Hearings and argument are scheduled when requested or warranted. Oral Argument on Motions: Judge Beetlestone schedules oral argument on motions when requested and/or when she believes it may be helpful in the Court''s decision-making process.'
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/beepol.pdf#page=3
  text: 'Courtesy Copies: Counsel should send one (1) courtesy copy of any motion, brief, or memorandum that exceeds (10) pages in length to chambers at the time of filing. Courtesy copies should be printed double-sided in a three-ring binder, with dividers between the exhibits.'
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/beepol.pdf#page=6
  text: 'Confidentiality Agreements: The Court will only approve confidentiality or sealing orders for good cause shown. See Pansy v. Borough of Stroudsburg, 23 F.3d 772 (3d Cir. 1994); In re: Avandia Marketing Sales Practices and Products Liability Litig, 924 F.3d 662 (3d Cir. 2019). All such orders must contain the following language or language substantially similar: "The court may order disclosure of any subject covered by this stipulation or modify this stipulation at any time in the interest of justice.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/beepol.pdf#page=5
  text: 'Continuances and Extensions: Where compelling circumstances so require, counsel may request an extension of a filing or other deadline. If the request is for an extension or continuance of the trial date, discovery deadline, or the deadline for filing dispositive motions, it must be made sufficiently prior to the due date to allow time for the Court to consider it. Judge Beetlestone will extend the deadline for filing dispositive motions or a trial date only in very limited circumstances and where genuinely necessary. If a request for an extension is unopposed, counsel must so state and may submit the request via letter or joint stipulation. Opposed requests must so state and be filed as a motion. Continuances: Requests for continuances are strongly discouraged. In civil cases, counsel must have good cause for the request. If good cause exists, a continuance must be sought as soon as possible. Requests for continuances must be in writing and should be e-mailed to chambers copied to opposing counsel. A formal motion is not required. The party requesting a continuance must present the position of opposing counsel. If opposing counsel opposes the request, the requesting party must set up a conference call with the Court to resolve the matter.'
