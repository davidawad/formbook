- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/galpol.pdf#page=6
  text: Except in emergency situations, no documents may be filed under seal without first obtaining leave. [...] In recognition of the common law right of public access to judicial records, a motion for leave to file under seal must articulate, clearly and specifically, why the moving party's "interest in secrecy" outweighs the "presumptive right of public access. In re Avandia Mktg., Sales Pracs. & Prod. Litig., 924 F.3d 662, 672 (3d Cir. 2019). [...] Even when the Court grants a motion for leave to file under seal, the Court will generally still expect the parties to file redacted versions of the sealed documents on the public docket unless the redactions would be so extensive as to render the document unreadable. The Court will not approve a protective order containing language that gives the parties discretion to file materials under seal without the Court's prior and specific approval.
  unverified_sentences: 2
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/galpol.pdf#page=11
  text: Unless there is good cause to justify a change, the parties are expected to adhere to the dates contained in the scheduling order. The Court will not entertain extension requests that are based on developments that could reasonably have been anticipated at the time of the Rule 16 conference. Parties' failure to conduct discovery in a timely manner is not good cause for an extension or continuance. If an extension does not affect the deadlines for dispositive motions or trial dates, the parties may present their request for an extension via signed stipulation. Pursuant to Local Rule of Civil Procedure 7.4(b)(2), no stipulation of counsel regarding an extension shall be effective until approved by the Court. If an extension will affect the deadline for filing dispositive motions or the trial dates, counsel must make a written request that sets forth the basis for the extension and indicates whether the other parties agree to or oppose the request and proposes amended dates. A request for an extension of the deadline for filing dispositive motions or a continuance of the trial date must be made sufficiently prior to the due date to allow time for the Court to consider it.
review:
- Replies and sur-replies, where granted, must be limited to ten and seven pages, respectively.
