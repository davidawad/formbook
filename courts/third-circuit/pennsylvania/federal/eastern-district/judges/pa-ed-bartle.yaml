- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/barpol.pdf#page=1
  text: Judge Bartle does not set aside specific days or times for oral arguments or evidentiary hearings. Arguments and hearings are scheduled on an ad hoc basis. Judge Bartle does not routinely hear oral argument on motions, but will consider it on request of counsel or if he believes it will assist him in deciding the motion.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/barpol.pdf#page=5
  text: counsel for the aggrieved party shall file with the Court a motion in conformity with Local Civil Rule 26.1(b), with a form of order, and short brief not to exceed five (5) pages describing the disputed issue(s).
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/barpol.pdf#page=4
  text: The originals of all motions and briefs shall be filed with the Clerk. A copy of same shall be delivered to Judge Bartle's chambers, including documents which are submitted using the Electronic Case Filing (ECF) system.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/barpol.pdf#page=5
  text: 'Judge Bartle will approve a confidentiality order if the order includes a detailed statement demonstrating that good cause exists for the protective order. See Pansy v. Borough of Stroudsberg, 23 F.3d 772, 786 (3d Cir. 1994). All such orders must contain the following language or language substantially similar: The court retains the right to allow disclosure of any subject covered by this stipulation or to modify this stipulation at any time in the interest of justice.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/barpol.pdf#page=2
  text: Since trial dates are set well in advance, normally at the time of the initial conference, Judge Bartle is extremely reluctant to grant continuances - especially if the attorneys have not been diligent in moving the case forward. The Court will not accept accommodations counsel may extend to each other during the discovery period as a reason to extend the discovery deadline or the trial date. Judge Bartle will permit extension of discovery deadlines only upon showing of good cause. When counsel become aware of professional or personal conflicts that may affect the trial schedule, they should notify Judge Bartle and opposing counsel immediately.
