checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/scopol.pdf#page=5
  text: Parties may request oral argument in their motions. Judge Scott will grant requests for oral argument only if oral argument would illuminate any aspect of the pleadings or briefs. Judge Scott strongly encourages counsel to consider including junior attorneys for portions of oral argument where appropriate. Counsel intending to present physical exhibits during oral argument shall bring two (2) copies of each exhibit for Judge Scott.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/scopol.pdf#page=2
  text: A courtesy copy must be submitted only if (1) there are large attachments to a motion or (2) a document is filed under seal. A filing has large attachments if the appendices or exhibits attached to the filing exceed 50 pages or there are five (5) or more exhibits. The courtesy copy of a filing with large attachments must be submitted to Judge Scott's Chambers as a binder with tabbed exhibits and an exhibit index.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/scopol.pdf#page=4
  text: Parties are not permitted to file documents under seal without leave of the Court, unless an emergency arises. Judge Scott will permit parties to file documents under seal or with redactions only after a showing of good cause or presentation of an enforceable private confidentiality agreement contracted prior to litigation. Parties cannot stipulate to sealing documents to avoid showing good cause. The Court reserves its inherent power to modify the terms of this Order and permit the disclosure of information in the interest of justice. If the Court orders that a document be filed under seal, a redacted copy of the document must be filed within 14 days, unless the Court's order specifies otherwise, or redaction would render the document unreadable.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/scopol.pdf#page=2
  text: If any attorney for a party, or a pro se party, has used Artificial Intelligence ("AI") in the preparation of any complaint, answer, motion, brief, or other paper, filed with the Court, and assigned to Judge Kai N. Scott, MUST, in a clear and plain factual statement, disclose that AI has been used in any way in the preparation of the filing, and CERTIFY, that each and every citation to the law or the record in the paper, has been verified as accurate.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/scopol.pdf#page=5
  text: Continuance requests for motions and discovery deadlines, hearings, and trial must be filed in the form of a motion and must include a proposed order. Joint continuance requests must be filed as an unopposed motion. If a party files an opposed motion for a continuance, all other parties have three (3) business days to file an opposition, which must state the reasons for the opposition. Judge Scott will generally grant joint discovery continuance requests if (1) they do not alter key motions deadlines or trial dates, and (2) they are made at least seven (7) business days before the scheduled deadline. Judge Scott seldom grants continuances that will alter (1) motion deadlines in which oral argument has been scheduled or (2) trial dates. Such continuance requests must be made at least fourteen (14) business days before the applicable deadline or trial date, and they must provide good cause. Judge Scott no longer permits changes to operative deadlines to be filed as joint stipulations. All parties filing joint stipulations will be instructed to refile the request as a joint, unopposed motion.
review:
- (of one kind of motion) Any dispositive motion and its supporting memorandum of law must not exceed twenty (25) pages.
