checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/padpol.pdf#page=5
  text: If Judge Padova determines that oral argument will aid in deciding the matter, he will order argument or grant a request by counsel to be heard. Requests should be made in writing at the time of filing a motion, response, or reply as part of the moving papers. Judge Padova does not set aside any certain days or times for oral argument on motions or evidentiary hearings.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/padpol.pdf#page=11
  text: Motions requesting a trial continuance should be accompanied by a proposed order in Speedy Trial Act language, containing findings of fact and conclusions that would justify a continuance under the Speedy Trial Act.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/padpol.pdf#page=4
  text: Judge Padova requires that one courtesy copy of motion papers be sent to his chambers. Courtesy copies shall be stapled or neatly bound, with dividers between the exhibits.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/padpol.pdf#page=6
  text: Parties may agree privately to keep documents and information confidential. The Court may enter an Order of Confidentiality only after making a specific finding of good cause based on a particularized showing that the parties’ privacy interests outweigh the public’s right to obtain information concerning judicial proceedings. See Pansy v. Borough of Stroudsburg, 23 F.3d 772, 786 (3d Cir. 1994).
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/padpol.pdf#page=4
  text: Judge Padova has a general policy of adhering to originally scheduled dates unless a compelling reason is presented that justifies a change. This policy applies to briefing schedules, oral argument, evidentiary hearings, discovery deadlines and trial dates. Counsel should advise the Court immediately, and before the date has run, of any compelling reason justifying an extension or continuance of any originally scheduled date. Any request for an extension or continuance shall be made in writing by letter or formal motion for cause shown. If there is an agreement, a stipulation of counsel should be submitted; however, Court approval is required. A letter request is acceptable when there is an uncontested request for a continuance of the Rule 16 Scheduling Order deadlines not affecting the trial date or pool placement; when the continuance of a preliminary pretrial conference is sought; or when there is an uncontested request for an extension of time to respond to a motion. When counsel become aware of professional or personal conflicts that may affect the trial schedule, they should notify Judge Padova and opposing counsel immediately. Such notice may be given to Judge Padova’s deputy by telephone, but it must be confirmed in writing.
