checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/reipol.pdf#page=3
  text: Judge Reid will schedule oral argument on motions if it appears likely to be helpful to the Court's resolution of the matter. Counsel may request oral argument if considered appropriate.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/reipol.pdf#page=3
  text: Judge Reid requires a courtesy copy of all motions papers to be sent directly to Chambers.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/reipol.pdf#page=1
  text: Judge Reid will approve confidentiality or sealing orders for good cause shown. See Pansy v Borough of Stroudsburg, 23 F.3d 772 (3d Cir. 1994). the Court retains the right to allow disclosure of any subject covered by this stipulation or to modify this stipulation at any time in the interest of justice.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/reipol.pdf#page=3
  text: Because counsel will have substantial input in the setting of dates in the Rule 16 Order, Judge Reid expects counsel to comply with the dates set out in that Order. Extensions will be entertained upon a good cause showing that circumstances beyond the reasonable expectation of counsel have hampered the progress of the case. Judge Reid requires a letter brief requesting an extension. In most cases, extensions will only be considered after a conference with the Judge.
