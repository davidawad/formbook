checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/sitpol.pdf#page=2
  text: Judge Sitarski will schedule oral argument on motions if it appears likely to be helpful to the Court's resolution of the matter. Counsel may request oral argument if counsel considers argument appropriate, but the Court will determine whether oral arguments will be heard. Evidentiary hearings will be scheduled by Judge Sitarski's Deputy Clerk in appropriate cases. The Court will endeavor to accommodate the schedules of counsel and witnesses, consistent with the exigency of the matter and the Court's schedule.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/sitpol.pdf#page=3
  text: Judge Sitarski expects a courtesy copy of all motion papers to be sent directly to chambers. Judge Sitarski expects that in most cases, these papers will be submitted by email.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/sitpol.pdf#page=2
  text: Extensions will be entertained upon a showing that circumstances beyond the reasonable expectation of counsel have hampered the progress of the case. Judge Sitarski will not require a formal motion seeking an extension, and will consider requests for extensions brought to the attention of her Deputy Clerk, who will set up either a telephone or chambers conference.
