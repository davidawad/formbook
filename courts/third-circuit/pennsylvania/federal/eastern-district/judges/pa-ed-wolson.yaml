checklist:
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/wolpol.pdf#page=12
  text: Contrary to Local Civil Rule 5.1.2(9), parties must email all stipulations and proposed orders to Chambers rather than filing them on the docket. Parties should submit stipulations and proposed Orders as Word documents.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/wolpol.pdf#page=8
  text: 'Judge Wolson only requires courtesy copies in two circumstances: (1) for any filings made under seal; and (2) for any motions with more than five exhibits. Parties should submit courtesy copies electronically via email to WolsonCourtesyCopy@paed.uscourts.gov and use the case caption, title of the filing, and ECF number in the subject line. Each submission should use the e-filed version that has the CM/ECF system''s header at the top of the page. Each document must either (a) be a separate file, with a file name that is consistent with the descriptive name that the document has on the CM/ECF system or (b) include a coversheet that identifies the corresponding entry on the CM/ECF system. Parties may not submit courtesy copies via Dropbox, FTP, or some other source that requires Judge Wolson to download files to the Court''s system. Instead, files should be emailed, even if that requires multiple emails. Parties also should not submit paper courtesy copies.'
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/wolpol.pdf#page=7
  text: Any party seeking to file material under seal must familiarize itself with the standard set forth in In re Avandia Mktg., Sales Pracs. & Prod. Litig., 924 F.3d 662 (3d Cir. 2019). A party that seeks to file material under seal must file a sealing motion when it files the material that it seeks to seal. Except in emergency situations, a party may not file a document under seal (or redact necessary and/or substantive information) without a contemporaneous motion to seal the specified information (or without a motion filed in advance that identifies specific information to be placed under seal). A party seeking leave to file material under seal must file its motion of record and provide Judge Wolson via email with courtesy copies of all documents that the party proposes to file under seal. In recognition of the common law right of public access, Judge Wolson requires parties to file a redacted version of any sealed document on the public record, unless the redactions would be so extensive as to render the document unreadable. When filing a redacted document, a party must submit to Chambers or file on CM/ECF an unredacted version that highlights any portion that the party proposes to redact. Judge Wolson expects parties to work together when filing motions to seal. That is, if a party seeks to file under seal material that an opponent has marked "confidential," the parties must work together to prepare the required information (such as affidavits or other material necessary to carry the burden of placing material under seal). If a party fails in this obligation, Judge Wolson will consider imposing the costs of additional proceedings (including responses or reconsideration motions necessary to supplement the record) on that party. For any motion or submission in which parties designate more than 10 individual references (that is, separate exhibits or different excerpts of single exhibits) for sealing, Judge Wolson will likely refer the sealing motion to a special master, and Judge Wolson will determine on a case-by-case basis how to split the special master's costs.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/wolpol.pdf#page=19
  text: Judge Wolson is reluctant to grant continuances of trial dates and other scheduled court events and will only do so in extreme circumstances. Judge Wolson will consider other requests for extensions on an appropriate showing of good cause. Requests for continuances or extensions may be made by letter, which can be emailed to Chambers. Any request for a continuance or extension must include the words "request for continuance" or "request for extension," as appropriate, in the subject line of the email. Judge Wolson expects counsel for the party requesting an extension to confer with opposing counsel and state opposing counsel's position in the letter. Any request for an extension or continuance must be made at least seven (7) days before the applicable deadline or include a showing of good cause as to why the Party making the request could not comply with that requirement.
