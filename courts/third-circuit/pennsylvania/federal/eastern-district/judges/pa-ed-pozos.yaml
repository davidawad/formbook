checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/amppol.pdf#page=2
  text: Judge Pozos schedules oral argument on motions when requested and/or when he believes it may be helpful in the Court's decision-making process. Counsel is encouraged to bring clients to oral argument on dispositive motions.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/amppol.pdf#page=4
  text: Contrary to Local Civil Rule 5.1.2(9), parties must file all stipulations, consent decrees and proposed orders via the ECF system, and complex proposed orders, such as scheduling orders in class actions or lengthy discovery orders, should also be e-mailed to chambers in Word version to facilitate editing. Any stipulations, consent decrees, proposed orders or other documents requiring Court approval or signature are not effective unless and until approved by the Court.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/amppol.pdf#page=4
  text: 'Courtesy Copies: The Court generally does not require courtesy copies, with the following two exceptions. First, for any filings made under seal, the filing party shall send a courtesy copy via e-mail to Chambers the same day as the filing. Second, for any motions with more than five (5) or more than fifty (50) pages of exhibits, the parties shall provide the Court with a courtesy copy of the exhibits within two (2) business days of filing. Courtesy copies should be submitted as a hard copy and on a thumb drive.'
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/amppol.pdf#page=8
  text: 'Protective Orders and Confidentiality Agreements: The Court will only approve confidentiality or sealing orders for good cause shown. See Pansy v. Borough of Stroudsburg, 23 F.3d 772 (3d Cir. 1994); In re: Avandia Marketing Sales Practices and Products Liability Litig, 924 F.3d 662 (3d Cir. 2019). All such orders must contain the following language or language substantially similar: "The court may order disclosure of any subject covered by this stipulation or modify this stipulation at any time in the interest of justice.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/amppol.pdf#page=6
  text: 'Where compelling circumstances require, counsel may request an extension of a filing or other deadline. Requests for extensions of time must be made by motion or stipulation filed by ECF (and not sent to the Clerk of Court, e-mailed to Chambers, or requested by telephone). [...] Lack of diligence generally defeats good cause. Judge Pozos will extend the deadline for filing dispositive motions or a trial date only in very limited circumstances and where genuinely necessary. Any request for an extension or continuance must be made at least seven (7) days before the applicable deadline or include a showing of good cause as to why the party making the request could not comply with that requirement. Continuances: Requests for continuances are strongly discouraged. In civil cases, counsel must have good cause for the request. If good cause exists, a continuance must be sought as soon as possible by motion filed via ECF, and stating whether the request is opposed or unopposed.'
