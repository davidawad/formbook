  text: Judge Younge does not set aside specific days or times for oral arguments or evidentiary hearings. Judge Younge will hear oral argument on a motion if he believes argument will assist him in deciding the motion. Arguments and hearings are scheduled on an ad hoc basis.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/youpol.pdf#page=12
  text: Judge Younge requires a proposed order to be filed along with every motion and response. Proposed orders, although only a proposal, should nonetheless be titled "Order" and should not contain an attorney's name or address. If meant to ultimately be filed under seal, please include "File Under Seal" in the caption.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/youpol.pdf#page=11
  text: Except as set forth herein, motion practice will be conducted in accordance with Local Civil Rule 7.1. If the motion or the exhibits to the motion are voluminous, counsel may be contacted by Chambers to request a courtesy copy. The Court's courtesy copy shall be clearly marked, tabbed, and bound in a 3-ring binder or other binding method that allows the exhibit book to open and lay flat on an even surface. If counsel are directed to submit a courtesy copy, please deliver to Chambers via U.S. mail or hand delivery.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/youpol.pdf#page=13
  text: 'Judge Younge will approve a confidentiality order if the order includes a detailed statement demonstrating that good cause exists. All such orders must contain the following language or language substantially similar: "The Court retains the right to allow disclosure of any subject covered by this stipulation or to modify this stipulation at any time in the interest of justice.'
