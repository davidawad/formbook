- topic: Oral argument
  field: oral_argument_default
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kenpol.pdf#page=10
  text: If the Judge believes oral argument will be helpful in deciding a matter, he will schedule it, particularly when it involves a dispositive motion.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kenpol.pdf#page=32
  text: In the event the Court orders copies to be sent to Chambers or counsel is sending hard courtesy copies to Chambers, counsel must provide two copies which are single-sided, printed in color (if applicable), and if including exhibits - they must be appropriately tabbed/indexed. If the hard copies are over 30 pages, the copies cannot be stapled - the copies should be placed in a three-ring binder.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kenpol.pdf#page=15
  text: The Court will only approve confidentiality or sealing orders for good cause shown. Public policy favors transparency in judicial proceedings. Protective orders and confidentiality agreements undermine such transparency and complicate the resolution of cases at both the trial and appellate level. They should be used sparingly and be narrowly tailored. The parties may redact highly sensitive Personally Identifiable Information (PII) that is not relevant to the disposition of the case without leave of Court. No protective order or confidentiality order will be approved without language providing that "the Court reserves its inherent power to modify the terms of this agreement and permit the disclosure of information where the interest of justice so requires. Except in exceptional circumstances, documents or evidence that form the basis for judgment in a case are unlikely to be protected against disclosure. Any stipulation for a protective order should be sent to Chambers via email for Court approval.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.paed.uscourts.gov/sites/paed/files/documents/procedures/kenpol.pdf#page=9
  text: Unless there is extremely good cause to justify change, the parties are expected to strictly adhere to the dates contained in the scheduling order. The Court will grant a continuance or extension based on a stipulation of all parties if the continuance or extension will not affect the deadlines for filing motions for summary judgment, motions in limine, or the trial date. A continuance or extension that may affect the deadlines for filing motions for summary judgment, motions in limine, or the trial date must be made by motion sufficiently in advance of the deadline date. Parties should expect these motions will be DENIED unless unforeseeable, insurmountable causes are established. Counsel should make every effort to submit such stipulations or file motions as early as the need for an extension is known. If the stipulation is submitted or motion is filed less than two business days before the deadline, the Court does not guarantee a decision will be made before the deadline.
