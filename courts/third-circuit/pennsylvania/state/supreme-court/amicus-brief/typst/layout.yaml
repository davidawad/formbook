# Supreme Court of Pennsylvania (pa): amicus curiae brief (Pa.R.A.P. 531). The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12).
# Numbers trace to Pa.R.A.P. 124 and 2171-2174 (../rules.md, PA-*); lengths in points. No case text here: every string
# printed comes from the sample's frontmatter ({field}) or is a court constant (the court's name, the certificates'
# form text).
size: 14                  # PA-FORM-004 (Pa.R.A.P. 124(a)(4)): text no smaller than 14 point
pitch:
  body: 32.2              # PA-FORM-003 (124(a)(3)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, tables, quotations, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # PA-FORM-002 (124(a)(3)): at least one inch on all four sides
indent: 36
page_number: {align: center, front: lower-roman}   # the cover unnumbered, the tables i, ii .., the brief 1, 2 ..
footnote: {size: 12, pitch: 13.8, gap: 7}   # PA-FORM-003, -004: footnotes 12 point, single spaced (1.15 x 12 pt)
quote: {left: 72, right: 72, above: 11.2, below: 16.8}   # PA-FORM-003: quotations indented and single spaced
# Sections centered in capitals; the argument's points numbered by the template (PA-CONT-008): I., A., 1.
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, number: "I.", hang: 36, above: 16.8, below: 11.2}
  - {bold: true, number: "A.", hang: 36, above: 14, below: 11.2}
  - {italic: true, number: "1.", hang: 36, above: 14, below: 11.2}
# PA-COVER-001 (Pa.R.A.P. 2172(a)): the court, the docket number, the caption, the proceeding below, the title and
# counsel, under the three-inch space PA-FORM-002 keeps at the top of the first page (72 + 144 pt).
cover:
  - {text: "IN THE SUPREME COURT OF PENNSYLVANIA", align: center, bold: true, above: 144}
  - {text: "{district}", align: center, bold: true, upper: true, optional: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 11.2}
  - each: caption
    above: 11.2
    between:
      - {text: "v.", align: center, above: 8.4, below: 8.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{proceeding}", align: center, optional: true, above: 14}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 14}
  - columns: {each: counsel, per_row: 2, row_gap: 11.2, blocks: [{text: "{names}", bold: true}, {text: "{lines}", optional: true}]}
    gutter: 21.6
    above: 16.8
# Pa.R.A.P. 2174: the table of contents and the table of citations, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 36, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 12.6
  group: {bold: true, above: 16.8, below: 5.6}
# The date and the signature block (Pa.R.A.P. 2111 and 127 leave its form to the filer), never split; the Rule 127 and
# 531(b)(3) certificates; the Rule 531(b)(2) disclosure (the form text of the filed exemplar); the proof of service
# (Pa.R.A.P. 121(d)) when there is one.
closing:
  - group:
      - {text: "{date}", optional: true}
      - {text: "Respectfully submitted,", above: 5.6}
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4, optional: true}
    above: 21.6
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
  - {text: "I certify that this filing complies with the provisions of the Case Records Public Access Policy of the Unified Judicial System of Pennsylvania that require filing confidential information and documents differently than non-confidential information and documents.", pitch: body, indent: 36}
  - {text: "I certify that this brief complies with the word count limit of Pa.R.A.P. 531(b)(3) (7,000 words during merits briefing).", pitch: body, indent: 36}
  - group:
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4, optional: true}
    above: 5.6
  - when: amicus
    blocks:
      - group:
          - {text: "CERTIFICATION PURSUANT TO PA.R.A.P. 531(b)(2)", align: center, bold: true}
          - {text: "Pursuant to Rule 531(b)(2) of the Pennsylvania Rules of Appellate Procedure, the undersigned counsel hereby certify that: (a) no person or entity other than {amicus} or its counsel paid in whole or part for the preparation of the foregoing brief; and (b) no person or entity other than {amicus} or its counsel authored in whole or part the foregoing brief.", pitch: body, indent: 36, above: 16.8}
        above: 22.4
  - when: service
    blocks:
      - {break: true}
      - {text: "Proof of Service", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", pitch: body, indent: 36, optional: true}
      - each: service.recipients
        blocks: [{text: "{.}", left: 72, above: 14}]
      - {text: "{service.closing}", pitch: body, indent: 36, optional: true, above: 14}
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
