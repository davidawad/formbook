# Commonwealth Court of Pennsylvania (pacommwct): brief of the appellee (answering brief). The whole layout, as data for
# the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to the Pennsylvania Rules of Appellate Procedure (210 Pa. Code), ../../rules.md
# (PACOMMWCT-*); lengths in points. No case text here: every string printed comes from the sample's frontmatter
# ({field}) or is a court constant.
size: 14                  # PACOMMWCT-FORM-003 (Pa.R.A.P. 124(a)(4)): text no smaller than 14 point
pitch:
  body: 32.2              # PACOMMWCT-FORM-002 (124(a)(3)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # 124(a)(3): block quotations, footnotes and headings single spaced; cover, tables, signature
margin: {top: 72, bottom: 72, left: 72, right: 72}   # PACOMMWCT-FORM-002: at least one inch on all four sides
indent: 36
keep_with_closing: true   # the conclusion's last paragraph on the page of the date and signature
page_number: {align: center, front: lower-roman}   # cover unnumbered, tables roman, the brief from 1 (Pa.R.A.P. 2111(a))
footnote: {size: 12, pitch: 13.8, gap: 7}   # PACOMMWCT-FORM-002, -003: footnotes 12 point, single spaced (1.15 x 12)
quote: {left: 72, right: 72, above: 11.2, below: 16.8}   # PACOMMWCT-FORM-002: block quotations indented, single
# Sections centered in capitals; the argument's points numbered by the template (the markdown carries no numerals):
# level 2 "I.", level 3 "A.", level 4 "1.", each label in a half-inch box, the title's later lines under it.
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, number: "I.", hang: 36, above: 16.8, below: 11.2}
  - {bold: true, number: "A.", hang: 36, above: 14, below: 11.2}
  - {italic: true, number: "1.", hang: 36, above: 14, below: 11.2}
# The cover (PACOMMWCT-FORM-004, 124(a)(2): three inches clear at the top of the first page): the court, the docket
# number, the caption, the proceeding below, the fill, the title, counsel right of centre half an inch below it.
cover:
  - {text: "In the Commonwealth Court of Pennsylvania", align: center, bold: true, upper: true, above: 144}
  - {text: "{district}", align: center, bold: true, upper: true, optional: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 14.4}
  - each: caption
    above: 14.4
    between:
      - when: versus
        default: true
        blocks:
          - {text: "v.", align: center, above: 7.2, below: 7.2}
      - unless: versus
        default: true
        blocks:
          - {text: "", above: 7.2, below: 7.2}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true, optional: true}
  - {text: "{proceeding}", align: center, optional: true, above: 10.8}
  - {fill: 1}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4}
  - each: counsel
    above: 36
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 4.9}
      - {text: "{lines}", left: 230.4, optional: true}
  - {text: "{phone}", left: 230.4, optional: true}
# PACOMMWCT-CONT-001 (Pa.R.A.P. 2111(a)): the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 11.2}
# The date and the signature (PACOMMWCT-CERT-003: "/s/" and the typed name, the attorney lines), never split; then on
# a page of its own the certificate of compliance: the Rule 127 certificate (PACOMMWCT-CERT-001, the form of Rule 127's
# Comment) and the word limit (PACOMMWCT-LEN-001, -002, Pa.R.A.P. 2135(a)(1), (d)), signed; then the proof of service
# (Pa.R.A.P. 121(d)), signed by the first signer when the sample asks so.
closing:
  - group:
      - {text: "{date}", optional: true}
      - each: signature.signers
        blocks:
          - {text: "/s/ {name}", left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4, optional: true}
      - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
    above: 21.6
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
  - {text: "I certify that this filing complies with the provisions of the Case Records Public Access Policy of the Unified Judicial System of Pennsylvania that require filing confidential information and documents differently than non-confidential information and documents.", indent: 36, pitch: body}
  - {text: "I certify that this brief complies with the word count limit of Pa.R.A.P. 2135(a)(1). The certificate relies on the word count of the word processing system used to prepare the brief, as Pa.R.A.P. 2135(d) permits.", indent: 36, pitch: body}
  - group:
      - each: signature.signers
        blocks:
          - {text: "/s/ {name}", left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4, optional: true}
      - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
    above: 5.6
  - when: service
    blocks:
      - {break: true}
      - {text: "Proof of Service", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks:
              - {text: "{.}", left: 72, above: 14}
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true, above: 14}
      - when: service.first_signer_only
        blocks:
          - group:
              - {text: "/s/ {signature.signers.0.name}", left: 230.4}
              - {text: "{signature.signers.0.name}", left: 230.4}
              - {text: "{signature.signers.0.lines}", left: 230.4, optional: true}
              - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
            above: 5.6
      - unless: service.first_signer_only
        blocks:
          - group:
              - each: signature.signers
                blocks:
                  - {text: "/s/ {name}", left: 230.4, above: 12.6}
                  - {text: "{name}", left: 230.4}
                  - {text: "{lines}", left: 230.4, optional: true}
              - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
            above: 5.6
