# Commonwealth Court of Pennsylvania (pacommwct): petition for writ (original jurisdiction). The whole layout, as data
# for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to the Pennsylvania Rules of Appellate Procedure (210 Pa. Code), ../../rules.md
# (PACOMMWCT-*); lengths in points. No case text here: every string printed comes from the sample's frontmatter
# ({field}) or is a court constant.
size: 14                  # PACOMMWCT-FORM-003 (Pa.R.A.P. 124(a)(4)): text no smaller than 14 point
pitch:
  body: 32.2              # PACOMMWCT-FORM-002 (124(a)(3)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # 124(a)(3): block quotations single spaced; the caption, headings, signature (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # PACOMMWCT-FORM-002: at least one inch on all four sides
indent: 36
list_indent: 36           # PACOMMWCT-CONT-012 (1513(c)): the consecutively numbered paragraphs, the number in 0.5 in
page_number: {align: center, from: 2}   # every page numbered at the foot, the first page counted (exemplars)
footnote: {size: 12, pitch: 13.8, gap: 7}   # PACOMMWCT-FORM-002, -003: footnotes 12 point, single spaced (1.15 x 12)
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # PACOMMWCT-FORM-002: block quotations indented, single
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The first page (PACOMMWCT-FORM-004, 124(a)(2): three inches clear at the top): the court, the docket number, the
# caption (PACOMMWCT-CAP-001), the title, counsel's names side by side (their addresses are in the signature blocks:
# the long caption of an original-jurisdiction petition leaves no room for them on one page, DEF-COVER-001);
# it opens the document (`front`); then the notice to plead on a page of its own (PACOMMWCT-CONT-014, 1513(e)(6)),
# signed, and the numbered paragraphs from the next page.
front:
  - {text: "In the Commonwealth Court of Pennsylvania", align: center, bold: true, upper: true, above: 144}
  - {text: "{docket_number}", align: center, bold: true, above: 10.8}
  - each: caption
    above: 10.8
    between:
      - {text: "v.", align: center, above: 7.2}
    blocks:
      - {text: "{names}", align: center, above: 7.2}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 7.2}
  - {text: "{subtitle}", align: center, bold: true, optional: true}
  - columns:
      each: counsel
      per_row: 2
      row_gap: 4.9
      blocks:
        - {text: "{names}", bold: true}
    gutter: 21.6
    above: 8.6
  - {break: true}
  - when: notice_to_plead
    blocks:
      - {text: "Notice to Plead", align: center, bold: true, upper: true, below: 8.4}
      - each: notice_to_plead.respondents
        blocks:
          - {text: "TO: {.}"}
      - {text: "{notice_to_plead.text}", indent: 36, pitch: body, above: 11.2}
      - group:
          - {text: "/s/ {signature.signer}", left: 230.4}
          - {text: "{signature.signer}", left: 230.4}
          - {text: "{signature.firm}", bold: true, left: 230.4, optional: true}
          - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
        above: 8.4
      - {break: true}
# The date and the signature (PACOMMWCT-CERT-003: "/s/" and the typed name, the firm, the attorney lines), never split;
# then the verification by the party (PACOMMWCT-CONT-014, 1513(e)(6)) and the Rule 127 certificate (PACOMMWCT-CERT-006,
# 1513(e)(7); the form of Rule 127's Comment), signed, each on a page of its own; then each other certificate.
closing:
  - group:
      - {text: "Dated: {date}", optional: true}
      - {text: "/s/ {signature.signer}", left: 230.4, above: 5.6}
      - {text: "{signature.signer}", left: 230.4}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true}
      - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
    above: 21.6
  - when: verification
    blocks:
      - {break: true}
      - {text: "Verification", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{verification.text}", indent: 36, pitch: body}
      - {text: "{verification.signer}", underline: true, left: 230.4, above: 16.8}
      - {text: "{verification.signer}", left: 230.4}
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
  - {text: "I certify that this filing complies with the provisions of the Case Records Public Access Policy of the Unified Judicial System of Pennsylvania that require filing confidential information and documents differently than non-confidential information and documents.", indent: 36, pitch: body}
  - group:
      - {text: "/s/ {signature.signer}", left: 230.4}
      - {text: "{signature.signer}", left: 230.4}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true}
      - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
    above: 5.6
  - each: certificates
    blocks:
      - when: heading
        blocks:
          - {break: true}
          - {text: "{heading}", align: center, bold: true, upper: true, below: 16.8}
          - {text: "{paragraphs}", indent: 36, pitch: body}
          - each: recipients
            blocks:
              - {text: "{.}", left: 72, above: 14}
          - {text: "{closing}", indent: 36, pitch: body, optional: true, above: 14}
          - group:
              - {text: "/s/ {signature.signer}", left: 230.4}
              - {text: "{signature.signer}", left: 230.4}
              - {text: "{signature.firm}", bold: true, left: 230.4, optional: true}
              - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
            above: 5.6
