# Superior Court of Pennsylvania (pasuperct): application for reargument (Pa.R.A.P. 2542-2544). The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Pa.R.A.P. 121, 124, 127, 2542 and 2544 (../../rules.md,
# PASUPERCT-*); lengths in points. No case text here: every string printed comes from the sample's frontmatter
# ({field}) or is a court constant (the court's name, the certificates' form text).
size: 14                  # PASUPERCT-FORM-005 (Pa.R.A.P. 124(a)(4)): text no smaller than 14 point
pitch:
  body: 32.2              # PASUPERCT-FORM-003 (124(a)(3)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, tables, quotations, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # PASUPERCT-FORM-004 (124(a)(3)): at least one inch on all four sides
indent: 36
page_number: {align: center, front: lower-roman}   # the cover unnumbered, the tables i, ii .., the brief 1, 2 .. (2111(a))
footnote: {size: 12, pitch: 13.8, gap: 7}   # PASUPERCT-FORM-003, -005: footnotes 12 point, single spaced (1.15 x 12 pt)
quote: {left: 72, right: 72, above: 11.2, below: 16.8}   # PASUPERCT-FORM-003: quotations indented and single spaced
# Sections centered in capitals; the argument's points numbered by the template (PASUPERCT-OPEN-006, Pa.R.A.P.
# 2119(a): each part headed by a distinctly displayed statement of the point): I., A., 1., the text hung 0.5 in.
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, number: "I.", hang: 36, above: 16.8, below: 11.2}
  - {bold: true, number: "A.", hang: 36, above: 14, below: 11.2}
  - {italic: true, number: "1.", hang: 36, above: 14, below: 11.2}
# PASUPERCT-TPL-003: the court and district, the docket number, the caption, the proceeding below, the title and
# counsel, under the three-inch space PASUPERCT-FORM-002 (Pa.R.A.P. 124(a)(2)) keeps at the top of the first page
# (72 + 144 pt); fixed space.
cover:
  - {text: "IN THE SUPERIOR COURT OF PENNSYLVANIA", align: center, bold: true, above: 144}
  - {text: "{district}", align: center, bold: true, upper: true, optional: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 14.4}
  - each: caption
    above: 11.2
    between:
      - {text: "v.", align: center, above: 7.2, below: 7.2}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{proceeding}", align: center, optional: true, above: 10.8}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, above: 36}
  - each: counsel
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 5}
      - {text: "{lines}", left: 230.4, optional: true}
    above: 14.4
  - {text: "{phone}", left: 230.4, optional: true}
# Pa.R.A.P. 2111(a)(1), 2174: the table of contents and the table of citations, each on its own page; each entry's
# pages are those of its `find` in the body.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 36, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 12.6
  group: {bold: true, above: 16.8, below: 5.6}
# The date and the signature block (Pa.R.A.P. 2111 and 127 leave its form to the filer: "/s/" and the typed name,
# underlined, the name again, then the lines), never split; the Rule 127 and 2544(d) certificates (PASUPERCT-MOT-004,
# -005) signed again; the proof of service (Pa.R.A.P. 121(d), PASUPERCT-TPL-002) when there is one.
closing:
  - group:
      - {text: "{date}", optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 11.2}
      - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4, above: 11.2}
      - {text: "{signature.signer}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, optional: true}
    above: 21.6
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
  - {text: "I certify that this filing complies with the provisions of the Case Records Public Access Policy of the Unified Judicial System of Pennsylvania that require filing confidential information and documents differently than non-confidential information and documents.", pitch: body, indent: 36}
  - {text: "I certify that this application complies with the word count limit of Pa.R.A.P. 2544(c). The certificate relies on the word count of the word processing system used to prepare the application, as Pa.R.A.P. 2544(d)(1) permits.", pitch: body, indent: 36}
  - group:
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 11.2}
      - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4, above: 11.2}
      - {text: "{signature.signer}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, optional: true}
    above: 5.6
  - when: service
    blocks:
      - {break: true}
      - {text: "Proof of Service", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", pitch: body, indent: 36, optional: true}
      - each: service.recipients
        blocks: [{text: "{.}", left: 72, above: 14}]
      - {text: "{service.closing}", pitch: body, indent: 36, optional: true, above: 14}
      - group:
          - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4, above: 11.2}
          - {text: "{signature.signer}", left: 230.4}
          - {text: "{signature.lines}", left: 230.4, optional: true}
        above: 5.6
