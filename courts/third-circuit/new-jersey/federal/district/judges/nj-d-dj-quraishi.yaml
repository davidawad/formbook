  text: 'Appearances: Notice of any scheduled appearance, including but not limited to status conferences, settlement conferences, and oral arguments, will be posted on the docket. Where counsel are scheduled to appear in-person, all clients or representatives with settlement authority must be available by phone unless otherwise directed by chambers. The Court expects counsel to arrive at least 15 minutes prior to any appearance.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/content/zahid-n-quraishi
  text: 'Extensions of Time to a Deadline: If consented, extension requests may be done by proposed consent order via CM/ECF. If not consented, follow the regular motion procedure. To adjourn a previously scheduled appearance, obtain consent from your adversary and provide chambers with proposed new dates via CM/ECF. Adjournment Requests for Hearings/Conferences: Adjournment requests should be made at least two business days before a scheduled hearing or conference. The party seeking an adjournment should attempt to gain the consent of his or her adversary before filing said request by letter. In any such letter, the party should set forth the date of the hearing or conference, the basis for the adjournment request, whether the request is being made with consent, and the length of adjournment being sought. Absent exigent circumstances, adjournment requests made less than two days prior will not be granted.'
