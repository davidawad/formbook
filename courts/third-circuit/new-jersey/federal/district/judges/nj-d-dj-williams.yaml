  text: 'All requests for adjournments or extensions of time, other than those pursuant to Local Rule 7.1(d)(5), must comport with Local Rule 6.1 and include: (1) the date or dates sought to be extended; (2) the number of previous requests for extensions and the Court''s rulings; (3) the reason for the current request; and (4) whether the adversary consents and, if not, the reasons given by the adversary for refusing to consent. If the requested extension affects any other scheduled dates, the request must list the proposed change for all such other dates.'
