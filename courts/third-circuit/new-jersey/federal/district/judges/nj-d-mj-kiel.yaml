  text: The purpose of a motion's return date or "motion day" is to determine the briefing schedule for that motion, Unless otherwise notified by the Court, Judge Kiel decides all motions on the papers and no appearances are required on the motion day.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.njd.uscourts.gov/sites/njd/files/KielRulesandPreferences.pdf#page=3
  text: Motions to seal documents related to a dispositive issue are to be set before Judge Kiel. A motion to seal must comply with Local Civil Rule 5.3(c) and must include a proposed order and proposed findings of fact and conclusions of law. The proposed order must include reference to the docket entries the party seeks to seal.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/KielRulesandPreferences.pdf#page=3
  text: Motions to seal documents related to a dispositive issue are to be set before Judge Kiel. A motion to seal must comply with Local Civil Rule 5.3(c) and must include a proposed order and proposed findings of fact and conclusions of law. The proposed order must include reference to the docket entries the party seeks to seal. Counsel shall make every effort to secure the consent of all parties regarding the motion to seal, and the movant shall certify in support of the motion whether all parties consent.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/KielRulesandPreferences.pdf#page=1
  text: All parties, with the exception of pro se parties, shall electronically file all documents. All filed papers shall be in a text-searchable PDF format as required by Local Civil Rule 5.21(h). Parties are directed to ensure that all supporting documents to a filing are docketed as attachments to the primary document.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/KielRulesandPreferences.pdf#page=1
  text: Conferences and hearings, whether telephonic or in-person, are normally scheduled with ample notice to the parties. Accordingly, adjournment requests must be made no later than five business days before the scheduled conference or hearing and shall indicate whether all parties consent.
