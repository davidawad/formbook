  field: oral_argument_default
  url: https://www.njd.uscourts.gov/content/william-j-martini
  text: 'Oral Argument: Oral argument will not be held automatically on the listed return date. If the Court grants the request for oral argument or wishes to hear oral argument on a matter where no request has been made, the Courtroom Deputy shall contact the parties to schedule oral argument. Absent a request for oral argument, the matter will be decided on the papers pursuant to Federal Rule of Civil Procedure 78(b).'
