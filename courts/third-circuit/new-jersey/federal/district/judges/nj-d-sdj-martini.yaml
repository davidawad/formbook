  field: proposed_orders
  url: https://www.njd.uscourts.gov/content/william-j-martini
  text: All requests should be accompanied by a proposed order.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/content/william-j-martini
  text: 'Sealed Filings: All papers filed under seal shall be submitted in unredacted form to the Court in hard copies and digital copies in searchable PDF format on a USB drive.'
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/content/william-j-martini
  text: All submissions, including correspondence, must be electronically filed via CM/ECF. No submissions will be accepted via fax or email without the express consent of Chambers.
- topic: Remote appearances
  field: remote_appearances
  url: https://www.njd.uscourts.gov/content/william-j-martini
  text: Judge Martini conducts telephone conferences on motions at the Court's initiation.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.njd.uscourts.gov/content/william-j-martini
  text: The senior attorney in charge of the case or trial counsel must attend all settlement conferences, and the client with full settlement authority must either attend or be immediately available by phone.
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.njd.uscourts.gov/content/william-j-martini
  text: In appropriate cases, Judge Martini encourages expedient settlement and the use of alternative dispute resolution. The senior attorney in charge of the case or trial counsel must attend all settlement conferences, and the client with full settlement authority must either attend or be immediately available by phone. In cases involving insurance companies and other corporate business entities, it is expected that the executive who will make the final decision on the settlement will be the person available for the conference.
