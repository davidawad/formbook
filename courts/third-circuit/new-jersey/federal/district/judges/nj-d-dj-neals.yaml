  text: The only purpose of a motion's return date or "motion day" is to determine the briefing schedule for that motion. The Court generally will not hear oral argument on the return date. Rather, if the Court decides to hear oral argument on any issue, it will advise the parties of the argument date and time via CM/ECF.
