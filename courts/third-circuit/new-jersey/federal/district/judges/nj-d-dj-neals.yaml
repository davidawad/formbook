  text: D. Confidential Information. Any documents filed under seal shall comply with Local Civil Rule 5.1.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/JudgeNealsJudicialPreferencesandProcedures.pdf#page=1
  text: A. Electronic Submissions. All parties, with the exception of pro se litigants, shall file all documents, in both civil and criminal matters, electronically via CM/ECF. All papers electronically filed shall be submitted in a text-searchable PDF format to the extent possible.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/JudgeNealsJudicialPreferencesandProcedures.pdf#page=5
  text: 'B. Requests For Adjournments/Extensions. Requests for adjournments or extensions of time, other than those under Local Civil Rule 7.1(d)(5), must comport with Local Civil Rule 6.1 and include: (1) the date or dates sought to be extended; (2) the number of previous requests for extensions and the Court''s rulings; (3) the basis for the current request; and (4) whether the adversary consents and, if not, the reasons given by the adversary for refusing to consent. If the requested extension affects any other scheduled dates, the request must list the proposed change for all other dates/deadlines.'
