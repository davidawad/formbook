- topic: Remote appearances
  field: remote_appearances
  url: https://www.njd.uscourts.gov/sites/njd/files/EPProcedures.pdf#page=4
  text: Telephone conferences with all litigants may be used at the Court's discretion to resolve scheduling matters, time extensions, or other disputes. Litigants will be notified of the date and time for the telephone conference. Absent prior permission from the Court, parties are each limited to two attorneys each appearing at telephone conferences. Only one attorney per side will be permitted to address the Court during the call. Counsel should file a notice of appearance prior to appearing at a telephone conference or they will not be permitted to speak. Failure to observe basic telephone courtesy will result in the Court's refusal to use telephone conferences in matters involving the offending participants.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/EPProcedures.pdf#page=6
  text: Litigants should expect the Court to maintain the dates contained in the Scheduling Order, unless there is good cause to justify a change. Generally, Judge Padin will grant a short (i.e., two weeks or fewer) continuance or extension that will not affect discovery dates, motion-decision dates, hearing dates, or trial dates, if requested with the agreement of all litigants. Any other request for a continuance or extension should set forth in detail the basis for the request and whether the request is agreed to or opposed by the other litigant(s). A request for an extension or continuance of longer than two (2) weeks regarding the trial date, a discovery cutoff date, or the deadline for filing dispositive motions must be made sufficiently prior to the due date to allow time for the Court to consider it and should set forth compelling reason(s) for the relief sought. An unopposed request may be made by letter to the Court and should include the reasons for the request. All such letters—as with all correspondence with the Court—should be filed electronically via CM/ECF.
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.njd.uscourts.gov/sites/njd/files/EPProcedures.pdf#page=3
  text: Direct correspondence to advise the Court that a case has been settled or dismissed is also appropriate, as is correspondence on any matter when specifically requested by the Court.
review:
