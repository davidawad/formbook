- topic: Ex parte applications
  field: ex_parte_notice
  url: https://www.njd.uscourts.gov/sites/njd/files/EPProcedures.pdf#page=3
  text: Pro se (unrepresented) litigants are advised that ex parte (one-sided) and/or personal communications and submissions are not advised and will generally not be accepted. All substantive correspondence with the Court should be filed on the CM/ECF docket.
- topic: Discovery disputes
  field: discovery_referral
  url: https://www.njd.uscourts.gov/sites/njd/files/EPProcedures.pdf#page=3
  text: In general, and unless otherwise directed by the Court, all discovery-related correspondence, as well as any correspondence related to non-dispositive motions, should be addressed to the Magistrate Judge assigned to the case. All correspondence related to dispositive motions, trials, and related oral arguments should be addressed to Judge Padin.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/EPProcedures.pdf#page=6
  text: Judge Padin requires strict compliance with the length limitations and format requirements for briefs set forth in Local Rule 7.2. Requests for overlength briefs are highly disfavored. Judge Padin also requires compliance with Local Rule 5.1(h) that all PDF filings be text searchable and at a minimum 400 dpi. Failure to abide by these requirements may result in rejection of the papers.
