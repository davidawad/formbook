checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeSalas.pdf#page=9
  text: If the Court determines that oral argument will be helpful in deciding a matter, Judge Salas will schedule it and the parties will be specifically advised of a date and time for oral argument via CM/ECF.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeSalas.pdf#page=7
  text: The Magistrate Judge handles motions to seal.
- topic: Discovery disputes
  field: discovery_referral
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeSalas.pdf#page=4
  text: In general, and unless otherwise directed by the Court, all discovery-related correspondence, as well as any correspondence related to non-dispositive motions, should be addressed to the Magistrate Judge assigned to the case. All correspondence related to dispositive motions, trials, and related oral arguments should be addressed to Judge Salas.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeSalas.pdf#page=8
  text: All such letters—as with all correspondence with the Court—should be filed electronically via CM/ECF.
- topic: Remote appearances
  field: remote_appearances
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeSalas.pdf#page=5
  text: Telephone conferences with all litigants may be used at the Court's discretion to resolve scheduling matters, time extensions, or other disputes. Litigants will be notified of the date and time for the telephone conference. It will be the responsibility of litigants for the moving or initiating party to arrange the telephone conference and to contact Judge Salas's Chambers after all litigants are present on the call unless otherwise advised by the Court.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeSalas.pdf#page=8
  text: Litigants should expect the Court to maintain the dates contained in the Scheduling Order, unless there is good cause to justify a change. Generally, Judge Salas will grant a short (i.e., two weeks or fewer) continuance or extension that will not affect discovery dates, motion-decision dates, hearing dates, or trial dates, if requested with the agreement of all litigants. Any other request for a continuance or extension should set forth in detail the basis for the request and whether the request is agreed to or opposed by the other litigant(s). A request for an extension or continuance of longer than two (2) weeks regarding the trial date, a discovery cutoff date, or the deadline for filing dispositive motions must be made sufficiently prior to the due date to allow time for the Court to consider it and should set forth compelling reason(s) for the relief sought. An unopposed request may be made by letter to the Court and should include the reasons for the request. All such letters—as with all correspondence with the Court—should be filed electronically via CM/ECF.
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeSalas.pdf#page=3
  text: Correspondence to advise the Court that a case has been settled or dismissed is also appropriate, as is correspondence on any matter when specifically requested by the Court.
review:
- Sur-reply submissions should not contain a repeat recitation of the facts of the case and, without leave of Court for good cause shown, must not exceed fifteen (15) pages in total.
