- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/content/jamel-k-semper
  text: 'All requests for adjournments or extensions of time, other than those pursuant to Local Rule 7.1(d)(5), must comport with Local Rule 6.1 and include: (1) the date or dates sought to be extended; (2) the number of previous requests for extensions and the Court''s ruling; (3) the reason for the current request; and (4) whether the adversary consents and, if not, the reason given by the adversary for refusing to consent. If the requested extension affects any other scheduled dates/deadlines, the request must list the proposed change for all such other dates/deadlines. Adjournment requests should be made at least three business days before a scheduled hearing or conference. The party seeking an adjournment should attempt to gain the consent of his or her adversary before filing said request by letter. In any such letter, the party should set forth the date of the hearing or conference, the basis for the adjournment request, whether the request is being made with consent, and the length of adjournment being sought. Absent exigent circumstances, adjournment requests made less than three days prior to the deadline will not be granted.'
