  text: After any motion is filed with the Court, the Clerk's Office dockets an automatically generated message stating, "Set Deadlines as to [Motion]. [...] The only purpose of that "motion date" is to determine the briefing schedule for that motion, which may be viewed on the District's website at https://www.njd.uscourts.gov/motion-days-0. This briefing schedule applies unless the Court directs otherwise. The Court generally will not hear oral argument on the motion day, and no appearances are required on that date.
