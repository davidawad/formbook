  text: All parties, with the exception of pro se parties, shall file all documents, in both civil and criminal matters, electronically via ECF. All papers electronically submitted, including any supporting exhibits, shall, to the extent possible, be submitted in a text-searchable PDF format. As such, parties are strongly encouraged to convert briefs from Word to PDF format and to obtain PDF versions of deposition transcripts and emails (as examples), rather than scanning and filing a hardcopy of any brief or other paper.
