checklist:
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/JBDCaseManagementOrder.pdf#page=2
  text: Motions to seal must comply in all respects with Local Civil Rule 5.3(c) and must include a proposed order that includes findings of fact and conclusions of law, and which includes references to the docket entries that are the subject of the motion. Contemporaneously with the motion, counsel should submit to the Court, via email to jbd_orders@njd.uscourts.gov, any proposed redacted documents to be filed if the motion is granted. Counsel shall make every effort to secure the consent of all parties regarding the request to seal and the movant shall certify as to whether all parties consent in its application. Parties may file a motion to seal without obtaining leave of Court.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/JBDCaseManagementOrder.pdf#page=1
  text: Adjournments and Extensions. Requests for adjournments and extensions should be made in writing through a letter request filed via CM/ECF. The party seeking an adjournment or extension should attempt to obtain the consent of all other parties before filing the request. The letter request should set forth the date of the conference/hearing or relevant deadline; the basis for the request; whether all parties consent to or oppose the request; the length of the adjournment or extension sought; and whether the request, if granted, would impact other scheduled dates or deadlines. Absent exigent circumstances, the Court will consider adjournment and extension requests only if made at least two (2) business days before a scheduled conference or deadline.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.njd.uscourts.gov/sites/njd/files/JBDCaseManagementOrder.pdf#page=3
  text: Trial counsel as well as individuals with full settlement authority must appear at settlement conferences unless the Court has granted prior permission to participate by telephone.
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.njd.uscourts.gov/sites/njd/files/JBDCaseManagementOrder.pdf#page=3
  text: Trial counsel as well as individuals with full settlement authority must appear at settlement conferences unless the Court has granted prior permission to participate by telephone. No later than five (5) business days before the settlement conference, each party shall submit to the Court via email to jbd_orders@njd.uscourts.gov a confidential settlement submission of no more than five (5) single-spaced pages (exclusive of any exhibits). The settlement submission should outline the party's respective position(s); identify information on what is important to the client and any barriers to settlement; identify the contemplated terms material to a settlement; and set forth any demands and offers made to date.
