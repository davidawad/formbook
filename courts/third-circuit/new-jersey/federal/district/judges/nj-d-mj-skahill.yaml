checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.njd.uscourts.gov/content/matthew-j-skahill
  text: Magistrate Judge Skahill does not hold oral argument on motions unless requested by the Court. The Court will advise the parties of the date and time of the argument and whether the argument will be held in-person or via a telephone conference. All reasonable efforts will be made to accommodate the schedule of counsel.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/content/matthew-j-skahill
  text: Magistrate Judge Skahill requires that counsel comply with Local Civil Rule 5.3(c).
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/content/matthew-j-skahill
  text: In civil cases, all written submissions to the Court, unless otherwise directed, should be filed electronically via ECF.
- topic: Remote appearances
  field: remote_appearances
  url: https://www.njd.uscourts.gov/content/matthew-j-skahill
  text: Magistrate Judge Skahill is amenable to telephone conferences, particularly on scheduling and discovery matters. Magistrate Judge Skahill requires counsel to meet and confer prior to requesting a conference to address discovery disputes.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/content/matthew-j-skahill
  text: Requests for extensions should be in writing and filed via ECF indicating whether opposing counsel consents.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.njd.uscourts.gov/content/matthew-j-skahill
  text: For in-person conferences, absent leave of the Court, Magistrate Judge Skahill requires that trial counsel and clients with full and complete settlement authority attend the conference in person and remain available for the duration of the conference. For telephonic/Zoom conferences, Magistrate Judge Skahill requires that parties with full and complete settlement authority also be available for the entire conference.
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.njd.uscourts.gov/content/matthew-j-skahill
  text: 'Settlement Conferences: Magistrate Judge Skahill will normally require counsel to submit a confidential settlement memorandum at least 3 business days prior to the settlement conference. Unless otherwise instructed, the settlement memorandum shall not exceed 10 double spaced pages. Counsel may also include exhibits or documents that they intend to refer to or rely on at the conference, which are truly necessary. Magistrate Judge Skahill expects that the submissions will include a candid discussion of the submitting party''s strengths and weaknesses in the case. The confidential settlement memoranda should be sent to njdnef_skahill@njd.uscourts.gov.'
