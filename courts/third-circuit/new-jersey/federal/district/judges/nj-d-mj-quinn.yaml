  url: https://www.njd.uscourts.gov/sites/njd/files/JTQPreferencesCaseManagementOrder.pdf#page=4
  text: Judge Quinn will schedule oral argument on an as-needed basis. That said, if a party believes oral argument is necessary, the party shall file a letter with the Court explaining why oral argument is either needed or would be helpful. Circumstances where the Court may grant such an application include, but are not limited to, the briefing involves a novel issue of law and/or a junior associate will argue the application.
