  url: https://www.njd.uscourts.gov/sites/njd/files/JTQPreferencesCaseManagementOrder.pdf#page=2
  text: Motions to seal must comply with Local Civil Rule 5.3(c) and must include a proposed order and proposed findings of fact and conclusions of law. In addition, the proposed order must include reference to the docket entries the party seeks to seal.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/JTQPreferencesCaseManagementOrder.pdf#page=2
  text: Motions to seal must comply with Local Civil Rule 5.3(c) and must include a proposed order and proposed findings of fact and conclusions of law. In addition, the proposed order must include reference to the docket entries the party seeks to seal. Counsel shall make every effort to secure the consent of all parties regarding the request to seal and the movant shall certify as to whether all parties consent in its application.
