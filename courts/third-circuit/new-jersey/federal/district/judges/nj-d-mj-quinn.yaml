- topic: Remote appearances
  field: remote_appearances
  url: https://www.njd.uscourts.gov/sites/njd/files/JTQPreferencesCaseManagementOrder.pdf#page=3
  text: Trial counsel as well as persons with full settlement authority must appear at settlement conferences, unless prior permission has been granted to participate by telephone. Final Pretrial Conferences. The Court conducts final pretrial conferences pursuant to Federal Rule of Civil Procedure 16(e). The Court expects to engage in meaningful settlement discussions at final pretrial conferences. Therefore, trial counsel as well as persons with full settlement authority must attend the conferences, unless prior permission has been granted to participate by telephone.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/JTQPreferencesCaseManagementOrder.pdf#page=1
  text: 'Conferences are scheduled with ample notice to the parties. Adjournment requests shall only be considered if made at least two (2) business days prior to a scheduled conference. The party seeking an adjournment should attempt to gain the consent of all other parties before submitting said request. The request should be made in writing via CM/ECF as a letter request. The request must set forth: (a) the date of the conference; (b) the length of adjournment requested; (c) the basis for the adjournment request; (d) whether all parties consent to or oppose the request; and (e) whether the adjournment request, if granted, would impact other scheduled dates or deadlines. Absent exigent circumstances, adjournment requests made after two (2) business before a conference shall not be granted. Requests for extensions of time shall only be considered if made at least two (2) business days prior to a scheduled deadline. The party seeking an extension of time should attempt to gain the consent of all other parties before submitting said request. The request must set forth: (a) the currently scheduled deadline(s) sought to be extended; (b) the length of extension requested; (c) the basis for the extension request; (d) whether all parties consent to or oppose the request; and (e) whether the extension request, if granted, would impact other scheduled dates or deadlines.'
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.njd.uscourts.gov/sites/njd/files/JTQPreferencesCaseManagementOrder.pdf#page=3
  text: 'Trial counsel as well as persons with full settlement authority must appear at settlement conferences, unless prior permission has been granted to participate by telephone. The parties must exchange a demand and offer before the settlement conference. Each party shall submit, by email to JTQ_Orders@njd.uscourts.gov, a confidential settlement memorandum of no more than five (5) double-spaced pages no later than five (5) business days before the conference. The settlement memorandum shall: outline the party''s respective position(s); identify information on what is important to the client and any barriers to settlement; identify the contemplated terms material to a settlement; and detail the demand(s) and offer(s) made to date. Exhibits to settlement memorandum are not required, but if included should not exceed twenty (20) pages. If trial counsel and clients do not comply with this Order, the settlement conference may be canceled or rescheduled and the noncompliant party and/or attorney may be sanctioned, which may include an assessment of the costs and expenses incurred by those parties who appeared as directed. Final Pretrial Conferences. The Court conducts final pretrial conferences pursuant to Federal Rule of Civil Procedure 16(e). The form of final pretrial order the Court utilizes for each District Judge can be downloaded from this link: https://www.njd.uscourts.gov/sample-pre-trial-orders. The Court expects to engage in meaningful settlement discussions at final pretrial conferences. Therefore, trial counsel as well as persons with full settlement authority must attend the conferences, unless prior permission has been granted to participate by telephone.'
