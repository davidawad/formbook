  url: https://www.njd.uscourts.gov/sites/njd/files/JTQPreferencesCaseManagementOrder.pdf#page=3
  text: 'Trial counsel as well as persons with full settlement authority must appear at settlement conferences, unless prior permission has been granted to participate by telephone. The parties must exchange a demand and offer before the settlement conference. Each party shall submit, by email to JTQ_Orders@njd.uscourts.gov, a confidential settlement memorandum of no more than five (5) double-spaced pages no later than five (5) business days before the conference. The settlement memorandum shall: outline the party''s respective position(s); identify information on what is important to the client and any barriers to settlement; identify the contemplated terms material to a settlement; and detail the demand(s) and offer(s) made to date. Exhibits to settlement memorandum are not required, but if included should not exceed twenty (20) pages.'
