  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/content/brian-r-martinotti
  text: 'Extensions of Time: If consented, may be done by consent order via CM/ECF. If not consented, follow the regular motion procedure. To adjourn a previously scheduled appearance, obtain consent from your adversary and provide chambers with new dates in writing via CM/ECF, or contact the courtroom deputy via email.'
