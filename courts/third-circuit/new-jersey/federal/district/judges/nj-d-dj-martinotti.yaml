  text: 'Appearances (including in-person, Zoom, or telephonic): Notice of any scheduled appearance, including but not limited to status conferences, settlement conferences, and oral arguments, will be posted on the docket. Where counsel is scheduled to appear, all clients or representatives with settlement authority must be available by phone unless otherwise directed by chambers. The Court expects counsel to appear at least 15 minutes prior to any appearance.'
