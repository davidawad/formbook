checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeReneeMarieBumb.pdf#page=2
  text: 'The only purpose of a motion''s return date or "motion day" is to determine the briefing schedule for that motion. The Court generally will not hear oral argument on the motion''s return date. Rather, if the Court decides to hear oral argument on any issue, it will advise counsel of the argument date. See L. Civ. R. 78.1(b) ("All motions and other applications will be decided on the papers submitted unless: (1) a party requests oral argument and the request is granted by the Judge; or (2) the Court, sua sponte, directs that oral argument be held.").'
- topic: Proposed orders
  field: proposed_orders
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeReneeMarieBumb.pdf#page=4
  text: If any relief is being sought, a proposed order must accompany the party's submission.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeReneeMarieBumb.pdf#page=4
  text: All parties, with the exception of pro se parties, shall file all documents, in both civil and criminal matters, electronically via CM/ECF. All papers electronically submitted shall, to the extent possible, be submitted in a text-searchable PDF format.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/ProceduresJudgeReneeMarieBumb.pdf#page=2
  text: 'All requests for adjournments or extensions of time, other than those pursuant to Local Civil Rule 7.1(d)(5), must comport with Local Civil Rule 6.1 and include: (1) the date or dates sought to be extended; (2) the number of previous requests for extensions and the Court''s rulings; (3) the reason for the current request; and (4) whether the adversary consents and, if not, the reasons given by the adversary for refusing to consent. If consent is unreasonably withheld, the Court may impose attorneys'' fees and costs. If the requested extension affects any other scheduled dates/deadlines, the request must list the proposed change for all such other dates/deadlines.'
