  text: If the Court grants a request for oral argument or wishes to hear argument when no request has been made, the parties will be notified via ECF. The Court is more likely to grant oral argument if a party represents, at the time of the filing of the request for argument, that a junior attorney (i.e. less than five years' experience) will present the argument. A supervising attorney may attend to assist only if necessary.
