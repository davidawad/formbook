  url: https://www.njd.uscourts.gov/sites/njd/files/JudicialPreferencesOHearn.pdf#page=3
  text: 'Any request for an adjournment shall include: (1) The date(s) to be adjourned; (2) The number of previous requests; (3) The reason for the request; and (4) If all parties consent. Communications regarding scheduling and adjournments are handled by the Deputy Clerk, Haley Minix. If an adjournment is being sought, counsel shall first attempt to obtain consent from all parties and provide the Court with new dates upon which all parties are available. Absent exigent circumstances, adjournment requests made less than two days prior will not be granted.'
