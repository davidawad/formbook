  field: oral_argument_default
  url: https://www.njd.uscourts.gov/content/elizabeth-pascal
  text: The Court is also more likely to grant oral argument if a party represents, at the time of the filing of the motion or request for argument, that a junior attorney will present the argument.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/content/elizabeth-pascal
  text: Motions to seal must comply with Local Civil Rule 5.3(c) and shall be filed on the docket. Counsel shall make every effort to secure the consent of all parties regarding the request to seal and the movant shall certify whether all parties consent to the application.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://www.njd.uscourts.gov/content/elizabeth-pascal
  text: In civil cases, all written submissions to the Court, apart from submissions by pro se parties, shall be filed electronically via ECF.
- topic: Remote appearances
  field: remote_appearances
  url: https://www.njd.uscourts.gov/content/elizabeth-pascal
  text: After dialing in, Counsel will need to enter an access code, which changes for each conference. Counsel should refer to the order scheduling the conference for the specific access code.
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/content/elizabeth-pascal
  text: Adjournment requests shall be made in writing, filed on the docket, and indicate whether all parties consent. Extension requests shall be made in writing, filed on the docket, and indicate whether all parties consent. All applications regarding motions returnable before a District Judge shall be presented to the District Judge.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.njd.uscourts.gov/content/elizabeth-pascal
  text: Unless the Court specifically instructs otherwise, clients with full settlement authority are required to appear in person at the settlement conference.
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.njd.uscourts.gov/content/elizabeth-pascal
  text: Unless the Court specifically instructs otherwise, clients with full settlement authority are required to appear in person at the settlement conference. Each party shall submit a confidential settlement memorandum of no more than five (5) double-spaced pages, including exhibits, via email to njdnef_pascal@njd.uscourts.gov at least three (3) business days before the scheduled conference.
