- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.njd.uscourts.gov/sites/njd/files/SDAJudicialPreferences.pdf#page=3
  text: 'Motions to Seal: Motions to seal must comply with Local Civil Rule 5.3(c) and must include a proposed order and proposed findings of fact and conclusions of law. In addition, the proposed order must include reference to the docket entries the party seeks to seal. Counsel shall make every effort to secure the consent of all parties regarding the request to seal and the movant shall certify as to whether all parties consent in the application.'
- topic: Remote appearances
  field: remote_appearances
  url: https://www.njd.uscourts.gov/sites/njd/files/SDAJudicialPreferences.pdf#page=4
  text: 'Telephone Conferences: Are permitted but must be initiated by letter informally outlining the issues to be discussed.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.njd.uscourts.gov/sites/njd/files/SDAJudicialPreferences.pdf#page=1
  text: 'Adjournment Requests: Absent exigent circumstances, adjournment requests shall only be considered if made at least three (3) business days before the scheduled court proceeding. The party seeking an adjournment should attempt to gain the consent of all other parties before submitting said request. The request should be made in writing via CM/ECF as a letter request. The request must set forth: (a) the date of the court proceeding; (b) the length of adjournment requested; (c) the basis for the adjournment request; (d) whether all parties consent to or oppose the request; and (e) whether the adjournment request, if granted, would impact other scheduled dates or deadlines.'
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.njd.uscourts.gov/sites/njd/files/SDAJudicialPreferences.pdf#page=3
  text: 'Settlement Conferences: Absent exigent circumstances, settlement conferences will be held in person at the Courthouse and must be attended by lead trial counsel as well as all parties and persons with settlement authority.'
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.njd.uscourts.gov/sites/njd/files/SDAJudicialPreferences.pdf#page=3
  text: 'Settlement Conferences: Absent exigent circumstances, settlement conferences will be held in person at the Courthouse and must be attended by lead trial counsel as well as all parties and persons with settlement authority. Each party is required to submit, by email to SDA_orders@njd.uscourts.gov, a confidential settlement memorandum of no more than ten (10) double spaced pages no later than five (5) business days before the conference.'
