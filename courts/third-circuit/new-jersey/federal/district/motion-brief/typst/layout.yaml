# U.S. District Court for the District of New Jersey (njd): a memorandum of law in support of a motion, on the generic
# FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with D.N.J.'s local rules overlaid here. The shared
# document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`).
# Rules: D.N.J. Local Civil Rules, complete compilation, https://www.njd.uscourts.gov/sites/njd/files/CompleteLocalRules.pdf
# (read 2026-10-14; ../README.md quotes them). The base already meets L.Civ.R. 7.2(c) (8 1/2 x 11 paper, margins of at
# least one inch). The 40-page limit of L.Civ.R. 7.2(b) (the contents pages not counted) is not machine-checked.
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name.
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "DISTRICT OF NEW JERSEY"
# L.Civ.R. 7.2(d): an equivalent 14-point proportional font (such as Times New Roman 14), footnotes in the same size;
# double-spaced text (2 x the type size) and single-spaced footnotes or inserts (1.15 x the type size).
size: 14
pitch: {body: 28, single: 16.1}
footnote: {size: 14, gap: 7}
# L.Civ.R. 7.2(d): a block quotation, an insert, single spaced, indented half an inch each side, a single line around it.
quote: {left: 36, right: 36, above: 16.1, below: 16.1, gap: 16.1}
# L.Civ.R. 7.2(b): the contents pages apart from the text: the cover unnumbered, the tables in lower-case roman from i,
# the text from 1 (both exemplars).
page_number: {align: center, front: lower-roman}
# Headings single spaced, a single line above and below: a section centered in bold capitals; the points numbered by
# the template, "I." at the margin, "A." and "1." half an inch further in each, bold, each label in a half-inch box with
# the title's later lines hung under it (both exemplars' point headings).
heading:
  - {align: center, bold: true, upper: true, above: 16.1, below: 16.1}
  - {bold: true, number: "I.", label_box: 36, above: 16.1, below: 16.1}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 16.1, below: 16.1}
  - {bold: true, number: "1.", label_box: 36, left: 72, above: 16.1, below: 16.1}
# L.Civ.R. 7.2(b): a table of contents: every heading with its page, half an inch in per level, a leader to the page.
contents: {title: "Table of Contents", depth: 4, col: 36, step: 36, above: 8}
# L.Civ.R. 7.2(b): a table of authorities, from the `toa:` links of the body and notes, grouped as the exemplars group
# them, each name (a case name in italics, as the sample writes it), a comma and the citation; "passim" at seven pages
# or more.
authorities:
  title: "Table of Authorities"
  page_heading: "Page(s)"
  passim: 7
  kinds:
    - {kind: case, title: "Cases"}
    - {kind: statute, title: "Statutes"}
    - {kind: rule, title: "Rules"}
    - {kind: regulation, title: "Regulations"}
    - {kind: other, title: "Other Authorities"}
  col: 56
  hang: 25.2
  above: 8
  group: {bold: true, above: 16.1, below: 4}
# L.Civ.R. 10.1(b), FRCP 10(a): the court's name; the caption, unruled, as the Karre exemplar sets it: the parties at
# the left (each party's names, its designation an inch and a half in a line below, "v." an inch in a line from each), a column
# of colons beside them; at the right the docket number, the assigned judge's name when the sample gives it (L.Civ.R.
# 10.1(b)) and the motion day (L.Civ.R. 78.1(a)). The paper's title centered in bold capitals, then the attorney of
# record's name, office, address and telephone (L.Civ.R. 10.1(b): endorsed on the first page), centered as in the
# Karre exemplar. A cover page, before the tables.
front: ~
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - columns:
      - width: 194.4
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 108, above: 16.1}
            between:
              - {text: "v.", left: 72, above: 16.1, below: 16.1}
      - {width: 14.4, repeat: ":"}
      - valign: center
        blocks:
          - {text: "{case_label|Civil Action No.} {case_number}", left: 7.2}
          - {text: "Hon. {judge}, U.S.D.J.", optional: true, left: 7.2, above: 16.1}
          - {text: "Motion Day: {motion_day}", optional: true, left: 7.2, above: 16.1}
    above: 28
  - {text: "{title}", align: center, bold: true, upper: true, left: 36, right: 36, above: 56}
  - {text: "{counsel}", align: center, above: 56}
# FRCP 11(a), L.Civ.R. 11.1 (an "s/" signature on a paper filed electronically): "Dated:" at the left; at the right
# "Respectfully submitted,", the /s/ signature, the signer, the firm and the signer's lines; kept whole with the last
# paragraph.
closing:
  - group:
      - columns:
          - width: 187.2
            blocks:
              - {text: "Dated: {date}"}
          - blocks:
              - {text: "Respectfully submitted,"}
              - {text: "/s/ {signature.signer}", above: 16.1}
              - {text: "{signature.signer}"}
              - {text: "{signature.firm}"}
              - {text: "{signature.lines}"}
        gutter: 14.4
    above: 28
