# Court of Appeals of Ohio (ohioctapp): motion with its memorandum in support (App.R. 15 (A)). The whole layout, as
# data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to App.R. 19 (../../rules.md, OHIOCTAPP-*); lengths in points. No
# case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
# One caption, the motion and the memorandum (a level-1 heading of the body) in one sequence, then the signature and
# the certificate of service: the model has no second caption, signature or page restart between the two parts
# (docs/open-items/fb-595.54.55.md). Motions carry no App.R. word or page limit.
size: 12                  # OHIOCTAPP-FORM-002: at least 12-point type, footnotes and captions included
pitch:
  body: 27.6              # OHIOCTAPP-FORM-003: double spaced (Word's double, 2 x 1.15 x 12 pt)
  single: 13.8            # OHIOCTAPP-FORM-003: quoted matter single; caption, headings, notes, signature too
margin: {top: 72, bottom: 72, left: 72, right: 72}   # OHIOCTAPP-FORM-001: at least 1 in each side, 1 1/2 in top+bottom
indent: 36                # paragraphs indented half an inch
page_number: {align: center}   # OHIOCTAPP-FORM-005: numbering conventional; bottom centre from page 1, as filed
footnote: {size: 12, gap: 6}   # OHIOCTAPP-FORM-002, -003: notes 12 point, single spaced
quote: {left: 36, right: 36, above: 9.6, below: 14.4, gap: 13.8}   # OHIOCTAPP-FORM-003: quoted matter single spaced; a blank single line between its paragraphs
# The author numbers the headings ("I.", "A.", "i."): level 1 a section, centred and bold (not underlined as filed:
# LaTeX sets underlined text in one unbreakable box and the memorandum title wraps); levels 2 and 3 point headings;
# level 4 bold italic (underlined in the old template and as filed; not underlined for the same reason).
heading:
  - {align: center, bold: true, above: 14.4, below: 12}
  - {bold: true, hang: 36, above: 12, below: 9.6}
  - {bold: true, hang: 36, above: 12, below: 9.6}
  - {bold: true, italic: true, hang: 36, above: 9.6, below: 9.6}
# OHIOCTAPP-CERT-002 (App.R. 19 (B)): the name of the court, the title of the case, the case number and a brief
# descriptive title. The parties at the left, the case number and the court below at the right; the title between
# two rules.
front:
  - {text: "{court}", align: center, bold: true}
  - {text: "{district}", align: center, bold: true}
  - {text: "{county}", align: center, bold: true}
  - columns:
      - width: 237.6
        blocks:
          - each: parties
            blocks:
              - {text: "{name}"}
              - {text: "{role}", align: right, right: 10.8, optional: true}
          - {text: "v.", left: 86.4}   # on the line pitch: every caption line beside a line of the right column
          - each: against
            blocks:
              - {text: "{name}"}
              - {text: "{role}", align: right, right: 10.8, optional: true}
      - blocks:
          - {text: "Case No. {case_number}"}
          - {text: "{lower_court}"}   # beside the first party's role, as filed
    gutter: 14.4
    above: 27.6           # a double-spaced blank line under the court
  - columns:
      - width: 397.8      # the title block 85 % of the line, at the left, as filed
        blocks:
          - {rule: 0.75}
          - {text: "{motion_title}", align: center, bold: true, above: 6, below: 6}
          - {rule: 0.75}
      - blocks: []
    above: 24
    below: 14.4
# OHIOCTAPP-CERT-001 (App.R. 19 (A)): the signature, counsel side by side, never split; OHIOCTAPP-SVC-001
# (App.R. 13 (C)): the certificate of service on a page of its own.
closing:
  - group:
      - {text: "Respectfully submitted,"}
      - {text: "{signature.signer_line}", underline: true, above: 9.6}
      - columns:
          - blocks:
              - each: counsel.left
                blocks: [{text: "{names}", above: 8.4}, {text: "{lines}"}]
          - blocks:
              - each: counsel.right
                blocks: [{text: "{names}", above: 8.4}, {text: "{lines}"}]
        gutter: 14.4
        above: 4.8
      - {text: "{signature.note}", optional: true, above: 7.2}
      - {text: "{signature.role}", left: 198, above: 9.6}
    above: 14.4
  - {break: true}
  - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, below: 6}
  - {text: "I hereby certify that on {service.date}, the foregoing was electronically filed via the Court’s e-filing system. I further certify that a copy of the foregoing was served by email upon the following:", pitch: body, indent: 36}
  - each: service.recipients
    blocks: [{text: "{.}", left: 36, above: 7.2}]
  - group:
      - {text: "{signature.signer_line}", underline: true, left: 198}
      - {text: "{signature.role}", left: 198}
    above: 14.4
