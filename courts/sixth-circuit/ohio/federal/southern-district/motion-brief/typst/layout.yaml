# U.S. District Court for the Southern District of Ohio (ohsd): a motion with its memorandum in support (S.D. Ohio Civ.
# R. 7.2(a)(1)), on the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with S.D. Ohio's local
# rules overlaid here. The shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the
# merged layout by `fb engines gen`). Rules: S.D. Ohio Local Rules as amended 2024-10-21,
# https://www.ohsd.uscourts.gov/sites/ohsd/files/2024-10-21%20Local%20Rules.pdf (read 2026-10-14; ../README.md). The
# base already meets Civ. R. 5.1(a): 8 1/2 x 11 paper, double-spaced, one-inch margins on all sides, the pages
# numbered. The rules set no type size: the base's 12 point. Civ. R. 7.2(a)(3) only prefers 20 pages (no limit).
base: /lib/layouts/frcp-motion-brief.yaml
# Civ. R. 5.1(a): pages numbered consecutively, centered at the foot. As filed, the motion's page (the cover here) is
# not numbered and the memorandum is numbered from 1.
page_number: {align: center, front: decimal}
# FRCP 10(a): the court's name, as the exemplar sets it (the division follows, from the sample).
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "SOUTHERN DISTRICT OF OHIO"
footnote: {clearance: 7}
# Headings at the type size on the body pitch with no space of their own, kept with what follows (the exemplar's): the
# memorandum's title centered in bold capitals; a section (the author types its "I.") bold at the margin; a
# sub-section bold italic at the margin.
heading:
  - {align: center, bold: true, upper: true, pitch: body}
  - {bold: true, pitch: body}
  - {bold: true, italic: true, pitch: body}
# Page 1 (FRCP 10(a), 7(b)): the court's name and the division centered in bold; the caption: each party's names, a
# blank line, its designation an inch in, "v." at the margin a blank line from each, a ")" beside every line, the file
# number and the judge (a line apart) at the right from the top; the paper's title centered in bold between two rules
# across the page (the exemplar's); the motion (FRCP 7(b)(1): its grounds and the relief sought) double-spaced, and its
# own signature (FRCP 11(a)) from 3.1 inches in, single blank lines between them so that the motion keeps to its page
# as filed. The memorandum in support (Civ. R. 7.2(a)(1)) starts on the next page.
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - width: 237.6
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 72, above: 13.8}
            between:
              - {text: "v.", above: 13.8, below: 13.8}
      - {width: 21.6, repeat: ")"}
      - blocks:
          - {text: "{case_label|Case No.} {case_number}"}
          - {text: "{judge}", optional: true, above: 13.8}
    above: 13.8
  - {rule: 0.75, above: 6.9}
  - {text: "{brief_title}", align: center, bold: true, left: 36, right: 36, above: 6.9}
  - {text: "{legend}", align: center, bold: true, upper: true, optional: true, above: 13.8}
  - {rule: 0.75, above: 6.9}
  - when: motion
    blocks:
      - {markdown: "{motion}", pitch: body, indent: 36, above: 13.8}
      - group:
          - {text: "Respectfully submitted,", left: 223.2}
          - {text: "{signature.lines}", left: 223.2, above: 13.8}
        above: 13.8
front: ~
# FRCP 11(a): the date at the margin (when the sample gives one) and "Respectfully submitted," on one line, the
# signer's lines below it from 3.1 inches in; kept whole and with the last paragraph. Civ. R. 5.2(a): the certificate of
# service, when the sample gives one, kept whole: its title centered in bold capitals, the statement double-spaced, the
# signature.
closing:
  - columns:
      - width: 223.2
        blocks:
          - {text: "Dated: {date}", optional: true}
      - blocks:
          - {text: "Respectfully submitted,"}
          - {text: "{signature.lines}", above: 12}
    above: 24
  - when: certificate
    blocks:
      - group:
          - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, pitch: body}
          - {markdown: "{certificate.text}", pitch: body, indent: 36}
          - {text: "{certificate.lines}", left: 223.2, above: 24}
        above: 24
