# U.S. District Court for the Western District of Michigan (miwd): a brief supporting a dispositive motion, on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with W.D. Mich.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines
# gen`). Rules: W.D. Mich. Local Civil Rules, https://www.miwd.uscourts.gov/sites/miwd/files/Local%20Civil%20Rules.pdf
# (verified 2026-10-14; ../README.md quotes them). The base already meets LCivR 10.1: 8 1/2 x 11 paper, double spaced,
# type no smaller than 12 point (footnotes too), margins of at least one inch. The 25-page limit of LCivR 7.2(b) is
# checked on the render (../eval.yaml params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, as the exemplars set it (the division follows, from the sample).
constants:
  district: "WESTERN DISTRICT OF MICHIGAN"
# Word sets a footnote's rule 7.5 pt under the text with the 7 pt gap (the space LibreOffice keeps above its separator).
footnote: {clearance: 7.5}
# Block quotations single spaced, half an inch in on each side, half a double line above and below.
quote: {left: 36, right: 36, above: 12, below: 12}
# The cover unnumbered, the contents in roman numerals, the brief from 1 (both exemplars; LCivR 7.2(b) counts the brief's
# pages apart from the cover and tables).
page_number: {align: center, front: lower-roman}
# Headings numbered by the template (the author types none), single spaced, half a double line above and below, each
# level half an inch further in, its label in a half-inch box with the title's later lines hung under it: I. bold
# capitals, A. bold, 1. and a. roman (the exemplars' outline).
heading:
  - {bold: true, upper: true, number: "I.", label_box: 36, above: 12, below: 12}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 12, below: 12}
  - {number: "1.", label_box: 36, left: 72, above: 12, below: 12}
  - {number: "a.", label_box: 36, left: 108, above: 12, below: 12}
# FRCP 10(a), 7(b)(2): the court's name and the division, bold and centered, a short rule under them; the parties at the
# left, each designation half an inch in, "v." between them a blank line from each; at the right, centered on their
# height, the file number and the judge (a blank to fill in before assignment), and, when requested, ORAL ARGUMENT
# REQUESTED in bold underlined type (LCivR 7.2(d): the request goes in the caption); a rule across the page under the
# caption, in two halves (the exemplar's table border, one per column); then the brief's title, bold, underlined and
# centered (the primary exemplar's cover, usage/SOURCE.md). The cover is a page of its own.
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - {width: 135, blocks: []}
      - {width: 198, blocks: [{rule: 0.75}]}
      - {blocks: []}
    above: 13.8
  - columns:
      - width: 252
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 36, above: 13.8}
            between:
              - {text: "v.", above: 13.8, below: 13.8}
      - valign: center
        blocks:
          - {text: "Case No. {case_number|__________________}"}
          - {text: "Hon. {judge|__________________}", above: 13.8}
          - when: oral_argument_requested
            blocks:
              - {text: "ORAL ARGUMENT REQUESTED", bold: true, underline: true, above: 13.8}
    gutter: 23.4
    above: 24
  - columns:
      - {width: 234, blocks: [{rule: 0.75}]}
      - {blocks: [{rule: 0.75}]}
    above: 13.8
  - {text: "{brief_title}", align: center, bold: true, underline: true, left: 46.8, right: 46.8, above: 24}
front: []
# The table of contents (both exemplars): its title centered in bold capitals; the level 1 and 2 headings with their
# labels, each level half an inch in, the page in a 36 pt column, 12 pt between rows.
contents: {title: "TABLE OF CONTENTS", style: {align: center, below: 24}, depth: 2, col: 36, hang: 36, step: 36, above: 12}
# LCivR 7.2(b)(i) (Administrative Order No. 26-RL-067, effective October 12, 2026; ../rules.md MIWD-LEN-001): a
# dispositive-motion brief produced on a computer is at most 10,800 words, headings, footnotes, citations and quotations
# included, the caption, cover, tables and signature block not: the body's words, counted alike in every engine; over the
# limit the render stops.
words: {limit: 10800}
# FRCP 11(a), LCivR 10.3: the date of signing at the left of the block's first line; the firm, then "/s/" and the
# signer and counsel's lines (address, telephone, e-mail, whom they represent) from 2.8 in, single spaced; kept whole and
# with the last paragraph.
closing:
  - columns:
      - width: 201.6
        blocks:
          - {text: "Dated: {date}", optional: true}
      - blocks:
          - {text: "{signature.firm}"}
          - {text: "/s/ {signature.signer}", above: 12}
          - {text: "{signature.lines}"}
    above: 24
