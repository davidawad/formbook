# U.S. District Court for the Eastern District of Michigan (mied): a motion and its brief in one document (LR
# 7.1(d)(1)(A), as filed), on the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with E.D. Mich.'s
# local rules overlaid here: the motion first, numbered on its own (`lead`, fb-595.92), then the brief's cover, its
# front matter in roman and its text from 1. The shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/
# are generated from the merged layout by `fb engines gen`). Rules: E.D. Mich. LR 5.1 and 7.1 (../README.md quotes
# them). The base already meets LR 5.1(a)(2)'s one-inch margins and numbered pages.
base: /lib/layouts/frcp-motion-brief.yaml
# LR 5.1(a)(2), (3): 14-point type, footnotes included; double-spaced (quotations excepted): 32.2 pt lines, the single
# line 16.1 pt (the court title, the caption, the titles, quotations, the tables, the signature).
size: 14
pitch: {body: 32.2, single: 16.1}
footnote: {size: 14, gap: 7}
quote: {left: 36, right: 36, above: 16.1, below: 16.1}
# Pages numbered at the foot, centred, the number's line box ending half an inch above the page edge: the motion from
# 1; the brief's cover counted as i and unnumbered, its front matter from ii, its text from 1 (as filed).
page_number: {align: center, front: lower-roman, cover: counted, descent: 19.9}
# Headings at the type size on the body pitch, no space of their own, kept with what follows: a section centred in bold
# capitals; a point bold at the margin, a sub-point bold half an inch in, their later lines hanging half an inch (the
# sample types the numerals, as filed).
heading:
  - {align: center, bold: true, upper: true, pitch: body, above: 0, below: 0}
  - {bold: true, hang: 36, pitch: body, above: 0, below: 0}
  - {bold: true, left: 36, hang: 36, pitch: body, above: 0, below: 0}
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "FOR THE EASTERN DISTRICT OF MICHIGAN"
# The motion (LR 7.1(a)(1): its conferral statement in the text) up to the `<!-- brief -->` line: under its caption
# and title, closed by counsel's signature, numbered from 1. The caption (FRCP 10(a)): the court's name and the
# division centred in bold; a double line below, the parties single-spaced in a 3.3 in column, unruled, as filed (each
# party's names, a blank line, its designation an inch in; "v." between the parties with a blank line on each side),
# and 0.25 in right of it the case number and the judges; a double line below, the paper's title in bold,
# centred, single-spaced, a single line above the text.
lead:
  - marker: "<!-- brief -->"
    blocks:
      - &caption
        group:
          - {text: "{xd.court}", align: center, bold: true}
          - {text: "{xd.district}", align: center, bold: true}
          - {text: "{division}", align: center, bold: true, upper: true, optional: true}
          - columns:
              - width: 237.6
                blocks:
                  - each: caption.parties
                    blocks:
                      - {text: "{names}"}
                      - {text: "{designation}", left: 72, above: 16.1}
                    between:
                      - {text: "v.", above: 16.1, below: 16.1}
              - blocks:
                  - {text: "Case No. {case_number}"}
                  - {text: "{judge}", optional: true}
                  - {text: "{judges}", optional: true}
            gutter: 25.2
            above: 32.2
      - {text: "{motion_title}", align: center, bold: true, above: 32.2, below: 16.1}
    closing:
      - &signature
        group:
          - columns:
              - {width: 230.4, blocks: [{text: "Dated: {date}", optional: true}]}
              - blocks:
                  - {text: "Respectfully submitted,"}
                  - {text: "{signature.firm}", above: 16.1, optional: true}
                  - {text: "By: /s/ {signature.signer}", above: 16.1}
                  - {text: "{signature.signer}"}
                  - {text: "{signature.lines}", optional: true}
        above: 32.2
# The brief: its cover (the caption and the brief's title); LR 7.1(d)(2): the statement of the issues and the
# controlling or most appropriate authorities, the body up to its `<!-- toc -->` line, each section on a page of its
# own, numbered with the contents (ii ..); the table of contents (the headings with their pages, half an inch in per
# level); the text from 1, closed by counsel's signature.
cover:
  - *caption
  - {text: "{brief_title}", align: center, bold: true, above: 32.2}
body_before_tables: {marker: "<!-- toc -->", each_page: true}
contents: {title: "Table of Contents", style: {below: 32.2}, depth: 3, col: 36, hang: 36, step: 36, above: 8.05}
front: []
closing:
  - *signature
# FRCP 5(d)(1)(B): the certificate of service on a page of its own: its text from the sample's `service`, its signature
# lines from 3.2 in.
after_tail:
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, pitch: body}
      - {text: "{service.text}", pitch: body, indent: 36}
      - {text: "{service.lines}", left: 230.4, above: 32.2}
# LaTeX sets the authorities list's line "Richards v. Fashion Nova, LLC, .. Mar. 26, 2026)" fuller than typst at the face's
# 0.05 bp wider text block: the block at typst's width (gen.rs latex_bias).
latex_bias: 0
