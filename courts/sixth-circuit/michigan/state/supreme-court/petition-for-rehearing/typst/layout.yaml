# Michigan Supreme Court (mich): motion for rehearing, MCR 7.311(F) and 7.212(B). The whole layout, as data for the
# shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to the rules in ../../rules.md (MSC-*); lengths in points. No case text here: every
# string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # MSC-FORM-002, MCR 7.212(B)(5): 12-point type, footnotes the same
pitch:
  body: 20.7              # MSC-FORM-004, MCR 7.212(B)(5): 1.5-line spaced (Word's 1.5 lines, 1.5 x 1.15 x 12 pt)
  single: 13.8            # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 12 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MSC-FORM-003, MCR 7.212(B)(5): at least one-inch margins
indent: 36
page_number: {align: center, front: lower-roman}   # MSC-FORM-006: the cover (one page or more) unnumbered, the motion from 1
footnote: {size: 12, gap: 6}             # MSC-FORM-004: footnotes may be single spaced
quote: {left: 36, right: 36, above: 7.2, below: 12}   # MSC-FORM-004: quotations may be single spaced
# MSC-FORM-008: headings in capitals or boldface; the motion types its own numbering.
heading:
  - {align: center, bold: true, upper: true, above: 14.4, below: 12}
  - {bold: true, hang: 36, above: 12, below: 9.6}
  - {bold: true, italic: true, hang: 36, above: 12, below: 9.6}
  - {italic: true, hang: 36, above: 9.6, below: 7.2}
# MSC-COVER-004, MSC-FORM-005 (MCR 1.109(D)(1)(b), 7.312(C)): the court, the parties beside "MSC No." (left blank
# for the clerk), the lower-court numbers and the case statements, the identification of the paper, then counsel
# two to a row (name, address, telephone, bar number).
cover:
  - {text: "{court_line}", align: center, bold: true, upper: true}
  - {text: "IN THE SUPREME COURT", align: center, bold: true, above: 7.2}
  - {text: "{proceeding}", align: center, optional: true, above: 7.2}
  - {text: "{trial_court}", align: center, optional: true}
  - {text: "{judge}", align: center, optional: true}
  - columns:
      - width: 266.4
        blocks:
          - each: caption
            between:
              - {text: "v"}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", optional: true, below: 7.2}
      - blocks:
          - {text: "MSC No. \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_"}
          - {text: "COA No. {coa_no}", optional: true}
          - {text: "Trial Ct No. {trial_court_no}", optional: true}
          - each: caption_right
            above: 14.4
            blocks:
              - {text: "{.}", below: 7.2}
    gutter: 18
    above: 14.4
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 14.4}
  - {text: "ORAL ARGUMENT {oral_argument}", align: center, bold: true, upper: true, optional: true, above: 7.2}
  - columns: {each: counsel, per_row: 2, row_gap: 21.6, blocks: [{text: "{names}"}, {text: "{lines}", optional: true}]}
    gutter: 21.6
    above: 21.6
# The closing words, the date and the signature block (MSC-CERT-002: name, bar number, address, telephone), never
# split; then each certificate on a page of its own.
closing:
  - group:
      - {text: "{closing}", optional: true}
      - {text: "{date}", optional: true, above: 21.6}
      - {text: "{signature.firm}", left: 230.4, above: 4.8}
      - {text: "/s/ {signature.signer}", underline: true, left: 230.4, above: 7.2}
      - {text: "{signature.lines}", left: 230.4}
    above: 21.6
  - when: certificates
    blocks:
      - each: certificates
        blocks:
          - {break: true}
          - {text: "{heading}", align: center, bold: true, upper: true}
          - {text: "{text}", pitch: body, indent: 36, above: 4.8}
          - {text: "/s/ {signer}", underline: true, left: 230.4, optional: true, above: 4.8}
