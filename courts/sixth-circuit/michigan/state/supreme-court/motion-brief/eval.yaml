# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # LibreOffice sets footnote 2 (it does not fit under its anchor's line on page 3) on page 4 and keeps the line on
  # page 3; typst and LaTeX move the line on with its note (INPUT-motion-brief, page 3: "procedures outlined in
  # Section 4(2).2"), and pages 4 to 9 start on other words (XENG-002, XENG-003). No docx setting moves the line
  # (docs/open-items/fb-595.54.31.md); reported, not gated.
  cross_engine_docx: report
