# Michigan Court of Appeals (michctapp): complaint for an original action (MCR 7.206(D)). The whole layout, as data for the
# shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to MCR 7.212(B)(5) and 1.109(D)(1) (../rules.md, MICHCTAPP-*); lengths in points. No
# case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # MICHCTAPP-FORM-001: 12-point body text and footnotes
pitch:
  body: 20.7              # MCR 7.212(B)(5): 1.5-line spaced (Word's 1.5 lines, 1.5 x 1.15 x 12 pt)
  single: 13.8            # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 12 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MCR 7.212(B)(5): at least one-inch margins
indent: 36
page_number: {align: center, front: lower-roman}   # the cover unnumbered, the tables (when set) i, ii .., the complaint 1, 2 ..
footnote: {size: 12, gap: 7}             # MCR 7.212(B)(5): footnotes may be single spaced
quote: {left: 36, right: 36, above: 9.6, below: 14.4}   # MCR 7.212(B)(5): quotations may be single spaced
# A table of the body (the complaint's figures): single spaced, ruled between rows, the header row bold.
table: {stroke: 0.5, pad: 3.6, gutter: 7.2, above: 9.6, below: 14.4}
heading:
  - {align: center, bold: true, upper: true, above: 14.4, below: 12}
  - {bold: true, hang: 36, above: 12, below: 9.6}
  - {bold: true, italic: true, hang: 36, above: 9.6, below: 7.2}
# The cover (MCR 1.109(D)(1)(b): the court, the case number, the parties, counsel): the caption beside the case
# numbers, the title, then counsel two to a row at the foot of the page.
cover:
  - {text: "STATE OF MICHIGAN", align: center, bold: true}
  - {text: "IN THE COURT OF APPEALS", align: center, bold: true}
  - columns:
      - blocks:
          - each: caption
            between:
              - {text: "v", above: 3.6, below: 7.2}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", italic: true, above: 4.8}
      - width: 165.6
        blocks:
          - {text: "Court of Appeals No. {case_number}"}
          - {text: "{trial_court_case}", optional: true}
    gutter: 14.4
    above: 36
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 28.8}
  - {text: "{oral_argument}", align: center, bold: true, upper: true, optional: true, above: 3.6}
  - {text: "{subtitle}", align: center, bold: true, upper: true, optional: true, above: 3.6}
  - {fill: 1}
  - columns: {each: counsel, per_row: 2, row_gap: 14.4, blocks: [{text: "{names}", bold: true}, {text: "{lines}"}]}
    gutter: 21.6
    above: 21.6
# The table of contents (a frontmatter `toc: false` drops it; a complaint has none in the exemplar) and the index of
# authorities when the frontmatter lists any, on their own pages (MCR 7.212(C)(2), (3) as the briefs).
contents: {title: "Table of Contents", when: toc, default: true, depth: 2, col: 36, hang: 18, step: 18, above: 7.2}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 18
  above: 10.8
  group: {bold: true, above: 14.4, below: 2.4}
# The date, the signature block and the MCR 7.212(B)(3) word-count statement, never split; then the certificate of
# service on a page of its own.
keep_with_closing: true   # the last paragraph goes with the signature, never the signature alone on a page
closing:
  - group:
      - {text: "DATED: {date}", optional: true}
      - {text: "Respectfully submitted,", left: 216, above: 4.8}
      - {text: "{signature.firm}", bold: true, left: 216, optional: true, above: 4.8}
      - {text: "/s/ *{signature.signer}*", underline: true, left: 216, above: 4.8}
      - {text: "{signature.signer}", left: 216}
      - {text: "{signature.lines}", left: 216, above: 7.2}
      - {text: "This brief contains {word_count} countable words under MCR 7.212(B)(2)-(3).", optional: true, above: 7.2}
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true}
      - {text: "{service.paragraphs}", pitch: body, indent: 36, above: 4.8}
      - each: service.recipients
        blocks: [{text: "{.}", left: 72, above: 12}]
      - {text: "{service.closing}", optional: true, pitch: body, indent: 36}
      - {text: "/s/ *{signature.signer}*", underline: true, left: 216, above: 4.8}
      - {text: "{signature.signer}", left: 216}
