# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). latex is gated (the layout's
# `latex_bias: 0` keeps the p9 line newtx fitted one word more at the face's 0.05). docx is reported
# (docs/open-items/fb-595.54.63.md): LibreOffice keeps a footnote's anchor line on p8 while it moves the note (the
# model's Word footnote area), which shifts the docx pages from p9 on.
params:
  cross_engine: gate
  cross_engine_docx: report
