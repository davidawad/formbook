# Kentucky RAP 31 (A) (1) (e) (via RAP 34 (B) (4) for amicus briefs): briefs have a 1 1/2 inch left margin and 1 inch on the
# other sides. Text and footnotes are 12 pt (default). No page limit: RAP 31 (G) limits are words, with pages as the
# alternative figure (RAP 15 (C)); see ../rules.md.
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the typst
# template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where typst does
# (XENG-001..003 PASS on every INPUT): gated.
params:
  margin_left_pt: 108
  cross_engine: gate
