# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # LaTeX: every line and page breaks as typst's, but the "* * *" paragraph opening p21 starts with the model's
  # /ActualText BDC literal, which pdfTeX puts on the page list before the paragraph: the span opens on p20, the
  # folio "20" falls inside it and pdftotext loses it, and p21 reads an unmatched EMC (XENG-002 p20, XENG-003 p20
  # line 24, p21 line 1). Reported, not gated (docs/open-items/fb-595.54.55.md, S17; fb-595.54.55).
  cross_engine_latex: report
