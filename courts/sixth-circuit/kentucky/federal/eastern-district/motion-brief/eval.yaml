# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.17), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: E.D. Ky. LR 7.1(d), a motion or response is at most 25 pages without leave of court (counted here
  # with the certificate of service, the conservative reading).
  page_limit: 25
  # DEF-COVER-002, tier 3: the exemplar (one filer, usage/SOURCE.md) sets a section's number at a Word tab stop before
  # its centered title ("I.<tab>INTRODUCTION"); the template centers the number the author types with its title.
  cover_structure_accepted:
    - finding: 'alignment: "I." is indented'
      reason: "the exemplar's section number sits at a tab stop before its centered title (one filer's Word tabs, tier 3); the template centers the typed number with the title"
