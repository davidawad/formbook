# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx renders break every line and page
# where the typst render does (fb-595.54.3, on the shared layout model lib/*/xengine*), so a difference fails.
params:
  cross_engine: gate
  # DEF-COVER-001: the cover, then the disclosure statement on its own unnumbered page, before page i. The disclosure
  # is the court's own form (6 Cir. R. 26.1, form 6CA-1, paginated by itself: "Page 1 of 2" in FILED-EXAMPLE), not part
  # of the brief's roman sequence.
  cover_pages: 2
