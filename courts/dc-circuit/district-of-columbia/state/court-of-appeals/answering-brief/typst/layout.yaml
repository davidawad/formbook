# District of Columbia Court of Appeals (dc): answering brief. The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace
# to the Rules of the District of Columbia Court of Appeals, revised effective December 1, 2021 (../rules.md, DC-*);
# lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a
# court constant.
size: 14                  # DC-FORM-004 (Rule 32 (a) (4)): 14 point or larger, footnotes included
pitch:
  body: 32.2              # DC-FORM-002 (Rule 32 (a) (3)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # DC-FORM-002: quotations, headings and footnotes may be single spaced (1.15 x 14 pt)
# DC-FORM-003 (Rule 32 (a) (3)): at least one inch on all four sides; 4 pt more above and below so a superscript
# note mark or a descender stays inside the inch
margin: {top: 76, bottom: 76, left: 72, right: 72}
indent: 36
page_number: {align: center, from: 1}   # Rule 24 (e): every page numbered in sequence at the bottom, the cover is 1
footnote: {size: 14, pitch: single, gap: 7}   # DC-FORM-004: 14 point; DC-FORM-002: footnotes single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # DC-FORM-002: long quotations indented, single spaced
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The title page (DC-CONT-001, Rule 28 (a) (1); Rule 32 (a) (2)): the case number centered at the top, the court,
# the case title as docketed, the proceeding and the court below, the title of the brief, counsel.
cover:
  - {text: "No. {case_number}", align: center, bold: true}
  - {text: "IN THE DISTRICT OF COLUMBIA COURT OF APPEALS", align: center, bold: true, above: 14.4}
  - each: caption
    above: 14.4
    between:
      - {text: "v.", align: center, above: 14.4}
    blocks:
      - {text: "{names}", align: center, above: 14.4}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{proceeding}", align: center, above: 14.4, optional: true}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, above: 36}
  - each: counsel
    above: 28.8
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 8.4}
      - {text: "{lines}", left: 230.4}
# DC-CONT-003, -004 (Rule 28 (a) (3), (4)): the table of contents and the table of authorities with page references,
# each opening a page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 5.6}
# The date (when given) and the signature block (DC-FORM-006, Rule 32 (d): "/s/" and the attorney's name, typed);
# the date and the lines before the signers kept with them, a long block of several signers free to run on a page.
closing:
  - {text: "{date}", indent: 36, optional: true, keep: true, above: 21.6}
  - {text: "{signature.before}", left: 230.4, optional: true, keep: true, above: 21.6}
  - each: signature.signers
    above: 11.2
    blocks:
      - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6, keep: true}
      - {text: "{name}", left: 230.4}
      - {text: "{lines}", left: 230.4}
  # The certificate of service (DC-SVC-002, Rule 25 (d) (1) (B)) opens a page: the statement, the persons served,
  # the signature of the person who served.
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", pitch: body, indent: 36}
      - each: service.recipients
        blocks:
          - {text: "{.}", left: 72, above: 14}
      - {text: "{service.closing}", pitch: body, indent: 36, optional: true, above: 14}
      - each: service.signature.signers
        above: 11.2
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
