# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
font:
  size_pt: 13             # WYO-FORM-005: no smaller than 13 point
# Not gated yet (fb-595.54.75, docs/open-items/fb-595.54.75.md): the body breaks alike in all three engines but
# - typst marks an authority a page late when its find is the last word of a paragraph that ends a page (p11 "Wyo.
#   Const. art. 1, § 33.", p17 "Id. § 73(b)."): the table of authorities on p iii, iv differs (LaTeX and Word list 11,
#   17; XENG-003 there only);
# - Word sets fewer body lines above a double-spaced footnote (WYO-FORM-006) than typst: p7 ends two lines early
#   (XENG-002, -003 from p7).
params:
  cross_engine: report
