# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
font:
  size_pt: 13             # WYO-FORM-005: no smaller than 13 point
params:
  cross_engine: gate
  # Word only: LibreOffice sets the line that cites footnote 2 on p10 and the note on p11 (the double-spaced note,
  # WYO-FORM-006, does not fit p10 and LibreOffice moves the note, not its line); typst and LaTeX move the line with
  # the note to p11 (XENG-002, -003 from p11; the table's pages follow). A renderer limit outside the layout
  # (fb-595.54.82, "LibreOffice's note placement"); docs/open-items/fb-595.54.75.md
  cross_engine_docx: report
