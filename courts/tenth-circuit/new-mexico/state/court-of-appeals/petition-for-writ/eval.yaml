# NMRA 12-305(D)(1) (see ../rules.md): a proportionally-spaced typeface with serifs, such as Times New Roman, must be 14-point or larger
# (the cover page is set at 12 pt so the counsel block fits on one page, as the template allows for the 12-305(F)-(G) cover information).
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). docx breaks every line and page where
# typst does (XENG-001..003 pass). latex is held back: footnote 2 on page 4 does not fit, typst and Word carry its
# last line to page 5, the shared LaTeX model never splits a footnote (lib/latex/xengine.sty
# \interfootnotelinepenalty=10000) and moves the anchor line instead (docs/open-items/fb-595.54.54.md).
params:
  cross_engine: gate
  cross_engine_latex: report
