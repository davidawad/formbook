# NMRA 12-305(D)(1) (see ../rules.md): a proportionally-spaced typeface with serifs, such as Times New Roman, must be 14-point or larger
# (the cover page is set at 12 pt so the counsel block fits on one page, as the template allows for the 12-305(F)-(G) cover information).
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). docx breaks every line and page where
# typst does (XENG-001..003 pass). latex is held back: the shared LaTeX model sets the token after "¶" in an \mbox
# (lib/latex/xdoc.lua, xd.hold_sign_tokens) and that token here carries footnote 5 ("¶ 9.[^5]"), which LaTeX drops
# inside a box; the committed latex render is the one before that rule, which passes XENG-001..003 against this typst
# render (the footnote split of pass 1 is gone: notes are unsplit in every engine); a render at HEAD would not.
# docs/open-items/fb-595.54.54.md.
params:
  cross_engine: gate
  cross_engine_latex: report
