# New Mexico Court of Appeals (nmctapp): brief in chief (opening brief, NMRA 12-318(A)). The whole layout, as data for the shared document
# model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers
# trace to NMRA 12-305 and 12-318 (../rules.md, NMCTAPP-*); lengths in points. No case text here: every string printed
# comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # NMCTAPP-FORM-004: proportionally spaced, serifs, 14-point or larger
pitch:
  body: 32.2              # NMCTAPP-FORM-006: double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # NMCTAPP-FORM-006: headings, tables, footnotes, quotations, signature blocks may be single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NMCTAPP-FORM-002: one inch on every side
# Word only: the right margin 0.05 pt (1 twip) wider. p15 line 3 "… entirely new part of § 20.11.72" overflows the
# 468 pt measure by 0.05 pt in typst, which moves "§ 20.11.72" down; LibreOffice's twip-rounded advances set it
# 0.27 pt narrower and kept it. Measured: 0.05, 0.1 and 0.2 all break every line and page as typst does.
docx_bias: 0.05
indent: 36
page_number: {align: center, front: lower-roman}   # NMCTAPP-FORM-003: numbers at the bottom; the cover unnumbered, the tables i, ii .., the brief 1, 2 ..
footnote: {size: 14, gap: 7}                        # NMCTAPP-FORM-004, -006: 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # NMCTAPP-FORM-006: quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
  - {bold: true, hang: 36, above: 12.6, below: 9.8}
# The cover (NMRA 12-305(F), (G); NMCTAPP-CAP-*): the court, the parties beside the case number, the court or body below
# and its judge, the title, the oral-argument request, counsel two to a row; 12 point, single spaced, so it holds on one
# page (NMCTAPP-FORM-005: the cover may be 11 point or larger).
cover:
  - {text: "IN THE COURT OF APPEALS OF THE STATE OF NEW MEXICO", align: center, bold: true, size: 12, pitch: 13.8}
  - columns:
      - blocks:
          - each: parties
            blocks:
              # (the names, then their designation indented under them, as the filed cover sets them; "v." and "and" flush left)
              - when: names
                blocks:
                  - {each: names, blocks: [{text: "{.}", size: 12, pitch: 13.8, above: 7.2}]}
                  - {text: "{designation}", italic: true, optional: true, left: 36, size: 12, pitch: 13.8, above: 7.2}
              - unless: names
                blocks:
                  - {text: "{designation}", optional: true, size: 12, pitch: 13.8, above: 7.2}
      - width: 158.4
        blocks:
          - {text: "No. {case_number}", bold: true, size: 12, pitch: 13.8, above: 18.6}
    gutter: 21.6
    above: 9.6
  - {text: "{lower_court}", size: 12, pitch: 13.8, above: 12}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 12, pitch: 13.8, above: 12}
  - {text: "{oral_argument}", align: center, bold: true, optional: true, size: 12, pitch: 13.8, above: 7.2}
  - columns: {each: counsel, per_row: 2, row_gap: 7.2, blocks: [{text: "{heading}", italic: true, optional: true, size: 12, pitch: 13.8}, {text: "{lines}", size: 12, pitch: 13.8}]}
    gutter: 21.6
    above: 12
# NMRA 12-318(A)(1), (2); NMCTAPP-CONT-002: the table of contents and the table of authorities (by type of authority).
contents: {title: "Table of Contents", depth: 3, col: 36, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 4.2}
# NMRA 12-318(A)(1)(c), (G); NMCTAPP-CERT-001: the table of contents includes the statement of compliance (the body's
# word count and the program); the filed brief sets it on a page of its own after the contents, before the authorities,
# and the contents list it (a level-1 heading).
between_tables:
  - when: compliance
    blocks:
      - {text: "STATEMENT OF COMPLIANCE", heading: 1}
      - {text: "I certify that this brief complies with the type-volume limitation of Rule {compliance.rules} NMRA. According to {compliance.program}, the body of this brief, as defined by Rule {compliance.definition} NMRA, contains {compliance.words} words.", pitch: body, indent: 36}
      - group:
          - {text: "s/ {signature.signer}", underline: true, left: 230.4}
          - {text: "{signature.lines}", left: 230.4}
          - {text: "{signature.role}", bold: true, optional: true, left: 230.4}
        above: 5.6
# The date line and the signature block, kept with the brief's last paragraph and never split; the certificate of
# service on a page of its own.
keep_with_closing: true
closing:
  - group:
      - {text: "{date}", optional: true, pitch: body, indent: 36}
      - {text: "s/ {signature.signer}", underline: true, left: 230.4, above: 5.6}
      - {text: "{signature.lines}", left: 230.4}
      - {text: "{signature.role}", bold: true, optional: true, left: 230.4}
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true, keep: true, below: 16.8}
      - {text: "{service.paragraphs}", pitch: body, indent: 36}
      - group:
          - {text: "s/ {service.signature.signer}", underline: true, left: 230.4}
          - {text: "{service.signature.lines}", left: 230.4}
        above: 5.6
