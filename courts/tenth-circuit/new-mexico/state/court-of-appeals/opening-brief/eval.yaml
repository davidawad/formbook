# NMRA 12-305(D)(1) (see ../rules.md): a proportionally-spaced typeface with serifs, such as Times New Roman, must be 14-point or larger
# (the cover page may be 11-point only if needed to fit the cover on one page; the cover here is set at 14 pt).
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# typst does (XENG-001..003 pass on both); docx with the layout's docx_bias (p15 line 3, see typst/layout.yaml).
params:
  cross_engine: gate
