# NMRA 12-305(D)(1): 14-point or larger, serif (e.g. Times New Roman), for the body of the motion.
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the docx engine is generated from the typst template's
# layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Not gated: a bare URL in footnote 1 (p9) breaks after a
# period in typst ("https://www.nmlegis." / "gov/..."), where Word does not break it; the shared model has no URL rule.
# The latex engine is BLOCKED and not delivered: the generated LaTeX does not break the URL either, and it runs 72 pt
# into the right margin (DEF-FORM-002 fails); `fb engines gen` writes it again once the model has a URL rule
# (docs/open-items/fb-595.54.54.md).
params:
  cross_engine: report
