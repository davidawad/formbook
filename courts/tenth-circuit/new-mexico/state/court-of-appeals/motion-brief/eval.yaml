# NMRA 12-305(D)(1): 14-point or larger, serif (e.g. Times New Roman), for the body of the motion.
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# typst does (XENG-001..003 pass on both). The footnote after a "§" or "¶" token stays outside the token's box
# (fb-595.54.82), so LaTeX keeps it.
params:
  cross_engine: gate
