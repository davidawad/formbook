# NMRA 12-305(D)(1) (see ../rules.md): a proportionally-spaced typeface with serifs, such as Times New Roman, must be 14-point or larger.
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Not gated: page 5 line 12 ends
# "12 RP 2747–48 ¶" in typst (lib/typst/xengine.typ boxes "¶ 11–12" from the second pilcrow, so it breaks between the
# two and never after the en dash), while LaTeX and Word keep "¶¶" whole and break after "11–"; every later page
# shifts (docs/open-items/fb-595.54.54.md).
params:
  cross_engine: report
