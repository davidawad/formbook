# NMRA 12-305(D)(1) (see ../rules.md): a proportionally-spaced typeface with serifs, such as Times New Roman, must be 14-point or larger
# (the cover page may be 11-point only if needed to fit the cover on one page; the cover here is set at 12 pt by the template).
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). docx breaks every line and page where
# typst does (XENG-001..003 pass; the model's URL rule breaks the footnote URL alike). latex is held back: the shared
# LaTeX model sets the token after "§" in an \mbox (lib/latex/xdoc.lua, xd.hold_sign_tokens) and that token here
# carries footnote 4 ("§ 28.[^4]"), which LaTeX drops inside a box; the committed latex render is the one before that
# rule, which passes XENG-001..003 against this typst render; a render at HEAD would not. docs/open-items/fb-595.54.54.md.
params:
  cross_engine: gate
  cross_engine_latex: report
