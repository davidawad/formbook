# Utah Checklist for Briefs, Printing Requirements (URAP 24, 26, 27): proportionally spaced type 13-point or larger, footnotes included. Margins are at least one inch (the default).
font:
  size_pt: 13
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Reported, not gated: typst sets a
# footnote on another page than the line that carries its mark where LaTeX and Word move the line with the note, a gap
# of the shared model (docs/open-items/fb-595.54.45.md, shared-model requests).
params:
  cross_engine: report
