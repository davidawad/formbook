# Checklist for Briefs (revised December 2025; URAP 24, 26, 27): "Proportionally spaced typeface must be 13-point or larger for both text and footnotes." See ../rules.md, UTAHCTAPP-FORM-003.
font:
  size_pt: 13
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Both break every line and page where
# typst does (625/625 lines; Word's page lookup no longer finds the first body heading in the contents).
params:
  cross_engine: gate
