# Supreme Court of Kansas (kan): motion. The whole layout, as data for the shared document model (lib/typst/xdoc.typ;
# latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). The Kansas Supreme Court Rules were
# not retrieved (../rules.md): the numbers are the default tier-1 set (data/checks-default.yaml) and the conventions the
# filed exemplars share (KAN-FORM-*, KAN-CONT-001, KAN-CERT-001); lengths in points. No case text here: every string
# printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # the Kansas exemplars set the body in Times at about 13 pt (default floor 12 pt)
pitch:
  body: 29.9              # KAN-FORM-002: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # caption, headings, quotations, notes, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # one inch on every side (default; the exemplars do the same)
indent: 36
page_number: {align: center, from: 1}   # every page numbered at the foot from 1 (the motion exemplar)
footnote: {size: 13, gap: 7}             # KAN-FORM-002: footnotes at the text size, single spaced
quote: {left: 36, right: 36, above: 10.4, below: 15.6, gap: 6.5}   # KAN-FORM-002: block quotations indented, single
heading:
  - {align: center, bold: true, upper: true, above: 18.2, below: 13}
  - {bold: true, hang: 36, above: 15.6, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
table: {pad: 3.9, gutter: 14.4, above: 15.6, below: 15.6, stroke: 0.5}
# KAN-CONT-001: a motion opens on page 1 with the court, the case number, the caption with the party designations (each
# designation set off to the right under its party), the lower-court case and the title.
front:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 10.4}
  - each: parties
    above: 15.6
    blocks:
      - {text: "{name}", align: center, above: 6.5}
      - {text: "{role}", align: center, italic: true, left: 108}
  - {text: "{lower_court_case}", align: center, optional: true, above: 14.3}
  - {text: "{title}", align: center, bold: true, upper: true, left: 35.1, right: 35.1, above: 15.6, below: 15.6}
# KAN-CERT-001: the signature block, never split, then the certificate of service on a page of its own, signed by the
# signer alone (the signature line, the name and the first line under it).
closing:
  - group:
      - {text: "Respectfully submitted this {signature.date}.", indent: 36, optional: true}
      - {text: "{signature.lines}", left: 234, above: 7.8}
      - {text: "{signature.signer_line}", underline: true, left: 234, above: 7.8}
      - {text: "{signature.name}", left: 234, optional: true}
      - {text: "{signature.signer}", left: 234}
    above: 15.6
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 13}
      - {text: "{service.paragraphs}", pitch: body, indent: 36}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks: [{text: "{.}", left: 72, above: 13}]
      - {text: "{service.closing}", optional: true, pitch: body, indent: 36}
      - group:
          - {text: "{signature.signer_line}", underline: true, left: 234}
          - {text: "{signature.name}", left: 234, optional: true}
          - {text: "{signature.signer.0}", left: 234, optional: true}
        above: 13
