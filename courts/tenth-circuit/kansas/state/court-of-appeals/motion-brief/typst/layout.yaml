# Court of Appeals of Kansas (kanctapp): motion. The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). The Kansas
# rule text was not retrieved (../rules.md): every number follows the filed exemplar (KANCTAPP-FORM-006, kind C) or is
# a style choice of the template; lengths in points. No case text here: every string printed comes from the sample's
# frontmatter ({field}).
size: 13                  # KANCTAPP-FORM-002, -006: Times New Roman at about 13 pt, footnotes the same
pitch:
  body: 29.9              # KANCTAPP-FORM-003, -006: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # caption, headings, quotations, footnotes, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # KANCTAPP-FORM-004, -006: one inch on every side
indent: 36
page_number: {align: center, from: 1}   # KANCTAPP-FORM-004, -006: every page numbered at the bottom
footnote: {size: 13, pitch: single, gap: 7}   # KANCTAPP-FORM-002, -003: the text's size, single spaced
quote: {left: 36, right: 36, above: 10.4, below: 15.6}   # KANCTAPP-FORM-003: block quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 18.2, below: 13}
  - {bold: true, hang: 36, above: 15.6, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
# KANCTAPP-CONT-005: the caption on the first page (the court, the case number, the parties with their designations,
# the district court case), then the title and the motion under it.
front:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 10.4}
  - each: parties
    above: 15.6
    blocks:
      - {text: "{name}", align: center, above: 6.5}
      - {text: "{role}", align: center, italic: true, left: 108}
  - {text: "{lower_court_case}", align: center, optional: true, above: 15.6}
  - {text: "{title}", align: center, bold: true, upper: true, left: 36, right: 36, above: 15.6, below: 15.6}
# KANCTAPP-CERT-001: the date line and the signature block, never split; KANCTAPP-CERT-002: the certificate of
# service on a page of its own, signed by the first signer.
closing:
  - group:
      - {text: "Respectfully submitted this {signature.date}.", indent: 36, pitch: body, optional: true}
      - {text: "{signature.lines}", left: 234, above: 7.8, optional: true}
      - {text: "{signature.signer_line}", underline: true, left: 234, above: 14.95}
      - {text: "{signature.name}", left: 234, optional: true}
      - {text: "{signature.signer}", left: 234, optional: true}
    above: 15.6
  - {break: true}
  - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 13}
  - {text: "{service.paragraphs}", indent: 36, pitch: body}
  - when: service.recipients
    blocks:
      - each: service.recipients
        blocks:
          - {text: "{.}", left: 72, above: 13}
  - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
  - group:
      - {text: "{signature.signer_line}", underline: true, left: 234}
      - {text: "{signature.name}", left: 234, optional: true}
    above: 7.8
