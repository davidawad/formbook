# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.19), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: D. Kan. R. 7.1(d)(3), a principal brief in support of a motion other than for discovery, summary
  # judgment or class certification is at most 15 pages (counted here with the certificate of service, the
  # conservative reading).
  page_limit: 15
