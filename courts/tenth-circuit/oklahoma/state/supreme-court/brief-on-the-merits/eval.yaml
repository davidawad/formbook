# Okla. Sup. Ct. R. 1.11 (OKLA-FORM-002, ../rules.md): clear type not less than 12 point (footnotes 11 point).
font:
  size_pt: 12
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): latex and docx are generated from typst/layout.yaml
# (`fb engines gen`, fb-595.54.12) but not gated yet: a note that does not fit under its anchor line is set on the
# next page while the line stays, by LaTeX (note 8, p17) and by LibreOffice (note 7, p16), where typst moves the line
# with it (docs/open-items/fb-595.54.53.md, shared-model requests).
params:
  cross_engine: report
