# Okla. Sup. Ct. R. 1.11 (OKLA-FORM-002, ../rules.md): clear type not less than 12 point (footnotes 11 point).
font:
  size_pt: 12
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): latex and docx are generated from typst/layout.yaml
# (`fb engines gen`, fb-595.54.12) but not gated yet: LaTeX breaks after an en dash before an opening quote
# ("here– | “court", p22) where typst does not (UAX #14 LB19); LibreOffice sets a note that does not fit under its
# anchor line on the next page and keeps the line (p21-22) (docs/open-items/fb-595.54.53.md, shared-model requests).
params:
  cross_engine: report
