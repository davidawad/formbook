# Court of Criminal Appeals of Oklahoma (oklacrimapp): brief on the merits (the appellant's brief). The whole layout, as
# data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). The OCCA rules were not retrieved (../../rules.md): the numbers are the default
# tier-1 set (data/checks-default.yaml: US letter, one-inch margins, at least 12 pt) and the form the filed brief
# (usage/FILED-EXAMPLE-brief-on-the-merits.pdf, ../../rules.md EX-MERITS) sets. Lengths in points. No case text here:
# every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # EX-MERITS: 13-point body text (above the 12-point default floor)
pitch:
  body: 29.9              # EX-MERITS: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # default tier 1: one-inch margins
indent: 36                # EX-MERITS: paragraphs indented half an inch
page_number: {align: center, front: lower-roman}     # the cover unnumbered, the tables i, ii .., the brief 1, 2 ..
footnote: {size: 12, gap: 7}                         # EX-MERITS: footnotes 12-point, single spaced
quote: {left: 72, right: 72, above: 14.95, below: 29.9, gap: 29.9}   # EX-MERITS: block quotations single spaced, set in an inch
heading:
  - {align: center, bold: true, above: 29.9, below: 29.9}
  - {bold: true, above: 29.9, below: 29.9}
  - {bold: true, italic: true, left: 36, above: 29.9, below: 29.9}
# The cover (EX-MERITS): the case number, the court, the parties, the review sought, the title between rules, counsel.
cover:
  - {text: "No. {case_number}", align: center}
  - {text: "IN THE COURT OF CRIMINAL APPEALS OF THE STATE OF OKLAHOMA", align: center, bold: true, above: 32.4}
  - each: caption
    above: 25.2
    between:
      - {text: "v.", align: center, above: 14.4, below: 14.4}
    blocks:
      - {text: "{.}", align: center}
  - {text: "{on_review}", align: center, above: 25.2}
  - {rule: 0.75, above: 25.2}
  - {text: "{title}", align: center, bold: true, above: 14.4}
  - {rule: 0.75, above: 14.4}
  - {text: "{lead_counsel.name}", above: 86.4}
  - {text: "{lead_counsel.address}"}
  - {text: "{lead_counsel.phone}"}
  - {text: "{lead_counsel.email}"}
  - {text: "OBA No. {lead_counsel.bar_number}"}
  - {text: "{filing_party}", above: 21.6}
# The table of contents (headings to the third level) and the index of authorities, each on its own page.
contents: {title: "TABLE OF CONTENTS", depth: 3, col: 36, hang: 26, step: 26, above: 9.1}
authorities:
  title: "INDEX OF AUTHORITIES"
  col: 56
  hang: 18
  above: 9.1
  group: {bold: true, above: 29.9, below: 14.95}
