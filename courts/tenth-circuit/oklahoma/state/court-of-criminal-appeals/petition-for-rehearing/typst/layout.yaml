# Court of Criminal Appeals of Oklahoma (oklacrimapp): petition for rehearing. The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). The OCCA rules were not retrieved (../../rules.md): the numbers are the default tier-1 set
# (data/checks-default.yaml: US letter, one-inch margins, at least 12 pt) and the form the filed petition
# (usage/FILED-EXAMPLE-petition-for-rehearing.pdf, ../../rules.md EX-REHEARING) sets. Lengths in points. No case text
# here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # EX-REHEARING: 13-point body text (above the 12-point default floor)
pitch:
  body: 29.9              # EX-REHEARING: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # cover, headings, quotations, footnotes, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # default tier 1: one-inch margins
indent: 36                # EX-REHEARING: paragraphs indented half an inch
page_number: {align: center, from: 2}                # the cover unnumbered; the petition numbered from 2, the cover counted
footnote: {size: 13, gap: 7}                         # EX-REHEARING: footnotes in the body size, single spaced
quote: {left: 36, right: 36, above: 10.4, below: 15.6}   # EX-REHEARING: block quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 18.2, below: 13}
  - {bold: true, hang: 36, above: 15.6, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
# The cover (EX-REHEARING): the court, the case number, the parties centered with their roles, the title, counsel. Set as the top of the
# document, closed by a page break (the model sets a `cover` only before tables; this petition has none).
front:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "{case_number}", align: center, bold: true, above: 10.4}
  - each: parties
    above: 15.6
    blocks:
      - {text: "{name}", align: center, above: 6.5}
      - {text: "{role}", italic: true, left: 216, optional: true}
  - {text: "{lower_court_case}", align: center, optional: true, above: 7.8}
  - {text: "{title}", align: center, bold: true, upper: true, left: 32.4, right: 32.4, above: 108}
  - each: counsel
    above: 108
    blocks:
      - {text: "{names}", bold: true, left: 180, above: 10.4}
      - {text: "{lines}", left: 180}
  - {break: true}
# The signature block, never split; then the certificate of service (generated from the frontmatter) on a page of
# its own, signed by the signer.
closing:
  - group:
      - {text: "{signature.lines}", left: 234}
      - {text: "{signature.signer_line}", underline: true, left: 234, above: 14.95}
      - {text: "{signature.name}", left: 234}
      - {text: "{signature.signer}", left: 234}
    above: 23.4
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true}
      - {text: "I certify that on {service.date}, I served a copy of this {service.doc_type} on {service.served_on} by {service.method}, addressed as follows:", pitch: body, indent: 36, above: 13}
      - {text: "{service.address}", left: 72, above: 13}
      - group:
          - {text: "{signature.signer_line}", underline: true, left: 234}
          - {text: "{signature.name}", left: 234}
          - {text: "{signature.signer}", left: 234}
        above: 20.8
