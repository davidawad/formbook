# Court of Criminal Appeals of Oklahoma (oklacrimapp): brief of amicus curiae. The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). The OCCA rules were not retrieved (../../rules.md): the numbers are the default tier-1 set
# (data/checks-default.yaml: US letter, one-inch margins, at least 12 pt) and the form the filed amicus brief
# (usage/FILED-EXAMPLE-amicus-brief.pdf) sets. Lengths in points. No case text here: every string printed comes from
# the sample's frontmatter ({field}) or is a court constant.
size: 13                  # exemplar: 13-point body text (above the 12-point default floor)
pitch:
  body: 29.9              # exemplar: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # default tier 1: one-inch margins
indent: 36                # exemplar: paragraphs indented half an inch
page_number: {align: center, front: lower-roman}     # the cover unnumbered, the tables i, ii .., the brief 1, 2 ..
footnote: {size: 13, gap: 7}                         # exemplar: footnotes in the body size, single spaced
quote: {left: 36, right: 36, above: 10.4, below: 15.6}   # exemplar: block quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 20.8, below: 15.6}
  - {bold: true, hang: 36, above: 15.6, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
# The cover (exemplar): the court, the cause number, the parties centered with their designations, the proceeding
# below, the title, counsel at the right.
cover:
  - {text: "{court}", align: center, bold: true}
  - {text: "CAUSE NO. {case_number}", align: center, bold: true, above: 21.6}
  - each: caption
    above: 21.6
    between:
      - {text: "v.", align: center, above: 14.4, below: 14.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true, above: 5.2}
  - {text: "{proceeding}", align: center, optional: true, above: 21.6}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4, above: 57.6}
  - each: counsel
    above: 57.6
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 7.8}
      - {text: "{lines}", left: 230.4}
  - {text: "{phone}", optional: true, left: 230.4}
# The table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 19.5, step: 19.5, above: 11.7}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 19.5
  above: 11.7
  group: {bold: true, above: 15.6, below: 10.4}
# The date and the signature block (every signer: /s/ name, name, lines), never split.
closing:
  - group:
      - {text: "{date}", indent: 36, optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 10.4}
      - each: signature.signers
        above: 5.2
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.7}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4}
    above: 21.6
