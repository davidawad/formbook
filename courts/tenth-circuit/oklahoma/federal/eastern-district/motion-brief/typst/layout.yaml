# U.S. District Court for the Eastern District of Oklahoma (oked): a motion to dismiss and brief in support in one
# document (LCvR 7.1(b)), on the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with E.D. Okla.'s
# local rules overlaid here. The shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated
# from the merged layout by `fb engines gen`). Rules: E.D. Okla. Local Civil Rules (effective July 5, 2016),
# https://www.oked.uscourts.gov/sites/oked/files/Local_Civil_Rules.pdf (../README.md quotes them). The base already
# meets LCvR 5.2(a): letter paper, 12-point type, footnotes included, one-inch margins, lines spaced no less than 1.5
# (double), blocked quotations and footnotes single. The brief without tables is held to 15 pages (LCvR 7.1(c): a
# longer brief needs indexed tables of contents and of authorities, which this template does not make;
# ../eval.yaml params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, second line.
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "FOR THE EASTERN DISTRICT OF OKLAHOMA"
# Block quotations an inch in at the left and half an inch at the right (the exemplar, usage/SOURCE.md).
quote: {left: 72, right: 36}
# Word sets a footnote's rule 7.5 pt under the text with the 7 pt gap (the space LibreOffice keeps above its separator).
footnote: {clearance: 7.5}
# Sections centered in bold capitals; an argument "I." and a point "A." in bold, numbered by the template, each label
# in a half-inch box with the title's later lines hung under it (the exemplar's form).
heading:
  - {align: center, bold: true, upper: true, above: 13.8, below: 13.8}
  - {bold: true, number: "I.", label_box: 36, above: 13.8, below: 13.8}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 13.8, below: 13.8}
# FRCP 10(a) in the exemplar's form: the court's name; the parties in a ruled box (each party's names, its designation
# in italics two inches in, "v." an inch in), the case number at its right with the assigned judge a line below,
# centered on the box's height; then the paper's title centered in bold capitals, underlined (LCvR 7.1(b): a motion
# combined with its brief says so in its title).
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - columns:
      - width: 252
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", italic: true, left: 144, above: 13.8}
                between:
                  - {text: "v.", left: 72, above: 13.8, below: 13.8}
            stroke: 0.75
            inset: {top: 8.5, right: 7, bottom: 8.5, left: 7}
      - valign: center
        blocks:
          - {text: "{case_label|Case No.} {case_number}", left: 10.8}
          - {text: "{judge}", optional: true, left: 10.8, above: 13.8}
    gutter: 18
    above: 24
  - {text: "{brief_title}", align: center, bold: true, upper: true, underline: true, left: 36, right: 36, above: 24, below: 13.8}
# Fed. R. Civ. P. 5(d)(1): the certificate of service, the body's last section, on a page of its own (the exemplar),
# at the body's pitch and indent; then its signer at the right.
tail: {at: "CERTIFICATE OF SERVICE", break: true, pitch: body, indent: 36}
after_tail:
  - when: service
    blocks:
      - columns:
          - {width: 208.8, blocks: []}
          - blocks:
              - {text: "{service.signed}"}
              - {text: "{service.counsel_for}", optional: true, above: 24}
        above: 24
