# U.S. District Court for the Middle District of Florida (flmd): a motion with its incorporated legal memorandum, on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with M.D. Fla.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by
# `fb engines gen`). Rules: M.D. Fla. Local Rules (../../rules.md, FLMD-FORM-001..006, FLMD-LEN-001, which quote and
# cite them). The base already meets LR 1.08(a): 8 1/2 x 11 paper, one-inch margins, double-spaced main text,
# quotations and footnotes single-spaced. The 25-page limit of LR 3.01(a) is checked on the render (../eval.yaml
# params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# LR 1.08(b) (FLMD-FORM-004): Times New Roman only with main text of at least 14 point, an indented quotation of at
# least 13 and a footnote of at least 12: every text here is 14.
size: 14
# LR 1.08(a) (FLMD-FORM-003): main text double-spaced, 32.2 pt, twice the 16.1 pt single line of 14 pt type.
pitch: {body: 32.2, single: 16.1}
footnote: {size: 14}
# LR 1.08(a) (FLMD-FORM-005): page numbers centered at the bottom; page one not numbered, as the exemplar.
page_number: {align: center, from: 2}
# LR 1.08(a): an indented quotation single-spaced, half an inch in on each side, a single line after it.
quote: {left: 36, right: 36, above: 0, below: 16.1}
# Headings bold on the body pitch with no space of their own, as the exemplar sets them: the memorandum and its
# sections centered, an argument heading at the margin, a point in bold italics; numbers as the sample types them.
heading:
  - {align: center, bold: true, pitch: body}
  - {align: center, bold: true, pitch: body}
  - {bold: true, pitch: body}
  - {bold: true, italic: true, pitch: body}
# FRCP 10(a): the court's name, with the division (the sample's), bold and centered.
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "MIDDLE DISTRICT OF FLORIDA"
# FRCP 10(a) in the Florida form of the exemplar: the parties at the left (each party's names, its designation half an
# inch in, "v." between them) closed by a typed line ending in a slash; the case number at the right, half an inch
# down; the paper's title bold and centered, then the motion's lead-in (FRCP 7(b)(1): the grounds and the relief) as
# the first paragraph.
front:
  - {text: "{xd.court}", align: center, bold: true, pitch: single}
  - {text: "{xd.district}", align: center, bold: true, pitch: single}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - width: 208.8
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 36}
            between:
              - {text: "v."}
          - {text: "_____________________________/"}
      - blocks:
          - {text: "{case_label|Case No.} {case_number}", above: 36}
    gutter: 18
    above: 32.2
  - {text: "{brief_title}", align: center, bold: true, above: 32.2, below: 16.1}
  - {markdown: "{lead_in}", optional: true, pitch: body, indent: 36}
# FRCP 11(a): "Respectfully submitted," half an inch in, then from three inches in the firm, each counsel's block (the
# "s/" signature, name, Florida Bar number, e-mail), the firm's address and telephone and whom they represent, a
# single line between the groups; kept whole and with the last paragraph.
closing:
  - group:
      - {text: "Respectfully submitted,", left: 36}
      - group:
          - {text: "{signature.firm}", left: 216}
        above: 16.1
      - each: signature.counsel
        blocks:
          - {text: "{.}", left: 216}
        gap: 16.1
        above: 16.1
      - group:
          - {text: "{signature.address}", left: 216}
          - {text: "{signature.for}", left: 216, optional: true}
        above: 16.1
    above: 16.1
# FRCP 5(b): the certificate of service, when the sample gives one: its title a section heading, the certificate
# double-spaced, those served and the signer's lines at the margin on the body pitch; kept on one page.
after_tail:
  - when: service
    blocks:
      - group:
          - {text: "CERTIFICATE OF SERVICE", heading: 1}
          - {markdown: "{service.text}", pitch: body, indent: 36}
          - {text: "{service.served}", pitch: body}
          - {text: "{service.signer}", pitch: body}
        above: 32.2
