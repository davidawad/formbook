  field: under_seal_requirements
  url: https://www.flmd.uscourts.gov/judges/philip-lammens#general
  text: Confidentiality orders should be limited to documents or specific categories of documents that are subject to confidential treatment under prevailing law. Judge Lammens will not issue blanket confidentiality orders that provide that any information designated by the parties as confidential will be protected. However, the parties are free to enter into private confidentiality agreements. Under Fed. R. Civ. P. 26 (c), good cause must be shown before a protective order will be granted. In rare circumstances, the Court may order the filing of information under seal. See Middle District Discovery Handbook Section I. C. 2. If a request for filing under seal is made, the Eleventh Circuit precedent setting forth the governing standard and the public's interests, as well as the requirements of Local Rule 1.11, should be addressed.
