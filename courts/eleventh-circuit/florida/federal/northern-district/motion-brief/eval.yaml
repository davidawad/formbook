# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.4), so they
# break every line and page where the typst render does, and a difference fails. The length rule is a word limit
# (Loc. R. 7.1(F), 8,000 words: layout.yaml `words`, every engine), not a page limit (DEF-LEN-001 skips).
params:
  cross_engine: gate
