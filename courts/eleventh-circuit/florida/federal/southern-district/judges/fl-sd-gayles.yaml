- topic: Remote appearances
  field: remote_appearances
  url: https://www.flsd.uscourts.gov/content/judge-darrin-p-gayles
  text: Counsel for each party shall appear in person for hearings on all substantive motions. With prior permission from the Court, counsel residing outside of Miami-Dade and/or Broward Counties may appear by telephone for status conferences and calendar calls.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.flsd.uscourts.gov/content/judge-darrin-p-gayles
  text: 'Calendar Call: Our Calendar Calls are typically held on the Wednesday prior to the commencement of the two-week trial period at 9:30 a.m., unless otherwise noted. The Court will not set a pretrial conference. The Court will set the case for trial following receipt of the parties'' joint scheduling report and scheduling order.'
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.flsd.uscourts.gov/content/judge-darrin-p-gayles
  text: Multiple Plaintiffs or Defendants shall file joint motions with co-parties unless there are clear conflicts of position. The applicable pages limits for individual parties shall apply for joint pleadings absent leave of court.
