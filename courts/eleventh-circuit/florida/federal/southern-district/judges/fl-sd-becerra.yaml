  url: https://www.flsd.uscourts.gov/sites/flsd/files/JB_RevisedTemplateSchedulingOrder.pdf
  text: A motion for continuance of the trial shall not stay or otherwise change any of the deadlines above. Unless a true emergency situation arises, a motion for continuance will not be considered unless it is filed at least thirty days prior to the scheduled trial date. Absent an emergency, motions for extensions of time must be filed no later than three business days prior to the deadline from which relief is being sought. All requests for extensions of time must include (1) the conferral statement required under Local Rule 7.1 specifying what methods were used to confer; (2) a list of any prior motions for extension of time, the basis for those requests, and whether they were granted; (3) a specific statement regarding the circumstances necessitating the requested relief; (4) a specific period for the relief requested, and (5) a statement as to whether the request impacts the deadline to file a dispositive motion or trial date.
