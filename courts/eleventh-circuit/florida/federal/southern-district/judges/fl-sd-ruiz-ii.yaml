checklist:
- topic: Proposed orders
  field: proposed_orders
  url: https://www.flsd.uscourts.gov/sites/flsd/files/JudgeRodolfoRuiz-Policies-and-Procedures-6.14.2024edit-RAR.pdf#page=2
  text: Parties shall submit all proposed orders in Microsoft Word format to ruiz@flsd.uscourts.gov. In addition to the proposed order requirements outlined in S.D. Fla. CM/ECF Administrative Procedure 3(I)(6), and the Court's Scheduling Order Procedures, the Court further requires any party moving for unopposed relief to submit a proposed order granting the requested unopposed relief. The proposed order shall be submitted in Microsoft Word format to ruiz@flsd.uscourts.gov on the same day the unopposed motion is filed.
- topic: Discovery disputes
  field: discovery_referral
  url: https://www.flsd.uscourts.gov/sites/flsd/files/JudgeRodolfoRuiz-Policies-and-Procedures-6.14.2024edit-RAR.pdf#page=2
  text: The Court refers all discovery matters to the Magistrate Judge. The parties shall follow the Discovery Procedures of the paired Magistrate Judge to determine whether filing written discovery motions, including motions to compel, for protective order, or for sanctions, is permitted.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://www.flsd.uscourts.gov/sites/flsd/files/JudgeRodolfoRuiz-Policies-and-Procedures-6.14.2024edit-RAR.pdf#page=2
  text: Counsel for each party shall appear in person for hearings on all substantive motions. Counsel may request to appear by telephone or video teleconference platform by Motion at least one (1) day before the scheduled hearing.
- topic: Notice of settlement
  field: settlement_notification
  url: https://www.flsd.uscourts.gov/sites/flsd/files/JudgeRodolfoRuiz-Policies-and-Procedures-6.14.2024edit-RAR.pdf#page=2
  text: If a settlement is reached, please immediately contact chambers by telephone (305-523-5730) and/or email (ruiz@flsd.uscourts.gov) in addition to filing a notice of settlement on CM/ECF.
