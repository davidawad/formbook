  text: Settlement conferences generally start at 9 a.m. and continue until at least 12 p.m. The Court requires in-person appearances of parties with full authority to resolve the case. Counsel may move for Zoom appearances if there are truly extraordinary circumstances. Except for cases filed under the Fair Labor Standards Act, the Court requires each party to submit a pre-conference, confidential settlement memorandum. Additional details will be outlined in the Court's Order Scheduling Settlement Conference.
