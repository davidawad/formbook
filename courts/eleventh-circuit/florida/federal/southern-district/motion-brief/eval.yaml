# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.5), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: L.R. 7.1(c)(2) (FLSD-LEN-001), a motion with its incorporated memorandum at most 20 pages, the title
  # page, signature page and certificate of service excluded (the count here is every page, the conservative reading).
  page_limit: 20
