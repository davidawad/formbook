# U.S. District Court for the Southern District of Florida (flsd): a motion with its incorporated memorandum of law
# (L.R. 7.1(a)(1)), on the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with S.D. Fla.'s local
# rules overlaid here. The shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the
# merged layout by `fb engines gen`). Rules: S.D. Fla. Local Rules, effective December 1, 2025 (../../rules.md,
# FLSD-FORM-001..006, FLSD-CONT-001, FLSD-LEN-001, which quote and cite them; ../README.md). The base already meets
# L.R. 5.1(a)(3)-(4): 8 1/2 x 11 paper, one-inch margins, 12-point type, footnotes included, footnotes single-spaced,
# pages numbered consecutively at the bottom center. The 20-page limit of L.R. 7.1(c)(2) is checked on the render
# (../eval.yaml params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# LaTeX only: the text block 0.1 pt wider than typst's, not the face's 0.05 (tools/fb/src/enginegen/gen.rs latex_bias): newtx
# runs 0.06 pt wider than typst over the first line of note 2, which typst fills to 0.01 pt of the margin.
latex_bias: 0.1
# L.R. 5.1(a)(4) (FLSD-FORM-002): at least one and one-half spaces between lines; double, as the exemplar sets it: 27.6
# pt, twice the 13.8 pt single line of 12 pt type.
pitch: {body: 27.6}
# L.R. 5.1(a)(4): quoted material of fifty words or more may be single-spaced: half an inch in on each side, a double
# line after it.
quote: {left: 36, right: 36, above: 0, below: 27.6}
# L.R. 5.1(a)(5)(A) (FLSD-CONT-001): the court's name centered across the page, with the division the sample gives.
constants:
  district: "SOUTHERN DISTRICT OF FLORIDA"
# L.R. 5.1(a)(5)(A)-(D) (FLSD-CONT-001), in order: the court's name centered; a double line below it the docket line
# centered (the category, the number with the judges' last names, as the sample types it); the style of the action in
# the left half of the page (each party's names, its designation half an inch in a line below, "v." between them, the
# style ruled below and closed by a "/" at its right, as the exemplar); the title of the paper bold and centered.
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - {text: "{case_label|CIVIL CASE NO.} {case_number}", align: center, above: 27.6}
  - columns:
      - width: 234
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", left: 36, above: 13.8}
                between:
                  - {text: "v.", below: 13.8}
              - {text: "/", align: right}
            stroke: {bottom: 0.75}
            inset: {bottom: 1}
    above: 27.6
  - {text: "{title}", align: center, bold: true, upper: true, left: 54, right: 54, above: 27.6, below: 27.6}
# L.R. 5.1(a)(6), FRCP 11(a): the date line at the margin; from 3 inches in "Respectfully submitted,", a double line
# below it "By: s/" and the signer, then each counsel's name, bar number, e-mail, the firm's address and telephone and
# whom they represent; kept whole and with the last paragraph.
closing:
  - group:
      - {text: "Dated: {date}"}
      - {text: "Respectfully submitted,", left: 216, above: 27.6}
      - {text: "By: s/ {signature.signer}", left: 216, above: 27.6}
      - {text: "{signature.lines}", left: 216}
    above: 27.6
# L.R. 5.2, FRCP 5(b), 5(d)(1)(B): the certificate of service, when the sample gives one, in the exemplar's CM/ECF
# words, double-spaced; the signer's "s/" signature and name at 3 inches; the service list at the margin; kept on
# one page.
after_tail:
  - when: service
    blocks:
      - group:
          - {text: "CERTIFICATE OF SERVICE", heading: 1}
          - {text: "I HEREBY CERTIFY that on this {service.date}, I electronically filed the foregoing document with the Clerk of the Court using CM/ECF. I also certify that the foregoing document is being served this day on all counsel of record in the manner specified, either via transmission of Notices of Electronic Filing generated by CM/ECF or in some other authorized manner for those counsel or parties who are not authorized to receive electronically Notices of Electronic Filing.", pitch: body, indent: 36}
          - {text: "s/{service.signer}", left: 216, above: 27.6}
          - {text: "{service.signer}", left: 216}
          - {text: "SERVICE LIST", bold: true, above: 27.6, below: 13.8}
          - {text: "{service.list}"}
        above: 27.6
