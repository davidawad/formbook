# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Bookman Old Style (TeX Gyre Bonum, the vendored clone), so the embedded font names carry TeXGyreBonum.
font:
  size_pt: 14
  pdf_prefix: "TeXGyreBonum"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): gated. typst is on the shared document model
# (typst/layout.yaml); latex/ and docx/ are generated by `fb engines gen` (TeX Gyre Bonum, fb-595.54.82) and must
# break every line where typst does.
params:
  cross_engine: gate
