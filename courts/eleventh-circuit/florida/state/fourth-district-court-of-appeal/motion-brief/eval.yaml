# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Bookman Old Style (TeX Gyre Bonum, the vendored clone), so the embedded font names carry TeXGyreBonum.
font:
  size_pt: 14
  pdf_prefix: "TeXGyreBonum"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): reported, not gated. The typst template is on the
# shared document model (typst/layout.yaml), but `fb engines gen` has no LaTeX face for Bookman Old Style / TeX Gyre
# Bonum (FLADISTCTAPP4-FORM-005), so latex/ and docx/ are not generated yet (docs/open-items/fb-595.54.39.md).
params:
  cross_engine: report
