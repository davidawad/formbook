# Fourth District Court of Appeal (fladistctapp4): motion and supporting memorandum (motion-brief). The whole layout,
# as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Fla. R. App. P. 9.045 and 9.210 (../../rules.md,
# FLADISTCTAPP4-*); lengths in points. No case text here: every string printed comes from the sample's frontmatter
# ({field}) or is a court constant.
size: 14                  # FLADISTCTAPP4-FORM-005: Bookman Old Style 14 point; footnotes and quotations too (-FORM-006)
pitch:
  body: 32.9              # FLADISTCTAPP4-FORM-004: double spaced (Word's double for Bookman Old Style 14 pt, 2 x 16.45)
  single: 16.45           # caption, headings, quotations, footnotes, signature: single (-FORM-006); Word's single line
# FLADISTCTAPP4-FORM-003: no less than one inch; top and bottom 4 pt deeper, as the template had them
margin: {top: 76, bottom: 76, left: 72, right: 72}
indent: 36
page_number: {align: center, from: 1}   # pages numbered at the foot (Rule 9.045 sets no rule; the exemplars' convention)
footnote: {size: 14, gap: 7}             # FLADISTCTAPP4-FORM-006: 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # FLADISTCTAPP4-FORM-006: quotations single spaced, 14 point
heading:                                 # FLADISTCTAPP4-FORM-006: at least body size, single spaced
  - {align: center, bold: true, upper: true, above: 19.6, below: 14}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# FLADISTCTAPP4-MOT-001 (a document under Rule 9.045): the court, the case numbers, the parties and their
# designations, the title of the motion, at the top of page 1 as the filed motion has them (no table of authorities).
front:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "Case No. {case_number}", align: center, bold: true, above: 11.2}
  - each: parties
    blocks:
      - {text: "{name}", align: center, above: 16.8}
      - {text: "{role}", align: center, italic: true, left: 108}
  - {text: "{lower_court_case}", align: center, optional: true, above: 25.2}
  - {text: "{title}", align: center, bold: true, upper: true, left: 35, right: 35, above: 28, below: 28}
# Rule 9.045 sets no signature form (Fla. R. Gen. Prac. & Jud. Admin. 2.515, not retrieved): the date line and the
# signature 3 in from the margin, kept whole; then the certificate of service on a page of its own, signed with
# the name and the bar number.
closing:
  - group:
      - {text: "Respectfully submitted this {signature.date}.", indent: 36, pitch: body, optional: true}
      - {text: "{signature.signer_line}", left: 216, underline: true, above: 8.4}
      - {text: "{signature.name}", left: 216, optional: true}
      - {text: "{signature.signer}", left: 216}
    above: 16.8
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 14}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - each: service.recipients
        blocks:
          - group:
              - {text: "{.}", left: 72}
            above: 14
            below: 14
      - group:
          - {text: "{signature.signer_line}", left: 216, underline: true}
          - {text: "{signature.name}", left: 216, optional: true}
          - {text: "{signature.signer.0}", left: 216, optional: true}   # the bar number (the first signer line)
        above: 8.4
