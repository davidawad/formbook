# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Arial (Liberation Sans, the vendored metric clone), so the embedded font names carry LiberationSans.
font:
  size_pt: 14
  pdf_prefix: "LiberationSans"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): reported, not gated. typst is on the shared document
# model (typst/layout.yaml) and latex/ and docx/ are generated (TeX Gyre Heros, fb-595.54.82); pages are equal in all
# three engines; the line differences left are not this folder's (docs/open-items/fb-595.54.39.md): latex 952/953
# lines, the one other line (p35 line 7) identical on the page but read as "2023.4" from typst (its superscript
# glyph joins the word in the PDF text) and "2023." "4" from LaTeX; LibreOffice sets note 3 on the page after its
# anchor line (p24; pages 25-32 end a few lines early: 941/953 lines).
params:
  cross_engine: report
