# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Bookman Old Style (TeX Gyre Bonum, the vendored clone), so the embedded font names carry TeXGyreBonum.
font:
  size_pt: 14
  pdf_prefix: "TeXGyreBonum"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): typst is on the shared document model
# (typst/layout.yaml); latex/ and docx/ are generated (TeX Gyre Bonum, fb-595.54.82). latex is gated: 623/623 lines as
# typst. docx is reported: pages equal, 622/623 lines; one contents row (p2, "C. No error appears ... Final
# Judgment.") typst holds on its line, LibreOffice carries its last word, the model's contents row in Word
# (docs/open-items/fb-595.54.39.md).
params:
  cross_engine: gate
  cross_engine_docx: report
