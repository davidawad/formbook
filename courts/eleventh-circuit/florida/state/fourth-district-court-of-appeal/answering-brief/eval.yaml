# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Bookman Old Style (TeX Gyre Bonum, the vendored clone), so the embedded font names carry TeXGyreBonum.
font:
  size_pt: 14
  pdf_prefix: "TeXGyreBonum"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): reported, not gated. typst is on the shared document
# model (typst/layout.yaml) and latex/ is generated (TeX Gyre Bonum, fb-595.54.82): 32 pages as typst, 618/623 lines;
# latex has no break after a slash inside a word ("Plaintiff/Counterdefendant", p9). docx/ is not generated: Word's
# page lookup (tools/fb docxpages.rs) misses an authority whose find starts a heading ("Applegate requires
# affirmance ...") and the render stops (docs/open-items/fb-595.54.39.md).
params:
  cross_engine: report
