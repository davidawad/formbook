# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Arial (Liberation Sans, the vendored metric clone), so the embedded font names carry LiberationSans.
font:
  size_pt: 14
  pdf_prefix: "LiberationSans"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): gated. typst is on the shared document model
# (typst/layout.yaml, heading numbers by the model); latex/ and docx/ are generated by `fb engines gen` (TeX Gyre
# Heros, fb-595.54.82) and must break every line where typst does.
params:
  cross_engine: gate
