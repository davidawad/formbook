# Florida Fifth District Court of Appeal (fladistctapp5): motion (motion-brief). The whole layout, as data for the
# shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Fla. R. App. P. 9.045, 9.210 and 9.300 (../../rules.md, FLADISTCTAPP5-*); lengths
# in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court
# constant.
size: 14                  # FLADISTCTAPP5-FORM-005: Bookman Old Style 14 point; footnotes and quotations too (-FORM-006)
pitch:
  body: 32.9              # FLADISTCTAPP5-FORM-004: double spaced (Word's double for Bookman Old Style 14 pt, 2 x 16.45)
  single: 16.45           # caption, headings, quotations, footnotes, signature: single (-FORM-006)
# FLADISTCTAPP5-FORM-003: no less than one inch; top and bottom 4 pt deeper keep a note mark or descender inside it
margin: {top: 76, bottom: 76, left: 72, right: 72}
indent: 36                # style: half-inch first-line indent
page_number: {align: center, from: 1}   # style (Rule 9.045 sets none; the filed motions): numbered from page 1
footnote: {size: 14, gap: 7}             # FLADISTCTAPP5-FORM-006: 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # FLADISTCTAPP5-FORM-006: quotations single spaced, 14 point
heading:                                 # FLADISTCTAPP5-FORM-006: at the text size, single spaced
  - {align: center, bold: true, upper: true, above: 19.6, below: 14}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# FLADISTCTAPP5-MOT-001 (a document under Rule 9.045): the court, the case number, the parties with their designations
# (a party line "v." with no designation sets none), the lower tribunal, the title; the motion starts under the title
# (`cover_page: false`, as filed). The old template's own cover page (`cover_page: true`) is not in the model: a break
# and fills that a field switches (docs/open-items/fb-595.54.41.md).
front:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "Case No. {case_number}", align: center, bold: true, above: 11.2}
  - each: parties
    above: 16.8
    blocks:
      - {text: "{name}", align: center, above: 7}
      - {text: "{role}", align: center, italic: true, left: 108, optional: true}
  - {text: "{lower_court_case}", align: center, optional: true, above: 8.4}
  - {text: "{title}", align: center, bold: true, upper: true, left: 34, right: 34, above: 16.8, below: 16.8}
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6, when: toc}
authorities:
  title: "Table of Authorities"
  col: 72
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 4.2}
# Rule 9.045 sets no signature form: the date line, then 3 in from the margin the underlined "/s/" line, the typed name,
# the bar number and contact lines, never split; then the certificate of service (Fla. R. Gen. Prac. & Jud. Admin.
# 2.516) on a page of its own, signed with the "/s/" line, the name and the bar number.
keep_with_closing: true   # style: the prayer for relief stays with the signature it introduces
closing:
  - group:
      - {text: "Respectfully submitted this {signature.date}.", indent: 36, pitch: body, optional: true}
      - group:
          - {text: "{signature.lines}", left: 216, optional: true, below: 16.45}
          - {text: "{signature.signer_line}", left: 216, underline: true}
          - {text: "{signature.name}", left: 216, optional: true}
          - {text: "{signature.signer}", left: 216, optional: true}
        above: 8.4
    above: 16.8
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", heading: 1}
      - when: service.paragraphs
        blocks:
          - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - unless: service.paragraphs
        blocks:
          - {text: "I certify that on {service.date}, I served a copy of this {service.doc_type} on {service.served_on} by {service.method}, addressed as follows:", indent: 36, pitch: body}
      - each: service.recipients
        blocks:
          - group:
              - {text: "{.}", left: 72}
            above: 14
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - group:
          - {text: "{signature.signer_line}", left: 216, underline: true}
          - {text: "{signature.name}", left: 216, optional: true}
          - {text: "{signature.signer.0}", left: 216, optional: true}
        above: 8.4
