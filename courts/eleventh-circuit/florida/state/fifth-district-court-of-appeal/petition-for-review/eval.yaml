# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Arial (Liberation Sans, the vendored metric clone), so the embedded font names carry LiberationSans.
font:
  size_pt: 14
  pdf_prefix: "LiberationSans"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): reported, not gated. The typst template is on the
# shared document model (typst/layout.yaml), but `fb engines gen` has no LaTeX face for Arial / Liberation Sans
# (FLADISTCTAPP5-FORM-005), so latex/ and docx/ are not generated yet (docs/open-items/fb-595.54.41.md).
params:
  cross_engine: report
