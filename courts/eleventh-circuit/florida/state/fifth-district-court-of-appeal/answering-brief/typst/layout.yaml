# Florida Fifth District Court of Appeal (fladistctapp5): answering brief (the appellee's answer brief). The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Fla. R. App. P. 9.045 and 9.210 (../../rules.md, FLADISTCTAPP5-*);
# lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a
# court constant.
size: 14                  # FLADISTCTAPP5-FORM-005: Bookman Old Style 14 point; footnotes and quotations too (-FORM-006)
pitch:
  body: 32.9              # FLADISTCTAPP5-FORM-004: double spaced (Word's double for Bookman Old Style 14 pt, 2 x 16.45)
  single: 16.45           # cover, headings, tables, quotations, footnotes, signature: single (-FORM-006)
# FLADISTCTAPP5-FORM-003: no less than one inch; top and bottom 4 pt deeper keep a note mark or descender inside it
margin: {top: 76, bottom: 76, left: 72, right: 72}
indent: 36                # style: half-inch first-line indent
page_number: {align: center, from: 1}   # style (Rule 9.045 sets none; the filed briefs): the cover is page 1
footnote: {size: 14, gap: 7}             # FLADISTCTAPP5-FORM-006: 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # FLADISTCTAPP5-FORM-006: quotations single spaced, 14 point
heading:                                 # FLADISTCTAPP5-FORM-006: at the text size, single spaced
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# FLADISTCTAPP5-BRIEF-001: the cover: the court; the caption with each party's designation, closed by a rule, beside
# the case numbers; the title halfway between the caption and counsel, counsel at the foot of the cover.
cover:
  - {text: "{court}", align: center, bold: true, upper: true}
  - columns:
      - width: 266
        blocks:
          - each: caption
            between:
              - {text: "v.", align: center, above: 14.4, below: 14.4}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 108, above: 5.6}
          - {text: "____________________________________/", above: 2}
      - blocks:
          - {text: "DCA CASE NO.", above: 72}
          - {text: "{case_number}"}
          - when: lower_court_case
            blocks:
              - {text: "L.T. CASE NO.", above: 8.4}
              - {text: "{lower_court_case}"}
    gutter: 14
    above: 28.8
  - {fill: 1}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.8}
  - {fill: 1}
  - each: counsel
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 8.4}
      - {text: "{lines}", left: 230.4, optional: true}
  - {text: "{phone}", left: 230.4, optional: true}
# FLADISTCTAPP5-BRIEF-001: the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 4.2}
# Rule 9.045 sets no signature form: "Respectfully submitted," and each signer's "/s/" and typed name with the bar
# number, then the office's lines, 3.2 in from the margin and never split; then the certificate of service, signed by
# the first signer, and the certificate of compliance (FLADISTCTAPP5-FORM-008, Rule 9.045(e)), each on a page of its own.
closing:
  - group:
      - {text: "Respectfully submitted,", left: 230.4}
      - each: signature.signers
        blocks:
          - {text: "/s/ {name}", left: 230.4, above: 12.6}
          - {text: "{lines}", left: 230.4, optional: true}
      - {text: "{signature.lines}", left: 230.4, above: 8.4, optional: true}
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", heading: 1}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - each: service.recipients
        blocks:
          - group:
              - {text: "{.}", left: 72}
            above: 8.4
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - {text: "/s/ {signature.signers.0.name}", left: 230.4, above: 16.8}
  - when: compliance
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF COMPLIANCE", heading: 1}
      - {text: "{compliance.text}", indent: 36, pitch: body}
      - group:
          - {text: "/s/ {compliance.signer}", left: 230.4}
          - {text: "{compliance.lines}", left: 230.4, optional: true}
        above: 21.6
