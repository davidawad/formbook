# Florida Fifth District Court of Appeal (fladistctapp5): opening brief (the appellant's initial brief). The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Fla. R. App. P. 9.045 and 9.210 (../../rules.md, FLADISTCTAPP5-*);
# lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a
# court constant.
size: 14                  # FLADISTCTAPP5-FORM-005: Bookman Old Style 14 point; footnotes and quotations too (-FORM-006)
pitch:
  body: 32.9              # FLADISTCTAPP5-FORM-004: double spaced (Word's double for Bookman Old Style 14 pt, 2 x 16.45)
  single: 16.45           # cover, headings, tables, quotations, footnotes, signature: single (-FORM-006)
# FLADISTCTAPP5-FORM-003: no less than one inch; top and bottom 4 pt deeper keep a note mark or descender inside it
margin: {top: 76, bottom: 76, left: 72, right: 72}
indent: 36                # style: half-inch first-line indent
page_number: {align: center, from: 1}   # style (Rule 9.045 sets none; the filed briefs): the cover is page 1
footnote: {size: 14, gap: 7}             # FLADISTCTAPP5-FORM-006: 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # FLADISTCTAPP5-FORM-006: quotations single spaced, 14 point
heading:                                 # FLADISTCTAPP5-FORM-006: at the text size, single spaced
  - {align: center, bold: true, upper: true, above: 19.6, below: 14}
  - {bold: true, hang: 36, above: 16.8, below: 15.4}
  - {bold: true, hang: 36, above: 14, below: 15.4}
# FLADISTCTAPP5-BRIEF-001: the cover: the court, the case number, the parties with their designations (a party line
# "v." with no designation sets none), the lower tribunal; the title halfway between the caption and counsel, counsel
# at the foot of the cover.
cover:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "Case No. {case_number}", align: center, bold: true, above: 11.2}
  - each: parties
    above: 16.8
    blocks:
      - {text: "{name}", align: center, above: 7}
      - {text: "{role}", align: center, italic: true, left: 108, optional: true}
  - {text: "{lower_court_case}", align: center, optional: true, above: 15.4}
  - {fill: 1}
  - {text: "{title}", align: center, bold: true, upper: true, left: 34, right: 34}
  - {fill: 1}
  - each: counsel
    blocks:
      - {text: "{names}", bold: true, left: 162, above: 11.2}
      - {text: "{lines}", left: 162, optional: true}
# FLADISTCTAPP5-BRIEF-001: the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6, when: toc}
authorities:
  title: "Table of Authorities"
  col: 72
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 4.2}
# Rule 9.045 sets no signature form: the closing, then 3 in from the margin each counsel's block (the firm's lines, the
# underlined "/s/" line, the typed name, the bar number and contact lines), a second firm's set off by "-and-", never
# split; then the certificate of service and the certificate of compliance (FLADISTCTAPP5-FORM-008, Rule 9.045(e))
# right after it, each signed by the lead signer.
closing:
  - group:
      - when: signature.date
        blocks:
          - {text: "Respectfully submitted this {signature.date}.", indent: 36, pitch: body}
      - unless: signature.date
        blocks:
          - {text: "Respectfully submitted,"}
      - &counsel
        group:
          - {text: "{signature.lines}", left: 216, optional: true, below: 16.45}
          - {text: "{signature.signer_line}", left: 216, underline: true, optional: true}
          - {text: "{signature.name}", left: 216, optional: true}
          - {text: "{signature.signer}", left: 216, optional: true}
        above: 8.4
      - each: signature.also
        blocks:
          - {text: "-and-", left: 216, above: 16.8, below: 16.8}
          - {text: "{lines}", left: 216, optional: true, below: 16.45}
          - {text: "{signer_line}", left: 216, underline: true, optional: true}
          - {text: "{name}", left: 216, optional: true}
          - {text: "{signer}", left: 216, optional: true}
    above: 16.8
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", heading: 1}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - each: service.recipients
        blocks:
          - group:
              - {text: "{.}", left: 72}
            above: 14
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - &lead
        group:
          - {text: "{signature.signer_line}", left: 216, underline: true, optional: true}
          - {text: "{signature.name}", left: 216, optional: true}
          - {text: "{signature.signer.0}", left: 216, optional: true}
        above: 16.8
  - when: compliance
    blocks:
      - {text: "CERTIFICATE OF COMPLIANCE", heading: 1}
      - {text: "{compliance.text}", indent: 36, pitch: body}
      - *lead
