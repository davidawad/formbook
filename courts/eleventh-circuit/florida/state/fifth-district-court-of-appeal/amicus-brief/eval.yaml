# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Bookman Old Style (TeX Gyre Bonum, the vendored clone), so the embedded font names carry TeXGyreBonum.
font:
  size_pt: 14
  pdf_prefix: "TeXGyreBonum"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): latex/ and docx/ are generated from typst/layout.yaml.
# LaTeX is gated (383/383 lines; it breaks after the slash in "counsel/parties" now, fb-595.54.82). Word is reported
# (pages and page ends equal, 381/383 lines): LibreOffice sets Bonum up to 1.16 pt wider over a line than typst and
# ends page 8 line 13 a word early; no docx_bias fits (0.1 leaves that line, 0.2 already carries an extra word onto
# page 7 line 18; docs/open-items/fb-595.54.41.md).
params:
  cross_engine: gate
  cross_engine_docx: report
