# Fla. R. App. P. 9.045(b): computer-generated documents in Arial 14-point or Bookman Old Style 14-point. This folder
# declares Bookman Old Style (TeX Gyre Bonum, the vendored clone), so the embedded font names carry TeXGyreBonum.
font:
  size_pt: 14
  pdf_prefix: "TeXGyreBonum"
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): reported, not gated. The folder is on the shared
# document model and latex/ and docx/ are generated (tier 1 0 failed in every engine; pages and page ends equal), but
# one line each differs (docs/open-items/fb-595.54.41.md): pdfLaTeX does not break after the slash inside a word
# ("counsel/parties", certificate of service, page 19), which typst and Word do; LibreOffice sets Bonum up to 1.16 pt
# wider over a line than typst and ends one line a word early (page 8).
params:
  cross_engine: report
