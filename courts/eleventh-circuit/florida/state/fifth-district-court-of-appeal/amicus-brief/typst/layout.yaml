# Florida Fifth District Court of Appeal (fladistctapp5): amicus curiae brief. The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Fla. R. App. P. 9.045, 9.210 and 9.370 (../../rules.md, FLADISTCTAPP5-*); lengths in
# points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # FLADISTCTAPP5-FORM-005: Bookman Old Style 14 point; footnotes and quotations too (-FORM-006)
pitch:
  body: 32.9              # FLADISTCTAPP5-FORM-004: double spaced (Word's double for Bookman Old Style 14 pt, 2 x 16.45)
  single: 16.45           # cover, headings, tables, quotations, footnotes, signature: single (-FORM-006)
# FLADISTCTAPP5-FORM-003: no less than one inch; top and bottom 4 pt deeper keep a note mark or descender inside it
margin: {top: 76, bottom: 76, left: 72, right: 72}
indent: 36                # style: half-inch first-line indent
page_number: {align: center, from: 2}   # style (Rule 9.045 sets none): the cover counted, not printed; then 2, 3, ..
footnote: {size: 14, gap: 7}             # FLADISTCTAPP5-FORM-006: 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # FLADISTCTAPP5-FORM-006: quotations single spaced, 14 point
heading:                                 # FLADISTCTAPP5-FORM-006: at the text size, single spaced
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# FLADISTCTAPP5-BRIEF-002 (Rule 9.370 by 9.045): the cover: the court, the case number, the caption with each party's
# designation, the proceeding and the lower tribunal's number, the title, counsel; the title halfway between the
# caption and counsel, counsel at the foot of the cover.
cover:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "Case No. {case_number}", align: center, bold: true, above: 21.6}
  - each: caption
    above: 21.6
    between:
      - {text: "v.", align: center, italic: true, above: 14.4, below: 14.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{proceeding}", align: center, above: 21.6}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {fill: 1}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.8}
  - {fill: 1}
  - each: counsel
    blocks:
      - {text: "{names}", bold: true, left: 216, above: 8.4}
      - {text: "{lines}", left: 216, optional: true}
# FLADISTCTAPP5-BRIEF-002: the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 4.2}
# Rule 9.045 sets no signature form: the closing and each signer's "/s/" and typed name, the name in capitals, the bar
# number, then the firm's lines, 3 in from the margin and never split; then the certificate of service and the
# certificate of compliance (FLADISTCTAPP5-FORM-008, Rule 9.045(e)), each on a page of its own and signed by the first
# signer.
closing:
  - group:
      - {text: "{closing|Respectfully submitted,}"}
      - each: signature.signers
        blocks:
          - {text: "/s/ {name}", left: 216, above: 12.6}
          - {text: "{name}", left: 216, upper: true}
          - {text: "{lines}", left: 216, optional: true}
      - {text: "{signature.lines}", left: 216, above: 8.4, optional: true}
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", heading: 1}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - each: service.recipients
        blocks:
          - group:
              - {text: "{.}", left: 72}
            above: 14
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - &first-signer
        group:
          - {text: "/s/ {signature.signers.0.name}", left: 216}
          - {text: "{signature.signers.0.name}", left: 216, upper: true}
          - {text: "{signature.signers.0.lines}", left: 216, optional: true}
        above: 21.6
  - when: compliance
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF COMPLIANCE", heading: 1}
      - {text: "{compliance.text}", indent: 36, pitch: body}
      - *first-signer
