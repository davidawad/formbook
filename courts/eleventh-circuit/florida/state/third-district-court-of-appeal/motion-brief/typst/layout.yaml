# Third District Court of Appeal (fladistctapp3): motion and supporting memorandum (motion-brief). The whole layout,
# as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Fla. R. App. P. 9.045(b) and Fla. R. Gen. Prac. & Jud. Admin.
# 2.520(a) (../../rules.md, FLADISTCTAPP3-*); lengths in points. No case text here: every string printed comes from
# the sample's frontmatter ({field}) or is a court constant.
size: 14                  # FLADISTCTAPP3-FORM-003: Arial 14 point, footnotes and quotations too (-FORM-005)
pitch:
  body: 32.2              # FLADISTCTAPP3-FORM-004: double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # caption, headings, quotations, footnotes, signature: single (-FORM-005, -FORM-006)
# FLADISTCTAPP3-FORM-002: at least one inch; top and right a little deeper, as the template had them
margin: {top: 75.6, bottom: 72, left: 72, right: 79.2}
indent: 36
page_number: {align: center, from: 1}   # FLADISTCTAPP3-FORM-007: pages consecutively numbered
footnote: {size: 14, gap: 7}             # FLADISTCTAPP3-FORM-005: 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # FLADISTCTAPP3-FORM-005: quotations single spaced, 14 point
heading:                                 # FLADISTCTAPP3-FORM-006: at least body size, single spaced
  - {align: center, bold: true, upper: true, above: 16.8, below: 14}
  - {bold: true, above: 14, below: 11.2}
# FLADISTCTAPP3-PET-001, -MOT-001: the court, the parties and their designations, the case numbers, the title.
front:
  - {text: "STATE OF FLORIDA", align: center, bold: true}
  - {text: "THIRD DISTRICT COURT OF APPEAL", align: center, bold: true}
  - columns:
      - blocks:
          - each: caption
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 86.4, italic: true, above: 7, below: 14.4}
          - {rule: 0.5, above: 14.4}
      - width: 194.4
        blocks:
          - {text: "Case No. {case_number}", above: 43.2}
          - {text: "L.T. Case No. {lt_case_number}", optional: true}
    gutter: 14.4
    above: 21.6
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 28.8, below: 28.8}
# FLADISTCTAPP3-SIG-001 (Rule 2.515): the signature block 3.2 in from the margin, never split; then the certificate
# of service (FLADISTCTAPP3-CERT-004), signed, kept whole.
closing:
  - group:
      - {text: "Respectfully submitted,", left: 230.4}
      - {text: "/s/ {signature.signer}", left: 230.4, above: 5.6}
      - {text: "{signature.lines}", left: 230.4}
    above: 21.6
  - when: service
    blocks:
      - group:
          - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 14}
          - {text: "{service}", indent: 36, pitch: body}
          - {text: "/s/ {signature.signer}", left: 230.4, above: 5.6}
        above: 16.8
