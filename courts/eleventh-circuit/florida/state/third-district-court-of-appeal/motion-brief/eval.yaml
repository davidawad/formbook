# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`), Arial 14 point set as Liberation Sans in typst
# and Word and as TeX Gyre Heros (the same advances) in LaTeX (fb-595.54.82), so the latex and docx renders break
# every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
