# U.S. District Court for the Southern District of Alabama (alsd): a memorandum in support of a motion, on the generic
# FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with S.D. Ala.'s local rules overlaid here. The shared
# document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by
# `fb engines gen`). Rules: S.D. Ala. Local Rules (effective August 1, 2015),
# https://www.alsd.uscourts.gov/sites/alsd/files/local-rules.pdf (verified 2026-10-14; ../README.md quotes
# them). The base already meets Gen. L.R. 5(a)(1) and (2): 8 1/2 x 11 paper, double-spaced text, quotations, headings
# and footnotes single-spaced, margins of at least one inch, page numbers in the margin; a plain roman face of 12 point
# or larger, footnotes included. The 30-page limit of Civ. L.R. 7(e) is
# checked on the render (../eval.yaml params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, with the division (the sample's), bold and centered as both exemplars print it.
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE SOUTHERN DISTRICT OF ALABAMA"
# Headings bold on the body pitch with no space of their own (Gen. L.R. 5(a)(1) lets them be single-spaced; the
# exemplar sets them in the text's lines): a section centered in capitals; an argument heading at the margin, its
# later lines hung half an inch under the numeral the sample types; a point half an inch in, hung likewise.
heading:
  - {align: center, bold: true, upper: true, pitch: body}
  - {bold: true, hang: 36, pitch: body}
  - {bold: true, left: 36, hang: 36, pitch: body}
# Gen. L.R. 5(a)(1): a quotation of more than two lines may be single-spaced; half an inch in on each side, a single
# line around it.
quote: {left: 36, right: 36, above: 13.8, below: 13.8}
# FRCP 10(a) in the S.D. Ala. form of the exemplar of the same id: the parties at the left (each party's names, its
# designation an inch in, "v." half an inch in, a blank line between them) closed by a rule at their right and foot,
# the civil action number beside them, centered on their height; then the paper's title bold, centered and
# underlined, a double line off the caption.
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - width: 234
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", left: 72, above: 13.8}
                between:
                  - {text: "v.", left: 36, above: 13.8, below: 13.8}
            stroke: {right: 0.75, bottom: 0.75}
            inset: {right: 12, bottom: 10}
      - valign: center
        blocks:
          - {text: "{case_label|CIVIL ACTION NO.} {case_number}", left: 10.8}
    gutter: 18
    above: 24
  - {text: "{brief_title}", align: center, bold: true, underline: true, left: 36, right: 36, above: 24, below: 13.8}
# Gen. L.R. 5(a)(3): the date at the margin, then "Respectfully submitted," and the signature line with the typed
# name, address and telephone of each attorney directly beneath, single-spaced from three inches in, a single line
# between attorneys; kept whole and with the last paragraph.
closing:
  - group:
      - {text: "Date: {signature.date}", optional: true}
      - {text: "Respectfully submitted,", left: 216, above: 24}
      - each: signature.blocks
        blocks:
          - {text: "{.}", left: 216}
        gap: 13.8
        above: 24
    above: 24
# FRCP 5(b): the certificate of service, when the sample gives one: its title bold and centered, the certificate
# double-spaced, the signature from three inches in; kept on one page.
after_tail:
  - when: service
    blocks:
      - group:
          - {text: "CERTIFICATE OF SERVICE", align: center, bold: true}
          - {markdown: "{service.text}", pitch: body, indent: 36}
          - group:
              - {text: "{service.signature}", left: 216}
            above: 13.8
        above: 24
