# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.4), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: S.D. Ala. Civ. L.R. 7(e), principal briefs at most 30 pages, excluding the caption, cover, tables and
  # signature block (the count here is every page, the conservative reading).
  page_limit: 30
