# U.S. District Court for the Middle District of Georgia (gamd): a brief in support of a motion (M.D. Ga. L.R. 7.1: a
# motion is accompanied by a memorandum of law citing its authorities), on the generic FRCP brief
# (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with M.D. Ga.'s rules overlaid here. The shared document model sets
# it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`). Rules: M.D. Ga.
# Local Rules, consolidated text dated 3-7-22 (../../rules.md, GAMD-FORM-001, GAMD-LEN-001; ../README.md). The local
# rules set no paper form (GAMD-FORM-001): the base's letter paper, one-inch margins and 12-point type stand, as the
# exemplar sets them. The 20-page limit of L.R. 7.4 is checked on the render (../eval.yaml params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# No spacing rule (GAMD-FORM-001): the body double-spaced as the exemplar, 27.6 pt, twice the 13.8 pt single line.
pitch: {body: 27.6}
# Footnotes single-spaced, 11 point, as the exemplar (no size rule).
footnote: {size: 11}
# Page one unnumbered, the rest numbered at the bottom center, as the exemplar.
page_number: {align: center, from: 2}
quote: {left: 36, right: 36, above: 0, below: 27.6}
# Headings bold on the body pitch, as the exemplar: a section centered, as the sample types it; an argument point at
# the margin (its number typed in the sample); a sub-point in bold italics.
heading:
  - {align: center, bold: true, pitch: body}
  - {bold: true, pitch: body}
  - {bold: true, italic: true, pitch: body}
# FRCP 10(a): the court's name, as the exemplar sets it.
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE MIDDLE DISTRICT OF GEORGIA"
# FRCP 10(a), 7(b)(2) in the Georgia form of the exemplar: the court's name and the division bold and centered; the
# parties at the left (each party's names, its designation a line below, "v." between them), a ")" beside every line,
# the file number's label and the number a line apart (and a jury demand, when given) at the right, centered on the
# parties' height; the paper's title bold and centered.
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - width: 237.6
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", above: 13.8}
            between:
              - {text: "v.", above: 13.8, below: 13.8}
      - {width: 21.6, repeat: ")"}
      - valign: center
        blocks:
          - {text: "{case_label|CIVIL ACTION FILE NO.}", left: 14.4}
          - {text: "{case_number}", left: 14.4}
          - when: jury_demand
            blocks:
              - {text: "JURY TRIAL DEMANDED", bold: true, left: 14.4, above: 13.8}
    above: 27.6
  - {text: "{title}", align: center, bold: true, above: 27.6, below: 27.6}
# FRCP 11(a), L.R. 83.1.2(B) (each counsel's Georgia Bar number on the signature page): from three inches in
# "Respectfully submitted,", a double line below it the firm, each signer's lines (the "/s/" signature, the signature
# line, name and bar number); then the firm's address, telephone and e-mail at the margin beside whom they represent;
# kept whole and with the last paragraph (the date line the sample types before it).
closing:
  - &signature
    group:
      - {text: "Respectfully submitted,", left: 216}
      - {text: "{signature.firm}", left: 216, above: 27.6}
      - each: signature.signers
        blocks:
          - {text: "{.}", left: 216}
        gap: 27.6
        above: 27.6
      - columns:
          - width: 216
            blocks:
              - {text: "{signature.address}"}
          - blocks:
              - {text: "{signature.attorney_for}"}
    above: 27.6
# FRCP 5(b): the certificate of service, when the sample gives one (its CERTIFICATE OF SERVICE section), after the
# signature, signed again as the exemplar signs it.
tail: {at: "CERTIFICATE OF SERVICE", break: true, pitch: body, indent: 36}
after_tail:
  - *signature
