checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://www.gand.uscourts.gov/sites/gand/files/WMR_CVStandingOrder_2.pdf#page=19
  text: Motions to dismiss and motions for summary judgment will be noticed for hearings to occur at least forty-five (45) days after the filing date. If an amended pleading is filed, attorneys should docket a "Withdrawal of Motion" as to any mooted motions.
- topic: Oral argument
  field: oral_argument_default
  url: https://www.gand.uscourts.gov/sites/gand/files/WMR_CVStandingOrder_2.pdf#page=19
  text: In accordance with the Local Rules, motions may be decided without oral argument, but the Court may order oral argument on any issue which it believes a hearing would be helpful and will consider any request for hearing. Moreover, the Court shall grant a request for oral argument on a contested, substantive motion if the request states that a lawyer who is less than seven years out of law school will conduct the oral argument on at least one substantial issue in the case, it being the Court's belief that young lawyers need more opportunities for Court appearances than they usually receive. Motions to dismiss and motions for summary judgment will be noticed for hearings to occur at least forty-five (45) days after the filing date. If an amended pleading is filed, attorneys should docket a "Withdrawal of Motion" as to any mooted motions.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.gand.uscourts.gov/sites/gand/files/WMR_CVStandingOrder_2.pdf#page=11
  text: For all consent, unopposed, or joint motions, the filing party shall include therewith a proposed order granting the motion.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/WMR_CVStandingOrder_2.pdf#page=10
  text: Parties frequently forward copies of motions or other filings directly to chambers for the Court's convenience. Courtesy copies are not required, except for emergency motions filed pursuant to Local Rule 7.2(B), and motions for temporary restraining orders and/or preliminary injunctions. Courtesy copies of motions for summary judgment that have voluminous exhibits may be submitted to chambers. Courtesy copies of such emergency motions, motions for temporary restraining orders, and/or motions for preliminary injunctions should be submitted via regular mail to the attention of the Courtroom Deputy Clerk at the address provided above.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/WMR_CVStandingOrder_2.pdf#page=14
  text: 'The Court disfavors the excessive use of consent protective confidentiality orders that allow counsel to designate documents, tangible things, and information as "Confidential" and/or "Confidential - For Attorney''s Eyes Only. While the Court recognizes the legitimacy of such orders in some cases, the Court''s experience is that such orders are used-and abused-more often than truly necessary. [...] If the parties find that a consent protective confidentiality order is necessary, the following language should be included (and shall be deemed included) therein: Any documents (including briefs), tangible things, or information designated as Confidential that are submitted to the Court in support of or in opposition to a motion or introduced at a hearing or during trial may retain their protected confidential status only by order of the Court in accordance with the procedures outlined in section II.c. of the Court''s Standing Order Regarding Civil Litigation. Those procedures are as follows. For documents filed other than during a hearing or trial, counsel shall electronically file on CM/ECF a motion to seal that lists the document(s) that counsel wants filed under seal and a proposed order granting the motion. The documents that counsel wishes to be sealed should be provisionally filed on CM/ECF, per the directions set out in Procedures for Electronic Filing Under Seal in Civil Cases on the Court''s website under "Electronic Case Filing Info.'
