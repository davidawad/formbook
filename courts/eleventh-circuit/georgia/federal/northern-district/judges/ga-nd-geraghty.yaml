  field: oral_argument_default
  url: https://www.gand.uscourts.gov/sites/gand/files/SEG_Standing_Order.pdf#page=27
  text: In accordance with Local Rule 7.1(E), motions are usually decided without oral argument, but the Court may ask for argument and will consider any request for a hearing. If oral argument is requested, the party should specify the particular reasons argument may be helpful to the Court and what issues will be the focus of the proposed argument. The Court will look favorably on requests for oral argument in any case in which a lawyer with less than five (5) years experience will be chiefly responsible for oral argument.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.gand.uscourts.gov/sites/gand/files/SEG_Standing_Order.pdf#page=13
  text: Please provide a proposed order for (1) consent, unopposed, or joint motions; (2) motions seeking an extension of time, and (3) motions seeking an extension of page limitations. The proposed order should be filed along with the motion by CM/ECF. In all other instances, no proposed order is required unless specifically requested. [...] The party should also file a copy of the document on the docket of the case.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/SEG_Standing_Order.pdf#page=5
  text: The Court may, however, request courtesy copies of motions with voluminous exhibits. If they are requested, courtesy copies of documents may be hand-delivered to chambers in Room 2321 on the 23rd floor of the Richard B. Russell Federal Building or submitted by regular mail to the attention of the Courtroom Deputy Clerk at the above-provided address. Courtesy copies of motions and exhibits should be printed double-sided directly from the docket on the CM/ECF system with the docket header across the top of the document so that the case number, docket number, and page numbers appear on each page. Courtesy copies should be assembled in a tabbed, indexed three-ring binder.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/SEG_Standing_Order.pdf#page=23
  text: While the Court recognizes the legitimacy of such orders in some cases, the Court's experience is that such orders are used more often than truly necessary. The Court is aware that the parties will at times agree to designate documents as "confidential. However, the Court will not approve consent protective orders that conflict with the Court's view on the sealing of materials. [...] As further clarification, the Court notes that a mere reference or discussion of confidential information does not warrant sealing of the entire document and all attachments to be filed. Instead, the Court is only interested in sealing (or filing in a redacted format) very specific portions of documents that contain or refer to confidential information. The parties should refrain from sealing an entire document when only certain information is confidential. In addition, the Court will normally not seal documents used in open court at a hearing or trial absent extraordinary circumstances.
  unverified_sentences: 3
