checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://www.gand.uscourts.gov/sites/gand/files/LMM_CVStandingOrder.pdf#page=24
  text: In accordance with Local Rule 7.1(E), motions are usually decided without oral argument, but the Court will consider any request for hearing.
- topic: Oral argument
  field: oral_argument_default
  url: https://www.gand.uscourts.gov/sites/gand/files/LMM_CVStandingOrder.pdf#page=24
  text: In accordance with Local Rule 7.1(E), motions are usually decided without oral argument, but the Court will consider any request for hearing. If oral argument is requested, the party or parties should specify the particular reasons argument may be helpful to the Court and what issues will be the focus of the proposed argument. Moreover, the Court shall grant a request for oral argument on a contested substantive motion if the request states that a lawyer of less than five years out of law school will conduct the oral argument (or at least a large majority), it being the Court's belief that new lawyers need more opportunities for Court appearances than they usually receive.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.gand.uscourts.gov/sites/gand/files/LMM_CVStandingOrder.pdf#page=24
  text: For all consent, unopposed, or joint motions, the filing party shall include a proposed order granting the motion.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/LMM_CVStandingOrder.pdf#page=4
  text: Parties frequently forward copies of motions or other filings directly to chambers for the Court's convenience. Courtesy copies are not required. If parties want to send courtesy copies, they can be hand-delivered to chambers in Room 2167 on the 21st floor of the Richard B. Russell Federal Building or submitted via regular mail to the attention of the Courtroom Deputy Clerk at the above-provided address. The courtesy copies provided shall be stamped filed with the CM/ECF (Case Management/Electronic Case Filing) header.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/LMM_CVStandingOrder.pdf#page=21
  text: For documents filed other than during a hearing or trial, as a general matter, this Court will seal only those items enumerated in the Court's Standing Order 04-02 regarding sensitive information and public access to electronic case files. Absent extraordinary circumstances making prior consultation impractical or inappropriate, the party seeking to file the documents shall first consult with the counsel for the party who designated the document as confidential to determine if some measure less restrictive than filing the document under seal may serve to provide adequate protection. As further clarification, the Court notes that a mere reference or discussion of confidential information does not warrant sealing of the entire document and all attachments to be filed. Instead, the Court is only interested in sealing (or filing in a redacted format) very specific portions of documents that contain or refer to confidential information. The parties should refrain from sealing an entire document when only certain information is confidential. In addition, the Court will normally not seal documents used in open court at a hearing or trial absent extraordinary circumstances.
