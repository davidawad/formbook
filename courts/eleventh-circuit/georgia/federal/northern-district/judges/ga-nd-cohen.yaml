checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.gand.uscourts.gov/sites/gand/files/MHC_Standing_Order.pdf#page=18
  text: In accordance with the Court's Local Rules, motions are usually decided without oral argument, but the Court will consider any request for hearing if the party or parties requesting oral argument specify the particular reasons argument may be helpful to the Court and what issues will be the focus of the proposed argument. Moreover, the Court shall grant a request for oral argument on a contested, substantive motion if the request states than an attorney who is less than seven (7) years out of law school will conduct the oral argument on at least one substantial issue in the case, it being the Court's belief that new attorneys need more opportunities for Court appearances than they usually receive.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.gand.uscourts.gov/sites/gand/files/MHC_Standing_Order.pdf#page=18
  text: For all consent, unopposed, or joint motions, the filing party shall include therewith a proposed order granting the motion.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/MHC_Standing_Order.pdf#page=2
  text: Except for emergency motions filed pursuant to the Local Rules of the United States District Court for the Northern District of Georgia ("LR"), specifically LR 7.2B, NDGa, or motions for temporary restraining orders, the delivery of a hard copy of a document in addition to the electronically-filed copy is discouraged, as the Court prefers to rely on its electronic access to court filings. Courtesy copies of such emergency motions and motions for temporary restraining orders should be hand-delivered to chambers in Room 1921 on the 19th floor of the Richard B. Russell Building or to the Courtroom Deputy Clerk at the above-provided address. The Court may occasionally request a courtesy copy of pleadings but, if they are needed, Ms. Enix will contact counsel.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/MHC_Standing_Order.pdf#page=15
  text: 'Because documents filed in Court are presumptively public, this Court generally does not favor the filing of documents under seal. However, the Court will agree to the sealing of documents that contain information protected from disclosure by statute, personal information (such as Social Security numbers), trade secrets, or sensitive security data. See also Standing Order No. 04-02 (regarding sensitive information and public access to case files). It should be noted that even these exceptions to public filing usually do not require that entire documents or pleadings be filed under seal, but only those portions of a pleading or document for which protection is authorized. If the parties find that a confidentiality agreement or protective order is necessary, the parties must follow the practice for filing and sealing documents as set forth in "Administrative Procedures for Filing, Signing, and Verifying Pleadings and Papers by Electronic Means," attached as Exhibit A to Standing Order 16-01, and included in Appendix H of this Court''s Local Rules. See also LR NDGa., App. H., Ex. A, Section II(J). Any proposed agreement or protective order submitted for the Court''s consideration must include the following language: Any documents (including briefs), tangible things or information designated as Confidential that are submitted to the Court in support of or in opposition to a motion or introduced at a hearing or during trial may retain their protected confidential status only by order of the Court in accordance with the procedures outlined in Appendix H of the Local Rules of the Northern District of Georgia. Specifically, if a party seeks to use information designated as confidential under this protective order in filings before the Court, it is the burden of the designating party to show "good cause" to the Court why the confidential information should be filed under seal.'
