- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/CCB_CV_StandingOrd.pdf.pdf#page=1
  text: Except for emergency motions filed under LR 7.2(B), NDGa, or a specific request from the Court, the parties need not provide Chambers with an additional paper copy of any filing. The Court automatically receives an electronic copy of all filed materials, and that electronic copy is sufficient absent a specific request.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/CCB_CV_StandingOrd.pdf.pdf#page=3
  text: The Court will not sign a protective or confidentiality order that permits the parties to automatically file pleadings or materials under seal with the Clerk. As a general matter, the Court will seal only those items enumerated in the Court's Standing Order 04-02 regarding sensitive information and public access to electronic case files. A party seeking to file a document under seal must follow the rules and procedures set forth in Appendix H to the Local Rules. Detailed procedures for electronic filing under seal in civil cases are available at http://www.gand.uscourts.gov/cv-sealed-procedures.
