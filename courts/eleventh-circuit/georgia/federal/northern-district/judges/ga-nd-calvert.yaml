  url: https://www.gand.uscourts.gov/sites/gand/files/VMC_CV_Order.pdf#page=37
  text: In accordance with Local Rule 7.1(E), motions are usually decided without oral argument, but the Court will consider any request for hearing. If oral argument is requested, the party or parties should specify the particular reasons argument may be helpful to the Court and what issues will be the focus of the proposed argument. The Court will strongly consider granting oral argument in any case where a lawyer with less than seven (7) years of experience will be chiefly responsible for oral argument, or for a discrete issue of oral argument.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.gand.uscourts.gov/sites/gand/files/VMC_CV_Order.pdf#page=11
  text: A proposed order should be filed along with the motion via CM/ECF. If such a motion is filed less than three days prior to the deadline the parties seek to extend, the parties should promptly alert Chambers to the filing via email to Ms. Shanks.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/VMC_CV_Order.pdf#page=5
  text: Parties frequently forward copies of motions or other filings directly to chambers for the Court's convenience. Courtesy copies are not required but are encouraged for motions for summary judgment or motions with voluminous (i.e., more than 100 pages) exhibits. Courtesy paper copies of motions for summary judgments, including all exhibits, or motions with voluminous exhibits, may be either hand-delivered to chambers in Room 2125 or submitted via regular mail to attention of the Ms. Shanks at the address provided above. Courtesy copies of motions and exhibits should be printed double-sided directly from the docket on the CM/ECF system with the docket header across the top of the document so that the case number, docket number, and page numbers appear on each page. Courtesy copies should be assembled in a tabbed, indexed three-ring binder.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/VMC_CV_Order.pdf#page=25
  text: The Court is aware that the parties will at times agree to designate documents as "confidential. However, the Court will not approve consent protective orders that conflict with the Court's view on the sealing of materials. As a guide to counsel, the Court notes that documents, tangible things, and information ordinarily are not truly confidential unless they constitute either (1) a "trade secret," as defined by Section 1(4) of the Uniform Trade Secrets Act, or for cases applying Georgia law, O.C.G.A. § 10-1-761(4); (2) personal identifying information, such as a Social Security number; or (3) personal health information protected by the Health Insurance Portability and Accountability Act. It is the general policy of this Court not to allow the filing of documents under seal without a Court order, even if all parties consent to the filing under seal. LR App H, Section II(J), NDGa. To request to file material under seal, in addition to the following procedures, the Parties should follow the mechanism described in Section II(J) of Appendix H to the Court's Local Civil Rules. If a document contains some discrete material that is deemed confidential and subject to protection from public disclosure under Rule 26(c), the Parties will be entitled to redact only those portions of the document deemed confidential. Parties shall publicly file redacted copies of the documents as a separate filing contemporaneously with the motion to seal without awaiting the Court's ruling on the motion to seal.
  unverified_sentences: 3
- topic: Remote appearances
  field: remote_appearances
  url: https://www.gand.uscourts.gov/sites/gand/files/VMC_CV_Order.pdf#page=37
  text: Judge Calvert typically holds scheduling and discovery conferences by telephone and all other hearings and oral arguments in person. Requests to appear by video must be made in advance of the hearing or argument and are not routinely granted.
review:
- A motion for leave to file a surreply must be filed within seven days of the filing of the reply brief and must be no more than 5 pages.
- A response to the motion for leave to file the surreply is strongly discouraged and may not exceed 3 pages.
- A surreply may not exceed 5 pages in length without leave of court.
