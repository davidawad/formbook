  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/SDG_CVStandingOrder_20260210.pdf#page=5
  text: Courtesy copies of filings should not be provided to the Court unless requested.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/SDG_CVStandingOrder_20260210.pdf#page=24
  text: 'Absent extraordinary circumstances making prior consultation impractical or inappropriate, the party seeking to file documents containing confidential information should first consult with the party who designated the document as confidential to determine if some less restrictive measure than filing the document under seal may provide adequate protection. Any motion to file under seal should indicate whether it is by consent, unopposed, or opposed. In the absence of a protective order entered by the Court, to request to file material under seal, counsel should follow the procedures described in the Local Rules and consult the Court''s Procedures for Electronic Filing Under Seal in Civil Cases, which can be found at: www.gand.uscourts.gov/cv-sealed-procedures. These procedures require filing an unredacted version of the document as provisionally under seal and publicly filing a redacted version of the document, in addition to the motion to file under seal. Counsel are encouraged to email the unredacted version of all sealed filings to Chambers simultaneously with their filing. When filing the unredacted, provisionally sealed document, counsel should use the CM/ECF event code "Notice of Filing. The Notice of Filing should be the lead document, and the brief and all supporting documents should be included as exhibits to the notice. For example, if the party is requesting that Exhibit A to a Motion for Summary Judgment and a portion of the memorandum of law in support of the motion be filed under seal, the Notice of Filing Sealed Document should attach as exhibits: the motion for summary judgment, the unredacted supporting memorandum of law, Exhibit A, and all other exhibits to the motion. If you are filing documents under seal pursuant to a protective order that has been entered by the Court, no motion to file under seal is necessary. The Notice of Filing should indicate the applicable provision of the protective order under which the documents are being sealed. You also need not file a motion to file under seal information that is required to be redacted by NDGa Standing Order Nos. 04-02 and 08-02, including Social Security numbers, names of minor children, dates of birth, street addresses, and financial account numbers. These instructions do not apply to parties appearing pro se. For pro se litigants, motions to seal must be filed with the Clerk of Court in person or by mail. In such instances, the material subject to the request to seal should be attached as an exhibit to the motion. The Clerk will enter the motion on the docket under a provisional seal, without public viewing access. The party filing the motion to file under seal should clearly indicate the type of material the party is seeking to seal and the justification for protecting that material from disclosure. Please note that sealing motions will not be granted as a matter of course, and I will only do so on a showing of good cause. Given the public''s interest in disclosure, good cause will generally only be established where the materials contain trade secrets, personal identifying information, or sensitive commercial information.'
