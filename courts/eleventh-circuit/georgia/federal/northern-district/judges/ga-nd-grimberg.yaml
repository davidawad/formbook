checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.gand.uscourts.gov/sites/gand/files/SDG_CVStandingOrder_20260210.pdf#page=14
  text: We review all dispositive motions with an eye towards whether oral argument would be helpful in resolving the matter or clarifying the issues in dispute. That said, you are welcome to request oral argument by filing a standalone motion requesting same, ideally at the same time as the underlying motion or response thereto. In my experience, civil litigators do not get enough court appearances, especially early in their careers, and I want to do my part to correct that gap. If you represent in your motion for oral argument that an attorney with less than five years of experience will conduct the oral argument (or a substantial part thereof), I will most likely grant the motion for oral argument.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.gand.uscourts.gov/sites/gand/files/SDG_CVStandingOrder_20260210.pdf#page=11
  text: 'My practice is to enter many non-dispositive orders by docket entry only, with no "paper" order attached. ORDER (by docket entry only) . . . . Please monitor the electronic docket of your case carefully so as not to miss an important deadline or instruction. For this reason, you generally need not prepare and file a proposed order unless we request one. One exception to this is motions seeking ex parte temporary restraining orders (as referenced above). If a proposed order is submitted, please do not include the word "Proposed" in the title or any other words that would necessarily need to be deleted before entry. All orders submitted by counsel are proposed until and unless we''ve entered them. In other words, please prepare the proposed order exactly as you would want it entered, save for my signature on it. Please style the signature line as follows: ________________________________ Steven D. Grimberg United States District Judge Please email Chambers a Word version of your proposed orders.'
