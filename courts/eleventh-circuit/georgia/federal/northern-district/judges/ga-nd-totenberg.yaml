- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.gand.uscourts.gov/sites/gand/files/AT_Case_Guidelines202512.pdf#page=6
  text: Parties frequently forward copies of motions or other filings directly to chambers for the Court's convenience. Courtesy copies are not required except for motions for summary judgment or motions with voluminous exhibits. Courtesy paper copies of motions for summary judgments, including all exhibits, or motions with voluminous exhibits, may be either hand-delivered to chambers in Room 2388 on the 23rd floor of the Richard B. Russell Federal Building located at 75 Ted Turner Drive, SW, or submitted via regular mail to the attention of the Courtroom Deputy Clerk at the above provided address. Courtesy copies of motions and exhibits should be printed double-sided directly from the docket on the CM/ECF system with the docket header across the top of the document so that the case number, docket number, and page numbers appear on each page. Courtesy copies should be assembled in a tabbed, indexed three-ring binder. The parties are REQUIRED to submit courtesy paper copies of motions for summary judgment, including all exhibits, to chambers.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/AT_Case_Guidelines202512.pdf#page=22
  text: In this Court, confidentiality of proceedings is the exception, not the rule. [...] Rule 26 of the Federal Rules of Civil Procedure allows a court to enter a protective order rendering documents or portions thereof unavailable to the public after a showing of good cause. Good cause is determined by balancing the public's "interest in obtaining access" against the "party's interest in keeping the information confidential. Mere agreement by the parties that documents should be designated as confidential does not automatically satisfy the Rule 26(c) good cause standard. Good cause will generally only be established where the materials (e.g., documents or testimony) contain trade secrets, personal identifying information, and sensitive commercial information, or where public disclosure would result in "annoyance, embarrassment, oppression, or undue burden or expense. Fed. R. Civ. P. 26(c)(1). It is the general policy of this Court not to allow the filing of documents under seal without a Court order, even if all parties consent to the filing under seal. LR App. H, Section II.J.1., NDGa. To request to file material under seal, the parties should follow the mechanism described in Section II.J. of Appendix H to the Court's Local Civil Rules. If a document contains some discrete material that is deemed confidential and subject to protection from public disclosure under Rule 26(c), the parties will be entitled to redact only those portions of the document deemed confidential. The Court cautions that only in rare instances will it be appropriate to seal an entire document from public access. Thus, pleadings, motions, or briefs which mention or reference a document containing confidential information, without disclosing the nature or contents of the protected information, shall not be sealed or filed in a redacted format.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://www.gand.uscourts.gov/sites/gand/files/AT_Case_Guidelines202512.pdf#page=28
  text: Requests to appear at a hearing before the Court by videoconference are disfavored and will not be permitted absent exceptional circumstances and with explicit permission of the Court. Counsel or witnesses who are permitted to appear by videoconference must comport themselves as though they are appearing in person in a courtroom.
