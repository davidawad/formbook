- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.gand.uscourts.gov/sites/gand/files/TRJ_CVStandingOrder.pdf#page=17
  text: For documents filed other than during a hearing or trial, as a general matter, the Court will seal only those items enumerated in the Court's Standing Order 04-02 regarding sensitive information and public access to electronic case files. Absent extraordinary circumstances making prior consultation impractical or inappropriate, the party seeking to file the documents under seal shall first consult with the party who designated the document as confidential to determine if some measure less restrictive than filing the document under seal may serve to provide adequate protection. As further clarification, the Court notes that a mere reference or discussion of confidential information does not warrant sealing of the entire document. Instead, the Court is only interested in sealing (or filing in a redacted format) very specific portions of documents that contain or refer to confidential information. The parties should refrain from sealing an entire document when only certain information is confidential. Additionally, the Court normally will not seal documents used in open court at a hearing or trial absent extraordinary circumstances.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.gand.uscourts.gov/sites/gand/files/TRJ_CVStandingOrder.pdf#page=8
  text: 'Counsel and pro se parties must disclose the use of artificial intelligence ("AI") to prepare documents filed and submitted to the Court. If AI was used in any way to prepare a filing or submission to the Court or chambers, counsel and pro se parties are REQUIRED to sign and file a Disclosure of Use of Artificial Intelligence stating, as follows: This document was generated with the assistance of [identify AI tool name]. I hereby certify under penalty of perjury that, despite reliance on an AI tool, I have independently reviewed this document to confirm accuracy, legitimacy, and use of good and applicable law, pursuant to Rule 11 of the Federal Rules of Civil Procedure. Counsel and pro se parties are cautioned that mistake, lack of technical expertise, and time constraints are typically not recognized by the Court as a good faith excuse for submission of documents that either violate Rule 11 or this disclosure rule. In particular, arguments in briefs to the Court that are supported by AI-generated caselaw (i.e., cases that do not actually exist) are not acceptable. Failure to comply with this disclosure rule may result in appropriate sanctions, up to and including dismissal and/or default judgment.'
