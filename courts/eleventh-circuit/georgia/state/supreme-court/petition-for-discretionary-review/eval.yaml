# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.36), every page count and page end
# equal (25 pages); it is reported, not gated, for differences the shared model does not settle yet
# (docs/open-items/fb-595.54.36.md):
# - latex, 733 of 735 typst lines alike: "§ 2(1)–(2)" (p12 line 5) reads "(1) –(2)" in the PDF text (the width the
#   narrower TeX Live ")" leaves, lib/latex/xeschola.sty, is set before the en dash's break, a gap pdftotext reads
#   as a space); p18 line 14 the same before an em dash.
# - docx, 729 of 735: the contents give CONCLUSION page 21 (typst 24): its needle (the heading and the words after it)
#   is not found and the fallback, the heading's text alone, finds "conclusion" in a sentence on page 21
#   (tools/fb/src/docxpages.rs); and LibreOffice sets TeX Gyre Schola narrower than typst and fits a word more on a
#   line typst fills to within about a point (p20 line 23, p22 line 18).
# The court's own parameters (13 pt body, SCt R 16(2)) are in ../eval.yaml.
params:
  cross_engine: report
  # DEF-FORM-002: LibreOffice embeds TeX Gyre Schola with word boxes from the font's ascent, so a single line that
  # opens a page measures 3.70 pt into the top margin on docx (a quotation line on page 6: word box 68.30 pt, typst
  # 74.90 pt, the baselines equal) while its glyphs are inside (as ../opening-brief, 3.31 pt for a bold line).
  eps_v_pt: 3.75
