# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.36), every page count equal (30); it is
# reported, not gated, for differences the shared model does not settle yet (docs/open-items/fb-595.54.36.md):
# - latex, 639 of 642 typst lines alike: "(2)—that" (p6 line 16) reads "(2) —" in the PDF text (the width the
#   narrower TeX Live ")" leaves, lib/latex/xeschola.sty, is set before the em dash's break, a gap pdftotext reads as
#   a space); a level-4 bold heading (p22 line 18) breaks a word earlier (TeX Live's bold Schola).
# - docx, 629 of 642: LibreOffice sets TeX Gyre Schola narrower than typst and fits a word more on a line typst fills
#   to within about a point (p14 line 4, p25 line 20); the earlier hand-written Georgia docx engines set the right
#   margin 1 twip wider for that (answering-brief/docx/ga-brief.lua MARGIN_R).
# The court's own parameters (13 pt body, SCt R 16(2)) are in ../eval.yaml.
params:
  cross_engine: report
  # DEF-FORM-002: LibreOffice embeds TeX Gyre Schola with word boxes from the font's ascent, so a single line that
  # opens a page measures 3.31 pt into the top margin on docx while its glyphs are inside (as ../opening-brief).
  eps_v_pt: 3.5
