# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.36), so the latex and docx renders
# break every line and page where the typst render does, and a difference fails. The latex render breaks every line
# as typst since fb-595.54.82 (a break after a slash inside a word, "redline/blue").
# The court's own parameters (13 pt body, SCt R 16(2)) are in ../eval.yaml.
params:
  cross_engine: gate
  # Word only (XENG-002 p10, p11; 308 of 310 lines): LibreOffice's footnote placement. On body page 6 the last line of
  # a paragraph ("$33,465,716.") anchors footnote 3, and the line and its note do not fit below footnote 2: typst moves
  # the line with the note to page 7, LibreOffice keeps the line and sets the note on page 7. A renderer limitation,
  # not the template's (docs/open-items/fb-595.54.82.md, LibreOffice's note placement).
  cross_engine_docx: report
  # DEF-FORM-002: LibreOffice embeds TeX Gyre Schola with word boxes from the font's ascent (15.8 pt above the
  # baseline at 13 pt bold; typst's 9.6 pt), so a single-spaced line that opens a page (the cover's court line, the
  # titles of the tables and of the certificate), whose 15.6 pt line box starts at the 1 in margin, measures 3.31 pt
  # into the margin on docx. The vertical tolerance covers that box, not text: Gate 4 puts both engines on the same
  # baselines.
  eps_v_pt: 3.5
