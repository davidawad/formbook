# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.36), so the latex and docx renders
# break every line and page where the typst render does, and a difference fails. The latex render breaks every line
# as typst since fb-595.54.82 (a break after a slash inside a word, the cover's "d/b/a").
# The court's own parameters (13 pt body, SCt R 16(2)) are in ../eval.yaml.
params:
  cross_engine: gate
  # Word only (665 of 680 typst lines; docs/open-items/fb-595.54.36.md): LibreOffice ends the cover's caption line
  # after "d/" where typst sets "d/b/" (p1 lines 3-4), and sets TeX Gyre Schola narrower than typst, fitting a word
  # more on a line typst fills to within about a point (p3 line 3, p24 line 12; body page 23 ends a line later). A
  # docx_bias does not settle it (0.05 pt, one twip: the same lines and none fixed). Reported until the model does.
  cross_engine_docx: report
  # DEF-FORM-002: LibreOffice embeds TeX Gyre Schola with word boxes from the font's ascent, so a single line that
  # opens a page measures 3.31 pt into the top margin on docx while its glyphs are inside (as ../opening-brief).
  eps_v_pt: 3.5
