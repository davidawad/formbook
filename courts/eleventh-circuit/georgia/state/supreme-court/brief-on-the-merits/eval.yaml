# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.36), every page count equal (32); it is
# reported, not gated, for differences the shared model does not settle yet (docs/open-items/fb-595.54.36.md):
# - latex, 678 of 680 typst lines alike: typst ends the cover's caption line after the second slash of "d/b/a"
#   (p1 lines 3-4); pdfLaTeX has no break after a slash inside a word.
# - docx, 665 of 680: the same caption line (LibreOffice breaks "d/b/a" elsewhere), and LibreOffice sets TeX Gyre
#   Schola narrower than typst and fits a word more on a line typst fills to within about a point (p3 line 3, p24
#   line 18; body page 23 ends a line later).
# The court's own parameters (13 pt body, SCt R 16(2)) are in ../eval.yaml.
params:
  cross_engine: report
  # DEF-FORM-002: LibreOffice embeds TeX Gyre Schola with word boxes from the font's ascent, so a single line that
  # opens a page measures 3.31 pt into the top margin on docx while its glyphs are inside (as ../opening-brief).
  eps_v_pt: 3.5
