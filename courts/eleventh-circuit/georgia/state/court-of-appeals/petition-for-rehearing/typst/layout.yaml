# Court of Appeals of Georgia (gactapp): motion for reconsideration (Rule 37). The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to the Court of Appeals of Georgia Rules, effective March 26, 2026 (../rules.md,
# GACTAPP-*); Rule 37 (a): a motion for reconsideration is prepared as Rule 24 prepares a brief (GACTAPP-MOT-003).
# Lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a
# court constant (the Rule 24 (f) (1) sentence).
size: 14                  # GACTAPP-FORM-002: serif, proportionally spaced, 14 point or larger, footnotes included
pitch:
  body: 32.2              # GACTAPP-FORM-005: no less than double spacing (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # GACTAPP-FORM-005 exclusions: quotations, headings, captions, footnotes; cover, tables, signature
margin: {top: 72, bottom: 72, left: 72, right: 72}   # GACTAPP-FORM-004: not less than one inch at top, sides, bottom
indent: 36
page_number: {align: center, from: 1}   # GACTAPP-FORM-006: every page numbered in Arabic numerals, the cover is 1
footnote: {size: 14, gap: 8.05}         # GACTAPP-FORM-002, -005: footnotes 14 point, single spaced, half a line apart
quote: {left: 36, right: 36, above: 8.05, below: 8.05, gap: 8.05}   # GACTAPP-FORM-005: block quotations single spaced
heading:
  - {align: center, bold: true, upper: true, above: 16.1, below: 8.05}
  - {bold: true, hang: 36, above: 16.1, below: 8.05}
  - {bold: true, italic: true, hang: 36, above: 16.1, below: 8.05}
# The cover (as filed; Rule 37 sets no cover contents beyond Rule 2 (a)): the court, the case number, each party with
# its role from the middle of the line, the court below, the title, the counsel line, counsel two to a row.
cover:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "Case No. {case_number}", align: center, bold: true, above: 16.1}
  - each: parties
    above: 32.2
    blocks:
      - {text: "{name}", align: center, above: 16.1}
      - {text: "{role}", italic: true, left: 234, optional: true}
  - {text: "{lower_court_case}", align: center, optional: true, above: 16.1}
  - {text: "{title}", align: center, bold: true, upper: true, left: 35.1, right: 35.1, above: 32.2, below: 32.2}
  - {text: "{counsel_role}", align: center, optional: true, above: 32.2}
  - columns: {each: counsel, per_row: 2, row_gap: 16.1, blocks: [{text: "{names}", bold: true}, {text: "{lines}", optional: true}]}
    gutter: 18
    above: 16.1
# GACTAPP-CONT-002 (Rule 25 (a) (1), by Rule 37 (a)): a table of contents when the filer asks for one (`toc`) and a
# table of cited authorities, each on its own page.
contents: {title: "Table of Contents", when: toc, depth: 3, col: 36, hang: 36, step: 36, above: 8.05}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 8.05
  group: {bold: true, above: 16.1, below: 8.05}
# GACTAPP-CERT-001, GACTAPP-MOT-003: the Rule 24 (f) (1) sentence just above the signature block, the date, the
# signature block (GACTAPP-SIG-001, -002: "/s/" and the typed name underlined, the name again below it), never split;
# then the certificate of service (GACTAPP-SVC-001, -002) on a page of its own, signed by the first signer.
# The body's last paragraph kept with the closing (tier 2: a signature page of its own reads as detached).
keep_with_closing: true
closing:
  - group:
      - {text: "This submission does not exceed the word count limit imposed by Rule 24.", pitch: body, indent: 36}
      - {text: "Respectfully submitted this {signature.date}.", optional: true, pitch: body, indent: 36}
      - {text: "{signature.lines}", optional: true, left: 180, above: 16.1}
      - {text: "{signature.signer_line}", underline: true, left: 180, above: 16.1}
      - {text: "{signature.name}", optional: true, left: 180}
      - {text: "{signature.signer}", optional: true, left: 180}
    above: 8.05
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", heading: 1}
      - {text: "{service.paragraphs}", pitch: body, indent: 36}
      - each: service.recipients
        blocks:
          - group: [{text: "{.}", left: 72}]
            above: 16.1
      - group:
          - {text: "{service.closing}", optional: true, pitch: body, indent: 36, above: 16.1}
          - {text: "{signature.signer_line}", underline: true, left: 180, above: 16.1}
          - {text: "{signature.name}", optional: true, left: 180}
          - {text: "{signature.signer.0}", optional: true, left: 180}
