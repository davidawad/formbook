# Montana Supreme Court (mont): amicus curiae brief (MRAP 12(7)). The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace
# to M.R.App.P. 11 and 12 (../../rules.md, MONT-*); lengths in points. No case text here: every string printed comes
# from the sample's frontmatter ({field}) or is a court constant. Type, spacing and headings as the court's answer brief
# (../../answering-brief/typst/layout.yaml), so the court's doc types look alike.
size: 14                  # MONT-FORM-003 (MRAP 11(2)): a proportionately spaced typeface of 14 points or more
pitch:
  body: 32.2              # MONT-FORM-004 (MRAP 11(3)(b)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # MRAP 11(3)(b): footnotes, quotations, headings, tables, cover, signature single (1.15 x 14 pt)
# MONT-FORM-002 (MRAP 11(3)(a)): at least 1 inch on every side; the bottom 0.1 in deeper so the last footnote line's
# descenders stay inside the 1 inch line.
margin: {top: 72, bottom: 79.2, left: 72, right: 72}
indent: 36
# MONT-FORM-004 (MRAP 11(3)(b)): pages are numbered; the cover unnumbered, the contents i, ii .., the brief from 1.
page_number: {align: center, front: lower-roman}
footnote: {size: 14, gap: 7}            # MRAP 11(2): footnotes 14 points; 11(3)(b): single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # MRAP 11(3)(b): indented material single spaced
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, left: 36, hang: 36, above: 14, below: 11.2}   # one step in; not italic (an italic case name in it)
# MONT-COVER-001 (MRAP 11(6)(b)): the court, the cause number, the caption with designations, the lower tribunal, venue
# and judge, the document title, and counsel for each party. MRAP 11(2) exempts the cover from the 14-point size: the
# title is 16 points, the tribunal, counsel and the note on counsel 12 points, counsel two groups to a row.
cover:
  - {text: "IN THE SUPREME COURT OF THE STATE OF MONTANA", align: center, bold: true}
  - {text: "{case_number}", align: center, bold: true, above: 14.4}
  - each: caption
    above: 14.4
    between:
      - {text: "v.", align: center, above: 7.2, below: 7.2}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{lower_court}", align: center, optional: true, size: 12, pitch: 13.8, above: 14.4}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4, above: 21.6}
  - columns: {each: counsel, per_row: 2, row_gap: 7.2, blocks: [{text: "{names}", bold: true, size: 12, pitch: 13.8}, {text: "{lines}", size: 12, pitch: 13.8}]}
    gutter: 28.8
    above: 21.6
  - {text: "{cover_note}", optional: true, size: 12, pitch: 13.8, above: 14.4}
# MONT-ORDER-001 (MRAP 12(1)(a)): a table of contents with page references, on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 18, step: 18, above: 7.2}
# The date and the signature blocks of each counsel group (two to a row), never split; then the MONT-CERT-001
# (MRAP 11(4)(e)) certificate of compliance on a page of its own: line spacing, typeface and size, and the word count;
# then the certificate of service (MRAP 11(4)(d), MONT-LEN-003) on a page of its own: the manner and date of service
# and each person served.
closing:
  - group:
      - {text: "Dated: {date}.", optional: true}
      - {text: "Respectfully submitted,", above: 16.1}
      - columns: {each: signature, per_row: 2, row_gap: 16.1, blocks: [{text: "{lines}"}]}
        gutter: 28.8
        above: 16.1
    above: 21.6
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
  - {text: "Pursuant to Rule 11 of the Montana Rules of Appellate Procedure, I certify that this brief is printed with a proportionately spaced Times New Roman text typeface of 14 points; is double spaced except for footnotes and for indented material; and the word count is {compliance.word_count}, excluding those sections exempted under Rule 11(4)(d).", pitch: body, indent: 36}
  - {text: "DATED this {compliance.date}.", indent: 36, optional: true}
  - {text: "{compliance.signer}", left: 230.4, above: 21.6}
  - {text: "{compliance.name}", left: 230.4}
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 16.8}
      - {text: "I, {service.signer}, hereby certify that I have served true and accurate copies of the foregoing document via {service.method} on {service.date} to the following:", pitch: body, indent: 36}
      - each: service.recipients
        blocks:
          - group:   # a recipient is never split
              - {text: "{names}"}
              - {text: "{lines}", optional: true}
            above: 11.2
