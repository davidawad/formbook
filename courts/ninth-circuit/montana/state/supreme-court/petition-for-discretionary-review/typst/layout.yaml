# Montana Supreme Court (mont): petition under M.R.App.P. 14 (Montana has no discretionary review; the exemplar is an
# emergency petition for writ of supervisory control, MRAP 14(3)), in the form of MRAP 11 (MRAP 14(9)(b)). The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to M.R.App.P. 11 and 14 (../../rules.md, MONT-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant. The
# type, spacing, headings and cover follow the court's answer brief (../answering-brief/typst/layout.yaml).
size: 14                  # MONT-FORM-003 (MRAP 11(2)): a proportionately spaced typeface of 14 points or more
pitch:
  body: 32.2              # MONT-FORM-004 (MRAP 11(3)(b)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # MRAP 11(3)(b): footnotes, quotations, headings, tables, cover, signature single (1.15 x 14 pt)
# MONT-FORM-002 (MRAP 11(3)(a)): at least 1 inch on every side; the bottom 0.1 in deeper so the last footnote line's
# descenders stay inside the 1 inch line.
margin: {top: 72, bottom: 79.2, left: 72, right: 72}
indent: 36
page_number: {align: center, from: 1}   # MONT-FORM-004: pages are numbered; the caption page is page 1
footnote: {size: 14, gap: 7}            # MRAP 11(2): footnotes 14 points; 11(3)(b): single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8, gap: 8.05}   # MRAP 11(3)(b): indented material single spaced; paragraphs half a line apart
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, left: 36, hang: 36, above: 14, below: 11.2}   # one step in; not italic (an italic case name in it)
# MONT-COVER-001 (MRAP 11(6)(b)): the court, the cause number, the caption with designations, the document title, and
# counsel for each party. The cause number and the title stand beside the caption (`caption_right`), as on this court's
# petitions; MONT-PET-003 (MRAP 14(6)): the caption names the district court and judge. MRAP 11(2) exempts the cover
# from the 14-point size: counsel 12 points, two groups to a row.
cover:
  - {text: "IN THE SUPREME COURT OF THE STATE OF MONTANA", align: center, bold: true}
  - columns:
      - width: 244.8
        blocks:
          - each: caption
            between:
              - {text: "v.", above: 14.4, below: 14.4}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", italic: true, left: 72}
      - blocks:
          - {text: "{caption_right}"}
    gutter: 21.6
    above: 36
  - columns: {each: counsel, per_row: 2, row_gap: 7.2, blocks: [{text: "{names}", bold: true, size: 12, pitch: 13.8}, {text: "{lines}", size: 12, pitch: 13.8}]}
    gutter: 28.8
    above: 36
# MONT-ORDER-001 (MRAP 12(1)(a)-(b)): a table of contents and a table of cases and authorities with page references,
# each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 18, step: 18, above: 7.2}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 18
  above: 7.2
  group: {bold: true, above: 16.8, below: 4.2}
# The date and the signature blocks of every signer (right of center), never split; then the MONT-CERT-001 (MRAP
# 11(4)(e)) certificate of compliance on a page of its own: line spacing, typeface and size, and the word count, held
# to MRAP 14(9)(b); then the certificate of service on a page of its own.
closing:
  - group:
      - {text: "{date}", indent: 36, optional: true}
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, above: 8.4}
    above: 21.6
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
  - {text: "Pursuant to Rule 11 of the Montana Rules of Appellate Procedure, I certify that this petition is printed with a proportionately spaced Times New Roman text typeface of 14 points; is double spaced except for footnotes and for indented material; and the word count is {word_count}, excluding those sections exempted under Rule 11(4)(d). It complies with the word limit of Rule 14(9)(b).", pitch: body, indent: 36}
  - group:
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6}
          - {text: "{name}", left: 230.4}
    above: 5.6
  - when: service
    blocks:
      - {break: true}
      - {text: "{service.heading}", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", pitch: body, indent: 36}
      - each: service.recipients
        blocks: [{text: "{.}", left: 72, above: 12}]
      - group:
          - {text: "/s/ *{service.signature.signer}*", underline: true, left: 230.4}
          - {text: "{service.signature.signer}", left: 230.4}
          - {text: "{service.signature.lines}", left: 230.4}
        above: 21.6
