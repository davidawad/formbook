# Montana Supreme Court (mont): petition for an extraordinary writ, original jurisdiction (MRAP 14), in the form of MRAP
# 11 (MONT-PET-002, MRAP 14(9)(b)). The whole layout, as data for the shared document model (lib/typst/xdoc.typ;
# latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace to M.R.App.P. 11 and
# 14 (../../rules.md, MONT-*); lengths in points. No case text here: every string printed comes from the sample's
# frontmatter ({field}) or is a court constant. The numbers are the answering brief's
# (../../answering-brief/typst/layout.yaml), so the court's doc types look alike.
size: 14                  # MONT-FORM-003 (MRAP 11(2)): a proportionately spaced typeface of 14 points or more
pitch:
  body: 32.2              # MONT-FORM-004 (MRAP 11(3)(b)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # MRAP 11(3)(b): footnotes, quotations, headings, cover, signature single (1.15 x 14 pt)
# MONT-FORM-002 (MRAP 11(3)(a)): at least 1 inch on every side; the bottom 0.1 in deeper so the last footnote line's
# descenders stay inside the 1 inch line.
margin: {top: 72, bottom: 79.2, left: 72, right: 72}
indent: 36
page_number: {align: center, from: 1}   # MONT-FORM-004: pages are numbered; the cover is page 1
footnote: {size: 14, gap: 7}            # MRAP 11(2): footnotes 14 points; 11(3)(b): single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # MRAP 11(3)(b): indented material single spaced
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, left: 36, hang: 36, above: 14, below: 11.2}   # one step in; not italic (an italic case name in it)
# MONT-COVER-001 (MRAP 11(6)(b)): the court, the cause number, the caption with designations, the lower tribunal, venue
# and judge (MONT-PET-003, MRAP 14(6)), the document title, and counsel for each party. MRAP 11(2) exempts the cover
# from the 14-point size: the title is 16 points, counsel 12 points, two groups to a row.
# Set as `front:` (the top of page 1, then a page break), not `cover:`: with neither contents nor authorities the
# shared docx engine (lib/docx/xdoc.lua) writes no cover at all; the cover is page 1 either way (MONT-FORM-004).
front:
  - {text: "IN THE SUPREME COURT OF THE STATE OF MONTANA", align: center, bold: true}
  - {text: "{case_number}", align: center, bold: true, above: 21.6}
  - each: caption
    above: 21.6
    between:
      - {text: "v.", align: center, above: 14.4, below: 14.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{proceeding}", align: center, optional: true, above: 21.6}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4, above: 36}
  - columns: {each: counsel, per_row: 2, row_gap: 7.2, blocks: [{text: "{names}", bold: true, size: 12, pitch: 13.8}, {text: "{lines}", size: 12, pitch: 13.8}]}
    gutter: 28.8
    above: 36
  - {break: true}
# No table of contents: the sample says `toc: false` (a short petition), and the model has no switch on that field, so
# this layout has no `contents:` (the old template honored `toc`; one with a contents page would add it here).
# The date, a word-count statement when the frontmatter gives one (MONT-PET-002, MRAP 14(9)(b): 4,000 words), and the
# signature block (each signer's "/s/" and name, then the lines, right of center), never split.
closing:
  - group:
      - {text: "{date}", indent: 36, optional: true}
      - when: word_count
        blocks:
          - {text: "This brief contains {word_count} words and complies with the word-count limit of M.R.App.P. 14(9)(b).", indent: 36, above: 5.6}
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.2}
          - {text: "{name}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, above: 8.4}
    above: 21.6
