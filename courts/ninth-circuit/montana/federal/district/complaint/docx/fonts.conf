<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Lets LibreOffice see the vendored EB Garamond (fonts/eb-garamond) without installing it. Set
     FONTCONFIG_FILE to this file for tools/render.sh and tools/check.sh with the docx engine. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../../../../../../../fonts/eb-garamond</dir>
  <cachedir prefix="xdg">formbook/fontconfig</cachedir>
</fontconfig>
