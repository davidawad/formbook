# Court of Appeals of the State of Washington (washctapp): motion (RAP 17.3, set under RAP 18.17).
# The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Rules: ../../rules.md (RAP 10.3, 18.17, RAP Form 5); a number with no rule is a style choice of the
# template, kept from the template it replaces. Lengths in points. No case text: every string printed comes from
# the sample's frontmatter ({field}) or is a court constant.
size: 14                  # WASHCTAPP-FORM-004 (RAP 18.17(a)(2)): 14 point for all text, footnotes, block quotations
pitch:
  body: 32.2              # WASHCTAPP-FORM-005 (RAP 18.17(a)(2)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # footnotes, block quotations, headings, cover, tables, signature: single (1.15 x 14 pt)
margin: {top: 108, bottom: 108, left: 144, right: 108}   # WASHCTAPP-FORM-002 (RAP 18.17(a)(1)): 2 in left, 1 1/2 in right, top, bottom
indent: 36
# RAP 18.17, RAP Form 5: page numbers at the bottom; the title page unnumbered, the tables i, ii .., the body from 1
page_number: {align: center, from: 1, front: lower-roman}
footnote: {size: 14, pitch: single, gap: 7}   # WASHCTAPP-FORM-004, -005: 14 pt, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # WASHCTAPP-FORM-005: block quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, left: 18, hang: 36, above: 14, below: 11.2}
  - {bold: true, left: 36, hang: 36, above: 14, below: 11.2}
# RAP 10.3(a)(1), RAP Form 5 (WASHCTAPP-COVER-001, -003): the title page: the court and division, the case title
# (one line per item) closed by a rule with the case number beside it, the court appealed from, the title, counsel.
cover:
  - {text: "THE COURT OF APPEALS OF THE STATE OF WASHINGTON", align: center, bold: true}
  - {text: "DIVISION {division}", align: center, bold: true, optional: true}
  - columns:
      - width: 230.4
        blocks:
          - {text: "{case_title}", above: 4.2}
          - {rule: 0.75, above: 5.6}
      - blocks:
          - {text: "No. {case_number}", left: 21.6, above: 4.2}
    gutter: 21.6
    above: 28.8
  - {text: "{on_appeal}", above: 28.8, optional: true}
  - {text: "{brief_title}", align: center, bold: true, above: 50.4}
  - each: counsel
    above: 36
    blocks:
      - group:
          - {text: "{names}", left: 180, optional: true}
          - {text: "{lines}", left: 180, optional: true}
        above: 12.6
# RAP 10.3(a)(2): a table of contents and a table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 4, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 2.8}
# WASHCTAPP-CERT-001 (RAP 18.17(b)): the word count, above the signature line; the date line, the statement and the
# signature block never split. The declaration of filing and service (RAP 17.4) on a page of its own, signed by the
# first signer of its signature.
closing:
  - group:
      - {text: "{date}", pitch: body}
      - {text: "Counsel certifies this motion complies with RAP 18.17 and contains {word_count} words, excluding the parts exempted by RAP 18.17(c).", indent: 36, pitch: body}
      - {text: "Respectfully submitted,", indent: 36, pitch: body}
      - group:
          - {text: "/s/ {signature.signer}", underline: true, left: 108}
          - {text: "{signature.lines}", left: 108, optional: true}
        above: 5.6
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "{service.heading}", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks:
              - {text: "{.}", left: 72, above: 14}
      - group:
          - {text: "{service.closing}", pitch: body, optional: true}
          - when: service.signature.signers
            blocks:
              - each: service.signature.signers
                blocks:
                  - {text: "/s/ {name}", underline: true, left: 108, above: 5.6}
                  - {text: "{lines}", left: 108, optional: true}
        above: 14
