# Supreme Court of Idaho (idaho): motion and supporting memorandum. The whole layout, as data for the shared document
# model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Rules:
# ../../rules.md (I.A.R. 36 applied to motion memoranda, I.A.R. 110); a number with no rule is a style choice of the
# template, kept from the template it replaces. Lengths in points. No case text: every string printed comes from the
# sample's frontmatter ({field}) or is a court constant.
size: 14                  # IDAHO-FORM-007 (I.A.R. 36(b)(3)): 14-point or larger, text and footnotes
pitch:
  body: 32.2              # IDAHO-FORM-002 (I.A.R. 36(b)(1)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # headings, footnotes, block quotations, caption, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # IDAHO-FORM-003 (I.A.R. 36(b)(1)): at least one inch
indent: 36
page_number: {align: center, from: 1}   # IDAHO-FORM-004 (I.A.R. 36(b)(1)): bottom margin, from the first page
footnote: {size: 14, pitch: single, gap: 7}   # IDAHO-FORM-007, -002: 14 pt, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # IDAHO-FORM-002: block quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# IDAHO-MOT-001 (I.A.R. 110): the first page, as the filed memorandum sets it (no separate cover): counsel at the top
# left, the Supreme Court heading (IDAHO-CONT-002), the proceeding beside the docket number and the title, then the
# parties, the memorandum following on the same page.
front:
  - each: counsel
    blocks:
      - group:
          - {text: "{names}", optional: true}
          - {text: "{lines}", optional: true}
        above: 9.8
  - {text: "IN THE SUPREME COURT OF THE STATE OF IDAHO", align: center, bold: true, above: 43.2}
  - columns:
      - width: 280.8
        blocks:
          - {text: "{proceeding}", optional: true}
      - blocks:
          - {text: "{case_number}"}
          - {text: "{brief_title}", bold: true, above: 16.8}
    gutter: 18
    above: 28.8
  - each: caption
    above: 11.2
    between:
      - {text: "v.", right: 187.2, above: 7, below: 7}
    blocks:
      - {text: "{names}", right: 187.2}
      - {text: "{designation}", italic: true, right: 187.2, above: 5.6}
  - {rule: 0.5, above: 16.8, below: 16.8}
# IDAHO-CERT-001 (I.A.R. 34(b)(4)): a word-count certificate, when the motion states a count, immediately before the
# signature; the date line, the certificate and the signature block never split. IDAHO-CERT-002: the certificate of
# service on a page of its own, signed by the filer.
closing:
  - group:
      - {text: "DATED this {date}.", indent: 36, pitch: body, optional: true}
      - when: word_count
        blocks:
          - {text: "This brief contains {word_count} words and complies with the word-count limit of I.A.R. 34(b).", indent: 36, pitch: body}
      - &signature
        group:
          - when: signature.firm
            blocks:
              - {text: "{signature.firm}", bold: true, left: 230.4}
          - when: signature.signer
            blocks:
              - {text: "/s/ {signature.signer}", underline: true, left: 230.4, above: 11.2}
              - {text: "{signature.signer}", left: 230.4}
          - when: signature.signers
            blocks:
              - each: signature.signers
                blocks:
                  - {text: "/s/ {name}", underline: true, left: 230.4, above: 12.6}
                  - {text: "{name}", left: 230.4}
                  - {text: "{lines}", left: 230.4, optional: true}
          - {text: "{signature.lines}", left: 230.4, optional: true}
        above: 5.6
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "{service.heading}", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks:
              - {text: "{.}", left: 72, above: 14}
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - *signature
