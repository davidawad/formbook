# Supreme Court of Idaho (idaho): brief in support of a petition for review (I.A.R. 118(c)), set as a brief
# (IDAHO-PET-003), on the caption page of the filed brief (no cover). The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Rules:
# ../../rules.md (I.A.R. 34, 36, 110); a number with no rule is a style choice of the template, kept from the
# template it replaces. Lengths in points. No case text: every string printed comes from the sample's frontmatter
# ({field}) or is a court constant.
size: 14                  # IDAHO-FORM-007 (I.A.R. 36(b)(3)): 14-point or larger, text and footnotes
pitch:
  body: 32.2              # IDAHO-FORM-002 (I.A.R. 36(b)(1)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # headings, footnotes, block quotations, cover, tables, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # IDAHO-FORM-003 (I.A.R. 36(b)(1)): at least one inch
indent: 36
page_number: {align: center, from: 1}   # IDAHO-FORM-004 (I.A.R. 36(b)(1)): bottom margin; the cover is page 1
footnote: {size: 14, pitch: single, gap: 7}   # IDAHO-FORM-007, -002: 14 pt, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # IDAHO-FORM-002: block quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# IDAHO-CONT-001, -002 (I.A.R. 36(a), 110), IDAHO-CONT-004: the caption page as the filed brief sets it, the body
# following on the same page: counsel at the top left, the Supreme Court heading, then the parties on the left, a
# ")" beside each of their lines, and the court numbers, county, judge and title (`caption_right`, one line each) on
# the right. Every caption line is one single-spaced line box, so the three columns keep their rows.
front:
  - each: counsel
    blocks:
      - group:
          - {text: "{names}", optional: true}
          - {text: "{lines}", optional: true}
        above: 8.4
  - {text: "IN THE SUPREME COURT OF THE STATE OF IDAHO", align: center, bold: true, above: 43.2}
  - columns:
      - width: 244.8
        blocks:
          - each: caption
            between:
              - {text: "vs."}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", italic: true, left: 72, optional: true}
      - width: 21.6
        blocks:
          - each: caption
            between:
              - {text: ")"}
            blocks:
              - each: names
                blocks:
                  - {text: ")"}
              - when: designation
                blocks:
                  - {text: ")"}
      - blocks:
          - {text: "{caption_right}"}
    above: 43.2
    below: 43.2
# IDAHO-CERT-001 (I.A.R. 34(b)(4)): the word-count certificate, stating the number, immediately before the signature;
# the date line, the certificate and the signature block never split. IDAHO-CERT-002: the certificate of service on a
# page of its own, signed by the filer.
closing:
  - group:
      - {text: "{date}", indent: 36, pitch: body, optional: true}
      - {text: "This brief contains {word_count} words and complies with the word-count limit of I.A.R. 34(b).", indent: 36, pitch: body}
      - group:
          - when: signature.firm
            blocks:
              - {text: "{signature.firm}", bold: true, left: 230.4}
          - when: signature.signer
            blocks:
              - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4, above: 11.2}
              - {text: "{signature.signer}", left: 230.4}
          - when: signature.signers
            blocks:
              - each: signature.signers
                blocks:
                  - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12.6}
                  - {text: "{name}", left: 230.4}
                  - {text: "{lines}", left: 230.4, optional: true}
          - {text: "{signature.lines}", left: 230.4, optional: true}
        above: 5.6
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "{service.heading}", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks:
              - {text: "{.}", left: 72, above: 14}
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - group:
          - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4}
          - {text: "{signature.signer}", left: 230.4}
          - {text: "{signature.lines}", left: 230.4, optional: true}
        above: 19.6
