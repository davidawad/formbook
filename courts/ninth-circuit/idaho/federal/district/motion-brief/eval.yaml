# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.12), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: Dist. Idaho Loc. Civ. R. 7.1(a)(2), a memorandum at most twenty pages (the count here is every page,
  # the certificate of service included, the conservative reading).
  page_limit: 20
