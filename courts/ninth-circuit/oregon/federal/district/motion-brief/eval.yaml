# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.92), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # ORD-LEN-001: LR 7-2(b), a memorandum at most 35 pages (or 11,000 words), exclusive of exhibits.
  page_limit: 35
