# U.S. District Court for the District of Oregon (ord): a motion with its memorandum in one document (LR 7-1(c)), on
# the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with D. Or.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb
# engines gen`). Rules: D. Or. Local Rules of Civil Procedure, effective December 1, 2025 (../rules.md ORD-FORM-001..006;
# ../README.md quotes them). The base already meets LR 10-1(b) (double-spaced; counsel, caption, quotations, footnotes
# single), 10-1(c) (12-point type, footnotes included), 10-1(d) (one-inch margins, no line numbers) and 10-1(f)(1)
# (letter paper).
base: /lib/layouts/frcp-motion-brief.yaml
# LR 10-1(e)(1) (ORD-FORM-005): a footer on every page with the consecutive page number and a brief description of the
# document, the sample's `footer_title` (a running footer, fb-595.92), at the left margin as both exemplars set it.
page_number: {align: left, text: "Page {page} - {footer_title}"}
# The cover page (page 1, numbered with the body; the text from page 2, as filed): LR 10-2(a), counsel at the upper
# left from the top margin, single-spaced (an empty line a blank one); LR 10-2(b), the court title in capitals,
# centered and double-spaced at least an inch below it; LR 10-2(d), (f), (g): the parties single-spaced at the left (a
# party's designation 1.4 in in, as both filers set it),
# "vs." between them; from the page's center the case number on the first party's line, the title of the paper two
# lines below it in bold capitals, single-spaced, and the sample's legend ("(Oral Argument Requested)") a line below.
cover:
  - {text: "{counsel}"}
  - {text: "{court.0}", align: center, bold: true, upper: true, pitch: body, above: 72}
  - {text: "{court.1}", align: center, bold: true, upper: true, pitch: body, optional: true}
  - {text: "{division}", align: center, bold: true, upper: true, pitch: body, optional: true}
  - columns:
      - width: 212.4
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 100.8}
            between:
              - {text: "vs."}
      - blocks:
          - {text: "Case No. {case_number}"}
          - {text: "{brief_title}", bold: true, upper: true, above: 27.6}
          - {text: "{legend}", optional: true, above: 13.8}
    gutter: 21.6
    above: 12
front: []
# Headings at the type size on the body pitch with no space of their own, kept with what follows: a section centered
# in bold capitals (the certification, the motion, the memorandum and its parts), an argument heading bold at the
# margin, a sub-heading bold half an inch in (the sample writes their "I.", "A." labels).
heading:
  - {align: center, bold: true, upper: true, pitch: body, above: 0, below: 0}
  - {bold: true, pitch: body, above: 0, below: 0}
  - {bold: true, left: 36, pitch: body, above: 0, below: 0}
# LR 10-1(b): quotations single-spaced, half an inch in on each side, 12 pt above and below.
quote: {left: 36, right: 36, above: 12, below: 12}
# FRCP 11(a): "DATED:" and the date at the left; from 3.1 in the firm, "By: /s/" and the signer, the signer's lines,
# single-spaced; a double line below the last paragraph, kept with it (the base's keep_with_closing).
closing:
  - group:
      - columns:
          - {width: 223.2, blocks: [{text: "DATED: {date}"}]}
          - blocks:
              - {text: "{signature.firm}"}
              - {text: "By: /s/ {signature.signer}", above: 12}
              - {text: "{signature.lines}", optional: true}
    above: 24
# FRCP 5(b), (d)(1)(B): the certificate of service on a page of its own (the form's words; the date, the parties
# served and the method from the sample's `certificate_of_service`), signed at 3.1 in.
after_tail:
  - when: certificate_of_service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", heading: 1}
      - {text: "The undersigned declares under penalty of perjury, under the laws of the State of Oregon, that on {certificate_of_service.date}, I arranged for service of the foregoing {brief_title} on the party to this action as follows:", pitch: body, indent: 36}
      - {text: "{certificate_of_service.served}", left: 36, above: 12}
      - {text: "by: {certificate_of_service.method}", left: 36, above: 12}
      - {text: "s/ {signature.signer}", left: 223.2, above: 24}
      - {text: "{signature.signer}", left: 223.2}
