# Nevada Supreme Court (nev): appellant's reply brief (NRAP 28(c)). The whole layout, as data for the shared document
# model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers
# trace to NRAP 28 and 32 (../../rules.md, NEV-*); lengths in points. No case text here: every string printed comes from
# the sample's frontmatter ({field}) or is a court constant. The answering brief's layout (../answering-brief) where the
# two templates agree.
size: 14                  # NEV-FORM-004 (NRAP 32(a)(5)(A)): proportionally spaced type, 14 points or larger
pitch:
  body: 32.2              # NEV-FORM-003 (NRAP 32(a)(4)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NEV-FORM-002 (NRAP 32(a)(4)): at least one inch on all four sides
indent: 36                # convention: half-inch first-line indent
page_number: {align: center, front: lower-roman}   # NEV-FORM-006 (NRAP 32(a)(4)): at the bottom; the cover unnumbered, the tables i, ii .., the brief from the Introduction 1, 2 ..
footnote: {size: 14, gap: 7}             # NEV-FORM-004 (NRAP 32(a)(5)): footnotes in the body's size and face; single spaced (NRAP 32(a)(4)); gap convention
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # NEV-FORM-003: quotations of more than two lines indented, single spaced; indents and space convention
# Headings single spaced (NEV-FORM-003); their look and space convention.
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The cover (NEV-COVER-001, NRAP 32(a)(2)(A)-(E)): the court and the case number, the title of the case, the proceeding
# and the court below, the document's title and counsel. Spaces between the parts are convention, tight enough that three counsel groups fit the one page.
cover:
  - {text: "IN THE SUPREME COURT OF THE STATE OF NEVADA", align: center, bold: true}
  - {text: "{case_number}", align: center, bold: true, above: 14.4}
  - each: caption
    above: 14.4
    between:
      - {text: "v.", align: center, above: 14.4, below: 14.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true, above: 5.6}
  - {text: "{proceeding}", align: center, optional: true, above: 14.4}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4, above: 28.8}   # NRAP 32(a)(2)(D): the title; 16 pt convention
  - columns: {each: counsel, per_row: 2, row_gap: 8.4, blocks: [{text: "{names}", bold: true}, {text: "{lines}"}]}   # NRAP 32(a)(2)(E): counsel
    gutter: 28.8
    above: 28.8
# NRAP 28(a)(2), (3) as applied to a reply by NRAP 28(c) (NEV-ORDER-004): the table of contents and the table of
# authorities, each from a page of its own. Columns and steps convention.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 2.8}
# The date and the signature block (NRAP 32(d)), never split; then the attorney's certificate (NRAP 28.2, 32(a)(9);
# NEV-CERT-001, its statements the court's own; the word count the filer's) and the certificate of service (NRAP 25(d)),
# each from a page of its own. Signature at 3.2 in from the margin: convention.
closing:
  - &sign
    group:
      - {text: "{date}", indent: 36, optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 11.2}
      - {text: "{signature.firm_lines}", left: 230.4, optional: true}
      - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4, above: 11.2}
      - {text: "{signature.signer}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, above: 8.4}
    above: 14.4
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true}
  - {text: "I hereby certify that this brief complies with the formatting requirements of NRAP 32(a)(4), the typeface requirements of NRAP 32(a)(5), and the type style requirements of NRAP 32(a)(6) because this brief has been prepared in a proportionally spaced typeface using Times New Roman in size 14 font.", pitch: body, indent: 36, above: 16.8}
  - {text: "I further certify that this brief complies with the page- or type-volume limitations of NRAP 32(a)(7) because, excluding the parts of the brief exempted by NRAP 32(a)(7)(C), it contains {word_count} words.", pitch: body, indent: 36}
  - group:
      - {text: "Finally, I hereby certify that I have read this appellate brief, and to the best of my knowledge, information, and belief, it is not frivolous or interposed for any improper purpose. I further certify that this brief complies with all applicable Nevada Rules of Appellate Procedure, in particular NRAP 28(e)(1), which requires every assertion in the brief regarding matters in the record to be supported by a reference to the page and volume number, if any, of the transcript or appendix where the matter relied on is to be found. I understand that I may be subject to sanctions in the event that the accompanying brief is not in conformity with the requirements of the Nevada Rules of Appellate Procedure.", pitch: body, indent: 36}
      - *sign
  # NRAP 25(d), NEV-ELEC-004: proof of service, signed by the one who served.
  - when: service
    blocks:
      - {break: true}
      - {text: "{service.heading}", align: center, bold: true, upper: true}
      - {text: "{service.paragraphs}", pitch: body, indent: 36, above: 16.8}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks: [{text: "{.}", left: 72, above: 14}]
      - {text: "{service.closing}", pitch: body, indent: 36, optional: true}
      - group:
          - {text: "/s/ *{service.signature.signer}*", underline: true, left: 230.4}
          - {text: "{service.signature.signer}", left: 230.4}
          - {text: "{service.signature.lines}", left: 230.4, optional: true, above: 8.4}
        above: 21.6
