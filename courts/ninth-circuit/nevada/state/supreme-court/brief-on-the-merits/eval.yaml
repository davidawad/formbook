# DEF-COVER-001: the cover and the NRAP 26.1 disclosure (NEV-ORDER-004) are the two pages before the first page number.
# The shared model has no numbered page before the tables, so the disclosure is set as a second cover page; NRAP
# 32(a)(4) (NEV-FORM-006) wants it numbered i: a recorded deviation (typst/layout.yaml, docs/open-items/fb-595.54.18.md).
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Not gated yet: the differences are the
# shared model's, not this folder's (docs/open-items/fb-595.54.18.md): LaTeX does not break a long URL where typst and
# Word do (p12 on, a page later from there; p22 runs into the right margin), typst and Word break a URL at different
# points (p12, p13, p22), and LaTeX numbers the second cover page (the disclosure, p2 prints "2").
params:
  cover_pages: 2
  cross_engine: report
