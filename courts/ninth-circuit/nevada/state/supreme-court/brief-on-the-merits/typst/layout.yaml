# Nevada Supreme Court (nev): brief on the merits (an appellant's opening brief, NRAP 28(a)). The whole layout, as
# data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to NRAP 26.1, 28 and 32 (../../rules.md, NEV-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
#
# Recorded deviations from NEV-FORM-006 (NRAP 32(a)(4)), which the model cannot yet set (docs/open-items):
# - the NRAP 26.1 disclosure (NEV-ORDER-004, before the table of contents) is set as a second cover page, so it
#   prints no number (the rule wants it i; the tables follow as i, ii ..);
# - the Arabic numbers start at the first heading of the body (the jurisdictional statement), not at the statement
#   of the case (the frontmatter's `arabic_from`, which the old template honored and the model has no means for).
size: 14                  # NEV-FORM-004 (NRAP 32(a)(5)(A)): proportionally spaced type, 14 points or larger
pitch:
  body: 32.2              # NEV-FORM-003 (NRAP 32(a)(4)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NEV-FORM-002 (NRAP 32(a)(4)): at least one inch on all four sides
indent: 36                # convention: a half-inch first-line indent
page_number: {align: center, front: lower-roman}   # NEV-FORM-006 (NRAP 32(a)(4)): at the bottom; the cover unnumbered, the tables i, ii .., the brief 1, 2 .. (see the deviations above)
footnote: {size: 14, gap: 7}             # NEV-FORM-004 (NRAP 32(a)(5)): footnotes in the body's size and face; single spaced (NEV-FORM-003)
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # NEV-FORM-003: quotations of more than two lines indented, single spaced; the space convention
heading:                  # NEV-FORM-003: headings single spaced; their look and space convention
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The cover (NEV-COVER-001, NRAP 32(a)(2)(A)-(E)): the court; the title of the case in a left column clear of the
# clerk's file stamp (convention), the case number, the proceeding and the court below beneath it; the document's
# title; counsel two to a row.
cover:
  - {text: "IN THE SUPREME COURT OF THE STATE OF NEVADA", align: center, bold: true}
  - columns:
      - width: 216          # convention: a three-inch caption column, the upper right left to the file stamp
        blocks:
          - each: caption
            between:
              - {text: "v.", left: 36, above: 11.2, below: 11.2}   # convention
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", italic: true, left: 86.4, above: 5.6}   # convention: the party designation indented
          - {text: "{case_number}", above: 36}
          - {text: "{proceeding}", optional: true}
          - {text: "{trial_court_case}", optional: true}
      - blocks: []
    gutter: 14.4
    above: 36
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4, above: 50.4}   # convention: the title set off, 16 pt (1.15 x 16)
  - columns: {each: counsel, per_row: 2, row_gap: 8.4, blocks: [{text: "{names}", bold: true}, {text: "{lines}"}]}
    gutter: 28.8            # convention
    above: 50.4
  # NEV-ORDER-004 (NRAP 26.1(b), (d)): the disclosure, in a principal brief before the table of contents, signed by
  # the attorney of record. Its own page (unnumbered here: see the deviations above).
  - when: disclosure
    blocks:
      - {break: true}
      - {text: "{disclosure.heading}", align: center, bold: true, upper: true}
      - {text: "{disclosure.paragraphs}", pitch: body, indent: 36, above: 16.8}
      - {text: "{disclosure.date}", pitch: body, indent: 36, optional: true}
      - group:
          - {text: "{disclosure.signature.firm}", bold: true, left: 230.4, optional: true}
          - each: disclosure.signature.signers
            blocks:
              - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.2}
              - {text: "{name}", left: 230.4}
              - {text: "{lines}", left: 230.4}
          - {text: "{disclosure.signature.lines}", left: 230.4, optional: true, above: 8.4}
        above: 11.2
# NEV-ORDER-001 (NRAP 28(a)(2), (3)): the table of contents and the table of authorities, each from a page of its own.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 2.8}
# The date and the signature block (NRAP 32(d)), never split; then the attorney's certificate (NRAP 28.2, 32(a)(9);
# NEV-CERT-001, its statements the court's own; the word count the filer's) with its date and signature, and the
# certificate of service (NRAP 25(d)), each from a page of its own.
closing:
  - &sign
    group:
      - {text: "{date}", indent: 36, optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 11.2}
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.2}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
    above: 21.6
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true}
  - {text: "I hereby certify that this brief complies with the formatting requirements of NRAP 32(a)(4), the typeface requirements of NRAP 32(a)(5), and the type style requirements of NRAP 32(a)(6) because this brief has been prepared in a proportionally spaced typeface using Times New Roman in 14-point type.", pitch: body, indent: 36, above: 16.8}
  - {text: "I further certify that this brief complies with the page- or type-volume limitations of NRAP 32(a)(7) because, excluding the parts of the brief exempted by NRAP 32(a)(7)(C), it contains {word_count} words.", pitch: body, indent: 36}
  - group:
      - {text: "Finally, I hereby certify that I have read this appellate brief, and to the best of my knowledge, information, and belief, it is not frivolous or interposed for any improper purpose. I further certify that this brief complies with all applicable Nevada Rules of Appellate Procedure, in particular NRAP 28(e)(1), which requires every assertion in the brief regarding matters in the record to be supported by a reference to the page and volume number, if any, of the transcript or appendix where the matter relied on is to be found. I understand that I may be subject to sanctions in the event that the accompanying brief is not in conformity with the requirements of the Nevada Rules of Appellate Procedure.", pitch: body, indent: 36}
      - *sign
  - when: service
    blocks:
      - {break: true}
      - {text: "{service.heading}", align: center, bold: true, upper: true}
      - {text: "{service.paragraphs}", pitch: body, indent: 36, above: 16.8}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks: [{text: "{.}", left: 72, above: 14}]
      - {text: "{service.closing}", pitch: body, indent: 36, optional: true, above: 14}
      - when: service.signature
        blocks:
          - each: service.signature.signers
            above: 21.6
            blocks:
              - {text: "/s/ *{name}*", underline: true, left: 230.4}
              - {text: "{name}", left: 230.4}
              - {text: "{lines}", left: 230.4}
          - {text: "{service.signature.lines}", left: 230.4, optional: true}
