# Nevada Supreme Court (nev): petition for rehearing (NRAP 40) or en banc reconsideration (NRAP 40A). The whole layout,
# as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to NRAP 32, 40 and 40A (../../rules.md, NEV-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # NEV-FORM-004 (NRAP 32(a)(5)(A)): proportionally spaced type, 14 points or larger; NEV-REH-001/002: the form of NRAP 32
pitch:
  body: 32.2              # NEV-FORM-003 (NRAP 32(a)(4)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # NEV-FORM-003: headings, quotations, footnotes single spaced (1.15 x 14 pt); cover, tables, signature by convention
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NEV-FORM-002 (NRAP 32(a)(4)): at least one inch on all four sides
indent: 36                # convention: a half-inch first-line indent
page_number: {align: center, front: lower-roman}   # NEV-FORM-006 (NRAP 32(a)(4)): at the bottom; the cover unnumbered, the contents i, the petition 1, 2 ..
footnote: {size: 14, gap: 7}             # NEV-FORM-004 (NRAP 32(a)(5)): footnotes in the body's size and face; single spaced (NRAP 32(a)(4)); gap convention
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # NEV-FORM-003: quotations of more than two lines indented (convention: 0.5 in each side), single spaced
# Headings (convention): level 1 centered bold capitals (the certificates and the table titles), level 2 bold, level 3
# bold italic, single spaced (NEV-FORM-003) and kept with what follows.
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The cover (NEV-COVER-001, NRAP 32(a)(2)(A)-(E)): the court and the case number, the title of the case, the proceeding
# and the court below, the document's title and counsel. Spacing convention.
cover:
  - {text: "IN THE SUPREME COURT OF THE STATE OF NEVADA", align: center, bold: true}
  - {text: "{case_number}", align: center, bold: true, above: 14.4}
  - each: caption
    above: 14.4
    between:
      - {text: "v.", align: center, above: 7.2, below: 7.2}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true, above: 5.6}
  - {text: "{proceeding}", align: center, optional: true, above: 14.4}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4, above: 72}
  - columns: {each: counsel, per_row: 2, row_gap: 8.4, blocks: [{text: "{names}", bold: true}, {text: "{lines}"}]}
    gutter: 28.8
    above: 21.6
# Table of contents (convention: the petition's headings start at level 2, so the rows are not stepped in).
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 21, step: 0, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 2.8}
# The date and the signature block (NRAP 32(d)), never split; then the certificate of compliance (NEV-REH-001, NRAP
# 40(b)(4), 32(a)(9); the court's own statements, the word count the filer's) and the certificate of service
# (NRAP 25(d)), each from a page of its own.
closing:
  - group:
      - {text: "{date}", indent: 36, optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 11.2}
      - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4, above: 11.2}
      - {text: "{signature.signer}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, above: 8.4}
    above: 21.6
  - {break: true}
  - {text: "Certificate of Compliance", align: center, bold: true, upper: true}
  # the statements and the signature kept together (convention): the signer only, counsel's particulars are in the
  # signature block above
  - group:
      - {text: "I certify that this petition complies with the typeface and type style requirements of NRAP 32(a)(4)-(6) because it has been prepared in proportionally spaced Times New Roman, 14-point type, and is double spaced. I certify that this petition complies with the page or type-volume limitation of NRAP 40(g) and 40A(f) because it contains {word_count} words, computed under NRAP 32(a)(7)(C). I hereby certify that I have read this petition, and to the best of my knowledge, information, and belief, it is not frivolous or interposed for any improper purpose. I further certify that this petition complies with all applicable Nevada Rules of Appellate Procedure, including the rules that require every assertion in the petition regarding matters in the record to be supported by a reference to the page and volume number, if any, of the transcript or appendix where the matter relied on is to be found. I understand that I may be subject to sanctions if the accompanying petition is not in conformity with the requirements of the Nevada Rules of Appellate Procedure.", pitch: body, indent: 36}
      - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4, above: 21.6}
      - {text: "{signature.signer}", left: 230.4}
    above: 16.8
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true}
      - {text: "{service.paragraphs}", pitch: body, indent: 36, above: 16.8}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks: [{text: "{.}", left: 72, above: 14}]
      - {text: "{service.closing}", pitch: body, indent: 36, optional: true}
      - group:
          - {text: "/s/ *{service.signature.signer}*", underline: true, left: 230.4}
          - {text: "{service.signature.signer}", left: 230.4}
          - {text: "{service.signature.lines}", left: 230.4, above: 8.4}
        above: 21.6
