# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails. The INPUT's long URL (p19) carries a zero-width space after each
# inner "/", the break point typst and Word already use, because the shared model gives LaTeX none there
# (docs/open-items/fb-595.54.18.md).
params:
  cross_engine: gate
