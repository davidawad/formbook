# DEF-COVER-001: the cover and the NRAP 26.1 disclosure statement (NEV-ORDER-004) are the two unnumbered pages before
# the table of contents (i). NRAP 32(a)(4) (NEV-FORM-006) would number the disclosure page i: the shared model has no
# numbered page before the tables, so the disclosure is set as the cover's second page. A recorded deviation.
#
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Not gated yet: the differences are the
# shared model's, not this folder's: LaTeX numbers the cover's second page (the disclosure, p2 prints "2") and does
# not break a long URL where typst and Word do (p11 note 6; p21 note 47 runs into the right margin, DEF-FORM-002);
# typst carries a paragraph's first line over with its second when the second line's note does not fit, which LaTeX
# and Word leave at the page foot (p16-p18, p20-p21); Word fits one body line less above four notes (p13-p16); typst
# sets the mark of the body's last word ("NRS 293.277.") on the next page when the closing moves there (TOA "25").
params:
  cover_pages: 2
  cross_engine: report
