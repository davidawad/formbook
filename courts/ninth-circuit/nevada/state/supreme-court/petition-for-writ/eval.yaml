# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Gated (third pass, model at
# 09043fb05): layout.yaml sets `footnote.widows: true`, so a paragraph or list item that calls a note keeps its widow
# and orphan control in every engine (list item 6, which calls note 12, stays whole on p12 in typst as in LaTeX and
# Word); the docx table of authorities now lists the pages cited only in a footnote.
params:
  cross_engine: gate
