# Nevada Supreme Court (nev): petition for writ (NRAP 21): an original proceeding, a verified petition. The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to NRAP 21, 26.1, 28 and 32 (../../rules.md, NEV-*); lengths in
# points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # NEV-FORM-004 (NRAP 32(a)(5)(A)): proportionally spaced type, 14 points or larger
pitch:
  body: 32.2              # NEV-FORM-003 (NRAP 32(a)(4)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # NEV-FORM-002 (NRAP 32(a)(4)): at least one inch on all four sides
indent: 36                # convention: paragraphs indented half an inch
# NEV-FORM-006 (NRAP 32(a)(4)): at the bottom; the cover unnumbered, the disclosure and the tables i, ii .., the
# petition 1, 2 ..
page_number: {align: center, front: lower-roman}
footnote: {size: 14, gap: 7, widows: true}   # NEV-FORM-004 (NRAP 32(a)(5)): footnotes in the body's size and face; single spaced (NRAP 32(a)(4)); widows: a list item that calls a note keeps its lines together in every engine (convention)
quote: {left: 36, right: 36, above: 11.2, below: 16.8, gap: 8.4}   # NEV-FORM-003: quotations of more than two lines indented, single spaced; a paragraph of one 8.4 below the last (convention)
heading:                  # NEV-FORM-003: headings single spaced; their look is convention
  - {align: center, bold: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The cover (NEV-COVER-001, NRAP 32(a)(2)(A)-(E); NRAP 21(a)(2) names every party): the court and the case number,
# the title of the case, the proceeding and the court below, the document's title and counsel. Then (NEV-ORDER-004,
# NRAP 26.1, 21(e)) the disclosure statement on a page of its own before the table of contents. The title and the
# counsel stand apart by the space the page leaves (the old template's v(1fr), convention).
cover:
  - {text: "IN THE SUPREME COURT OF THE STATE OF NEVADA", align: center, bold: true}
  - {text: "{case_number}", align: center, bold: true, above: 21.6}
  - each: caption
    above: 21.6
    between:
      - {text: "v.", align: center, above: 14.4, below: 14.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true, above: 5.6}
  - {text: "{proceeding}", align: center, optional: true, above: 21.6}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {fill: 1}
  - {text: "{brief_title}", align: center, bold: true, size: 16, pitch: 18.4}
  - {text: "{cover_note}", align: center, bold: true, optional: true, above: 8.4}
  - {fill: 1}
  - columns: {each: counsel, per_row: 2, row_gap: 8.4, blocks: [{text: "{names}", bold: true}, {text: "{lines}"}]}
    gutter: 28.8
# NEV-ORDER-004 (NRAP 26.1(b), 21(e)): the disclosure statement, numbered i with the tables (NEV-FORM-006). Its title
# is not a heading, so the contents do not list it (the filed exemplar does): Word's page lookup gives a heading there
# the contents' own page (docs/open-items/fb-595.54.18.md).
before_tables:
  - when: disclosure
    blocks:
      - {text: "{disclosure.heading}", align: center, bold: true}
      - {text: "{disclosure.paragraphs}", pitch: body, indent: 36, above: 16.8}
      - when: disclosure.signature
        blocks:
          - group:
              - {text: "{disclosure.signature.firm}", bold: true, left: 230.4, optional: true}
              - each: disclosure.signature.signers
                blocks:
                  - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.2}
                  - {text: "{name}", left: 230.4}
                  - {text: "{lines}", left: 230.4, optional: true}
              - {text: "{disclosure.signature.lines}", left: 230.4, optional: true, above: 8.4}
            above: 21.6
# NRAP 28(a)(2), (3) (NEV-ORDER-001): the table of contents and the table of authorities, each from a page of its own.
contents: {title: "TABLE OF CONTENTS", depth: 3, col: 36, hang: 21, step: 21, above: 12.6}
authorities:
  title: "TABLE OF AUTHORITIES"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 2.8}
# The date and the signature block (NRAP 32(d)), never split; then each certificate of the frontmatter from a page of
# its own: the verification (NEV-WRIT-001, NRAP 21(a)(5)), the certificate of compliance (NEV-CERT-001, -002, NRAP
# 21(d), 28.2, 32(a)(9)), the NRAP 27(e) certificate of an emergency petition, the certificate of service (NEV-CERT-003,
# NRAP 25(d)). A certificate's paragraph ({text}) is set as the body (NEV-FORM-003); a block of lines ({lines}: an
# address, a list of e-mails) single spaced and indented (convention). Each title is a heading, listed in the contents
# (as the old template and the filed exemplar).
closing:
  - group:
      - {text: "{date}", indent: 36, optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 11.2}
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.2}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4, optional: true}
      - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
    above: 21.6
  - when: certificates
    blocks:
      - each: certificates
        blocks:
          - {break: true}
          - {text: "{heading}", heading: 1}
          - each: paragraphs
            above: 16.8
            blocks:
              - {text: "{text}", pitch: body, indent: 36, optional: true}
              - when: lines
                blocks:
                  - group: [{text: "{lines}", left: 36}]
                    above: 8.4
                    below: 8.4
          - group:
              - {text: "{signature.firm}", bold: true, left: 230.4, optional: true}
              - each: signature.signers
                blocks:
                  - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.2}
                  - {text: "{name}", left: 230.4}
                  - {text: "{lines}", left: 230.4, optional: true}
              - {text: "{signature.lines}", left: 230.4, optional: true, above: 8.4}
            above: 21.6
