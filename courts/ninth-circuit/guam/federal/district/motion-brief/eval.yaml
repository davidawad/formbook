# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.12), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-COVER-002 reported, not gated, on every engine (typst and docx are listed in data/cover-structure-baseline.txt;
  # latex, new with fb-595.17.12, alike): the one exemplar sets its numbered section headings indented at the left and
  # its certificate's title centered; the template centers every level-1 heading (the base's, and the federal
  # convention), so the certificate's title, set as a level-1 heading, stays centered too.
  cover_structure: report
