# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.12), so the latex and docx renders
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # Word only: LibreOffice sets the line that cites footnote 3 on p5 and the note on p6 (the note does not fit p5 and
  # keeps its lines); typst moves the line on with its note, so p6 onward breaks apart (XENG-002, -003; the same at a
  # footnote clearance of 7.5). A renderer limitation, not the template's (docs/open-items/fb-595.54.82.md, Word's
  # note placement; docs/open-items/fb-595.54.78.md, third pass).
  cross_engine_docx: report
