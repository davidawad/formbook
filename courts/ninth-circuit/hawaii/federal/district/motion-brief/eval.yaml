# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.92), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-COVER-001: the motion is the cover, unnumbered on both of its pages (its signature runs to page 2), the tables
  # from i.
  cover_pages: 2
  # DEF-COVER-002 reported, not gated, on every engine (typst and docx are listed in data/cover-structure-baseline.txt;
  # latex, new with fb-595.92, alike): with the two-page cover the measure compares the exemplar's second motion page,
  # whose signature names (LAUREN K. CHUN ..) it pairs with the same names in our counsel column, and so finds the
  # motion's paragraphs "out of order"; the caption page itself matches. Tier 3, reviews/2026-10-29.md.
  cover_structure: report
