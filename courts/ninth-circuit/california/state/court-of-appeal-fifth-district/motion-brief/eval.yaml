# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails. LaTeX is held back: pdfLaTeX's ebgaramond (Type 1) sets EB Garamond
# narrower than the vendored face typst and Word use, and with old-style figures (docs/open-items/fb-595.54.57.md).
params:
  cross_engine: gate
  cross_engine_latex: report
