# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.12), so the latex and docx renders
# break every line and page where the typst render does, and a difference fails. LaTeX is gated. Docx is reported
# (docs/open-items/fb-595.54.48.md): the generated docx/reference.xml does not turn ligatures off (S6), so LibreOffice
# sets Schola's fi/ff ligatures and fits a word more on a few lines; and a keyed authority whose citation runs over a
# page end is listed at the page where the citation ends, typst and LaTeX at its first word's (S7).
params:
  cross_engine: gate
  cross_engine_docx: report
