# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.82), so the latex and docx renders
# break every line and page where the typst render does, and a difference fails. The court's own parameters (13 pt,
# rule 8.74(b)(1)) are in ../eval.yaml.
params:
  cross_engine: gate
  # DEF-FORM-002: LibreOffice embeds TeX Gyre Schola with word boxes from the font's ascent, so the cover's first line,
  # whose 15.6 pt line box starts at the 1 in margin (baseline at 84.48 pt), measures its box 3.31 pt into the margin
  # on docx (box top 68.69 pt; typst 74.9 pt), as in the Georgia Supreme Court's Schola folders. The vertical
  # tolerance covers that box, not text: Gate 4 puts the engines on the same baselines.
  eps_v_pt: 3.5
