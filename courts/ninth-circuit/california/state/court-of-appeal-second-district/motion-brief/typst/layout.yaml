# California Court of Appeal, Second Appellate District (calctapp2d): a motion and its memorandum (rules 8.54, 8.204(b) by
# 8.54(a)(1)'s reference to the brief format). The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace
# to CRC 8.204 and 8.74 (../../rules.md, CALCTAPP2D-*); lengths in points. No case text here: every string printed
# comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # CALCTAPP2D-FORM-003: not smaller than 13 point, footnotes included (8.204(b)(4))
pitch:
  body: 23.4              # CALCTAPP2D-FORM-005: at least one-and-a-half spaced (1.5 x Schola's single line)
  single: 15.6            # headings, cover, quotations, footnotes, signature: single (1.2 x 13 pt)
# CALCTAPP2D-FORM-006: 1 1/2 in left and right, at least 1 in top and bottom; the top 1.1 in keeps a footnote mark
# superscript on a page's first line inside the margin (DEF-FORM-002).
margin: {top: 79.2, bottom: 72, left: 108, right: 108}
indent: 36
# CALCTAPP2D-FORM-007: Arabic numbers from the cover as page 1, the cover's number suppressed (8.74(a)(2)).
page_number: {align: center, from: 2}
footnote: {size: 13, gap: 6.5}                          # CALCTAPP2D-FORM-003, -005: 13 point, single spaced
quote: {left: 36, right: 36, above: 13, below: 13, gap: 11.7}   # CALCTAPP2D-FORM-005: block-indented, single spaced
# CALCTAPP2D-FORM-004: headings may be uppercase. Sections (level 1) centered bold capitals; points numbered I. / A. /
# 1. / a. by the template, the label in a half-inch box, the title's later lines hung under the title.
heading:
  - {align: center, bold: true, upper: true, above: 15.6, below: 13}
  - {bold: true, number: "I.", label_box: 36, above: 13, below: 10.4}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 13, below: 10.4}
  - {bold: true, italic: true, number: "1.", label_box: 36, left: 72, above: 13, below: 10.4}
  - {bold: true, italic: true, number: "a.", label_box: 36, left: 108, above: 13, below: 10.4}
keep_with_closing: true
# CALCTAPP2D-COVER-001, -002 (8.204(b)(10), 8.40(b)): the court, the caption beside the Court of Appeal number, the
# trial court, its number (and judge), the title, then counsel and the party represented, indented 2.25 in (as the filed
# motion sets its longer counsel block). The space between the parts shares out what the page leaves (one page,
# CALCTAPP2D-FORM-007). Its lines at 13.8 pt, the old template's single spacing (1.06 x 13 pt, Schola's ascender to
# descender): at the brief's 15.6 the long title and counsel block of a motion leave the page no space between parts.
cover:
  - {text: "{court_lines}", pitch: 13.8, align: center, bold: true}
  - {fill: 1}
  - columns:
      - width: 252
        blocks:
          - each: caption
            between:
              - {text: "v.", pitch: 13.8, left: 113.4, above: 5.2, below: 5.2}
            blocks:
              - {text: "{names}", pitch: 13.8, below: 4.55}
              - {text: "{designation}", pitch: 13.8, left: 113.4}
      - valign: top
        blocks:
          - {text: "Court of Appeal Case No. {case_number}", pitch: 13.8}
    gutter: 18
  - {fill: 1}
  - {text: "{trial_court}", pitch: 13.8, align: center}
  - {text: "Case No. {superior_case_number}", pitch: 13.8, align: center}
  - {text: "{judge}", pitch: 13.8, align: center, optional: true}
  - {fill: 1}
  - {text: "{brief_title}", pitch: 13.8, align: center, bold: true, upper: true}
  - {fill: 1}
  - each: counsel
    blocks:
      - {text: "{names}", pitch: 13.8, left: 162, above: 6.5}
      - {text: "{lines}", pitch: 13.8, left: 162, optional: true}
  - {text: "{counsel_for}", pitch: 13.8, italic: true, left: 162, above: 6.5}
# The date beside the signature block (the office, s/ signer, signer, role), never split.
closing:
  - columns:
      - blocks:
          - {text: "Dated: {date}"}
      - width: 216
        blocks:
          - {text: "{signature.firm}"}
          - {text: "s/{signature.signer}", above: 18.2}
          - {text: "{signature.signer}"}
          - {text: "{signature.role}", italic: true}
    above: 18.2
