# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.12), so the latex and docx renders
# break every line and page where the typst render does, and a difference fails. LaTeX is gated. Docx is reported
# (docs/open-items/fb-595.54.66.md, as fb-595.54.48's S6): the generated docx/reference.xml does not turn ligatures
# off, so LibreOffice sets Schola's fi/ff ligatures and fits a word more on a few lines.
params:
  cross_engine: gate
  cross_engine_docx: report
