# California Court of Appeal, Third Appellate District (calctapp3d): motion with its memorandum of points and
# authorities (CRC 8.54(a)), in the electronic form of CRC 8.74. The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace
# to CRC 8.74(a)-(b) and 8.204(b) (../rules.md, CALCTAPP3D-*, verified 2026-10-22); lengths in points, each a whole
# number of twips. CRC 8.54 sets no page or word limit for a motion. No case text here: every string printed comes
# from the sample's frontmatter ({field}).
size: 13                  # CALCTAPP3D-FORM-003: 13 point or larger, footnotes included (8.74(b)(1))
pitch:
  body: 23.4              # CALCTAPP3D-FORM-005: at least one-and-a-half spaced (8.74(b)(2)): 1.5 x 15.6 pt
  single: 15.6            # headings, caption, quotations, footnotes, signature: single spaced (8.74(b)(2)), 1.2 x 13 pt, Schola's line
margin: {top: 72, bottom: 72, left: 108, right: 108}   # CALCTAPP3D-FORM-006: 1-1/2 in left and right, 1 in top and bottom (8.74(b)(3))
indent: 36                # first lines indented 1/2 in; CALCTAPP3D-FORM-008: left aligned, not justified (8.74(b)(4))
# CALCTAPP3D-FORM-007, EFILE-003: pages numbered consecutively in Arabic numerals, the cover being page 1 (8.74(a)(2)).
page_number: {align: center, from: 1}
footnote: {size: 13, gap: 6.5}   # CALCTAPP3D-FORM-003, -005: footnotes 13 point too, single spaced
quote: {left: 36, right: 36, above: 10.4, below: 15.6}   # CALCTAPP3D-FORM-005: quotations block indented, single spaced
# CALCTAPP3D-FORM-004, -005: headings may be uppercase and single spaced; kept with their text (EFILE-002: each is
# bookmarked). Level 1 centered bold capitals, 2 bold, 3 bold italic, their later lines hung half an inch.
heading:
  - {align: center, bold: true, upper: true, above: 18.2, below: 13}
  - {bold: true, hang: 36, above: 15.6, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
# CALCTAPP3D-COVER-001 (8.74(c)(1), 8.204(b)(10)): the court and district, the Court of Appeal number, the caption (each
# party's role set to the right), the trial court, its number and judge, the title halfway down the rest of the page;
# CALCTAPP3D-COVER-002 (8.40(b), 8.74(a)(9)): counsel (name, State Bar number, address, telephone, e-mail, party
# represented) at its foot. CALCTAPP3D-COVER-003: no colour.
cover:
  - {text: "{court}", align: center, bold: true, upper: true}
  - {text: "{district}", align: center, bold: true, upper: true, optional: true}
  - {text: "Case No. {case_number}", align: center, bold: true, above: 10.4}
  - each: parties
    above: 15.6
    blocks:
      - {text: "{name}", align: center, above: 6.5}
      - {text: "{role}", align: center, italic: true, left: 108, optional: true}
  - {text: "{lower_court_case}", align: center, optional: true, above: 14.3}
  - {fill: 1}
  - {text: "{title}", align: center, bold: true, upper: true, left: 29.7, right: 29.7}
  - {fill: 1}
  - each: counsel
    blocks:
      - {text: "{names}", bold: true, left: 180, above: 10.4}
      - {text: "{lines}", left: 180}
# The signature block (8.74 applies; no rule sets its form): the date, then at the right the firm, a blank line and
# the "s/" signature underlined, the typed name and the party; never split. Then the proof of service CRC 8.25(a)(2)
# requires, on its own page, from the frontmatter; its title a bookmarked heading (CALCTAPP3D-EFILE-002).
closing:
  - group:
      - {text: "Respectfully submitted this {signature.date}.", optional: true, pitch: body, indent: 36}
      - {text: "{signature.lines}", left: 234, above: 7.8}
      - {text: "{signature.signer_line}", underline: true, left: 234, above: 15.6}
      - {text: "{signature.name}", optional: true, left: 234}
      - {text: "{signature.signer}", left: 234}
    above: 15.6
  - {break: true}
  - {text: "{service.heading}", heading: 1}
  - {text: "{service.paragraphs}", pitch: body, indent: 36}
  - each: service.recipients
    blocks:
      - {text: "{.}", left: 72, above: 13, below: 13}
  - {text: "{service.closing}", optional: true, pitch: body, indent: 36}
  - {text: "{service.declarant.signer_line}", underline: true, left: 234, above: 7.8}
  - {text: "{service.declarant.signer}", left: 234}
