# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the folder is on the shared document model
# (typst/layout.yaml; latex/ and docx/ generated by `fb engines gen`, fb-595.54.82), so the latex and docx renders
# break every line and page where the typst render does, and a difference fails. The court's own parameters (13 pt,
# CRC 8.74(b)(1)) are in ../eval.yaml.
# Reported, not gated (pages and page ends equal in both engines; XENG-001 and -002 pass), two gaps of the shared model:
# - docx and latex: footnote 1 (page 6, line 23) writes a URL in literal angle brackets ("(2020) \<https://...\>"); typst
#   breaks between the "<" and the URL (the model boxes the URL's pieces, which opens a break before the first one),
#   LaTeX and Word keep "<https:" together and set the "<" on the next line. Two lines move (p6 lines 23-24).
# - latex only: TeX Gyre Schola's boxed glyphs (lib/latex/xeschola.lua, "/" scaled and "*") set the words where typst
#   does, but pdftotext reads "<https://oag..." as two words after the "//" (p6 lines 25, 30; p7 line 26) and the
#   "* * * *" separator as one word (p10 line 3).
# DEF-FORM-002 (docx): LibreOffice embeds TeX Gyre Schola with word boxes from the font's ascent, so the cover's first
# line, whose 15.6 pt line box starts at the 1 in margin, measures its box 3.31 pt into the margin (box top 68.69 pt;
# typst 74.9 pt), as in ../../courts-of-appeal/motion-brief. The vertical tolerance covers that box, not text.
params:
  cross_engine: gate
  cross_engine_latex: report
  cross_engine_docx: report
  eps_v_pt: 3.5
