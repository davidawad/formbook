- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/ASK-Civil-Standing-8.20.26.pdf
  text: 'Absent leave of Court, parties should not file formal noticed motions under Civil L.R. 7-2 regarding discovery-related disputes. Instead, for all discovery disputes, the parties must meet and confer to attempt to resolve their dispute. The meet and confer must be in person or by videoconference or telephone. A mere exchange of letters, emails, or messages does not satisfy the requirement to meet and confer. If the parties are unable to reach a resolution, they must file a joint statement of at most 5 single-spaced pages (12-point font or greater) with 2.5 pages allotted per side that: (1) describes each unresolved issue; and (2) states each party''s final proposed compromise with respect to each unresolved issue.'
- topic: Remote appearances
  field: remote_appearances
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/ASK-Civil-Standing-8.20.26.pdf
  text: Unless the Court orders otherwise, all law and motion hearings, except for discovery disputes, will be conducted in person. If a party wishes to request that a law and motion hearing be conducted via Zoom webinar, the request must be made at least three business days before the scheduled hearing. Such requests will be granted only upon a showing of good cause.
