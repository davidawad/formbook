- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/WHO-Standing-Order-Civil-May-2023.pdf
  text: In the event of a discovery dispute, lead trial counsel for the parties shall meet and confer in person or by videoconference to attempt to resolve their dispute informally. A mere exchange of letters, e-mails, telephone calls, or facsimile transmissions does not satisfy the requirement to meet and confer. If, after a good faith effort, the parties have not resolved their dispute, they shall prepare a concise joint statement of five pages or less, stating the nature and status of all pending disputes and certifying that they have met the meet-and-confer requirement. Absent an order of this Court, parties shall not file affidavits or exhibits other than copies of the written requests for discovery and the answers or objections thereto. If a joint statement is not possible, each side may submit a brief individual statement of two pages or less. In addition to the certification of compliance with the meet-and-confer requirement, the individual statement shall include an explanation of why a joint statement was not possible. The joint statement or individual statements shall be e-filed in the Civil Events category of Motions and Related Filings > Motions-General > Discovery Letter Brief. The Court will advise the parties of the need, if any, for more formal briefing or a hearing, pursuant to Civil Local Rule 7-1(b). The Court may also elect to refer the matter to a magistrate judge or special master. If a magistrate judge is assigned to a case for discovery, that judge shall handle any future discovery disputes in that case and the parties shall comply with the procedures set by that judge for discovery.
