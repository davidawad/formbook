  field: ex_parte_notice
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/PCP-CivilStandingOrder10-26-2025.pdf
  text: When seeking emergency relief (e.g., a temporary restraining order or any stipulation that needs action within 24 hours), notify Judge Pitts's CRD by phone and email. Make every reasonable effort to notify the opposing party (and counsel) as early as possible before seeking emergency relief.
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/PCP-Standing-Order-Regarding-Discovery-Disputes-2024-08-23.pdf
  text: In the rare cases where Judge Pitts is overseeing discovery, the following procedures apply. Discovery disputes should be brought to the Court's attention as early as possible. If the parties cannot resolve their discovery dispute after a good faith effort, they shall prepare and file a joint letter of no longer than 5 pages stating the nature and status of their dispute. Both sides must submit proposed orders as well. No exhibits may be submitted with the letter other than any discovery request or response that is the subject of the letter. The letter must be filed as soon as possible, but under no circumstances may it be filed more than 7 days after the applicable discovery cutoff, per Civil Local Rule 37-3. The side seeking relief from the Court should prepare its portion of the letter first, and then provide that portion to the opposing side so that the opposing side may prepare its response. The party seeking relief from the Court should file the letter. The Court may resolve the dispute on the papers or schedule a hearing. The joint discovery letter process does not apply to discovery disputes with third parties.
