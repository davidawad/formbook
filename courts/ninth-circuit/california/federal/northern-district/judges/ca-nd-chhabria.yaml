  text: Proposed orders are not necessary for most substantive motions, such as motions for summary judgment, motions to dismiss, or preliminary injunction motions. The parties should submit proposed orders only in connection with administrative motions, stipulations requiring modifications of the case schedule, ex parte applications, discovery disputes, and rulings that call upon the court to make factual findings (such as a motion to approve a class settlement or a motion for attorneys' fees). All proposed orders should be sent in Microsoft Word format to vcpo@cand.uscourts.gov.
