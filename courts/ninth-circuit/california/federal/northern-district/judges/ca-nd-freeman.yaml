checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/BLF-Standing-Order-Re-Civil-Cases-Rev-Oct-7-2024-1.pdf
  text: Civil motions are heard by reservation only on Thursdays at 9:00 a.m. Hearing dates may be reserved by contacting Judge Freeman's Courtroom Deputy Clerk, Tiffany Salinas-Harwell, at 408-535-5381 or BLFCRD@cand.uscourts.gov. When reserving a hearing date, the attorney or party must inform Ms. Salinas-Harwell of the number and type(s) of motions to be filed. Once a hearing date is reserved, the motion(s) shall be filed within 14 days thereafter. If no motion has been filed by the 15th day, the reservation will expire and the moving party must obtain a new reservation before filing the motion(s).
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/BLF-Standing-Order-Re-Civil-Cases-Rev-Oct-7-2024-1.pdf
  text: All proposed orders in e-filing cases shall be submitted in Word format by email to BLFpo@cand.uscourts.gov on the same day the proposed order is e-filed.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/BLF-Standing-Order-Re-Civil-Cases-Rev-Oct-7-2024-1.pdf
  text: 'Chambers copies shall be delivered to the Court within one business day of filing for the following documents: pleadings; briefing related to substantive motions; and evidence related to substantive motions. No chambers copies of administrative motions or other non-substantive motions (including sealing motions) shall be delivered to the Court... chambers copies must be single-sided (printed on only one side of the page), 2-hole punched at the top, and stapled or fastened with metal prongs. However, chambers copies of exhibits that are more than six inches thick must be placed in binders, and chambers copies submitted in connection with a final Pretrial Conference must be 3-hole punched on the left side. [...] Each chambers copy shall be marked "Chambers Copy" and shall be submitted to the Clerk''s Office in an envelope marked with the case number and with the words "Chambers Copy" and "Judge Beth Labson Freeman.'
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/BLF-Standing-Order-Re-Civil-Cases-Rev-Oct-7-2024-1.pdf
  text: Motions to seal documents shall be filed in accordance with Civil Local Rule 79-5. [...] Chambers copies of sealing motions shall not be sent to the Court. Unredacted chambers copies of the substantive briefs or exhibits that are the subject of the sealing motion shall be delivered to the Court, with redactions highlighted in yellow. No chambers copies of redacted briefs or exhibits shall be delivered to the Court.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/BLF-Standing-Order-Re-Civil-Cases-Rev-Oct-7-2024-1.pdf
  text: Case Management Conferences are heard on Thursdays at 11:00 a.m. via Zoom Webinar.
