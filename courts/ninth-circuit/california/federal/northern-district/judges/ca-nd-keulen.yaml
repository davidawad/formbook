- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/SvK-Civil_and_DiscoveryReferralMatters_StandingOrder-2-2026.pdf
  text: For all discovery disputes, the parties must meet and confer to attempt to resolve the dispute. The meet and confer must be in person or by videoconference and conducted by counsel with authority to negotiate and compromise. A mere exchange of letters, emails, telephone calls, or voicemail messages does not satisfy the requirement to meet and confer. If the parties are unable to reach a resolution, they must file a joint statement not to exceed 10 pages, exclusive of the caption page, double-spaced with 12-point font and in text-searchable PDF format.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/SvK-Civil_and_DiscoveryReferralMatters_StandingOrder-2-2026.pdf
  text: Use of generative AI tools, such as ChatGPT, Claude, Gemini, etc., in preparing submissions to the Court is not prohibited, but counsel and self-represented parties must at all times personally confirm for themselves the accuracy of any content generated by these tools. The signature of counsel or a self-represented party on any submission containing AI-generated content, including citations generated by AI, constitutes a certification that the signing attorney (or self-represented party) has personally verified the content's accuracy. The Court will impute any errors by such AI tools to the attorney or party whose signature appears on the document containing those errors. Failure to verify the accuracy of submissions, particularly the accuracy of citations to law and evidence, may be grounds for sanctions. Counsel is responsible for maintaining records of all prompts or inquiries submitted to any generative AI tools in the event those records become relevant at any point.
