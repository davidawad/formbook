- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/Standing_Order_June-2024_final_version.pdf
  text: In lieu of filing formal discovery motions, the parties involved in the discovery dispute (through lead trial counsel for any party that is represented by counsel) shall meet and confer by video conference regarding the subject matter of the dispute(s) in an effort to resolve these matters. After attempting other means to confer on the issue (i.e. letter, phone call, e-mail) any party may demand such a meeting on five business days' notice. Within five business days of the meet-and-confer session, the parties shall provide a detailed Joint Letter to the Court, not to exceed five pages without leave of Court.
