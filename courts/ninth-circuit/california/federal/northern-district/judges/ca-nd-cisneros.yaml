checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/LJC-CivilStandingOrder_2-17-26.pdf#page=1
  text: Civil motions are heard on Tuesdays at 10:30 a.m., except that when Judge Cisneros is on criminal duty, civil motions are heard on Thursdays at 1:30 p.m. Motion hearings are in person unless otherwise ordered by the Court; any request for a remote hearing must be made by administrative motion or by stipulation and proposed order. Hybrid hearings, with some counsel in person and others appearing remotely, are disfavored. Parties should notice motions pursuant to the local rules. Parties need not reserve a hearing date but should confirm the Court's availability by viewing the calendar and scheduling notes available at https://www.cand.uscourts.gov/lisa-j-cisneros/. Hearing dates may be reset as the Court's calendar requires or matters may be decided without a hearing.
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/LJC-CivilStandingOrder_2-17-26.pdf
  text: Motion hearings are in person unless otherwise ordered by the Court; any request for a remote hearing must be made by administrative motion or by stipulation and proposed order. Hybrid hearings, with some counsel in person and others appearing remotely, are disfavored.
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/LJC-CivilStandingOrder_2-17-26.pdf
  text: Proposed orders in civil cases shall be submitted in Word format (.doc or .docx) via email to ljcpo@cand.uscourts.gov on the day of filing. This email address is to be used only for civil proposed orders unless otherwise directed by the Court.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/LJC-CivilStandingOrder_2-17-26.pdf#page=1
  text: Chambers copies are required only for filings that necessitate action by the Court and exceed 50 pages inclusive of supporting declarations and exhibits. Chambers copies must bear the PACER/ECF header (with case number, docket number, date, and page number) and be clearly marked with the judge's initials (LJC) and the designation "Chambers Copy. Chambers copies must be bound at the top or side; voluminous filings (those over two inches in thickness) should be placed in binders. Chambers copies may be accompanied by a flash drive where appropriate. Chambers copies shall arrive at the Court within 48 hours after e-filing.
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/LJC-CivilStandingOrder_2-17-26.pdf#page=4
  text: 'All discovery disputes before the Court shall proceed as follows: when there is a discovery dispute, the parties must first make a good faith effort to resolve the dispute before seeking Court intervention. After attempting to address the issue(s) via letter, phone call, and/or email, any party or non-party may demand a formal meet and confer within two weeks'' notice. Counsel for each party must meet and confer in person or by videoconference. [...] If disagreements remain, the parties shall file a joint letter no later than five business days after the formal meet and confer, unless otherwise directed by the Court. Lead trial counsel for both parties must sign the letter, which shall include an attestation that the parties met and conferred in person or by video regarding all issues prior to filing the letter.'
