checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/KAW-CivilStandingOrder-12-19-2025_0.pdf
  text: Civil motions are also heard on the first and third Thursdays of the month at 1:30 p.m. Civil case management and status conferences are heard on Tuesdays at 1:30 p.m. Civil pretrial conferences are heard on Wednesdays at 2:00 p.m.
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/KAW-CivilStandingOrder-12-19-2025_0.pdf
  text: The Court does not grant relief over the telephone or via e-mail. All requests for relief must be filed in accordance with the local rules.
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/KAW-CivilStandingOrder-12-19-2025_0.pdf#page=3
  text: Proposed orders filed by an e-filing party shall be submitted in Word format (.doc or .docx) via e-mail to kawpo@cand.uscourts.gov on the same day the document is e-filed. This requirement also applies to stipulations that require court approval, which must include a proposed order on the face of the stipulation. This e-mail address should only be used for this stated purpose unless otherwise directed by the Court. (a) Any party filing a dispositive motion shall also e-mail a copy of the motion in Word format (.doc or .docx) to kawpo@cand.uscourts.gov. This is in addition to the lodged, chambers copy.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/KAW-CivilStandingOrder-12-19-2025_0.pdf#page=2
  text: 'Chambers hard copies are required for all formal motions, joint discovery letters, and motions to seal. The Court may request chambers copies of other filings as needed. (a) Chambers copies must be received within 3 days of filing or the Court''s request. (b) All chambers copies of e-filed documents shall bear the ECF filing "stamp" (case number, docket number, date, and ECF page number) along the top of each page. (c) Chambers copies shall be marked "Chambers Copy" and submitted to the Oakland Clerk''s Office in an envelope clearly marked "Magistrate Judge Kandis Westmore" with the case number on the envelope. (d) All exhibits must be clearly marked and individually tabbed. (e) E-filed documents must be cited in all other documents as follows: Dkt. No.__ at ___. (f) For filings that are no more than 100 pages, chambers copies must be stapled or attached by brads; binder clips, paperclips, rubber bands, or similar fastenings are not adequate. If the filing is more than 100 pages, the chambers copies must be three-hole punched along the left side of the page. (g) For motions to seal, the parties need only provide a courtesy copy of the unredacted version of the document sought to be filed under seal. The unredacted version must indicate, by highlighting or other clear method, the portions of the document that have been omitted from the redacted version, and prominently display the notation "UNREDACTED VERSION OF DOCUMENT(S) SOUGHT TO BE SEALED. The unredacted copy must be presented in the same form as if no sealing order was being sought. In other words, if a party is seeking to file under seal one or more exhibits to a declaration, or portions thereof, the chambers copy should include the declaration with both exhibits that require no redaction and the exhibits that require redaction. (h) For any briefings that rely on more than ten exhibits or 100 pages of exhibits, the party shall e-mail an electronic copy to kawpo@cand.uscourts.gov. The supporting document (e.g., a declaration or request for judicial notice) and exhibits thereto shall be in a single PDF, which shall be legible and word-searchable and have each exhibit bookmarked so that a user can easily navigate through each exhibit. Each PDF should only include one supporting document and its attached exhibits.'
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/KAW-CivilStandingOrder-12-19-2025_0.pdf#page=4
  text: 'Parties shall serve disclosures and propound discovery in accordance with Federal Rules of Civil Procedure 26 through 37 and the corresponding Civil Local Rules for the Northern District of California. A copy of the Local Rules is available at the Clerk''s Office and at the Court''s website (https://cand.uscourts.gov/). No exceptions to the limitations established in the Federal and Local Rules shall be permitted except pursuant to stipulation of the parties or order of the Court. [...] Meet and confer requirement for discovery disputes. As an initial matter, the parties must comply with Section 9 of the Northern District''s Guidelines for Professional Conduct regarding discovery (available at https://cand.uscourts.gov/attorneys/admission-bar-membership). (a) Prior to filing any discovery-related motion, lead trial counsel for all parties shall meet and confer in person or by video conference, if an in-person conference is not feasible, regarding the discovery dispute(s) to resolve these matter(s). (Meet and confers may only occur by telephone if it is impossible to meet in person or by video.) After attempting other means to confer on the issue(s) (i.e., letter, phone call, e-mail), any party may demand such a meeting on ten (10) business days'' notice. If meeting in person, the location of the meeting will alternate with the first location selected by counsel for Plaintiff, the second by counsel for Defendant, etc. (b) A meaningful meet and confer may take multiple sessions. Once it is clear that the parties are unable to resolve all disputes through this procedure, the party seeking Court intervention may file an appropriate motion or joint letter (see ¶ 14 below). If the Court finds that the meet and confer is not adequate, the joint letter will be terminated. Discovery disputes between the parties must be addressed in a joint letter. (a) After meeting and conferring as set forth in ¶ 13 above, the parties shall draft and file a jointly signed letter within five (5) business days of the lead trial counsels'' meet and confer session that contains the following: i. A cover page with the case caption and an attestation that the parties met and conferred in person or by video conference (or, if telephonically, with an additional explanation for why it was not feasible to meet in person or by video) prior to filing the letter, have complied with Section 9 of the Northern District''s Guidelines for Professional Conduct regarding discovery prior to filing the joint letter, as well as the signature of both parties or counsel; ii. A section which sets forth the unresolved dispute and any pertinent factual background; and iii. With respect to each issue relating to the unresolved dispute, a detailed summary of each party''s final substantive position and their final proposed compromise on each issue, including relevant legal authority.'
  unverified_sentences: 1
