  url: https://cand.uscourts.gov/sites/default/files/standing-orders/MMC_Standing_Orders_1-4-2022.pdf
  text: Parties seeking to continue hearings, request special status conferences, modify briefing schedules, or make other procedural changes shall submit a signed stipulation and proposed order, or, if stipulation is not possible, a motion or administrative request in accordance with Civil Local Rule 6-3 or 7-11, as appropriate, and as incorporated by Criminal Local Rule 2-1. Irrespective of whether the parties are in agreement, no changes in the Court's schedule or procedures shall be made except by order of the Court and only upon a showing of good cause.
