checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/JST-CivilStandingOrder-06.03.26.pdf
  text: Judge Tigar hears civil motions on Thursdays at 2:00 p.m. Motions must be noticed for a hearing in accordance with Civil Local Rule 7-2(a). Parties must consult Judge Tigar's weekly calendar, available at https://www.cand.uscourts.gov/jst, to determine which dates are available. They need not reserve a hearing date in advance.
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/JST-CivilStandingOrder-06.03.26.pdf
  text: The Court may find a matter suitable for disposition without oral argument and vacate the hearing on the matter.
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/local-rules/CAND_Civil_Local_Rules_05-26.pdf#page=24
  text: Proposed orders submitted by an ECF user in an ECF case shall be filed in PDF format, and attached to the applicable motion or other document. In addition, proposed orders shall be submitted in a standard word processing format (such as Microsoft Word) to the specific address on the Court's website for emailing proposed orders to the assigned Judge. Proposed orders must conform to the requirements of the assigned Judge's standing orders.
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/JST-CivilStandingOrder-06.03.26.pdf
  text: Depositions of fact witnesses must be noticed at least 30 days before the close of fact discovery. Speaking objections are prohibited.
