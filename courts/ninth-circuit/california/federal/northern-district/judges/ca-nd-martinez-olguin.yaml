  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AMO-CivilStandingOrder-8-26-2026.pdf
  text: Civil motions are heard in person at the United States Courthouse, 1301 Clay Street, Oakland, California on Thursdays at 2:00 p.m. Absent exceptional circumstances, motions noticed for hearing with less than four weeks between the close of briefing and the hearing may be automatically re-noticed by the Court.
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AMO-CivilStandingOrder-8-26-2026.pdf
  text: The Court may notify the parties in advance of a setting that will be conducted via Zoom rather than in person, but the default rule is that all settings are held in person. During motion hearings, the parties should expect to first answer the Court's questions. Thereafter, unless a case is particularly complex, each side is typically allotted five (5) minutes of additional oral argument.
