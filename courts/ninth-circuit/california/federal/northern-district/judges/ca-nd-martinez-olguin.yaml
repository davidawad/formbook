  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AMO-CivilStandingOrder-8-26-2026.pdf
  text: Parties must email a Word version of any proposed scheduling order to amopo@cand.uscourts.gov.
