  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AMO-CivilStandingOrder-8-26-2026.pdf
  text: Except for filings of less than 8 pages, chambers copies of any filing must be provided within two (2) days of filing. Chambers copies should be double-sided (when possible) and three-hole punched along the left side of the page, and should bear the ECF filing "stamp" (case number, docket number, date, and ECF page number) along the top of the page.
