checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/RFL-CivilStandingOrder-9-2-2026.pdf
  text: Counsel should not call to reserve hearing dates but should instead check Judge Lin's calendar and Scheduling Notes on the Court's website to make sure the desired date is not blocked and notice motions for any available date on the civil law and motions calendar. By default, motions to dismiss and remand will be submitted on the papers, and no hearing will be held. If a hearing is set by the parties, it will automatically be vacated.
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/RFL-CivilStandingOrder-9-2-2026.pdf
  text: The Court does not generally issue tentative rulings. If the Court determines a hearing is not necessary, it will usually be vacated no later than two court days before the hearing. Often, a notice of questions will issue two to three court days before the hearing, to alert the parties of the Court's principal questions. Parties may stipulate/request to have a hearing by Zoom video, but they must do so at least one week in advance of the hearing. The Court is disinclined to hold hearings via Zoom for complex or dispositive motions, or if counsel for all parties are based locally.
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/RFL-CivilStandingOrder-9-2-2026.pdf
  text: Proposed orders are not necessary for most substantive motions, such as motions for summary judgment, motions to dismiss, or preliminary injunction motions. [...] All proposed orders should be sent in Microsoft Word compatible format to rflpo@cand.uscourts.gov.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/RFL-CivilStandingOrder-9-2-2026.pdf
  text: 'Paper courtesy copies shall not be submitted unless the Court requests them. When a document filed on ECF is accompanied by more than 10 attachments, the filing party must also send the documents electronically to Judge Lin''s chambers'' Box.com storage. Immediately after the ECF filing is complete, please use this form to upload the documents: https://cand.app.box.com/f/12aea34b708b4e63a1ceada8a6731839. You should follow the instructions carefully, including by completing all fields exactly as on the docket, and uploading sealed documents in a separate submission using the same process.'
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/RFL-CivilStandingOrder-9-2-2026.pdf#page=4
  text: 'In the vast majority of cases, a magistrate judge will be assigned to preside over all discovery disputes. Once a magistrate judge is assigned, the parties should familiarize themselves with that magistrate judge''s standing orders. Judge Lin sets discovery cut-off dates that are different than the default set by Civil Local Rule 37-3. The discovery cut-off set by Judge Lin is the date by which all discovery must be completed. This means that all hearings on discovery motions must occur, all orders resolving those motions must be issued, and all productions must be made by the cut-off date. Accordingly, all discovery requests shall be served and all discovery motions filed sufficiently in advance of the discovery cut-off date to allow enough time for discovery disputes to be presented to, heard by, and resolved by the Court. Any magistrate judge presiding over discovery is authorized to terminate as untimely discovery disputes that are presented to the Court too close to the cut-off date to allow sufficient time for a hearing and resolution before the cut-off date. The initial case schedule will include a date, about 60 days before the cut-off date, by which the parties must submit a joint case management statement in which they shall expressly discuss any anticipated discovery disputes. In the event that discovery is not referred to a magistrate judge, the following procedures pertain to discovery disputes before Judge Lin: If the parties cannot resolve their discovery dispute after a good faith effort in which a live conversation has occurred between counsel, they shall prepare and file a joint letter of no longer than 5 pages stating the nature and status of their dispute. Both sides must submit proposed orders as well. No exhibits may be submitted with the letter other than an excerpt of the specific discovery request or response that is the subject of the letter. The letter must be filed as soon as possible. The side seeking relief from the Court should prepare its portion of the letter first and then provide that to the opposing side so that the opposing side may prepare its response. The party seeking relief from the Court should file the letter. The Court may resolve the dispute on the papers or schedule a hearing. The joint discovery letter process does not apply to discovery disputes with third parties.'
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/RFL-CivilStandingOrder-9-2-2026.pdf
  text: Counsel is responsible for providing the Court with complete and accurate representations of the record, procedural history, and cited legal authorities. Use of generative artificial intelligence tools is not prohibited, but counsel must personally confirm for themselves the accuracy of any research conducted by these means, and counsel alone bears ethical responsibility for all statements made in filings. These obligations also apply to self-represented litigants.
