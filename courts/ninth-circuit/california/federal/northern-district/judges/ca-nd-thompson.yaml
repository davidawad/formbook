- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/Judge-Thompson_s-Civil-Standing-Order_rev_08272026.pdf
  text: Proposed orders shall be submitted in Word format by email to the Courtroom Deputy at TLTPO@cand.uscourts.gov on the same day the proposed order is e-filed.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/Judge-Thompson_s-Civil-Standing-Order_rev_08272026.pdf
  text: Paper courtesy copies of motion filings, including supporting documents, shall be submitted to the Court. This courtesy does not apply to pleadings or administrative motions. Visual or audio exhibits shall be submitted to the Court as digital courtesy copies on portable media (e.g., a flash drive) and online location designation by the Clerk's Office.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/Judge-Thompson_s-Civil-Standing-Order_rev_08272026.pdf
  text: Counsel shall not attempt to contact Judge Thompson or her chambers staff by telephone, email, or any other ex parte means, but may contact her Courtroom Deputy, Robert McNamee, at (415) 522-2039 or TLTCRD@cand.uscourts.gov regarding scheduling or other appropriate matters.
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/Judge-Thompson_s-Civil-Standing-Order_rev_08272026.pdf
  text: Discovery disputes should be brought to the Court's attention as early as possible. If the parties cannot resolve their discovery dispute after a good faith effort, they shall prepare and file a joint letter of no longer than five pages stating the nature and status of their dispute. As soon as a discovery-related matter arises, the Court may refer the case to a Magistrate Judge to handle all discovery disputes. After a Magistrate Judge has been assigned to a case for discovery, the parties in that case must handle any discovery matters according to the procedures set by that Judge.
- topic: Remote appearances
  field: remote_appearances
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/Judge-Thompson_s-Civil-Standing-Order_rev_08272026.pdf
  text: Prior to the case management conference, the Courtroom Deputy will publish a notice on the case docket explaining how the conference will be conducted and provide access information for counsel.
