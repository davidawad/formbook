checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/JudgeIllston_Standing-Order-9-23-2025.pdf#page=1
  text: Civil Law and Motion Calendar is conducted on Fridays at 10:00 a.m. Criminal Law and Motion Calendar is conducted on Fridays at 11:00 a.m. Civil Case Management Conferences are generally conducted on Fridays at 2:30 p.m., with the order of call determined by the Court. Initial and further CMCs will take place over Zoom. A clerk's notice will be issued with the login and registration information within a week of the CMC. Parties shall consult the Court calendar several days prior to the CMC, as the Court may move the CMC calendar to earlier in the day on Friday if scheduling allows. Pretrial Conferences are generally conducted on Tuesday afternoons at 3:30 p.m. [...] Motions may be reset as the Court's calendar requires. All parties are directed to comply with the Civil Local Rules except as identified in this Order. [...] Before setting a hearing, parties MUST check the Court's scheduling notes where dates closed for further settings are listed. (https://apps.cand.uscourts.gov/CEO/cfd.aspx?7133#Notes)
  unverified_sentences: 2
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/JudgeIllston_Standing-Order-9-23-2025.pdf
  text: 'Paper Courtesy Copies: This requirement does not apply to self-represented litigants. If you are representing yourself, you do not need to mail paper courtesy copies to the Court. Notwithstanding Civil Local Rule 5-1(d)(7), one set of paper courtesy copies ("chambers copies") is required for any filing exceeding ten pages in length. [...] For pretrial conference filings, two sets of paper courtesy copies are required, regardless of page length. Courtesy copies must be unstapled and three-hole punched at the left margin (not in binders). All courtesy copies must bear the ECF stamp (case number, document number, date and page number) on the top of each page. Courtesy copies shall be delivered to the Clerk''s Office no later than noon 2 days after filing of the document.'
  unverified_sentences: 1
