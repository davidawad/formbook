- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/NW-CivilStandingOrder_06-09-26.pdf
  text: 'All civil motions must be noticed for a hearing in accordance with Civil Local Rule 7-2(a) except: (1) motions for leave to appear pro hac vice; (2) motions to enlarge or shorten time pursuant to Civil Local Rule 6-1; and (3) motions for administrative relief pursuant to Civil Local Rule 7-11. The Court does not hold hearings for these administrative motions.'
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/NW-CivilStandingOrder_06-09-26.pdf#page=12
  text: Electronic copies of proposed orders must be sent in Word format to nwpo@cand.uscourts.gov on the day of filing.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/NW-CivilStandingOrder_06-09-26.pdf
  text: The parties are required to submit two courtesy copies of (1) electronic media that is manually filed, (2) pretrial filings, including papers associated with motions in limine, (3) all briefs that exceed 10 pages; and, (4) all supporting materials for dispositive motions, Daubert motions, motions for class certification or approval of a class settlement, and motions to seal. The Court may request courtesy copies of other documents but discourages their unsolicited submission. Courtesy copies must be lodged with the Clerk's office in San Jose and must be double-sided and three-hole-punched at the left margin. Courtesy copies of e-filed documents must bear the ECF stamp (case number, document number, date, and page number) on the top of each page. Side tabs, rather than bottom tabs, must be used to separate exhibits.
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/NW-CivilStandingOrder_06-09-26.pdf
  text: Discovery in all cases will be referred to a magistrate judge. The parties must follow the magistrate judge's procedures. Case scheduling orders will not be shifted to accommodate pending discovery motions. Parties are advised to file discovery motions in a timely manner.
