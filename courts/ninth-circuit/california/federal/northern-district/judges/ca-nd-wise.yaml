  text: Judge Wise hears civil motions by reservation only on Wednesdays at 9:00 a.m., in Courtroom 3, 5th Floor, United States District Court, 280 South First Street, San Jose, California. Parties shall jointly contact Judge Wise's Courtroom Deputy, Allie Warren, at (408) 535-5332 or nwcrd@cand.uscourts.gov to reserve a hearing date.
