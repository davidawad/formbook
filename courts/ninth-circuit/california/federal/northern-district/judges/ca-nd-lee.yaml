checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/EKL-CivilStandingOrder-8-28-2025.pdf#page=2
  text: Civil motions are heard by reservation only. After reviewing the website, parties and counsel shall meet and confer to identify proposed hearing dates that are amenable to all relevant parties and counsel. Parties shall jointly contact Judge Lee's Courtroom Deputy via email at eklcrd@cand.uscourts.gov to reserve a hearing date. When reserving a hearing date, parties must indicate the number and type(s) of motions to be filed. Once a hearing date is reserved, the motion(s) shall be filed within fourteen (14) days thereafter. Failure to timely file any motion will result in the expiration of the hearing reservation without further notice to the parties, and the moving party must obtain a new reservation before filing the motion(s).
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/EKL-CivilStandingOrder-8-28-2025.pdf#page=9
  text: Hearings on civil motions will be held in-person. The Court will consider requests to appear via Zoom on a case-by-case basis. Joint requests are strongly preferred, and parties are required to meet and confer regarding such requests. The Court may provide tentative rulings in advance of a motion hearing. If the Court determines that a hearing is not necessary, the hearing will usually be vacated no later than two (2) court days before the scheduled hearing date.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/EKL-CivilStandingOrder-8-28-2025.pdf#page=8
  text: 'Each motion shall be accompanied by a proposed order pursuant to Civil Local Rule 7-2(c). Each proposed order shall comply with any applicable Civil Local Rule. All proposed orders should be filed in PDF form on ECF. In addition, the moving party should submit a Microsoft Word chambers copy only if the proposed order relates to: (1) a sealing motion; (2) a claim construction proceeding in a patent case; or (3) a motion for a temporary restraining order or preliminary injunction. The Word version chambers copy should be sent to eklpo@cand.uscourts.gov. The Court''s signature block should not appear on a standalone page. The subject line of the email should include the case number and name, along with the title of the order.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/EKL-CivilStandingOrder-8-28-2025.pdf#page=6
  text: The parties are required to submit one (1) chambers copy of all filings except for administrative motions. Chambers copies for sealing motions are addressed below in Section VII.D. [...] All exhibits shall be clearly delineated with labels along the right side. If the filing includes exhibits over two-inches thick, the parties shall place the copies in a binder. Binders should not exceed three inches. [...] Chambers copies shall be mailed for receipt or delivered to the Clerk's Office within two (2) court days after the materials are filed.
  unverified_sentences: 2
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/EKL-CivilStandingOrder-8-28-2025.pdf#page=11
  text: Discovery in almost all cases will be referred to a magistrate judge. The parties must follow the magistrate judge's procedures. Upon the development of an impasse with respect to discovery, the parties must first meet and confer; that is, counsel for each party shall meet and confer in person or via videoconference to attempt to resolve their dispute informally. A mere exchange of letters, emails, or telephone calls does not satisfy the meet and confer requirement.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/EKL-CivilStandingOrder-8-28-2025.pdf#page=10
  text: Counsel is responsible for providing the Court with complete and accurate representations of the record, procedural history, and cited legal authorities. Use of ChatGPT or other such generative artificial intelligence tools is not prohibited, but counsel must personally confirm for themselves the accuracy of any research conducted by these means, and counsel alone bears ethical responsibility for all statements made in filings. Any submission containing AI-generated content must include a certification that lead trial counsel has personally verified the content's accuracy. Failure to include this certification or comply with this verification requirement will be grounds for sanctions. Counsel is responsible for maintaining records of all prompts or inquiries submitted to any generative AI tools in the event those records become relevant at any point.
  unverified_sentences: 1
