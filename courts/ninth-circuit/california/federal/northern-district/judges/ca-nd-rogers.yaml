checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/YGR-Standing-Order-In-Civil-Cases-Updated-6.22.26.pdf
  text: Civil Law and Motion calendar is conducted on Tuesdays at 9:00 a.m. If the Court is in trial, the calendar will be conducted at 2:00 p.m. or at a time otherwise provided by the Court.
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/YGR-Standing-Order-In-Civil-Cases-Updated-6.22.26.pdf
  text: Frequently, the Court will issue a written order and vacate the hearing unless oral argument appears to be necessary. Where argument is allowed, the Court will attempt to advise counsel in advance of the issues to be addressed.
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/local-rules/CAND_Civil_Local_Rules_05-26.pdf#page=24
  text: Proposed orders submitted by an ECF user in an ECF case shall be filed in PDF format, and attached to the applicable motion or other document. In addition, proposed orders shall be submitted in a standard word processing format (such as Microsoft Word) to the specific address on the Court's website for emailing proposed orders to the assigned Judge. Proposed orders must conform to the requirements of the assigned Judge's standing orders.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/YGR-Standing-Order-In-Civil-Cases-Updated-6.22.26.pdf
  text: 'This requirement does not apply to self-represented litigants. Chambers copy of all motions in excess of 15 pages, inclusive of exhibits and attachments, whether electronically filed or manually filed at the Clerk''s Office, shall be submitted to the Clerk''s Office in an envelope clearly marked with the case number and "YGR Chambers Copy" for receipt by no later than 12:00 noon the second business day after the document is filed. Submission by overnight delivery such as Federal Express or UPS is sufficient. All chambers'' copies must be 3-hole punched in the left margin in a manner suitable for placement in a 3-ring binder. They shall not be stapled. Chambers copies must include tabs between exhibits and must fasten or attach pages of individual documents together so as to distinguish between separate documents. Do not use bottom tabs as they do not work well in binders. Chambers copies in summary judgment motions: Chambers copies of all summary judgment motions and oppositions (including the brief, separate statement, declarations, exhibits, and other supporting documents) are required to be provided by the filing party in a 3-ring binder or binders with tabs separating documents. Submitting chambers copies of the reply documents in a binder is optional.'
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/YGR-Standing-Order-In-Civil-Cases-Updated-6.22.26.pdf
  text: 'The provisions of this paragraph apply only to cases in which discovery is supervised by this Court. Except as specifically set forth below, no motions regarding discovery disputes may be filed without prior leave of Court. ... Joint Discovery Letter: All other requests for discovery relief must be summarized by the parties in one joint letter brief no longer than four pages (two pages per side). In the joint letter brief, counsel must attest that, prior to filing the request for relief, counsel met and conferred in person or by videoconference, and then concisely summarize all remaining issues that counsel were unable to resolve. The parties may not file multiple joint letter briefs irrespective of the number of disputes then at-issue. If there are multiple disputes at issue, the parties may provide a list of disputes as part of their joint letter brief. The joint letter brief may cite to limited and specific legal authority only for resolution of dispositive issues.'
- topic: Remote appearances
  field: remote_appearances
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/YGR-Standing-Order-In-Civil-Cases-Updated-6.22.26.pdf
  text: The default rule is that all Case Management Conferences are held via Zoom videoconference and all other proceedings are presumed to be in-person.
