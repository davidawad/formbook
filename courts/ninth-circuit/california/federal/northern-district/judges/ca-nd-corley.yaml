- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/JSC-Standing-Order-Jan-2025-docx.pdf
  text: Upon the development of an impasse with respect to discovery in a pending case assigned to Judge Corley, the parties must first meet and confer; that is, counsel for each party shall meet and confer in person or via videoconference to attempt to resolve their dispute informally. A mere exchange of letters, emails, telephone calls or facsimile transmissions does not satisfy the meet and confer requirement.
