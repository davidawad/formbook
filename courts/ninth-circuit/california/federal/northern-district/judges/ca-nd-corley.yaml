  url: https://cand.uscourts.gov/sites/default/files/standing-orders/JSC-Standing-Order-Jan-2025-docx.pdf
  text: Civil motions are heard in person on Thursdays at 10:00 a.m. in Courtroom 8, 450 Golden Gate Ave., San Francisco, California. The Court may notify the parties in advance of the hearing that it will be heard via Zoom rather than in person, but the default rule is that motions are heard in person. Parties may stipulate/request to have a hearing by Zoom video, but they must do so at least one week in advance of the hearing.
