checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AGT-Civil-Standing-Order_11-15-2024.pdf#page=1
  text: Motions are heard on Fridays at 10:00 a.m. If more than one motion is set for a given Friday, the Court may—but will not always—assign separate times for each motion (e.g., motion one will be heard at 10:00 a.m., motion two will be heard at 10:30 a.m.). These assignments sometimes will not be made until the day before the hearings, so parties should check ECF or the Court's calendar to determine if separate times have been assigned. Unless a motion is specially set, the Court will not schedule a hearing before 10:00 a.m. The parties may not specially set any matter without leave of the Court.
- topic: Oral argument
  field: oral_argument_default
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AGT-Civil-Standing-Order_11-15-2024.pdf
  text: Usually, motion hearings and pretrial conferences will be held in Judge Tse's courtroom, while case management conferences will be held remotely on Zoom. Parties should check ECF or the Court's calendar to confirm the location of any particular hearing.
- topic: Proposed orders
  field: proposed_orders
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AGT-Civil-Standing-Order_11-15-2024.pdf#page=2
  text: Any stipulation or proposed order in a case subject to e-filing should, in addition to being e-filed, be submitted by email to agtpo@cand.uscourts.gov as a Word document on the same day the document is e-filed. This email address should be used only for this stated purpose unless otherwise directed by the Court.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AGT-Civil-Standing-Order_11-15-2024.pdf
  text: Paper courtesy copies should not be submitted unless the Court requests them.
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/AGT-Civil-Standing-Order_11-15-2024.pdf#page=3
  text: 'Discovery disputes referred from a district judge and those that occur in cases assigned to Judge Tse for all purposes, through consent of the parties, shall proceed as follows: Upon the development of an impasse, the parties must first meet and confer. Counsel for each party must meet and confer in person or by videoconference. A mere exchange of letters, e-mails, or telephone calls does not satisfy the meet and confer requirement. If the parties are unable to resolve their dispute informally after a good-faith effort, including meet and confer efforts conducted by lead counsel, the parties shall prepare a joint statement of not more than five pages (12-point or greater font) stating the following: 1. an attestation that counsel for the parties met and conferred in person or by videoconference in good faith to resolve their dispute before filing the joint statement; 2. each party''s position, including pertinent factual background, requested relief, and citations to relevant legal authority; and 3. each party''s final proposed compromise. Relevant declarations and exhibits may be attached to the joint statement. If specific discovery requests, i.e., interrogatories, requests for production of documents, requests for admission, are in dispute, the parties must attach the following to their joint statement: a copy of the disputed requests, a copy of the disputed responses, and a copy of the definitions of any defined terms used in the disputed requests. A joint statement should address only one issue or a few issues that are inextricably related. Multiple joint statements should be filed if there are discrete issues in dispute. Joint statements must be e-filed (unless the case is exempt from e-filing requirements) under the Civil Events category of "Motions and Related Filings > Motions - General > Discovery Letter Brief. Upon review of a joint statement, the Court will advise the parties of how it intends to proceed. The Court may issue a ruling, schedule a hearing, or order more briefing. The Court may also order the parties to come to the courthouse to meet and confer in good faith.'
