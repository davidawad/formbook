- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/LB-StandingOrder-September-2024-1.pdf
  text: If parties have a discovery dispute, then counsel must confer by any means to resolve or narrow their dispute. If that process does not resolve the dispute, then lead trial counsel must confer in person if possible or at least by videoconference. Either party may demand a conference with one week's notice. The parties then may raise their dispute in a five-page letter brief (12-point font or greater, reasonable margins, and page breaks between paragraphs).
