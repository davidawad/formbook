  text: Counsel shall not attempt to make contact by telephone or any other ex parte means with the Court or its chambers staff, but may contact the Courtroom Deputy Clerk at (510) 637-3541 or by email at jswcrd@cand.uscourts.gov with appropriate inquiries.
- topic: Discovery disputes
  field: discovery_referral
  url: https://cand.uscourts.gov/sites/default/files/standing-orders/Judge-Jeffrey-S.-Whites-Civil-Standing-Orders-Civil-Standing-Order-Revised-12-24.pdf#page=3
  text: Discovery and Discovery Motions. Except as specifically set forth below, no motions regarding discovery disputes may be filed without prior leave of Court. After the parties have met and conferred, the parties shall prepare a joint letter brief of not more than eight (8) pages explaining the dispute. Up to twelve (12) pages of attachments may be added. The joint letter must be electronically filed under the Civil Events Category of "Motions and Related Filings > Motions – General > Discovery Letter Brief. Discovery disputes may be referred to a Magistrate Judge. If the Court refers discovery disputes to a Magistrate Judge, the Magistrate Judge to whom the matter is assigned will advise the parties of how that judge intends to proceed. The Magistrate Judge may issue a ruling, order more formal briefing, or set a telephone conference or a hearing. After a Magistrate Judge has been assigned, all further discovery matters shall be filed pursuant to that Judge's procedures. If this Court retains supervision of discovery, the Court will then advise the parties if additional briefing or a telephonic conference will be necessary. If this Court has retained supervision of discovery, and if a dispute arises during a deposition that involves a persistent obstruction of the deposition or a refusal to answer a material question on the basis of any ground other than privilege or the work product doctrine, counsel may arrange a telephonic conference with the Court through contact with Chambers at (510) 637-1820. Any such conference shall be attended by the court reporter recording the deposition.
