# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the docx render breaks every line and page where the
# typst render does (fb-595.68.22, on the shared layout model lib/*/xengine*), so a difference fails.
# Pleading paper (Civil L.R. 3-4(c)(1)-(2)): 28 numbered lines of 24 pt = 672 pt of the 792 pt page, so the top and
# bottom margins are 60 pt each. The Civil Local Rules set no minimum margin; the 72 pt default is not a rule here.
params:
  cross_engine: gate
  margin_top_pt: 60
  margin_bottom_pt: 60
  # pleading paper: the numbered lines a page (Civil L.R. 3-4(c)(1)); the checks read the margin numbers 1..28 as page
  # furniture, not body text
  pleading_lines: 28
  # DEF-COVER-002 against FILED-EXAMPLE-motion-brief.pdf (U.S. Attorney's Office, N.D. Cal.): the exemplar is on a 1 in
  # left margin and sets the caption's title in a right column that runs past its own 1 in right margin (to x 556), so
  # its title takes four lines; on the 1.5 in pleading page (Civil L.R. 3-4(c)(1)) the column is 201.6 pt and the
  # title takes six. The exemplar's page-1 footer line then pairs with our re-wrapped title line, and the caption's
  # bottom rule is counted against that pairing. fb-595.88.
  cover_structure_accepted:
    - finding: 'alignment: "DISMISS FOR FAILURE TO STATE A CLAIM"'
      reason: "the title wraps in the 1.5 in pleading page's narrower right column; the exemplar's title overruns its 1 in right margin"
    - finding: 'rules: between ") Hon. Laurel Beeler" and "DISMISS FOR FAILURE TO STATE A CLAIM"'
      reason: "the exemplar's footer line paired with our re-wrapped title line; the caption's bottom rule is in both"
    - finding: 'rules: below "DISMISS FOR FAILURE TO STATE A CLAIM"'
      reason: "the same pairing: the caption's bottom rule, below our title line and above the exemplar's footer line"
