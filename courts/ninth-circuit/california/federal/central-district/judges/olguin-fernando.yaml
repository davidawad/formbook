checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=3
  text: Time for Filing and Hearing Motions. Motions shall be filed in accordance with Local Rule 7. The court hears motions on Thursdays, beginning at 10:00 a.m. unless otherwise ordered by the court. If a Thursday is a national holiday, motions will be heard on the next Thursday.
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=3
  text: If the motion date selected is not available, counsel should notice the motion for the next available date. Unless otherwise ordered, any motion that is noticed more than 35 days beyond the date the motion is filed may be stricken or advanced to an earlier motion date.
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=6
  text: If the court deems a matter appropriate for decision without oral argument, the court will notify the parties in advance. The court strongly encourages parties to permit less experienced lawyers to actively participate in the proceedings by presenting argument at motion hearings or examining witnesses at trial. Counsel shall provide the CRD with the names of the less experienced attorneys that will be arguing motions or examining witnesses at least ten (10) calendar days before the court proceeding.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=6
  text: Each party filing or opposing a motion or seeking the determination of any matter shall serve and lodge – at the time the moving or opposition papers are filed – a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. In addition, a copy of the proposed order in WordPerfect or Word format shall be e-mailed to chambers at fmo_chambers@cacd.uscourts.gov on the day the document is e-filed.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=8
  text: Mandatory Chambers Copies. A copy of all papers filed with the court shall be delivered to the Clerk's Office on the 4th Floor of the First Street Courthouse, no later than 12:00 noon the following business day. [...] Counsel may be subject to sanctions for failure to deliver a mandatory chambers copy in full compliance with this Order and Local Rules 11-3 and 11-4.1.1.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-fernando-m-olguin
  text: 'Filing Documents Under Seal: In civil cases, counsel shall comply with Local Rule 79-5.2. Also, counsel should review the "Guide to E-filing Sealed Documents 11.25.15," found on the court''s website. In criminal cases, counsel shall follow the instructions set forth in the attachment below (CR Under Seal Procedures). A document presented for filing at the Civil Intake or Criminal Intake Windows will be rejected, and the party submitting the document will be directed to follow 79-5.2, or Judge Olguin''s criminal sealed document procedure attached.'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=9
  text: Following service of the ex parte papers, the moving party shall notify the opposing party that its opposition papers must be filed no later than twenty-four (24) hours (or one court day) following service, except in cases where the opposing party has not previously appeared. Where the opposing party has not previously appeared, the moving party shall, following service of the ex parte papers, notify the opposing party that its opposition papers must be filed no later than forty-eight (48) hours following service. Unless otherwise ordered, reply briefs are not allowed and will be stricken.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=2
  text: Unless otherwise ordered, all discovery matters have been referred to the assigned magistrate judge, who will hear all discovery disputes. The magistrate judge's initials follow the district judge's initials next to the case number.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-fernando-m-olguin
  text: Do not bind or staple separate filings together as one document.
  unverified_sentences: 1
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=5
  text: If any party or attorney uses an artificial intelligence tool in the preparation of any filing, the submission of that document signifies that the individual responsible for the filing has certified that she/he reviewed all source material and verified the accuracy of any AI content.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-fernando-m-olguin
  text: 'Telephonic Appearances: Telephonic appearances for hearings in court are not permitted. In some instances, the court will set telephonic hearings and will do so on its own motion via court order.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bd1c7516-3cae-41b8-a4da-4ddf08b1e138#page=9
  text: Continuances or Extensions of Time. Counsel must submit any request for a continuance or extension of time no later than five (5) court days prior to the expiration of the scheduled date. Requests for continuances will not be granted routinely. A stipulation to continue the date of any matter must be supported by a detailed declaration that demonstrates good cause justifying the requested date change. The stipulation must also indicate whether there have been any previous requests for continuances and whether those requests were granted or denied by the court.
