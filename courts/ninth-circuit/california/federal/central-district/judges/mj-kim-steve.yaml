  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-steve-kim
  text: 'Civil Motions: Hearings are held IN PERSON by default, unless otherwise ordered by the Court. Counsel and parties should not assume a hearing will be held remotely, if not specifically ordered. [...] Counsel should check the Closed Motion Dates before filing a motion; otherwise, it is unnecessary to clear a civil motion hearing date with the Courtroom Deputy Clerk (CRD) before filing a motion. The Court may continue a motion sua sponte or take a motion under submission without oral argument at any time.'
