- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-steve-kim
  text: 'Under Seal Documents: Parties and counsel in civil cases shall follow the procedures outlined in Local Rule 79-5 for filing under seal documents. Parties and counsel may consult the Guide to Electronically Filing Under Seal Documents in Civil Cases, which is available for download below. In criminal cases, all proposed sealed documents shall be submitted via e-mail to the Chambers e-mail address at SK_Chambers@cacd.uscourts.gov (link sends e-mail) (link sends e-mail) and comply with the procedures set forth in the Order regarding the Pilot Project for Electronic Submission and Filing of Under Seal Documents for Criminal Cases, which is also available for download below.'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-steve-kim
  text: 'Ex Parte Applications: Ex parte applications must be filed in accordance with Local Rule 7-19, and they must identify in the caption whether it is "OPPOSED" or "UNOPPOSED. Any opposition must be filed within 24 hours of electronic filing of the application. Ex parte applications will ordinarily be decided on the papers without oral argument. The Court will notify the parties if it desires a hearing, including a remote hearing. If the opposing party is in custody, the requesting party need not provide oral notice before filing but must undertake reasonable efforts to provide notice in writing. Any party relying on this procedure must state in the application that the party is in custody and describe the steps that have been (or will be) taken to provide the person in custody with prompt notice.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-steve-kim
  text: 'Court Appearances: Unless otherwise ordered, counsel of record must appear in person for all court proceedings. Remote appearances (by telephone or video) for civil court proceedings—except for ex parte applications as ordered below—will not be permitted if counsel for both sides are located within Los Angeles County, unless there are extraordinary reasons. Counsel wishing to request a remote appearance in civil cases must do so in writing by no later than 14 calendar days before the noticed hearing date, with the understanding that in certain cases the Court may be limited by any applicable bans or restrictions on live streaming or broadcasting of audio or video to the public. All criminal court proceedings must be conducted in person, except as otherwise authorized by law and ordered by the Court.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-steve-kim
  text: 'Extensions or Continuances: Requests to extend any deadlines or to continue any hearings (either by ex parte application or stipulation) must be filed at least three business days before the scheduled deadline or hearing. The request must detail good cause for the extension or continuance, whether any extensions or continuances were sought before, and whether those were granted or denied. If it is absolutely necessary for a party to file an opposed ex parte application to request an extension of time or continuance of a hearing, the application must forthrightly describe the basis and details of the opposing party''s position.'
