- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: EFFECTIVE JUNE 1, 2026, THE COURT'S LAW AND MOTION DAY WILL BE WEDNESDAY. [...] Criminal motions are heard on Wednesdays at 1:30 p.m. (If Wednesday is a holiday, the next motion date is the following Wednesday.) [...] Closed Motion dates are listed on this page.
  unverified_sentences: 2
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: Motions will be heard two weeks after the deadline for filing the Reply. Therefore, Motion papers must be filed and served not later than 28 days before the hearing date. Opposition papers must be filed and served not later than 21 days before the hearing date. Reply papers must be filed and served not later than 14 days before the hearing date.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: 'ELECTRONIC FILING: Counsel shall e-file all criminal and civil filings pursuant to Fed. R. Civ. P. 5(d)(3) and Local Rule 5-4 as follows: Step 1: All non-signature items shall be E-FILED in PDF format. All proposed signature items shall be E-FILED as an attachment to the main document in PDF format. Step 2: All proposed signature items shall be E-MAILED to the chambers'' (not the CRD''s) e-mail address at mwf_chambers@cacd.uscourts.gov in Word or WordPerfect format. The case number should be reflected in the subject line. ONLY proposed order signature items should be emailed to the chambers'' e-mail address.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: The Court requires chambers copies of the documents specified below. Copies shall be delivered to Judge Fitzgerald's mailbox outside the Clerk's Office on the Fourth Floor of the Mendez United States Courthouse, no later than 5:00 p.m. on the first court day after the filing date, or on the same day if priority processing is requested. Exhibits, declarations, etc. to chambers copies must be tabbed, where applicable. Mandatory chambers copies shall NOT be blue-backed. Voluminous copies should be secured with a two-hole punch fastener or in a binder.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: Documents may not be filed under seal in matters pending before the district judge based on a discovery protective order signed by the magistrate judge. A separate and additional showing of good cause as to each category of document or information is required. An application to file documents under seal must meet the requirements of Local Rule 79-5 (Confidential Court Records). Documents that are not confidential or privileged in their entirety should not be filed under seal if the confidential portions can be redacted and filed separately with reasonable amount of effort. Sealing must be justified for each individual item to be sealed or redacted; blanket claims of confidentiality are not allowed and will result in the denial of the application to seal.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: 'EX PARTE APPLICATIONS: Ex parte applications can be submitted for routine exceptions to the Local Rules. Ex parte applications solely for extraordinary relief are rarely granted. Applications must be e-filed pursuant to the Local Rules. All ex parte applications shall be sent in PDF version to chambers'' e-mail at mwf_chambers@cacd.uscourts.gov along with a Word or WordPerfect version of the proposed order. Both the e-mail to the Court and the application should advise whether opposing counsel will be filing opposition.'
  unverified_sentences: 2
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: All discovery motions and stipulations, including those relating to protective orders, are to be calendared before the magistrate judge whose initials appear in parentheses after the case number.
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: 'TENTATIVE RULINGS: Generally, prior to argument, written tentative rulings are provided to counsel on the date of the scheduled hearing. The courtroom is open to the public before calendar call, during which time counsel may obtain such written tentative rulings from the CRD, if available.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: 'TELEPHONIC OR ZOOM APPEARANCES: The Court may permit appearances by Zoom or telephone for status conferences, scheduling conferences, and motion hearings upon a showing of good cause and/or undue hardship. Any request to appear remotely must be submitted by EMAIL to the Courtroom Deputy Clerk AND all opposing counsel. Alternatively, a Request may be FILED on the docket, and it shall include any opposing party''s objection. All requests must be submitted at least THREE COURT DAYS before the scheduled appearance. If approved, the Courtroom Deputy Clerk will docket the method of appearance (Zoom or telephone). Counsel must be available for at least one-half hour before and one-half hour after the time of the scheduled hearing.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-w-fitzgerald
  text: Requests for continuances must be by motion, stipulation or application and must be accompanied by a declaration setting forth the reasons for the requested continuance. The declaration also should include whether there have been any previous requests for continuances and whether these requests were granted or denied by the Court. Stipulations extending dates set by this Court are not effective unless approved by the Court. Continuances will not be granted routinely. If counsel has a conflicting appearance in the court of a more senior district judge, counsel must e-mail the CRD indicating the time of the appearance, the case name and number, and the name of the other judge.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/1d306bdd-43d9-40cd-748c-08dec0cdcbaa#page=6
  text: However, if lead trial counsel does not attend, any attorney appearing on his or her behalf must be prepared to discuss the case and authorized to address scheduling with the Court and opposing counsel.
  unverified_sentences: 1
