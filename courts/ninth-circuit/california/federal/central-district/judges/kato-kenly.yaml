checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=5
  text: This Court hears civil motions on Thursdays, beginning at 9:30 a.m. If Thursday is a court holiday, motions will be heard on the next Thursday. It is not necessary to clear a hearing date with the Court Clerk before filing a motion. Counsel must check the Court's website for Closed Motion Dates. If the motion date selected is not available, the Court will issue a minute order continuing the date.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=6
  text: Adherence to the timing requirements is mandatory for chambers' preparation of motion matters. The parties may stipulate to a different briefing schedule, so long as the schedule provides at least two weeks between the filing of the reply and the hearing date. If the parties are able to resolve the issue, or if a party intends to withdraw or declines to oppose a motion, the Court must be notified as soon as possible, but no later than seven days before the hearing date. Failure to oppose a motion will likely result in the motion being granted immediately after the opposition would have been due.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=6
  text: Each party filing or opposing a motion or seeking the determination of any matter shall serve and electronically lodge – at the time the moving or opposition papers are filed – a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. In addition, a copy of the proposed order in Word format shall be e-mailed to chambers at kk_chambers@cacd.uscourts.gov on the day the document is e-filed.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=14
  text: Chambers copies shall be delivered to Judge Kato's "Mandatory Chambers Copies" box, located on the third floor of the George E. Brown Federal Building, 3470 Twelfth Street, Riverside, CA 92501. A mandatory chambers copy must comply with Local Rule 11-3 (i.e. font size, page numbering, exhibit tabbing, etc.) but need not be blue-backed. The mandatory chambers copy must be prominently labeled MANDATORY CHAMBERS COPY on the face page.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=9
  text: The moving party shall file and serve the opposing party by electronic mail or hand delivery and shall notify the opposing party that opposing papers must be filed not later than twenty-four hours following such electronic mail or hand service. The twenty-four-hour clock runs on business days only. The moving party's declaration in support of an ex parte application shall demonstrate compliance with Local Rule 7-19 and this Order. Failure to comply with the Local Rules and this Order will result in the application being denied. If a party does not intend to oppose an ex parte application, the party must inform the CRD as soon as possible but not later than twenty-four hours following service. Unless otherwise ordered, reply briefs are not allowed and will be stricken.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=4
  text: All discovery matters have been referred to the assigned magistrate judge, who will hear all discovery disputes. The magistrate judge's initials follow the district judge's initials next to the case number. All discovery-related documents must include the words "DISCOVERY MATTER" in the caption to ensure proper routing.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=5
  text: Any party who uses generative artificial intelligence (such as ChatGPT, Harvey, CoCounsel, or Google Bard) to generate any portion of a motion, brief, pleading, or other filing must attach to the filing a separate declaration disclosing the use of artificial intelligence and certifying that the filer has reviewed the source material and verified that the artificially generated content is accurate and complies with the filer's Rule 11 obligations. Non-compliance and/or citations to non-existent or inaccurate sources will result in sanctions of $500 for an initial violation and $500 for each subsequent violation.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-kenly-kiya-kato
  text: All hearings will be held in person unless the Court has granted prior approval. Any request to appear remotely must be made no later than five days before the hearing date.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=8
  text: Requests for continuances will not be granted routinely. Counsel must submit any request for a continuance or extension of time no later than five (5) court days prior to the expiration of the scheduled date. Requests to continue dates that have passed will be denied. Stipulations extending scheduling dates set by this Court are not effective unless approved by the Court. The caption of any request for a continuance or extension of time shall indicate how many previous extensions have been requested (e.g., First, Second, Third, etc.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=14
  text: Lead trial counsel must attend any proceeding set by this Court, including all scheduling, pretrial, and settlement conferences. Only ONE attorney for a party may be designated as lead trial counsel unless otherwise permitted by the Court. Counsel should not claim to be co-lead trial counsel for the purpose of avoiding this requirement. If counsel purport to be co-lead trial counsel, both must attend the pretrial conference. Unless lead trial counsel's absence is excused by the Court for good cause no less than five (5) court days in advance of the hearing, or is due to an emergency that prevented prior notice, the Court reserves the right to designate the attorney handling such proceeding as lead counsel for all purposes. Failure of lead counsel to appear will be grounds for sanctions.
  unverified_sentences: 1
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/bbd27d32-7593-4457-9e6f-08def326596c#page=3
  text: Upon receipt of oral or written notice that a case has settled, the Court will administratively close the case and if no agreed final order or judgment is thereafter submitted within thirty (30) days, or if no party files a motion to reopen within such time, the case shall, without further order, stand dismissed with prejudice.
  unverified_sentences: 1
