  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-pedro-v-castillo
  text: 'Telephonic Appearances, Special Appearances and Citations: Any party who wishes to appear at a hearing by telephone shall make such a request at least two court days before the hearing. Telephonic appearances are not allowed absent permission of the Court given on showing of good cause. The Court does not permit special appearances. Counsel of record shall appear at all court proceedings. UNLESS OTHERWISE NOTED, ALL SCHEDULED HEARINGS WILL BE HELD IN PERSON. However, informal discovery conferences will proceed via Zoom.'
