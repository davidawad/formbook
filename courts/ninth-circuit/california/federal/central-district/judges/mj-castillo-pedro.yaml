  text: Civil motions are heard on Tuesdays at 10:00 a.m. It is not necessary to clear a civil motion date with the Courtroom Deputy Clerk (CRD) prior to filing the motion. The Court may take any motion under submission without oral argument. UNLESS OTHERWISE NOTED, ALL SCHEDULED HEARINGS WILL BE HELD IN PERSON. However, informal discovery conferences will proceed via Zoom.
