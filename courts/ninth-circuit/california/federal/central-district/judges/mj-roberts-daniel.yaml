  text: 'Civil Motions: Unless otherwise directed by the Court, civil motions are heard on Tuesdays at 10:00 a.m. Counsel should check the Closed Motion Dates before filing a motion; otherwise, it is unnecessary to clear a civil motion hearing date with the Courtroom Deputy Clerk (CRD) before filing a motion. The Court may continue a motion sua sponte or take a motion under submission without oral argument at any time. Hearings are held IN PERSON by default, unless otherwise ordered by the Court.'
