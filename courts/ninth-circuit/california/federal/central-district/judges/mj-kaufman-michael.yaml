- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-b-kaufman
  text: Civil motions are heard on Mondays or Wednesdays at 10:00 a.m. Please check the Closed Motion Dates before filing a motion. Other than discovery motions, discussed below, it is not necessary to clear a civil motion date with the Court before filing the motion.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-b-kaufman
  text: Strict compliance with Local Rule 79-5.2 is required. Documents filed electronically under seal must be served in accordance with Federal Rule of Civil Procedure 5. Documents filed electronically under seal must be accompanied by either a Proof of Service in the form required by Local Rule 5-3.1.2 or a declaration explaining why service is not required. The submission of documents for in camera review is governed by Local Rule 79-6.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-b-kaufman
  text: Any opposition must be filed within 24 hours of the electronic filing of the application. The Court will notify parties if a hearing is desired. Please note that, absent an emergency, ex parte applications may not be used to obtain a ruling on a discovery dispute. The Court's procedures for discovery motions in civil cases are set forth below.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-b-kaufman
  text: Proceedings will be held in person unless the parties are otherwise notified by the Court. If any party requests a telephonic or Zoom appearance, such a request must be filed in writing no later than two weeks before the proceeding. The Court values the importance of training junior attorneys. If a written request for oral argument is filed before a hearing in a non-prisoner case, stating that an attorney six or fewer years out of law school will argue the motion, then the Court will hold the hearing. Otherwise, the Court may find it appropriate to take a motion under submission without oral argument.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michael-b-kaufman
  text: Extensions or Continuances. Requests to extend any deadlines or to continue any hearings should be filed at least three business days before the scheduled deadline or hearing. The request must detail good cause for the extension or continuance, whether any extensions or continuances were sought before, and whether those were granted or denied. If it is necessary to file an ex parte application to request an extension or continuance, the application must comply with Local Rule 7-11 and Local Rule 7-19 and must contain opposing counsel's position.
