checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=4
  text: Motions shall be filed and set for hearing in person, in Courtroom 9D of the United States District Court for the Central District of California, located at 411 W. 4th Street, Santa Ana, California, in accordance with L.R. 6-1. Motions will be heard on Fridays commencing at 9:00 a.m. Any motion noticed for a holiday or a day that the Court is not in session may automatically be set to the next Friday without further notice to the parties.
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47
  text: It is not necessary to clear a hearing date with the Courtroom Deputy Clerk before filing a motion. Time for Hearing Motions. Motions shall be filed and set for hearing in person, in Courtroom 9D of the United States District Court for the Central District of California, located at 411 W. 4th Street, Santa Ana, California, in accordance with L.R. 6-1.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=3
  text: Each party filing or opposing a motion, or presenting a Stipulation for an Order, or seeking the determination of any matter, shall serve and electronically lodge a Proposed Order in the format of the Sample Proposed Order on the Court's website. A Stipulation for an Order that does not include a Proposed Order in the proper format will be denied on that basis.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=3
  text: All original filings are to be filed electronically pursuant to L.R. 5-4. Mandatory Chambers are not required unless specifically requested by Chambers. If Chambers Copies are needed, the Courtroom Deputy will provide all counsel with instructions identifying what is required, in terms of format and content.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=14
  text: Ex parte applications are considered on the papers, and applicants shall not set them for hearing. Counsel are advised that this Court allows ex parte applications solely for extraordinary relief. Sanctions may be imposed for the misuse of ex parte applications. See In re Intermagnetics Am., Inc., 101 B.R. 191 (Bankr. C.D. Cal. 1989). Counsel should become familiar with Mission Power Engineering Co. v. Continental Casualty Co., 883 F. Supp. 488 (C.D. Cal. 1995), regarding ex parte applications. The Court also directs counsel's attention to L.R. 7-19. The moving party's declaration in support of an ex parte application shall show compliance with L.R. 7-19 and this Order, and it shall include a statement of the opposing party's position. An applicant's failure to do so ensures that the application will be denied. [...] In view of that 24-hour deadline for opposition papers, in the absence of a true emergency, the Court takes a dim view of applicants who file their ex parte applications on Fridays or on the day before a court holiday. Counsel will be notified of the Court's ruling, or of a hearing time and date if the Court determines that a hearing is necessary.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=4
  text: All discovery matters have been referred to a United States Magistrate Judge. The Magistrate Judge's initials follow the District Judge's initials in the case number assigned to the matter.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=3
  text: All documents required to be e-filed in this matter can be found in General Order No. 10-07 (as updated and amended) and L.R. 5-4. The Court specifically directs litigants to L.R. 5-4.3.1, requiring that all electronically filed documents shall be created by publishing the document to PDF, and not by scanning paper documents. The Court also specifically directs litigants to L.R. 11-3.1.1, requiring that all documents use a font size of 14-point or larger.
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-w-holcomb
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=4
  text: Telephonic and Video Appearances. The Court does not conduct telephonic or video hearings. All appearances will be made in person in Courtroom 9D of the United States District Court for the Central District of California, located at 411 W. 4th Street, Santa Ana, California. Please do not ask to appear remotely; that request will be summarily denied. In addition, such a request will reveal that requesting counsel did not read this Standing Order, and it will likely be met with an Order directing requesting counsel to file a notice, under penalty of perjury, that counsel has (finally) read this Standing Order and will henceforth undertake his or her best efforts to comply with it.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=15
  text: Stipulations extending scheduling dates set by this Court are not effective unless and until approved by the Court. Continuances will be granted only upon a showing of good cause. The assertion that the parties have not concluded their discovery efforts does not constitute "good cause" to extend the case schedule. The assertion that the parties are not ready for trial does not constitute "good cause.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=3
  text: Presence of Lead Counsel. In general, lead trial counsel for each party must attend every Status Conference, Scheduling Conference, Pretrial Conference, and other hearing in this case. The Court does not permit special appearances by an attorney who is not counsel of record.
  unverified_sentences: 1
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4abcd814-3457-4333-2997-08def3e7ee47#page=5
  text: d. Withdrawal of, or Non-Opposition to, Motions. In the event that the parties resolve a pending motion, they must notify the Court immediately. Sanctions may issue for failure to comply with this requirement, or the broader requirement set forth in L.R. 7-16 that any party who intends to withdraw a motion, not to oppose a motion, or to seek a continuance of the hearing date for a motion, must notify the Court by 12:00 noon on the Tuesday preceding the hearing date.
