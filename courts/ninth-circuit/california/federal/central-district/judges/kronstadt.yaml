checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-a-kronstadt
  text: Civil motions are heard on Mondays at 8:30 a.m. Criminal motions are heard on Thursdays at 8:30 a.m. Motions in limine are heard at the Final Pretrial Conference. When Monday or Thursday is a holiday, the next motion date is the following Monday or Thursday.
  unverified_sentences: 2
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d
  text: 'Please read this section carefully. This Court''s schedule for briefing motions differs significantly from the briefing schedule set by the Local Rules. Any motion that is filed and set for a hearing to be held fewer than 35 days from the date of the filing of the motion shall be briefed pursuant to Local Rule 6-1 and Local Rule 7. Otherwise, motions shall be briefed according to the following schedule: (a). Any motion that is filed and set for a hearing between 35 and 70 days from the date of the filing of the motion: (i) any opposition must be filed no later than 14 days after the filing of the motion; and (ii) any reply must be filed no later than 21 days after the filing of the motion. Any motion that is filed and set for a hearing more than 70 days from the date of the filing of the motion: (i) any opposition must be filed no later than 21 days after the filing of the motion; and (ii) any reply must be filed no later than 35 days after the filing of the motion.'
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d
  text: If the Court deems a matter appropriate for decision without oral argument, the Court will notify the parties in advance. The Court will permit oral argument on motions in limine and, therefore, a reply is not required. The Court hears all motions in limine, which shall be numbered sequentially by each party who presents them, at the time of the Final Pretrial Conference.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-a-kronstadt
  text: 'The Court does not require a proposed order to be e-filed with any motion unless otherwise directed by the Court. A separate order will issue. Pursuant to Local Rule 52-4.1, a proposed order shall be e-filed as a separate attachment to any document seeking court approval. all proposed orders, including evidentiary objections, shall be submitted through CM/ECF or e-mailed in either Word or WordPerfect to the Court’s Chambers’ email at: jak_chambers@cacd.uscourts.gov (link sends e-mail). The court’s chambers’ email is used for proposed orders only and shall not be used to communicate with the courtroom deputy clerk.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d
  text: Mandatory chambers’ copies are to be submitted pursuant to Local Rule 5-4.5. However, the Court only requires copies of materials that have not been filed on the electronic docket for this case (e.g., CD-ROMs, DVDs, USB drives, documents electronically filed in other cases or other districts). Mandatory chambers’ copies must be delivered to the Clerk's Office, located in the First Street Courthouse, no later than 12:00 P.M. on the day following the filing of the document, with the exception of a document(s) relating to a temporary restraining order, which is to be submitted the day it is filed. Mandatory chambers’ copies of documents that have been electronically filed must be printed from CM/ECF, and must include the CM/ECF-generated header (consisting of the case number, document control number, date of filing, page number, etc.). Any stapling or binding should not obscure the CM/ECF-generated header. The Court prefers that chambers’ copies not be two-hole punched or blue-backed; when possible, staple each copy only in the upper left hand corner. The Court only requires copies of materials that have not been filed on the electronic docket for this case (e.g., CD-ROMs, DVDs, USB drives, documents electronically filed in other cases or other districts). Mandatory chambers' copies of these materials shall be delivered to the courtesy copy box located on the 4th Floor of the First Street Courthouse. It is imperative that mandatory chambers' copies are delivered by noon following the date of filing as required by Local Rule 5-4.5. Failure to deliver timely mandatory chambers' copies may result in a delay of hearing a motion or order taking the matter off calendar. Additionally, bluebacks are not required. It is not required to two-hole punch courtesy copies. All courtesy copies of documents that have been electronically filed must be printed from CM/ECF and include the CM/ECF-generated header consisting of the case number, document control number, date of filing, page number, etc.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d
  text: Counsel shall comply with Local Rule 79-5. All applications must provide the reason(s) why the parties’ interest in maintaining the confidentiality of the document(s) outweighs the public’s right of access to materials submitted in connection with a judicial proceeding. Counsel are ordered to meet and confer in person or by telephone at least seven (7) calendar days prior to the filing of an application in which the basis for the requested sealing is stated to determine if they can agree on the proposed under seal filing. Not later than two (2) calendar days after the meet and confer process has concluded, the non-proposing party shall confirm whether it agrees to having such information designated as confidential or whether it opposes an under seal filing. Any application for under seal filing, whether or not opposed, shall contain the dates and method by which the parties met and conferred.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d#page=5
  text: Ex parte applications are solely for extraordinary relief and should be used with discretion. See Mission Power Eng'g Co. v. Cont'l Cas. Co., 883 F. Supp. 488 (C.D. Cal. 1995). Ex parte applications that fail to conform to Local Rule 7-19, including a statement of opposing counsel's position, will not be considered, except on a specific showing of good cause.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d#page=8
  text: All discovery matters, including all discovery motions, are referred to the assigned United States Magistrate Judge. The Magistrate Judge's initials follow the District Judge's initials next to the case number on this Order. All discovery motions are to be calendared before the Magistrate Judge.
- topic: Exhibits and ECF
