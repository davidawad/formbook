  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d#page=12
  text: Mandatory chambers' copies of documents that have been electronically filed must be printed from CM/ECF, and must include the CM/ECF-generated header (consisting of the case number, document control number, date of filing, page number, etc.). [...] All courtesy copies of documents that have been electronically filed must be printed from CM/ECF and include the CM/ECF-generated header consisting of the case number, document control number, date of filing, page number, etc.
  unverified_sentences: 1
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-a-kronstadt
  text: Written tentative rulings may be issued. If issued, they will be available in the courtroom on the morning of the hearing. If a written tentative ruling is not issued, the Court will provide an oral tentative ruling at the outset of the hearing on the motion.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-a-kronstadt
  text: Any request for a telephonic appearance at a motion hearing must be made in writing and e-filed at least seven (7) calendar days before the scheduled hearing and shall include a declaration from counsel setting forth the basis for the request with a proposed order.
  unverified_sentences: 4
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d
  text: Counsel shall notify the Courtroom Deputy Clerk for each judge at least 24 hours prior to the date of the conflict. Counsel should appear before the most senior judge and request priority. This Court is very committed to adhering to all scheduled dates. In general, this makes the judicial process more efficient and less costly. Changes in dates are disfavored. Trial dates set by the Court are firm and will rarely be changed. Therefore, any request, whether by application or stipulation, to continue the date of any matter before this Court must be supported by a sufficient basis that demonstrates good cause why the change in the date is essential. Without such compelling factual support, requests to continue dates set by this Court will not be approved. Counsel requesting a continuance must electronically file any application or stipulation with a proposed order, including a detailed declaration of the grounds for the requested continuance or extension of time. The Court will not consider any request that does not comply with the Local Rules and this Order. Proposed stipulations extending scheduling dates become effective only if, and when, this Court approves the stipulation as presented to, or modified by, the Court, and an associated order is entered. Counsel should avoid submitting requests for a continuance less than at least seven (7) calendar days prior to the scheduled date that is the subject of the request.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d
  text: Lead trial counsel shall attend any scheduling, pretrial, or settlement conference set by the Court unless engaged in trial. Should that occur, counsel are to file a request for alternate or co-counsel to appear with a proposed order. The Court does not permit special appearances; only counsel of record may appear at any proceeding. The lead trial attorney for each party shall attend the Scheduling Conference unless such counsel is engaged in trial, or has good cause following a request to the Clerk by either telephone or email in advance of the Scheduling Conference.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3c996f73-bff5-458c-93be-31a461ce331d#page=48
  text: Notice of Settlement / Joint Report re Settlement (First Friday following last day to conduct settlement conference or mediation)
