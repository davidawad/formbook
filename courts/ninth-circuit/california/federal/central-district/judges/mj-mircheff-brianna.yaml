- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-brianna-fuller-mircheff
  text: The only exception is for summary judgment motions and oppositions in civil cases. Mandatory chambers copies of those documents must be delivered to Judge Mircheff's drop box (outside of Room 1200 on the 12th Floor of the Roybal Federal Building) by noon on the day after filing. Chambers copies do not need to be bluebacked. In habeas corpus cases and Social Security disability cases, Judge Mircheff does not require hard copies of materials that are lodged electronically.
  unverified_sentences: 2
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-brianna-fuller-mircheff
  text: Documents filed electronically under seal must be served in accordance with Federal Rule of Civil Procedure 5. Documents filed electronically under seal must be accompanied by either a Proof of Service in the form required by Local Rule 5-3.1.2 or a declaration explaining why service is not required.
  unverified_sentences: 3
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-brianna-fuller-mircheff
  text: Any opposition must be filed within one business day of the electronic filing of the application. The Court will notify parties if a hearing is desired. Please note that, absent an emergency, ex parte applications may not be used to obtain a ruling on a discovery dispute.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-brianna-fuller-mircheff
  text: Proceedings will be held in person unless the parties are otherwise notified by the Court. If any party requests a telephonic or Zoom appearance, such a request must be filed in writing no later than a week before the proceeding. Hearings are presumptively held in person, but may be conducted by videoconference at the request of the parties and with leave of Court.
