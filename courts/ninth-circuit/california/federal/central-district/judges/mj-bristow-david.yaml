- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-t-bristow
  text: 'Ex Parte Applications: Strict compliance with Local Rule 7-19 is required. Any opposition should be served and filed within 24 hours of applicant''s oral notice. Conformed paper copies of the filed application and any opposition should be electronically sent to chamber''s email box. Ex parte applications will ordinarily be decided on the papers without oral argument. The Court will notify the parties if it desires a hearing. Please note that, absent an emergency, ex parte applications are not an acceptable method of bringing a discovery dispute to the attention of the Court. Ex parte applications shall identify in the caption whether "OPPOSED" or "UNOPPOSED" and shall also identify in the caption whether the relief being sought has been previously sought via ex parte application (e.g. "FIRST ex parte application for extension of time," "SECOND ex parte application for extension of time").'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-t-bristow
  text: 'Telephonic Video Appearances: Any party who wishes to appear at a hearing by telephone shall make such a request at least two court days before the hearing. Telephonic appearances are not allowed absent permission of the Court given on showing of good cause. Telephonic video appearances at an initial scheduling conference and final pretrial conference are not allowed.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-t-bristow
  text: 'Continuances: To request a continuance of any scheduled hearing, the parties should submit a signed stipulation and proposed order at least three court days prior to the scheduled hearing. If it is necessary to file an ex parte application to request a continuance, the application must set forth opposing counsel''s position. In addition, the parties shall notify the CRD as soon as the need to reschedule a hearing is discovered. Extension Requests: Requests to extend any scheduled filing date (either by ex parte application or stipulation) shall be filed no later than three (3) days prior to the scheduled date. Extensions are not allowed absent permission of the Court given on showing of good cause. Calendar Conflicts: The parties are to advise the CRD in advance about any calendar conflict and attempt to stipulation to an alternative date and time with opposing counsel. The alternative date and time should be cleared in advance with the CRD.'
