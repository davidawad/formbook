  text: Such courtesy copies are to be delivered to Judge Sagar's drop box outside suite 1200 (12th floor) - Roybal Clerk's Office no later than 12:00 noon on the following business day. Copies must be printed from CM/ECF. Failure to deliver timely mandatory chambers copies may result in a delay in hearing a motion or ordering the matter off calendar.
  unverified_sentences: 2
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7b19ee90-2bb4-4574-aa87-71710eb82901
  text: The parties acknowledge that this Order does not confer blanket protections on all disclosures or responses to discovery and that the protection it affords from public disclosure and use extends only to the limited information or items that are entitled to confidential treatment under the applicable legal principles. The parties further acknowledge, as set forth in Section 12.3, below, that this Stipulated Protective Order does not entitle them to file confidential information under seal; Civil Local Rule 79-5 sets forth the procedures that must be followed and the standards that will be applied when a party seeks permission from the court to file material under seal. A Party that seeks to file under seal any Protected Material must comply with Civil Local Rule 79-5. Protected Material may only be filed under seal pursuant to a court order authorizing the sealing of the specific Protected Material at issue. If a Party's request to file Protected Material under seal is denied by the court, then the Receiving Party may file the information in the public record unless otherwise instructed by the court.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-alka-sagar
  text: 'Ex Parte Applications: Strict compliance with Local Civil Rules 7-19 and 7-19.1 is required. Ex parte applications shall identify in the caption whether it is "OPPOSED" or "UNOPPOSED. Any opposition shall be served and filed within 24 hours of electronic filing of the application. Conformed paper copies of the filed application and any opposition shall be delivered directly to Judge Sagar''s drop box located outside suite 1200 - Roybal Clerk''s Office. Ex parte applications will ordinarily be decided on the papers without oral argument. The Court will notify the parties if it desires an in-court or telephonic hearing. [...] Any party relying on this policy shall state in the application (1) that the party in custody is incarcerated, and (2) all steps that have or will be taken to provide the person in custody with prompt notice. Please note that, absent an emergency, ex parte applications are not an acceptable method of bringing a discovery dispute to the attention of the Court.'
  unverified_sentences: 1
