- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-alka-sagar
  text: 'Court Appearances by Counsel: Unless otherwise ordered, counsel of record must appear in person for all court proceedings. Counsel wishing to request a remote appearance in civil cases must file a request in writing by no later than five court days before the noticed hearing date, with the understanding that in certain cases the Court may be limited by any applicable bans or restrictions on live streaming or broadcasting of audio or video to the public. All criminal court proceedings must be conducted in person, except as otherwise authorized by law and ordered by the Court. Remote Appearances: Proceedings will be held in person unless the parties are otherwise notified by the Court. If any party requests a telephonic or Zoom appearance, such a request must be filed in writing no later than five court days before the proceeding. Telephonic Appearances: Telephonic appearances are not allowed absent permission of the Court given on showing of good cause. Video Appearances: Formal court attire is required, such as blazers, suits, ties, etc., when appearing via Zoom. Parties must participate from a professional setting or a quiet location, such as an office or quiet room, not from vehicles, events, or outdoors. Parties may not use speakerphones; headsets are preferred for better audio quality. Failure to comply with any of the above may result in the immediate termination of the hearing by the Magistrate Judge.'
review:
- Any attachments should be limited to no more than 25 pages per party.
- 'If after two meet-and-confer attempts, the parties reach an impasse and agree to an informal telephonic conference with the Court, in lieu of filing a motion pursuant to Local Civil Rule 37, the moving party should email (with a cc to the opposing party) the completed form entitled "Request for Informal Discovery Conference" (available for download below), to the Courtroom Deputy Clerk at AS_Chambers@cacd.uscourts.gov and provide the Clerk with the following information: (a) at least three proposed dates and times, agreeable to the parties, for the telephonic conference; (b) a brief, neutral statement of the discovery dispute (limited to no more than 1-2 paragraphs) and the specific relief requested; (c) a brief summary of the parties'' respective positions (limited to no more than 5 pages per party); and (d) the two dates of the parties'' meet-and-confer efforts to resolve the dispute without Court intervention.'
