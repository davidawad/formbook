  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-alka-sagar
  text: 'Civil Motions: Unless otherwise directed by the Court, civil motions shall be heard on Tuesdays and Thursdays at 10:00 a.m. It is not necessary to clear a civil motion hearing date with the Court prior to filing a motion; however, counsel shall check the Closed Motion Dates before filing a motion. The Court may continue a motion sua sponte or take a motion under submission without oral argument. See Local Civil Rule 7-15. The parties are reminded of their obligation under Local Civil Rule 7-3, if applicable, to meet and confer about the subject of a motion at least 7 days before filing.'
