checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=10
  text: 'Scheduling Motions Hearings: Motions must be filed in accordance with Local Rules 6 and 7. Judge Garnett hears civil motions on Wednesdays beginning at 1:30 p.m. It is not necessary to clear a hearing date with the CRD before filing a motion. Immediately before filing the motion, parties must check the closed motion dates column located on the right side of Judge Garnett''s Procedures and Schedules Page on the Court''s website to make sure the hearing date has not been closed.'
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=11
  text: To allow Chambers enough time to prepare, the parties must adhere to the briefing schedule set forth in Local Rule 7-9 and 7-10 for all motions, except Rule 56 motions. For Rule 56 motions, the parties should review and comply with Judge Garnett's Standing Order for Motions for Summary Judgment.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=15
  text: Submission Without Oral Argument. Pursuant to Fed. R. Civ. P. 78 and Local Rule 7-15, the Court may deem a matter appropriate for decision without oral argument. If the Court does so, it will notify the parties before the hearing. Oral Argument Time Limits. If oral argument is permitted, the parties will have ten (10) minutes each for oral argument, unless the Court states otherwise.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=5
  text: Use the "Proposed Order" template located on the Court's website under "Orders & Additional Documents" at the bottom of the webpage.
  unverified_sentences: 3
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=6
  text: All Mandatory Chambers Copies must be delivered to Judge Garnett's chambers copy box, which is located outside of the Clerk's Office on the 4th floor of the courthouse. Mandatory Chambers Copies must be delivered no later than 12:00 p.m. (noon) the following business day after the document is electronically filed. [...] Local Rule 5-4.5 (emphasis added).
  unverified_sentences: 2
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=7
  text: Local Rule 79-5 governs applications to file under seal. Parties must comply with all sections of Local Rule 79-5. ... For each document or other type of information a party seeks to file under seal, the party must identify and discuss the factual and/or legal justification, see (c) below, that establishes "good cause" or "compelling reasons" for the document's protection. Sealing must be justified for each individual confidential matter; blanket claims of confidentiality will result in the application to seal being denied. ... The parties must also meet and confer before filing an application to seal.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=17
  text: 'Ex Parte Applications for TROs: ... The moving party must serve the opposing party by email, fax, or personal service, and notify that party that opposing papers must be filed not later than forty-eight (48) hours following service or by 3:00 p.m. on the first court day after the service, whichever is later, or certify pursuant to Rule 65 and Local Rule 65-1 the efforts made to give notice and reasons why it should not be required under the circumstances.'
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=8
  text: Magistrate Judge Referral for All Discovery Matters. All discovery matters are referred to the assigned United States Magistrate Judge. The Magistrate Judge's initials follow the Judge's initials next to the case number.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173
  text: (b) Delivery Location, Timeliness, and Form. All Mandatory Chambers Copies must be delivered to Judge Garnett's chambers copy box, which is located outside of the Clerk's Office on the 4th floor of the courthouse. Mandatory Chambers Copies must be delivered no later than 12:00 p.m. (noon) the following business day after the document is electronically filed. [...] Local Rule 5-4.5 (emphasis added).
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=16
  text: Remote appearances are disfavored absent good cause shown in a filed declaration. The Court seldom permits telephonic appearances. The Court strongly prefers counsel to appear in person for motion hearings and pretrial and settlement conferences. If exceptional circumstances exist, counsel may file an application to appear telephonically detailing such circumstance.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=3
  text: Counsel Calendar Conflicts. If any counsel discovers a calendar conflict with a scheduled appearance, counsel must inform opposing counsel and the Court's courtroom deputy (CRD) via Chambers email at SPG_chambers@cacd.uscourts.gov as soon as possible and not later than three (3) days before the scheduled appearance. Counsel should attempt to agree on a new date to accommodate the calendar conflict. Counsel must propose a new date by Stipulation and Proposed Order. A "Notice of Unavailability" has no legal effect and should not be filed.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=2
  text: Presence of Lead Trial Counsel. Lead trial counsel shall attend all proceedings set by this Court, including scheduling, settlement, and pretrial conferences, as well as trials. Lead trial counsel must be prepared to address and resolve all matters within the scope of the proceeding. Only one attorney for a party may be designated as lead trial counsel unless otherwise permitted by the Court. If a second lead trial counsel is permitted by the Court, both counsels must attend the pretrial conference.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2715d0c0-c78d-407f-b66e-9cc994703173#page=16
  text: Counsel must notify the Court at least two weeks before the scheduled hearing if the parties are conducting settlement discussions that may render the motion moot and must notify the Court immediately if a settlement is reached. A belated notice of settlement wastes scarce judicial resources.
