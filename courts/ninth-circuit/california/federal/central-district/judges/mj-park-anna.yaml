- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-anna-y-park
  text: 'Tentative Rulings: The Court rarely issues tentative rulings before hearings. If so, they are typically emailed to counsel the day before the hearing. If both parties notify the Courtroom Deputy Clerk that they submit on the tentative ruling, the hearing will be vacated.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-anna-y-park
  text: 'Telephonic or Zoom Appearances: Where the Court orders an in-person appearance, Zoom or telephonic appearances are allowed only on prior approval of the Court upon a showing of good cause. Any party who wishes to appear at a hearing telephonically must make such a request at least seven (7) court days before the hearing by emailing the Courtroom Deputy Clerk and copying opposing counsel. Special Appearances: The Court does not permit special appearances. Counsel of record shall appear at all court proceedings.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-anna-y-park
  text: 'The Court applies the same standard of good cause to all extension requests—whether opposed or jointly requested. Good cause requires a specific, detailed, and non-conclusory showing of diligence from the outset of the case, describing: (1) all relevant work previously done (including when each item was completed); (2) all relevant work that remains to be done; (3) why the remaining work could not previously have been done (including efforts made to complete each remaining item); and (4) why the amount of time requested is needed to complete the remaining work. Calendar Conflicts: While the Court expects that counsel will conduct themselves professionally and will not deliberately schedule any proceeding when counsel are unavailable, a “Notice of Unavailability” has no legal effect and should not be filed. To request a change of hearing date because of a calendar conflict, the parties shall notify the Courtroom Deputy Clerk via email as soon as the need to reschedule a hearing is discovered, and no later than five court days before the scheduled proceeding. Counsel shall attempt to secure opposing counsel’s agreement to stipulate to a new date and submit a stipulation and proposed order no later than five court days before the scheduled hearing. If a stipulation is not forthcoming, the request shall be made by ex parte application.'
