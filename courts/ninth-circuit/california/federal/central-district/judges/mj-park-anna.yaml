  text: Mandatory Chambers copies are required, unless otherwise notified by the Court. All parties must deliver courtesy copies to Chambers (Judge's courtesy box in Roybal Courthouse, 12th floor, Room 1200 (Excluding Administrative Records in Social Security cases) by close of business the following day but preferably by noon the following day. Chambers copies do not need to be bluebacked.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-anna-y-park
  text: In most circumstances, parties should seek to file under seal only the specific exhibits or documents for which there is a valid basis for filing under seal. Pursuant to Local Civil Rule 79-5.2.2, except in sealed civil cases, “no document may be filed under seal without prior approval by the Court. When seeking the Court’s approval for an under seal filing, the submitting party shall comply with the procedures established in Local Civil Rule 79-5.2.2(a). Because documents filed under seal are only visible on CM/ECF or PACER to Court personnel and the party that filed the document, a party electronically filing a document under seal may not rely on the Court’s CM/ECF system to effect service as provided in Local Civil Rule 5-3.2.1. Therefore, documents filed electronically under seal must be served in accordance with Federal Rule of Civil Procedure 5. Additionally, at the time of filing, the documents filed electronically under seal must be accompanied either by a Proof of Service in the form required by Local Civil Rule 5-3.1.2 or a declaration explaining why service is not required. The submission of documents for in camera review is governed by Local Civil Rule 79-6.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-anna-y-park
  text: 'Ex Parte Applications: A party seeking ex parte relief must comply with Local Rule 7-19. The applicant must notify the other party (or parties) that opposing papers are to be filed no later than two court days following service. The Court generally will not rule on an ex parte application for at least two court days after the party subject to the requested order has been served unless service is excused. Opposing counsel should advise the Courtroom Deputy Clerk as soon as possible whether their client intends to oppose the ex parte application. The Court considers ex parte applications on the papers and usually does not set these matters for hearing. A last-minute application or stipulation that is denied will not serve to relieve a party of an underlying obligation (e.g., a soon-to-expire deadline). Sanctions may be imposed for misuse of ex parte applications. A party submitting an ex parte application need not provide a party in custody with oral notice prior to filing, but shall make all reasonable efforts to provide notice as quickly as practicable, consistent with Local Civil Rules 7-19 and 7-19.1. Any party relying on this policy shall state in the application (1) that the party in custody is incarcerated, and (2) all steps that have been or will be taken to provide the person in custody with prompt notice.'
