- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-diana-m-kwok
  text: Documents filed electronically under seal must be served in accordance with Federal Rule of Civil Procedure 5. Documents filed electronically under seal must be accompanied by either a Proof of Service in the form required by Local Civil Rule 5-3 1.2 or a declaration explaining why service is not required.
  unverified_sentences: 3
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-diana-m-kwok
  text: Unless otherwise ordered, counsel of record must appear in person for all court proceedings other than Informal Discovery Conferences. Remote appearances (by telephone or video) for civil court proceedings will generally not be permitted if counsel for both sides are located within Los Angeles County, unless there are extraordinary reasons. Counsel wishing to request a remote appearance in civil cases must do so in writing by no later than 14 calendar days before the noticed hearing date. All criminal court proceedings must be conducted in person, except as otherwise authorized by law and ordered by the Court.
