  text: Civil motions are heard on Tuesdays & Thursdays at 1:30 p.m. Please check the Closed Motion Dates before filing a motion. Other than discovery motions discussed below, or as set forth in an applicable scheduling and case management order, it is not necessary to clear a civil motion date with the Court before filing the motion.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-diana-m-kwok
  text: Judge Kwok does not require courtesy copies of electronically filed documents. The only exception is for summary judgment motions and oppositions in civil cases. Mandatory chambers copies of those documents must be delivered to Judge Kwok's drop box (outside Room 1200 on the 12th Floor of the Roybal Federal Building) by noon on the day after filing. Chambers copies do not need to be bluebacked. In habeas corpus cases and Social Security disability cases, Judge Kwok does not require hard copies of materials that are lodged electronically.
