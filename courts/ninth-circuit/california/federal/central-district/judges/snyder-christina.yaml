- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/Jps/honorable-christina-a-snyder
  text: The Court provides oral or written tentative rulings on most motions. Counsel are encouraged to direct oral argument to the matters raised in the tentative ruling and to submit to any part of the ruling that is not in genuine dispute, where appropriate. The Court will notify counsel if it does not require oral argument on any specific motion. ARE TENTATIVE RULINGS ISSUED? Generally, prior to argument, written tentative rulings are provided to counsel on the date of the scheduled hearing. The courtroom is open to the public twenty (20) minutes before calendar call, upon which counsel may obtain such written tentative rulings, if available. In some cases, counsel will be notified that the motion has been taken under submission and that counsel need not appear for oral argument.
