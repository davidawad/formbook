  url: https://apps.cacd.uscourts.gov/Jps/honorable-christina-a-snyder
  text: The moving party shall inform the opposing party or parties that such party or parties shall have 48 hours from the date of delivery of the moving papers to file and serve their opposition papers, if any. No hearing will be held on any ex parte application unless deemed necessary by the Court and in such case counsel will be notified by the Courtroom Deputy Clerk.
