  text: Furthermore, mandatory copies shall be 2-hole punched and the efile notification date shall be visible on or as the first page. Moreover, in all cases asserting claims under the antitrust laws, the patent laws or federal securities laws, and in such specific cases as may be designated by the Court, counsel must deliver to the Court two (2) mandatory copies of all documents that are electronically filed. Mandatory copy documents shall include tabs to separate exhibits, declarations, etc., where applicable. The Court will also accept any fax courtesy copies not exceeding five (5) pages in length total. The Courtroom Deputy Clerk's fax number is 213-894-0375. In addition, counsel shall email any and all proposed orders to the Courtroom Deputy Clerk in "Word" or "WordPerfect" format to CAS_Chambers@cacd.uscourts.gov.
