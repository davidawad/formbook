checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=13
  text: Motions must be filed in accordance with Local Rule 7. This Court hears civil motions on Fridays beginning at 2:00 pm. If Friday is a national holiday, motions will be heard on the next Friday.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=13
  text: It is not necessary to clear a hearing date with Judge Sykes' CRD before filing a motion, except for motions for summary judgment, motions for preliminary injunction, and motions for class certification. For these three motions, contact the CRD via the Court's chambers email address at SSS_Chambers@cacd.uscourts.gov to reserve a hearing date. There are limited available hearings on any given date. If the moving party fails to obtain a date, the motion will be stricken for failure to notice a hearing under Local Rule 6-1.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=15
  text: If the Court deems a matter appropriate for decision without oral argument, the Court will take the matter under submission and notify the parties before the hearing.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67
  text: 'Electronic Filings and Proposed Orders Counsel must file all civil filings pursuant to Federal Rules of Civil Procedure 5(d)(3) and Local Rule 5-4. Counsel must file items as follows: Non-Signature Items: must be filed in PDF format. Proposed Signature Items: must be filed as an attachment to the main document in PDF format. All proposed signature items must also be emailed in Microsoft Word ("Word") format to the chambers email at SSS_Chambers@cacd.uscourts.gov on the day the document is filed. Only proposed order signature items should be emailed to the chambers'' email address. Do not email other associated documents and do not use this email address for communication with the Court or the Clerk. A template for proposed orders is available on Judge Sykes'' webpage at https://apps.cacd.uscourts.gov/Jps/honorable-sunshine-s-sykes. The parties must use this template. Failure to submit a proposed order via email in Word format may result in the Court striking the motion, application, or stipulation without consideration of the request on its merits.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=5
  text: All Mandatory Chambers Copies must comply with the document formatting requirements of Local Rule 11-3, except for the blue-backing requirement of Local Rule 11-4.1, which is waived. If the filing party and its counsel fail to deliver a Mandatory Chambers Copy in full compliance with this Order and Local Rule 11-3, the Court may, on its own motion, reschedule any related hearing and impose sanctions. Pro se parties are exempt from this requirement.
  unverified_sentences: 2
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=12
  text: Local Rule 79-5 governs applications to file documents under seal. Local Rule 79-5.2.2 explains how to apply to file under seal and how to proceed if leave is granted. Parties must comply with all provisions of Local Rule 79-5. There is a strong presumption of access to judicial records in civil actions. [...] Sealing must be justified for each individual item. Blanket claims of confidentiality will result in the application to seal being denied. The parties must also meet and confer before filing an application to seal. All applications to seal must be filed at least two weeks before the anticipated motion is filed.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-sunshine-s-sykes
  text: 'Ex Parte Applications: Counsel''s attention is directed to Local Rule 7-19. The Court considers ex parte applications on the papers. Accordingly, counsel need not set ex parte applications for a hearing date. If counsel does not intend to oppose the ex parte application, they must inform the CRD by telephone at (951) 328-4462. Any opposition to an ex parte application should be filed within 24 hours of receipt of the ex parte application.'
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=10
  text: All discovery matters are hereby referred to the assigned Magistrate Judge, who will hear all discovery disputes. The assigned Magistrate Judge's initials follow the Judge Sykes' initials next to the action number.
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-sunshine-s-sykes
  text: 'Tentative Rulings: The Court does not typically issue tentative rulings.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=3
  text: Telephonic and Video Appearances. The Court does not conduct telephonic hearings. By default, all hearings, with the exception of hearings on motions in limine, Final Pretrial Conferences, and trials, must proceed remotely by video appearance on Zoom, unless a request is made by the parties to appear in person and this request is granted by the Court. Requests for an in-person appearance must be filed one (1) week before the hearing and must indicate that counsel has met and conferred with opposing counsel consistent with Local Rule 7-3. Hearings on motions in limine, Final Pretrial Conferences, and trials must be heard in person.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=6
  text: Counsel requesting a continuance must lodge, prior to the date to be continued, a proposed stipulation and order including a detailed declaration of the ground for the requested continuance or extension of time. The Court grants continuances only upon a showing of good cause, focusing on the diligence of the party seeking the continuance and any prejudice that may result if the continuance is denied.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f2c2a250-0621-468c-32ec-08ded3a86d67#page=8
  text: Lead trial counsel must attend any proceeding before this Court, including all Scheduling, Pretrial, and Settlement Conferences. Failure of lead counsel to appear for those proceedings is a basis for sanctions.
  unverified_sentences: 1
