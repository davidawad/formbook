checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580
  text: 'Time for Filing and Hearing Motions: Motions shall be filed in accordance with Local Rule 7. This Court hears motions on Mondays, commencing at 1:30 p.m. No supplemental brief shall be filed without prior leave of Court. No motion shall be noticed for hearing for more than thirty-five (35) days after service of the motion unless otherwise ordered by the Court. Civil Motions are heard on Mondays at 1:30 p.m. Criminal motions are heard on Mondays at 3:00 p.m. (If Monday is a holiday, the next motion date is the following Monday.) It is not necessary to clear a motion date with the court clerk prior to filing the motion.'
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580#page=4
  text: No motion shall be noticed for hearing for more than thirty-five (35) days after service of the motion unless otherwise ordered by the Court. Motions shall be filed in accordance with Local Rule 7.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580#page=6
  text: 'Proposed Orders: Each party filing or opposing a motion or seeking the determination of any matter shall serve and lodge a Proposed Order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. If the Proposed Order exceeds two pages, the proposing party shall also submit a copy of the Proposed Order to the Court''s ECF e-mail address, in WordPerfect format (X9 or earlier versions) or Microsoft Word (Word 365 or earlier versions).'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/65c19f14-0c70-4b78-ad2e-264ff047d4c3
  text: 'Notwithstanding any contrary provision in the Local Rules, and unless otherwise ordered by the Court, Judge Anderson does not require parties to provide Mandatory Chambers Copies of documents filed through the Court''s CM/ECF System. No party shall deliver a Mandatory Chambers Copy to Judge Anderson unless specifically ordered to do so. If the Court orders the delivery of a Mandatory Chambers Copy, the Mandatory Chambers Copy shall be delivered by either: (1) delivering it to Judge Anderson''s mailbox located adjacent to the Clerk''s Office on the fourth floor of the United States Courthouse, 350 West 1st Street, Los Angeles, California, no later than 12:00 noon on the business day following the filing of the document; or (2) sending it by guaranteed overnight delivery to the United States Courthouse, 350 West 1st Street, Suite 4311, Los Angeles, California 90012-4565. Should the Mandatory Chambers Copy be sent by overnight delivery, the sender shall notify the delivery service that the signature of the recipient is not required.'
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580#page=6
  text: 'Under Seal Filings: Parties shall make every effort to limit the number and volume of under seal filings. In most circumstances, parties should seek to file under seal only the specific portions of exhibits or documents for which there is a valid basis for filing under seal. Requests to file memoranda of points and authorities under seal are disfavored. [...] When seeking the Court''s approval for an under seal filing, the submitting party shall comply with the procedures established in Local Rule 79-5.2.2(a).'
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580#page=6
  text: Any opposition must be filed not later than 24 hours after service. If counsel do not intend to oppose the ex parte application, counsel must inform the court clerk by telephone. The Court considers ex parte applications on the papers and usually does not set these matters for hearing. Absent leave of Court, the Court will not consider reply papers in support of an ex parte application.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580
  text: All discovery matters have been referred to a United States Magistrate Judge, who will hear all discovery disputes. (The Magistrate Judge's initials follow the Judge's initials next to the case number.) All discovery documents must include the words "DISCOVERY MATTER" in the caption to ensure proper routing. Counsel are directed to contact the Magistrate Judge's Courtroom Deputy Clerk to schedule matters for hearing. Please do not deliver courtesy copies of these documents to this Court. Discovery motions are to be calendared before the magistrate judge.
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-percy-anderson
  text: Tentative rulings are not issued.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580
  text: 'Applications or Stipulations to Extend the Time to File any Required Document or to Continue any Pretrial or Trial Date: No stipulations extending scheduling requirements or modifying applicable rules are effective until and unless the Court approves them. Both applications and stipulations must be filed in advance of the date due and set forth: (a) the existing due date or hearing date as well as the discovery cutoff date, the last date for hearing motions, the pre-trial conference date and the trial date; (b) specific, concrete reasons supporting good cause for granting the extension. In this regard, a statement that an extension "will promote settlement" is insufficient. The requesting party or parties must indicate the status of ongoing negotiations: (i.e., have written proposals been exchanged? Is counsel in the process of reviewing a draft settlement agreement? Has a mediator been selected?); (c) whether there have been prior requests for extensions, and whether these were granted or denied by the Court. If counsel have a calendar conflict, they should notify the deputy court clerk as soon as possible.'
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7dc09f19-450b-4ce0-a2fc-f50d49ce2580#page=2
  text: 'Presence of Lead Counsel: Lead trial counsel shall attend all proceedings before this Court, including all status and settlement conferences.'
