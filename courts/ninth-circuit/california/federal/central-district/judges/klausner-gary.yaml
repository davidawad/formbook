- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-r-gary-klausner
  text: Continuances are granted only upon a strong showing of good cause. Requests for continuances must be by motion, stipulation or application accompanied by a declaration setting forth detailed reasons for the requested continuance. The declaration shall also include whether there have been any prior requests for continuances and whether these requests were granted or denied by the Court. Stipulations extending dates set by this Court are not effective unless approved by the Court. Requests for continuance should be submitted well in advance of the requested relief. Requests for continuance not in compliance with this Order or the Local Rules of Practice for the Central District of California will be denied. If a calendar conflict exists wherein counsel is also scheduled to appear in another Central District (CACD) Judge's courtroom at the same time, or may be late due to an earlier appearance in another CACD Judge's courtroom, counsel shall immediately notify the Courtroom Deputy Clerk by email in advance of the hearing date.
