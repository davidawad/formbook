checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790#page=4
  text: 'This Court typically hears motions on TUESDAYS, beginning at 10:00 a.m. MOTIONS: Tuesday at 10:00 A.M.'
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790
  text: 'a. Time for Filing and Hearing Motions: Motions shall be filed in accordance with Local Rules 6 and 7. The notice of motion shall be filed with the Clerk not later than twenty-eight (28) days before the date set for hearing, and shall be served on each of the parties electronically or, if excepted from electronic filing, either by deposit in the mail or by personal service. This Court typically hears motions on TUESDAYS, beginning at 10:00 a.m. The briefing schedule for the motion shall be governed by Local Rules 6 and 7. No supplemental brief shall be filed without prior leave of Court.'
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790
  text: 'Proposed Orders: Each party filing or opposing a motion or seeking the determination of any matter shall serve and lodge a Proposed Order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. A party objecting to evidence shall similarly lodge a Proposed Order setting forth the specific evidence and basis for the objection(s). All Proposed Orders shall be submitted via e-mail to cbm_chambers@cacd.uscourts.gov in Microsoft Word format. Where applicable, parties shall comply with Local Rules 52 and 58.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790#page=5
  text: 'MANDATORY Courtesy Copies: Pursuant to General Order 08-11 and Local Rule 11-3, and unless otherwise ordered by the Court, mandatory chambers copies of all filed documents, including Ex Parte or Temporary Restraining Order documents, must be delivered to the courtesy copy boxes next to the Customer Service window, at 350 W. 1st Street, Attention: Yolanda Skipper, on the 4th floor of the U.S. Courthouse, no later than 12:00 noon the following business day. The mandatory chambers copy must be prominently labeled CHAMBERS COPY on the face page. The mandatory chambers copy of all electronically filed documents must include the Notice of Electronic Filing as the last page of the document. Failure to timely supply courtesy copies of papers may result in the hearing being taken off calendar.'
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790#page=5
  text: 'Under Seal Filings: Applications to file documents under seal shall comply with Local Rule 79-5.2, and shall identify the specific material with supporting legal authority (i.e., rule, statute and/or case law) to support a good cause showing. A protective order signed by the parties does not establish good cause to file documents under seal with the Court. For additional information regarding under seal filings, see https://www.cacd.uscourts.gov/e-filing/sealed-documents.'
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790#page=6
  text: 'Ex Parte Applications: Counsel are reminded ex parte applications are solely for extraordinary relief. Applications that do not meet the requirements set forth in Local Rules 7-19 will not be considered. The Court considers ex parte applications on the papers and usually does not set these matters for hearing. Procedures for filing an EXPARTE Application: Counsel shall comply with Local Rule 7-19 and 7-19.1. Ex Parte Application shall stand submitted until further order of Court. Counsel are to alert the Courtroom Deputy by email at CBM_Chambers@cacd.uscourts.gov or by phone when you file an exparte that affects a hearing date.'
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790#page=3
  text: 'Discovery: All discovery matters have been referred to a Magistrate Judge, who will hear all discovery disputes. (The Magistrate Judge''s initials follow the District Judge''s initials next to the case number.)'
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790#page=5
  text: The mandatory chambers copy of all electronically filed documents must include the Notice of Electronic Filing as the last page of the document.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-consuelo-b-marshall
  unverified_sentences: 2
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790
  text: 'Continuances: Counsel requesting a continuance must lodge - - prior to the date to be continued - - a Proposed Stipulation and Order including a detailed declaration of the grounds for the requested continuance or extension of time. The Court grants continuances only upon a showing of good cause, focusing on the diligence of the party seeking the continuance and any prejudice that may result if the continuance is denied. Failure to comply with the Local Rules and this Order may result in denial of the request for continuance. Calendar conflicts (procedures for attorneys to follow if they have a calendar conflict): If a date is set by the Judge in court, counsel must advise the Judge at that time of any conflicts. If the conflict arises later, for instance, just prior to a hearing, counsel must advise the Courtroom Deputy Clerk by telephone or email.'
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b26dac0d-e01a-4e1b-bd33-088280f57790#page=2
  text: 'Presence of Lead Counsel: Lead trial counsel shall attend any proceeding before this Court, including all status and settlement conferences.'
