  url: https://apps.cacd.uscourts.gov/Jps/honorable-george-h-wu
  text: Ex parte applications are for extraordinary relief. [...] Ex parte applications are normally considered on the papers and are rarely set for hearing. If a hearing is necessary, the parties will be notified. The moving party shall immediately serve the opposing party by fax or hand service and shall notify the opposing party that any opposition must be filed not later than 24 hours after the filing of the ex parte application. A conformed mandatory chambers copy of moving, opposition, or notice of non-opposition papers are to be delivered to the judge's mail box outside the Clerk's Office of the 1st Street Courthouse. Clerk will notify counsel of the Court's ruling. Sanctions may be imposed for misuse of ex parte applications.
