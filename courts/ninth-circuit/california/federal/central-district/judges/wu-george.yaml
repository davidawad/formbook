- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-george-h-wu
  text: Telephonic appearances for hearings in Court are permitted only if matter need not be reported or if the attorneys do not wish to make any oral argument. Request shall made by contacting the court clerk at javier_gonzalez@cacd.uscourts.gov no later than two (2) days prior to scheduled hearing.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-george-h-wu
  text: Continuances are granted only upon a showing of good cause. Requests for continuances must be made by motion, stipulation, or application with a separate proposed order accompanied by a declaration setting forth the reasons for the requested continuance. The declaration should also include whether there have been any prior requests for continuances and whether these requests were granted or denied by the Court. Stipulations extending dates set by this Court are not effective unless approved by the Court. Requests for continuance should be submitted well in advance of the requested relief. Requests for continuance not in compliance with the Court's Standing Order or the Local Rules for the Central District of California will be denied.
