- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-stephen-v-wilson
  text: 'To request a continuance of any scheduled court proceeding: Continuances are granted only upon a showing of good cause, particularly focusing upon evidence of diligent work by the party seeking delay and of prejudice that may result from the denial of a continuance. Counsel requesting a continuance MUST submit a DETAILED declaration as to the reason. Any continuances requested not accompanied by said declaration will be rejected without notice to the parties. The Court sets FIRM trial dates and will not change them without good cause having been shown. NO stipulations extending scheduling dates set by this Court are effective unless approved by this Court. Calendar conflicts: Counsel shall notify both of the judges court clerks. Counsel should go to the most senior of the judges. A priority before that judge should be requested.'
