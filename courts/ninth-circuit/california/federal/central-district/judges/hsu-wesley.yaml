checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=11
  text: Scheduling Motions Hearings. Motions must be filed in accordance with L.R. 6 and 7. Judge Hsu hears civil motions on Fridays beginning at 1:30 p.m. It is not necessary to clear a hearing date with the CRD before filing a motion. Immediately before filing the motion, parties must check the closed motion dates column located on the right side of Judge Hsu's Procedures and Schedules Pages on the Court's website to make sure the hearing date has not been closed.
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=11
  text: To allow Chambers enough time to prepare, the parties must adhere to the briefing schedule set forth in L.R. 7-9 and 7-10 for all motions, except Rule 56 motions. For Rule 56 motions, the parties should review and comply with Judge Hsu's Standing Order for Motions for Summary Judgment.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=16
  text: Oral Argument Time Limits. If oral argument is permitted, the parties will have a ten (10) minutes each for oral argument, unless the Court states otherwise. Submission Without Oral Argument. Pursuant to Fed. R. Civ. P. 78 and L.R. 7-15, the Court may deem a matter appropriate for decision without oral argument.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=5
  text: 'Each party filing or opposing a motion or seeking the determination of any matter shall serve and lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. (b) Use Applicable Templates. [...] Proposed orders must be on pleading paper. Proposed orders should NOT contain any of the following: (1) attorney names, addresses, etc. on the caption page; (2) a footer with the document name or other information; or (3) a watermark or designation of the firm name.'
  unverified_sentences: 2
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=7
  text: 'All Mandatory Chambers Copies must be delivered to Judge Hsu''s Chambers copy box, which is located outside of the Clerk''s Office on the fourth floor of the Felicitas and Gonzalo Mendez United States Courthouse. Mandatory Chambers Copies must be delivered no later than 12:00 p.m. (noon) the following business day after the document is electronically filed. Mandatory chambers copies must be printed from CM/ECF, and must include: (1) the CM/ECF-generated header (consisting of the case number, document control number, date of filing, page number, etc.) at the top of each page; and (2) the Notice of Electronic Filing (see L.R. 5-3.2.1) as the last page of the document. Mandatory Chambers Copies need not be bluebacked.'
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=7
  text: L.R. 79-5 governs applications to file under seal. Parties must comply with all sections of L.R. 79-5. For each document or other type of information a party seeks to file under seal, the party must identify and discuss the factual and/or legal justification that establishes "good cause" or "compelling reasons" for the document's protection. (b) Redacted Version and Unredacted Version. [...] Sealing must be justified for each individual item; blanket claims of confidentiality will result in the application to seal being denied. The parties must also meet and confer before filing an application to seal.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=18
  text: The moving party must also serve the opposing party by email, fax, or personal service, and notify that party that opposing papers must be filed not later than forty-eight (48) hours following service or by 3:00 p.m. on the first court day after the service, whichever is later. The opposing party should advise the CRD as soon as possible whether it intends to oppose the ex parte application. The application will not be considered until a Mandatory Chambers Copy has been provided. Reply briefs in support of ex parte applications are not permitted.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=9
  text: Magistrate Judge Referral for All Discovery Matters. All discovery matters are referred to the assigned United States Magistrate Judge. The Magistrate Judge's initials follow the Judge's initials next to the case number.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a
  text: '(b) Delivery Location, Timeliness, and Form. All Mandatory Chambers Copies must be delivered to Judge Hsu''s Chambers copy box, which is located outside of the Clerk''s Office on the fourth floor of the Felicitas and Gonzalo Mendez United States Courthouse. Mandatory Chambers Copies must be delivered no later than 12:00 p.m. (noon) the following business day after the document is electronically filed. Mandatory chambers copies must be printed from CM/ECF, and must include: (1) the CM/ECF-generated header (consisting of the case number, document control number, date of filing, page number, etc.) at the top of each page; and (2) the Notice of Electronic Filing (see L.R. 5-3.2.1) as the last page of the document. Mandatory Chambers Copies need not be bluebacked. For security reasons, do not leave chambers copies in envelopes or folders.'
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-wesley-l-hsu
  text: 'Tentative Rulings: Tentatives, if issued, are typically made available (i) the afternoon before the hearing between 2:00 p.m. and 6:00 p.m. on this webpage, or (ii) thirty (30) minutes before the hearing in the courtroom. A tentative ruling does not represent the final decision of the Court, and the parties are strictly prohibited from filing it as an exhibit in any case. If all parties submit on the tentative ruling, please advise the Courtroom Deputy, and the Court may waive appearances.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=17
  text: Remote appearances are disfavored absent good cause shown in a declaration concurrently filed with the moving papers or the opposition. The Court seldom permits telephonic appearances. The Court strongly prefers counsel to appear in person for motion hearings and pretrial and settlement conferences. If exceptional circumstances exist, counsel may file an application to appear telephonically detailing such circumstance.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=3
  text: Counsel Calendar Conflicts. If any counsel discovers a calendar conflict with a scheduled appearance, counsel must inform opposing counsel and the Court's Courtroom Deputy (CRD) via Chambers email at WLH_Chambers@cacd.uscourts.gov as soon as possible and not later than three (3) days before the scheduled appearance. Counsel should attempt to agree on a new date to accommodate the calendar conflict. Counsel must propose a new date by Stipulation and Proposed Order. A "Notice of Unavailability" has no legal effect and should not be filed.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=2
  text: Presence of Lead Trial Counsel. Lead trial counsel shall attend all proceedings set by this Court, including scheduling, settlement, and pretrial conferences, as well as trials. Lead trial counsel must be prepared to address and resolve all matters within the scope of the proceeding. Only one attorney for a party may be designated as lead trial counsel unless otherwise permitted by the Court. If a second lead trial counsel is permitted by the Court, both counsel must attend the pretrial conference.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4f65396c-ed46-4536-7330-08dee8d9116a#page=17
  text: Counsel must notify the Court at least two (2) weeks before the scheduled hearing if the parties are conducting settlement discussions that may render the motion moot and must notify the Court immediately if a settlement is reached. A belated notice of settlement wastes scarce judicial resources.
review:
- (of one kind of motion) Replies shall not exceed ten (10) pages.
