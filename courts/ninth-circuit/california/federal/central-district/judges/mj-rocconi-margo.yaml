- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: 'Civil Motions: Unless otherwise directed by the Court, civil motions are heard on Wednesdays at 11:00 a.m. It is not necessary to clear a civil motion date with the Courtroom Deputy Clerk (CRD) prior to filing the motion; however, counsel shall check the Closed Motion Dates before filing a motion. The Court may take a motion under submission without oral argument. See Local Civil Rule 7-15.'
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: 'Young Attorneys: The court values the importance of training young attorneys. If a written request for oral argument is filed before a hearing in a non-prisoner case, stating that an attorney four or fewer years out of law school will argue the motion, then the court will hold the hearing. Otherwise, the court may find it appropriate to take a motion under submission without oral argument.'
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: All proposed orders approving stipulated protective orders must be submitted (1) in Word format, and (2) including the full text of the stipulated protective order.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
