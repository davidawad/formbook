- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: 'Separately attach a proposed order to the electronically filed application. (Standard procedure for filing any application with a proposed order). Parties and counsel may consult the Guide to Electronically Filing Under Seal Documents in Civil Cases, which is available for download below. [...] The subject line of the e-mail must bear the case name and number and include the phrase "UNDER SEAL REQUEST. In addition, the party seeking to file materials under seal must deliver the following to the Judge''s mail box, located outside the Clerk''s Office (Suite 1200), 12th Floor of the Roybal Federal Building, no later than noon the next court day: (1) one copy each of the Notice of Manual Filing; (2) the Application and declaration giving notice or proof of service; (3) the proposed order; and (4) the proposed under seal documents. The filing party is required to serve copies of the sealed documents on all other parties as applicable and to e-file a proof of service within 24 hours.'
  unverified_sentences: 2
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: 'Ex Parte Applications: Strict compliance with Local Civil Rules 7-19 and 7-19.1 is required. Any opposition should be served and filed within 24 hours of applicant''s oral notice. Conformed paper copies of the filed application and any opposition should be delivered directly to chambers. Ex parte applications will ordinarily be decided on the papers without oral argument. The Court will notify the parties if it desires a hearing. Absent an emergency, ex parte applications are not an acceptable method of bringing a discovery dispute to the attention of the Court.'
  unverified_sentences: 1
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: 'Tentative Rulings: If the Court determines that issuing a tentative ruling is appropriate, the ruling will be provided to counsel when counsel checks in with the CRD.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: 'Telephonic Appearances: Any party who wishes to appear at a hearing by telephone shall make such a request at least five court days before the hearing. Telephonic appearances are not allowed absent permission of the Court given on showing of good cause. Requests shall be made by formal pleading. Special Appearances: The Court does not permit special appearances. Counsel of record shall appear at all court proceedings.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-margo-a-rocconi
  text: 'Continuances: To request a continuance of any scheduled court hearing, the parties should submit a signed stipulation and proposed order at least three (3) court days prior to the scheduled hearing date. If it is necessary to file an ex parte application to request a continuance, the application must set forth opposing counsel''s position. In addition, the parties should notify the CRD as soon as the need to reschedule a hearing is discovered. Requests for Filing Extensions: Requests to extend any scheduled filing date (by either ex parte application or stipulation) shall be filed no later than three (3) court days prior to the scheduled date. Extensions are not allowed absent permission of the Court given on showing of good cause. Calendar Conflicts: The parties are to advise the CRD in advance about any calendar conflict and attempt to stipulate to an alternative date and time with opposing counsel. The alternative date and time should be cleared in advance with the CRD.'
