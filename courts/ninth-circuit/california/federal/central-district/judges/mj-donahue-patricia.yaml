checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-patricia-donahue
  text: Civil motions are heard on Fridays beginning at 10:00 a.m. Other than discovery motions, discussed below, it is not necessary to clear a civil motion date with the Court before filing the motion. In criminal cases, contact the Courtroom Deputy Clerk to schedule all motions.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-patricia-donahue
  text: Proposed protective orders must be emailed to the Court at pdchambers@cacd.uscourts.gov in Microsoft Word.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-patricia-donahue
  text: Judge Donahue does not require courtesy copies of electronically filed documents. The only exception is for summary judgment motions and oppositions in civil cases. Mandatory chambers copies of those documents must be delivered to Judge Donahue's drop box (outside Room 1200 on the 12th Floor of the Roybal Federal Building) by noon on the day after filing. Chambers copies do not need to be blue backed. In habeas corpus cases and Social Security disability cases, Judge Donahue does not require hard copies of materials that are lodged electronically.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-patricia-donahue
  text: Documents filed electronically under seal must be served in accordance with Federal Rule of Civil Procedure 5. Documents filed electronically under seal must be accompanied by either a Proof of Service in the form required by Local Civil Rule 5-3 1.2 or a declaration explaining why service is not required.
  unverified_sentences: 3
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-patricia-donahue
  text: 'If it is necessary to file an ex parte application to seek a continuance, the application must comply with Local Rule 7-11 and Local Rule 7-19 and must contain opposing counsel''s position. Procedures for filing an ex parte application: Strict compliance with Local Rule 7-19 is required. Any opposition must be filed within one business day of the electronic filing of the application. The Court will notify parties if a hearing is desired. Please note that, absent an emergency, ex parte applications may not be used to obtain a ruling on a discovery dispute.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-patricia-donahue
  text: 'To request a continuance of any scheduled court proceeding, the parties should submit a signed stipulation and proposed order. If it is necessary to file an ex parte application to seek a continuance, the application must comply with Local Rule 7-11 and Local Rule 7-19 and must contain opposing counsel''s position. Calendar conflicts: Advise the Courtroom Deputy Clerk in advance about a calendar conflict and attempt to stipulate with opposing counsel to an alternative date and time after clearing that alternative with the Courtroom Deputy Clerk.'
