checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5860a30c-3466-4c81-98d7-08df1b5f5540
  text: Time for Filing and Hearing Motions. Motions shall be filed in accordance with Local Rules 6 and 7. This Court hears civil motions on Wednesdays, beginning at 1:30 p.m. It is not necessary to clear a hearing date with the Courtroom Deputy Clerk prior to the filing of a motion, but the Court may continue a hearing if a particular hearing date is full. The parties shall not set a motion for hearing on a closed hearing date listed on the Court's website. CIVIL matters are heard on Wednesdays at 1:30 p.m. ALL HEARINGS SHALL PROCEED IN PERSON, UNLESS OTHERWISE ORDERED BY THE COURT. CRIMINAL matters are heard on Wednesdays at 8:30 a.m.
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=7
  text: Time for Filing and Hearing Motions. Motions shall be filed in accordance with Local Rules 6 and 7.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=9
  text: If oral argument is permitted, the parties will have ten (10) minutes each for oral argument, unless the Court states otherwise. If the Court believes that the matter warrants less or more time, it will advise counsel at the hearing. (b) Submission Without Oral Argument. Pursuant to Fed. R. Civ. P. 78 and Local Rule 7-15, the Court may deem a matter appropriate for decision without oral argument.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5860a30c-3466-4c81-98d7-08df1b5f5540
  text: (a) Proposed Orders Must be Lodged and Served. Each party filing or opposing a motion or seeking the determination of any matter shall serve and lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. Any request for action by the Court shall be made by appropriate motion or stipulation and shall be accompanied by a proposed order. (b) Email Proposed Orders to Chambers. After a document requiring a judge's signature has been lodged under L.R. 5-4.4.1, a . . . Microsoft Word copy of the proposed document, along with a PDF copy of the electronically filed main document, must be emailed to the assigned judge's generic chambers email address," AH_chambers@cacd.uscourts.gov. The Court will not consider a stipulation, ex parte application, or other request for relief until a compliant proposed order is received by email. If the proposed order is based on a stipulation or an ex parte application, counsel must email both the order and the stipulation or ex parte application. Otherwise, accompanying documents (such as motions) should not be emailed to Chambers.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=6
  text: Deliver Chambers Copies promptly to Judge Hwang's mailbox outside the Clerk's Office on the fourth floor of the Felicitas and Gonzalo Mendez United States Courthouse. Applicable documents will not be considered until Chambers Copies are submitted. Delay in submitting such copies will delay consideration of the submission. [...] Filings that include highlighting, color photographs, "redlining," or the like should be printed in color.
  unverified_sentences: 2
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=15
  text: Ex Parte Applications (Including Temporary Restraining Orders and Applications for Injunctive Relief). The Court considers ex parte applications on the papers and does not usually set these matters for a hearing. If a hearing is necessary, the parties will be notified. Ex parte applications are solely for extraordinary relief and should be used with discretion. [...] Any party seeking ex parte relief, including temporary restraining orders and preliminary injunctions under Fed. R. Civ. P. 65, must comply with Local Rule 7-19 (and Local Rule 65 for temporary restraining orders and preliminary injunctions). The moving party must also serve the opposing party by email, fax, or personal service, and notify that party that opposing papers must be filed not later than forty-eight (48) hours following service or by 3:00 p.m. on the first court day after the service, whichever is later.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=4
  text: Magistrate Judge Referral for All Discovery Matters. All discovery matters are referred to the assigned Magistrate Judge. All documents relating to discovery matters must include the words "DISCOVERY MATTER" in the caption to ensure proper routing.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=7
  text: Chambers Copies, which do not need to be submitted with blue backing, should be copies of the filed document—i.e., they should have the docket information on the top of each page.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5860a30c-3466-4c81-98d7-08df1b5f5540
  text: Any party who uses generative artificial intelligence (such as ChatGPT, Harvey, CoCounsel, or Claude) to generate any portion of a brief, pleading, or other filing must review the source material and verify that the artificially generated content is accurate and complies with the filer's Rule 11 obligations.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=9
  text: Remote appearances are disfavored absent good cause shown. The Court seldom permits telephonic appearances. The Court strongly prefers counsel to appear in person. If exceptional circumstances exist, counsel may file an application to appear telephonically detailing such circumstance.
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=10
  text: Motions and Stipulations to Continue. Continuances are granted only on a showing of good cause. Requests for continuances must be made before the date to be continued and by motion or stipulation, along with a proposed order. Motions and stipulations must be accompanied by a detailed declaration setting forth the specific reasons for the requested continuance and the precise deadline(s) the parties propose. A stipulation that fails to list the precise date(s) the parties wish to move, and the new date(s) they propose, will be denied for failure to comply with this Standing Order.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=2
  text: Presence of Counsel if a Party Has More Than One Attorney. Only one attorney for a party may be designated as lead counsel (and the designation must appear on the docket if a party has more than one attorney). Counsel who is most knowledgeable may address and resolve all matters within the scope of the proceeding. The Court does not require lead counsel to attend all proceedings if other counsel have more knowledge about and are more prepared to address the matters within the scope of the proceeding, so long as counsel has sufficient authority to resolve all matters within the scope of the proceeding.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ade560c3-2e60-4139-b094-08def1b8c688#page=3
  text: Duty to Notify of Settlement. Counsel must advise the Court immediately if (1) the case or any pending matter has been resolved or (2) a motion is pending, and the parties are engaged in serious negotiations that appear likely to resolve the case or the pending motion. Failure to provide timely notice of settlement may result in sanctions.
