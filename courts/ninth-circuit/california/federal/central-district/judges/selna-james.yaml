  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-james-v-selna
  text: The parties are required to follow the Local Rules regarding the noticing of motions on Mondays at 1:30 p.m. and the filing of oppositions and replies. L.R. 7-9 Opposing Papers. [...] Evidence presented in all opposing papers shall comply with the requirements of L.R. 7-6, 7-7 and 7-8.
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/Jps/honorable-james-v-selna
  text: If the Court does not believe that oral argument will be helpful, the Court will advise the parties no later than the Friday before the hearing. Tentative rulings may be issued. If issued, they will be available in Tentative Rulings section after Noon on the business day before the hearing and/or approximately 1/2 hour prior to the hearing in the courtroom. If all parties submit on the tentative ruling, please advise the Courtroom Deputy, and no appearance will be required.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-james-v-selna
  text: 'Stipulations: All stipulations shall be accompanied by a proposed order. The order shall include the parties'' proposed dates. If a motion or application includes an order seeking certain dates, the order shall include all proposed dates. Reference to a stipulation or other filing is insufficient. Dates must be in the order. Judgments: If a proposed judgment is endorsed by the opposing party, the Court will review and enter immediately. In all other cases, the Court will hold the proposed judgment 7 days for any objections. As with all proposed orders, the proposed judgment must be emailed to chambers in Word or Word Perfect format.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-james-v-selna
  text: 'Civil Matters: All motions and related documents (oppositions, replies, exhibits); ex parte applications (excluding PHV Applications) and related documents (oppositions and exhibits); and ALL PRETRIAL DOCUMENTS. Criminal Matters: All motions and related documents (oppositions, replies exhibits); plea agreements and sentencing position. [...] Failure to deliver timely mandatory chambers copies may result in a delay in hearing a motion or ordering the matter off calendar. It is not necessary to send chambers copies of redacted documents. Mandatory chambers copies of Sealed Documents shall be delivered to the Clerk''s Office Intake window, to be placed in the Court''s internal mail box.'
  unverified_sentences: 3
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-james-v-selna
  text: Mandatory chambers copies of Sealed Documents shall be delivered to the Clerk's Office Intake window, to be placed in the Court's internal mail box.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5be81f45-3b50-4112-a7ea-e20110835b36
  text: D. EX PARTE PRACTICE Ex parte applications are solely for extraordinary relief and should be used with discretion. See Mission Power Engineering Company v. Continental Casualty Co., 883 F. Supp. 488 (C. D. Cal. 1995). The Court will generally decide ex parte matters on the papers. Opposition to an ex parte application, if any, should be submitted within 24 hours. The moving party shall serve the opposing party by Email (this includes the CM/ECF System), FAX or hand service and shall notify the opposing party that any opposition must be filed not later than 24 hours after such service has been completed.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/Jps/honorable-james-v-selna
  text: All discovery motions are to be calendared before the magistrate judge.
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5be81f45-3b50-4112-a7ea-e20110835b36
  text: 'The parties should expect that the Court will conduct hearings in person as usual. The Court attempts to issue tentative rulings on each motion. A tentative posted is intended as preparation for the hearing scheduled. Tentatives are generally posted no later than mid-afternoon on the Friday prior to a Monday hearing. Tentative rulings may be issued. If issued, they will be available in Tentative Rulings section after Noon on the business day before the hearing and/or approximately 1/2 hour prior to the hearing in the courtroom. If all parties submit on the tentative ruling, please advise the Courtroom Deputy, and no appearance will be required. TENTATIVES–DAY OF HEARING AND WEB POSTING Tentatives will be posted on the Court''s website: www.cacd.uscourts.gov/. From the home page, click on "Judges'' Procedures and Schedules" in the left column. From the list, click on "Hon. James V. Selna," which will take you to Judge Selna''s page. [...] Then click on the desired ruling which comes up in a .pdf file which can be read with an Adobe Acrobat reader. Judge Selna attempts to post tentatives by late Friday afternoon preceding the hearing date. Hard copies of tentatives will also be available from the clerk approximately 15 minutes before the hearing.'
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-james-v-selna
  text: ALL hearings will be heard IN PERSON in Courtroom 10C unless otherwise ordered by the court. Any request for a remote appearance must be filed no later than five (5) court days before the court proceeding. Such a request must be supported by a declaration and proposed order setting forth good cause for the remote appearance. If the court grants the request, the type of remote appearance allowed will be at the court's discretion. *Please note that requests for remote appearances are rarely granted* (Having counsel's office outside the District is not a basis to request a remote appearance) All Civil Pretrial Conferences require in person attendance by all attorneys.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5be81f45-3b50-4112-a7ea-e20110835b36
  text: 'APPLICATIONS AND STIPULATIONS FOR EXTENSIONS OF TIME No stipulations extending scheduling requirements or modifying applicable rules are effective until and unless the Court approves them. Both applications and stipulations must set forth: The existing due date or hearing date; Specific, concrete reasons supporting good cause for granting the extension. In this regard, a statement that an extension "will promote settlement" is insufficient. The requesting party or parties must indicate the status of ongoing negotiations: Have written proposals been exchanged? Is counsel in the process of reviewing a draft settlement agreement? Has a mediator been selected? Whether there have been prior requests for extensions, and whether these were granted or denied by the Court. To request a continuance of any scheduled court proceeding, counsel must make such request at least five days prior to the hearing date with a statement of good cause included in the request. The proposed order must reflect the specific dates requested. If there is a calendar conflict, counsel are to inform the courtroom deputy prior to the date of the conflict.'
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5be81f45-3b50-4112-a7ea-e20110835b36
  text: L. LEAD COUNSEL Lead counsel shall appear on all dispositive motions, scheduling conferences, and settlement conferences. The Court does not entertain special appearances; only counsel of record may appear. The Court does not permit special appearances. Counsel of record shall appear at all court proceedings.
