checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: CRIMINAL MOTIONS Criminal motions are heard on Thursdays at 10:00 a.m. Counsel must contact the Courtroom Deputy to obtain an available hearing date and time prior to filing a motion in a criminal case. CIVIL MOTIONS Civil motions are heard on Tuesdays at 10:00 a.m. It is not necessary to clear a hearing date with the courtroom deputy prior to filing a motion in a civil case. Counsel must check the "Closed Motion Dates" portion of the motion calendar to ensure a date is available prior to filing.
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: All motions must be filed and served at least 28 days before the hearing date. Opposition papers are to be filed and served not later than 21 days before the hearing date, and any reply papers are to be filed and served at least 14 days before the hearing date. [...] However, Rule 56 motions before this Court must be noticed, served, and filed not later than 42 days before the hearing date. Oppositions must be filed and served not later than 28 days before the hearing date. Replies must be filed and served not later than 21 days before the hearing date. This is so the opposing party has at least 14 days to oppose and the Court has 21 days between the reply deadline and the hearing date.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: 'A copy of the proposed order in Word format shall be e-mailed to MRA_chambers@cacd.uscourts.gov on the day the document is e-filed. Proposed orders must include Judge Ramírez Almadani''s correct name and title: Hon. Mónica Ramírez Almadani, United States District Judge. Orders with an incorrect spelling or title will not be signed.'
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: The Court requires chambers copies of trial filings and summary judgment/Rule 56 briefing materials. Specific requirements for those chambers copies are explained in the Court's updated Civil Trial Order (linked below). The Court does not require chambers copies of any other motion papers or exhibits and discourages the parties from sending chambers courtesy copies. If the Court directly requests a copy, the mandatory chambers copy must comply with Local Rule 11-3 but need not be blue-backed. It must also be prominently labeled MANDATORY CHAMBERS COPY on the face page and include the NEF as the last page of the document. Chambers copies shall be delivered to Judge Ramírez Almadani's courtesy box, located outside of Courtroom 9B on the 9th floor, by the deadline set by the Court.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: Documents may not be filed under seal in matters pending before the district judge based on a protective order signed by the magistrate judge. A separate and additional showing of good cause as to each category of document or information is required. See Fed. R. Civ. P. 26(c); Phillips ex rel. [...] The parties must also comply with Local Rule 79-5 (Confidential Court Records). Chambers copies of under seal documents shall all be placed together in a manila envelope labeled "UNDER SEAL" and be delivered to the Intake Department on the 1st floor.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: 'Counsel are reminded that ex parte applications are solely for extraordinary relief and are discouraged. [...] A party seeking ex parte relief must show: (1) "the moving party''s case will be irreparably prejudiced if the underlying motion is heard according to regular noticed motion procedures"; and (2) "the moving party is without fault in creating the crisis that requires ex parte relief, or that the crisis occurred as a result of excusable neglect. Applications that do not meet the requirements set forth in Local Rule 7-19 will not be considered. If counsel do not intend to oppose the ex parte application, they must inform the courtroom deputy by telephone. Any opposition to an ex parte application should be filed within 24 hours of receipt of the ex parte application. In addition, sanctions may be imposed for misuse of ex parte applications.'
  unverified_sentences: 2
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: The magistrate judge's initials follow the district judge's initials next to the case number.
