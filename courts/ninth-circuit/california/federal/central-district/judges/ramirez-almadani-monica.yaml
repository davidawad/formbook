- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: All original filings must be filed electronically pursuant to Local Rule 5-4 and must comply with Local Rules 11-3-11.9 as to form and format, including limitations on length set forth in Local Rule 11-6.1. Certification of compliance with this requirement is set forth in Local Rule 11-6.2. The Court requires chambers copies of trial filings and summary judgment/Rule 56 briefing materials. Specific requirements for those chambers copies are explained in the Court's updated Civil Trial Order (linked below). The Court does not require chambers copies of any other motion papers or exhibits and discourages the parties from sending chambers courtesy copies. If the Court directly requests a copy, the mandatory chambers copy must comply with Local Rule 11-3 but need not be blue-backed. It must also be prominently labeled MANDATORY CHAMBERS COPY on the face page and include the NEF as the last page of the document.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: ALL hearings will be heard IN PERSON in Courtroom 9B unless otherwise ordered by the court. Any request for a telephonic appearance must be filed no later than five (5) court days before the court proceeding. Such a request must be supported by a declaration and proposed order setting forth good cause for the remote appearance. If the court grants the request, the type of remote appearance allowed will be at the court's discretion. *Please note that requests for remote appearances are rarely granted*
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: Requests for continuances must be by motion or stipulation and accompanied by a declaration setting forth the reasons for the requested continuance. The declaration should include whether there have been any previous requests for continuances and whether these were granted or denied. Counsel must submit any request for a continuance or extension of time not later than five (5) court days prior to the expiration of the scheduled date. A request to continue or extend dates or deadlines that have already expired constitutes a presumptive lack of due diligence. The caption of any request for a continuance or extension of time shall indicate how many previous extensions have been requested (e.g., First, Second, Third, etc. Requests for continuances will not be granted routinely, and stipulations extending dates set by this Court are not effective unless approved by the Court.
  unverified_sentences: 1
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mónica-ramírez-almadani
  text: In most civil cases, upon being advised that a resolution as to all parties and all claims has been reached, the Court will issue an order staying all proceedings pending a stipulation of dismissal by the parties. The parties are expected to finalize the terms of the settlement and file a stipulation of dismissal within 60 days of the entry of the Court's stay order. If the parties reach a settlement in principle that is expected to or is likely to take more than 60 days to finalize, the parties should be prepared to articulate why additional time is needed and demonstrate diligence in finalizing the settlement. When a motion is calendared or under submission, counsel are required to inform the Court promptly of any finalized or imminent settlement that may render the motion moot.
  unverified_sentences: 1
