  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/Jps/honorable-angela-c-c-viramontes
  text: 'ARTIFICIAL INTELLIGENCE: Any party who uses generative artificial intelligence (such as ChatGPT, Harvey, CoCounsel, Google Bard, Claude AI, etc.) to generate any portion of a motion, brief, pleading, or other filing must attach to the filing a separate declaration disclosing the use of artificial intelligence and certifying that the filer has reviewed the source material and verified that the artificially generated content is accurate and complies with the filer''s Rule 11 obligations. Non-compliance and/or citations to non-existent or inaccurate sources will result in sanctions of $500 for an initial violation and $500 for each subsequent violation.'
