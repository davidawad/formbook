  text: 'Remote Appearances: Remote appearances are conducted by video via the Court''s preferred platform, Zoom. Any party seeking to appear by telephone must submit a request at least two court days before the hearing. Telephone appearances are not permitted absent prior Court approval upon a showing of good cause. [...] Failure to comply with any of the above may result in the immediate termination of the hearing by the Magistrate Judge.'
