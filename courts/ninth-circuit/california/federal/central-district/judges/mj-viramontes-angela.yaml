- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-angela-c-c-viramontes
  text: Civil Motions are heard on Wednesdays at 10:00 a.m. Discovery Motions must first comply with the Judge's Pre-Motion Video Conference requirements prior to filing a discovery motion (if Wednesday is a holiday, next motion date is the following Wednesday). Alternative dates and times may be scheduled by the Court after consultation with counsel. It is not necessary to clear a civil motion date with the Courtroom Deputy Clerk (CRD) prior to filing the motion unless it is a discovery dispute. The Court may take any motion under submission without oral argument.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-angela-c-c-viramontes
  text: 'Chambers Copies: Mandatory chamber hard copies of all e-filed documents, including social security administrative records, are not required and should not be delivered to chambers, unless requested by the Court at a later time. Electronic copies of proposed orders shall be emailed to the Court at ACCV_Chambers@cacd.uscourts.gov. Proposed orders shall be in Microsoft Word format. To ensure compliance, all proposed stipulated protective orders must be submitted in two separate steps. First, the full text of the stipulated proposed protective order must be e-filed.'
