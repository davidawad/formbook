  text: It is not necessary to clear a civil motion hearing date with the Courtroom Deputy Clerk (CRD) prior to filing a motion; however, counsel shall check the Closed Motion Dates link above before filing a motion. The Court may continue a motion sua sponte or take a motion under submission without oral argument. Requests for Zoom or telephonic appearances must be filed no later than five (5) court days before the hearing and include a declaration establishing good cause.
