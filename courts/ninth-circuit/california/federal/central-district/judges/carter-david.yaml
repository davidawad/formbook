checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-o-carter
  text: Criminal motions, Status Conferences, Change of Pleas, and Sentencings are heard on Mondays at 7:30 a.m. or 1:30 p.m. If Monday is a holiday, the next motion date is the following Monday.
  unverified_sentences: 2
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2eb96462-b182-460c-86b4-288cbe367576#page=3
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-o-carter
  text: For email submissions of proposed orders, the Court prefers that proposed orders be submitted in Word format only. Email submissions of proposed orders should be sent to DOC_Chambers@cacd.uscourts.gov. Please note the Court does not have the capability to process proposed orders via CD or disk.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-o-carter
  text: 'Mandatory chambers copies: All original filings are to be filed electronically pursuant to Local Rule 5-4. [...] To save paper, no courtesy copies should be filed for motions not listed above. [...] Except as to documents filed under seal, mandatory chambers copies of all documents in both civil and criminal cases shall be delivered to the mandatory chambers box (10th floor) no later than noon following the date of filing. MANDATORY CHAMBERS COPIES DO NOT NEED TO BE BLUE-BACKED. All original filings are to be filed electronically pursuant to Local Rule 5-4. The Court requires one mandatory chambers copy of ONLY the following filed documents: Civil matters: motions for final approval of class settlements; ex parte applications (excluding PHV Applications) and related documents (oppositions and exhibits); Joint Rule 26(f) Reports; and ALL PRETRIAL DOCUMENTS. Criminal matters: all motions and related documents and exhibits; plea agreements, sentencing positions, stipulations and proposed orders.'
  unverified_sentences: 2
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2eb96462-b182-460c-86b4-288cbe367576#page=4
  text: There is a strong presumption that the public has a right of access to records in civil cases. For non-dispositive motions, the party seeking to maintain the confidentiality of the document(s) or portions thereof must show good cause. For dispositive motions, the party seeking protection must articulate compelling reasons for maintaining the confidentiality of the document(s) and must seek relief that is narrowly tailored to the protected interest. No document will be filed under seal in its entirety unless it is shown in the application that it is not feasible to file a redacted version for public viewing.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2eb96462-b182-460c-86b4-288cbe367576#page=3
  text: Ex parte applications that fail to conform to Local Rule 7-19 and 7-19.1, including a statement of opposing counsel's position, will not be considered except on a specific showing of good cause. Concurrently with service of the ex parte papers by electronic service, facsimile, or personal service, the moving party shall notify the opposition that opposing papers must be filed no later than twenty-four (24) hours following service. If opposing counsel does not intend to oppose the ex parte application, counsel must inform the Courtroom Deputy Clerk by telephone or email as soon as possible.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-o-carter
  text: Parties and counsel are directed to the procedures for discovery motions in Local Rule 37 and are advised to consult the procedures page of the Magistrate Judge assigned to their case.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-david-o-carter
  text: Any request for a remote appearance must be e-filed promptly with a declaration showing good cause. [...] The Court does not permit telephonic appearances.
  unverified_sentences: 2
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2eb96462-b182-460c-86b4-288cbe367576#page=2
  text: This Court has a strong interest in adhering to scheduled dates. Changes in dates are disfavored. Trial dates set by the Court are firm and will rarely be changed, except that the Court may advance the trial date up to two weeks. Any request, whether by application or stipulation, to continue the date of any matter before this Court must be supported by a detailed explanation of the grounds for the requested continuance or extension of time. [...] If a stipulation is not forthcoming, counsel should file an Ex Parte Application seeking to continue the hearing date.
  unverified_sentences: 2
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2eb96462-b182-460c-86b4-288cbe367576
  text: Unless a party is representing him or herself, parties shall be represented by lead counsel at all court appearances, including scheduling conferences. Under no circumstances should counsel, or a party if the party is appearing pro se, fail to appear at a court appearance unless their appearance has been waived by prior order of the Court. In civil cases, lead trial counsel is expected to appear at all conferences and hearings, including motion hearings. Special appearances are not permitted, and only counsel of record may appear.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/2eb96462-b182-460c-86b4-288cbe367576#page=4
  text: If settlement is reached at any time in this litigation, the parties shall immediately notify the Court by telephone, email, or by filing a notice of settlement.
