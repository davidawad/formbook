- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: The Court may resolve civil motions on the parties' written submissions, without oral argument. If the Court does not believe that oral argument will be helpful, the Court will advise the parties in advance. Unless the Court orders otherwise, civil motions will proceed IN PERSON. Telephonic or video conference appearances by counsel are disfavored and require truly exceptional circumstances.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: Whether related to ex parte applications, stipulations, motions, or any other request for relief, the parties must prepare, lodge and email proposed orders setting forth the relief they seek. A word processing version of the proposed order must be emailed to the chambers address. Although Local Rule 5-4.4.2 allows for another format, proposed orders emailed to Judge Staton's chambers address must be in Microsoft Word format.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: Notwithstanding Local Civil Rule 5-4.5, and in the absence of a case-specific order to the contrary, the Court does not require mandatory chambers copies in any case. This provision applies equally to civil and criminal cases. Additionally, paper copies of documents to be filed under seal (and supporting applications and declarations) need not be provided.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/65fe0a76-673e-44a5-cc30-08de73dffb43
  text: 'FILE A PROPERLY SUPPORTED APPLICATION (L.R. 79-5.2.2(a)) A properly supported application usually consists of five documents: three documents filed publicly and two documents filed non-publicly. Although the Local Rule 79-5 refers to presentation in "paper format," documents are now almost always submitted to the CRD for processing by emailing them in PDF format to the chambers email address. PUBLIC DOCUMENTS (COUNSEL OR PARTIES FILE ON PUBLIC DOCKET) Application for Leave to File Document Under Seal Unless the Application and Proposed Order expressly state that the entire document is proposed to be filed under seal, a Public Redacted Version of the Document to be Filed Under Seal (public filing) (conspicuously labeled "REDACTED VERSION OF DOCUMENT PROPOSED TO BE FILED UNDER SEAL") (filed by counsel or parties after under seal filing is approved) Proposed Order (public filing) B. Declaration in Support of Filing Under Seal (non-public filing) Unredacted Version of Document to be Filed Under Seal (non-public filing) (confidential portions highlighted in yellow) (conspicuously labeled as "UNREDACTED VERSION OF DOCUMENT PROPOSED TO BE FILED UNDER SEAL")'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: The parties and counsel are directed to Local Civil Rule 7-19. Ex parte applications are for extraordinary relief only. Where appropriate, the movant shall serve the opposing party by electronic filing (see Local Rule 5-3.2.1); otherwise, the party seeking relief shall serve by email, fax, or personal service. The party seeking relief must also notify the opposing party that any opposition must be filed no later than 24 hours after service. Absent leave of court, replies are not permitted.
  unverified_sentences: 1
