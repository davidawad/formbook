- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/9e1bb2d6-488e-4130-e4c2-08debdb90c5c#page=6
  text: Any party who uses any form of generative artificial intelligence to generate any portion of a brief, pleading, or other filing must attach to the filing a separate declaration disclosing the use of artificial intelligence and certifying that the filer has reviewed the source material and verified that the artificially generated content is accurate and complies with the filer's Rule 11 obligations.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: Absent extraordinary circumstances, all hearings before the Court are conducted in person. Requests to appear by telephone or Zoom videoconference must be made by filing an application no fewer than five days in advance of the hearing. Sending an email to the Courtroom Deputy Clerk ("CRD") is NOT the proper way to request to appear by telephone or by Zoom and does not excuse the in-person appearance by a party or by counsel.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: After the Court issues a scheduling order, continuances in civil cases are granted only upon a showing of good cause. See Fed. R. Civ. P. 16(b)(4). Applications or stipulations for continuances must be supported by detailed declaration attesting to the grounds for continuance. Parties and counsel must in all instances demonstrate good cause; they may not simply stipulate that good cause has been shown. The Court does not modify Scheduling Orders to accommodate mediation or settlement negotiations, which occur in every case.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: Lead trial counsel is expected to appear at all conferences and hearings, including motion hearings. Special appearances are not permitted, and only counsel of record may appear. In situations in which one attorney makes a telephone appearance, but his or her co-counsel is present in Court, only one of the two may address the substance of any matter pending before the Court.
  unverified_sentences: 1
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-josephine-l-staton
  text: The parties are to advise the Court promptly when a settlement is reached. In an ordinary civil case, upon being advised that the parties have reached a resolution as to all parties and all claims, the Court will issue an order staying all proceedings pending a stipulation of dismissal by the parties. No stay will be issued for "tentative" settlements or settlements "in principle. The parties are expected to finalize the terms of the settlement and file a stipulation of dismissal within thirty days of the entry of the Court's stay order.
  unverified_sentences: 1
