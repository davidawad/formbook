  text: 'EX PARTE APPLICATIONS: Compliance with Local Rules 7-19 and 7-19.1 is required. An ex parte application is usually considered on the papers only. If the application is opposed, opposition papers should be filed no later than noon on the first court day following service of the application. In most cases, the Court will wait until that time before ruling. If needed, the Court will schedule a hearing. Discovery disputes should generally not be brought to the Court''s attention in an ex parte application.'
