checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  text: 'This Court hears motions on Fridays, beginning at 9:30 a.m. If Friday is a national holiday, motions will be heard on the next Friday. It is not necessary to clear a hearing date with the judge''s courtroom deputy clerk before filing a motion, except for motions for summary judgment or preliminary injunction. If the motion date selected is not available, the Court will issue a minute order continuing the date. Civil Motions: Friday at 9:30 a.m. Criminal Motions: Wednesday at 2:30 p.m.'
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dolly-m-gee
  text: Moving papers are to be filed and served at least twenty-eight (28) days before the hearing date. Opposition papers are to be filed and served no later than twenty-one (21) days before the hearing date, and any reply papers are to be filed and served at least fourteen (14) days before the hearing date.
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  text: In addition, a copy of the Proposed Order in Word or WordPerfect format shall be emailed to Judge Gee's generic chambers e-mail address using the CM/ECF System on the day the document is e-filed.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  text: No chambers copy is required for CIVIL cases, except at the specific request of the Court. If requested by the Court, chambers copies shall be delivered to and placed in the Judge's courtesy box, located outside of the Clerk's office, on the 4th floor, by 5:00 p.m. on the first court date after the filing date. All exhibits, declarations, etc. to chambers copies must be tabbed, where applicable. Blue-backs and hole punches are not required. Chambers copies of under seal documents shall all be placed together in a manila envelope labeled "UNDER SEAL.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dolly-m-gee
  text: 'The "Guide to Electronically Filing Under Seal Documents in Civil Cases" is attached below. No chambers copy is required, except at the specific request of the Court (i.e., please refrain from contacting the Courtroom Deputy Clerk.) [...] Counsel shall create two separate docket entries: PUBLIC Entry: Application for leave to file under seal with proof of service, attaching a redacted version of the document(s) to be sealed, and proposed order; and SEALED Entry: Declaration in support of Application, attaching an unredacted version of the document(s) to be sealed. A PDF file that is too large to docket may be split into several smaller PDFs. Each document or sets of documents shall have a title page pursuant to Local Rule 11-3.8, and should only contain the materials to be filed under seal. For example, DO NOT e-file a PDF of exhibits 1-40 if only exhibits 5, 20 and 39 are to be filed under seal. After electronically filing, send an email to the chambers email address at dmg_chambers@cacd.uscourts.gov(link sends e-mail)., containing a Word or WordPerfect version of the proposed order. The subject line of the email should have the case number, including the words "UNDER SEAL REQUEST. [...] Please note: If approved, the document itself will be sealed and not viewable by the public. However, the title that you insert on the caption of the sealed document will be viewable on the docket entry. Declaration of John Doe, Exhibit A." Therefore, you should be circumspect about the title of the document if that may reveal confidential information.'
  unverified_sentences: 3
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  text: The Court considers ex parte applications on the papers and does not usually set these matters for hearing. If a hearing is necessary, the parties will be notified. Ex parte applications are solely for extraordinary relief and should be used with discretion. Sanctions may be imposed for misuse of ex parte applications. See Mission Power Engineering Co. v. Continental Casualty Co., 883 F. Supp. 488 (C.D. Cal. 1995). Ex parte applications that fail to conform to Local Rule 7-19 and 7-19.1, including a statement of opposing counsel’s position, will not be considered except on a specific showing of good cause. Following service of the ex parte papers by electronic service, fax, or personal service, the moving party shall notify the opposition that opposing papers must be e-filed no later than twenty-four (24) hours following service. If counsel does not intend to oppose an ex parte application, he or she must inform the courtroom deputy clerk at (213) 894-5452.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  text: All discovery matters have been referred to the assigned United States Magistrate Judge, who will hear all discovery disputes. The Magistrate Judge's initials follow the District Judge's initials next to the case number.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dolly-m-gee
  text: All proposed signature items shall be E-FILED as an attachment to the main document in pdf format.
  unverified_sentences: 2
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dolly-m-gee
  text: 'Tentative Rulings: The Court makes every effort to issue a tentative ruling at the time of the hearing. The tentative ruling is not available before the hearing.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  text: ALL HEARINGS SHALL PROCEED IN-PERSON, UNLESS OTHERWISE ORDERED BY THE COURT. [...] If you wish to appear by telephone or video, you must (a) email the courtroom deputy clerk and copy opposing counsel at least seven (7) days in advance of the scheduled appearance; (b) in the case of telephonic appearances, use a landline to call into the bridge line provided by the clerk; and (c) be available at that number for at least 15 minutes before the time of the scheduled hearing.
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/98a730a2-9aff-4ac0-9e15-08de14d99915
  text: This Court has a strong interest in keeping scheduled dates certain. Changes in dates are disfavored. Trial dates set by the Court are firm and will rarely be changed. Therefore, a stipulation to continue or extend the date of any matter before this Court must be supported by a sufficient factual basis that demonstrates good cause why the change in the date is essential. Without such compelling factual support and a showing of due diligence, stipulations continuing dates set by this Court will not be approved. Counsel requesting a continuance or extension of time must electronically file a stipulation and lodge a proposed order including a detailed declaration of the grounds for the requested continuance or extension of time. Failure to comply with the Local Rules and this Order will result in rejection of the request without further notice to the parties. Proposed stipulations extending scheduling dates do not become effective unless and until this Court so orders. Counsel shall avoid submitting requests for continuance or extension of time less than five (5) court days prior to the expiration of the scheduled date. A request to continue or extend dates or deadlines that have already expired is presumptively a lack of due diligence.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dolly-m-gee
  text: 'Settlement: Counsel shall immediately email the Courtroom Deputy Clerk as soon as a settlement of your case has been reached. The Court will assess jury fees against each side under Local Rule 40-3 if the notification of settlement occurs after 4:00 p.m. on the last business day prior to trial.'
