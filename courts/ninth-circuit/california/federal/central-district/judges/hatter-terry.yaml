- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-terry-j-hatter-jr
  text: Mandatory chambers copies of ALL electronic filed documents shall be delivered to the Courtroom Deputy in the CLERK'S OFFICE, on the 4TH FLOOR, CUSTOMER SERVICE WINDOW of the 350 W. 1ST STREET COURTHOUSE by 12 noon the next business day and should be stamped "COURT COPY". Each copy must include the CM/ECF generated header (consisting of the case number, document control number, date of filing, page number, etc.,) at the top of each page; and the Notice of Electronic Filing (NEF) as the last page of the document. Bluebacks are not required. If they will be late you may leave a message with Judge Hatter's Clerk. You may also mail them in.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-terry-j-hatter-jr
  text: 'UNDER SEAL FILINGS: Filing civil and criminal documents under seal: Refer to the Local Rules 79-5.'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-terry-j-hatter-jr
  text: 'EXPARTE APPLICATIONS: Ex parte applications are for extraordinary relief only. Applications must be in accordance with Local Rule 7-19 and any applicable General Order except as to the date and time for a hearing. Ex parte applications for TROs or Under Seal filings shall be filed in the Clerk''s Office filing window; Judge Hatter will determine whether a hearing is necessary after he reviews the application. Counsel will be notified if a hearing is required. Sanctions may be imposed for misuse of ex parte applications.'
  unverified_sentences: 1
