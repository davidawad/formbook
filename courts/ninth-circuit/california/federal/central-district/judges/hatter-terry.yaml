  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/Jps/honorable-terry-j-hatter-jr
  text: Judge Hatter takes all CIVIL motions under submission as of the calendared date of the motion, (see Local Rule 83-9.2).
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-terry-j-hatter-jr
  text: Once a stipulation has been approved and filed, the information may be obtained by checking the docket on PACER. Telephonic inquiries regarding the status of a stipulation, as well as a motion, may not be returned.
