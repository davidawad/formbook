checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-terry-j-hatter-jr
  text: Civil motions are noticed for Mondays, excluding holidays. If Monday is a holiday, skip to the following Monday. Indicate the date and for the time it should read no appearance necessary, unless the court notifies parties. Judge Hatter takes all CIVIL motions under submission as of the calendared date of the motion, (see Local Rule 83-9.2). Criminal motions are noticed for hearing on Mondays at 10:00 a.m., unless there has been a previously ordered date and time for hearing pre-trial motions. It is NOT NECESSARY to clear a motion date with the court clerk prior to filing the motion. Judge Hatter hears motions and conducts status and final pretrial conferences on the first and third Mondays of each month.
