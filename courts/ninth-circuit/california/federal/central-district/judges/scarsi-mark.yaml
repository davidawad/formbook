checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=6
  text: Motions shall be filed in accordance with Local Rule 6-1 and Local Rule 7. Except for motions set for hearing at a pretrial conference, parties must set motions for hearing on a Monday at 9:00 a.m. The Court does not hear motions on national holidays or closed motion dates, as maintained on the Court's webpage. It is not necessary to clear a hearing date with the Courtroom Deputy Clerk prior to the filing of a motion.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=6
  text: 'Please read this section carefully. This Court''s schedule for briefing motions differs significantly from the briefing schedule set by the Local Rules. Any motion that is filed and set for a hearing to be held fewer than 35 days from the date of the filing of the motion shall be briefed pursuant to Local Rules 7-9 and 7-10. Otherwise, motions shall be briefed according to the following schedule: Any motion that is filed and set for a hearing between 35 and 70 days from the date of the filing of the motion: (i) any opposition must be filed no later than 14 days after the filing of the motion; and (ii) any reply must be filed no later than 21 days after the filing of the motion. Any motion that is filed and set for a hearing more than 70 days from the date of the filing of the motion: (i) any opposition must be filed no later than 21 days after the filing of the motion; and (ii) any reply must be filed no later than 35 days after the filing of the motion.'
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=9
  text: If the Court deems a matter appropriate for decision without oral argument, the Court will notify the parties in advance. Requests to conduct or waive a hearing may not be honored.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mark-c-scarsi
  text: All proposed signature items shall be E-MAILED to the chambers e-mail address at mcs_chambers@cacd.uscourts.gov in WORD format. ONLY proposed order signature items should be emailed to the chambers' e-mail address.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=8
  text: Electronic nonpaper exhibits lodged under Local Rule 5-4.2(b)(1) (e.g., audio and video files) must be provided on a USB flash drive or by sending a link to an Internet file hosting service (e.g., Dropbox) by email to mcs_chambers@cacd.uscourts.gov. Exhibits provided on a CD or DVD will not be considered and will be destroyed unless the CD or DVD itself is a nonpaper exhibit subject to Local Rule 11-5.1. Chambers copies are not required. Unless subject to Local Rule 5-4.2, paper copies of any documents delivered to the Court will be refused or destroyed and not considered.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=13
  text: Counsel shall comply with Local Rule 79-5. All applications must provide the reason(s) why the parties' interest in maintaining the confidentiality of the document(s) outweighs the public's right of access to materials submitted in connection with a judicial proceeding. Counsel are ordered to meet and confer in person or by telephone at least seven calendar days prior to the filing of an application in which the basis for the requested sealing is stated to determine if they can agree on the proposed under seal filing. No later than two calendar days after the meet and confer process has concluded, the non-proposing party shall confirm whether it agrees to having such information designated as confidential or whether it opposes an under seal filing. Any application for under seal filing, whether or not opposed, shall contain the dates and method by which the parties met and conferred. If such information is not provided, the application will be denied without prejudice to an amended application being filed that complies with the foregoing terms.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=2
  text: Counsel for the applicant must provide advance notice of the application by telephone and email to all other parties. In addition to the information required by Local Rule 7-19.1, the notice must advise the other parties of the anticipated deadline to oppose the application. The applicant must serve the application by facsimile, email, or personal service, even if electronic service is effected under Local Rule 5-3.2.1. Oppositions to ex parte applications must be filed within 24 hours of the filing of the application, subject to Rule 6(a)(2). If an opposing party does not intend to oppose the ex parte application, counsel must inform the Courtroom Deputy Clerk by telephone or email as soon as possible. No replies in support of ex parte applications are authorized.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=5
  text: All discovery matters, including all discovery motions, are referred to the assigned United States Magistrate Judge. The Magistrate Judge's initials follow the District Judge's initials next to the case number on this Order. In accordance with 28 U.S.C. § 636(b)(1)(A), the Court will not reverse any order of the Magistrate Judge unless it has been shown that the Magistrate Judge's order is clearly erroneous or contrary to law.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=16
  text: Any party to this proceeding that uses a generative artificial intelligence platform (e.g., ChatGPT, Claude, Gemini, Copilot, Harvey, Protégé, and CoCounsel) (“Generative AI”) in connection with a filing in this matter must attach to the subject filing a separate declaration disclosing the use of Generative AI and certifying that the filer, in the exercise of the filer's independent legal judgment, has reviewed and verified the content of the filing as accurate and in compliance with Federal Rule of Civil Procedure 11. The declaration must identify which, if any, portion of the filing incorporates Generative AI outputs. The Court warns that a party who presents to the Court a pleading, written motion, or other paper incorporating inaccurate or undeclared Generative AI outputs may be subject to sanctions without further warning.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-mark-c-scarsi
  text: The Court does not permit remote appearances.
  unverified_sentences: 2
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=3
  text: This Court is committed to adhering to all scheduled dates. In general, this makes the judicial process more efficient and less costly. Changes in dates are sharply disfavored. The case schedule set by the Court, including the trial date, is firm and will rarely be changed. Therefore, any request, whether by application or stipulation, to continue the date of any matter before this Court must be supported by good cause demonstrating why the change in the date is essential. Without such compelling factual support, requests to continue dates set by this Court will not be approved. Counsel requesting a continuance must electronically file any application or stipulation with a proposed order and a detailed declaration of counsel providing the grounds for the requested continuance or extension of time. The Court will deny any request that fails to comply with the Local Rules and this Order. Stipulations and requests to amend the case schedule become effective only if, and when, this Court approves the stipulation as presented to, or modified by, the Court. The Court acts promptly to resolve requests to modify the case schedule, but processing delays of up to a week are not unusual; therefore, counsel shall not submit requests for a schedule modification fewer than seven calendar days prior to the earliest date subject to the request. The Court presumes that there is no good cause to continue any deadline that will pass within a week of a continuance request or has already passed.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e3077185-22c0-4917-0e78-08dee28213c9#page=2
  text: Lead trial counsel shall attend any motion hearing and any scheduling, pretrial, or settlement conference set by the Court. The Court does not permit special appearances; only counsel of record may appear at any proceeding. The Court expects counsel to appear in person at any hearing. The Court does not permit remote appearances. A party whose lead counsel cannot appear at a hearing for good cause may request leave to appear by non-lead counsel, an order advancing the hearing, or an order continuing the hearing no longer than one week. Such a request must be made by the Wednesday before the subject hearing and be supported by a declaration demonstrating good cause.
  unverified_sentences: 1
