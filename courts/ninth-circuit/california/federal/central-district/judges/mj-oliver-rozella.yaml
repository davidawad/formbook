  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/eeed216b-9277-42c2-b135-08ddf170325f
  text: 'Civil Motions: Civil Motions are heard on Wednesdays at 10:00 a.m. It is not necessary to clear a civil motion date with the Courtroom Deputy Clerk (CRD) prior to filing the motion. The Court may take any motion under submission without oral argument. This Court hears motions in consent cases on any non-holiday weekday except for Thursdays, beginning generally at 10 a.m. Most hearings are held by Zoom, and the moving party may notice their motion for a hearing by Zoom without prior approval of the Court.'
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-rozella-a-oliver
  text: Electronic copies of proposed orders shall be e-mailed to the Court at RAO_Chambers@cacd.uscourts.gov. Proposed orders must be in Microsoft Word format. All proposed orders approving stipulated protective orders must be submitted by email to RAO_Chambers@cacd.uscourts.gov (1) in Word format, and (2) with the full text of the stipulated protective order.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-rozella-a-oliver
  text: 'Mandatory Chambers Copies: Chambers copies of all e-filed documents are not required unless requested by the Court. Electronic copies of proposed orders shall be e-mailed to the Court at RAO_Chambers@cacd.uscourts.gov. Proposed orders must be in Microsoft Word format.'
