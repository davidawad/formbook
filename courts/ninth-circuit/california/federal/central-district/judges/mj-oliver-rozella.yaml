  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/eeed216b-9277-42c2-b135-08ddf170325f
  text: 'Ex Parte Applications: Strict compliance with Local Civil Rule 7-19 and 7-19.1 is required. Any opposition to an ex parte application should be filed and served within 24 hours (or one court day) of service of the application. Absent leave of court, replies are not permitted. Ex parte applications will generally be decided on the papers, without oral argument. The Court will notify the parties if a hearing is desired. [...] See Mission Power Eng''g Co. v. Cont''l Cas. Co., 883 F. Supp. 488, 490 (C.D. Cal. 1995).'
