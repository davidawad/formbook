- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-rozella-a-oliver
  text: 'Telephonic Appearances: All civil hearings are held telephonically unless noted by the Court. Call-in information will be provided by chambers via email. Special Appearances: The Court does not permit special appearances. Counsel of record must appear at all court proceedings.'
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/eeed216b-9277-42c2-b135-08ddf170325f
  text: For hearings that lead trial counsel does not attend, any attorney appearing on his or her behalf must be prepared and authorized to address the matter scheduled for the hearing. Any attorney appearing at a hearing must have already made an appearance in the matter or file a Notice of Appearance prior to the hearing. The Court does not permit special appearances; only counsel of record may appear at any proceeding.
