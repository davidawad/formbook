checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=8
  text: Time for Filing and Hearing Motions. Motions shall be filed in accordance with Local Rules 6 and 7. The Court hears motions in civil actions on Fridays, beginning at 1:30 p.m. It is not necessary to clear a hearing date with the Courtroom Deputy Clerk before filing a motion, except for motions for summary judgment, temporary restraining orders, or motions for a preliminary injunction. If the motion hearing date selected is not available, the Court will issue an order continuing the hearing.
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-cynthia-valenzuela
  text: All other motions must be noticed, served, and filed not later than twenty-eight (28) days before the hearing date. Oppositions must be filed and served not later than twenty-one (21) days before the hearing date. Replies must be filed and served not later than fourteen (14) days before the hearing date. See Local Rules 7-9, 7-10.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=11
  text: If the Court deems a matter appropriate for decision without oral argument, the Court will take the matter under submission and notify the parties before the hearing.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=15
  text: Each party filing or opposing a motion or seeking the determination of any matter shall serve and electronically lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. In addition, a copy of the proposed order in Word format shall be emailed directly to the Court's chambers email address at CV_Chambers@cacd.uscourts.gov on the day the document is e-filed. The parties must use the template for proposed orders available on Judge Valenzuela's Procedures and Schedules page on the Court's website. Failure to email a proposed order in Word format using the Court's template may result in the Court striking the motion, application, or stipulation without consideration of the request on its merits.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=16
  text: A mandatory chambers copy must comply with Local Rule 11-3 (i.e., font size, page numbering, exhibit tabbing, etc.) but need not be blue-backed. The mandatory chambers copy must be prominently labeled MANDATORY CHAMBERS COPY on the face page.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=16
  text: 'Local Rule 79-5 governs applications to file documents under seal. Local Rule 79-5.2.2 explains how to apply to file under seal and how to proceed if leave is granted. Parties must comply with all provisions of Local Rule 79-5. [...] Sealing must be justified for each individual item: blanket claims of confidentiality will result in the application to seal being denied. The parties also must meet and confer before filing an application to seal.'
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=18
  text: Following service of the ex parte application by electronic, facsimile, or personal service, the applicant shall notify the opposing party that any opposition must be filed no later than twenty-four (24) hours following service. Counsel will be notified by the clerk of the Court's ruling. If counsel does not intend to oppose an ex parte application, counsel must inform the Courtroom Deputy Clerk at (213) 894-0239.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=7
  text: All discovery matters are hereby referred to the assigned Magistrate Judge, who will hear all discovery disputes.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=14
  text: Items that do not require the Court's signature shall be e-filed in .pdf format. Proposed orders shall be e-filed in .pdf format as an attachment to the main documents.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=17
  text: The Court requires in-person attendance for all hearings and trials, unless otherwise instructed by the Court. The Court may permit appearances by telephone or video conference for status conferences upon a showing that a personal appearance will cause undue hardship.
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=18
  text: The Court has a strong interest in keeping scheduled dates certain. Changes in dates are disfavored. Trial dates set by the Court are firm and will not readily be changed. Therefore, a request to continue or extend the date of any matter before this Court must be supported by a sufficient factual basis that demonstrates good cause why the change in the date is essential. Counsel shall avoid submitting requests for continuance or extension of time less than five (5) business days prior to the expiration of the scheduled date. A request to continue or extend dates or deadlines that have already expired constitutes a presumptive lack of due diligence.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/3d73cbc0-d43a-4ef4-9910-68d2b48ffaaa#page=17
  text: The Court requires lead counsel to appear for scheduling conferences, settlement conferences, and the Final Pretrial Conference. The Court requires in-person attendance for all hearings and trials, unless otherwise instructed by the Court.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-cynthia-valenzuela
  text: Counsel shall notify the Courtroom Deputy Clerk as soon as a settlement of the action has been reached. The Court may assess jury fees against each side under Local Rule 40-3 if the notification of settlement occurs after 4:00 p.m. on the last business day prior to trial absent a showing of good cause.
