  text: 'TELEPHONIC APPEARANCES: Any party who wishes to appear at a hearing by telephone must file such a request at least two business days before the hearing. SPECIAL APPEARANCES: The Court typically does not permit special appearances. Counsel of record shall appear at all court proceedings, unless prevented by extraordinary circumstances.'
