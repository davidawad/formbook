  text: 'PROPOSED ORDERS FOR DISCOVERY MOTIONS: The moving party shall submit a proposed order per the procedures in Local Rule 5-4.4. The proposed order may be submitted with the Joint Stipulation or with the Supplemental Memorandum. [...] The proposed order shall state what relief is requested for the discovery requests in dispute. Electronic copies of proposed orders in Microsoft Word format must be e-mailed to the Court at KES_Chambers@cacd.uscourts.gov.'
