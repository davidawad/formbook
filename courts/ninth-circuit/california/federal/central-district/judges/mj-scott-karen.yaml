- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-e-scott
  text: 'PROCEDURE FOR PRESENTING DOCUMENTS ELECTRONICALLY FOR SEALING: Attorneys are required by Local Rule 79-5.2 to electronically file all sealed documents and applications for leave to file under seal in regular civil cases. The Clerk''s office has created a comprehensive guide to assist attorneys and their staff in how to electronically file under-seal documents. The guide is posted on the court website at http://www.cacd.uscourts.gov/e-filing/sealed-documents. When filing both an unredacted and a redacted version of a document, the unredacted version should highlight the proposed redactions so that the Court can see what materials the moving party wants to redact without needing to manually compare the redacted and unredacted versions. Failure to provide such highlighting may cause the Court to deny the sealing application without prejudice to its being refiled with the required highlighting.'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-e-scott
  text: 'EX PARTE APPLICATIONS: Compliance with Local Rules 7-19 and 7-19.1 is required. An ex parte application is usually considered on the papers only. An opposition should be served and filed within 24 hours of the electronic filing of the application. However, if the 24-hour period would end on a Saturday, Sunday or legal holiday, the period continues to run until the same time on the next day that is not a Saturday, Sunday or legal holiday. In most cases, the Court will wait until that time before ruling. If needed, the Court will schedule a hearing. Discovery disputes should generally not be brought to the Court''s attention in an ex parte application.'
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-e-scott
  text: GENERATIVE ARTIFICIAL INTELLIGENCE ("AI"). Counsel are hereby put on notice that AI tools used to draft legal briefs can make mistakes (sometimes called "hallucinations"), including citing non-existent legal authorities. As part of counsel's duties under Federal Rule of Civil Procedure 11, anyone who signs a brief or other court filing that was created, in whole or in part, using AI, certifies to the Court that they have checked and verified the accuracy of the cited legal authorities.
