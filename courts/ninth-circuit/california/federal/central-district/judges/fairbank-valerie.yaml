- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-valerie-b-fairbank
  text: Ex parte applications are for extraordinary relief. [...] Ex parte applications are normally considered on the papers and are rarely set for hearing. If a hearing is necessary, the parties will be notified. Applications that fail to conform to L.R. 7-19 and L.R. 7-19.1, including a statement of opposing counsel's position, will not be considered except on a specific showing of good cause. In addition to the requirements of L.R. 7-19 and L.R. 7-19.1, the moving party shall notify the opposition that opposing papers must be filed no later than twenty-four (24) hours following service, except in cases where the opposing party has not previously appeared (i.e. responded to the Complaint). In those cases where the opposing party has not previously appeared, the moving party shall notify the opposition that opposing papers must be filed no later than forty-eight (48) hours following service.
  unverified_sentences: 2
