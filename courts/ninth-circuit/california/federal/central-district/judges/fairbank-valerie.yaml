  text: Mandatory Chambers Copies All chambers copies must be delivered to the courtesy copy bins adjacent to the United States District Court Customer Service window, located on the fourth floor, Room 4300, of the U.S. Courthouse, 350 West First Street, Los Angeles, California 90012 In cases that are referred to a Magistrate Judge, parties should not provide courtesy paper copies of filings to District Judge Fairbank. Instead, please provide courtesy paper copies only to the Magistrate Judge’s chambers. Consult the assigned Magistrate Judge’s Procedures on this website.
