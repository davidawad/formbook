  text: See L.R. 79-5; Schwarzer, et al., Cal. Prac. 11(III)-C, §§ 11:1085-1087.7 (The Rutter Group 2006). [...] Litigants should also refer to “Preparing Sealed Documents for Filing” located under Filing Procedures on the Court's website for other requirements. For UNDER SEAL FILINGS, process documents the traditional way, but attach a Notice of Manual Filing to the paper copies delivered to the courtesy bin. DO NOT send these documents to the chamber's email. See below for additional information regarding under seal filings.
