- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: 'Civil Motions: Unless otherwise directed by the Court, civil motions are heard on Wednesdays at 10:00 a.m. It is not necessary to clear a civil motion date with the Courtroom Deputy Clerk (CRD) prior to filing the motion.'
  unverified_sentences: 3
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: 'Proposed orders shall be in Microsoft Word format. Form of Proposed Order: All proposed orders approving stipulated protective orders must be submitted (1) in Word format, and (2) including the full text of the stipulated protective order and the signatures of all stipulating counsel.'
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: Proposed orders shall be in Microsoft Word format. Failure to deliver timely mandatory chambers copies may result in a delay in hearing a motion or removal of the matter from the calendar.
  unverified_sentences: 2
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: Separately attach a proposed order to the electronically filed application. After electronically filing the application and declaration giving notice or proof of service, the moving party will send an e-mail to the Chambers e-mail (KS_Chambers@cacd.uscourts.gov) containing the application and declaration giving notice or a proof of service, a Word version of the proposed order, and a PDF version of the materials to be filed under seal.
  unverified_sentences: 2
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: 'Ex Parte Applications: Strict compliance with Local Civil Rules 7-19 and 7-19.1 is required. Any opposition should be served and filed within 24 hours of applicant''s oral notice. Conformed paper copies of the filed application and any opposition should be delivered directly to chambers. Ex parte applications will ordinarily be decided on the papers without oral argument. The Court will notify the parties if it desires a hearing. Absent an emergency, ex parte applications are not an acceptable method of bringing a discovery dispute to the attention of the Court.'
  unverified_sentences: 1
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: 'Tentative Rulings: If the Court determines that issuing a tentative ruling is appropriate, the ruling will be provided to counsel when counsel checks in with the CRD.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: 'Telephonic Appearances: Any party who wishes to appear at a hearing by telephone shall make such a request at least two court days before the hearing. Telephonic appearances are not allowed absent permission of the Court given on showing of good cause. Requests shall be made by formal pleading. Special Appearances: The Court does not permit special appearances. Counsel of record shall appear at all court proceedings.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-karen-l-stevenson
  text: 'Continuances: To request to reschedule a hearing, conference, or other court proceeding, the parties should submit a signed stipulation and proposed order at least three court days prior to the scheduled hearing date. If opposing counsel will not agree to a continuance, the requesting party should file an ex parte application setting forth its and opposing counsel''s position. In addition, the parties should notify the CRD as soon as the need to reschedule a hearing is discovered. Requests for Filing Extensions: Requests to extend any scheduled filing date (by either ex parte application or stipulation) shall be filed no later than three (3) court days prior to the scheduled date. Extensions are not allowed absent permission of the Court given on showing of good cause. Calendar Conflicts: The parties are to advise the CRD in advance about any calendar conflict and attempt to stipulate to an alternative date and time with opposing counsel. The alternative date and time should be cleared in advance with the CRD.'
