checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4b71648e-34b0-4994-dcbd-08ded8681b20
  text: 'Time for Filing and Hearing Motions: Motions shall be filed in accordance with Local Rule 7. This Court hears civil motions on Thursdays, beginning at 10:00 a.m. If Thursday is a national holiday, motions will be heard on the next Thursday. Closed motion dates can be found on the right column of Judge Frimpong''s webpage, below the Daily Calendar. It is not necessary to clear a hearing date with Judge Frimpong''s Courtroom Deputy Clerk before filing a motion, except for motions for summary judgment and preliminary injunction. For these two motions, contact the Courtroom Deputy Clerk via the Court''s chambers email address at MEMF_Chambers@cacd.uscourts.gov to reserve a hearing date.'
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4b71648e-34b0-4994-dcbd-08ded8681b20
  text: If at any time the hearing date on a motion is continued, there is no change to the default briefing schedule set forth above.
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4b71648e-34b0-4994-dcbd-08ded8681b20
  text: 'Oral Argument: Per the Court''s website, "Requests for a remote Zoom appearance must be e-filed by the Friday before the hearing and must indicate that counsel has met and conferred with opposing counsel consistent with Local Rule 7-3. If the Court deems a matter appropriate for decision without oral argument, the Court will take the matter under submission and notify the parties before the hearing.'
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-maame-ewusi-mensah-frimpong
  text: Each party filing or opposing a motion or seeking the determination of any matter shall serve and electronically lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. In addition, a copy of the proposed order in Microsoft Word format shall be emailed directly to the Court’s chambers email address at MEMF_Chambers@cacd.uscourts.gov on the day the document is electronically filed. All emails to chambers should include the case name and number in the subject line [before anything else]. A proposed order template is available on the bottom of Judge Frimpong’s webpage. The parties must use this template. Failure to submit a proposed order in Word format may result in the Court striking the motion, application, or stipulation without consideration of the request on its merits.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4b71648e-34b0-4994-dcbd-08ded8681b20
  text: The Court only requires one courtesy copy of motions for summary judgment and prefers binders with exhibit tabs for larger filings. Parties are required to submit any Statements of Uncontroverted Facts and Genuine Disputes in Excel, have all restrictions removed so the spreadsheets can be edited, and be emailed to the Court's chambers email address at MEMF_Chambers@cacd.uscourts.gov.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-maame-ewusi-mensah-frimpong
  text: 'Under Seal Filings: The Court requires strict compliance with Local Rule 79-5, which governs applications to file documents under seal. Local Rule 79-5.2.2 explains how to apply to file under seal and how to proceed if leave is granted. There is a strong presumption of access in civil actions. Foltz v. State Farm Mut. Auto. Ins. Co., 331 F.3d 1122, 1135 (9th Cir. 2003). Parties that submit frivolous motions to seal or overly broad motions will be subject to sanction. When submitting a motion to seal, the filing party must state whether the compelling reasons or good cause standard applies and explain why. See Center for Auto Safety v. Chrysler Group, LLC, 809 F.3d 1092, 1099 (9th Cir. 2016). The party must identify and discuss the factual and/or legal justification that establishes “good cause” or “compelling reasons” for the information to be protected. The filing party must make a specific showing explaining why each document that it seeks to seal may justifiably be sealed and why the proposed redactions are as narrowly tailored as possible, rather than making a blanket statement about the grounds for sealing. Generic and vague references to “competitive harm” are almost always insufficient justification for sealing. If a party files a request to seal that is significantly overbroad and/or does not provide adequate reasons for concealing information from the public, the party bears the risk that the Court will simply deny the request in its entirety and place all documents sought to be sealed on the public docket. Documents that are not confidential or privileged in their entirety should not be filed under seal if the confidential portions can be redacted and filed separately with a reasonable amount of effort. The parties should file a complete version of the documents under seal and a redacted version for public viewing, omitting only the portions that the Court has authorized to be filed under seal. Sealing must be justified for each individual item—blanket claims of confidentiality will result in the application to seal being denied. Counsel must consider carefully whether sealing or redaction is absolutely required for a given piece of evidence or argument. An application to seal that includes meritless requests to seal or redact documents will be denied. The parties also must meet and confer before filing an application to seal.'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4b71648e-34b0-4994-dcbd-08ded8681b20
  text: Applications that do not meet the requirements set forth in Local Rule 7-19 will not be considered. Sanctions may be imposed for misuse of ex parte applications. The parties may request a hearing along with a hearing date in the briefing. However, by default there will be no hearings on ex parte applications unless the Court sets one.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4b71648e-34b0-4994-dcbd-08ded8681b20
  text: All discovery matters have been referred to a magistrate judge, who will hear all discovery disputes. The magistrate judge's initials follow the district judge's initials next to the case number. All discovery documents must include the words "DISCOVERY MATTER" in the caption to ensure proper routing. Please do not deliver courtesy copies of discovery documents to Judge Frimpong's chambers. In accordance with 28 U.S.C. § 636(b)(1)(A), the magistrate judge's decision shall be final, and this Court will not reverse any order of the magistrate judge unless it has been shown that the magistrate judge's order is clearly erroneous and contrary to law.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/4b71648e-34b0-4994-dcbd-08ded8681b20
  text: All proposed signature items shall be e-filed as an attachment to the main document in PDF format. All proposed signature items shall be emailed to the courtroom deputy email address at MEMF_Chambers@cacd.uscourts.gov in Microsoft Word format. Only proposed order signature items should be emailed to the chambers' email address. Do not email other associated documents and do not use this email address for communication with the Court or the Clerk.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-maame-ewusi-mensah-frimpong
  text: 'All hearings shall proceed in-person, unless a request for Zoom is e-filed by the parties and granted by the Court. The link within Zoom Webinar Information Tab may be used only if ordered by the Court. Any request for a remote Zoom appearance must be made by the Friday before the hearing and must indicate that counsel has met and conferred with opposing counsel consistent with Local Rule 7-3. Oral Argument: Per the Court''s website, "Requests for a remote Zoom appearance must be e-filed by the Friday before the hearing and must indicate that counsel has met and conferred with opposing counsel consistent with Local Rule 7-3. If the Court deems a matter appropriate for decision without oral argument, the Court will take the matter under submission and notify the parties before the hearing.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-maame-ewusi-mensah-frimpong
  text: Counsel requesting a continuance must lodge, prior to the date to be continued, a proposed stipulation and order including a detailed declaration of the grounds for the requested continuance or extension of time. The Court grants continuances only upon a showing of good cause, focusing on the diligence of the party seeking the continuance and any prejudice that may result if the continuance is denied. Counsel are required to first meet and confer with opposing counsel regarding the substance of the continuance and include a statement of compliance with Local Rule 7-3 (see supra Section VII.A). Failure to meet and confer in good faith in compliance with the Local Rules and this Order may result in denial of the request for continuance.
