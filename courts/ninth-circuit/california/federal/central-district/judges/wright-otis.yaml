checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/47e18b58-ab3e-4ff2-a84d-d1a85eafb138
  text: It is not necessary to clear a motion date with the Court Clerk prior to filing the motion. [...] Criminal Motions -- Mondays at 10:00 a.m. only. Civil Motions -- Mondays at 1:30 p.m. only. Civil Pre-Trial Conferences -- Mondays at 1:30 p.m.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: Time for Filing and Hearing Motions - Motions shall be filed in accordance with Local Rules 6 and 7. This Court hears motions on Mondays, beginning at 1:30 p.m. If Monday is a national holiday, motions will be heard the following Monday. If the motion date selected is not available, the Court will issue a minute order continuing the date. When the Court continues a motion date in this way, the briefing schedule under Local Rules 7-9 and 7-10 shall apply to the originally noticed date, NOT the continued date. This means Local Rule 7-11 does not apply unless the Court expressly orders otherwise. Opposition or reply papers due on a holiday must be filed the preceding Friday (not the following Tuesday) and must be hand-delivered or faxed to opposing counsel on that Friday.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/9c1b5af0-1540-42c9-94ae-fd511f0d3ef8
  text: 'j. Oral Argument: The Court, in its discretion, may dispense with oral argument on a motion. Fed. R. Civ. P. 78(b); C.D. Cal. L.R. 7-15. However, the Court also encourages law firms to contribute to the professional development of new attorneys by allowing them to present oral argument to the Court on motions. To that end, if any party to a motion files a notice with the Court stating that an attorney with less than four years'' experience will present oral argument, the Court will hold a hearing on that motion. This notice must be filed no later than fourteen days before the hearing. The Court will take into account the attorney''s inexperience when considering their oral arguments.'
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: 'You must send the proposed order in word or word perfect to the chambers email address at: ODW_chambers@cacd.uscourts.gov. Failing to do so will result in your document being stricken for non-compliance.'
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e7f3a353-f75c-4b75-84fb-8024882fefc6#page=2
  text: 'Courtesy Copies: The Court requires courtesy copies only for Motions for Summary Judgment, motions necessitating a substantial evidentiary record, and pretrial documents. FOR THESE FILINGS ONLY, the Court requires one mandatory chambers copy of all related filed documents. USB flash drives should be submitted in lieu of compact discs. Chambers copies shall be delivered to and placed in the Judge''s courtesy box, located outside of the Clerk''s office on the 4th floor. Chambers copies of under seal documents shall be placed together in a manilla envelope labeled "UNDER SEAL. Courtesy copies DO NOT need to be blue-backed.'
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: UNDER SEAL FILINGS ALL "CIVIL ONLY" SEALED DOCUMENTS, please refer to L.R. 79-5.2 for instructions to submit. CRIMINAL SEALED" and IN CAMERA - procedures will remain the same (send an email with attachments to chambers email address). File the "Notice of Manual Filing" on the docket ONLY. Counsel shall EMAIL all under seal filings to ODW_Chambers@cacd.uscourts.gov. Follow the instructions below where applicable. [...] During the electronic filing process, attach the proposed order to the application. (Standard procedure for filing any application with proposed order). After electronically filing the application and proof of service, send an e-mail to ODW_Chambers@cacd.uscourts.gov containing a PDF of the application to seal, declaration giving notice or proof of service, Word or WP version of the proposed order and a PDF of the document to be filed under seal. [...] Prepare a title page for EACH document to be sealed. Send an e-mail to ODW_Chambers@cacd.uscourts.gov containing a PDF of the application to seal, declaration giving notice or a proof of service, Word or WP version of the proposed order and a PDF of the document to be filed under seal. IF A PROTECTIVE ORDER IS ALREADY ON FILE, ADVISE THE CLERK.
  unverified_sentences: 3
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: Ex Parte Applications - All ex parte applications will be decided on the papers and without a hearing unless the Court orders otherwise. The Court considers ex parte applications on the papers and does not usually set these matters for hearing. If a hearing is necessary, the parties will be notified. Ex parte applications are solely for extraordinary relief and should be used with discretion. Sanctions may be imposed for misuse of ex parte applications. See Mission Power Eng'g v. Cont'l Casualty Co., 883 F. Supp. 488 (C.D. Cal. 1995). Counsel's attention is directed to the Local Rules. Applications that fail to conform to Local Rule 7-19 and 7-19.1, including a statement of opposing counsel's position, will not be considered except on a specific showing of good cause. A party using PACER for electronic service is considered served once the ex parte application has been e-filed (all parties set up for electronic service are sent a notification of ECF filing each time a document is e-filed with a link to the document for one free view). Parties set up for service by fax or mail must be served the ex parte application by fax or mail. The moving party shall, following service of the ex parte papers by electronic service, facsimile transmission, or personal service, notify the opposing party that opposing papers must be filed no later than 24 hours following service, except in cases where the opposing party has not previously appeared (i.e., responded to the Complaint). In those cases where the opposing party has not previously appeared, the moving party shall, following service of the ex parte papers, notify the opposition that opposing papers must be filed no later than 48 hours following service. No party may file a reply unless expressly authorized by the Court.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: Discovery - All non-patent discovery matters have been referred to a United States Magistrate Judge. (The Magistrate Judge's initials follow the Judge's initials next to the case number.)
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: Any party who uses generative artificial intelligence (such as ChatGPT, Harvey, CoCounsel, or Google Bard) to generate any portion of a brief, pleading, or other filing must disclose the use of artificial intelligence and certify that the filer has reviewed the source material and verified that the artificially generated content is accurate and complies with the filer's Rule 11 obligations. The undersigned certifies that this submission ______ does not use _____ uses generative artificial intelligence. If generative artificial intelligence was used, following drafting, I reviewed, revised, and supplemented all portions of the brief, including those that were informed by the use of Artificial Intelligence or based on prior templates. I independently verified the factual and legal accuracy of the content and confirmed that all arguments and authorities were appropriate to the issues presented.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: 'Contact the Court Clerk by email: Sheila_english@cacd.uscourts.gov for the Court''s permission. The requesting attorney is responsible for coordinating and initiating the telephone call. No cellular or speaker telephones may be used.'
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-otis-d-wright-ii
  text: On the day of the appearance, if possible, request the other judge's Court Clerk to update Judge Wright's Court Clerk as to when counsel will be appearing in Judge Wright's courtroom. If counsel cannot make a court appearance, good cause must be shown. [...] Good cause must be shown. Refer to Local Rule 7-1 and 52-4 for the proper format. The Court has a strong interest in keeping scheduled dates certain. Changes in dates are disfavored. Trial dates set by the Court are firm and will rarely be changed. Therefore, a stipulation to continue the date of any matter before this Court must be supported by a sufficient basis that demonstrates good cause why the change in the date is essential.
  unverified_sentences: 3
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/9c1b5af0-1540-42c9-94ae-fd511f0d3ef8
  text: Presence of Lead Counsel – The attorney attending any proceeding before this Court, including all status and settlement conferences, must be the lead trial counsel. The attorney attending any proceeding before this Court must be an attorney who is thoroughly knowledgeable about the case, responsible for the conduct of the litigation, and who has authority to enter into stipulations and to make admissions regarding all matters that the participants reasonably anticipate may be discussed. Lead counsel who will actually try the case must attend the Pretrial Conference. A party who is not represented must attend all proceedings in person.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e7f3a353-f75c-4b75-84fb-8024882fefc6#page=22
  text: The parties must file a Status Report regarding settlement at the time they lodge the proposed PTCO. This Report shall not disclose the parties' settlement positions, i.e. the terms of any offers or demands. It shall merely describe the efforts made by the parties to resolve the dispute informally, i.e. the occasions and dates when the parties participated in mediation or settlement conferences. The Status Report shall also include the name and phone number of the Settlement Officer who assisted the parties with their settlement conference.
