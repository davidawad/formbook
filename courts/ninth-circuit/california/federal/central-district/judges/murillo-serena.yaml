checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=12
  text: Motions must be filed in accordance with Local Rules 6 and 7. Judge Murillo hears civil motions on Wednesday beginning at 1:30 p.m. It is not necessary to clear a hearing date with the CRD before filing a motion. Immediately before filing the motion, parties must check the closed motion dates column located on the right side of Judge Murillo's Procedures and Schedules Page on the Court's website to ensure the hearing date has not been closed.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=12
  text: To allow Chambers enough time to prepare, the parties must adhere to the briefing schedule set forth in Local Rules 7-9 and 7-10 for all motions, except Rule 56 motions. For Rule 56 motions, the parties should review and comply with Judge Murillo's Standing Order for Motions for Summary Judgment located on the Court's website.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=18
  text: Submission Without Oral Argument. Pursuant to Federal Rule of Civil Procedure 78 and Local Rule 7-15, the Court may deem a matter appropriate for decision without oral argument. If the Court does so, it will notify the parties before the hearing. Oral Argument Time Limits. If oral argument is permitted, the parties will have 10 minutes each for oral argument, unless the Court states otherwise.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=6
  text: Proposed Orders Must be Lodged and Served. Each party filing or opposing a motion or seeking the determination of any matter shall serve and lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. Use Applicable Templates. Use the "Proposed Order" template located on the Court's website under "Orders & Additional Documents" at the bottom of the webpage.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=7
  text: If ordered, Chambers Copies or materials must be delivered to Judge Murillo's mailbox on the Fourth Floor of the First Street Courthouse, 350 West First Street, Los Angeles, California 90012. Where applicable, any exhibits or declarations attached to chambers copies must be tabbed. Mandatory Chambers Copies need NOT be blue backed. Chambers copies must be delivered no later than 12:00 p.m. the following business day after the document is electronically filed.
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=8
  text: Local Rule 79-5 governs applications to file under seal. Parties must comply with all sections of Local Rule 79-5. ... Sealing must be justified for each individual confidential matter; blanket claims of confidentiality will result in the application to seal being denied. ... Counsel is ordered to meet and confer in person or by telephone at least seven calendar days before the filing of an application in which the basis for the requested sealing is stated to determine if they can agree on the proposed under seal filing.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=19
  text: Concurrently with service of the ex parte papers by electronic service and telephonic notice, counsel for the moving party shall also serve the non-moving party by either facsimile, email, or personal service, and give notice to the non-moving party that opposing papers must be filed no later than 24 hours (or one court day) following service. If counsel does not intend to oppose the ex parte application, counsel must inform the Courtroom Deputy Clerk by telephone or email as soon as possible.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=10
  text: All discovery matters are referred to the assigned United States Magistrate Judge. The Magistrate Judge's initials follow the Judge's initials next to the case number.
  unverified_sentences: 1
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=7
  text: 'Chambers copies must be printed from CM/ECF and must include: (1) the CM/ECF-generated header (consisting of the case number, document control number, date of filing, page number, etc.) at the top of each page; and (2) the NEF [notice of electronic filing] (see L.R. 5-3.2.1) as the last page of the document. Local Rule 5-4.5 (emphasis added).'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-serena-r-murillo
  text: ALL hearings will be heard IN PERSON in Courtroom 5D unless otherwise ordered by the court. Any request for a virtual appearance must be filed no later than five (5) court days before the court proceeding. Such a request must be supported by a declaration and proposed order setting forth good cause for the remote appearance. If the court grants the request, the party will be able to log-in via the Court's Zoom Information provided below. Otherwise, the Court's Zoom link will not be in service. Please do not contact the Courtroom Deputy to request permission to appear remotely.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=3
  text: If any counsel discovers a calendar conflict due to lead counsel's engagement in trial, counsel must inform opposing counsel and the Court's courtroom deputy (CRD) via Chambers email at SRM_chambers@cacd.uscourts.gov as soon as possible and not later than three days before the scheduled appearance. Counsel should attempt to agree on a new date to accommodate the calendar conflict. Counsel must propose a new date by Stipulation and Proposed Order. A "Notice of Unavailability" has no legal effect and should not be filed.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=2
  text: Lead trial counsel shall attend all proceedings set by this Court, including scheduling, settlement, pretrial conferences, and trial unless lead trial counsel is engaged in trial. [...] Only one attorney for a party may be designated as lead trial counsel unless otherwise permitted by the Court. If a second lead trial counsel is permitted by the Court, both counsel must attend the pretrial conference. The Court does not permit special appearances; only counsel of record may appear at any proceeding.
  unverified_sentences: 2
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/600eb2c9-c8fc-4edd-b5d7-7609abab5e5f#page=18
  text: Counsel must notify the Court at least two weeks before the scheduled hearing if the parties are conducting settlement discussions that may render the motion moot and must notify the Court immediately if a settlement is reached. A belated notice of settlement wastes scarce judicial resources.
