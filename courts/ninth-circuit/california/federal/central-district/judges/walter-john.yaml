- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-f-walter
  text: 'ORDER RE: ARTIFICIAL INTELLIGENCE: If any attorney for a party or a pro se party has used any generative artificial intelligence ("AI") in the preparation of any complaint, answer, motion, brief, or other document filed with the Court, the attorney or pro se party shall disclose that AI has been used in the preparation of the document, and CERTIFY that the attorney or pro se party has personally reviewed and verified the accuracy of all legal citations, quotations, factual statements, and analyses contained in the document. Failure to include such certification will result in the striking of the document.'
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-f-walter
  text: Tentative rulings are not issued.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-f-walter
  text: 'HEARINGS: All civil and criminal matters will be held in person unless instructed otherwise. At this time the Court is not conducting any telephonic or video conference hearings. Please do not email the clerk requesting a remote appearance. Should the parties still wish to request a remote appearance, no later than three (3) court days before the court proceeding an ex parte application and proposed order or stipulation and proposed order shall be filed. Such a request must be supported by a declaration setting forth good cause for the remote appearance. In the unlikely event the court grants the request, the type of remote appearance allowed will be at the court''s discretion.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-f-walter
  text: Continuances are granted only upon a showing of good cause. Requests for continuances must be made by motion, stipulation, or application with a separate proposed order accompanied by a declaration setting forth the reasons for the requested continuance. The declaration should also state whether there have been any prior requests for continuances and whether these requests were granted or denied by the Court and shall include all pending dates set by the Court. Stipulations extending dates set by this Court are not effective unless approved by the Court. Requests for continuance should be submitted well in advance of the requested relief. Requests for continuance not in compliance with the Court's Standing Order or the Local Rules will be denied.
