checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-f-walter
  text: 'Criminal Criminal matters are heard on: Monday at 8:00 a.m. Civil Civil motions are heard on: Monday at 1:30 p.m. Tentative rulings are not issued. It is not necessary to clear a motion date with the Courtroom Deputy Clerk ("CRD") before filing the motion. Before filing motions, the parties must check the section of this webpage regarding Closed Motion Dates to make sure the hearing date has not been closed. If a motion is calendared for a date that is closed, the Court will STRIKE the Motion. If Monday is a holiday, counsel shall choose the next available/open Monday hearing date.'
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-f-walter
  text: 'When a proposed order accompanies a filing, a WordPerfect or Word copy of the proposed order, along with a copy of the PDF electronically filed main document, shall be e-mailed to the Chamber''s e-mail address listed on the ECF Website. The subject line of the e-mail shall be in the following format: court''s divisional office, year, case type, case number, document control number assigned to the main document at the time of filing, judge''s initials and filer (party) name. Failure to comply with this requirement may result in the denial or striking of the request or the Court may withhold ruling on the request until the Court receives the required documents.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-john-f-walter
  text: Counsel are ORDERED to deliver 2 copies of all documents filed electronically to Chambers. For each document filed electronically, one copy shall be marked "CHAMBERS COPY" and the other copy shall be marked "COURTESY COPY. The copies of each electronically filed document must include on each page the running header created by the ECF system. In addition, on the first page of each copy, in the space between lines 1-7 to the right of the center, counsel shall include the date the document was e-filed and the document number. The copies shall be delivered to Chambers no later than 10:00 a.m. on the next business day after the document was electronically filed. For any document that is not required to be filed electronically, counsel are ORDERED to deliver 1 conformed copy of the document, which shall be marked "COURTESY COPY" to Chambers at the time of filing. Judge Walter's courtesy box is located outside Chambers on the 7th floor. Do not buzz Chambers regarding delivery of documents.
