checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=4
  text: Motions shall be filed in accordance with Local Rule 7. This court hears motions on Thursdays, beginning at 10:00 a.m. If Thursday is a court holiday, motions will be heard on the next Thursday. Counsel shall not contact the Courtroom Deputy to clear or reserve a civil motion hearing date. A list of closed dates is located on Judge Slaughter's webpage.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=9
  text: 'Opposition: Must be filed twenty-eight (28) days before the noticed hearing date. Reply: Must be filed twenty-one (21) days before the noticed hearing date. Any briefing schedule must provide the court at least twenty-one (21) days between the reply deadline and the hearing date.'
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=6
  text: If the court deems a matter appropriate for decision without oral argument, the court will take the matter under submission and notify the parties before the hearing.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=12
  text: Each party filing or opposing a motion or seeking the determination of any matter shall file, serve, and electronically lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. The court requires strict compliance with Local Rule 5-4.4.2, which states that "a Microsoft Word copy of the proposed document, along with a PDF copy of the electronically filed main document, shall be e-mailed to the assigned judge's generic chambers e-mail address," which for this court is FWS_Chambers@cacd.uscourts.gov. The court will not consider a motion, stipulation, ex parte application, or other request for relief unless a compliant proposed order is received by email. A filing may be stricken for failure to timely comply.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=13
  text: Notwithstanding any contrary provision in the Local Rules, Judge Slaughter does not require parties to provide Mandatory Chambers Copies of documents filed through the court's CM/ECF System in civil cases unless otherwise ordered by the court. No party shall deliver a Mandatory Chambers Copy to Judge Slaughter in a civil case unless specifically ordered to do so. If the court does order chambers copies, such copies shall be delivered to Judge Slaughter's chambers copy box on the 10th Floor of the Ronald Reagan Federal Building and United States Courthouse in Santa Ana or sent via overnight mail. If sent by overnight mail, the sender shall notify the delivery service that the signature of the recipient is not required. Mandatory chambers copies of sealed documents shall be delivered to the Clerk's Office Intake window, to be placed in the court's internal mail box. If the mandatory chambers copy of a document is an inch or more thick, the filing party should place the court's copy in a three-ring binder (no blue backing is required).
  unverified_sentences: 1
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=12
  text: Local Rule 79-5.2.2 explains how to apply to file under seal and how to proceed if leave is granted. Parties must comply with all provisions of Local Rule 79-5. For each document or other type of information a party seeks to file under seal, the party must identify and discuss the factual and/or legal justification that establishes "good cause" or "compelling reasons" for the information to be protected. Documents that are not confidential or privileged in their entirety should not be filed under seal if the confidential portions can be redacted and filed separately with a reasonable amount of effort. Sealing must be justified for each individual item—blanket claims of confidentiality will result in the application to seal being denied. The parties also must meet and confer before filing an application to seal.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=13
  text: Ex parte applications are solely for extraordinary relief. To justify ex parte relief, there must be a showing of irreparable prejudice and that the moving party is without fault, or that the crisis occurred as a result of excusable neglect. The court considers ex parte applications on the papers. Accordingly, counsel need not set ex parte applications for a hearing date.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=3
  text: All discovery matters have been referred to a Magistrate Judge, who will hear all discovery disputes. The Magistrate Judge's initials follow the District Judge's initials next to the case number.
- topic: Exhibits and ECF
  field: ecf_stamp_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=5
  text: Counsel shall adhere to Local Rule 5-4.3 with respect to the conversion of all documents to .pdf format so that when a document is electronically filed, it is in proper size and is .pdf searchable. Further, all documents shall be filed in a format so that text can be selected, copied, and pasted directly from the document. All documents—including pleadings, motions, and exhibits—submitted to the court must be text-searchable (i.e., "OCR'd").
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=6
  text: Any party who uses generative artificial intelligence (such as ChatGPT, Harvey, CoCounsel, or Google Bard) to generate any portion of a motion, brief, pleading, or other filing must attach to the filing a separate declaration disclosing the use of artificial intelligence and certifying that the filer has reviewed the source material and verified that the artificially generated content is accurate and complies with the filer's Rule 11 obligations.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-fred-w-slaughter
  text: ALL hearings will be heard IN PERSON in Courtroom 10D unless otherwise ordered by the court. Any request for a telephonic appearance must be filed no later than five (5) court days before the court proceeding. Such a request must be supported by a declaration and proposed order setting forth good cause for the remote appearance.
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=3
  text: Counsel shall notify both of the Judges' courtroom deputies at least three (3) days in advance. Counsel should defer to the most senior of the judges. A priority before that Judge should be requested. A "Notice of Unavailability" has no legal effect and should not be filed. Continuances are granted only on a showing of good cause. See Fed. R. Civ. P. 16(b)(4). [...] Stipulations extending dates set by this court are not effective unless approved by the court.
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/26c7e990-34b1-41f3-4d99-08dedec318af#page=2
  text: Lead trial counsel shall attend any proceeding before this court, including all Scheduling, Pretrial, and Settlement Conferences. In an effort to provide more experience to the next generation of practitioners, the court encourages lead counsel to permit junior counsel to fully participate in court proceedings, including to argue motions and to examine witnesses at trial.
  unverified_sentences: 1
