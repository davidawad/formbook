checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b6122c8d-64da-4f17-bfad-226c1f1352e4
  text: Civil motions are heard on Mondays at 1:30 p.m. Criminal motions are heard on Mondays at 8:30 a.m. If Monday is a holiday, the next motion date is the following Monday. It is not necessary to clear a motion date with the Courtroom Deputy Clerk (CRD) before filing the motion. This Court hears civil motions on Mondays, beginning at 1:30 p.m. If Monday is a court holiday, motions will be heard on the next Monday. If the motion date selected is not available, the Court will issue a minute order continuing the date. Opposition papers due on a Monday holiday may be filed the following Tuesday.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b6122c8d-64da-4f17-bfad-226c1f1352e4
  text: 'Proposed orders should not contain attorney names, addresses, etc. on the caption page, should not contain a footer with the document name or other information, and should not contain a watermark or designation of the firm name, etc. in the margin. Proposed orders must have Judge Fischer’s name spelled correctly and her correct title: United States District Judge. Documents that do not meet this requirement may be stricken. Proposed orders must include Judge Fischer’s correct name and title: Dale S. Fischer, United States District Judge. Orders with an incorrect spelling or title will not be signed.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dale-s-fischer
  text: Mandatory chambers copies will resume on June 21, 2021. Parties must comply with the Court's Standing Orders governing "Chambers Copies. Chambers Copies must be delivered to Judge Fischer's mailbox outside the Clerk's Office on the Fourth Floor of the First Street Courthouse, no later than 12:00 p.m. on the first court day after the filing date, or on the same day if priority processing is requested.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b6122c8d-64da-4f17-bfad-226c1f1352e4
  text: 'Proposed protective orders should not purport to allow, without further order of Judge Fischer, the filing under seal of pleadings or documents filed in connection with a dispositive motion (including a class certification motion) or trial before Judge Fischer. The existence of a protective order does not alone justify the filing of pleadings or other documents under seal, in whole or in part. CRIMINAL UNDER SEAL FILINGS ONLY: Please refer to the pilot program procedures linked below for detailed instructions for submission of sealed documents.'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b6122c8d-64da-4f17-bfad-226c1f1352e4
  text: In addition to the requirements of Local Rule 7-19, the moving party must notify the opposition that opposing papers are to be filed no later than 48 hours (or two court days) following service. The Court generally will not rule on any application for such relief for at least 48 hours (or two court days) after the party subject to the requested order has been served, unless service is excused. Opposing counsel should advise the courtroom deputy clerk as soon as possible whether the opposing party intends to oppose the ex parte application. The Court considers ex parte applications on the papers and usually does not set these matters for hearing. The application will not be considered until a mandatory chambers copy has been provided.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b6122c8d-64da-4f17-bfad-226c1f1352e4
  text: All discovery matters are referred to the assigned magistrate judge. All discovery documents must include the words “DISCOVERY MATTER” in the caption to ensure proper routing. Counsel should not deliver Chambers copies of these documents to Judge Fischer. All discovery motions and stipulations, including those relating to protective orders, are to be calendared before the assigned magistrate judge.
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dale-s-fischer
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dale-s-fischer
  text: The Court is unlikely to agree to a telephonic appearance in the absence of extraordinary circumstances preventing counsel from appearing in person. If your matter is to be held by Zoom you will be advised prior to the date set for hearing. If you do not hear from the Court as to your matter and it remains on calendar a personal appearance will be required.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-dale-s-fischer
  text: No stipulation extending the time to file any required document or to continue any date is effective until and unless the Court approves it, or unless the Federal Rules of Civil Procedure provide for an automatic extension. The request must be made before the date to be continued. The Court grants continuances only on a showing of good cause. If counsel has a conflicting appearance in the court of a more senior district judge, counsel must email the CRD indicating the time of the appearance, the case name, and the name of the other judge. On the day of the appearance, if possible, ask the other judge’s CRD to update Judge Fischer’s CRD as to when counsel is likely to be released from the other judge’s courtroom. If counsel will be late or cannot make a court appearance for any other reason, good cause must be shown.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/b6122c8d-64da-4f17-bfad-226c1f1352e4
  text: Lead trial counsel must attend any proceeding set by this Court, including all scheduling, pretrial, and settlement conferences. Only ONE attorney for a party may be designated as lead trial counsel unless otherwise permitted by the Court. Counsel should not claim to be co-lead trial counsel for the purpose of avoiding this requirement. If counsel purport to be co-lead trial counsel, both must attend the pretrial conference. Unless lead trial counsel’s absence is excused by the Court for good cause in advance of the hearing, or is due to an emergency that prevented prior notice, the Court reserves the right to designate the attorney handling such proceeding as lead counsel for all purposes. Failure of lead counsel to appear will be grounds for sanctions. Neither local counsel nor other counsel designated as trial counsel may appear at a scheduling conference in place of lead trial counsel.
