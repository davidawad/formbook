checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0#page=5
  text: Motions shall be filed in accordance with Local Rules 6 and 7. The court hears motions in civil actions on Fridays, beginning at 1:30 p.m. It is not necessary to clear a hearing date with the Courtroom Deputy Clerk before filing a motion, except for motions for summary judgment, temporary restraining orders, or preliminary injunctions. Criminal motions are heard on Friday at 10:30 a.m. Civil motions are heard on Friday at 1:30 p.m. [...] If you do, the court will re-calendar the matter for another Friday.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/Jps/honorable-fernando-l-aenlle-rocha
  text: Motions made pursuant to Fed. R. Civ. P. 56 must be noticed, served, and filed no later than thirty-five (35) days before the hearing date... Oppositions must be filed and served not later than twenty-one (21) days before the hearing date. Replies must be filed and served not later than fourteen (14) days before the hearing date. All other motions must be noticed, served, and filed not later than twenty-eight (28) days before the hearing date.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0#page=7
  text: If the court deems a matter appropriate for decision without oral argument, the court will take the matter under submission and notify the parties before the hearing. The parties' lead counsel are encouraged to permit junior or less experienced litigators to participate in court proceedings, including to argue motions and to examine witnesses at trial. The court is more likely to hear oral argument if a party notes in its moving or opposing papers, in bold and underlined font, that a litigator who graduated from law school within the last five (5) years, or otherwise has had minimal oral advocacy experience, will conduct the argument.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0#page=14
  text: Each party filing or opposing a motion or seeking the determination of any matter shall serve and electronically lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale... a copy of the proposed order in Word format shall be emailed directly to the court's chambers email address at fla_chambers@cacd.uscourts.gov on the day the document is e-filed. The parties must use the template for proposed orders available on Judge Aenlle-Rocha's webpage...
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0#page=14
  text: The processing of unnecessary chambers copies wastes resources and burdens the court. Chambers copies should not be submitted unless requested. This order, however, is not intended to affect the parties' ability to file and lodge documents and materials that are exempt from electronic filing under Local Rule 5-4.2. The court refers the parties to the Scheduling and Trial Order for details regarding mandatory chambers copies for pretrial documents and trial exhibits. The court does not require chambers copies of any motion papers or exhibits, and discourages the parties from sending courtesy copies to chambers.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0#page=15
  text: 'Local Rule 79-5 governs applications to file documents under seal... There is a strong presumption of access in civil actions. Foltz v. State Farm Mut. Auto. Ins. Co., 331 F.3d 1122, 1135 (9th Cir. 2003). [...] Sealing must be justified for each individual item: blanket claims of confidentiality will result in the application to seal being denied. The parties also must meet and confer before filing an application to seal.'
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0#page=16
  text: The court considers ex parte applications on the papers and does not usually set these matters for hearing... Ex parte applications are solely for extraordinary relief... Sanctions may be imposed for misuse of ex parte applications. See Mission Power Eng'g Co. v. Cont'l Cas. Co., 883 F. Supp. 488 (C.D. Cal. 1995). Ex parte applications that fail to conform to Local Rules 7-19 and 7-19.1, including a statement of opposing counsel's position, will not be considered except upon a specific showing of good cause... the moving party shall notify the opposing party that any opposition must be filed no later than twenty-four (24) hours following service.
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0
  text: All discovery matters are hereby referred to the assigned Magistrate Judge, who will hear all discovery disputes. The Magistrate Judge’s initials follow the district judge’s initials next to the action number. All discovery-related documents must include the words “DISCOVERY MATTER” in the caption to ensure proper routing. Counsel are directed to contact the Magistrate Judge’s Courtroom Deputy Clerk to schedule matters for hearing and must follow the Magistrate Judge’s procedures for scheduling matters for hearing. These procedures are stated on each Magistrate Judge’s webpage. All discovery motions and stipulations, including those relating to protective orders, are to be calendared before the Magistrate Judge whose initials appear in parentheses after the case number.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0
  text: 'The court requires in-person attendance for all hearings and trials, unless otherwise instructed by the court. The court may permit appearances by telephone or video conference for status conferences upon a showing that a personal appearance will cause undue hardship. If you wish to appear by telephone or video conference, you must: 1. email the Courtroom Deputy Clerk and copy opposing counsel at least three (3) court days in advance of the scheduled appearance and provide a detailed statement of undue hardship; 2. use a landline to call into the bridge line provided by the Courtroom Deputy Clerk or use a hardline internet connection to connect to the Zoom link for the court; and 3. be available and ready to call in for at least fifteen (15) minutes before the time of the scheduled hearing.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/f7ed8f08-850f-4df8-9043-d6d3a41638e0
  text: The court has a strong interest in keeping scheduled dates certain. Changes in dates are disfavored. Trial dates set by the court are firm and will not readily be changed. Therefore, a request to continue or extend the date of any matter before this court must be supported by a sufficient factual basis that demonstrates good cause why the change in the date is essential. Without such compelling factual support and a showing of due diligence, requests continuing dates will not be approved. Counsel requesting a continuance or extension of time must file electronically a request or, if the parties are in agreement, a stipulation which includes a detailed declaration of the grounds for the requested continuance or extension of time. A proposed order in Word format must be emailed directly to the court’s chambers email address at fla_chambers@cacd.uscourts.gov on the day the document is e-filed. The proposed order must include the entire relief the parties seek. Failure to comply with the Local Rules and this Order will result in rejection of the request without further notice to the parties. Requests extending scheduling dates do not become effective unless and until this court so orders. Counsel shall avoid submitting requests for continuance or extension of time less than five (5) business days prior to the expiration of the scheduled date. A request to continue or extend dates or deadlines that have already expired constitutes a presumptive lack of due diligence. If any counsel discovers a calendar conflict with a scheduled appearance in a court of a more senior district judge, counsel must inform opposing counsel and the Courtroom Deputy Clerk via chambers email address at twyla_freeman@cacd.uscourts.gov as soon as possible and not later than three (3) business days before the scheduled appearance. Counsel should attempt to agree on a new date to accommodate the calendar conflict. Counsel must propose a new date by Stipulation and [Proposed] Order.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/e7b1b851-7ee1-4f48-af4f-75bd4d2ef52f#page=6
  text: The parties' lead counsel are encouraged to permit junior or less experienced litigators to participate in court proceedings, including to argue motions and to examine witnesses at trial. The court is more likely to hear oral argument if a party notes in its moving or opposing papers, in bold and underlined font, that a litigator who graduated from law school within the last five (5) years, or otherwise has had minimal oral advocacy experience, will conduct the argument.
  unverified_sentences: 1
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-fernando-l-aenlle-rocha
  text: Counsel shall notify the Courtroom Deputy Clerk as soon as a settlement of the action has been reached. The court may assess jury fees against each side under Local Rule 40-3 if the notification of settlement occurs after 4:00 p.m. on the last business day prior to trial, absent a showing of good cause.
