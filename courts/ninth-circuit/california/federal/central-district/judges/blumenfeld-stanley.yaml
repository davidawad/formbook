checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=9
  text: This Court hears civil motions on Fridays at 8:30 a.m. If Friday is a court holiday, select another Friday. Opposition or reply papers due on a Friday holiday may be filed the following Monday. Hearing dates are closed at least four weeks in advance, and closed hearing dates are noted on Judge Blumenfeld's webpage. A motion filed on a closed hearing date will be stricken or continued at the Court's discretion. A party that waits too long and files a motion to be heard on a date that turns out to be unavailable risks having the motion stricken and not considered at all.
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=15
  text: The Court may take a motion off calendar if it concludes the decision will not benefit from oral argument.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=7
  text: 'Each party filing a motion or seeking the determination of any matter shall serve and lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. [...] Failure to do so may result in the striking of the request. Proposed orders should not contain: (1) attorney names, addresses, etc. on the caption page; (2) a footer with the document name or other information; or (3) a watermark or designation of the firm name. Proposed orders should be formatted in the same fashion as motions. Consistent with Local Rule 5-4.4.2, the Court strictly requires that a Microsoft Word copy of a proposed order, along with a PDF copy of the electronically filed main document, be e-mailed to the chambers e-mail address. The Court will not consider a stipulation, ex parte application, or other request for relief until a compliant proposed order is received by email. A filing may be stricken for failure to timely comply.'
  unverified_sentences: 2
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=7
  text: 'i. Timeliness and location. Deliver chambers copies promptly to Judge Blumenfeld''s mailbox outside the Clerk''s Office on the fourth floor of the First Street Courthouse. Applicable documents will not be considered until chambers copies are submitted. [...] Filings that include highlighting, color photographs, "redlining," or the like should be printed in color. Short filings should be fastened by a staple or binder clip in the top left corner. Larger filings should be delivered in a three-ring binder. Binders must have both a cover sheet and a spine label that includes the case name, case number, and a description of the contents. Separate all exhibits by a tab divider on the right or bottom of the document. If the evidence exceeds 50 pages, the chambers copy must: (1) include a table of contents; and (2) be in a tabbed three-ring binder with each exhibit separated by a tab divider on the right or the bottom.'
  unverified_sentences: 2
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=15
  text: If the Court has previously granted leave to seal a particular exhibit, the parties need not file a new application to file that exhibit under seal in connection with a new filing. The parties may simply file the exhibit under seal together with a statement that the Court has already permitted sealing of the exhibit, with a citation to the relevant order.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=17
  text: The applicant must (1) notify the other party (or parties) that opposing papers are to be filed no later than 48 hours following service or by 3:00 p.m. on the first court day after the service, whichever is later, and (2) advise the Court in a declaration whether any party opposes the application.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=5
  text: All discovery matters are referred to the assigned magistrate judge. All discovery documents must include the words "DISCOVERY MATTER" in the caption to ensure proper routing. Do not deliver chambers copies of these documents to Judge Blumenfeld.
  unverified_sentences: 1
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=6
  text: Any party who uses generative artificial intelligence (such as ChatGPT, Harvey, CoCounsel, or Google Bard) to generate any portion of a brief, pleading, or other filing must attach to the filing a separate declaration disclosing the use of artificial intelligence and certifying that the filer has reviewed the source material and verified that the artificially generated content is accurate and complies with the filer's Rule 11 obligations.
  unverified_sentences: 1
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=16
  text: The Court often issues written tentative rulings and makes them available on Judge Blumenfeld's webpage the afternoon before the hearing by 6:00 p.m. The purpose of the tentative ruling is to focus the discussion at the hearing.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=15
  text: Remote appearances are not permitted absent good cause shown in a declaration concurrently filed with the moving papers or the opposition. Absent a concurrent filing, a party requesting to appear remotely must submit a declaration establishing that the party is unable to appear in person due to an unanticipated and unavoidable emergency and that the request was made promptly upon learning of the emergency. Instructions for remote appearance can be found on Judge Blumenfeld's webpage. Counsel appearing remotely are responsible for ensuring that their equipment and the internet connection in the location from which they will be participating are reliable and adequate for uninterrupted video participation.
  unverified_sentences: 1
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=17
  text: 'The Court grants continuances of pretrial and trial deadlines only on a timely showing of good cause. [...] Good cause requires a specific, detailed, and non-conclusory showing of diligence from the outset of the case, describing: (1) all relevant work previously done (including when each item was completed), (2) all relevant work that remains to be done, (3) why the remaining work could not previously have been done (including efforts made to complete each remaining item), and (4) why the amount of time requested is needed to complete the remaining work.'
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=2
  text: Only one attorney for a party may be designated as lead counsel—and the designation must appear on the docket if a party has more than one attorney. Lead counsel must attend all proceedings other than motion hearings. For motion hearings, lead counsel is encouraged to permit junior lawyers to participate. Only one counsel may be designated to argue a motion absent Court approval.
  unverified_sentences: 1
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/JpsApi/file/d722706b-9e07-4f2d-d1c5-08de5387c55f#page=3
  text: Counsel must advise the Court immediately if (1) the case or any pending matter has been resolved or (2) a motion is pending and the parties are engaged in serious negotiations that appear likely to resolve the case or the pending motion (as discussed in more detail in § 8(f), infra). Failure to provide timely notice of settlement may result in sanctions. The filing of a settlement notice does not excuse counsel from appearing at any scheduled hearing or conference that has not been vacated. [...] Counsel must notify the Court at least two weeks before the scheduled hearing if the parties are conducting settlement discussions that may render the motion moot and must notify the Court immediately if a settlement is reached.
  unverified_sentences: 3
