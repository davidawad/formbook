checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c
  text: 'Time for Filing and Hearing Motions: Motions shall be filed in accordance with Local Rules 6 and 7. [...] If the motion date selected is not available, the Court will continue the hearing to the next available date on the Court’s calendar. Civil motions are heard on Fridays at 1:30 p.m. Criminal motions are heard on Fridays at 10 a.m.'
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c
  text: 'Time for Filing and Hearing Motions: Motions shall be filed in accordance with Local Rules 6 and 7. [...] If the motion date selected is not available, the Court will continue the hearing to the next available date on the Court’s calendar. (Counsel are advised to check the availability of a selected date immediately prior to filing the motion.) Opposition or reply papers due on a holiday must be filed the preceding business day (i.e., Thursday)—not the following business day (i.e., Monday)—and must be hand-delivered or emailed to opposing counsel on the preceding business day.'
  unverified_sentences: 1
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c#page=8
  text: 'Oral Argument: The Court strongly prefers in-person appearances. Requests for a remote appearance will only be considered upon a written application filed at least seven (7) days before the hearing and supported by an appropriate declaration establishing good cause. The Court typically disfavors holding hearings on civil motions. If the Court requires oral argument, counsel are allocated ten (10) minutes per side total, including time for rebuttal arguments. If the Court deems a matter appropriate for decision without oral argument, the Court will notify the parties at least twenty-four (24) hours in advance. Unless otherwise notified, oral argument will be heard for all noticed motions.'
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c#page=12
  text: Proposed Orders must be on pleading paper and must not include attorney information on the caption page, should not contain a footer with the document name or other information, and should not contain a watermark or designation of the firm name in the margin. In addition, a copy of the proposed order in Word format shall be emailed directly to the Court's chambers email address at MWC_Chambers@cacd.uscourts.gov on the date the document is electronically filed. If the proposed order is based on a stipulation or an ex parte application, counsel must email both the order and the stipulation or ex parte application. Otherwise, accompanying documents (such as motions) should not be emailed to chambers.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c#page=12
  text: In the rare instance in which the Court would like chambers copies for a particular situation, the Court will issue an order requesting them.
  unverified_sentences: 1
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c#page=13
  text: If a hearing is necessary, the parties will be notified. Ex parte applications are solely for extraordinary relief, are rarely granted, and should be used with discretion. Sanctions may be imposed for misuse of ex parte applications. See Mission Power Eng'g Co. v. Cont'l Cas. Co., 883 F. Supp. 488 (C.D. Cal. 1995). Ex parte applications that fail to conform to Local Rule 7-19 will not be considered, except on a specific showing of good cause. Counsel for the applicant must provide advance notice of the application by telephone and email to all other parties. In addition to the information required by Local Rule 7-19.1, the notice must advise the other parties of the anticipated deadline to oppose the application. The applicant must serve the application by facsimile, email, or personal service, even if electronic service is effected under Local Rule 5-3.2.1. Oppositions to ex parte applications must be filed within 24 hours of the filing of the application, subject to Rule 6(a)(2). If an opposing party does not intend to oppose the ex parte application, counsel must inform the Courtroom Deputy Clerk by email as soon as possible.
  unverified_sentences: 1
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c
  text: All discovery matters have been referred to a United States Magistrate Judge to hear all discovery disputes. (The Magistrate Judge’s initials follow the Judge’s initials next to the case number.) All discovery-related disputes have been referred to and will be heard by an assigned Magistrate Judge.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c#page=3
  text: The preparer of the filing must certify that either (a) no portion of the filing was drafted by AI, or that (b) AI was used in drafting a portion of the filing, and that the filer has reviewed the source material and verified that the artificially generated content is accurate and complies with the filer's Rule 11 obligations. The declaration must identify which, if any, portion of the filing incorporates Generative AI outputs. The Court warns that a party who presents to the Court a pleading, written motion, or other paper incorporating inaccurate or undeclared Generative AI outputs may be subject to sanctions, including referral to the State Bar, without further warning. See Fed. R. Civ. P. 11(c). Failure to submit a declaration attesting to the use or non-use of AI may result in the Court striking the filing.
  unverified_sentences: 1
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c
  text: 'Oral Argument: The Court strongly prefers in-person appearances. Requests for a remote appearance will only be considered upon a written application filed at least seven (7) days before the hearing and supported by an appropriate declaration establishing good cause. The Court does not permit appearances or arguments by way of telephone conference calls. By default, all scheduling conferences shall proceed in-person, unless a request is made by the parties and granted by the Court. Requests to appear via Zoom must be e-filed seven (7) days before the conference, supported by an appropriate declaration establishing good cause, and must indicate that counsel has met and conferred per Local Rule 7-3.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c#page=13
  text: 'Changes in dates are strongly disfavored and rarely granted. Trial dates set by the Court are firm and will rarely be changed. Therefore, a stipulation to continue the date of any matter before this Court must be supported by a sufficient basis that demonstrates good cause why the change in the date is essential. Without such compelling factual support, stipulations continuing dates set by this Court will not be approved. Counsel requesting a continuance must lodge a proposed stipulation and order including a detailed declaration of the grounds for the requested continuance or extension of time. The requesting party must also set forth: (1) whether there have been prior requests for extension, (2) whether these requests were granted by the Court, (3) a description of the diligence of the party seeking the continuance, and (4) any prejudice that may result if the continuance is denied. Failure to comply with the Local Rules and this Order will result in rejection of the request.'
  unverified_sentences: 1
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/7e7a0336-d4d0-4af7-317f-08df0388792c#page=4
  text: 'All requests to substitute another attorney in place of lead counsel must be filed at least seven (7) days prior to the Court proceeding. Participation: If the Court elects to conduct a Scheduling Conference, lead trial counsel must attend unless excused by the Court for good cause before the conference.'
  unverified_sentences: 1
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-michelle-williams-court
  text: 'Settlement: When a motion is calendared or under submission, counsel are required to inform the Court promptly of any finalized or imminent settlement that may render the motion moot.'
