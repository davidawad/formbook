checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6#page=5
  text: This Court hears civil motions on Thursdays at 10:00 a.m. If Thursday is a national holiday, motions will be heard on the next Thursday. It is not necessary to clear a hearing date with Judge Vera's Courtroom Deputy Clerk before filing a motion. [...] Criminal motions and criminal motions in limine are heard on Thursdays at 1:30 p.m.
  unverified_sentences: 3
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6
  text: Time for Filing and Hearing Motions. Motions shall be filed in accordance with Local Rules 6 and 7. This Court hears civil motions on Thursdays at 10:00 a.m. If Thursday is a national holiday, motions will be heard on the next Thursday. It is not necessary to clear a hearing date with Judge Vera's Courtroom Deputy Clerk before filing a motion. For all motions, if the motion date selected is not available, the Court will issue a minute order continuing the date. Closed motion dates can be found on Judge Vera's Procedures and Schedules page.
- topic: Oral argument
  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6
  text: Effective immediately, the Court will no longer accept requests for remote appearances on any matters, including scheduling conferences. Counsel are directed to appear in person. If the Court deems a matter appropriate for decision without oral argument, the Court will take the matter under submission and notify the parties before the hearing. Unless otherwise notified, oral argument will be heard for all noticed motions.
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/9295b5b7-5a58-42c5-a023-534014dee0dc
  text: Each party filing or opposing a motion or seeking the determination of any matter shall serve and electronically lodge a proposed order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. In addition, a copy of the proposed order in Word format shall be emailed directly to the Court's chambers email address at HDV_Chambers@cacd.uscourts.gov on the day the document is electronically filed.
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6
  text: CHAMBERS COURTESY COPIES OF MOTION-RELATED DOCUMENTS The Court requires chambers copies of all e-filed motion-related documents (i.e., moving papers, oppositions and replies), as well as all associated exhibits. The Court no longer requires chambers copies for any other e-filed documents. Chambers copies should be delivered to Judge Vera's chambers copy box located outside of the Clerk's Office on the fourth floor of the First Street Courthouse (350 W. 1st Street, Los Angeles, California 90012). Mandatory chambers copies must be delivered by no later than noon on the following business day after filing, and shall be "binder ready" (i.e., three-hole punched on the left side, without blue-backs or staples, and with any exhibits tabbed). Additionally, for motions for summary judgment only, parties should submit two paper copies of all Motion for Summary Judgment filings to Judge Vera's mailbox on the fourth floor of the First Street Courthouse. Pro se parties are exempt from this requirement. Excel files prepared in support of motions for attorneys' fees (see supra Section X.F) and proposed orders in Word format (see supra Section XI) should be submitted to the Court's chambers email address at HDV_Chambers@cacd.uscourts.gov.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6
  text: The Court requires strict compliance with Local Rule 79-5, which governs applications to file documents under seal. Local Rule 79-5.2.2 explains how to apply to file under seal and how to proceed if leave is granted. There is a strong presumption of access in civil actions. Foltz v. State Farm Mut. Auto. Ins. Co., 331 F.3d 1122, 1135 (9th Cir. 2003). Parties that submit frivolous motions to seal or overly broad motions will be subject to sanctions. When submitting a motion to seal, the filing party must state whether the compelling reasons or good cause standard applies and explain why. See Center for Auto Safety v. Chrysler Group, LLC, 809 F.3d 1092, 1099 (9th Cir. 2016). The party must identify and discuss the factual and/or legal justification that establishes "good cause" or "compelling reasons" for the information to be protected. The filing party must make a specific showing explaining why each document that it seeks to seal may justifiably be sealed and why the proposed redactions are as narrowly tailored as possible, rather than making a blanket statement about the grounds for sealing. Generic and vague references to "competitive harm" are almost always insufficient justification for sealing. If a party files a request to seal that is significantly overbroad and/or does not provide adequate reasons for concealing information from the public, the party bears the risk that the Court will simply deny the request in its entirety and place all documents sought to be sealed on the public docket. Documents that are not confidential or privileged in their entirety should not be filed under seal if the confidential portions can be redacted and filed separately with a reasonable amount of effort. The parties should file a complete version of the documents under seal and a redacted version for public viewing, omitting only the portions that the Court has authorized to be filed under seal. Sealing must be justified for each individual item—blanket claims of confidentiality will result in the application to seal being denied. Counsel must consider carefully whether sealing or redaction is absolutely required for a given piece of evidence or argument. An application to seal that includes meritless requests to seal or redact documents will be denied. The parties also must meet and confer before filing an application to seal.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6
  text: Counsel for the applicant must provide advance notice of the application by telephone and email to all other parties. In addition to the information required by Local Rule 7-19.1, the notice must advise the other parties of the anticipated deadline to oppose the application. The applicant must serve the application by facsimile, email, or personal service, even if electronic service is effected under Local Rule 5-3.2.1. Oppositions to ex parte applications must be filed within 24 hours of the filing of the application, subject to Rule 6(a)(2).
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6#page=4
  text: Proposed protective orders must also be submitted to the Magistrate Judge. The Magistrate Judge's initials follow the District Judge's initials next to the case number.
  unverified_sentences: 1
- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-hernán-d-vera
  text: 'Tentative Rulings: The Court is not issuing tentative rulings at this time.'
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-hernán-d-vera
  text: All appearances shall be in person in Courtroom 5B. Effective immediately, the Court will no longer accept requests for remote appearances on any matters, including scheduling conferences. Counsel are directed to appear in person.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/58a1b283-7676-4f66-4dba-08de8c61d3d6
  text: Counsel requesting a continuance or extension of time must lodge a proposed stipulation and order including a detailed declaration of the grounds for the request. Counsel shall avoid submitting such requests less than five (5) court days prior to the expiration of the scheduled date. The Court grants continuances only upon a showing of good cause, focusing on the diligence of the party seeking the continuance and any prejudice that may result if the continuance is denied. Counsel are required to first meet and confer with opposing counsel regarding the substance of the continuance and include a statement of compliance with Local Rule 7-3. Failure to meet and confer in good faith in compliance with the Local Rules and this Order may result in denial of the request for continuance.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/067d6722-4e88-44f5-4db9-08de8c61d3d6
  text: Participation of Counsel and Unrepresented Parties. Counsel and any unrepresented parties must attend the scheduling conference in person. The counsel appearing at the scheduling conference need not be lead trial counsel, and may be local counsel. To that end, the Court will allow parties to divide their oral argument among two attorneys. Of course, the ultimate decision of who speaks on behalf of the client is for the client and not the Court.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-hernán-d-vera
  text: 'Settlement: When a motion is calendared or under submission, counsel are required to inform the Court promptly of any finalized or imminent settlement that may render the motion moot.'
