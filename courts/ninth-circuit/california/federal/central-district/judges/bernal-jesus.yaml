- topic: Tentative rulings
  field: tentative_rulings
  url: https://apps.cacd.uscourts.gov/Jps/honorable-jesus-g-bernal
  text: Tentative rulings are not issued.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5970aa35-f379-447a-1bda-08dee67d17de#page=8
  text: 'Remote Appearances: Counsel may appear remotely for all motion hearings by following the instructions on the Court website for Zoom appearances. Counsel who intends to appear remotely must file a notice of intent to appear remotely at least two business days in advance of the hearing. Hearings on motions for preliminary injunctions are excluded from this rule; counsel must attend preliminary injunction hearings in person unless counsel seeks, for good cause, leave to appear remotely not less than one week in advance of the hearing.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/Jps/honorable-jesus-g-bernal
  text: Stipulations extending scheduling dates set by this Court are not effective unless approved by the Court. Continuances will be granted only upon a showing of good cause. Continuances and special requests must be approved by the Court, and will be granted only upon a showing of good cause. Counsel must make such requests in pleading form by submitting a stipulation and a proposed order to the clerk's office at least one week in advance. Refer to Local Rules 7-1 and 7-11 for proper format. If there is a calendar conflict, counsel are to notify the court clerk prior to the date of the conflict.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5970aa35-f379-447a-1bda-08dee67d17de#page=3
  text: 'Failure of lead trial counsel to appear for those proceedings is a basis for sanctions. Participation: Lead trial counsel for all parties must be present. Counsel must be prepared to discuss the substantive issues in the case and authorized to address scheduling with the Court and opposing counsel.'
  unverified_sentences: 1
