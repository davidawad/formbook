- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5970aa35-f379-447a-1bda-08dee67d17de
  text: 'Mandatory Chambers Copies. Counsel shall provide one conformed chambers copy of ONLY the following filed documents: • Civil matters: Motions and related documents (opposition, replies, exhibits); ex parte applications and related documents (oppositions and exhibits); and Joint Rule 26(f) reports; Chambers copies shall be delivered to the “Courtesy Box,” located outside of Courtroom 1 on the 2nd floor at the United States District Court, 3470 Twelfth Street, Riverside, California 92501, no later than 5:00 p.m. on the day following the “e-filing. All chambers copies shall comply fully with the document formatting requirements of L.R. 11-3 and L.R. 11-5. Counsel shall provide such conformed mandatory chambers copies by delivering to the “Courtesy Box” located outside of Courtroom 1 on the 2nd floor or by mailing to: 3470 Twelfth Street, Riverside, CA 92501, Attn: Judge Bernal - Chambers Copy.'
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5970aa35-f379-447a-1bda-08dee67d17de#page=8
  text: The moving party's declaration in support of an ex parte application shall show compliance with L.R. 7-19 and this Order and shall include a statement of opposing counsel's position. Failure to do so ensures the application will be DENIED. If counsel does not intend to oppose an ex parte application, counsel must inform the Courtroom Deputy Clerk, (951) 328-2254.
  unverified_sentences: 1
