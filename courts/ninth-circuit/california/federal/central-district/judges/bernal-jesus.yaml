checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5970aa35-f379-447a-1bda-08dee67d17de#page=4
  text: Motions will be heard on Mondays commencing at 9:00 a.m. Any motion noticed for a holiday shall automatically be set to the next Monday without further notice to the parties. Civil matters are heard on Mondays at 9:00 a.m. Criminal matters are heard on Mondays at 2:00 p.m. (If Monday is a holiday, the next motion date is the following Monday.)
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/5970aa35-f379-447a-1bda-08dee67d17de#page=4
  text: Motions will be heard on Mondays commencing at 9:00 a.m. Any motion noticed for a holiday shall automatically be set to the next Monday without further notice to the parties. It is not necessary to clear a motion date with the court clerk prior to filing the motion.
  unverified_sentences: 1
