- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/Jps/honorable-sheri-pym
  text: 'Procedures for filing an ex parte application: Strict compliance with Local Rule 7-19 is required. Any opposition should be served and filed within 24 hours of applicant''s oral notice. Conformed paper copies of the filed application and any opposition should be delivered directly to chambers. Ex parte applications will ordinarily be decided on the papers without oral argument. The Court will notify the parties if it desires a hearing. Please note that, absent an emergency, ex parte applications are not an acceptable method of bringing a discovery dispute to the attention of the Court.'
