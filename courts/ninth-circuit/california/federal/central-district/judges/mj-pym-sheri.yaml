  text: If there is a tentative ruling, it will be provided to counsel at the time counsel checks in with the CRD.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/Jps/honorable-sheri-pym
  text: Any party who wishes to appear at a hearing by telephone shall make such a request at least two court days before the hearing. Telephonic appearances are not allowed absent permission of the Court given on showing of good cause.
