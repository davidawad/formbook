checklist:
- topic: Motion hearing days
  field: motion_hearing_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=5
  text: Judge Birotte hears civil motions on Fridays beginning at 10:00 a.m. The Friday after any Monday holiday is closed to hearings. Closed motion dates are shown on Judge Birotte's webpage. The parties must adhere to the briefing schedule set forth in Local Rules 7-9 and 7-10, and the schedule herein for motions under Fed. R. Civ. P. 56, so that Chambers has sufficient time to prepare. If a motion is noticed for a date that is not available, the Court may strike or reset the motion. Professional courtesy dictates that the parties should accommodate each other's schedules, including vacation and holiday schedules, whenever possible.
  unverified_sentences: 1
- topic: Notice and briefing schedule
  field: motion_notice_days
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=5
  text: 'Judge Birotte hears civil motions on Fridays beginning at 10:00 a.m. The Friday after any Monday holiday is closed to hearings. Closed motion dates are shown on Judge Birotte''s webpage. The parties must adhere to the briefing schedule set forth in Local Rules 7-9 and 7-10, and the schedule herein for motions under Fed. R. Civ. P. 56, so that Chambers has sufficient time to prepare. If a motion is noticed for a date that is not available, the Court may strike or reset the motion. Professional courtesy dictates that the parties should accommodate each other''s schedules, including vacation and holiday schedules, whenever possible. [...] This Court requires an extended briefing schedule for motions under Fed. R. Civ. P. 56, as follows: [...] The above briefing schedule is the default minimum. The parties may stipulate to an extended schedule. Any briefing schedule must provide at least two weeks between the reply deadline and the hearing date.'
  unverified_sentences: 5
