  field: oral_argument_default
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=7
  text: If the Court does so, it will notify the parties in advance.
  unverified_sentences: 1
- topic: Proposed orders
  field: proposed_orders
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b
  text: 'A party seeking any court order on any matter must include with their filing a Proposed Order setting forth the relief or action sought and a brief statement of the rationale for the decision with appropriate citations. See Local Rules 7-20, 52-4.1. A Proposed Order template is available on Judge Birotte''s webpage. Proposed Orders must substantially comply with the template''s format. Proposed Orders must be on pleading paper and must not include attorney information on the caption page, a footer, a watermark, or any text after the lines for the Judge''s signature on the last page. a. Emailing MS Word File of Proposed Orders to Chambers: A Microsoft Word file of all proposed orders must be emailed to chambers at AB_chambers@cacd.uscourts. A pdf file is not acceptable. If the proposed order is based on a stipulation or an ex parte application, counsel must email both the order and the stipulation or ex parte application. Otherwise, accompanying documents (such as motions) should not be emailed to chambers.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=13
  text: Chambers/Courtesy Copies NOT REQUIRED. Please DO NOT provide chambers/courtesy copies. The Court no longer uses them. In the rare instance in which the Court would like chambers copies for a particular situation, the Court will issue an order requesting them. In the absence of such an order DO NOT provide chambers copies of anything. Lodged items should be placed in Judge Birotte's box outside of the Clerk's Office on the 4th Floor of the First Street Courthouse.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=12
  text: Local Rule 79-5 governs applications to file under seal. Parties must comply with all sections of Local Rule 79-5. The parties must also meet and confer before filing an application to seal. Parties must make every effort to limit the number and volume of under seal filings. There is a strong presumption of access in civil cases. Foltz v. State Farm Mut. Auto. Ins. Co., 331 F.3d 1122, 1135 (9th Cir. 2003). For each document or other type of information a party seeks to file under seal, the party must identify and discuss the factual and/or legal justification that establishes "good cause" or "compelling reasons" for the matter should be protected. Kamakana v. City and County of Honolulu, 447 F.3d 1172, 1179-80 (9th Cir. 2006). Documents that are not confidential or privileged in their entirety must not be filed under seal in their entirety if the confidential portions can be redacted with a reasonable amount of effort. The parties must file a complete version of such documents under seal, and a redacted version for public viewing, redacting only the portions that the Court has ordered may be filed under seal. Sealing must be justified for each individual item; an application making blanket claims of confidentiality will be denied. Counsel is strongly encouraged to consider carefully whether sealing or redaction is required for a given piece of evidence or argument. The parties must minimize the materials they seek to file under seal. An application to seal that includes clearly meritless requests to seal or redact documents may be denied in its entirety. The Court will not expend its limited resources on overbroad requests to seal.
- topic: Ex parte applications
  field: ex_parte_notice
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=13
  text: Ex parte applications are solely for extraordinary relief. [...] Sanctions may be imposed for misuse of ex parte applications. Applications that do not conform with Local Rules 7-19 and 7-19.1, such as by omitting a statement of opposing counsel's position, will not be considered. Service must be made in compliance with Local Rule 5-3, and the moving party must also serve the nonmoving party by email, fax, or personal service. Any opposition must be filed within 48 hours (2 court days) after service. The moving party must notify the nonmoving party that opposing papers are due 48 hours (2 court days) after service. If the nonmoving party does not intend to oppose the ex parte application, counsel must inform the CRD by telephone. The Court usually resolves ex parte applications on the papers and does not set a hearing. If the Court determines a hearing is necessary, the CRD will notify counsel of a hearing date and time. Absent leave of Court, the Court will not consider reply papers in support of an ex parte application.
  unverified_sentences: 2
- topic: Discovery disputes
  field: discovery_referral
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=5
  text: All discovery matters are referred to the United States Magistrate Judge assigned to this case. The Magistrate Judge's initials follow the District Court Judge's initials next to the case number. All documents relating to discovery matters must include the words "DISCOVERY MATTER" in the caption to ensure proper routing.
- topic: Remote appearances
  field: remote_appearances
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=3
  text: Counsel are equally welcome to appear in person or via Zoom video for any hearings, as they prefer. There is no need to give the Court notice or to make a request for either kind of appearance; please do not do so. If a video appearance is not possible, Zoom Telephonic appearances are permitted. Judge Birotte's Zoom link and phone-in information are on his webpage. [...] (Trials are in-person.) ...
  unverified_sentences: 3
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=4
  text: If any counsel discovers a calendar conflict with a scheduled appearance, counsel must inform opposing counsel and the Courtroom Deputy Clerk ("CRD") via Chambers email at AB_chambers@cacd.uscourts.gov as soon as possible and not later than three days before the scheduled appearance. Counsel must attempt to agree on a new date to accommodate the calendar conflict and should propose a new date by Stipulation and Proposed Order.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://apps.cacd.uscourts.gov/JpsApi/file/ca861d04-cd04-4b22-15b1-08defc7bc57b#page=3
  text: Lead Counsel Appearance Required. The Court requires lead counsel to appear for scheduling conferences and the Final Pretrial Conference.
- topic: Notice of settlement
  field: settlement_notification
  url: https://apps.cacd.uscourts.gov/Jps/honorable-andré-birotte-jr
  text: 'Settlement: Counsel must notify the Court at least two (2) weeks before the scheduled hearing if the parties are conducting settlement discussions that may render the motion moot and must notify the Court immediately if a settlement is reached. A belated settlement notice wastes scarce judicial resources and may subject the offending parties to sanctions.'
