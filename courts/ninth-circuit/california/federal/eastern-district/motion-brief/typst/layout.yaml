# U.S. District Court for the Eastern District of California (caed): a notice of motion and motion with its memorandum
# of points and authorities, on the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with E.D.
# Cal.'s local rules overlaid here, on pleading paper (fb-595.96). The shared document model sets it
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`). Rules: E.D. Cal.
# Local Rules effective January 1, 2025, L.R. 130, 131, 133(k) (../README.md quotes them). No E.D. Cal. rule sets a
# face or size; the base's 12 point is the exemplar's.
base: /lib/layouts/frcp-motion-brief.yaml
# L.R. 130(c): double-spaced (24 pt lines), except counsel, the title, headings, footnotes and quotations: single lines
# of 12 pt, half a numbered line.
pitch: {body: 24, single: 12}
footnote: {size: 12, pitch: single, gap: 7}
quote: {left: 36, right: 36, above: 0, below: 0}
# L.R. 130(b): 8 1/2 by 11 inch paper with numbered lines in the left margin: 27 numbered lines of 24 pt from the
# one-inch top margin; the 1.5 in left margin holds the numbers and the rules.
margin: {top: 72, bottom: 72, left: 108, right: 72}
# pleading paper: the numbers 1 to 27 right-aligned on 1 in, one a numbered line from the top margin; a double rule at
# the text's left (1.3 in and 1.34 in from the page's left edge) and a single one 0.1 in right of the text
pleading: {lines: 27, rules: [93.6, 96.5, 547.2]}
# L.R. 130(d): the page number and a brief description of the document on the same line at the bottom: the sample's
# `footer_title` at the left, the number at the right, 10 pt in a 12 pt line ending 54 pt above the page's foot.
# The caption and notice from 1, the tables from i, the memorandum from 1 (as the exemplar numbers them).
page_number: {align: left, front: lower-roman, size: 10, pitch: 12, foot: 54, text: "{footer_title}<tab>{page}"}
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "EASTERN DISTRICT OF CALIFORNIA"
# The caption page and the notice of motion, numbered from 1 (the body up to `<!-- memorandum -->`): L.R. 131(a):
# counsel and the parties represented in the upper left from line 1, in a box at least seven numbered lines high so
# the court title (bold, centred) starts on line 8 or below; the caption: the parties at the left, "v." between them,
# ruled at their right and foot; at the right the case number, the judges, the paper's title in bold, the papers filed
# with it, the hearing (L.R. 230(b)) and the date the action was filed. Then the notice on a page of its own, signed
# (L.R. 131(b), (c)).
lead:
  - marker: "<!-- memorandum -->"
    blocks:
      - box:
          - {text: "{counsel}"}
        min_height: 168
      - {text: "{xd.court}", align: center, bold: true, pitch: body}
      - {text: "{xd.district}", align: center, bold: true, pitch: body}
      - {text: "{division}", align: center, bold: true, upper: true, pitch: body, optional: true}
      - columns:
          - width: 230.4
            blocks:
              - box:
                  - each: caption.parties
                    blocks:
                      - {text: "{names}"}
                      - {text: "{designation}"}
                    between:
                      - {text: "v."}
                stroke: {right: 0.75, bottom: 0.75}
                inset: {right: 10, bottom: 8}
          - blocks:
              - {text: "Case No.: {case_number}", left: 7.2}
              - {text: "{judge}", left: 7.2, optional: true}
              - {text: "{magistrate}", left: 7.2, optional: true}
              - {text: "{brief_title}", bold: true, left: 7.2, above: 12}
              - {text: "{concurrent}", left: 7.2, above: 12, optional: true}
              - {text: "Date: {hearing.date}", left: 7.2, above: 12, optional: true}
              - {text: "Time: {hearing.time}", left: 7.2, optional: true}
              - {text: "Place: {hearing.place}", left: 7.2, optional: true}
              - {text: "Action Filed: {action_filed}", left: 7.2, above: 12, optional: true}
        gutter: 14.4
        above: 24
      - {break: true}
    closing:
      - &signature
        group:
          - columns:
              - {width: 187.2, blocks: [{text: "Dated: {date}"}]}
              - blocks:
                  - {text: "{signature.firm}"}
                  - {text: "By: /s/ {signature.signer}", above: 12}
                  - {text: "{signature.signer}"}
                  - {text: "{signature.lines}", optional: true}
            gutter: 14.4
        above: 24
# L.R. 133(k): an indexed table of contents and table of authorities for a brief over fifteen pages: the contents the
# memorandum's headings, half an inch further in per level, the page in a 36 pt column under "Page"; the authorities the sample's
# groups and entries with their filed page references, single-spaced, 12 pt apart, the references in an inch.
contents: {title: "Table of Contents", page_heading: "Page", style: {align: center, upper: true}, pitch: body, depth: 3, col: 36, step: 36}
authorities:
  title: "Table of Authorities"
  style: {align: center, upper: true}
  page_heading: "Page(s)"
  pitch: single
  col: 72
  hang: 28.8
  above: 12
  group: {bold: true, pitch: body}
# The memorandum's title at the top of its first page.
front:
  - {text: "{memo_title}", align: center, bold: true, upper: true, pitch: body}
# Headings as the sample writes them (their labels typed), bold, at the body pitch, kept with what follows: a section
# centred, a sub-section at the margin, the next level half an inch in.
heading:
  - {align: center, bold: true, pitch: body, above: 0, below: 0}
  - {bold: true, pitch: body, above: 0, below: 0}
  - {bold: true, left: 36, pitch: body, above: 0, below: 0}
# A numbered list half an inch in, the number in a half-inch box, the text hanging after it.
list: {left: 36}
list_indent: 36
# FRCP 11(a), L.R. 131(b): the memorandum signed as the notice; kept with its last paragraph (the base's
# keep_with_closing).
closing:
  - *signature
