# U.S. Bankruptcy Court for the Eastern District of California (caeb): a memorandum of points and authorities in
# support of a motion, filed as a document of its own (LBR 9004-2(c)(1), 9014-1(d)(4): motions, notices, declarations,
# exhibits and memoranda are separate documents; a motion and its memorandum may be combined only up to six pages), on
# the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with caeb's local rules overlaid here, on
# pleading paper (fb-595.96). The shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated
# from the merged layout by `fb engines gen`). Rules: E.D. Cal. Local Bankruptcy Rules (effective April 2, 2026), LBR
# 9004-1, 9004-2, 9014-1 (../README.md quotes them).
base: /lib/layouts/frcp-motion-brief.yaml
# LBR 9004-2(a)(4) (CAEB-MB-FORM-002): type of not less than 12 nor more than 14 point, in Arial, Courier, Times, Times
# New Roman or Helvetica or their equivalent: the base's 12 point, footnotes included. LBR 9004-2(a)(2), (b)(1)
# (CAEB-MB-FORM-003): numbered lines in the left margin, the text double-spaced (24 pt lines); counsel, the title of
# the action, headings, footnotes and quotations single-spaced, two lines to a numbered line.
pitch: {body: 24, single: 12}
footnote: {size: 12, pitch: single, gap: 7, clearance: 12.6}
# LBR 9004-2(a)(1), (b)(2) (CAEB-MB-FORM-001): letter paper, a margin of at least half an inch on every side. 28
# numbered lines of 24 pt fill 672 of the 792 pt page, so the top and bottom margins are 60 pt (the three exemplars'
# 28 lines); the 1.5 in left margin holds the numbers and the rules.
margin: {top: 60, bottom: 60, left: 108, right: 72}
# pleading paper: the numbers 1 to 28 right-aligned on 1 in, one a numbered line from the top margin; a double rule at
# the text's left (1.3 in and 1.34 in from the page's left edge) and a single one 0.1 in right of the text
pleading: {lines: 28, rules: [93.6, 96.5, 547.2]}
# LBR 9004-2(c)(3) (CAEB-MB-FORM-005): the pages numbered consecutively at the bottom center, page 1 the page with the
# caption: the cover, the tables and the memorandum numbered as one.
page_number: {align: center}
constants:
  court: "UNITED STATES BANKRUPTCY COURT"
  district: "EASTERN DISTRICT OF CALIFORNIA"
# The first page. LBR 9004-2(c)(4) (CAEB-MB-FIRST-001): the total number of pages noted in the upper left-hand corner,
# on line 1 ({xd.last_page}, the last page's number: the pages are numbered as one). LBR 9004-1 (CAEB-MB-FIRST-002):
# counsel's name, address, telephone, e-mail and State Bar number at the upper left with the party represented, in a
# box 4.5 in wide and at least six numbered lines high, so LBR 9004-2(b)(3)'s blank space for the clerk's stamp (2.5 in
# from the right edge, 3 in from the top) stays clear: nothing right of 6 in above the court title, which starts 3.17 in
# down at the earliest (the eighth numbered line). The court (bold, centered: the constants and the sample's
# `division`). LBR 9004-2(a)(6), (b)(5), 9014-1(c), (d)(2) (CAEB-MB-FIRST-003, -004): the caption: "In re:", the debtor
# and its designation, and in an adversary proceeding the parties, "v." between them, the designations an inch in,
# ruled at their right and foot; at the right the case number, the adversary proceeding's number, the Docket Control
# Number immediately below the last of them, the chapter, the judge, and the hearing's date, time and place. LBR
# 9004-2(b)(5)(A) (CAEB-MB-FIRST-005): the document's title just below the caption, centered in bold capitals.
cover:
  - box:
      - {text: "{xd.last_page}"}
      - {text: "{counsel}", above: 12}
      - {text: "{counsel_role}", above: 12}
    width: 324
    min_height: 144
  - {text: "{xd.court}", align: center, bold: true, above: 24}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - blocks:
          - box:
              - {text: "In re:"}
              - {text: "{caption.debtor.names}", above: 12}
              - {text: "{caption.debtor.designation}", left: 72, above: 12}
              - when: caption.parties
                blocks:
                  - {rule: 0.75, above: 12}
                  - each: caption.parties
                    above: 12
                    blocks:
                      - {text: "{names}"}
                      - {text: "{designation}", left: 72, above: 12}
                    between:
                      - {text: "v.", above: 12, below: 12}
            stroke: {right: 0.75, bottom: 0.75}
            inset: {right: 14.4, bottom: 12}
      - blocks:
          - {text: "{case_label|Case No.} {case_number}", left: 14.4}
          - {text: "Adv. Pro. No. {adversary_number}", left: 14.4, optional: true}
          - {text: "DCN: {dcn}", left: 14.4}
          - {text: "Chapter {chapter}", left: 14.4, above: 12}
          - {text: "{judge}", left: 14.4, optional: true}
          - {text: "Date: {hearing.date}", left: 14.4, above: 24}
          - {text: "Time: {hearing.time}", left: 14.4}
          - {text: "Place: {hearing.place}", left: 14.4}
    above: 24
  - {text: "{brief_title}", align: center, bold: true, upper: true, left: 36, right: 36, above: 24}
front: []
# LBR 9014-1(d)(3)(C) (CAEB-MB-CONT-002): a memorandum of more than 10 pages has a table of contents and a table of
# authorities. The template always produces both. The contents: a row per heading to the third level, a numbered
# heading's label in its box, each level half an inch further in, the page in a 36 pt column under "Page", 6 pt
# between rows; the authorities from the sample's keyed `authorities` (`toa:` links), grouped (cases in italics, a
# comma before the citation), the pages in an inch, "passim" for seven or more, "Page(s)" over the first group.
contents: {title: "Table of Contents", page_heading: "Page", depth: 3, col: 36, step: 36, above: 6}
authorities:
  title: "Table of Authorities"
  col: 72
  hang: 25.2
  above: 6
  passim: 7
  page_heading: "Page(s)"
  group: {bold: true, above: 12}
  kinds:
    - {kind: case, title: "Cases", italic: true, separator: ", "}
    - {kind: statute, title: "Statutes"}
    - {kind: rule, title: "Rules"}
    - {kind: other, title: "Other Authorities"}
# Headings (LBR 9004-2(b)(1): single-spaced): numbered by the layout, a section I. on a line of its own over its title,
# both centered in bold capitals; a sub-section A. at the margin and the next level 1. half an inch in, bold, the label
# in a half-inch box and the title hanging after it; 12 pt above and below, kept with what follows.
heading:
  - {align: center, bold: true, upper: true, number: "I.", label_line: true, above: 12, below: 12}
  - {bold: true, number: "A.", label_box: 36, above: 12, below: 12}
  - {bold: true, left: 36, number: "1.", label_box: 36, above: 12, below: 12}
  - {bold: true, left: 72, number: "a.", label_box: 36, above: 12, below: 12}
# LBR 9004-1(c) (CAEB-MB-SIGN-001), Fed. R. Bankr. P. 9011(a): the date at the margin; at the right (3.2 in) the firm,
# the signer's "/s/" and typed name a numbered line below, the signer's lines; kept with the body's last paragraph (the
# base's keep_with_closing).
closing:
  - columns:
      - blocks:
          - {text: "Dated: {date}"}
      - width: 230.4
        blocks:
          - {text: "{signature.firm}", optional: true}
          - {text: "/s/ {signature.signer}", above: 24}
          - {text: "{signature.lines}", optional: true}
    above: 24
