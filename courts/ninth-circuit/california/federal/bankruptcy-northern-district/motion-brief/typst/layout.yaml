# U.S. Bankruptcy Court for the Northern District of California (canb): a motion with its memorandum of points and
# authorities in one document (B.L.R. 9013-1(b)(1)-(2): "The motion and the memorandum of points and authorities may
# be combined and docketed together"; the notice of hearing is a separate document, 9013-1(b)(3)), on the generic FRCP
# brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with canb's local rules overlaid here, on pleading paper
# (fb-595.96). The shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged
# layout by `fb engines gen`). Rules: N.D. Cal. Bankruptcy Local Rules (effective May 4, 2026), B.L.R. 1001-2(a) (which
# applies N.D. Cal. Civil L.R. 3-4 to bankruptcy papers, except 3-4(c)(3) and (e)), 1005-1, 9013-1 (../README.md
# quotes them). The base already sets 12-point type (Civil L.R. 3-4(c)(2)(B), footnotes included).
base: /lib/layouts/frcp-motion-brief.yaml
# Civil L.R. 3-4(c)(2) (via B.L.R. 1001-2(a); CANB-MB-FORM-003): double-spaced text, no more than 28 lines a page;
# counsel, the caption, headings, tables, footnotes and the signature single-spaced, two lines to a numbered line.
pitch: {body: 24, single: 12}
# Civil L.R. 3-4(c)(1) (CANB-MB-FORM-001): letter paper with numbered lines: 28 lines of 24 pt fill 672 of the 792 pt
# page, so the top and bottom margins are 60 pt (the rules set no minimum margin); a 1.5 in left margin holds the
# numbers and the rules.
margin: {top: 60, bottom: 60, left: 108, right: 72}
# pleading paper: the numbers 1 to 28 right-aligned on 1 in, one a numbered line from the top margin; a double rule at
# the text's left (1.3 in and 1.34 in from the page's left edge) and a single one 0.1 in right of the text
pleading: {lines: 28, rules: [93.6, 96.5, 547.2]}
# B.L.R. 1001-2(a) does not apply Civil L.R. 3-4(c)(3) (the footer with the paper's title) in bankruptcy, and no B.L.R.
# numbers pages. Convention (both exemplars, usage/SOURCE.md): the page number at the foot, centered; the paper's
# title under it as the second exemplar prints it (the sample's `footer_title`), 10 pt in 11.5 pt lines, the last 8 pt
# above the page's foot. The caption page counted, unprinted; the tables from ii and the motion from 1, as the first
# exemplar numbers them.
page_number: {align: center, front: lower-roman, cover: counted, size: 10, pitch: 11.5, foot: 8, text: "{page}<br>{footer_title}"}
footnote: {size: 12, pitch: single, gap: 7, clearance: 12.6}
# Civil L.R. 3-4(a) (via B.L.R. 1001-2(a); CANB-MB-FIRST-001, -002), B.L.R. 1005-1 (CANB-MB-FIRST-003): the first page:
# counsel's name, address, telephone, e-mail and bar number at the upper left and the party represented, in a box at
# least six numbered lines high, so the court title (bold capitals, centered, from the sample's `court`) starts on the
# eighth line at the earliest; the caption: "In re:", the debtor and its designation, and in an adversary proceeding
# the parties, each designation 1.8 in in, "v." between them, ruled at their right and foot; at the right the case
# number, the chapter, the adversary proceeding's number, the paper's title in bold capitals and the hearing (date,
# time, judge, place: B.L.R. 1005-1(c)).
cover:
  - box:
      - {text: "{counsel}"}
      - {text: "{counsel_role}", above: 12}
    min_height: 144
  - {text: "{court}", align: center, bold: true, upper: true, above: 24}
  - columns:
      - blocks:
          - box:
              - {text: "In re:"}
              - {text: "{caption.debtor.names}", above: 12}
              - {text: "{caption.debtor.designation}", left: 129.6, above: 12}
              - when: caption.parties
                blocks:
                  - {rule: 0.75, above: 12}
                  - each: caption.parties
                    above: 12
                    blocks:
                      - {text: "{names}"}
                      - {text: "{designation}", left: 129.6, above: 12}
                    between:
                      - {text: "v.", above: 12, below: 12}
            stroke: {right: 0.75, bottom: 0.75}
            inset: {right: 14.4, bottom: 12}
      - blocks:
          - {text: "Case No. {case_number}", left: 14.4}
          - {text: "Chapter {chapter}", left: 14.4}
          - {text: "Adv. Pro. No. {adversary_number}", left: 14.4, above: 12, optional: true}
          - {text: "{brief_title}", bold: true, upper: true, left: 14.4, above: 24}
          - {text: "Date: {hearing.date}", left: 14.4, above: 24, optional: true}
          - {text: "Time: {hearing.time}", left: 14.4, optional: true}
          - {text: "Judge: {hearing.judge}", left: 14.4, optional: true}
          - {text: "Place: {hearing.place}", left: 14.4, optional: true}
    above: 24
front: []
# B.L.R. 9013-1(c) (CANB-MB-CONT-003): a table of contents and a table of authorities for a memorandum of more than 10
# pages of text. The template always produces both. The contents: a row per heading to the fourth level, a numbered
# heading's label in its box, each level half an inch further in, the page in a 36 pt column under "Page", 6 pt
# between rows; the authorities from the sample's keyed `authorities` (`toa:` links), grouped (cases in italics, a
# comma before the citation), the pages in an inch, "passim" for seven or more, "Page(s)" over the first group.
contents: {title: "Table of Contents", page_heading: "Page", depth: 4, col: 36, step: 36, above: 6}
authorities:
  title: "Table of Authorities"
  col: 72
  hang: 25.2
  above: 6
  passim: 7
  page_heading: "Page(s)"
  group: {bold: true, above: 12}
  kinds:
    - {kind: case, title: "Cases", italic: true, separator: ", "}
    - {kind: statute, title: "Statutes"}
    - {kind: rule, title: "Rules"}
    - {kind: other, title: "Other Authorities"}
# B.L.R. 9013-1(b)(1)-(2) (CANB-MB-CONT-001): the motion, then the memorandum as a level-1 heading, centered in bold
# capitals; the memorandum's sections numbered I., A., 1., a. by the layout, bold, the label in a half-inch box and the
# title hanging after it, each level half an inch further in; single-spaced, 12 pt above and below, kept with what
# follows.
heading:
  - {align: center, bold: true, upper: true, above: 12, below: 12}
  - {bold: true, number: "I.", label_box: 36, above: 12, below: 12}
  - {bold: true, left: 36, number: "A.", label_box: 36, above: 12, below: 12}
  - {bold: true, left: 72, number: "1.", label_box: 36, above: 12, below: 12}
  - {bold: true, left: 108, number: "a.", label_box: 36, above: 12, below: 12}
# Fed. R. Bankr. P. 9011(a): the date at the margin; at the right (3.2 in) the signers and the firm, "By: /s/" and the
# signer a numbered line below, the signer's lines; kept with the body's last paragraph (the base's keep_with_closing).
closing:
  - columns:
      - blocks:
          - {text: "Dated: {date}"}
      - width: 230.4
        blocks:
          - {text: "{signature.firm}", optional: true}
          - {text: "By: /s/ {signature.signer}", above: 24}
          - {text: "{signature.lines}", optional: true}
    above: 24
