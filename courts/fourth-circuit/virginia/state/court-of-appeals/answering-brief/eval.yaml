# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12); the latex render breaks every line and
# page where the typst render does, so a difference fails. The court folder's eval.yaml (14 pt, Rule 5A:4(a)) applies
# too.
params:
  cross_engine: gate
  # Word breaks after the en dash of a page range ("103–" / "04)", p21 line 19), typst does not (UAX 14 LB25, numeric):
  # one line, no page end moves. Not yet in the shared model (docs/open-items/fb-595.54.67.md); reported, not gated.
  cross_engine_docx: report
