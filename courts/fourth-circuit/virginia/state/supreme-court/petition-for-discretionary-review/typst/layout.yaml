# Supreme Court of Virginia (va): petition for appeal (Rule 5:17). The whole layout, as data for the shared document
# model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers
# trace to Rule 5:6 (../rules.md, VA-*); lengths in points. No case text here: every string printed comes from the
# sample's frontmatter ({field}) or is a court constant.
size: 14                  # VA-FORM-003 (Rule 5:6(a)(3)): at least 14-point type, footnotes included
pitch:
  body: 32.2              # VA-FORM-004: text double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # VA-FORM-004: headings, quotations, footnotes single spaced (1.15 x 14 pt); cover, tables
margin: {top: 72, bottom: 72, left: 72, right: 72}   # VA-FORM-001 (Rule 5:6(a)(2)): at least one inch on all sides
indent: 36
page_number: {align: center, front: lower-roman}   # VA-FORM-006: numbered; the cover none, the tables i, ii .., the text 1, 2 ..
footnote: {size: 14, gap: 7, widows: true}   # VA-FORM-003, -004: 14-point footnotes, single spaced; a paragraph that calls a note keeps its widow and orphan rule in every engine (the heading III and its note-calling paragraph move together, p29-p30)
quote: {left: 36, right: 36, above: 14, below: 14}  # VA-FORM-004: quotations over 49 words single spaced; a paragraph that calls a note keeps its widow and orphan rule in every engine (the heading III and its note-calling paragraph move together, p29-p30)
heading:
  - {align: center, bold: true, above: 16.8, below: 14}
  - {bold: true, above: 16.8, below: 11.2}
  - {bold: true, italic: true, above: 15.4, below: 8.4}
# The cover (Rule 5:6(b), VA-FORM-007, -008): the court, the record number, the style of the case with the appellant
# (or petitioner) named first, the title, and counsel's name, VSB number, address, telephone, fax and e-mail.
cover:
  - {text: "IN THE", align: center, bold: true}
  - {text: "SUPREME COURT OF VIRGINIA", align: center, bold: true}
  - {text: "RECORD NO. {record_number}", align: center, bold: true, above: 16.8}
  - each: caption
    above: 22.4
    between:
      - {text: "v.", left: 36, above: 11.2, below: 11.2}
    blocks:
      - {text: "{names}"}
      - {text: "{designation}", left: 36}
  - {text: "{proceeding}", align: center, optional: true, above: 16.8}
  - {text: "{brief_title}", align: center, bold: true, above: 30.8}
  # counsel two to a row, each column half the text width (a long line wraps inside its column, never into the margin)
  - columns: {each: counsel, per_row: 2, row_gap: 16.8, blocks: [{text: "{names}"}, {text: "{lines}"}]}
    gutter: 21.6
    above: 33.6
# The table of contents and the table of authorities, cases first, each on its own page (VA-PDR-002, Rule 5:17(c)(2)).
contents: {title: "TABLE OF CONTENTS", depth: 3, col: 36, hang: 18, step: 18, above: 9.6}
authorities:
  title: "TABLE OF AUTHORITIES"
  col: 56
  hang: 28.8
  above: 4
  group: {bold: true, above: 15.4, below: 7}
# The closing and signature block (VA-CERT-001, Rule 5:1B(f)), never split; then the certificate of compliance (Rule
# 5:26(g)) and the certificate of filing and e-mail service (Rule 5:1B(c), VA-ELEC-002), each on a page of its own.
keep_with_closing: true   # the closing is never alone on a page: the last paragraph goes with it (tier 2)
closing:
  - group:
      - {text: "Respectfully submitted,", pitch: body}
      - {text: "{signing_party}<br>By Counsel", pitch: body, optional: true}
      - {text: "this {date}.", pitch: body, optional: true}
      - columns: {each: signature, blocks: [{text: "{lines}"}]}
        gutter: 21.6
        above: 16.1
    above: 16.8
  - {break: true}
  - {text: "CERTIFICATE OF COMPLIANCE", align: center, bold: true, below: 16.8}
  - {text: "I hereby certify that this petition complies with Rules 5:6(a) and 5:17(f) of the Rules of the Supreme Court of Virginia.", pitch: body, indent: 36}
  - {text: "It contains {word_count} words, excluding the cover page, table of contents, table of authorities, signature blocks, and this certificate (Rule 5:26(g)).", pitch: body, indent: 36, optional: true}
  - {break: true}
  - {text: "CERTIFICATE OF FILING AND SERVICE", align: center, bold: true, below: 16.8}
  - {text: "I hereby certify that on the {service.filed_date} I electronically filed the foregoing with the Clerk of the Supreme Court of Virginia through the Virginia Appellate Courts Electronic System, and that on the {service.service_date} I served true and correct copies of it by e-mail on the following counsel of record:", pitch: body, indent: 36}
  - each: service.recipients
    above: 16.8
    blocks:
      - {text: "{names}", above: 16.8}
      - {text: "{lines}"}
