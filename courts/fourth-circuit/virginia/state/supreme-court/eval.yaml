# Numbers the Rules of the Supreme Court of Virginia state (rules.md). The default checks (data/checks-default.yaml)
# assume 12 pt type; the Virginia rule is larger.
# Rule 5:6(a)(3) (VA-FORM-003): motions, petitions and briefs, including footnotes, in at least 14-point type.
# No page limit is set: the limits in Rules 5:17(f), 5:17A(c), 5:26(b) and 5:7(b)(7) are "the longer of" a page count
# or a word count, which one page number cannot express (rules.md VA-BMER-002, VA-ANS-002, VA-REPLY-002, VA-PDR-003,
# VA-REV-001, VA-WRIT-002).
font:
  size_pt: 14
