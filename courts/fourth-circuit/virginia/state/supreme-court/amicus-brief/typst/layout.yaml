# Supreme Court of Virginia (va): amicus curiae brief (Rule 5:30, VA-AMI-*). The whole layout, as data for the
# shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Rule 5:6 (../rules.md, VA-*); lengths in points. No case text here: every string
# printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # VA-FORM-003 (Rule 5:6(a)(3)): at least 14-point type, footnotes included
pitch:
  body: 32.2              # VA-FORM-004: text double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # VA-FORM-004: headings, quotations, footnotes single spaced (1.15 x 14 pt); cover, tables
margin: {top: 72, bottom: 72, left: 72, right: 72}   # VA-FORM-001 (Rule 5:6(a)(2)): at least one inch on all sides
indent: 36
page_number: {align: center, front: lower-roman}   # VA-FORM-006: numbered; the cover none, the tables i, ii .., the text 1, 2 ..
footnote: {size: 14, gap: 7}                       # VA-FORM-003, -004: 14-point footnotes, single spaced
quote: {left: 36, right: 36, above: 14, below: 14}  # VA-FORM-004: quotations over 49 words single spaced
heading:
  - {align: center, bold: true, above: 16.8, below: 14}
  - {bold: true, above: 16.8, below: 11.2}
  - {bold: true, italic: true, above: 15.4, below: 8.4}
# The cover (Rule 5:6(b), VA-FORM-007, -008): the court, the record number, the style of the case with the appellant
# named first, the title, and counsel's name, VSB number, address, telephone, fax and e-mail.
cover:
  - {text: "IN THE", align: center, bold: true}
  - {text: "SUPREME COURT OF VIRGINIA", align: center, bold: true}
  - {text: "RECORD NO. {record_number}", align: center, bold: true, above: 16.8}
  - each: caption
    above: 22.4
    between:
      - {text: "v.", left: 36, above: 11.2, below: 11.2}
    blocks:
      - {text: "{names}"}
      - {text: "{designation}", left: 36}
  - {text: "{proceeding}", align: center, optional: true, above: 16.8}
  - {text: "{brief_title}", align: center, bold: true, above: 30.8}
  # counsel side by side, two to a row, as the filed brief sets them (three counsel stacked would run the cover onto
  # a second page: DEF-COVER-001); a long line wraps inside its column
  - columns: {each: counsel, per_row: 2, row_gap: 16.8, blocks: [{text: "{names}"}, {text: "{lines}"}]}
    gutter: 21.6
    above: 33.6
# Rule 5:30(e)(2) (VA-AMI-004): the brief states whether a party's counsel authored it, whether a party or its counsel
# funded it, and whether any other person funded it (identifying each). The three questions are court constants, each
# answered by the frontmatter's `amicus_statement` (a list, in the rule's order), or a blank line the filer completes.
# A page of its own after the cover, numbered with the tables (the Rule names no place).
before_tables:
  - {text: "STATEMENT UNDER RULE 5:30(e)(2)", align: center, bold: true, below: 16.8}
  - {text: "Whether a party’s counsel authored this brief in whole or in part: {amicus_statement.0|______________________}", pitch: body}
  - {text: "Whether a party or a party’s counsel contributed money that was intended to fund preparing or submitting this brief: {amicus_statement.1|______________________}", pitch: body, above: 14}
  - {text: "Whether a person other than the amicus curiae, its members, or its counsel contributed money that was intended to fund preparing or submitting this brief, and if so, identifying each such person: {amicus_statement.2|______________________}", pitch: body, above: 14}
# The table of contents and the table of authorities, each on its own page (VA-AMI-003, Rule 5:30(e)(1): the rules of
# the brief of the party supported, Rule 5:28(a)): cases first, alphabetical, the year in each citation; seven pages
# or more print passim.
contents: {title: "TABLE OF CONTENTS", depth: 3, col: 36, hang: 18, step: 18, above: 9.6}
authorities:
  title: "TABLE OF AUTHORITIES"
  col: 56
  hang: 28.8
  above: 4
  passim: 7
  group: {bold: true, above: 15.4, below: 7}
  kinds:
    - {kind: case, title: "CASES", italic: true}
    - {kind: statute, title: "STATUTES"}
    - {kind: constitution, title: "CONSTITUTIONAL PROVISIONS"}
    - {kind: rule, title: "RULES"}
    - {kind: other, title: "OTHER AUTHORITIES"}
# The closing and signature blocks (VA-CERT-001, Rule 5:1B(f)), never split and never alone on a page; then the
# certificate of compliance (Rule 5:26(g)) and the certificate of filing and e-mail service (Rule 5:1B(c),
# VA-ELEC-002), each on a page of its own. A date the filer has not given prints as a blank to complete.
keep_with_closing: true
closing:
  - group:
      - {text: "Respectfully submitted,", pitch: body}
      - {text: "{signing_party}<br>By Counsel", pitch: body, optional: true}
      - {text: "this {date}.", pitch: body, optional: true}
      - columns: {each: signature, blocks: [{text: "{lines}"}]}
        gutter: 21.6
        above: 16.1
    above: 16.8
  - {break: true}
  - {text: "CERTIFICATE OF COMPLIANCE", align: center, bold: true, below: 16.8}
  - {text: "I hereby certify that this brief complies with Rules 5:6, 5:26(b) and 5:30(e) of the Rules of the Supreme Court of Virginia.", pitch: body, indent: 36}
  - {text: "It contains {word_count} words, excluding the cover page, table of contents, table of authorities, signature blocks, and this certificate (Rule 5:26(g)).", pitch: body, indent: 36, optional: true}
  - {break: true}
  - {text: "CERTIFICATE OF FILING AND SERVICE", align: center, bold: true, below: 16.8}
  - {text: "I hereby certify that on the {service.filed_date|____________} I electronically filed the foregoing with the Clerk of the Supreme Court of Virginia through the Virginia Appellate Courts Electronic System, and that on the {service.service_date|____________} I served true and correct copies of it by e-mail on the following counsel of record:", pitch: body, indent: 36}
  - each: service.recipients
    above: 16.8
    blocks:
      - {text: "{names}", above: 16.8}
      - {text: "{lines}", optional: true}
