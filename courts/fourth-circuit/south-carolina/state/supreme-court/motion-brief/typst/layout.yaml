# Supreme Court of South Carolina (sc): motion and supporting memorandum (SCACR 240, 267). The whole layout, as data for
# the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to SCACR 240 and 267 and the rows of ../../rules.md (SC-*); lengths in points. No case
# text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # SC-FORM-001, SCACR 267(c): type of 12 point or larger, footnotes too
pitch:
  body: 27.6              # SC-FORM-001, SCACR 267(c): double spaced (Word's double, 2 x 1.15 x 12 pt)
  single: 13.8            # caption, headings, quotations, footnotes, signature: single (1.15 x 12 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # SC-FORM-002, SCACR 267(d): one inch on all sides
indent: 36
page_number: {align: center, from: 1}   # SC-FORM-011, SCACR 240(c): every page numbered consecutively from 1
footnote: {size: 12, gap: 7}             # SCACR 267(c): no type under 12 point; footnotes single spaced
quote: {left: 36, right: 36, above: 9.6, below: 12}   # block quotations indented, single spaced
heading:
  - {align: center, bold: true, above: 14.4, below: 10.8}
  - {bold: true, above: 12, below: 8.4}
  - {bold: true, italic: true, above: 10.8, below: 7.2}
# SC-FORM-005, SCACR 267(e): the caption at the head of page 1: the court, the court appealed from and its judge, the
# appellate case numbers, the parties with their roles, the title, set off by short rules (45 % of the text width,
# centered); the motion follows on the same page.
front:
  - {text: "THE STATE OF SOUTH CAROLINA", align: center}
  - {text: "{court_name}", align: center, above: 3.6}
  - {text: "{lower_court}", align: center, optional: true, above: 9.6}
  - columns: [{width: 128.7, blocks: []}, {blocks: [{rule: 0.6}]}, {width: 128.7, blocks: []}]
    above: 9.6
  - each: appellate_case_numbers
    above: 7.2
    blocks: [{text: "Appellate Case No. {.}", align: center}]
  - columns: [{width: 128.7, blocks: []}, {blocks: [{rule: 0.6}]}, {width: 128.7, blocks: []}]
    above: 7.2
  - each: caption
    above: 12
    blocks:
      - {text: "{connector}", align: center, optional: true, above: 7.2, below: 7.2}
      - columns:
          - blocks: [{text: "{lines}"}]
          - width: 151.2
            valign: center
            blocks: [{text: "{role}", align: right}]
        gutter: 21.6
        below: 7.2
  - columns: [{width: 128.7, blocks: []}, {blocks: [{rule: 0.6}]}, {width: 128.7, blocks: []}]
    above: 7.2
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 9.6}
  - columns: [{width: 128.7, blocks: []}, {blocks: [{rule: 0.6}]}, {width: 128.7, blocks: []}]
    above: 7.2
    below: 14.4
# SC-FORM-006, -007, SCACR 267(a), (b): the date beside the signature, counsel's name, address and telephone with it,
# never split; then the certificate of service (SC-FORM-010) when the frontmatter gives one.
closing:
  - columns:
      - blocks: [{text: "Dated: {date}", optional: true, above: 9.6}]
      - width: 244.8
        blocks:
          - each: signature
            blocks: [{text: "{lines}", above: 9.6}]
    gutter: 14.4
    above: 4.2
  - when: certificate_of_service
    blocks:
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, keep: true, above: 21.6, below: 10.8}
      - {text: "{certificate_of_service.text}", pitch: body, indent: 36}
      - {text: "{certificate_of_service.recipients}", optional: true, above: 4.8}
      - {text: "Dated: {certificate_of_service.date}", optional: true, above: 9.6}
