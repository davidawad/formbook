# Court of Appeals of South Carolina (scctapp): appellant's initial brief. The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12).
# Numbers trace to SCACR Rules 208, 211, 262 and 267 (../rules.md, SCCTAPP-*); lengths in points. No case text here:
# every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # SCCTAPP-FORM-003, -005: standard 12-point or larger, footnotes included (R267(c))
pitch:
  body: 27.6              # SCCTAPP-FORM-004: double spaced (Word's double, 2 x 1.15 x 12 pt; R267(c))
  single: 13.8            # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 12 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # SCCTAPP-FORM-002: one inch on all sides (R267(d))
indent: 36
page_number: {align: center, front: lower-roman}   # SCCTAPP-FORM-009: bottom centre; cover unnumbered, tables i, ii .., brief 1, 2 ..
footnote: {size: 12, gap: 7}                        # SCCTAPP-FORM-005: footnotes 12 pt; single spaced (FORM-004 convention)
quote: {left: 36, right: 36, above: 9.6, below: 14.4}   # SCCTAPP-FORM-004: block quotations single spaced, indented
table: {above: 9.6, below: 14.4, pad: 2.4}   # a table of the body set off as a quotation is (tier 2), the rules clear of the text
heading:                  # SCCTAPP-FORM-010: sections centred, capitals, bold; argument headings bold (R208(b)(1)(E))
  - {align: center, bold: true, upper: true, above: 14.4, below: 12}
  - {bold: true, hang: 36, above: 14.4, below: 9.6}
  - {bold: true, italic: true, hang: 36, above: 12, below: 9.6}
# The cover shows only the caption (R267(a), (e); SCCTAPP-FORM-007): the State and the court, the appeal source, the
# case number over a short rule, the parties with their designations at the right, the title, then counsel.
cover:
  - {text: "{state}", align: center, bold: true}
  - {text: "{court}", align: center}
  - {text: "{appeal_from}", align: center, above: 21.6}
  - {text: "Appellate Case No. {appellate_case_no}", align: center, above: 21.6}
  - columns:
      - {blocks: []}
      - {width: 216, blocks: [{rule: 0.6}]}
      - {blocks: []}
    above: 14.4
  - each: caption
    above: 21.6
    blocks:
      - columns:
          - {blocks: [{text: "{names}"}]}
          - {width: 144, valign: center, blocks: [{text: "{designation}", align: right}]}
        gutter: 12
        above: 21.6
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 72}
  - each: counsel
    above: 72
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 7.2}
      - {text: "{lines}", left: 230.4}
# R208(b)(1)(A): a table of contents with page references and a table of cases, statutes and other authorities with
# the pages where each is cited (SCCTAPP-CONT-001), each on its own page, dot leaders (SCCTAPP-FORM-011).
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 18, step: 18, above: 10.8}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 10.8
  group: {bold: true, above: 14.4, below: 2.4}
# The date and the signature block, never split (R211(a), R267(b): "/s/ [typed name]" with counsel's name, address
# and telephone; SCCTAPP-CERT-001).
closing:
  - group:
      - {text: "{date}", indent: 36, optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 9.6}
      - each: signature.signers
        above: 9.6
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 10.8}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4, optional: true}
      - {text: "{signature.lines}", left: 230.4, optional: true, above: 7.2}
    above: 28.8
