# SCACR Rule 208(b)(5): principal briefs shall not exceed fifty (50) pages, except in death-sentence
# cases (https://www.sccourts.org/resources/judicial-community/court-rules/appellate/rule-208/).
params:
  page_limit: 50
  # Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
  # typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12; the body's table, fb-595.54.14) and
  # break every line and page where the typst render does, so a difference fails. The table's `pad` and `above` give
  # LaTeX the places to break a page that typst has between the rows (docs/open-items/fb-595.54.67.md).
  cross_engine: gate
