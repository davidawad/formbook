# SCACR Rule 208(b)(5): reply briefs shall not exceed twenty-five (25) pages
# (https://www.sccourts.org/resources/judicial-community/court-rules/appellate/rule-208/).
params:
  page_limit: 25
  # Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
  # typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where the
  # typst render does, so a difference fails (fb-595.54.67; the docx page lookup of a note's find, fb-595.54.82).
  cross_engine: gate
