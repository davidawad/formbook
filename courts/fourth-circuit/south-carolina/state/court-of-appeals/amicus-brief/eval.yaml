# SCACR Rule 208(b)(5): principal briefs shall not exceed fifty (50) pages, except in death-sentence
# cases (https://www.sccourts.org/resources/judicial-community/court-rules/appellate/rule-208/).
params:
  page_limit: 50
  # Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
  # typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where the
  # typst render does, so a difference fails. The layout's `footnote.clearance` (12.5; 11 to 14 give the same pages) is
  # measured: at the default 9.1 typst set an eleven-line note to 0.17 pt of the text block's foot on p13, where LaTeX
  # and Word moved its line to the next page (docs/open-items/fb-595.54.67.md).
  cross_engine: gate
