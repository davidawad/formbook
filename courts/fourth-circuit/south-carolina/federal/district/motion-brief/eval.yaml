# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.9), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: L.R. 7.05(B)(1), an initial brief is at most 35 double-spaced pages.
  page_limit: 35
