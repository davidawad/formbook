# U.S. District Court for the District of South Carolina (scd): a memorandum in support of a motion, on the generic
# FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with D.S.C.'s local rules overlaid here. The shared
# document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`).
# Rules: D.S.C. Local Civil Rules (February 22, 2023), https://www.scd.uscourts.gov/Rules/Civil%20Rules%20-%20Current.pdf
# (fetched 2026-10-14; ../README.md quotes them). The base already meets L.R. 1.05(A) (one-inch margins), 1.05(C)
# (12-point caption, text and footnotes) and 1.05(D) (only the page number in the margin). The 35-page limit of
# L.R. 7.05(B)(1) is checked on the render (../eval.yaml params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, two lines; the division is the sample's.
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE DISTRICT OF SOUTH CAROLINA"
# L.R. 1.05(E): text double-spaced, 27.6 pt (twice the 13.8 pt single line of 12 pt Times New Roman); indented
# quotations and footnotes single-spaced.
pitch: {body: 27.6}
footnote: {size: 12, gap: 6}
quote: {left: 36, right: 36, above: 12, below: 12}
# Headings single-spaced: a section centered in bold capitals (the sample's "#" and "##"), a sub-section in bold at
# the margin (its label written in the sample).
heading:
  - {align: center, bold: true, upper: true, above: 14.4, below: 10.8}
  - {align: center, bold: true, upper: true, above: 14.4, below: 10.8}
  - {bold: true, above: 12, below: 10.8}
# FRCP 10(a): the court's name and division in bold capitals; the parties at the left (each party's names, a relator
# half an inch in, the designation an inch in, "v." half an inch in, the lines a short space apart); at the right the
# case number and the paper's title in bold capitals, centered; a rule under the parties (the exemplar's form, usage/SOURCE.md).
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division} DIVISION", align: center, bold: true, upper: true}
  - columns:
      - width: 234
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{relator}", optional: true, left: 36}
              - {text: "{designation}", left: 72, above: 10.8}
            between:
              - {text: "v.", left: 36, above: 10.8, below: 10.8}
      - valign: center
        blocks:
          - {text: "Case No. {case_number}", align: center}
          - {text: "{brief_title}", align: center, bold: true, upper: true, above: 13.8}
    above: 18
  - columns:
      - {width: 234, blocks: [{rule: 0.75}]}
      - {blocks: []}
    below: 14.4
# FRCP 11(a): the place and date at the left, the signers at the right (the firm, "By: /s/" and each signer with the
# District Court ID number, then the firm's address, telephone and e-mail and whom they represent), kept whole with
# the body's last paragraph.
closing:
  - group:
      - columns:
          - width: 237.6
            blocks:
              - {text: "{signature.location}"}
              - {text: "{signature.dated}"}
          - blocks:
              - {text: "{signature.firm_name}", optional: true}
              - {text: "By: /s/ {signature.by}", above: 13.8}
              - {text: "{signature.signers}"}
              - {text: "{signature.firm}", above: 7.2}
    above: 18
