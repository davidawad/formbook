# U.S. District Court for the Eastern District of North Carolina (nced): a memorandum supporting a motion, on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with E.D.N.C.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by
# `fb engines gen`). Rules: E.D.N.C. Local Civil Rules, May 2023 edition,
# https://www.nced.uscourts.gov/pdfs/Local%20Civil%20Rules%202023.pdf (fetched 2026-10-14; ../README.md quotes them).
# The base already meets LR 10.1(a) (letter paper, one-inch margins, typed matter, footnotes too, of at least 11 point)
# and LR 10.1(j) (every page numbered). The 30-page limit of LR 7.2(f)(2)(A) is checked on the render (../eval.yaml).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a), LR 10.1(b): the court's name; the division is the sample's (the typst template asserts it).
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE EASTERN DISTRICT OF NORTH CAROLINA"
# LR 10.1(a): double-spaced; 27.6 pt, twice the 13.8 pt single line.
pitch: {body: 27.6}
# LR 10.1(a): footnotes are typed matter, 12 point like the text, single-spaced.
footnote: {size: 12, gap: 7, widows: true}
quote: {below: 27.6}
# Headings on the body pitch, a single line above and below: a section centered in bold capitals, unnumbered; a point
# "I." in bold at the margin and a sub-point "A." in bold half an inch in, each label in a 0.6 in box with the title's
# later lines hung under it (the sample writes the title alone; a section's points count from I. again).
heading:
  - {align: center, bold: true, upper: true, pitch: body, above: 13.8, below: 13.8}
  - {bold: true, number: "I.", label_box: 43.2, pitch: body, above: 13.8, below: 13.8}
  - {bold: true, number: "A.", label_box: 43.2, left: 36, pitch: body, above: 13.8, below: 13.8}
# LR 10.1(b) to (e): the court and division, the case number (a blank on an initial filing), the caption (each party's
# names, its designation an inch in, "v." between them, a column of ")" as tall as the parties: the form of the
# rule's own example) closed by a rule under the parties and their ")" (the exemplar's), and the title, bold
# and centered beside the caption.
front:
  - {text: "{xd.court}", align: center}
  - {text: "{xd.district}", align: center}
  - {text: "{division} DIVISION", align: center, upper: true}
  - {text: "No. {case_number|______________}", align: center, above: 13.8}
  - columns:
      - width: 244.8
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 72, above: 13.8}
            between:
              - {text: "v.", above: 13.8, below: 13.8}
      - {width: 18, repeat: ")"}
      - valign: center
        blocks:
          - {text: "{brief_title}", align: center, bold: true, left: 18}
    above: 13.8
  - columns:
      - {width: 262.8, blocks: [{rule: 0.75}]}
      - {blocks: []}
    below: 13.8
# LR 10.1(f) to (i): the date ("This the .."), then each attorney's firm, the signature ("BY: /s/" under a firm), each
# signer's typed name with bar number and e-mail, the address, telephone and fax, and the party represented, three
# inches in, a blank line between the groups; kept whole with the body's last paragraph.
closing:
  - group:
      - {text: "This the {date}."}
      - {text: "{signature.firm}", optional: true, left: 216, above: 27.6}
      - when: signature.firm
        blocks:
          - {text: "BY: /s/ {signature.by}", left: 216, above: 13.8}
      - unless: signature.firm
        blocks:
          - {text: "/s/ {signature.by}", left: 216, above: 27.6}
      - each: signature.signers
        blocks:
          - {text: "{name}", left: 216}
          - {text: "{lines}", left: 216}
        gap: 13.8
        above: 13.8
      - {text: "{signature.address}", left: 216, above: 13.8}
      - {text: "{signature.counsel_for}", optional: true, left: 216, above: 13.8}
    above: 27.6
# LR 7.2(f)(3): a memorandum that uses the word limit certifies its word count (the sample's `word_count`), on a page
# of its own, signed as the memorandum. Fed. R. Civ. P. 5(d)(1)(B): a certificate of service when the sample gives
# one (a paper served other than by CM/ECF), with the persons served half an inch in, its date and the signature.
after_tail:
  - when: word_count
    blocks:
      - {break: true}
      - group:
          - {text: "CERTIFICATE OF COMPLIANCE WITH WORD LIMIT", align: center, bold: true, pitch: body}
          - {text: "The undersigned certifies that this memorandum complies with the word limit of Local Civil Rule 7.2(f)(3)(A) and contains {word_count} words, excluding the matters listed in Local Civil Rule 7.2(f)(1), as counted by the word-processing software used to prepare it.", pitch: body, indent: 36, above: 13.8}
          - {text: "{signature.firm}", optional: true, left: 216, above: 13.8}
          - when: signature.firm
            blocks:
              - {text: "BY: /s/ {signature.by}", left: 216, above: 13.8}
          - unless: signature.firm
            blocks:
              - {text: "/s/ {signature.by}", left: 216, above: 13.8}
          - each: signature.signers
            blocks:
              - {text: "{name}", left: 216}
              - {text: "{lines}", left: 216}
            gap: 13.8
            above: 13.8
          - {text: "{signature.address}", left: 216, above: 13.8}
          - {text: "{signature.counsel_for}", optional: true, left: 216, above: 13.8}
  - when: certificate
    blocks:
      - group:
          - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, pitch: body}
          - {text: "{certificate.text}", pitch: body, indent: 36, above: 13.8}
          - {text: "{certificate.served}", left: 36, above: 13.8}
          - {text: "This the {certificate.date}.", pitch: body, indent: 36, above: 13.8}
          - {text: "{signature.firm}", optional: true, left: 216, above: 13.8}
          - when: signature.firm
            blocks:
              - {text: "BY: /s/ {signature.by}", left: 216, above: 13.8}
          - unless: signature.firm
            blocks:
              - {text: "/s/ {signature.by}", left: 216, above: 13.8}
          - each: signature.signers
            blocks:
              - {text: "{name}", left: 216}
              - {text: "{lines}", left: 216}
            gap: 13.8
            above: 13.8
          - {text: "{signature.address}", left: 216, above: 13.8}
          - {text: "{signature.counsel_for}", optional: true, left: 216, above: 13.8}
        above: 27.6
