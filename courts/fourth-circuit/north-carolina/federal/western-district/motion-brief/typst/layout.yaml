# U.S. District Court for the Western District of North Carolina (ncwd): a memorandum supporting a motion, on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with W.D.N.C.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by
# `fb engines gen`). Rules: W.D.N.C. Local Civil Rules, revised effective 2022-12-01,
# https://www.ncwd.uscourts.gov/sites/default/files/local_rules/Revised%20Local%20Rules%20120122.pdf (fetched
# 2026-10-14; ../README.md quotes them). The base already meets LCvR 7.1(d) (12-point font, one-inch margins, each
# page numbered); its 25-page limit is checked on the render (../eval.yaml params.page_limit).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, two lines.
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "FOR THE WESTERN DISTRICT OF NORTH CAROLINA"
# LCvR 7.1(d): lines double-spaced; 27.6 pt, twice the 13.8 pt single line of 12 pt Times New Roman.
pitch: {body: 27.6}
quote: {below: 27.6}
# Headings single-spaced, a blank line below, two above: a section centered in bold capitals, a point in bold at the
# margin, a sub-point in bold italics (the sample writes each label).
heading:
  - {align: center, bold: true, upper: true, above: 24, below: 13.8}
  - {bold: true, above: 24, below: 13.8}
  - {bold: true, italic: true, above: 24, below: 13.8}
# FRCP 10(a): the court's name in bold with the division (the sample's), the civil action number centered under it;
# the parties at the left (each party's names, its designation an inch in, "v." an inch in a line from each), a column
# of ")" as tall as theirs, and the paper's title in bold, centered beside them, with the rules it moves under; a rule under the parties and their ")" (the exemplar's).
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - {text: "Civil Action No. {case_number|______________}", align: center, bold: true}
  - columns:
      - width: 208.8
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 72, above: 13.8}
            between:
              - {text: "v.", left: 72, above: 13.8, below: 13.8}
      - {width: 21.6, repeat: ")"}
      - valign: center
        blocks:
          - {text: "{brief_title}", align: center, bold: true}
          - {text: "{brief_rules}", align: center, optional: true}
    gutter: 7.2
    above: 27.6
  - columns:
      - {width: 237.6, blocks: [{rule: 0.75}]}
      - {blocks: []}
    below: 24
# FRCP 11(a): the date line, then each firm's block in the right half of the page (the firm, "By: /s/" and the signer,
# the lines the sample gives: names, bar numbers, address, telephone, e-mail), a blank line between blocks; kept whole
# with the body's last paragraph.
closing:
  - group:
      - {text: "{signature.date_line}"}
      - each: signature.blocks
        blocks:
          - {text: "{firm}", left: 216}
          - {text: "By: /s/ {by}", optional: true, left: 216}
          - {text: "{lines}", left: 216}
        gap: 24
        above: 24
    above: 24
# The Standing Order of June 18, 2024, In re: Use of Artificial Intelligence, No. 3:24-mc-104 (W.D.N.C.): counsel
# certifies that no artificial intelligence was used in the research (but that built into the named research
# services) and that every statement and citation was checked, when the sample sets `ai_certification` (wording as
# filed: ../README.md, Known gaps); then the certificate of service by CM/ECF (Fed. R. Civ. P. 5(b)(2)(E)) with the
# counsel served, when the sample gives `service`. Each signed again, its last paragraph kept with the signature.
after_tail:
  - when: ai_certification
    blocks:
      - {text: "CERTIFICATION REGARDING USE OF ARTIFICIAL INTELLIGENCE", align: center, bold: true, above: 24, below: 13.8, keep: true}
      - {text: "Pursuant to the June 18, 2024 Standing Order of this Court *In Re: Use of Artificial Intelligence*, 3:24-mc-104, counsel, by signing above, submits the following certification regarding {ai_title}.", pitch: body, indent: 36}
      - {text: "1. No artificial intelligence was employed in doing the research for the preparation of this Memorandum, with the exception of such artificial intelligence embedded in the standard on-line legal research sources Westlaw, Lexis, FastCase, and Bloomberg, as well as Google and Google Scholar;", pitch: body, indent: 36}
      - group:
          - {text: "2. Every statement and every citation to an authority contained in this Memorandum has been checked by the undersigned as to the accuracy of the proposition for which it is offered, and the citation to authority provided.", pitch: body, indent: 36}
          - {text: "{signature.date_line}", above: 24}
          - each: signature.blocks
            blocks:
              - {text: "{firm}", left: 216}
              - {text: "By: /s/ {by}", optional: true, left: 216}
              - {text: "{lines}", left: 216}
            gap: 24
            above: 24
  - when: service
    blocks:
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, above: 24, below: 13.8, keep: true}
      - {text: "This is to certify that the undersigned has this day electronically filed the foregoing {brief_title} with the Clerk of the Court using the CM/ECF system which will send notification of such filing to the following counsel of record:", pitch: body, indent: 36}
      - group:
          - each: service.counsel
            blocks:
              - {text: "{.}"}
            gap: 24
            above: 24
          - {text: "{signature.date_line}", above: 24}
          - each: signature.blocks
            blocks:
              - {text: "{firm}", left: 216}
              - {text: "By: /s/ {by}", optional: true, left: 216}
              - {text: "{lines}", left: 216}
            gap: 24
            above: 24
