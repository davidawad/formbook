# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17.9), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: L.R. 105.3 caps a memorandum in support at 30 pages, and L.R. 105.4 asks a table of contents of any
  # memorandum over 15 pages. The FRCP base sets no table of contents after a caption on page 1 (a contents page the
  # frontmatter switches off leaves the cover's page break), so the render is held to the 15 pages that need none.
  page_limit: 15
