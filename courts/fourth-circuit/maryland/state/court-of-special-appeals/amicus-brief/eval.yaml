# Numbers stated by the Maryland rules for this doc type (../rules.md). Stricter than the default eval (12 pt).
# font.size_pt: Md. Rule 8-112(c)(1): proportionally spaced type in the text and footnotes "shall not be smaller than 13 point".
# params.margin_pt is left at the default 72 pt (1 in): Md. Rule 1-301(c) requires at least one inch.
# The amicus length limit (Rule 8-503(d)(4)) is a word count, not a page limit: no params.page_limit is set.
font:
  size_pt: 13
