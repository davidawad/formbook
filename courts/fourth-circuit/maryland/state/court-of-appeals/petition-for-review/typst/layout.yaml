# Court of Appeals of Maryland (Supreme Court of Maryland, md): petition (an original petition to the Court, such as a
# petition challenging a legislative districting plan). The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace
# to Md. Rules 1-301(c), 8-112, 8-503 and 8-504 (../rules.md, MD-*); lengths in points. No case text here: every
# string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # MD-FORM-004: not less than 13 points for proportionally spaced fonts, footnotes too
pitch:
  body: 29.9              # MD-FORM-002: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # MD-FORM-002: headings, indented quotations and footnotes single spaced (1.15 x 13 pt)
margin: {top: 108, bottom: 72, left: 108, right: 72}   # MD-FORM-001: top and left 1 1/2 in, bottom and right 1 in
indent: 36
# MD-FORM-005: pages consecutively numbered; the cover prints no number, the tables (when present) in roman
# numerals, the body from 1.
page_number: {align: center, front: lower-roman}
footnote: {size: 13, gap: 7}            # MD-FORM-004, -002: 13 points, single spaced
quote: {left: 36, right: 36, above: 13, below: 13}     # MD-FORM-002: indented quotations, single spaced
heading:
  - {align: center, bold: true, above: 15.6, below: 13}
  - {bold: true, above: 15.6, below: 10.4}
  - {bold: true, italic: true, above: 14.3, below: 7.8}
# A table of the body (a pipe table of figures): ruled rows, single spaced (MD-FORM-002 exempts no table; its cells
# are not running text).
table: {stroke: 0.5, pad: 3.6, gutter: 14.4, above: 13, below: 13}
# The cover (MD-CONV-001, MD-CONV-004): the Court, the docket number and term, the parties (each side's names, its
# designation indented; "v." before a side that has a designation), the proceedings below, the title, then counsel.
cover:
  - {text: "IN THE", align: center, bold: true}
  - {text: "SUPREME COURT OF MARYLAND", align: center, bold: true}
  - {text: "{record_number}", align: center, bold: true, above: 15.6, optional: true}
  - {text: "{term}", align: center, optional: true}
  - each: caption
    above: 20.8
    between:
      - when: next.designation
        blocks:
          - {text: "v.", indent: 36, above: 10.4, below: 10.4}
    gap: 10.4
    blocks:
      - {text: "{names}"}
      - {text: "{designation}", indent: 36, optional: true}
  - {text: "{proceeding}", align: center, above: 15.6, optional: true}
  - {text: "{doc_title}", align: center, bold: true, above: 28.6}
  - each: counsel
    blocks:
      - {text: "{names}", above: 15.6}
      - {text: "{lines}"}
# Rule 8-504(a) as the petitions follow it (MD-CONV-004): the table of contents unless `toc: false`, and the table of
# citations when the petition keys its authorities, each on its own page; the citations grouped by kind, a list of
# seven pages or more "passim".
contents: {title: "TABLE OF CONTENTS", when: toc, default: true, depth: 3, col: 36, hang: 19.5, step: 19.5, above: 11.7}
authorities:
  title: "TABLE OF CITATIONS"
  col: 56
  hang: 28.8
  above: 7.8
  passim: 7
  group: {bold: true, above: 15.6, below: 2.6}
  kinds:
    - {kind: case, title: "CASES"}
    - {kind: statute, title: "STATUTES"}
    - {kind: other, title: "OTHER AUTHORITIES"}
    - {kind: rule, title: "RULES"}
    - {kind: constitution, title: "CONSTITUTIONAL PROVISIONS"}
# After the request for relief: the closing line and each signature block, never split; then the certification of
# word count and compliance (MD-CERT-001, the official form) on its own page when the petition states its count.
keep_with_closing: true
closing:
  - group:
      - {text: "{submitted}", pitch: body, optional: true}
      - each: signature
        blocks:
          - {text: "{lines}", above: 10.4}
    above: 15.6
  - when: word_count
    blocks:
      - {break: true}
      - {text: "CERTIFICATION OF WORD COUNT AND COMPLIANCE WITH RULE 8-112", align: center, bold: true, below: 15.6, keep: true}
      - {text: "1. This petition contains {word_count} words, excluding the parts exempted from the word count by Rule 8-503.", pitch: body, indent: 36}
      - {text: "2. This petition complies with the font, spacing, and type size requirements stated in Rule 8-112.", pitch: body, indent: 36}
      - each: certificate_signature
        blocks:
          - {text: "{lines}", above: 15.6}
# The body's pertinent-law part (Rule 8-504(a)(8)) after the certification, on its own page; then the certificate of
# service (Md. Rule 1-321) on its own page.
tail: {at: "CITATION AND VERBATIM", break: true, pitch: 29.9, indent: 36}
after_tail:
  - {break: true}
  - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, below: 15.6, keep: true}
  - {text: "{service.text|____________}", pitch: body, indent: 36}
  - when: service.recipients
    blocks:
      - each: service.recipients
        blocks:
          - {text: "{names}", above: 15.6}
          - {text: "{lines}"}
  - {text: "{service.signature}", above: 15.6}
