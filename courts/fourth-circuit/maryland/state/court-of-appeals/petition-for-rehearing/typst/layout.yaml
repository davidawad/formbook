# Court of Appeals of Maryland (Supreme Court of Maryland, md): motion for reconsideration (petition for rehearing).
# The whole layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this
# file by `fb engines gen`, fb-595.54.12). Numbers trace to Md. Rules 1-301(c), 8-112 and 8-605 (../rules.md, MD-*);
# lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a
# court constant.
size: 13                  # MD-FORM-004: not less than 13 points for proportionally spaced fonts, footnotes too
pitch:
  body: 29.9              # MD-FORM-002: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # MD-FORM-002: headings, indented quotations and footnotes single spaced (1.15 x 13 pt)
margin: {top: 108, bottom: 72, left: 108, right: 72}   # MD-FORM-001: top and left 1 1/2 in, bottom and right 1 in
indent: 36
page_number: {align: center, from: 2}   # MD-FORM-005: pages numbered consecutively; the caption page counts, unprinted
footnote: {size: 13, gap: 7}            # MD-FORM-004, -002: 13 points, single spaced
quote: {left: 36, right: 36, above: 13, below: 13}   # MD-FORM-002: indented quotations, single spaced
heading:
  - {align: center, bold: true, above: 15.6, below: 13}
  - {bold: true, above: 15.6, below: 10.4}
  - {bold: true, italic: true, above: 14.3, below: 7.8}
# The caption page (MD-CONV-001, MD-CONV-004): the Court, the docket number and term, the parties (the designation
# indented under the names, "v." between the sides), the title and counsel, the groups two to a row so the page holds
# them. Set as the top of the body ending in a page break (the docx engine sets `cover` only before tables, and a
# petition without tables has none): the same page 1 in every engine.
front:
  - {text: "IN THE", align: center, bold: true}
  - {text: "SUPREME COURT OF MARYLAND", align: center, bold: true}
  - {text: "{record_number}", align: center, bold: true, above: 10.4}
  - {text: "{term}", align: center, optional: true}
  - each: caption
    above: 14.4
    between:
      - {text: "v.", left: 36, above: 7.2, below: 7.2}
    blocks:
      - {text: "{names}"}
      - {text: "{designation}", left: 36, optional: true}
  - {text: "{proceeding}", align: center, above: 15.6, optional: true}
  - {text: "{doc_title}", align: center, bold: true, above: 21.6}
  - columns: {each: counsel, per_row: 2, row_gap: 10.4, blocks: [{text: "{names}"}, {text: "{lines}"}]}
    gutter: 21.6
    above: 14.4
  - {break: true}
# After the conclusion: the closing line and each signature block, never split.
closing:
  - {text: "{submitted}", pitch: body, above: 10.4, optional: true}
  - each: signature
    blocks:
      - group:
          - {text: "{lines}"}
        above: 15.6
# Md. Rule 20-201(f): the certificate that the submission holds no restricted information, on its own page.
  - {break: true}
  - {text: "MARYLAND RULE 20-201(f) CERTIFICATE", align: center, bold: true, below: 15.6, keep: true}
  - {text: "{restricted_certificate.text}", pitch: body, indent: 36}
  - each: restricted_certificate.signature
    blocks:
      - group:
          - {text: "{lines}"}
        above: 15.6
# The certificate of service (Md. Rule 1-321) on its own page: the filer's text, the persons served, the signature.
  - {break: true}
  - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, below: 15.6, keep: true}
  - {text: "{service.text}", pitch: body, indent: 36}
  - each: service.recipients
    blocks:
      - group:
          - {text: "{names}"}
          - {text: "{lines}"}
        above: 15.6
  - group:
      - {text: "{service.signature}"}
    above: 15.6
