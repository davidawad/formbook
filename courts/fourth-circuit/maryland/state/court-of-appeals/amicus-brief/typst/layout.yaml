# Court of Appeals of Maryland (Supreme Court of Maryland, md): amicus curiae brief. The whole layout, as data for the
# shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Md. Rules 1-301(c), 8-112, 8-503 and 8-504 (../rules.md, MD-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # MD-FORM-004: not less than 13 points for proportionally spaced fonts, footnotes too
pitch:
  body: 29.9              # MD-FORM-002: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # MD-FORM-002: headings, indented quotations and footnotes single spaced (1.15 x 13 pt)
margin: {top: 108, bottom: 72, left: 108, right: 72}   # MD-FORM-001: top and left 1 1/2 in, bottom and right 1 in
indent: 36
page_number: {align: center, from: 1}   # MD-FORM-005: every page numbered consecutively, the cover is page 1
footnote: {size: 13, gap: 7, clearance: 7.5}   # MD-FORM-004, -002: 13 points, single spaced; clearance: Word's footnote area on a page of three notes (p29), fb-595.54.82
quote: {left: 36, right: 36, above: 10.4, below: 15.6}   # MD-FORM-002: indented quotations, single spaced
heading:
  - {align: center, bold: true, upper: true, above: 20.8, below: 15.6}
  - {bold: true, hang: 36, above: 15.6, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
# The cover (MD-CONV-001): the court, the docket number, the parties, the proceeding below, the title and counsel
# (the groups two to a row, as the filed brief sets them, so the cover stays one page).
cover:
  - {text: "IN THE", align: center, bold: true}
  - {text: "{court_name}", align: center, bold: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 21.6}
  - each: caption
    above: 21.6
    between:
      - {text: "v.", align: center, above: 14.4, below: 14.4}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{proceeding}", align: center, above: 21.6, optional: true}
  - {text: "{trial_court_case}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 16, pitch: 18.4, above: 57.6}
  - columns: {each: counsel, per_row: 2, blocks: [{text: "{names}", bold: true}, {text: "{lines}"}]}
    gutter: 21.6
    above: 57.6
# Rule 8-504(a)(1): the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 19.5, step: 19.5, above: 11.7}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 19.5
  above: 11.7
  group: {bold: true, above: 15.6, below: 2.6}
# Rule 8-504(a)(9): the date and the signature block after the conclusion, never split: "/s/" and the typed name
# underlined, the bar number, address, telephone and e-mail beneath. Then the certification of word count and
# compliance (MD-CERT-001, the official form) and the certificate of service (Md. Rule 1-321), each on its own page.
closing:
  - group:
      - {text: "{date}", pitch: body, indent: 36, optional: true}
      - each: signature.signers
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 11.7}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, above: 7.8}
    above: 21.6
  - {break: true}
  - {text: "Certification of Word Count and Compliance with Rule 8-112", align: center, bold: true, upper: true, below: 15.6, keep: true}
  - {text: "This brief contains {word_count} words, excluding the parts of the brief exempted from the word count by Rule 8-503.", pitch: body}
  - {text: "This brief complies with the font, spacing, and type size requirements stated in Rule 8-112.", pitch: body, above: 7.8}
  - group:
      - {text: "/s/ *{signature.signer}*", underline: true, left: 230.4}
      - {text: "{signature.signer}", left: 230.4}
    above: 15.6
  - {break: true}
  - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 15.6, keep: true}
  - {text: "{service.paragraphs}", pitch: body}
  - group:
      - {text: "/s/ *{service.signer}*", underline: true, left: 230.4}
      - {text: "{service.signer}", left: 230.4}
    above: 5.2
