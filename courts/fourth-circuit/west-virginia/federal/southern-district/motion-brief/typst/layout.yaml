# U.S. District Court for the Southern District of West Virginia (wvsd): a memorandum of law in support of a motion to
# dismiss, on the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with the S.D. W. Va. local rules
# overlaid here. The shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged
# layout by `fb engines gen`). Rules: Local Rules of Procedure, S.D. W. Va. (amended June 8, 2017),
# https://www.wvsd.uscourts.gov/sites/wvsd/files/LocalRulesofProcedure-June2017.pdf (fetched 2026-10-14; ../README.md
# quotes them). The base already meets LR Civ P 7.1(a)(3) (8 1/2 x 11 paper, the text double spaced, margins of at
# least one inch, page numbers in the margin) and (a)(4) (a proportional face of 12 point or larger, footnotes too).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, as the exemplar sets it.
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE SOUTHERN DISTRICT OF WEST VIRGINIA"
# The caption page unnumbered, the body numbered from 1 at the foot, centered.
page_number: {align: center, front: lower-roman}
# LR Civ P 7.1(a)(3): footnotes may be single spaced, at 12 point ((a)(4)): 7 pt apart, 12.6 pt from the text to the
# rule.
footnote: {size: 12, pitch: 13.8, gap: 7, clearance: 12.6}
# LR Civ P 7.1(a)(3): quotations of more than two lines may be indented and single spaced: half an inch in on each
# side, 12 pt above and below.
quote: {left: 36, right: 36, above: 12, below: 12, pitch: single}
# LR Civ P 7.1(a)(3): headings may be single spaced: 12 pt below each, 18 pt above a section, 12 pt above a point; a
# section centered in bold, unnumbered; the points numbered by the template, "I." and "A." in bold, "1." and "a." in
# roman, each label in a half-inch box at its level's indent (half an inch a level) with the title's later lines hung
# under it.
heading:
  - {align: center, bold: true, above: 18, below: 12}
  - {bold: true, number: "I.", label_box: 36, above: 12, below: 12}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 12, below: 12}
  - {number: "1.", label_box: 36, left: 72, above: 12, below: 12}
  - {number: "a.", label_box: 36, left: 108, above: 12, below: 12}
# FRCP 10(a), 7(b)(2): the caption page: the court's name and division centered in bold; a double line below it the
# parties, each side's lead ("v.") half an inch in, its names, its designation an inch in, a blank line between sides;
# beside them a column of ")" as high as they are; at the right, centered on their height, the file number and the
# judge; a double line below, the paper's title centered in bold; half an inch below it the counsel 3.25 inches in, a
# blank line between groups (the exemplar's).
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", optional: true, align: center, bold: true, upper: true}
  - columns:
      - width: 216
        blocks:
          - each: caption
            blocks:
              - {text: "{lead}", optional: true, left: 36}
              - {text: "{names}"}
              - {text: "{designation}", optional: true, left: 72}
            between:
              - {text: ""}
      - {width: 21.6, repeat: ")", align: center}
      - valign: center
        blocks:
          - {text: "{case_label|Civil Action No.} {case_number}", left: 14.4}
          - {text: "{judge}", optional: true, left: 14.4}
    gutter: 0
    above: 24
  - {text: "{brief_title}", align: center, bold: true, above: 24}
  - each: counsel
    gap: 13.8
    blocks:
      - {text: "{names}", left: 234}
      - {text: "{lines}", optional: true, left: 234}
    above: 36
front: []
# FRCP 11(a): a double line below the body "Dated:" at the margin; a double line below it, 3.25 inches in, the
# signature lines as the filer gives them (an empty line a blank line). Kept whole.
closing:
  - group:
      - {text: "Dated: {date}"}
      - {text: "{signature}", left: 234, above: 24}
    above: 24
