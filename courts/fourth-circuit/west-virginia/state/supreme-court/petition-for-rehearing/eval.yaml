# West Virginia Rule 25 petition for rehearing (rules.md WVA-REH-002): the 15-page limit excludes the cover, tables and
# certificate of service (RAP 38(c)). DEF-LEN-001 counts every page of the PDF, so no page_limit is set here: a total
# count cannot express a body-only limit, and a total limit of 15 would reject a compliant filing.
# Gate 4 CROSS-ENGINE: report, not gate. The latex and docx engines are generated from typst/layout.yaml (`fb engines
# gen`, fb-595.54.12); pages and page ends are equal in all three, but two lines differ in both latex and docx
# (416/420): a keyed citation whose link starts with the section sign ("[§ 22-6-8(e)](toa:..)") gets its page mark
# after its first word, "§", and LaTeX and Word then break between "§" and its number (p9 line 16, p10 line 5), where
# typst keeps them together. An open defect of the shared model (docs/open-items/fb-595.54.21.md).
params:
  cross_engine: report
