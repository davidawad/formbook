# West Virginia brief (rules.md WVA-LEN-001): a petitioner or respondent brief may not exceed 40 pages, excluding the cover,
# tables and certificate of service (RAP 38(c)). The total page count checked here is a stricter count.
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  page_limit: 40
  cross_engine: gate
  # typst sets footnote 3 on page 6 while its mark (the last line of the quotation, "emotional injury.3") stays on
  # page 5; LaTeX moves that line on with its note, and 18 of 24 page ends differ after it. The model does not yet
  # keep a note on its mark's page in typst (docs/open-items/fb-595.54.21.md, B5); reported, not gated.
  cross_engine_latex: report
  # docx the same since Footnote Text keeps typst's clearance + gap above the first note (fb-595.54.11.2): LibreOffice
  # then moves the quotation's last line on to p6 with note 3 (typst p5 ends "emotional injury.3", docx p5 "In its
  # order,"; 18 of 24 page ends differ after it), the anchor-line rule of fb-595.54.11.4; reported, not gated.
  cross_engine_docx: report
