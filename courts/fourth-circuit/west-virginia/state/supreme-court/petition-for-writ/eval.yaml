# West Virginia original-jurisdiction petition (rules.md WVA-WRIT-004): 40 pages, excluding the cover, tables,
# verification and certificate of service (RAP 38(c)). The total page count checked here is a stricter count.
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  page_limit: 40
  cross_engine: gate
  # LibreOffice keeps the anchor line of note 5 ("emotional distress claims.5") on page 9 and sets the note on page
  # 10, where typst and LaTeX move the line on with its note; 18 of 30 page ends differ after it. No docx setting
  # moves the line (fb-595.54.13; docs/open-items/fb-595.54.21.md, B6). Reported, not gated.
  cross_engine_docx: report
