# Supreme Court of Appeals of West Virginia (wva): amicus curiae brief (RAP 30, form per RAP 38). The whole layout, as
# data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb
# engines gen`, fb-595.54.12). Numbers trace to RAP 38(a), (b) and 30(e) (../../rules.md, WVA-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}).
size: 12                  # WVA-FORM-003: no smaller than 12-point proportionally spaced type
pitch:
  body: 27.6              # WVA-FORM-002: double-spaced text (Word's double, 2 x 1.15 x 12 pt)
  single: 13.8            # cover, headings, tables, quotations, signature: single (1.15 x 12 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # WVA-FORM-005: no less than one inch on all sides
indent: 36
page_number: {align: center, front: lower-roman}   # the cover unnumbered, the tables i, ii .., the brief 1, 2 ..
footnote: {size: 11, pitch: 12.65, gap: 7}   # WVA-FORM-004: footnotes no smaller than 11 point, single spaced (1.15 x 11)
quote: {left: 36, right: 36, above: 9.6, below: 14.4, gap: 6}   # WVA-FORM-002: indented quotations single spaced
heading:
  - {align: center, bold: true, upper: true, above: 14.4, below: 12}
  - {bold: true, hang: 36, above: 14.4, below: 9.6}
  - {bold: true, italic: true, hang: 36, above: 12, below: 9.6}
# WVA-COVER-001 (RAP 38(b)), WVA-AMI-001 (RAP 30(e)(1)): the court, the docket number, the caption (each party's names
# and designation), the title with the party supported, counsel's name, bar number, address, telephone and e-mail.
cover:
  - {text: "{court}", align: center, bold: true}
  - {text: "{appellate_case_no}", align: center, bold: true, above: 28.8}
  - each: caption
    above: 28.8
    blocks:
      - {text: "{names}", align: center, above: 14.4}
      - {text: "{designation}", align: center, italic: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, left: 36, right: 36, above: 50.4}
  - each: counsel
    above: 72
    blocks:
      - {text: "{names}", above: 9.6}
      - {text: "{lines}"}
# WVA-CONT-002, -003, WVA-AMI-001 (RAP 30(e)(2), (3)): the table of contents and the table of authorities, each on
# its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 36, step: 18, above: 9.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 9.6
  group: {bold: true, above: 14.4, below: 2.4}
# WVA-CERT-001 (RAP 38A): the typographical signature "/s/ name", each signer's bar number, the cosigners, the
# address, never split; WVA-CONT-010 (RAP 37): the certificate of service on its own page, with the court and the
# caption when the sample asks for them, signed again.
closing:
  - group:
      - {text: "{signature.preamble}", indent: 36, pitch: body, optional: true}
      - {text: "{date}", indent: 36, pitch: body, optional: true}
      - &signature
        group:
          - each: signature.signers
            blocks:
              - {text: "/s/ {name}", left: 230.4, above: 12}
              - {text: "{lines}", left: 230.4}
          - when: signature.cosigners
            blocks:
              - each: signature.cosigners
                blocks:
                  - {text: "{name}", left: 230.4, above: 7.2}
                  - {text: "{lines}", left: 230.4}
          - {text: "{signature.address}", left: 230.4, above: 3.6, optional: true}
        above: 7.2
    above: 28.8
  - when: service
    blocks:
      - {break: true}
      - when: service.caption
        blocks:
          - {text: "{court}", align: center, bold: true}
          - each: caption
            above: 7.2
            blocks:
              - {text: "{names}", align: center, above: 14.4}
              - {text: "{designation}", align: center, italic: true}
      - {text: "{service.heading}", align: center, bold: true, upper: true, above: 21.6, below: 12}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks:
              - {text: "{.}", left: 72, above: 12}
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - *signature
