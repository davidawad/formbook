# West Virginia amicus brief (rules.md WVA-AMI-002): an amicus brief may not exceed 25 pages, excluding the cover,
# tables and certificate of service (RAP 38(c)). DEF-LEN-001 counts every page of the PDF, so no page_limit is set here:
# a total count cannot express a body-only limit, and a total limit of 25 would reject a compliant filing.
