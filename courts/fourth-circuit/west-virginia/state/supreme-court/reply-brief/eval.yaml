# West Virginia reply brief (rules.md WVA-LEN-002): 20 pages, excluding the cover, tables and certificate of service
# (RAP 38(c)); DEF-LEN-001 counts every page of the PDF, so no page_limit is set here.
# Gate 4 CROSS-ENGINE: report, not gate. The latex and docx engines are generated from typst/layout.yaml (`fb engines
# gen`, fb-595.54.12) but break pages differently from typst on this sample: LaTeX keeps footnote 3 whole where typst
# splits it (p6), Word leaves a one-line widow typst avoids (p9). Both are shared-model items (docs/open-items/
# fb-595.54.21.md); the folder is gated once they are fixed in the model.
params:
  cross_engine: report
