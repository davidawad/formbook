# Supreme Court of Appeals of West Virginia (wva): reply brief (RAP 10(g), form per RAP 38). The whole layout, as data
# for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines
# gen`, fb-595.54.12). Numbers trace to RAP 38(a), (b) and 10(c) (../../rules.md, WVA-*); lengths in points. No case
# text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # WVA-FORM-003: no smaller than 12-point proportionally spaced type
pitch:
  body: 27.6              # WVA-FORM-002: double-spaced text (Word's double, 2 x 1.15 x 12 pt)
  single: 13.8            # cover, headings, tables, quotations, footnotes, signature: single (1.15 x 12 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # WVA-FORM-005: no less than one inch on all sides
indent: 36
page_number: {align: center, front: lower-roman}   # the cover unnumbered, the tables i, ii .., the brief 1, 2 ..
footnote: {size: 12, gap: 7}            # WVA-FORM-004: no smaller than 11 point (12 used), single spaced
quote: {left: 36, right: 36, above: 9.6, below: 14.4, gap: 6}   # WVA-FORM-002: indented quotations single spaced
heading:
  - {align: center, bold: true, upper: true, above: 14.4, below: 12}
  - {bold: true, hang: 36, above: 12, below: 9.6}
  - {bold: true, italic: true, hang: 36, above: 12, below: 9.6}
# WVA-COVER-001 (RAP 38(b)): the court, the caption beside the docket number, the title, counsel's name, bar number,
# address, telephone and e-mail.
cover:
  - {text: "IN THE SUPREME COURT OF APPEALS OF WEST VIRGINIA", align: center, bold: true}
  - columns:
      - blocks:
          - each: caption
            between:
              - {text: "v.", above: 14.4, below: 14.4}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", italic: true, left: 36, above: 7.2}
      - width: 158.4
        valign: center
        blocks:
          - {text: "No. {docket}", align: right, bold: true}
    gutter: 21.6
    above: 36
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 43.2}
  - each: counsel
    above: 72
    blocks:
      - {text: "{names}", bold: true, left: 230.4}
      - {text: "{lines}", left: 230.4}
# WVA-CONT-002, -003 (RAP 10(c)(1), (2)): the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 36, step: 18, above: 9.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 9.6
  group: {bold: true, above: 14.4, below: 2.4}
# WVA-CERT-001 (RAP 38A): the date and the signature block (the firm, each signer's "/s/" and typed name and bar
# number, the address), never split; WVA-CONT-010 (RAP 10(c)(9), 37): the certificate of service on its own page,
# signed again.
closing:
  - group:
      - {text: "{date}", optional: true}
      - &signature
        group:
          - {text: "{signature.firm}", bold: true, left: 230.4, optional: true}
          - each: signature.signers
            blocks:
              - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 12}
              - {text: "{name}", left: 230.4}
              - {text: "{lines}", left: 230.4}
          - {text: "{signature.lines}", left: 230.4, above: 9.6, optional: true}
        above: 9.6
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 12}
      - {text: "{service.paragraphs}", indent: 36, pitch: body}
      - each: service.recipients
        blocks:
          - {text: "{.}", left: 72, above: 9.6}
      - {text: "{service.closing}", indent: 36, pitch: body, optional: true}
      - *signature
