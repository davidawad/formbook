# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails. LaTeX passes XENG-001..003 (603/603 lines).
params:
  cross_engine: gate
  # docx: INPUT-answering-brief p11 (printed 8): footnote 16 (unsplit, the model's rule) does not fit under the line
  # "including gasoline, glues, and tar-based products.16"; typst and LaTeX move line and note to the next page,
  # LibreOffice keeps the line and moves only the note, so the page ends of p12-p19 follow. A renderer difference
  # (LibreOffice's note placement, docs/open-items/fb-595.54.82.md "Still missing"; docs/open-items/fb-595.54.66.md).
  cross_engine_docx: report
