# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails. LaTeX passes XENG-001..003 (451/451 lines).
# RAP 38(c) (courtswv.gov Rules of Appellate Procedure, fetched 2026-10-21): amicus brief 25 pages maximum, excluding the
# cover page, table of contents, table of authorities and certificate of service (rules.md WVACTAPP-LEN-005). DEF-LEN-001
# counts every page of the PDF, front matter included, so 25 is conservative: it can fail a compliant filing, never pass a
# non-compliant one.
params:
  page_limit: 25
  cross_engine: gate
  # docx: INPUT-amicus-brief p8: Word's footnote area is smaller than typst's (17.1 pt from the last body line to the
  # first note, typst more than 19.4), so Word keeps the line that anchors footnote 15 and the note on p8, typst and
  # LaTeX move them to p9; the page ends of p9-p13 follow. A shared-model difference (Word's footnote area),
  # docs/open-items/fb-595.54.66.md (XENG-002, XENG-003).
  cross_engine_docx: report
