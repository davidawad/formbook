# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails. LaTeX passes XENG-001..003 (313/313 lines).
params:
  cross_engine: gate
  # docx: INPUT-opening-brief p10: Word's footnote area is smaller than typst's, so Word keeps the first line of "Under
  # the Supremacy Clause" with footnote 3 on p10, typst and LaTeX move both to p11; the page ends of p11-p13 and the
  # contents and authorities pages after p9 follow. A shared-model difference (Word's footnote area),
  # docs/open-items/fb-595.54.66.md (XENG-002, XENG-003).
  cross_engine_docx: report
