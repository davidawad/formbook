# Intermediate Court of Appeals of West Virginia (wvactapp): petitioner's brief (agency appeal). The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12).
# Numbers trace to the West Virginia Rules of Appellate Procedure (../../rules.md, WVACTAPP-*); lengths in points. No
# case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # WVACTAPP-FORM-002 (RAP 38(a)): at least 12-point proportionally spaced type
pitch:
  body: 27.6              # WVACTAPP-FORM-001 (RAP 38(a)): double spaced (Word's double, 2 x 1.15 x 12 pt)
  single: 13.8            # RAP 38(a): footnotes and indented quotations may be single spaced; cover, headings, tables
margin: {top: 72, bottom: 72, left: 72, right: 72}   # WVACTAPP-FORM-003 (RAP 38(a)): at least one inch on all sides
indent: 36                # style: first-line indent of body paragraphs (the exemplars do the same)
page_number: {align: center, front: lower-roman}   # the cover unnumbered, the tables i, ii .., the brief from 1
footnote: {size: 12, gap: 7}             # WVACTAPP-FORM-002: footnotes at least 11 point (12 chosen), single spaced
quote: {left: 36, right: 36, above: 9.6, below: 14.4}   # WVACTAPP-FORM-001: indented quotations single spaced
heading:
  - {align: center, bold: true, upper: true, above: 14.4, below: 12}
  - {bold: true, hang: 36, above: 12, below: 9.6}
  - {bold: true, italic: true, hang: 36, above: 12, below: 9.6}
# The cover (RAP 38(b), WVACTAPP-COVER-001), in order: the court, the docket number beside the caption, the title, the
# counsel filing (WVACTAPP-OPEN-010).
cover:
  - {text: "IN THE INTERMEDIATE COURT OF APPEALS OF WEST VIRGINIA", align: center, bold: true}
  - columns:
      - blocks:
          - each: caption
            between:
              - {text: "v.", above: 14.4, below: 14.4}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", italic: true, left: 36}
      - width: 158.4
        valign: center
        blocks:
          - {text: "No. {docket}", align: right, bold: true}
    gutter: 21.6
    above: 36
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 43.2}
  - each: counsel
    above: 86.4
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 7.2}
      - {text: "{lines}", left: 230.4}
# RAP 10(c)(1), (2): the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 18, step: 18, above: 10.8}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 18
  above: 10.8
  group: {bold: true, above: 14.4, below: 2.4}
# The date and the signature block (RAP 38A(j), WVACTAPP-CERT-002: "/s/" signature, address, telephone, e-mail, bar
# number), never split; then the certificate of service (RAP 37, 10(c)(9), WVACTAPP-CERT-001) on a page of its own.
closing:
  - group:
      - {text: "{date}", optional: true, pitch: body, indent: 36}
      - {text: "{signature.firm}", bold: true, optional: true, left: 230.4, above: 9.6}
      - each: signature.signers
        between:
          - {text: "", left: 230.4}
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 4.8}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4}
      - {text: "{signature.lines}", left: 230.4, above: 7.2}
    above: 21.6
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, below: 12}
      - {text: "{service.paragraphs}", pitch: body, indent: 36}
      - when: service.recipients
        blocks:
          - each: service.recipients
            blocks: [{text: "{.}", left: 72, above: 12}]
      - {text: "{service.closing}", optional: true, pitch: body, indent: 36, above: 12}
      - each: signature.signers
        above: 12
        blocks:
          - {text: "/s/ *{name}*", underline: true, left: 230.4, above: 7.2}
          - {text: "{name}", left: 230.4}
          - {text: "{lines}", left: 230.4}
