# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # Word's table of authorities (p3) gives page 4 for "Smith v. Clark, 189 F. Supp. 2d 548" (typst and LaTeX 3): two
  # keyed links that start with the same words, and the docx page lookup finds the second. 990/991 lines identical,
  # pages and page ends equal. A shared-model request (docs/open-items/fb-595.54.51.md); reported, not gated
  # (fb-595.54.51). Word's footnote area (p13 on) is settled by the layout's footnote clearance.
  cross_engine_docx: report
