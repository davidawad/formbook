# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # Word's footnote area: under the 19-line footnote 1 that runs from p2 onto p3 Word keeps one more body line on p3
  # than typst and LaTeX (page 3/4 end differs, the pages after it agree); and LibreOffice fits a line typst fills
  # past the measure (p17 line 4, "(last" at 576.04 of 576 pt). Both are open shared-model items
  # (docs/open-items/fb-595.54.82.md: Word's footnote area, the line-fit tolerance); 502/505 lines identical, pages
  # equal. Reported, not gated (fb-595.54.51).
  cross_engine_docx: report
