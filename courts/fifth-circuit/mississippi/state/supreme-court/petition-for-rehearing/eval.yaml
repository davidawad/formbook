# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # LibreOffice fits a line typst fills past the measure: INPUT-petition-for-rehearing p17 line 4, "(last" at 576.04
  # of 576 pt (503/505 lines identical, pages and page ends equal). No docx_bias settles it: 0.05 pt already breaks
  # p2 line 2 earlier than typst. The line-fit tolerance is an open shared-model item (docs/open-items/fb-595.54.82.md);
  # reported, not gated (fb-595.54.51). Word's footnote area (p3/p4) is settled by the layout's footnote clearance.
  cross_engine_docx: report
