- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.txs.uscourts.gov/sites/txs/files/Crim_Court_Rules_JAK_June_2025.pdf
  text: USE OF GENERATIVE ARTIFICIAL INTELLIGENCE (AI) Attorneys and self-represented litigants must ensure that any filing prepared with the assistance of generative artificial intelligence (e.g. ChatGPT, Harvey.AI, or similar tools), is thoroughly reviewed for factual and legal accuracy prior to submission. These tools are capable of producing content that may be factually incorrect or legally unsound. The Court will hold attorneys and self-represented litigants fully accountable for all content submitted under their name or signature, regardless of whether it was drafted in part by generative AI. The Court will exercise its inherent authority to sanction conduct that abuses the judicial process, including reliance on inaccurate or frivolous AI-generated content. In re Goode, 821 F.3d 553, 559 (5th Cir. 2016) (courts may sanction local rule violations even absent bad faith showing). The Court will not accept the excuse that such content was prepared by AI, staff, or others when assessing potential sanctions. Attorneys are further reminded of their professional obligations under the Texas Disciplinary Rules of Professional Conduct, including the duty of candor to the tribunal and the prohibition against knowingly offering false statements of law. Disciplinary Rules Prof'l Conduct r. 3.03(a) (Tex. Attorneys must also remain proficient and competent in the practice of law, including recognizing the benefits and risks associated with relevant technology. The Court adopts and incorporates by reference Chief Judge Randy Crane's General Order 2025-04 on the Use of Generative Artificial Intelligence in Court Filings.
