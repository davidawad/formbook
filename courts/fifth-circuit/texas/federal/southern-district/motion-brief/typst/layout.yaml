# U.S. District Court for the Southern District of Texas (txsd): a motion to dismiss with its brief, on the generic
# FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with S.D. Tex.'s rules overlaid here. The shared document
# model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`).
# Rules: S.D. Tex. Local Rules LR10.2 (double spaced, 8 1/2 x 11, one-inch margins) and the type size of the
# Galveston Division Rules of Practice and Judge Hanks's procedures (13-point), as far as they could be retrieved
# (../README.md quotes them, with the gaps). The base already meets the paper and margins.
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, second line.
constants:
  district: "FOR THE SOUTHERN DISTRICT OF TEXAS"
# Galveston Div. R. of Practice f, Judge Hanks Procs. 7.A: 13-point type, footnotes too (not in LR10.2; README.md).
size: 13
# LR10.2: double spaced, 2 x the type size; a single line 1.15 x the size (court title, caption, signature).
pitch: {body: 26, single: 14.95}
footnote: {size: 13}
quote: {below: 26}
# Pages numbered at the foot, centered: the cover unnumbered, the contents from i, the brief from 1 (the exemplar's
# numbering, which its contents cite).
page_number: {align: center, front: lower-roman}
# Headings at the body size and pitch, bold, kept with what follows, no space of their own (the double pitch sets
# them off): a section centered in capitals, an argument heading at the margin. The sample types each number.
heading:
  - {align: center, bold: true, upper: true, pitch: body}
  - {bold: true, pitch: body}
# FRCP 10(a): the cover: the court's name with the division; the parties at the left (each designation indented,
# "v." between them), a column of section marks beside them (the Texas convention, the exemplar's), the civil action
# number and the judge at the right; then the title of the paper, bold and centered at the body pitch.
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division} DIVISION", align: center, bold: true, upper: true, optional: true}
  - columns:
      - width: 237.6
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 36}
            between:
              - {text: "v.", above: 9.65, below: 9.65}
      - {width: 28.8, repeat: "§", align: center}
      - valign: center
        blocks:
          - {text: "{case_label|Civil Action No.} {case_number}"}
          - {text: "{judge}", optional: true, above: 9.65}
    above: 17.5
  - {text: "{brief_title}", align: center, bold: true, pitch: body, above: 26}
front: []
# The contents (when the sample asks for them, `toc: true`), on their own page after the cover: every heading of
# the first two levels and each certificate, with its page, an argument heading a step in.
contents: {title: "TABLE OF CONTENTS", depth: 2, col: 36, hang: 18, step: 18, above: 0, when: toc}
# FRCP 11(a): the date at the margin, then the signature block 3.25 inches in, single spaced: the lead, the "By"
# line and the signer's name, bar number, address, telephone and e-mail and whom they represent; kept whole and
# with the last paragraph. Then each certificate the sample gives, its heading centered in capitals, its text at the
# body pitch, its signature in the signature column, kept whole: the word count and the conference (the judge's
# procedures, when the filing cites them) and the service (FRCP 5(b)(2)(E), through CM/ECF).
closing:
  - group:
      - {text: "{signature.date}", optional: true}
      - columns:
          - {width: 234, blocks: []}
          - blocks:
              - {text: "{signature.lead|Respectfully submitted,}"}
              - {text: "{signature.by}", optional: true, above: 8.75}
              - {text: "{signature.lines}", above: 6.5}
        above: 17.5
    above: 26
  - when: word_count_certificate
    blocks:
      - group:
          - {text: "CERTIFICATE OF WORD COUNT", heading: 1}
          - {text: "{word_count_certificate}", pitch: body, indent: 36}
          - {text: "{certificate_signature}", optional: true, left: 234, above: 8.75}
        above: 26
  - when: certificate_of_conference
    blocks:
      - group:
          - {text: "CERTIFICATE OF CONFERENCE", heading: 1}
          - {text: "{certificate_of_conference}", pitch: body, indent: 36}
          - {text: "{certificate_signature}", optional: true, left: 234, above: 8.75}
        above: 26
  - when: certificate_of_service
    blocks:
      - group:
          - {text: "CERTIFICATE OF SERVICE", heading: 1}
          - {text: "{certificate_of_service}", pitch: body, indent: 36}
          - {text: "{certificate_signature}", optional: true, left: 234, above: 8.75}
        above: 26
