  field: oral_argument_default
  url: https://www.txnd.uscourts.gov/judge/magistrate-judge-rebecca-rutherford
  text: Judge Rutherford routinely sets discovery motions for hearing on an expedited basis. She allows oral argument on nondiscovery motions on a case-by-case basis. Counsel should advise the Court if they believe oral argument would be particularly helpful in a given matter.
- topic: Proposed orders
  field: proposed_orders
  url: https://www.txnd.uscourts.gov/judge/magistrate-judge-rebecca-rutherford
  text: Movants should submit proposed orders via the Court's Electronic Case Filing system.
- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.txnd.uscourts.gov/judge/magistrate-judge-rebecca-rutherford
  text: Parties must not unreasonably file pleadings, motions, or other papers under seal. Rather, the parties must attempt to file unsealed as much of a pleading, motion, or other paper as they reasonably can without undermining the protections conferred by any applicable protective order. Private or sensitive information, including social-security numbers, taxpayer-identification numbers, financial-account numbers, minors' names, and dates of birth, should be redacted from any document filed with the Court.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.txnd.uscourts.gov/judge/magistrate-judge-rebecca-rutherford
  text: Judge Rutherford strictly enforces Local Civil Rule 83.10, requiring local counsel in all cases where lead counsel appearing in a case does not reside or maintain his or her principal office in this district. Parties desiring to proceed without local counsel must obtain leave by filing a written motion.
