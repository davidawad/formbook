- topic: Oral argument
  field: oral_argument_default
  url: https://www.txnd.uscourts.gov/judge/magistrate-judge-brian-mckay
  text: Judge McKay generally rules based on the written briefs, see Local Civil Rule 7.1(g), but may hold oral argument sua sponte or on a party's request. With respect to oral argument, Judge McKay strongly encourages litigants to be mindful of opportunities for junior lawyers to conduct hearings or oral argument, particularly where the junior lawyer drafted or contributed heavily to the motion at issue. When a party requesting oral argument requests a hearing and represents that the hearing will be primarily handled by a junior lawyer, Judge McKay will weigh that in favor of holding a hearing, although that does not guarantee that a hearing will be held.
