- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.txnd.uscourts.gov/judge/magistrate-judge-brian-mckay
  text: Parties must not unreasonably file pleadings, motions, or other papers under seal. Rather, the parties must attempt to file unsealed as much of a pleading, motion, or other paper as they reasonably can without undermining the protections conferred by any applicable protective order. Private or sensitive information, including social-security numbers, taxpayer-identification numbers, financial-account numbers, minors' names, and dates of birth, should be redacted from any document filed with the Court.
