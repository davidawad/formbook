- topic: Filing under seal
  field: under_seal_requirements
  url: https://www.txnd.uscourts.gov/judge/judge-matthew-kacsmaryk
  text: 'The Court "heavily disfavor[s] sealing information placed in the judicial record" and discourages such requests. A party or parties seeking to file a specific document under seal must: (1) move for leave to do so; (2) brief the legal authorities indicating the risks of disclosure outweigh the public''s right to know; and (3) explain that no other viable alternative to sealing exists. All facts recited in any such motion must be verified by the oath or declaration of a person or persons with personal knowledge. Parties should not seek to file under seal publicly available information. If any party wishes to submit "confidential" information to the Court, the submission must be filed only in a motion to file under seal.'
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.txnd.uscourts.gov/judge/judge-matthew-kacsmaryk
  text: 'All attorneys and pro se litigants appearing before the Court must, together with their notice of appearance, file on the docket a certificate attesting either that no portion of any filing will be drafted by generative artificial intelligence (such as ChatGPT, Harvey.AI, or Google Bard) or that any language drafted by generative artificial intelligence will be checked for accuracy, using print reporters or traditional legal databases, by a human being. These platforms are incredibly powerful and have many uses in the law: form divorces, discovery requests, suggested errors in documents, anticipated questions at oral argument. But legal briefing is not one of them. These platforms in their current states are prone to hallucinations and bias. [...] Another issue is reliability or bias. While attorneys swear an oath to set aside their personal prejudices, biases, and beliefs to faithfully uphold the law and represent their clients, generative artificial intelligence is the product of programming devised by humans who did not have to swear such an oath. As such, these systems hold no allegiance to any client, the rule of law, or the laws and Constitution of the United States (or, as addressed above, the truth). Unbound by any sense of duty, honor, or justice, such programs act according to computer code rather than conviction, based on programming rather than principle. Any party believing a platform has the requisite accuracy and reliability for legal briefing may move for leave and explain why. Accordingly, the Court will strike any filing from a party who fails to file a certificate on the docket attesting that they have read the Court''s judge-specific requirements and understand that they will be held responsible under Rule 11 for the contents of any filing that they sign and submit to the Court, regardless of whether generative artificial intelligence drafted any portion of that filing.'
