- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.txnd.uscourts.gov/judge/senior-district-judge-jane-boyle
  text: All requests for extensions of time and continuances must be submitted by written motion to the Court after a conference with opposing counsel. Please do not call the Court to ask for an extension or continuance unless it is a rare emergency and then only after conferring with opposing counsel. The parties must file requests for extensions of time as motions, rather than as stipulations.
