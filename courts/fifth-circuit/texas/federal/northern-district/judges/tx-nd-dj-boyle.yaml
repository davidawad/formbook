  text: 'Proposed orders are required to be submitted with EVERY non-dispositive motion. Proposed orders must be submitted via email in a WordPerfect or Word-compatible format as instructed in the CM/ECF system''s "Proposed Orders" Event. The proposed orders must be emailed to: boyle_orders@txnd.uscourts.gov and include the case number and the document number of the referenced motion in the subject line. Make sure to "cc" opposing counsel.'
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.txnd.uscourts.gov/judge/senior-district-judge-jane-boyle
  text: Judge Boyle requires a paper copy of any motion or brief that spans 25 or more pages (excluding title page, table of contents, table of authorities, and signature block) and any appendix that spans 50 or more pages.
- topic: Generative AI
  field: ai_disclosure_requirement
  url: https://www.txnd.uscourts.gov/judge/senior-district-judge-jane-boyle
  text: Effective 9/1/26 - No text generated by artificial intelligence may be used in any portion of any pleading, motion, brief, or other filing made by an attorney before Judge Boyle. All language in attorney-signed filings must be drafted by a human attorney and checked for accuracy by a human attorney. Using artificial intelligence to identify errors in documents is acceptable but must be disclosed under Local Rule 7.2(f), and any resulting edit must be made and verified by a human attorney. [...] Parties proceeding pro se are equally responsible for compliance with this requirement. Failure to comply may result in litigation sanctions and/or Rule 11 sanctions.
