checklist:
- topic: Oral argument
  field: oral_argument_default
  url: https://www.txnd.uscourts.gov/sites/default/files/documents/BrownJSR.pdf
  text: 'In most circumstances, Judge Brown makes a ruling based upon briefs; however, the parties may make a written request for oral argument or the Judge may sua sponte schedule a hearing. Should the Court permit a hearing on a motion: (i) for a non-evidentiary hearing, the Court permits a maximum of 45 minutes for each side (not each party); (ii) for an evidentiary hearing, the Court permits a maximum of 75 minutes for each side (not each party).'
- topic: Proposed orders
  field: proposed_orders
  url: https://www.txnd.uscourts.gov/sites/default/files/documents/BrownJSR.pdf
  text: 'Proposed orders are required to be submitted with EVERY non-dispositive motion. A proposed order must be submitted via e-mail in a Word compatible format as instructed in the CM/ECF system''s "Proposed Orders" event. The proposed orders must be e-mailed to: brown_orders@txnd.uscourts.gov and must include the case number and the document number of the referenced motion in the subject line. Copy opposing counsel on the email when submitting the proposed order.'
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.txnd.uscourts.gov/sites/default/files/documents/BrownJSR.pdf
  text: All requests for extensions of time and continuances must be submitted by written motion to the Court after a conference with opposing counsel. Please do not call the Court to ask for an extension or continuance. The parties must file requests for extensions of time as motions, rather than as stipulations.
