  text: Proposed orders are required to be submitted with EVERY motion. [...] The email must include the case number and the document number of the referenced motion in the subject line and opposing counsel must be copied.
  unverified_sentences: 1
- topic: Chambers copies
  field: chambers_copies_details
  url: https://www.txnd.uscourts.gov/judge/district-judge-ed-kinkeade
  text: These copies must be delivered to the Clerk's office within three (3) business days of the filing date. Copies must be printed on front side only, not front-back. Further, nothing may be printed in landscape format - - portrait format only. Failure to comply with this requirement may result in the party's document being unfiled by the Court. Furthermore, all hard copies must be properly bound either by sufficiently affixed staple, ACCO fastener, spiral binding, or, for a voluminous document, a 3-ring binder. Appendices and other documents fastened by paper clips, binder clips, rubber bands, or any other means are unacceptable. Exhibits must be tabbed, and the exhibits must be in portrait format, not landscape format.
- topic: Continuances
  field: continuances_calendar_conflicts
  url: https://www.txnd.uscourts.gov/judge/district-judge-ed-kinkeade
  text: In civil cases, Judge Kinkeade rarely grants continuances. Any request that a trial date be modified must be made in writing to Judge Kinkeade and the moving party along with that party's counsel must sign the motion for continuance, as required by Local Rule 40.1. Continuances will not be granted absent extraordinary circumstances.
- topic: Lead counsel
  field: lead_counsel_requirement
  url: https://www.txnd.uscourts.gov/judge/district-judge-ed-kinkeade
  text: In cases where local counsel is required by Judge Kinkeade, local counsel must sign all documents filed pursuant to Fed. R. Civ. P. 11, and also comply with Local Rule 83.10(b).
