  field: oral_argument_default
  url: https://www.txnd.uscourts.gov/judge/district-judge-ed-kinkeade
  text: Parties may file a written request for oral argument on any motion. Judge Kinkeade does not routinely conduct hearings on motions; however, he will address this on a case by case basis.
- topic: Proposed orders
  field: proposed_orders
