# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). The latex render breaks every line and
# page where the typst render does: gated (the slash inside "plaintiffs/appellees’" breaks alike since
# fb-595.54.82). The docx render is REPORTED: Word's contents list the identity of parties and counsel and its three
# subheadings at "iii" (the docx page lookup takes the next heading's needle, which starts with the identity's), and
# LibreOffice sets p17, above notes 9 to 11, a line fewer than typst (docs/open-items/fb-595.54.69.md,
# "shared-model requests").
params:
  cross_engine: gate
  cross_engine_docx: report
