# Supreme Court of Texas (tex): petition for review (TRAP 53.2). The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12).
# Numbers trace to TRAP 9.4, 9.5 and 53.2 (../rules.md, TEX-*; README.md "Governing rules"); lengths in points, each a
# whole number of twips. No case text here: every string printed comes from the sample's frontmatter ({field}) or is
# a court constant (the court's name, the certificate of compliance).
size: 14                  # TEX-FORM-001 (TRAP 9.4(e)): computer-generated text at least 14 point
pitch:
  body: 32.2              # TEX-FORM-001 (TRAP 9.4(d)): double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, tables, quotations, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # TEX-FORM-001 (TRAP 9.4(c)): one-inch margins, letter paper
indent: 36                # every paragraph indented half an inch, the first after a heading too (all three filers)
list_indent: 36           # a list's number or bullet in a half-inch box
# The cover counted as page i and unprinted, the identities and tables from ii in lower roman, the brief from 1.
page_number: {align: center, front: lower-roman, cover: counted}
footnote: {size: 12, pitch: 13.8, gap: 7, clearance: 9.1}   # TEX-FORM-001 (TRAP 9.4(d), (e)): notes 12 point, single spaced (1.15 x 12 pt)
quote: {left: 72, right: 72, above: 16.1, below: 16.1, gap: 16.1}   # TRAP 9.4(d): block quotations single spaced, an inch in
list: {markers: ["•"]}
# Headings at the text size, bold, single spaced on the text's double-spaced grid (12.9 pt above the line, 3.2 below);
# level 1 centered, level 2 flush left, level 3 italic too and half an inch in (TRAP 53.2: "under appropriate headings").
heading:
  - {align: center, bold: true, above: 12.9, below: 3.2}
  - {bold: true, above: 12.9, below: 3.2}
  - {bold: true, italic: true, left: 36, above: 12.9, below: 3.2}
# TEX-PFR-001 (TRAP 53.2, 2026 text and the former one): these level-1 sections present and in this order (others may
# sit between them). Not listed: the introduction (2026: before the identities; the former rule had none, and a
# petition filed before January 1, 2026 is governed by it, 25-9104 para. 4), the summary of the argument (filers join it
# to the introduction, "INTRODUCTION AND SUMMARY OF THE ARGUMENT") and the prayer ("CONCLUSION AND PRAYER"): the model
# matches a heading by its start.
checks:
  sections: ["IDENTIT", "STATEMENT OF THE CASE", "STATEMENT OF JURISDICTION", "ISSUE", "STATEMENT OF FACTS", "ARGUMENT"]
# TEX-LEN-001 (TRAP 9.4(i)(2)(D), 2026 text): 6,500 words, inclusive of the introduction (the former rule: 4,500;
# the model takes one limit, so a petition under the former rule is held to the current one). TEX-LEN-008 (TRAP
# 53.2(a)): the introduction at most 1,000 words, not checked (the model counts one span). TEX-LEN-007 (TRAP
# 9.4(i)(1)): not counted the identities, the
# statement regarding oral argument, the statement of the case, of jurisdiction, of procedural history, the issues
# presented (and the tables, signature, certificates and appendix, which are not in the counted body).
words:
  exclude: ["IDENTIT", "STATEMENT REGARDING ORAL", "STATEMENT OF THE CASE", "STATEMENT OF JURISDICTION", "STATEMENT OF PROCEDURAL", "ISSUE", "CERTIFICAT", "APPENDIX"]
  limit: 6500
# TRAP 9.4(g): the cover: case number, court, caption, the court below, the title between rules; lead counsel's name,
# address, telephone, email and State Bar number at the foot of the page, and the party it represents.
cover:
  - {text: "No. {case_number}", align: center}
  - {text: "IN THE SUPREME COURT OF TEXAS", align: center, bold: true, above: 32.4}
  - each: caption
    above: 25.2
    between:
      - {text: "v.", align: center, above: 14.4}
    blocks:
      - {text: "{.}", align: center, above: 14.4}
  - {text: "{on_review}", align: center, above: 25.2}
  - {rule: 0.75, above: 25.2}
  - {text: "{title}", align: center, bold: true, above: 14, below: 14}
  - {rule: 0.75}
  - {fill: 1}
  - {text: "{lead_counsel.name}"}
  - {text: "{lead_counsel.address}"}
  - {text: "{lead_counsel.phone}"}
  - {text: "{lead_counsel.email}"}
  - {text: "Texas Bar No. {lead_counsel.bar_number}"}
  - {text: "{filing_party}", above: 21.6}
  - when: oral_argument_requested
    blocks:
      - {text: "ORAL ARGUMENT REQUESTED", align: center, bold: true, above: 28.8}
# TRAP 53.2(a), (b): the introduction (2026 text) and the identities of parties and counsel come before the table of
# contents, on the roman-numbered pages
# (every level-1 section before the frontmatter's `body_start` heading).
body_before_tables: {until: "{body_start}"}
# TRAP 53.2(c): the table of contents, each heading (to the third level) with its page; TEX-PFR-003: bookmarked.
contents: {title: "TABLE OF CONTENTS", depth: 3, col: 36, step: 36, above: 8}
# TRAP 53.2(d): the index of authorities, alphabetical, each with the pages where it is cited.
authorities:
  title: "INDEX OF AUTHORITIES"
  col: 56
  hang: 36
  above: 8
  group: {bold: true, above: 16.1, below: 8}
# The prayer's last paragraph on the page of the signature (all three filers).
keep_with_closing: true
# TRAP 9.1: the brief signed by counsel, with the mailing address, telephone, email and State Bar number; set in the
# right half of the page (3.25 in), single spaced, as all three filers set it. TEX-CERT-001 (TRAP 9.4(i)(3)): the
# certificate of the word count, signed (/s/, TRAP 9.4(i)(3) "certified by counsel").
closing:
  - group:
      - {text: "Respectfully submitted,", left: 234}
      - when: signature.office
        blocks:
          - {text: "{signature.office}", left: 234, above: 16.1}
      - {text: "By: /s/ {signature.name}", left: 234, above: 16.1}
      - {text: "{signature.lines}", left: 234}
      - {text: "{signature.for}", left: 234, italic: true, above: 16.1, optional: true}
    above: 16.1
  - {text: "CERTIFICATE OF COMPLIANCE", heading: 1}
  - {text: "Pursuant to the Texas Rule of Appellate Procedure 9.4(i)(1), (3), I hereby certify that this Appellate Brief contains {xd.words} words. This is a computer-generated document using 14-point typeface for all text and 12-point footnotes.", pitch: body, indent: 36}
  - group:
      - {text: "/s/ {signature.name}", left: 234}
      - {text: "{signature.name}", left: 234}
    above: 16.1
# The certificate of service (TRAP 9.5(d), (e)) and the appendix from the sample, after the closing, double spaced, a
# double line below the certificate before it.
tail: {at: "CERTIFICATE OF SERVICE", pitch: body, indent: 36, above: 32.2}
