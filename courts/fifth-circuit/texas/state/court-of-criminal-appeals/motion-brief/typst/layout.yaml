# Court of Criminal Appeals of Texas (texcrimapp): motion with supporting argument (motion-brief; TRAP 10.1, 9.4). The
# whole layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this
# file by `fb engines gen`, fb-595.54.12). Numbers trace to TRAP 9.4 (../../rules.md, TEXCRIMAPP-*); lengths in
# points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # TEXCRIMAPP-FORM-004 (TRAP 9.4(e)): no smaller than 14-point
pitch:
  body: 32.2              # TEXCRIMAPP-FORM-003 (TRAP 9.4(d)): double-spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # cover, headings, quotations, counsel and signature blocks: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # TEXCRIMAPP-FORM-002 (TRAP 9.4(c)): at least one inch
indent: 36                # every body paragraph indented half an inch
page_number: {align: center, from: 2}   # the cover unnumbered; the contents and the motion numbered
footnote: {size: 12, pitch: 13.8, gap: 7, clearance: 14}   # TEXCRIMAPP-FORM-003, -004: footnotes 12-point, single
quote: {left: 36, right: 36, above: 8, below: 16.1}          # TEXCRIMAPP-FORM-003: block quotations single-spaced
heading:
  - {align: center, bold: true, upper: true, above: 21, below: 12.6}
  - {bold: true, above: 16.1, below: 8}
  - {bold: true, italic: true, above: 12, below: 8}
# The cover (TRAP 9.4(g), TEXCRIMAPP-CONT-001): the case number, the court, the caption beside the trial and writ
# cause numbers, the title and the filer between rules, lead counsel two to a row, the party represented.
cover:
  - {text: "{case_number}", align: center, bold: true, optional: true}
  - {text: "{court}", align: center, bold: true, above: 16.8}
  - columns:
      - blocks:
          - each: caption
            between:
              - {text: "v.", align: center, above: 16.8}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", align: right, above: 5.6}
      - width: 216
        valign: center
        blocks:
          - {text: "{docket}"}
    gutter: 28.8
    above: 21
  - {rule: 0.7, above: 21}
  - {text: "{title}", align: center, bold: true, upper: true, above: 12.6}
  - {text: "{filed_by}", align: center, optional: true, above: 8.4}
  - {rule: 0.7, above: 12.6}
  - columns: {each: counsel, per_row: 2, row_gap: 14, blocks: [{text: "{names}"}, {text: "{lines}"}]}
    gutter: 16.8
    above: 16.8
  - {text: "{attorneys_for}", align: center, bold: true, above: 16.8}
# The table of contents on its own page after the cover.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 36, step: 18, above: 8}
# The signature block, never split; then the certificate of service (TRAP 9.5(e): the manner of service and each
# person served) on a page of its own.
closing:
  - group:
      - {text: "{date}", optional: true}
      - {text: "Respectfully submitted,", above: 8}
      - {text: "/s/ {signature.signer}", left: 216, above: 16.1}
      - {text: "{signature.signer}", upper: true, left: 216}
      - {text: "{signature.lines}", left: 216}
    above: 32.2
  - when: service
    blocks:
      - {break: true}
      - {text: "Certificate of Service", align: center, bold: true, upper: true}
      - {text: "{service.statement}", pitch: body, indent: 36, above: 12.6}
      - columns: {each: service.served, per_row: 2, row_gap: 14, blocks: [{text: "{names}"}, {text: "{lines}"}]}
        gutter: 16.8
        above: 11.2
      - {text: "{service.note}", optional: true, pitch: body, indent: 36, above: 11.2}
      - group:
          - {text: "/s/ {signature.signer}", left: 216}
          - {text: "{signature.signer}", upper: true, left: 216}
        above: 22.4
