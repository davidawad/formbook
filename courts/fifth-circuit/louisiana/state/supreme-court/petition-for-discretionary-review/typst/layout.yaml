# Supreme Court of Louisiana (la): a writ application under Rule X (its memorandum in the Rule VII 2 form). The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Rules VII 2-5 and X 2(b), 3 (../../rules.md, LA-*); lengths in
# points. No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court
# constant (the court's name, the table titles).
paper: legal              # LA-FORM-001 (VII 2: letter or legal), LA-FORM-002 (X 2(b): legal): 8 1/2 x 14 in
size: 12                  # LA-FORM-006 (VII 2, X 2(b)): no less than 11 and no more than 12 point
pitch:
  body: 27.6              # LA-FORM-003: double spaced (Word's double, 2 x 1.15 x 12 pt)
  single: 13.8            # LA-FORM-003: headings, quotations, footnotes, captions, signature and cover single spaced
margin: {top: 108, bottom: 72, left: 72, right: 72}   # LA-FORM-005: top 1 1/2 to 2 in; LA-FORM-004: 3/4 to 1 1/4 in
indent: 36
# LA-FORM-007: consecutively numbered; the cover unnumbered, the index pages i, ii .., the brief from 1
page_number: {align: center, front: lower-roman}
footnote: {size: 12, pitch: 13.8, gap: 4}   # LA-FORM-006 (VII 2: 11 to 12 point, all text), LA-FORM-003: single spaced
quote: {left: 36, right: 36, above: 12, below: 12, gap: 6}   # LA-FORM-003: block quotations single spaced, indented
# Sections centered bold; points bold, as the body writes their letters and numbers
heading:
  - {align: center, bold: true, above: 14.4, below: 12}
  - {bold: true, above: 14.4, below: 9.6}
  - {bold: true, italic: true, above: 16.8, below: 10.8}
  - {bold: true, italic: true, above: 16.8, below: 10.8}
# LA-COV-001 (VII 3), in the rule's order: the court; the docket number; the title of the case; the court below, the
# parish, how the case came up and the judge; on whose behalf and what the brief is; counsel with address and
# telephone and the party represented.
cover:
  - {text: "SUPREME COURT OF LOUISIANA", align: center, bold: true}
  - {text: "No. {docket_number}", align: center, above: 14.4}
  - each: caption
    above: 19.2
    between:
      - {text: "V.", left: 36, above: 9.6, below: 9.6}
    blocks:
      - {text: "{names}", right: 248.4}
      - {text: "{designation}", left: 36, right: 248.4}
  - {text: "{court_origin}", align: center, above: 14.4}
  - {text: "{brief_title}", align: center, bold: true, above: 19.2}
  - columns: {each: counsel, per_row: 2, blocks: [{text: "{names}"}, {text: "{lines}"}]}
    gutter: 21.6
    above: 26.4
# LA-TOC-001, LA-BRF-003 and LA-TOA-001 (VII 4(1), 5): the table of contents and the index of authorities, the
# authorities grouped by kind with the pages of their `toa:` links
contents: {title: "INDEX", depth: 2, col: 36, step: 0, above: 8.4}   # the index single spaced, a space between entries (as the filed index)
authorities:
  title: "TABLE OF AUTHORITIES"
  col: 56
  hang: 28.8
  above: 7.2
  passim: 7
  group: {bold: true, above: 13.2, below: 6}
  kinds:
    - {kind: case, title: "CASES", italic: true}
    - {kind: statute, title: "STATUTES"}
    - {kind: rule, title: "RULES"}
    - {kind: other, title: "OTHER AUTHORITIES"}
# The signature of counsel, never split; LA-BRF-005 (VII 8(a)), LA-WRT-007 (X 2(c)): the certificate of service on a
# page of its own, its text, the persons served and counsel's signature.
closing:
  - group:
      - {text: "Respectfully submitted,", pitch: body}
      - columns: {each: signature, per_row: 2, blocks: [{text: "{lines}"}]}
        gutter: 21.6
        above: 7.2
  - when: certificate
    blocks:
      - {break: true}
      - {text: "{certificate.title}", align: center, bold: true, below: 14.4}
      - {markdown: "{certificate.text}", pitch: body, indent: 36}
      # the persons served, one after another (a list may run past a page)
      - when: certificate.recipients
        blocks:
          - each: certificate.recipients
            above: 14.4
            blocks: [{text: "{names}"}, {text: "{lines}", optional: true}]
      - {text: "{certificate.signature.lines}", left: 230.4, above: 16.8, optional: true}
