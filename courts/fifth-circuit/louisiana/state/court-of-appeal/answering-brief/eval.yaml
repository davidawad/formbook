# Uniform Rules of Louisiana Courts of Appeal, Rule 2-12.2(D)(2) (../rules.md, LACTAPP-FORM-002): 14-point or larger,
# all text and footnotes.
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12).
# Reported, not gated: the differences are the shared model's (docs/open-items/fb-595.54.58.md, request 3).
params:
  cross_engine: report
  # latex and docx: typst ends p26 line 2 after "R.S.", the others after "19:2.2(B)(4)-" (they break after a hyphen
  # before "(", typst does not). Every page starts and ends on the same word in all three engines.
