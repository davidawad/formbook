# Uniform Rules of Louisiana Courts of Appeal, Rule 2-12.2(D)(2) (../rules.md, LACTAPP-FORM-002): 14-point or larger,
# all text and footnotes.
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12).
# latex breaks every line and page where the typst render does; a docx difference that is the shared model's is
# reported, not gated (docs/open-items/fb-595.54.58.md, request 4a).
params:
  cross_engine: gate
  # docx: the page list of "§ 89-25(h)" ("11, 40, 44, 45, 47"), wider than the page column, sets its leader up to the
  # number in Word (p6 line 3); every page starts and ends on the same word as in typst.
  cross_engine_docx: report
