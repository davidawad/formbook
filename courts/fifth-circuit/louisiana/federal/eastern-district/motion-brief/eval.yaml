# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# merged layout (typst/layout.yaml over lib/layouts/frcp-motion-brief.yaml; `fb engines gen`, fb-595.17), so they
# break every line and page where the typst render does, and a difference fails.
params:
  cross_engine: gate
  # DEF-LEN-001: LR 7.7, a memorandum supporting or opposing a motion is at most 25 pages, excluding exhibits.
  page_limit: 25
  # DEF-COVER-002: LR 10.1 asks the caption to show the Section; the exemplar's filer printed none, and the template
  # prints a blank to fill in when the sample gives no section (the underscores read as a rule).
  cover_structure_accepted:
    - finding: 'rules: between "CIVIL ACTION NO.: 2:26-cv-00726-EEF-DPC" and "JUDGE ELDON E. FALLON"'
      reason: "LR 10.1: the caption shows the Section; the sample gives none, so the template prints the blank the filer completes"
