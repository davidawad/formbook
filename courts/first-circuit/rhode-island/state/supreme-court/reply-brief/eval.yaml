# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  # LaTeX passes XENG-001..003 since the shared model keeps a spaced ellipsis with the word before it (fb-595.54.82).
  cross_engine: gate
  # LibreOffice sets footnote 3 (page 10/11, "claims 3 Thus, to paraphrase this Court ...") on the next page and keeps
  # its anchor's line; typst and LaTeX move the line on with its note, and pages 11 to 18 shift (XENG-002, XENG-003;
  # 686 of 713 lines identical, page count equal). No docx setting moves the line (docs/open-items/fb-595.54.76.md,
  # request 6); reported, not gated.
  cross_engine_docx: report
