# D. Mass. Local Rules (combined, effective November 1, 2019; read 2026-10-14, see ../README.md "Governing rules"):
# L.R. 5.1(a)(2) letter paper, text double-spaced except counsel identification, the title of the case, footnotes and
# quotations; L.R. 5.1(a)(1) the BBO number under each attorney's signature; L.R. 7.1(b)(4) a memorandum of at most
# 20 pages. The rules set no face, size or margins: the FRCP base's 12-point type and one-inch margins stand.
# https://www.mad.uscourts.gov/general/pdf/LC/Combined%20Local%20Rules%2011-1-19.pdf
base: /lib/layouts/frcp-motion-brief.yaml
# L.R. 5.1(a)(2): quotations single-spaced, a single line off the text above and below.
quote: {left: 36, right: 36, above: 13.8, below: 13.8}
# the footnote area 12 pt below the text, where LibreOffice sets its separator line
footnote: {clearance: 12}
constants:
  # Fed. R. Civ. P. 10(a): the court's name in the caption.
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE DISTRICT OF MASSACHUSETTS"
# Fed. R. Civ. P. 10(a): the parties in a column, "v." between them, each designation set in; the civil action number
# beside them, centered on their height; the title centered in bold capitals (single-spaced, L.R. 5.1(a)(2)). No
# rules: the filed D. Mass. memoranda draw none (usage/SOURCE.md).
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - columns:
      - width: 252
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", above: 13.8, left: 90}
                between:
                  - {text: "v.", left: 36, above: 13.8, below: 13.8}
            stroke: 0
            inset: {right: 10, bottom: 10}
      - valign: center
        blocks:
          - {text: "{case_label|Civil Action No.} {case_number}", left: 7.2}
    gutter: 18
    above: 24
  - {text: "{title}", align: center, bold: true, upper: true, above: 24, below: 13.8}
# Headings in the double-spaced text, no space of their own, as in the filed memoranda: sections centered in bold
# capitals; argument headings (typed with their numerals in the markdown) bold at the margin, hanging half an inch.
heading:
  - {align: center, bold: true, upper: true, pitch: body, above: 0, below: 0}
  - {bold: true, hang: 36, pitch: body, above: 0, below: 0}
  - {bold: true, hang: 36, pitch: body, above: 0, below: 0}
# Fed. R. Civ. P. 11(a), L.R. 5.1(a)(1): the date at the margin, then the signature block three inches in, the BBO
# number after each attorney's name.
closing:
  - group:
      - {text: "DATED: {date}"}
      - each: signature.lead
        blocks: [{text: "{.}", left: 216}]
        above: 24
      - {text: "By: /s/ {signature.signer}", left: 216, above: 13.8}
      - each: signature.attorneys
        blocks:
          - {text: "{name} (BBO# {bbo})", left: 216, above: 13.8}
          - {text: "{email}", left: 216}
      - each: signature.firm
        blocks: [{text: "{.}", left: 216}]
        above: 13.8
    above: 24
# Certificate of service (Fed. R. Civ. P. 5(d)(1)(B): none needed for a paper served through CM/ECF; printed when the
# sample has one) and certificate of consultation (L.R. 7.1(a)(2); printed when the sample has one).
after_tail:
# Each certificate is kept on one page.
  - when: service
    blocks:
      - group:
          - {text: "CERTIFICATE OF SERVICE", heading: 1}
          - {text: "I hereby certify that on {service.date}, a true copy of the foregoing document was electronically filed through the Court’s ECF system on all counsel of record:", indent: 36, above: 13.8}
          - each: service.counsel
            blocks: [{text: "{.}"}]
            gap: 13.8
            above: 13.8
          - {text: "/s/ {signature.signer}", above: 24}
          - {text: "{signature.signer}"}
        above: 24
  - when: consultation
    blocks:
      - group:
          - {text: "CERTIFICATE OF CONSULTATION", heading: 1}
          - {markdown: "{consultation}"}
        above: 24
