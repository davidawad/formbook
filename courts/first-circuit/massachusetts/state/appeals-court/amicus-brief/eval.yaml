# Massachusetts Appeals Court, amicus brief (Mass. R.A.P. 17, 20(a)(4)(B)): a proportionally spaced font of 14 point
# or larger, footnotes included. Margins of 1 inch (the default) are the minimum under Rule 20(a)(4)(A).
font:
  size_pt: 14
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the docx engine is generated from the typst layout
# (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Reported, not gated, and not re-rendered on the current model:
# its URL rule has no break after "%", so the text-fragment URL of note 8 now runs into the right margin in typst too
# (DEF-FORM-002, p40); the committed renders predate that rule. The latex engine is BLOCKED by the same line. See
# docs/open-items/fb-595.54.68.md.
params:
  cross_engine: report
