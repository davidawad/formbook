# Massachusetts Appeals Court (massappct): amicus curiae brief (MRAP 17). The whole layout, as data for the shared
# document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to MRAP 16, 17 and 20 (../../rules.md, MASSAPPCT-*); lengths in points. No case text
# here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # MASSAPPCT-FORM-002 (MRAP 20(a)(4)(B)(ii)): 14 point or larger, footnotes included
pitch:
  body: 32.2              # MASSAPPCT-FORM-004 (MRAP 20(a)(4)(C)): double-spaced (Word's double, 2 x 1.15 x 14 pt:
                          # 2.2 lines an inch, 20 a page, within 3 and 27)
  single: 16.1            # cover, headings, footnotes, quotations, tables, signatures: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MASSAPPCT-FORM-003 (MRAP 20(a)(4)(A)): at least 1 inch
indent: 36
page_number: {align: center, from: 1}   # MASSAPPCT-FORM-005: the cover is page 1, pages run to the last
footnote: {size: 14, gap: 7, clearance: 14}   # MASSAPPCT-FORM-002, -004: footnotes 14 point, single-spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # MASSAPPCT-FORM-004: indented quotations single-spaced
heading:
  - {align: center, bold: true, upper: true, above: 22.4, below: 16.8}
  - {bold: true, hang: 36, above: 16.8, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The cover (MASSAPPCT-FORM-006, MRAP 20(a)(6)(B); MASSAPPCT-AMI-003, MRAP 17(c)): the court and the case number, the
# title of the case, the lower court, the date, the title of the brief, the party supported and the disposition urged,
# and counsel right of centre. Then the corporate disclosure statement on its own page (MRAP 16(a)(2), 17(c)(1)).
cover:
  - {text: "COMMONWEALTH OF MASSACHUSETTS", align: center, bold: true}
  - {text: "Appeals Court", align: center}
  - {text: "No. {case_number}", align: center, bold: true, above: 10.8}
  - each: caption
    above: 10.8
    between:
      - {text: "v.", align: center, above: 7.2, below: 7.2}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, italic: true, above: 5.6}
  - {text: "{lower_court}", align: center, above: 10.8}
  - {text: "{date}", align: center, above: 10.8}
  - {text: "{brief_title}", align: center, bold: true, upper: true, size: 15, pitch: 17.25, above: 28.8}
  - {text: "In support of {supports}, urging {position}", align: center, bold: true, upper: true, above: 14.4}
  - each: counsel
    above: 28.8
    blocks:
      - {text: "{names}", bold: true, left: 230.4, above: 5.6}
      - {text: "{lines}", left: 230.4}
  - when: disclosure
    blocks:
      - {break: true}
      - {text: "Corporate Disclosure Statement", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{disclosure.paragraphs}", pitch: body, indent: 36}
# MRAP 16(a)(3), (4) (MASSAPPCT-FORM-008): the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 36, step: 21.6, above: 12.6}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 21
  above: 12.6
  group: {bold: true, above: 16.8, below: 2.8}
# The signature block right of centre, never split (MRAP 16(a)(12)); then the certificate of compliance on a page of
# its own (MRAP 16(a)(14), 16(k)) and the certificate of service (MRAP 16(a)(15), 13(e)), each signed.
closing:
  - group:
      - {text: "{signature.intro}", left: 230.4, optional: true}
      - {text: "{signature.firm}", bold: true, left: 230.4, optional: true, above: 8.4}
      - each: signature.signers
        blocks:
          - {text: "{name}", underline: true, left: 230.4, above: 16.8}
          - {text: "{lines}", left: 230.4}
    above: 16.8
  - when: compliance
    blocks:
      - {break: true}
      - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{compliance.paragraphs}", pitch: body, indent: 36}
      - group:
          - each: compliance.signature.signers
            blocks:
              - {text: "{name}", underline: true, left: 230.4, above: 16.8}
              - {text: "{lines}", left: 230.4}
        above: 5.6
  - when: service
    blocks:
      - group:
          - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 16.8}
          - {text: "{service.paragraphs}", pitch: body, indent: 36}
          - each: service.signature.signers
            blocks:
              - {text: "{name}", underline: true, left: 230.4, above: 22.4}
              - {text: "{lines}", left: 230.4}
        above: 33.6
