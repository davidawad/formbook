# Massachusetts Supreme Judicial Court (mass): brief on the merits (the appellant's and appellee's principal briefs,
# Mass. R. A. P. 16 and 20). The whole layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and
# docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace to Mass. R. A. P. 16 and 20
# (../../rules.md, MASS-*); lengths in points. No case text here: every string printed comes from the sample's
# frontmatter ({field}) or is a court constant.
size: 14                  # MASS-FORM-002 (MRAP 20(a)(4)(B)): 14 point or larger, footnotes included
pitch:
  body: 32.2              # MASS-FORM-004 (20(a)(4)(C)): double spaced, at most 3 lines an inch (Word's double, 2 x 1.15 x 14)
  single: 16.1            # headings, footnotes, quotations, cover, signature: single (1.15 x 14 pt)
# MASS-FORM-003 (20(a)(4)(A)): margins at least 1 inch; top and bottom 1 inch + 4 pt keep a raised note mark inside
margin: {top: 76, bottom: 76, left: 72, right: 72}
indent: 36                # style: half-inch first-line indent
page_number: {align: center}   # MASS-FORM-005 (20(a)(4)(A), 20(a)(6)(B)(vii)): the cover is page 1, numbered through
footnote: {size: 14, pitch: 16.1, gap: 7}   # MASS-FORM-002, -004: notes 14 point, single spaced
quote: {left: 36, right: 36, above: 11.2, below: 16.8}   # MASS-FORM-004: indented quotations single spaced
# Parts centered and bold (the sample writes them in capitals); argument points and fact headings bold, hanging half
# an inch (lettered and numbered in the text); level 4 bold italic.
heading:
  - {align: center, bold: true, above: 16.8, below: 16.8}
  - {bold: true, hang: 36, above: 14, below: 14}
  - {bold: true, hang: 36, above: 14, below: 14}
  - {bold: true, italic: true, hang: 36, above: 14, below: 14}
# MASS-FORM-006 (20(a)(6)(B)): the court, the case number, the title of the case with each party's designation, the
# proceeding below, the title of the brief, counsel; then the corporate disclosure statement (MRAP 16(a)(2); S.J.C.
# Rule 1:21) on its own page before the tables (MASS-OPEN-001, 16(a)).
cover:
  - {text: "COMMONWEALTH OF MASSACHUSETTS", align: center, bold: true}
  - {text: "Supreme Judicial Court", align: center}
  - {text: "No. {case_number}", align: center, above: 7}
  - each: caption
    above: 7
    between:
      - {text: "v.", align: center, above: 4.2, below: 4.2}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center}
  - {text: "{proceeding}", align: center, above: 7}
  - columns:
      - {blocks: []}
      - {width: 158.4, blocks: [{rule: 0.6}]}
      - {blocks: []}
    above: 8.4
  - {text: "{brief_title}", align: center, bold: true, above: 5.6}
  - columns:
      - {blocks: []}
      - {width: 158.4, blocks: [{rule: 0.6}]}
      - {blocks: []}
    above: 5.6
  - columns:
      each: counsel
      per_row: 2
      row_gap: 5.6
      blocks:
        - {text: "{names}"}
        - {text: "{lines}"}
    gutter: 21.6
    above: 11.2
  - when: disclosure
    blocks:
      - {break: true}
      - {text: "Corporate Disclosure Statement", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{disclosure.paragraphs}", pitch: body, indent: 36}
# MASS-FORM-008 (16(a)(3), (4)): the table of contents and the table of authorities.
contents: {title: "TABLE OF CONTENTS", depth: 4, col: 36, hang: 36, step: 21, above: 7}
authorities:
  title: "TABLE OF AUTHORITIES"
  col: 56
  hang: 21
  above: 8.4
  group: {bold: true, above: 16.8, below: 11.2}
# MASS-FORM-012 (16(a)(12)): the signature block after the conclusion, the signers two to a row, never split;
# MASS-FORM-010 (16(k)): the certificate of compliance; MASS-FORM-011 (13(e)): the certificate of service, each dated
# and signed.
closing:
  - group:
      - {text: "{signature.intro|Respectfully,}"}
      - columns:
          each: signature.signers
          per_row: 2
          row_gap: 21
          blocks:
            - {text: "/s/ {sign}", optional: true}
            - {text: "{print}"}
            - {text: "{lines}", optional: true}
        gutter: 21.6
        above: 16.8
      - {text: "{date}", above: 14}
    above: 8.4
  - when: compliance
    blocks:
      - {break: true}
      - {text: "Certificate of Compliance", align: center, bold: true, upper: true, below: 16.8}
      - {text: "{compliance.paragraphs}", pitch: body, indent: 36}
      - columns:
          - {blocks: [{text: "Dated: {compliance.date}"}]}
          - width: 216
            blocks:
              - {text: "/s/ {compliance.signature.sign}", optional: true}
              - {text: "{compliance.signature.print}"}
        gutter: 21.6
        above: 16.8
  - when: service
    blocks:
      - group:
          - {text: "Certificate of Service", align: center, bold: true, upper: true, below: 16.8}
          - {text: "{service.paragraphs}", pitch: body, indent: 36}
          - columns:
              - {blocks: [{text: "Dated: {service.date}"}]}
              - width: 216
                blocks:
                  - {text: "/s/ {service.signature.sign}", optional: true}
                  - {text: "{service.signature.print}"}
            gutter: 21.6
            above: 16.8
        above: 21
