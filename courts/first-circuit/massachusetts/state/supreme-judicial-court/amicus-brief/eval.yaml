# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # LibreOffice sets "https://www.theatlantic.com/technology/archive/" on one line of note 6 (INPUT-amicus-brief,
  # page 24), ending it at x = 540.024 on a 540 pt measure; typst breaks after "technology/" (XENG-003, 556/558
  # lines; pages and page ends equal). A tolerance of the shared model, not of this folder: reported, not gated
  # (docs/open-items/fb-595.54.25.md).
  cross_engine_docx: report
