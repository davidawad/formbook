# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
# Rule 40(b): legal paper, 8 1/2 x 14 in (612 x 1008 pt), not the letter default.
# Rule 33(f): an appellee's alegato is at most 50 pages, excluding the indice and appendix; the default
# check counts every page, so 50 is the stricter bound.
params:
  page_width_pt: 612
  page_height_pt: 1008
  page_limit: 50
  cross_engine: gate
