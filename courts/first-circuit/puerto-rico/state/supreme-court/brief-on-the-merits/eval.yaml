# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
# Rule 40(b): legal paper, 8 1/2 x 14 in (612 x 1008 pt), not the letter default.
# Rule 33(f): an appellee's alegato is at most 50 pages, excluding the indice and appendix; the default
# check counts every page, so 50 is the stricter bound.
params:
  page_width_pt: 612
  page_height_pt: 1008
  page_limit: 50
  cross_engine: gate
  # Body pages 14 and 18 ("16 de marzo de", "votos de todos los"): a line typst fills to within a fraction of a point
  # breaks a word later in LaTeX and Word (the line-fit tolerance, not in the model: docs/open-items/fb-595.54.82.md,
  # "Not implemented"); 901 of 905 lines identical, pages and page ends equal. Reported, not gated (fb-595.54.73).
  cross_engine_latex: report
  # Word, as LaTeX above, and body page 21: Word sets the "VI. Súplica" heading and its first lines at the foot of
  # the page, typst on the next (the contents list it on 21 against typst's 22). Reported, not gated (fb-595.54.73).
  cross_engine_docx: report
