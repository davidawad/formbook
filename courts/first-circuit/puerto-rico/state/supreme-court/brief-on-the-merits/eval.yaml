# Rule 40(b): legal paper, 8 1/2 x 14 in (612 x 1008 pt), not the letter default.
# Rule 33(f): an appellee's alegato is at most 50 pages, excluding the indice and appendix; the default
# check counts every page, so 50 is the stricter bound.
params:
  page_width_pt: 612
  page_height_pt: 1008
  page_limit: 50
