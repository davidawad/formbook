# Rule 40(b): legal paper, 8 1/2 x 14 in (612 x 1008 pt), not the letter default.
# No page_limit: TSPR R 43(e) allows 20 pages excluding the indice and appendix, which the default
# check (counting every page) cannot exclude. The limit is a Gate 2 review item (rules.md).
# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  page_width_pt: 612
  page_height_pt: 1008
  cross_engine: gate
  # Body page 6 ends with two long notes (5 and 6): LibreOffice fits the paragraph's last line ("neurodivergentes.")
  # above them, typst moves it to page 7, and pages 7 to 9 end a line apart (Word's footnote area, not in the model:
  # docs/open-items/fb-595.54.82.md, "Not implemented"); 541 of 544 lines identical. Reported, not gated
  # (fb-595.54.73).
  cross_engine_docx: report
