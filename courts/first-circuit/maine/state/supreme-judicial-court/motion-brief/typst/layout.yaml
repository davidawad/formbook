# Maine Supreme Judicial Court sitting as the Law Court: a motion with an incorporated memorandum of law (MRAP 10(a),
# 1D(d)). The whole layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated
# from this file by `fb engines gen`, fb-595.54.12). Numbers trace to ../rules.md; lengths in points. No case text
# here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # ME-FORM-001: printed matter at least 14-point
pitch:
  body: 32.2              # ME-FORM-005: double spaced (Word's double, 2 x 1.15 x 14 pt)
  single: 16.1            # caption, headings, quotations, footnotes, signature blocks: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # ME-FORM-003, -004: one inch
indent: 36                # paragraphs indented half an inch
page_number: {align: center, from: 1}   # ME-FORM-007: Arabic numerals from page 1
footnote: {size: 11, pitch: 12.65, gap: 7}   # ME-FORM-001, -005: footnotes may be 11-point, single (1.15 x 11 pt)
quote: {left: 36, right: 36, above: 14, below: 14}   # ME-FORM-005: block quotations single spaced, indented
heading:
  - {align: center, bold: true, above: 16.8, below: 14}
  - {bold: true, above: 16.8, below: 11.2}
  - {bold: true, italic: true, above: 15.4, below: 8.4}
# ME-MOT-001, -005: the caption (the venue and the parties at the left; the court, the docket number and the
# emergency label at the right), then the descriptive title; the motion starts on the same page.
front:
  - columns:
      - width: 244.8
        blocks:
          - {text: "{venue}"}
          - each: caption
            above: 19.6
            between:
              - {text: "v.", left: 43.2, above: 8.4, below: 8.4}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 86.4, above: 8.4}
      - blocks:
          - {text: "SUPREME JUDICIAL COURT"}
          - {text: "Sitting as the Law Court"}
          - {text: "Docket No. {docket}", above: 8.4}
          - {text: "{label}", optional: true, above: 33.6}
    gutter: 14.4
  - {text: "{brief_title}", align: center, bold: true, above: 25.2, below: 19.6}
# MRAP 1C(b), ME-CERT-001: the date at the left, "Respectfully submitted," at the right, the signature block below
# it, never split.
closing:
  - group:
      - columns:
          - blocks:
              - {text: "Dated: {date}"}
          - width: 244.8
            blocks:
              - {text: "Respectfully submitted,"}
      - {text: "{signature.lines}", left: 223.2, above: 22.4}
    above: 32.2
# ME-FORM-009, ME-CERT-004: the certificate of service, when there is one, on a page of its own.
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true, below: 16.8}
      - {text: "I certify that I have on this day served a true and correct copy of the foregoing upon the following counsel of record by {service.method}:", pitch: body, indent: 36}
      - columns: {each: service.recipients, blocks: [{text: "{names}"}, {text: "{lines}"}]}
        gutter: 21.6
        above: 16.8
      - {text: "Dated: {date}", pitch: body, above: 19.6}
      - {text: "{signature.lines}", left: 223.2}
