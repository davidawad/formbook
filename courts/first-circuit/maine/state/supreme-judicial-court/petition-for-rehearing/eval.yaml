# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # The token after "¶" is bound in LaTeX in an \mbox together with the footnote that follows it ("¶ 66.[^7]"), and
  # TeX drops an insert inside a nested box: note 7 is not set (page 15; the page ends of pages 16-17 shift); the
  # asterism "* * *" reads as one word in LaTeX's PDF text (docs/open-items/fb-595.54.50.md, requests 19, 20).
  # Reported, not gated.
  cross_engine_latex: report
