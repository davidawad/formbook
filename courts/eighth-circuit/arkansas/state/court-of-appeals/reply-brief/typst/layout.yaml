# Arkansas Court of Appeals (arkctapp): reply brief. The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace
# to Ark. Sup. Ct. R. 4-1 and 4-2 (../rules.md, ARCTAPP-*); lengths in points. No case text here: every string
# printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 14                  # ARCTAPP-FORM-002: not less than 14 points
pitch:
  body: 32.2              # ARCTAPP-FORM-003: double spaced (Word's double, 2 x 1.15 x 14 pt), footnotes too
  single: 16.1            # cover, headings, tables, quotations, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # ARCTAPP-FORM-004: not less than one inch
indent: 36
page_number: {align: center, from: 1}   # ARCTAPP-FORM-005: consecutive numbers, the cover is page one
footnote: {size: 14, pitch: body, gap: 7}   # ARCTAPP-FORM-002, -003: 14 points, footnote lines double spaced
quote: {left: 36, right: 36, above: 8.4, below: 14}   # ARCTAPP-FORM-003: quoted material single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 16.8, below: 14}
  - {bold: true, hang: 36, above: 14, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# The cover (Rule 4-2(a)(1)): two inches clear at the top for the file-mark (ARCTAPP-FORM-004), the case number, the
# court, the parties, the court appealed from and the judge between rules, the title and counsel.
cover:
  - {text: "NO. {case_number}", align: center, bold: true, above: 72}
  - {text: "{court_line}", align: center, bold: true, above: 7.2}
  - each: caption
    above: 8.6
    between:
      - {text: "v.", align: center, above: 2.8}
    blocks:
      - {text: "{names}"}
      - {text: "{designation}", align: right, bold: true}
  - {rule: 0.5, above: 8.4}
  - {text: "{proceeding}", align: center, above: 2.8}
  - {text: "{judge}", align: center, optional: true}
  - {rule: 0.5, above: 2.8}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 8.6}
  - {text: "Submitted by:", above: 8.6}
  - each: counsel
    blocks:
      - {text: "{names}", above: 11.2}
      - {text: "{lines}"}
# Rule 4-2(c): a reply brief has the cover, a table of contents (the major sections, Rule 4-2(a)(2)) and a table of
# authorities, each on its own page, then the argument.
contents: {title: "Table of Contents", depth: 1, col: 36, hang: 36, above: 9.8}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 9.8
  group: {bold: true, above: 15.4, below: 2.8}
# The date (when given) and the signature block, never split.
closing:
  - group:
      - {text: "{date}", optional: true}
      - when: closing
        blocks:
          - {text: "{closing}", left: 230.4, above: 8.4}
      - {text: "{signature.firm}", left: 230.4, above: 8.4}
      - {text: "/s/ {signature.signer}", underline: true, left: 230.4, above: 8.4}
      - {text: "{signature.lines}", left: 230.4}
    above: 28.8
# The certificates open a page after the signature, in the body's form.
tail: {at: "Certificate", break: true, pitch: body, indent: 36}
