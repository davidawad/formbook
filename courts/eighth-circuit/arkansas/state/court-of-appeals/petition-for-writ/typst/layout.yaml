# Arkansas Court of Appeals (arkctapp): petition for writ (petition-for-writ). The whole layout, as
# data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Ark. Sup. Ct. R. 1-3, 2-1 and 4-1 (../../rules.md, ARCTAPP-*);
# lengths in points. No case text here: every string printed comes from the sample's frontmatter ({field}).
size: 14                  # ARCTAPP-FORM-002: not less than 14 points
pitch:
  body: 32.2              # ARCTAPP-FORM-003: double spaced (Word's double, 2 x 1.15 x 14 pt), footnotes too
  single: 16.1            # caption, headings, quotations, signature: single (1.15 x 14 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # ARCTAPP-FORM-004: not less than one inch
indent: 36
page_number: {align: center, from: 1}   # ARCTAPP-FORM-005: consecutive numbers, the first page is page one
footnote: {size: 14, pitch: body, gap: 7}   # ARCTAPP-FORM-002, -003: 14 points, footnote lines double spaced
quote: {left: 36, right: 36, above: 8.4, below: 14, gap: 11.2}   # ARCTAPP-FORM-003: quotations single spaced, indented
# The petition's headings centered in capitals; its parts centered; their points bold italic (ARCTAPP-FORM-009).
heading:
  - {align: center, bold: true, upper: true, above: 16.8, below: 14}
  - {align: center, bold: true, above: 14, below: 11.2}
  - {bold: true, italic: true, hang: 36, above: 14, below: 11.2}
# ARCTAPP-CONT-011 (Rule 2-1(a), (e)): no separate cover; the court, the parties, the case number, the court appealed
# from and the title naming the relief open the first page.
front:
  - {text: "{court_line}", align: center, bold: true, upper: true}
  - each: caption
    above: 10.8
    between:
      - {text: "v.", align: center, above: 1.4}
    blocks:
      - {text: "{names}"}
      - {text: "{designation}", align: right, bold: true}
  - {text: "CASE NO. {case_number}", align: center, bold: true, optional: true, above: 1.4}
  - {text: "{proceeding}", align: center, bold: true, optional: true, above: 7.2}
  - {text: "{title}", align: center, bold: true, upper: true, above: 10.8, below: 10.8}
# ARCTAPP-CERT-003 (Rule 2-1(a)): the closing and each block of the signature (firm, signer, counsel), right of center,
# never split.
closing:
  - group:
      - when: closing
        blocks:
          - {text: "{closing}", left: 230.4}
      - each: signature
        blocks:
          - {text: "{.}", left: 230.4, above: 12.6}
    above: 28.8
# The certificate of service opens a page after the signature, in the body's form.
tail: {at: "Certificate", break: true, pitch: body, indent: 36}
