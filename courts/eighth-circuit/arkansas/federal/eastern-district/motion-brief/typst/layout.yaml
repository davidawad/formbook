# U.S. District Court for the Eastern District of Arkansas (ared): a brief in support of a motion (to dismiss), on the
# generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with E.D. Ark.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by
# `fb engines gen`). Rules: Local Rules of the U.S. District Courts for the Eastern and Western Districts of Arkansas,
# https://www.are.uscourts.gov/court-info/local-rules-and-orders/local-rules (read 2026-10-14; ../README.md quotes
# them). The base already meets LR 5.5(a): letter size, double space (24 pt at 12 pt), type not less than elite (12 pt),
# one side; LR 5.5 sets no margin, so the base's one inch stands. LR 7.2 sets no page limit.
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, as the court's own captions set it.
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE EASTERN DISTRICT OF ARKANSAS"
# Block quotations single spaced, an inch in on each side, a single line around them (the exemplar, usage/SOURCE.md).
quote: {left: 72, right: 72, above: 12, below: 12}
# The exemplar's chart: single spaced at 11 pt, a single line around it.
table: {size: 11, pitch: 12.65, pad: 1.8, above: 12, below: 12}
# A section centered in bold capitals on the body pitch (a filer types its number, as the exemplar numbers some
# sections and not the introduction or conclusion); an argument "A." bold at the margin and a point "1." bold italic,
# each label in a half-inch box with the title's later lines hung under it, single spaced with a single line above and
# below, as the exemplar sets them.
heading:
  - {align: center, bold: true, upper: true, pitch: body}
  - {bold: true, number: "A.", label_box: 36, above: 12, below: 12}
  - {bold: true, italic: true, number: "1.", label_box: 36, above: 12, below: 12}
# FRCP 10(a): the court's name and the division; the parties at the left, each party's names, its designation half an
# inch in, "v." a line from each; a column of colons as high as the parties (the exemplar's caption, no rules); the
# case number beside them, centered on their height; the paper's title centered in bold, a blank double line above
# and below it (FRCP 7(b)(2)).
front:
  - {text: "{xd.court}", align: center, bold: true, pitch: body}
  - {text: "{xd.district}", align: center, bold: true, pitch: body}
  - {text: "{division}", align: center, bold: true, upper: true, pitch: body, optional: true}
  - columns:
      - width: 216
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 36, above: 13.8}
            between:
              - {text: "v.", above: 13.8, below: 13.8}
      - {width: 14.4, repeat: ":"}
      - valign: center
        blocks:
          - {text: "{case_label|Case No.} {case_number}"}
    above: 24
  - {text: "{brief_title}", align: center, bold: true, pitch: body, above: 24, below: 24}
# LR 5.5(c)(1), FRCP 11(a): signed by an attorney of record with the address, telephone number and Arkansas bar number:
# the date at the left when the filer gives one; at the right "Respectfully submitted,", the firm, the "/s/" signer
# and the signer's lines; kept whole with the body's last paragraph, a blank double line above it.
closing:
  - group:
      - columns:
          - width: 187.2
            blocks:
              - {text: "Dated: {signature.date}", optional: true}
          - blocks:
              - {text: "Respectfully submitted,"}
              - {text: "{signature.firm}", above: 12}
              - {text: "/s/ {signature.signer}", above: 12}
              - {text: "{signature.lines}"}
    above: 24
