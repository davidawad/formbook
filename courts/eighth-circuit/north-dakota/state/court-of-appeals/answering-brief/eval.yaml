# N.D.R.App.P. 32(a)(8)(A) (effective 4/1/2024): "A principal brief may not exceed 38 pages,
# ... excluding any addendum." Pages are counted including the cover (32(a)(4)).
params:
  page_limit: 38
  # Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md): latex and docx are generated from typst/layout.yaml (`fb engines gen`,
  # fb-595.54.12) and break every line and page where typst does, so a difference fails. (docx was held back while
  # the page lookup could not place two authorities marking the same word, "39-08-01" inside "39-08-01.2":
  # fb-595.54.82 finds such a needle at the same place.)
  cross_engine: gate
