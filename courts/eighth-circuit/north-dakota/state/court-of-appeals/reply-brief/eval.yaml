# N.D.R.App.P. 32(a)(8)(A) (effective 4/1/2024): "a reply brief may not exceed 12 pages,
# excluding any addendum." Pages are counted including the cover (32(a)(4)).
params:
  page_limit: 12
  # Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md): the latex and docx engines are generated from typst/layout.yaml
  # (`fb engines gen`, fb-595.54.12) and break every line and page where typst does, so a difference fails.
  cross_engine: gate
