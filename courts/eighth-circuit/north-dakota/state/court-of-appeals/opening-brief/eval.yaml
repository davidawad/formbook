# N.D.R.App.P. 32(a)(8)(A) (effective 4/1/2024): "A principal brief may not exceed 38 pages,
# ... excluding any addendum." Pages are counted including the cover (32(a)(4)).
params:
  page_limit: 38
  # Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md): latex is generated from typst/layout.yaml (`fb engines gen`, fb-595.54.12)
  # and breaks every line and page where typst does, so a difference fails. docx held back (report): two authorities
  # mark the same word ("39-08-01" inside "39-08-01.2"), two identical page needles the docx page lookup cannot both
  # place (docs/open-items/fb-595.54.77.md).
  cross_engine_latex: gate
  cross_engine_docx: report
