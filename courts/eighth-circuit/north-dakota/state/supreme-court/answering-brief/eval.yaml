# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
# N.D.R.App.P. 32(a)(8)(A) (effective 4/1/2024): "A principal brief may not exceed 38 pages, ... excluding any addendum."
params:
  cross_engine: gate
  # Word binds "§ § 49-03-01," (a section sign repeated after a space) whole, typst and LaTeX break between the two
  # signs: INPUT-answering-brief page 15 line 20, and page 16 starts a line later (XENG-002, XENG-003). A shared-model
  # rule (docs/open-items/fb-595.54.52.md); reported, not gated (fb-595.54.52).
  cross_engine_docx: report
  page_limit: 38
