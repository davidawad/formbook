# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # Word gets a zero-width space after a slash inside a word before a letter (lib/docx/xdoc.lua `breaks`, for
  # "CM/ECF"); the e-signature "s/Charles N. Nauen" (as filed) is such a word, and LibreOffice's PDF text then reads
  # "s/" and "Charles" as two words: INPUT-motion-brief, page 7 line 10 (XENG-003 182/183; pages, page ends and every
  # line break equal). Typst and LaTeX keep one word. Reported, not gated, until the shared model treats a word-initial
  # "s/" as it treats "/s/" (docs/open-items/fb-595.54.43.md).
  cross_engine_docx: report
