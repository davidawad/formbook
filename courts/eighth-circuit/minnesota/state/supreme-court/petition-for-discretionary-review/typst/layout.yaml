# Minnesota Supreme Court (minn): petition for accelerated review (petition-for-discretionary-review). The whole
# layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by
# `fb engines gen`, fb-595.54.12). Numbers trace to Minn. R. Civ. App. P. 118 (accelerated review), 132.02
# (documents other than formal briefs) and 132.04 (signature); see ../../rules.md. Lengths in points. No case text
# here: every string printed comes from the sample's frontmatter ({field}).
size: 13                  # MINN-FORM-002: at least 13-point, headings and footnotes included
pitch:
  body: 29.9              # MINN-FORM-003: typed material double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # caption, headings, quotations, footnotes, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MINN-FORM-001: matter within 6-1/2 x 9-1/2 in
indent: 36                # every paragraph indented half an inch
page_number: {align: center, from: 1}   # MINN-FORM-005: numbered at the center of the bottom margin, from page 1
footnote: {size: 13, gap: 7}             # MINN-FORM-002, -003: footnotes 13-point, single spaced
quote: {left: 36, right: 36, above: 7.8, below: 13}   # quotations single spaced, indented half an inch each side
heading:
  - {align: center, bold: true, above: 13, below: 10.4}      # MINN-PET-004 parts (issues, case, argument), as filed
  - {left: 18, hang: 36, bold: true, above: 13, below: 10.4} # points typed with their own numerals, as filed
  - {left: 36, hang: 36, bold: true, above: 13, below: 10.4}
# MINN-MOT-003, MINN-PET-006 (Rule 132.02 subd. 2): the court, the title of the case, the file number and a
# descriptive title, between two rules, the text following on the same page (MINN-FORM-007: as filed).
front:
  - {text: "{court_lines}", align: center, bold: true}
  - {rule: 0.75, above: 7.2}
  - columns:
      - width: 248
        blocks:
          - each: caption
            blocks:
              - {text: "{joiner}", optional: true, align: center, below: 7.8}
              - {text: "{names}"}
              - {text: "{designation}", left: 72, above: 7.8, below: 7.8}
      - blocks:
          - {text: "{file_number}", optional: true, align: right, below: 21.6}
          - {text: "{title}", align: center, bold: true, upper: true}
          - {text: "{right_lines}", align: center, optional: true, above: 21.6}
    gutter: 14.4
    above: 7.2
  - {rule: 0.75, above: 7.2, below: 14.4}
# MINN-FORM-006 (Rule 132.04): signed, with the signer's name, license number, address, telephone and email; the
# closing and the date at the left, the signature block 3 in from the margin, never split.
closing:
  - group:
      - {text: "{closing}", optional: true}
      - {text: "{date}", optional: true, above: 2.6}
      - {text: "{signature.firm}", left: 216, above: 5.2}
      - {text: "/s/ {signature.signer}", left: 216, underline: true, above: 7.8}
      - {text: "{signature.lines}", left: 216}
    above: 21.6
# MINN-PET-004 (Rule 118 subd. 2): the certificate of document length on a page of its own after the signature, in
# the body's form (as filed).
tail: {at: "CERTIFICATE", break: true, pitch: body, indent: 36}
