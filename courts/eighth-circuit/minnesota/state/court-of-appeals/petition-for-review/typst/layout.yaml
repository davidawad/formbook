# Minnesota Court of Appeals (minnctapp): petition for declaratory judgment on an agency rule (petition-for-review).
# The whole layout, as data for the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from
# this file by `fb engines gen`, fb-595.54.12). Numbers trace to Minn. R. Civ. App. P. 114.01-114.02, 132.02
# (documents other than formal briefs) and 132.04 (signature); see ../../rules.md. Lengths in points. No case text
# here: every string printed comes from the sample's frontmatter ({field}).
size: 13                  # MINNCTAPP-FORM-002/-004: at least 13-point, headings and footnotes included
pitch:
  body: 29.9              # MINNCTAPP-FORM-004: double spaced (Word's double, 2 x 1.15 x 13 pt)
  single: 14.95           # caption, headings, quotations, footnotes, signature: single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MINNCTAPP-FORM-001: matter within 6-1/2 x 9-1/2 in
indent: 36                # every paragraph indented half an inch
page_number: {align: center, from: 1}   # MINNCTAPP-FORM-004: pages numbered at the center of the bottom margin
footnote: {size: 13, gap: 7}             # MINNCTAPP-FORM-002: footnotes 13-point too, single spaced
quote: {left: 36, right: 36, above: 7.8, below: 13}
heading:
  - {align: center, bold: true, above: 13, below: 13}
  - {bold: true, above: 13, below: 10.4}
# MINNCTAPP-CONT-009 (Rule 132.02 subd. 2): the court, the title of the case, the docket number and a descriptive
# title, between two rules; the parties at the left, the title and the number fields at the right.
front:
  - {text: "{court_line}", align: center, bold: true, pitch: body}
  - {rule: 0.5, above: 3.9}
  - columns:
      - width: 233.8
        blocks:
          - each: caption
            between:
              - {text: "v.", left: 36, above: 6.5, below: 6.5}
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", align: right, above: 6.5}
      - blocks:
          - {text: "{title}", align: center, bold: true, upper: true}
          - each: fields
            blocks:
              - {text: "{.}", bold: true, above: 15.6}
    gutter: 21.6
    above: 6.5
  - {rule: 0.5, above: 6.5, below: 6.5}
# MINNCTAPP-FORM-006 (Rule 132.04): signed, with the signer's name, license number, address and telephone; the
# closing, the date and the party signed for at the left, the signature block 3 in from the margin, never split.
closing:
  - group:
      - {text: "{closing}", optional: true}
      - {text: "{date}", optional: true}
      - {text: "{signed_for}", optional: true, above: 5.2}
      - {text: "{signature.firm}", left: 216, above: 7.8}
      - {text: "/s/ {signature.signer}", underline: true, left: 216, above: 10.4}
      - {text: "{signature.lines}", left: 216}
    above: 21.6
