# U.S. District Court for the District of Minnesota (mnd): a memorandum of law in support of a motion, on the generic
# FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with D. Minn.'s local rules overlaid here. The shared
# document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`).
# Rules: D. Minn. Local Rules (complete set, PDF dated June 10, 2026, text checked 2026-10-14; ../README.md quotes
# them). The base already meets LR 7.1(h)(1) on the page (8 1/2 by 11 inches, no text outside 6 1/2 by 9 inches: the
# one-inch margins) and LR 5.2(a) (pages numbered at the bottom).
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name.
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "DISTRICT OF MINNESOTA"
# LR 7.1(h)(1): type of at least 13 points, footnotes included; double spaced (29.9 pt), headings, footnotes and
# quotations single spaced (14.95 pt, 1.15 x the type size).
size: 13
pitch: {body: 29.9, single: 14.95}
footnote: {size: 13, gap: 7, clearance: 13}
# LR 7.1(h)(1): a quotation of more than two lines indented and single spaced: half an inch in on each side, a single
# line around it and between its paragraphs.
quote: {left: 36, right: 36, above: 14.95, below: 14.95, gap: 14.95}
# LR 7.1(h)(1): headings single spaced, a single line above and below, in bold: a section centered, an argument heading
# at the margin and a point half an inch in, their later lines hung half an inch (the filer types the numbers).
heading:
  - {align: center, bold: true, above: 14.95, below: 14.95}
  - {bold: true, hang: 36, above: 14.95, below: 14.95}
  - {bold: true, left: 36, hang: 36, above: 14.95, below: 14.95}
# LR 7.1(f)(1)(A): a memorandum of law of 12,000 words at most (a proportional face); the count the attorney certifies
# (LR 7.1(f)(2)), the sample's `word_count`, over the limit stops the render.
words: {limit: 12000, given: word_count}
# FRCP 10(a), LR 5.2(a): the court's name in bold; the parties in a three-inch column between a rule above and below
# (each party's names, its designation an inch in a line below, "v." three tenths of an inch in, as the exemplar sets
# them); at the right the case number above the title (LR 5.2(a): the case number on the front page above the title),
# the title centered in bold capitals, the rule the motion is under at the right.
front:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - columns:
      - width: 216
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", left: 72, above: 14.95}
                between:
                  - {text: "v.", left: 21.6}
            stroke: {top: 0.75, bottom: 0.75}
            inset: {top: 8, bottom: 8}
      - blocks:
          - {text: "Court File No. {case_number}", left: 7.2, above: 8}
          - {text: "{brief_title}", align: center, bold: true, upper: true, left: 7.2, above: 14.95}
          - {text: "{rule_line}", align: right, optional: true, above: 14.95}
    gutter: 21.6
    above: 29.9
    below: 29.9
# FRCP 11(a): "Dated:" at the left, the signer's lines at the right; kept whole with the last paragraph.
closing:
  - group:
      - columns:
          - {width: 187.2, blocks: [{text: "Dated: {date}"}]}
          - blocks: [{text: "{signature}"}]
        gutter: 14.4
    above: 29.9
# LR 7.1(f)(2): the certificate of compliance, on its own page, executed by the attorney: the word count and the name
# and version of the software that counted it, applied to all text (LR 7.1(f)(1)(C) excludes the caption, the signature
# block and the certificate itself).
after_tail:
  - {break: true}
  - {text: "CERTIFICATE OF COMPLIANCE", align: center, bold: true, below: 14.95}
  - {text: "I hereby certify that this memorandum complies with the word limit of D. Minn. LR 7.1(f)(1)(A) and the type-size requirement of D. Minn. LR 7.1(h)(1). The memorandum contains {xd.words} words, counted with {word_software}, which was applied to include all text, including headings, footnotes, and quotations. The count excludes the caption, the signature block, and this certificate (LR 7.1(f)(1)(C)).", pitch: body, indent: 36}
  - group:
      - columns:
          - {width: 187.2, blocks: [{text: "Dated: {date}"}]}
          - blocks: [{text: "{certificate_signer}"}]
        gutter: 14.4
    above: 29.9
