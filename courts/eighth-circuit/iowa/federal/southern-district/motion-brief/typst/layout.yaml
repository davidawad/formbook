# U.S. District Court for the Southern District of Iowa (iasd): a brief in support of a motion, on the generic FRCP brief
# (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with S.D. Iowa's local rules overlaid here. The shared document model
# sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by `fb engines gen`). Rules: S.D.
# Iowa Local Rules (read 2026-10-14; ../README.md quotes them). The base already meets LR 10(a) (8 1/2 x 11 paper) and
# LR 10(b): double spaced (24 pt at 12 pt), one side, a top margin of at least one inch. LR 10 names no face or size: the
# base's 12 pt, footnotes included, stands. The 20-page limit of LR 7(h) (tables and signature not counted) is not
# machine-checked.
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a), LR 10(d): the court's name, with the division.
constants:
  court: "IN THE UNITED STATES DISTRICT COURT"
  district: "FOR THE SOUTHERN DISTRICT OF IOWA"
# LR 10(b): pages numbered at the bottom; the cover and the tables in lower-case roman (the cover counted and
# printed, i), the body from 1, as the exemplar numbers them.
page_number: {align: center, front: lower-roman, cover: numbered}
# Block quotations single spaced, half an inch in on each side, a single line below.
quote: {left: 36, right: 36, above: 0, below: 12}
# Headings single spaced, a single line above and below: a section centered in bold capitals, unnumbered; the
# argument headings numbered by the template, "I." at the margin, "A." and "1." half an inch further in each, in bold,
# each label in a half-inch box with the title's later lines hung under it (the exemplar's headings).
heading:
  - {align: center, bold: true, upper: true, above: 12, below: 12}
  - {bold: true, number: "I.", label_box: 36, above: 12, below: 12}
  - {bold: true, number: "A.", label_box: 36, left: 36, above: 12, below: 12}
  - {bold: true, number: "1.", label_box: 36, left: 72, above: 12, below: 12}
  - {bold: true, number: "a.", label_box: 36, left: 108, above: 12, below: 12}
# LR 10(d), FRCP 10(a): the court's name and division in bold; the caption in two cells ruled above and below
# (the exemplar's caption table): at the left the parties (each party's names, its designation half an
# inch in, "v." a line from each); at the right the case number, the paper's designation centered in bold capitals and,
# when the filer asks for it, ORAL ARGUMENT REQUESTED (LR 7(c): noted separately in the caption). The cover page,
# before the tables.
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true}
  - columns:
      - width: 234
        blocks:
          - box:
              - each: caption.parties
                blocks:
                  - {text: "{names}"}
                  - {text: "{designation}", left: 36, above: 13.8}
                between:
                  - {text: "v.", above: 13.8, below: 13.8}
            stroke: {top: 0.75, bottom: 0.75}
            inset: {top: 6, right: 10, bottom: 10, left: 5.4}
      - blocks:
          - box:
              - {text: "Case No. {case_number}"}
              - {text: "{brief_title}", align: center, bold: true, upper: true, above: 24}
              - when: oral_argument
                blocks:
                  - {text: "ORAL ARGUMENT REQUESTED", bold: true, above: 24}
            stroke: {top: 0.75, bottom: 0.75}
            inset: {top: 6, right: 5.4, bottom: 10, left: 10}
    above: 24
front: []
# LR 10(b)(4): a brief of more than 10 pages has a subject matter table of contents (after the cover, as the exemplar;
# ../README.md gap 1): the headings with their pages, half an inch in per level.
contents: {title: "TABLE OF CONTENTS", depth: 4, col: 36, hang: 36, step: 36, above: 12}
# The table of authorities (LR 7(d): the authorities relied on), from the `toa:` links of the body and notes, grouped
# as the exemplar groups them, each name (a case name in italics, as the sample writes it), a comma and the citation,
# "passim" for five pages or more.
authorities:
  title: "TABLE OF AUTHORITIES"
  page_heading: "Page(s)"
  passim: 5
  kinds:
    - {kind: case, title: "Cases"}
    - {kind: statute, title: "Statutes"}
    - {kind: rule, title: "Rules"}
    - {kind: other, title: "Other Authorities"}
  col: 56
  hang: 18
  above: 12
  group: {bold: true, above: 12, below: 6}
# LR 11, FRCP 11(a): the date at the margin, then the signature, name, firm, address, telephone and e-mail of each
# lawyer, from the caption's column; kept whole with the last paragraph.
closing:
  - group:
      - {text: "{signature.date}", optional: true}
      - columns:
          - {width: 248.4, blocks: []}
          - blocks:
              - {text: "{signature.lines}"}
        above: 12
    above: 24
