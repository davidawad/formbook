# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the docx render is on the shared layout model
# (lib/*/xengine*, fb-595.68.7) and is reported, not gated: all 12 pages and every page start and end match typst, and
# 289 of 290 lines, but footnote 2 (six lines, at the foot of p7) splits differently: typst keeps two lines of a note
# together at a page end (4 on p7, 2 on p8), LibreOffice ignores widow control in a note (5 and 1). Letting typst
