# Nebraska Supreme Court (neb): appellant's brief (NEB-CONT-003). The whole layout, as data for the shared document model
# (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers trace
# to Neb. Ct. R. App. P. § 2-103 and § 2-109 (../../rules.md, NEB-*); lengths in points. No case text here: every
# string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 12                  # NEB-FORM-006 (§ 2-103(A)(4)): no less than 12 and no more than 13 point, headings included
pitch:
  body: 16.55             # NEB-FORM-004 (§ 2-103(A)(3)): lines spaced at 1.15 (1.15 x Schola's single line, 1.2 x 12 pt)
  single: 16.55           # the same 1.15 for the cover, headings, tables and signature: the rule names no other spacing
margin: {top: 108, bottom: 108, left: 108, right: 108}   # NEB-FORM-003 (§ 2-103(A)(3)): 1.5 inches on all sides
indent: 36
paragraph_gap: 7.2        # NEB-FORM-004: extra line spacing allowed between paragraphs
page_number: {align: center, from: 2}   # NEB-FORM-008 (§ 2-103(C)(2)): the cover is page one, unnumbered; the rest numbered
quote: {left: 36, right: 36, above: 12, below: 12}   # block quotations indented (NEB-FORM-010, as filed)
# NEB-FORM-004: extra space before headings; their form as filed (NEB-FORM-010): sections centred bold, points bold,
# hung under their own number (typed in the text, as filed).
heading:
  - {align: center, bold: true, above: 21.6, below: 12}
  - {bold: true, hang: 36, above: 14.4, below: 10.8}
  - {bold: true, left: 36, hang: 36, above: 13.2, below: 10.8}
  - {bold: true, left: 72, hang: 36, above: 12, below: 9.6}
# NEB-CONT-001, -002 (§ 2-103(C)(1), § 2-109(D)(1)(a)): the cover is the title page: the case number, the court, the
# caption, the proceeding (and judge), the title between rules (NEB-FORM-010, as filed), and counsel at the foot of the
# page.
cover:
  - {text: "{case_number}", align: center, bold: true}
  - {text: "{court_line}", align: center, bold: true, above: 9.6}
  - {rule: 0.5, above: 7.2}
  - each: caption
    above: 7.2
    between:
      - {text: "v.", align: center, above: 3.6, below: 6}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, optional: true}
  - {rule: 0.5, above: 7.2}
  - {text: "{proceeding}", align: center, above: 7.2}
  - {text: "{judge}", align: center, optional: true}
  - {rule: 0.5, above: 7.2}
  - {text: "{brief_title}", align: center, bold: true, above: 7.2}
  - {rule: 0.5, above: 7.2}
  - {fill: 1}
  - each: counsel
    blocks:
      - {text: "{lines}", above: 7.2}
# NEB-CONT-003, -011, -013 (§ 2-109(D)(1)(b), (D)(2), (D)(5)): a table of contents with page references and a table
# of cases, statutes and other authorities with page references.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 36, step: 36, above: 4.2}
authorities:
  title: "Table of Authorities"
  col: 36
  hang: 36
  above: 6
  group: {bold: true, above: 13.2, below: 6}
# The signature block after the conclusion (§ 2-103(C)(1) identifies the filer; its form as filed, NEB-FORM-010): rows
# of an optional label ("By:") and lines, right of centre, a 10.8 pt space (an empty line of that pitch) before each.
closing:
  - {text: "", pitch: 10.8}
  - each: signature
    between:
      - {text: "", pitch: 10.8}
    blocks:
      - columns:
          - {width: 36, blocks: [{text: "{label}", optional: true}]}
          - {blocks: [{text: "{lines}"}]}
        left: 108
# NEB-CERT-001 (§ 2-103(C)(4)): the certificate of compliance on the final page (after the signature, as filed), signed.
tail: {at: "CERTIFICATE", gap: 7.2}
after_tail:
  - each: cert_signature
    above: 12
    blocks:
      - columns:
          - {width: 36, blocks: [{text: "{label}", optional: true}]}
          - {blocks: [{text: "{lines}"}]}
        left: 108
