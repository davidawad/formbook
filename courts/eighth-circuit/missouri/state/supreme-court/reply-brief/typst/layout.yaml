# Supreme Court of Missouri (mo): reply brief (Rule 84.04(g)). The whole layout, as data for
# the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Mo. Sup. Ct. R. 84.03(b), 84.04 and 84.06 (../rules.md, MO-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # MO-FORM-004: not smaller than 13 point, Times New Roman, footnotes included
pitch:
  body: 22.45             # MO-FORM-003: line spacing not less than 1.5 (1.5 x the 14.95 pt single line, to the twip above)
  single: 14.95           # MO-FORM-003: caption, headings, quotations, footnotes, certificates, signature (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MO-FORM-002: not less than one inch on every side
indent: 36
page_number: {align: center, from: 1}   # MO-FORM-001: every page, the cover included, numbered at the bottom
footnote: {size: 13, gap: 6.5}           # MO-FORM-003, -004: footnotes 13 point, single spaced
quote: {left: 36, right: 36, above: 7.8, below: 13}   # MO-FORM-003: quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 15.6, below: 13}
  - {bold: true, hang: 36, above: 13, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
# The cover (MO-FORM-007, as filed): the court, the case number, the parties, the court appealed from and the judge,
# the title, counsel side by side and their role.
cover:
  - {text: "{court_line}", align: center, bold: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 10.8}
  - each: caption
    above: 10.8
    between:
      - {text: "v.", align: center}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, bold: true}
  - {text: "{proceeding}", align: center, above: 7.8}
  - {text: "{judge}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 14.4}
  - columns: {each: counsel, blocks: [{text: "{names}"}, {text: "{lines}"}]}
    gutter: 18
    above: 14.4
  - {text: "{counsel_role}", align: right, bold: true, optional: true, above: 7.8}
# MO-CONT-001 (Rule 84.04(a)(1)): the table of contents and the table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 1, col: 36, hang: 0, above: 9.1}   # hang 0: Word takes a hang as a tab stop, a row shorter than it ("V.") lost its leader
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 5.2
  group: {bold: true, above: 14.3, below: 3.9}
# MO-CERT-002: the closing words, then the signature block, single spaced, never split.
# The last paragraph kept with it (tier 2: a signature page of its own reads as detached).
keep_with_closing: true
closing:
  - group:
      - {text: "{date}", optional: true}
      - {text: "{signature.firm}", left: 230.4, above: 7.8}
      - {text: "{signature.signer}", underline: true, left: 230.4, above: 7.8}
      - {text: "{signature.lines}", left: 230.4}
    above: 28.8
# MO-CERT-001: the certificates open a page after the signature, in the body's form.
tail: {at: "Certificate", break: true, pitch: body, indent: 36}
