# Supreme Court of Missouri (mo): respondent's (answering) brief (Rule 84.04(f)). The whole layout, as data for the
# shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Mo. Sup. Ct. R. 84.03(b), 84.04 and 84.06 (../rules.md, MO-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # MO-FORM-004: not smaller than 13 point, Times New Roman, footnotes included
pitch:
  body: 29.9              # MO-FORM-003: line spacing not less than 1.5; double (2 x the 14.95 pt single line), as filed
  single: 14.95           # MO-FORM-003: caption, headings, quotations, footnotes, certificates, signature (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MO-FORM-002: not less than one inch on every side
indent: 36
page_number: {align: center, from: 1}   # MO-FORM-001: every page, the cover included, numbered at the bottom
footnote: {size: 13, gap: 6.5}           # MO-FORM-003, -004: footnotes 13 point, single spaced
quote: {left: 36, right: 36, above: 7.8, below: 13}   # MO-FORM-003: quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 15.6, below: 13}
  - {bold: true, hang: 36, above: 13, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
  - {bold: true, left: 36, above: 13, below: 10.4}
# The cover (MO-FORM-007, as filed): the case number, the court, the parties, the court appealed from and the judge,
# the title, counsel right of centre.
cover:
  - {text: "No. {case_number}", align: center, bold: true}
  - {text: "{court_lines}", align: center, bold: true, above: 14.4}
  - each: caption
    above: 14.4
    between:
      - {text: "v.", align: center}
    blocks:
      - {text: "{names}", align: center}
      - {text: "{designation}", align: center, below: 3.9}
  - {text: "{proceeding}", align: center, above: 14.4}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 21.6}
  - each: counsel
    above: 21.6
    blocks:
      - {text: "{names}", left: 230.4}
      - {text: "{lines}", left: 230.4}
# MO-CONT-001, MO-CONT-007 (Rule 84.04(a)(1), (f)): a detailed table of contents and table of authorities, each on its
# own page.
contents: {title: "Table of Contents", depth: 2, col: 36, hang: 19.5, step: 19.5, above: 9.1}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 5.2
  group: {bold: true, above: 14.3, below: 3.9}
# MO-CERT-002: the signature block after the conclusion, single spaced, never split; the last paragraph kept with it.
keep_with_closing: true
closing:
  - group:
      - {text: "{date}", left: 230.4, optional: true}
      - {text: "{signature.firm}", left: 230.4, above: 7.8}
      - {text: "/s/ {signature.signer}", underline: true, left: 230.4, above: 7.8}
      - {text: "{signature.lines}", left: 230.4}
    above: 28.8
# MO-CERT-001: the certificate of compliance opens a page after the signature, single spaced, and is signed again
# (as filed: its own signature block, `cert_signature`).
tail: {at: "Certificate", break: true, pitch: single, indent: 36, gap: 13}
after_tail:
  - when: cert_signature
    blocks:
      - group:
          - {text: "{cert_signature.firm}", left: 230.4}
          - {text: "/s/ {cert_signature.signer}", underline: true, left: 230.4, above: 7.8}
          - {text: "{cert_signature.lines}", left: 230.4}
        above: 21.6
