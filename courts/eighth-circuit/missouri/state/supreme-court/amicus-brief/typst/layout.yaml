# Supreme Court of Missouri (mo): amicus curiae brief (Rule 84.05(f)). The whole layout, as data for the shared document
# model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`, fb-595.54.12). Numbers
# trace to Mo. Sup. Ct. R. 84.03(b), 84.04, 84.05(f)(5) and 84.06 (../rules.md, MO-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # MO-FORM-004: not smaller than 13 point, Times New Roman, footnotes included
pitch:
  body: 22.45             # MO-FORM-003: line spacing not less than 1.5 (1.5 x the 14.95 pt single line, to the twip above)
  single: 14.95           # MO-FORM-003: caption, headings, quotations, footnotes, certificates, signature (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MO-FORM-002: not less than one inch on every side
# LaTeX only: the text block 0.1 pt wider than typst's, not the face's 0.05 (tools/fb/src/enginegen/gen.rs latex_bias): typst
# fills p12 line 17 to within hundredths of a point of the 504 pt measure, newtx's per-glyph drift set it a word short.
latex_bias: 0.1
indent: 36
page_number: {align: center, from: 1}   # MO-FORM-001: every page, the cover included, numbered at the bottom
footnote: {size: 13, gap: 6.5}           # MO-FORM-003, -004: footnotes 13 point, single spaced
quote: {left: 36, right: 36, above: 7.8, below: 13}   # MO-FORM-003: quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 15.6, below: 13}
  - {bold: true, above: 13, below: 10.4}
  - {bold: true, italic: true, above: 13, below: 10.4}
# The cover (MO-FORM-007, as filed): the court, the case number, the parties, the court appealed from and the judge,
# the title and the amicus, then counsel right of centre.
cover:
  - {text: "{court_line}", align: center, bold: true}
  - {text: "No. {case_number}", align: center, bold: true, above: 21.6}
  - each: caption
    above: 21.6
    between:
      - {text: "v.", align: center, above: 7.2}
    blocks:
      - {text: "{names}", align: center, bold: true, above: 7.2}
      - {text: "{designation}", align: center, above: 7.2}
  - {text: "{proceeding}", align: center, above: 21.6}
  - {text: "{judge}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 21.6}
  - {text: "{filer}", align: center, bold: true, upper: true, optional: true}
  - {text: "{submitted_by}", left: 230.4, above: 21.6}
  - each: counsel
    blocks:
      - {text: "{names}", left: 230.4, above: 10.4}
      - {text: "{lines}", left: 230.4}
# MO-CONT-001 (Rule 84.04(a)(1), by Rule 84.05(f)(5)): a table of contents and a table of authorities, each on its own
# page.
contents: {title: "Table of Contents", depth: 1, col: 36, hang: 0, above: 9.1}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 5.2
  group: {bold: true, above: 14.3, below: 3.9}
# MO-CERT-002: the signature block after the conclusion, single spaced, never split; the last paragraph kept with it.
keep_with_closing: true
closing:
  - group:
      - {text: "{date}", optional: true}
      - {text: "{signature.lead}", left: 230.4, optional: true, above: 7.8}
      - {text: "/s/ {signature.signer}", underline: true, left: 230.4, above: 7.8}
      - {text: "{signature.lines}", left: 230.4}
    above: 28.8
# MO-CERT-001: the certificate opens a page after the signature, single spaced.
tail: {at: "Certificate", break: true, pitch: single, indent: 36, gap: 13}
