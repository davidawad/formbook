# Supreme Court of Missouri (mo): brief on the merits (appellant's or substitute brief). The whole layout, as data for
# the shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Mo. Sup. Ct. R. 84.03(b), 84.04 and 84.06 (../rules.md, MO-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # MO-FORM-004: not smaller than 13 point, Times New Roman, footnotes included
pitch:
  body: 22.45             # MO-FORM-003: line spacing not less than 1.5 (1.5 x the 14.95 pt single line, to the twip above)
  single: 14.95           # MO-FORM-003: caption, headings, quotations, footnotes, certificates, signature (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MO-FORM-002: not less than one inch on every side
indent: 36
page_number: {align: center, from: 1}   # MO-FORM-001: every page, the cover included, numbered at the bottom
footnote: {size: 13, gap: 6.5}           # MO-FORM-003, -004: footnotes 13 point, single spaced
quote: {left: 36, right: 36, above: 7.8, below: 13}   # MO-FORM-003: quotations single spaced, indented
heading:
  - {align: center, bold: true, upper: true, above: 15.6, below: 13}
  - {bold: true, hang: 36, above: 13, below: 10.4}
  - {bold: true, left: 36, hang: 36, above: 13, below: 10.4}
# The cover (MO-FORM-007, as filed): the case number, the court, the parties, the court appealed from and the judge,
# the title, counsel in two columns.
cover:
  - {text: "No. {case_number}", align: center, bold: true}
  - {text: "{court_line}", align: center, above: 15.6}
  - {text: "{court_name}", align: center, bold: true, size: 18, pitch: 20.7}
  - each: caption
    above: 15.6
    between:
      - {text: "v.", align: center, above: 7.8}
    blocks:
      - {text: "{names}", align: center, above: 7.8}
      - {text: "{designation}", align: center}
  - {text: "{proceeding}", align: center, above: 20.8}
  - {text: "{judge}", align: center, optional: true}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 26}
  - columns:
      - blocks: [{text: "{counsel_left}"}]
      - blocks: [{text: "{counsel_right}"}]
    gutter: 21.6
    above: 72
# MO-CONT-001 (Rule 84.04(a)(1)): a detailed table of contents and a table of authorities, each on its own page.
contents: {title: "Table of Contents", depth: 3, col: 36, hang: 19.5, step: 19.5, above: 9.1}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 5.2
  group: {bold: true, above: 14.3, below: 3.9}
# MO-CERT-002: the signature block after the conclusion, single spaced, never split.
closing:
  - group:
      - {text: "{signature.firm}", left: 230.4}
      - {text: "/s/ {signature.signer}", underline: true, left: 230.4, above: 7.8}
      - {text: "{signature.lines}", left: 230.4}
    above: 28.8
# MO-CERT-001, MO-FORM-003: the certificates open a page after the signature, single spaced.
tail: {at: "CERTIFICATE", break: true, pitch: single, indent: 36, gap: 13}
