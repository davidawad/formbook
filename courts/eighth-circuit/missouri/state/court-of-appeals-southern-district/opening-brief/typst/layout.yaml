# Missouri Court of Appeals, Southern District (moctappsd): appellant's brief. The whole layout, as data for the
# shared document model (lib/typst/xdoc.typ; latex/ and docx/ are generated from this file by `fb engines gen`,
# fb-595.54.12). Numbers trace to Mo. Sup. Ct. R. 84.03 and 84.06 (../../rules.md, MOCTAPPSD-*); lengths in points.
# No case text here: every string printed comes from the sample's frontmatter ({field}) or is a court constant.
size: 13                  # MOCTAPPSD-FORM-004: not smaller than 13 point Times New Roman, footnotes included
pitch:
  body: 22.45             # MOCTAPPSD-FORM-003: line spacing not less than 1.5 (Word's 1.5 lines, 1.5 x 1.15 x 13 pt, to the twip above)
  single: 14.95           # the caption, headings, quotations, footnotes, certificates and signature may be single (1.15 x 13 pt)
margin: {top: 72, bottom: 72, left: 72, right: 72}   # MOCTAPPSD-FORM-002: not less than one inch on every side
indent: 36
page_number: {align: center, from: 1}   # MOCTAPPSD-FORM-001: every page, the cover included, numbered at the bottom
footnote: {size: 13, gap: 7}            # MOCTAPPSD-FORM-003, -004: 13 point, single spaced
quote: {left: 36, right: 36, above: 7.8, below: 13}   # MOCTAPPSD-FORM-003: long quotations may be single spaced
# Section headings centered in capitals, points bold, sub-points bold italic, the fourth level italic and indented
# (MOCTAPPSD-FORM-007: the exemplars' style); single spaced (MOCTAPPSD-FORM-003).
heading:
  - {align: center, bold: true, upper: true, above: 15.6, below: 13}
  - {bold: true, hang: 36, above: 13, below: 10.4}
  - {bold: true, italic: true, hang: 36, above: 13, below: 10.4}
# The cover (page one, MOCTAPPSD-FORM-001; its contents follow the exemplars, MOCTAPPSD-FORM-007): the case number,
# the court between rules, the parties centred with their designations, the proceeding and the title between rules,
# counsel.
cover:
  - {text: "{case_number}", align: center, bold: true}
  - {rule: 0.5, above: 3.9}
  - {text: "{court_lines}", align: center, bold: true, above: 7.2}
  - columns:
      - {width: 70.2, blocks: []}
      - blocks: [{rule: 0.5}]
      - {width: 70.2, blocks: []}
    above: 7.2
  - each: caption
    above: 7.2
    between:
      - {text: "v.", align: center, above: 5.2}
    blocks:
      - {text: "{names}", align: center, above: 5.2}
      - {text: "{designation}", align: center}
  - columns:
      - {width: 70.2, blocks: []}
      - blocks: [{rule: 0.5}]
      - {width: 70.2, blocks: []}
    above: 5.2
  - {text: "{proceeding}", align: center, above: 7.2}
  - {text: "{judge}", align: center, optional: true}
  - {rule: 0.5, above: 3.9}
  - {text: "{brief_title}", align: center, bold: true, upper: true, above: 7.2}
  - {rule: 0.5, above: 7.2}
  - each: counsel
    above: 14.4
    blocks:
      - {text: "{names}", left: 187.2, above: 10.4}
      - {text: "{lines}", left: 187.2}
# The table of contents and the table of authorities, each on its own page (MOCTAPPSD-APP-001: as filed).
contents: {title: "Table of Contents", depth: 2, col: 36, hang: 36, step: 21.6, above: 9.1}
authorities:
  title: "Table of Authorities"
  col: 56
  hang: 36
  above: 9.1
  group: {bold: true, above: 14.3, below: 9.1}
# The date (when given) and the signature block right of centre, never split.
closing:
  - group:
      - {text: "{date}", optional: true}
      - {text: "{signature.firm}", left: 230.4, above: 5.2}
      - {text: "/s/ {signature.signer}", underline: true, left: 230.4, above: 7.8}
      - {text: "{signature.lines}", left: 230.4}
    above: 28.8
# The certificates of service and of compliance (MOCTAPPSD-CERT-001) open a page after the signature, in the body's form.
tail: {at: "Certificate", break: true, pitch: body, indent: 36}
