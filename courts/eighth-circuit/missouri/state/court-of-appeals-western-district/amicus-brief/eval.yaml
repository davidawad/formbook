# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12). Word breaks every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # LaTeX fits a word that ends within hundredths of a point of the right margin where typst does not: a bold level-4
  # heading, page 14 line 13 ("men"). Reported, not gated (docs/open-items/fb-595.54.70.md).
  cross_engine_latex: report
