# Gate 4 CROSS-ENGINE (docs/EVAL-LOOP.md, "Cross-engine gate"): the latex and docx engines are generated from the
# typst template's layout (typst/layout.yaml; `fb engines gen`, fb-595.54.12) and break every line and page where
# the typst render does, so a difference fails.
params:
  cross_engine: gate
  # LaTeX reported, not gated: a shared-model defect outside this folder's layout (fb-595.54.75): lib/latex/xdoc.lua
  # binds the token after "§" in an \mbox, and on p6 that token carries footnote 4 ("§ 84.344.8[^4]"); a footnote
  # inside a box is lost, so LaTeX never sets note 4 and the pages after it move (XENG-002, -003 from p6).
  # docs/open-items/fb-595.54.75.md
  cross_engine_latex: report
