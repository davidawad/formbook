# U.S. District Court for the Western District of Missouri (mowd): suggestions in support of a motion (to dismiss), on
# the generic FRCP brief (lib/layouts/frcp-motion-brief.yaml, fb-595.17) with W.D. Mo.'s local rules overlaid here. The
# shared document model sets it (lib/typst/xdoc.typ; latex/ and docx/ are generated from the merged layout by
# `fb engines gen`). Rules: W.D. Mo. Local Rules (read 2026-10-14; ../README.md quotes them): L.R. 7.0(a) (a motion is
# supported by suggestions), 7.0(d) (supporting suggestions of at most 15 pages, exhibits, signature blocks,
# certificates and statements of fact not counted; over 10 pages a table of contents and a table of authorities, not
# counted), 7.0(e) (a request for oral argument marked on the first page). The local rules set no typeface, margin or
# spacing: the base's letter page and one-inch margins stand. The 15-page limit is not machine-checked.
base: /lib/layouts/frcp-motion-brief.yaml
# FRCP 10(a): the court's name, as the court's own captions set it.
constants:
  court: "UNITED STATES DISTRICT COURT"
  district: "FOR THE WESTERN DISTRICT OF MISSOURI"
# No size rule: 13 pt, between the house standard (12) and the exemplar's 14; double spaced on Word's double in this
# face (29.9 pt), headings, quotations and the signature single spaced (14.95 pt, 1.15 x the type size).
size: 13
pitch: {body: 29.9, single: 14.95}
footnote: {size: 13, gap: 7}
# Pages numbered at the foot: the cover unnumbered, the contents and authorities in lower-case roman (i, ii), the body
# from 1 (L.R. 7.0(d): the tables are not counted).
page_number: {align: center, front: lower-roman}
# Block quotations single spaced, half an inch in from each margin, a single line around them.
quote: {left: 36, right: 36, above: 14.95, below: 14.95}
# Headings single spaced and bold, a single line above them (the double-spaced line after them brings its own space),
# kept with what follows: an argument heading at the margin, a point half an inch in, a sub-point an inch in, its later
# lines at the same indent. The filer types the numbers: an excerpt keeps the filing's own ("I.", "VIII.").
heading:
  - {bold: true, above: 14.95, below: 0}
  - {bold: true, left: 36, above: 14.95, below: 0}
  - {bold: true, left: 72, above: 14.95, below: 0}
  - {bold: true, left: 108, above: 14.95, below: 0}
# FRCP 10(a), 7(b)(2): the cover: the court's name and the division centered in bold; the parties at the left (each
# party's names, its designation an inch and a half in a line below, the filer's "v." or "vs." a line from each); the
# case number beside them, centered on their height; the paper's title centered in bold, a blank double line around the
# caption, a rule under the title (the exemplar's cover, usage/SOURCE.md).
cover:
  - {text: "{xd.court}", align: center, bold: true}
  - {text: "{xd.district}", align: center, bold: true}
  - {text: "{division}", align: center, bold: true, upper: true, optional: true}
  - columns:
      - width: 234
        blocks:
          - each: caption.parties
            blocks:
              - {text: "{names}"}
              - {text: "{designation}", left: 108, above: 14.95}
            between:
              - {text: "{caption.between|v.}", above: 14.95, below: 14.95}
      - valign: center
        blocks:
          - {text: "Case No. {case_number}"}
    gutter: 18
    above: 29.9
    below: 29.9
  - {text: "{title}", align: center, bold: true}
  - {rule: 0.75, above: 14.95}
# L.R. 7.0(d): suggestions over 10 pages have a table of contents: the headings with their pages, half an inch further
# in per level, a wrapped title hung half an inch.
contents: {title: "TABLE OF CONTENTS", style: {align: center, below: 12}, depth: 4, col: 36, hang: 36, step: 36, above: 12}
# L.R. 7.0(d): and a table of authorities, from the `toa:` links of the body: grouped by kind (a case name in italics, as
# the sample writes it), a wrapped citation hung a quarter inch, the pages in the last inch, "passim" for seven pages or
# more.
authorities:
  title: "TABLE OF AUTHORITIES"
  style: {align: center, below: 12}
  passim: 7
  kinds:
    - {kind: case, title: "Cases"}
    - {kind: constitution, title: "Constitutional Provisions"}
    - {kind: statute, title: "Statutes"}
    - {kind: regulation, title: "Regulations"}
    - {kind: rule, title: "Rules"}
    - {kind: other, title: "Other Authorities"}
  col: 72
  hang: 18
  above: 12
  group: {bold: true, above: 12}
front: []
# FRCP 11(a): "Respectfully submitted,", the signer in bold and the lines under the name, in the right half of the
# text width; kept whole with the body's last paragraph, a blank double line above it.
closing:
  - group:
      - {text: "Respectfully submitted,", left: 223.2}
      - {text: "{signature.signer}", bold: true, left: 223.2, above: 12}
      - {text: "{signature.lines}", left: 223.2}
    above: 29.9
# FRCP 5(b): the certificate of service on a page of its own: the court's form of words with the sample's date and
# recipients at the body pitch, the signer in bold at the signature's indent.
after_tail:
  - when: service
    blocks:
      - {break: true}
      - {text: "CERTIFICATE OF SERVICE", align: center, bold: true}
      - {text: "I hereby certify that on {service.date}, I caused a copy of the foregoing document to be sent to all counsel of record via this Court’s CM/ECF system and via electronic mail to {service.recipients}.", pitch: body, indent: 36}
      - {text: "{service.signer}", bold: true, left: 223.2, above: 14.95}
