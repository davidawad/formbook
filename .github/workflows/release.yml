# Numbered releases (fb-595.102): `fb release cut vX.Y.Z` (just release) tags origin/master with generated notes
# and pushes the tag; this publishes the GitHub release from the tag's annotation. 0.x versions are pre-releases.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          test -s notes.md || { echo "$TAG has no annotation: cut it with fb release cut"; exit 1; }
          pre=""
          case "$TAG" in v0.*) pre="--prerelease" ;; esac
          gh release create "$TAG" --title "formbook $TAG" --notes-file notes.md $pre --verify-tag
